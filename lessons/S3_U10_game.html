s a cost and a benefit, and every path ends with something Malika learns."],rule:"Rule of respect: there is no single “right” balance. We discuss Malika’s choices, not our own private lives, and we never judge anyone’s health, family or background."}},Yf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for the speaker’s purpose, attitude and main point, notice the phrases, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Amara, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in compound nouns and phrasal verbs, and /ɜː/ or /ɔː/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer about work–life balance in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for talking about priorities and busy lives. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best tip for a busy week they heard (use the wheel)."]},{id:"game",icon:"🗓",name:"One Busy Week",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Scene reader","Speaker","Speaker","Speaker","Decision recorder"],desc:"Choose Your Path: guide Malika through her first busy week at work, one decision at a time. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team can follow a different path.","Each student turns over one perspective card (Manager, Family Member, Friend, Coach, Planner) and keeps it for the whole game.","Timing: cards 1 min · Before Monday 3 min · The week 10 min (four scenes and an ending) · Look back 4 min.","Only one projector? The teacher shows the scene, teams discuss for one minute, and the class votes. The team with the best reason explains the choice."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping students who work and study, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 10, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract: a reason for calling, an attitude, a main point or a purpose.","Press **Play the podcast**. You hear four short extracts. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, checking meaning, reason, example and making a suggestion.","**Your turn:** listen to Amara, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is A. Nur wants to leave her job.","gives an answer"],["B","Leo asks her that. What does she answer?","challenges politely"],["A","“Not at all! I like it. I just need a better plan.”","checks the text again"],["B","So she likes the job; the problem is her timetable. It’s B.","paraphrases"]],checks:[["How can you hear why somebody is calling?","listen for request and apology phrases: “Sorry, I can’t …”, “Could you …?”, “Have you thought about …?”"],["Which phrase does Leo use to check meaning?","Hang on, are you saying that …?"]]},pron:{ref:"Book: Lesson 10, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the rule: **compound nouns** are usually stressed on the **first** part (*DEADline*); **phrasal verbs** on the **second** part (*switch OFF*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɜː/ or /ɔː/?","Say **both** words. /ɜː/ is long with relaxed lips (*work*). /ɔː/ is long with round lips (*walk*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *deadline*. Which part is strong?",""],["A","*LINE*? It’s the important part.","a first guess"],["T","Not quite. *Deadline* is a compound noun: two words in one. Most compound nouns are stressed on the first part.","the teacher gives the rule"],["B","So *DEADline*, *WORKload*, *OVERtime*!","uses the rule"],["T","Yes! Now listen: *switch off*. It’s a phrasal verb.",""],["A","Then the second part is strong: switch *OFF*.","uses the second rule"],["T","Great. Now /ɜː/ or /ɔː/? Listen: *walk*. First or second: *work* or *walk*?",""],["B","Second: *walk*. My lips are round.","checks the mouth"]],checks:[["Where is the stress in *workload*?","on WORK: WORK-load, like most compound nouns."],["Where is the stress in *switch off*?","on OFF: in phrasal verbs, the second part is usually strong."],["How do you make /ɜː/ in *work*?","make it long and keep your lips relaxed; for /ɔː/ in *walk*, round your lips."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think … you need a plan, because, um, work takes all your time … For example, my cousin, she writes everything in a calendar … So, a plan.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, the key is planning your time. The main reason is that work can fill every evening if you don’t plan. For example, my cousin in Tashkent writes her whole week in one calendar, with time for family and sport. So planning is important.","Attempt 2 · 60 s · linking words"],["aziza","In my view, a good work–life balance is not about having more time, but about planning the time you have. Without a plan, work slowly fills every free evening. My cousin in Tashkent writes her week in one calendar every Sunday, family and sport included, and she protects those hours like meetings. All things considered, balance is something you plan, not something that just happens.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How do you switch off after a busy day?",lines:[["mateo","Well, **I’ve got a lot on my plate** this semester: classes, a part-time job and football. **My top priority is** sleep, so **when I’m under pressure, I** stop work at ten, no matter what. **To switch off, I** play the guitar for half an hour. **The upside is** that I relax completely, **but the downside is** that my neighbours hear everything!","speaker · 1 minute"],["nur","I heard five phrases: *I’ve got a lot on my plate*, *My top priority is*, *When I’m under pressure, I*, *To switch off, I* and *The upside is …, but the downside is*. That’s the top row and more: **Bingo!**","listener reports"],["mateo","Great! Five points plus three for the Bingo: eight points.","count the points"],["nur","Next time, try *I try to set aside time for …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, … we need to choose …*).","Click the lines in order. Each line answers the line before. Amara and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: planning exam week together",lines:[["A","So, exam week is coming. How should we plan our study time?","opens the topic"],["B","How about studying together every afternoon in the library?","an idea"],["A","Nice, but every day is a lot. What about three afternoons and one evening off?","reacts + a new idea"],["B","Agreed. Let’s write it in a shared calendar tonight.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · sample game in section 6",steps:["Make teams of five. Each student turns over one **perspective card** and keeps that role for the whole game.","**Round 1 · Before Monday (3 min):** what should Malika do before her first busy week? Agree on your top three.","**Round 2 · The week (10 min):** one student reads the scene aloud. **Each perspective speaks once.** Then vote, click your option and say why.","Every path has **four scenes** and then an ending. There is no “game over”: every ending shows what Malika learned.","At the ending, answer the reflection question together. Want to see another path? Press **Start again** after the lesson.","**Round 3 · Look back (4 min):** give three pieces of advice to a new employee. One student presents them in one minute."],exTitle:"Sample game: Team Sunrise plays Scene 2",lines:[["","Scene 2 · Tuesday, 11 p.m. — Manager Leo · Family Member Nur · Friend Mateo · Coach Amara · Planner Aziza",""],["aziza","(reads the scene aloud) … Option A: change the slides now. Option B: send a short reply, then switch off. Option C: answer in the morning and ask about the rules.","one student reads the scene and the options"],["leo","**From the company’s point of view,** the client is important, but the message has no deadline. A reply in the morning is fine.","Manager: what it means for the work"],["nur","**Her family would probably feel** uneasy if she works at midnight in her very first week. They want her to do well, but not at any cost.","Family Member: home"],["mateo","**If I were her friend, I’d say:** put the phone down! Answering at 11 p.m. once is OK, but it can easily become a habit.","Friend: what Malika really wants"],["amara","**She needs time to recharge, so** a calm evening now means better work tomorrow.","Coach: energy and rest"],["aziza","**First things first:** a short, friendly reply now, **and then** the changes at nine o’clock tomorrow.","Planner: the next step"],["leo","OK, if the manager knows it will be done, there’s no risk. I can live with B.","the Manager agrees"],["nur","Let’s vote. B: five votes. Mateo, can you explain our choice?","the team votes"],["mateo","**On balance, it makes more sense to** choose B, because the work gets done and Malika can still switch off.","the team clicks B and explains why (C1 phrase)"]],checks:[["How many times does each perspective speak in a scene?","once, before the team votes."],["What does the Coach talk about?","energy, rest and breaks in general, never about anyone’s health."],["Can your team lose the game?","no: every path ends with something Malika learned."]]},drills:{ref:"Book: Lesson 10 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Malika is ___ a new job, an evening course and visits to her family.",o:["juggling","switching off","meeting"],a:0},{q:"The client wants the slides by Friday, so the whole team must ___.",o:["take a break","meet the deadline","make time"],a:1},{q:"After 8 p.m., I ___ my work notifications.",o:["switch off","set","juggle"],a:0},{q:"This month I have ___: three projects and an exam.",o:["quality time","a heavy workload","a deadline balance"],a:1},{q:"Sunday is for ___ with my family: no phones, just lunch and a walk.",o:["quality time","overtime","pressure"],a:0},{q:"If you never say no, it’s hard to ___.",o:["work overtime","meet a deadline","set boundaries"],a:2},{q:"Every Monday she ___: the most important tasks come first.",o:["sets priorities","takes a break","switches off"],a:0},{q:"You’ve been at the computer for three hours. Why don’t you ___?",o:["work overtime","take a break","set priorities"],a:1},{q:"Even in exam week, I always ___ football with my friends.",o:["make time for","switch off","juggle"],a:0},{q:"The night before the deadline, everyone in the office was ___.",o:["in balance","on a break","under pressure"],a:2}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I try to make time for sport. → **my family**",a:"I try to make time for my family."},{p:"I try to make time for my family. → **every weekend**",a:"I try to make time for my family every weekend."},{p:"I try to make time for my family every weekend. → **She**",a:"She tries to make time for her family every weekend. (She → tries, her!)"},{p:"He switches off his phone after 9 p.m. → **a negative**",a:"He doesn’t switch off his phone after 9 p.m."},{p:"He doesn’t switch off his phone after 9 p.m. → **a question: Does …?**",a:"Does he switch off his phone after 9 p.m.?"},{p:"Does he switch off his phone after 9 p.m.? → **Why …?**",a:"Why doesn’t he switch off his phone after 9 p.m.?"},{p:"We met the deadline. → **just**",a:"We’ve just met the deadline. (Just → present perfect!)"},{p:"We’ve just met the deadline. → **a question: Have …?**",a:"Have we just met the deadline?"},{p:"She worked overtime last week. → **this week**",a:"She has worked overtime this week. / She is working overtime this week."},{p:"It’s important to set boundaries. → **at work**",a:"It’s important to set boundaries at work."},{p:"It’s important to set boundaries at work. → **It can be difficult**",a:"It can be difficult to set boundaries at work."},{p:"It can be difficult to set boundaries at work. → **in your first job**",a:"It can be difficult to set boundaries at work in your first job."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I’m very busy at the moment.",a:"I’ve got a lot on my plate at the moment."},{p:"The most important thing for me is my family.",a:"My top priority is my family. / What matters most to me is my family."},{p:"I don’t have time for sport.",a:"I find it hard to make time for sport."},{p:"I always keep Sunday evening for my parents.",a:"I try to set aside Sunday evening for my parents."},{p:"Sorry, I can’t come.",a:"I’d love to, but I’m afraid I can’t come this time."},{p:"Working from home is good, but it’s also bad.",a:"The upside of working from home is …, but the downside is …"},{p:"Maybe we can do both.",a:"Perhaps we could find a middle ground."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I have a lot of works this week.",o:["I have a lot of work this week.","I have many work this week.","I have a lot of a work this week."],a:0,why:"Work (tasks, a job) is uncountable: a lot of work, not works."},{q:"✗ She spends two hours to answer emails every day.",o:["She spends two hours for answering emails every day.","She spends two hours answering emails every day.","She spends two hours answer emails every day."],a:1,why:"spend time + -ing"},{q:"✗ I can’t come tonight. I must to finish my report.",o:["I must finishing my report.","I must finish my report.","I must to finishing my report."],a:1,why:"must + verb without to"},{q:"✗ My manager said me to go home early.",o:["My manager told me to go home early.","My manager said to me go home early.","My manager told to me to go home early."],a:0,why:"tell somebody to do something; say something (to somebody)"},{q:"✗ I didn’t have time for relax.",o:["I didn’t have time for relaxing me.","I didn’t have time to relax.","I didn’t have time relax."],a:1,why:"time to + verb (or time for + noun: time for a break)"},{q:"✗ I work here since September.",o:["I’m working here since September.","I worked here since September.","I’ve worked here since September."],a:2,why:"since + present perfect"},{q:"✗ Can you give me an information about the working hours?",o:["Can you give me some information about the working hours?","Can you give me informations about the working hours?","Can you give me a informations about the working hours?"],a:0,why:"Information is uncountable: some information, a piece of information."},{q:"✗ We usually don’t work in the weekend.",o:["We usually don’t work on weekend.","We usually don’t work at the weekend.","We usually don’t work in weekend."],a:1,why:"British English: at the weekend (American English: on the weekend)."},{q:"✗ I make my homework in the evening.",o:["I do my homework in the evening.","I make the homework in the evening.","I am making homework every evening."],a:0,why:"do homework, do a task; but make a plan, make a decision"}]},{title:"Stress: compound nouns and phrasal verbs",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"noun: the time when work must be finished",o:["DEADline","deadLINE"],a:0,why:"Compound nouns: stress the first part."},{q:"noun: the amount of work you have",o:["workLOAD","WORKload"],a:1,why:"Compound nouns: stress the first part."},{q:"phrasal verb: stop thinking about work",o:["SWITCH off","switch OFF"],a:1,why:"Phrasal verbs: stress the second part."},{q:"noun: a session of exercise",o:["WORKout","workOUT"],a:0,why:"a WORKout (noun), but to work OUT (verb)."},{q:"phrasal verb: do exercise; find an answer",o:["WORK out","work OUT"],a:1,why:"Phrasal verbs: stress the second part."},{q:"noun: extra hours at work",o:["OVERtime","overTIME"],a:0},{q:"noun: a plan of classes or trains",o:["timeTAble","TIMEtable"],a:1}]}],Kf={cardsStep:"Perspective cards",cardsTitle:"Perspective cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. In every scene, speak once from your perspective, then decide together.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Before Monday",lv:"b2",bloom:"Apply",by:"aziza",seconds:60,q:"Malika starts her first job in Tashkent on Monday. She also has an evening course, and her family lives in Navoi. What should she do before Monday to get ready for a busy week? Agree on your top three.",help:{b2:["She should definitely …","It’s a good idea to …, because …","Don’t forget to …"],c1:["It would be wise to …","One thing people often forget is …","If I were her, I’d make sure …"]},model:"Let’s break it down step by step. First, she should definitely put everything on one calendar: work, the course and the trip home. Second, it’s a good idea to tell her family about her new working hours, because then they won’t worry if she calls less often. And one thing people often forget is the simple things. If I were her, I’d prepare clothes and food for the first few days on Sunday, so busy mornings are easier."},{name:"Round 2 · The week",lv:"b2p",bloom:"Analyse / Evaluate",by:"mateo",seconds:0,tool:"path",q:"Read each scene aloud. Each perspective speaks once. Then choose together, click your option and explain why.",help:{b2:["From the company’s point of view, …","Her family would probably feel …","First things first: …, and then …"],c1:["The trade-off here is that …","In the long run, this could …","On balance, it makes more sense to …"]},model:"I’m the Manager, so from the company’s point of view, the slides must be ready, but not at midnight. Amara, our Coach, says Malika needs time to recharge, and that’s true: tired people make more mistakes. Aziza, our Planner, says first things first: a short reply now, and the changes at nine. On balance, it makes more sense to choose option B, because the work gets done and Malika can still switch off."},{name:"Round 3 · Look back",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:90,q:"Next month, a new employee joins your company straight after university. As a team, give three pieces of advice about balancing work and personal life in the first weeks. Use what happened to Malika on your path.",help:{b2:["My main piece of advice is …","Try not to …","Make sure you …"],c1:["Looking back, the key is …","Whatever happens, …","It really pays to …"]},model:"Hold on, let’s base our advice on what actually happened. On our path, Malika’s best moments came after she spoke to people early. So my main piece of advice is to tell your manager about important dates in your very first week. Second, try not to answer every message at night: a short reply in the morning is usually fine. Finally, whatever happens, make time for one thing you love every week, because that’s what gives you energy for work."}],_f=[{e:"💼",n:"The Manager",r:"Keeps the work on track.",lines:[["Your job","Say what each option means for the work, the client and the team."],["Useful phrase","From the company’s point of view, …"]],x:"Be fair: a good manager also wants the team to stay rested and motivated."},{e:"🏡",n:"The Family Member",r:"Speaks for home.",lines:[["Your job","Imagine how Malika’s family might feel about each option."],["Useful phrase","Her family would probably feel …"]],x:"Families want her to succeed at work too: look for a way to have both."},{e:"☕",n:"The Friend",r:"Asks what Malika wants.",lines:[["Your job","Ask what would make Malika happy, not only busy."],["Useful phrase","If I were her friend, I’d say …"]],x:"Remember: good friends also understand a busy week."},{e:"🌿",n:"The Coach",r:"Watches her energy.",lines:[["Your job","Say how each option affects Malika’s energy this week and next week."],["Useful phrase","She needs time to recharge, so …"]],x:"Talk about time, breaks and rest in general, never about anyone’s health."},{e:"🗓️",n:"The Planner",r:"Thinks one step ahead.",lines:[["Your job","Say what Malika should do first, and what comes after."],["Useful phrase","First things first: …, and then …"]],x:"Think about time: tonight, this week, this month."}],$f=[],ep={start:"s1",help:{b2:["If Malika chooses …, she might …","The good thing about … is that …, but …","I’d go for option … because …"],c1:["The trade-off here is that …","In the long run, this could …","On balance, it makes more sense to …"]},scenes:{s1:{title:"Monday: A new job, a full week",text:"Malika Ergasheva, a young graduate from Navoi, has just started her first job as a marketing assistant at a travel company in Tashkent. On Monday morning, her manager, Ms Saidova, gives the team a big task: a presentation for an important client by Friday. Malika also has her evening course in digital marketing on Mondays and Thursdays. And on Saturday, the whole family is meeting in Navoi for her grandmother’s birthday lunch.",q:"How should Malika start her week? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. The good thing about a detailed plan is that Malika can see the whole week at once, but plans often change in a new job. If she talks to Ms Saidova now, she might feel nervous, but her manager will know about the course and the family lunch early. I’d go for option B because it’s easier to set boundaries on day one than on day five.",seconds:60,options:[{label:"A",text:"Make a detailed plan for the week, with time for work, the course and the trip home.",next:"s2a"},{label:"B",text:"Tell Ms Saidova about her course evenings and the family lunch now, so there are no surprises.",next:"s2b"}]},s2a:{title:"Tuesday, 11 p.m.: A message from the boss",text:"Malika’s plan is on the wall above her desk, and Monday went well. But on Tuesday at 11 p.m., her phone lights up. It’s Ms Saidova: “Can you change the colours on slides 4 to 7? The client prefers blue.” There is no deadline in the message. Malika is already in bed, and she has to be at the office at nine. Her flatmate laughs: “Nobody answers work messages at this time!”",q:"What should Malika do about the late message? Which option would you choose, and why?",by:"leo",m:"Hold on, what does the message actually say? There’s no deadline. If Malika chooses A, her manager will be impressed, but she’ll lose sleep, and it could become a habit. The good thing about B is that her manager knows the job will be done, and Malika can still switch off. Option C is honest, but it might feel awkward in her first week. I’d go for option B because it’s polite and it protects her evening.",seconds:60,options:[{label:"A",text:"Get up, change the slides now and reply: “Done!”",next:"s3b"},{label:"B",text:"Reply briefly: “Got it, I’ll do it first thing tomorrow,” then switch off her phone.",next:"s3a"},{label:"C",text:"Answer in the morning, and ask Ms Saidova politely how quickly she needs answers after working hours.",next:"s3c"}]},s2b:{title:"Tuesday: A colleague needs help",text:"Ms Saidova was pleased that Malika told her early: “Thanks for letting me know. Saturday is for your family.” On Tuesday afternoon, Timur, another new employee, comes to Malika’s desk. He is responsible for the budget part of the presentation, and he is completely lost. “Could you stay after work and help me? Just an hour or two?” Tonight, Malika had planned to cook, call her mother and go to bed early.",q:"How should Malika respond to Timur? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? Malika could share a good template with Timur in five minutes. The good thing about staying late is that Timur won’t feel alone, but Malika’s quiet evening disappears. If she chooses B, she protects tonight, but Timur has to wait a day. Option C helps him to learn, but he might feel she doesn’t care. I’d go for option B because tomorrow’s lunch break is a fair middle ground.",seconds:60,options:[{label:"A",text:"Stay after work and help him for two hours.",next:"s3b"},{label:"B",text:"Offer to help him in tomorrow’s lunch break instead.",next:"s3a"},{label:"C",text:"Show him where to find the company templates now, and suggest he asks Ms Saidova for details.",next:"s3c"}]},s3a:{title:"Wednesday: An invitation from an old friend",text:"Malika’s best friend from university, Shahzoda, is in Tashkent for one night only. She sends a message: “Dinner tonight? I haven’t seen you for months!” But the first draft of the presentation is due on Thursday morning, and Malika still has two slides to finish. If she goes to dinner, she will have to work late at night. If she says no, she may not see Shahzoda again for a long time.",q:"Should Malika meet her friend tonight? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: last year I missed a friend’s visit because of an essay, and I still regret it. The good thing about option A is that Malika gets quality time with Shahzoda, but she’ll be under pressure later. If she chooses B, the draft will be ready, but the chance may not come back. The trade-off with C is a shorter meeting, but no stress. I’d go for option C because she can have both.",seconds:60,options:[{label:"A",text:"Go to dinner for two hours, then finish the draft at home.",next:"s4a"},{label:"B",text:"Say no tonight, finish the draft, and plan a long video call at the weekend.",next:"s4b"},{label:"C",text:"Invite Shahzoda for a quick tea near the office in her break, and finish the draft on time.",next:"s4c"}]},s3b:{title:"Wednesday: A very long day",text:"It’s Wednesday, and Malika has slept less every night this week. This morning, she sent an email to the client with the wrong date in it, and she had to send a correction. She is drinking her third coffee, and she still feels slow. The draft is due tomorrow morning, and she also has her course class on Thursday evening. Timur notices and says, “You look tired. Can I help?”",q:"What should Malika do now? Which option would you choose, and why?",by:"mateo",m:"Picture this: Malika at her desk at midnight, writing slide after slide and making more and more mistakes. Not a good picture! If she goes to bed early, she might feel guilty tonight, but tomorrow she’ll work faster. The good thing about Timur’s offer is that a second pair of eyes catches mistakes, but she has to trust a new colleague. Skipping the class gives her time, but she falls behind. I’d go for option B because teamwork saves time.",seconds:60,options:[{label:"A",text:"Go to bed early tonight and get up early to finish the draft.",next:"s4b"},{label:"B",text:"Accept Timur’s offer: he checks her slides while she finishes the last one.",next:"s4c"},{label:"C",text:"Skip Thursday’s course class this week to get more time for work.",next:"s4a"}]},s3c:{title:"Wednesday: A chance of promotion",text:"Ms Saidova calls Malika into her office. “You ask good questions, and you communicate clearly. Next month, we need a project coordinator for a big tourism fair. It’s a great chance to learn, but it means longer days and some Saturdays for about a month.” Malika is excited. But her course finishes next month, and she has promised her parents to visit Navoi more often.",q:"How should Malika respond to the offer? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. If Malika says yes now, she shows ambition, but she will have to juggle the fair, the course and her family. The good thing about asking for details is that she can decide with real information, but her manager might expect a quicker answer. If she says not this time, she finishes her course calmly, but the chance might go to someone else. I’d go for option B because a good decision needs facts.",seconds:60,options:[{label:"A",text:"Say yes straight away: it’s a great chance to grow.",next:"s4a"},{label:"B",text:"Ask for details first: the hours, the training and the dates.",next:"s4b"},{label:"C",text:"Thank Ms Saidova, explain she wants to finish her course first, and ask about the next project.",next:"s4c"}]},s4a:{title:"Saturday: The birthday lunch",text:"Saturday morning: Malika is on the early train to Navoi for her grandmother’s birthday lunch. Then Ms Saidova calls. The client wants three changes to the presentation before Monday morning, and she asks Malika to do them “as soon as possible”. At home, the whole family is waiting: her aunts have been cooking since early morning, and her grandmother has asked everyone to put their phones away during lunch.",q:"What should Malika do about the urgent task? Which option would you choose, and why?",by:"leo",m:"Hold on, what does “as soon as possible” really mean? The deadline is Monday morning. If Malika works on the train and in the afternoon, the job will be done, but she’ll miss part of the celebration. The good thing about option B is that she’s fully present at the lunch, but she must work on Sunday evening. Option C shares the workload, but Timur might not know the client. I’d go for option B because the deadline allows it, and this lunch happens only once.",seconds:60,options:[{label:"A",text:"Work on her laptop on the train and in the afternoon, and join the lunch a little late.",next:"e2"},{label:"B",text:"Call Ms Saidova, explain the situation, and promise the changes by Sunday evening.",next:"e1"},{label:"C",text:"Ask Timur to make the changes today, and offer to do one of his tasks next week.",next:"e4"}]},s4b:{title:"Thursday: Two important evenings",text:"On Thursday morning, Ms Saidova announces a team rehearsal for the client presentation at six o’clock. At exactly the same time, Malika’s course has an online test, and it counts towards her final certificate. The rehearsal matters, because everyone in the team presents one part. The test can be taken on another day only if the course teacher agrees.",q:"How can Malika deal with the clash? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: my sister once asked her boss to move a meeting by one hour, and he said yes immediately. The good thing about option A is that Malika can do both things well, but she has to ask early. If she chooses B, the team sees her commitment, but the teacher might say no. Option C is flexible, but the team practises without her. I’d go for option A because a polite question often solves a clash.",seconds:60,options:[{label:"A",text:"Ask Ms Saidova if she can rehearse her part at lunchtime, then leave on time for the test.",next:"e1"},{label:"B",text:"Go to the rehearsal and ask her course teacher if she can take the test another day.",next:"e2"},{label:"C",text:"Take the test, then rehearse with the team online from home afterwards.",next:"e4"}]},s4c:{title:"Sunday: A day of her own",text:"It’s Sunday, Malika’s only free day this week. Her flatmates are going for a picnic in the park and invite her to come. She also has course homework due on Monday evening, a pile of washing and a promise to call her parents. Her phone is quiet: there are no messages from work. For the first time this week, the decision is completely hers.",q:"How should Malika spend her Sunday? Which option would you choose, and why?",by:"mateo",m:"Picture this: Malika on the grass in the park, laughing with her flatmates, her phone in her bag. Wonderful! But on Monday, the homework is still waiting. If she chooses A, she gets both rest and progress. The good thing about B is that she can really switch off, but the new week might start in a rush. Option C gives her a calm Monday, but less time in the park. I’d go for option A because it’s a balance, not a sacrifice.",seconds:60,options:[{label:"A",text:"Do her homework in the morning, then join the picnic in the afternoon.",next:"e3"},{label:"B",text:"Keep the whole day free: the picnic, a long call home, no laptop.",next:"e3"},{label:"C",text:"Prepare for Monday in the morning, call her parents, and join the picnic later.",next:"e1"}]},e1:{end:!0,title:"Ending: The clear communicator",text:"By the end of the week, the presentation is a success, and Malika has kept her promises at home too. She has learned that most clashes are easier to solve when people know about them early. A short, polite message, like “I can do it by Sunday evening” or “I have a class on Thursday”, saved her from many difficult evenings. Ms Saidova now asks the whole team to share their important dates at the start of each month.",q:"What did Malika learn on your path? Which of your team’s choices helped her most, and why?",by:"aziza",m:"Let’s break it down step by step. Malika learned that clear communication is the key to a good work–life balance. On our path, the choice that helped most was talking to her manager early, because it gave everyone time to plan. In the long run, this could make her a better colleague and, one day, a better manager."},e2:{end:!0,title:"Ending: Ambition and its price",text:"Malika’s week is a big success at work. The client loves the presentation, and Ms Saidova thanks her in front of the team. But some things she cares about had to wait: a family moment, a class, an evening of rest. Malika learns that saying yes to everything can work for a week, but not for a whole year. Next week, she wants to choose her yeses more carefully.",q:"What did Malika learn on your path? Would you change one of your team’s choices now? Why or why not?",by:"mateo",m:"Picture this: Malika hears “Well done!” from her manager, and that feels great. But she also learned that every yes to work is a no to something else. If we played again, I’d change one choice and protect one evening just for her. The trade-off was success now against energy later, and in the long run, she needs both."},e3:{end:!0,title:"Ending: People first",text:"Malika ends the week tired but happy. She has spent quality time with her friends and family, and she has made time for herself too. Her week at work was not perfect: some tasks took longer than she hoped, and her inbox is full on Monday morning. Still, she starts the new week with energy. She learns that balance doesn’t mean fifty-fifty every day: some weeks, work needs more; other weeks, people do.",q:"What did Malika learn on your path? How can a person make time for friends and family in a busy week?",by:"amara",m:"Let me give you a real example from our path: every time Malika chose people over one more hour of work, she came back with more energy. She learned that rest is part of doing a job well. To make time for friends in a busy week, I’d plan one fixed evening and protect it like a meeting. In the long run, that habit keeps work and life in balance."},e4:{end:!0,title:"Ending: Stronger together",text:"Malika discovers that she doesn’t have to do everything alone. When she and Timur shared tasks, they both finished faster, and the presentation was better because two people checked it. Ms Saidova notices that the new employees help each other, and she asks them to write a short guide for the next new staff. Malika learns that asking for help is a skill, not a weakness.",q:"What did Malika learn on your path? What should a good team do when one person has too much work?",by:"nur",m:"What if technology could help here? A shared online planner would show everyone’s workload at a glance. On our path, Malika learned that sharing the load is fair and efficient. When one person has too much work, a good team should notice it, offer help and take turns. In the long run, this builds trust, and trust makes every busy week easier."}}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"How can young people find a good balance between work and personal life?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** the key to a good work–life balance is not having more time, but planning the time you have."],["Point","**The main reason is that** without a plan, work slowly fills every free evening and weekend."],["Example","**For example,** my cousin in Tashkent writes her whole week in one calendar every Sunday, and she protects her family and sport time like meetings."],["Close","**So, all things considered,** balance is something you plan, not something that just happens."]],keys:["in my view","plan your time","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Should employees answer work messages in the evening?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say not usually, **although** there are some exceptions."],["","**First of all,** people need time to switch off, or they come back to work tired and less creative."],["","**For instance,** one short message at 11 p.m. can keep someone thinking about work for the rest of the night."],["","**However,** in a real emergency, a quick answer can save the whole team a lot of problems."],["","**That’s why** many teams agree on clear rules about which messages are urgent and which can wait."],["","**In short,** evenings should belong to people, and only real emergencies should break that rule."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"What can employers do to help their staff have a better work–life balance?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think employers can do a lot, and the best ideas are often the simplest ones."],["","To begin with, flexible hours let people start earlier or later when they have family duties."],["","On top of that, managers can set an example by not sending messages late at night."],["","Let me give you a real example: in the office where my aunt works in Lagos, nobody books meetings after four o’clock on Fridays."],["","That said, employees also need to set their own boundaries and say when they have too much work."],["","So, in a nutshell, a good balance is a shared job for the company and for every person in it."]],extra:"My favourite place for lunch is a small café near the university library.",keys:["flexible hours","set an example","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it a good idea to work while you are studying at university?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think a part-time job can be a great idea, as long as your studies come first."],["The main reason is that","you learn skills that no lecture can teach, like dealing with customers and managing your time."],["For instance,","a friend of mine in Recife works at a hotel reception at weekends, and her English has improved enormously."],["Having said that,","too many hours can leave you with no time to study or rest."],["That’s why","it’s important to agree on clear working hours with your employer from the start."],["Ultimately,","a job should support your studies, not replace them."]],distractors:["In contrast,","Similarly,"],keys:["studies come first","manage your time","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"What is the best way to switch off after a busy day?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["it depends on the person","leave work at work","do something with your hands","for instance","the same time every day"],model:"I’d say it depends on the person, but for most people the first step is to leave work at work: close the laptop and turn off the notifications. It also helps to do something with your hands, like cooking, drawing or fixing something, because it moves your mind away from the screen. For instance, after a long day of online classes, I cook a simple Malaysian dish and call my sister. Finally, try to stop working at the same time every day, so your mind knows when the working day is over."}],np={title:"Exam Part 2 practice: helping students who work and study",situation:"Many students at your university in Navoi have part-time jobs. The student council can offer only one thing to help them: a quiet study room that is open late, a free short course on time management, or flexible deadlines for students who work. Amara and Mateo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"amara",B:"mateo",lines:[["A","So, how can we help students who work and study? Shall we start with the late study room?"],["B","Sure. It sounds useful, but won’t most students be too tired to study late after a shift?"],["A","Fair point. Sorry, do you mean that the room might stay empty?"],["B","Partly, yes. What they really need is more time, not just a place to study."],["A","I see. What about the course on time management? It could help everyone plan their week."],["B","I like that. It’s less flexible than special deadlines, but it teaches a skill for life, doesn’t it?"],["A","True. Flexible deadlines help, but some lecturers might think they’re unfair to others."],["B","So, shall we go for the course, and open the study room late only during exams?"],["A","Agreed. Then students learn to plan, and they still have a quiet place at exam time."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, doesn’t it?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: your group has a big project due in two weeks, and everyone also has work or family duties. Choose **one** way to share the load: a shared online planner, a weekly one-hour meeting, or personal tasks with mini-deadlines. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["My top priority is …","I’ve got a lot on my plate.","To switch off, I …","When I’m under pressure, I …","The upside is …, but the downside is …","I try to set aside time for …","It’s all about balance.","I find it hard to make time for …","On balance, …"],B:["I find it hard to make time for …","What matters most to me is …","It’s all about balance.","I’d love to, but …","My top priority is …","Perhaps we could find a middle ground.","To switch off, I …","I’ve got a lot on my plate.","When I’m under pressure, I …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["My top priority is …","What matters most to me is …","I’ve got a lot on my plate.","I find it hard to make time for …","I try to set aside time for …","When I’m under pressure, I …","The upside is …, but the downside is …","I’d love to, but …","Perhaps we could find a middle ground.","It’s all about balance.","On balance, …","To switch off, I …"],questions:["How do students in Uzbekistan juggle study, family and part-time work?","What do you do to switch off after a busy day?","Should managers send messages to their team late at night? Why or why not?","Which matters most at the start of a career: money, experience or free time? Why?","How can friends support each other during a busy exam week?","What makes a perfect free weekend for you, and why?"]},sp=[{type:"stress",title:"Stress Spot: compound nouns and phrasal verbs",intro:"Tap the stressed syllable. Rule: compound nouns are usually stressed on the first part (DEADline). Phrasal verbs are usually stressed on the second part (switch OFF). Then listen and say the word.",follow:"Now use one compound noun and one phrasal verb in a sentence about Malika’s busy week.",items:[{w:"deadline",syl:["dead","line"],s:0},{w:"workload",syl:["work","load"],s:0},{w:"overtime",syl:["o","ver","time"],s:0},{w:"timetable",syl:["time","ta","ble"],s:0},{w:"switch off",syl:["switch","off"],s:1},{w:"workplace",syl:["work","place"],s:0},{w:"catch up",syl:["catch","up"],s:1},{w:"work out",syl:["work","out"],s:1}]},{type:"pairs",title:"Sound Pairs: /ɜː/ or /ɔː/?",intro:"Press Play and choose the word you hear. /ɜː/ is long, with relaxed lips (work, firm, shirt). /ɔː/ is long, with round lips (walk, form, short). Uzbek has no sound like /ɜː/, so work and walk can easily sound the same. Partner version: one student says a word, the partner points to it.",pairs:[["work","walk"],["firm","form"],["shirt","short"],["fur","four"],["bird","board"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: switch off, set boundaries or make time for.","Describe how Malika feels at this moment in two sentences."],ip={title:"Step Up Speaking Club: Too Much on My Plate",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Nur and Leo talk about busy weeks, work and free time. Each extract is a different situation.",tip:["Listen for the purpose","Some questions ask *why* a person is speaking: to apologise, to ask for help, to give advice. Listen for phrases like *Sorry, I can’t …*, *Could you …?* and *Have you thought about …?*"],A:"nur",B:"leo",lines:[["A","*Extract 1.* Hi Leo, it’s Nur. Sorry, I can’t join our Club call tonight. This week I’m **juggling** my course, my translation job and my family’s catering business, and I have to **meet a deadline** on Friday. Could you tell the others? I’ll send my notes tomorrow."],["B","*Extract 2.* Nur, you sound exhausted. Is it the job?"],["A","Partly. I have **a heavy workload**, and I’m always **under pressure**. Last month I **worked overtime** every week. [[0]] the job isn’t the problem. I am: I never stop."],["B","[[1]] you want to give up the job?"],["A","Not at all! I like it. I just need a better plan."],["B","*Extract 3.* My sister in Hamburg used to read work emails on holiday. Now her company has a simple rule: no work messages after six. [[2]] tired people make more mistakes, so everybody gains. She says that now she really **switches off** at weekends."],["A","*Extract 4.* My better plan? I learnt it from Aziza. [[3]] her family in Navoi: on Sundays, no laptops, just a long lunch, a walk and **quality time** together. So now I **set boundaries**. Every Monday I **set priorities** for the week, I **take a break** every two hours, and I **make time for** badminton twice a week. [[4]] trying it, Leo? A good **work–life balance** doesn’t just happen: you have to plan it."]],gaps:[[1,"The way I see it,"],[2,"Hang on, are you saying that"],[3,"This is partly because"],[4,"A perfect example is"],[5,"Have you thought about"]],questions:[{q:"Extract 1. Why is Nur calling Leo?",o:["to say that she can’t join the Club call","to ask him to help with a translation","to invite him to her family’s business"],a:0,why:"“Sorry, I can’t join our Club call tonight … Could you tell the others?”"},{q:"Extract 2. What is Nur’s attitude to her job?",o:["She wants to leave it as soon as possible.","She likes it, but she needs to organise her time better.","She thinks her manager gives her too much work."],a:1,why:"“Not at all! I like it. I just need a better plan.”"},{q:"Extract 3. What is Leo’s main point?",o:["His sister should find a new job.","Emails are not important in Hamburg.","A clear rule at work can help people protect their free time."],a:2,why:"“No work messages after six … She says that now she really switches off at weekends.”"},{q:"Extract 4. Why does Nur talk about Aziza’s family?",o:["to show where the idea for her new plan came from","to complain that she can’t visit Navoi","to explain why she works on Sundays"],a:0,why:"“My better plan? I learnt it from Aziza. A perfect example is her family in Navoi …”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Leo use to check meaning, and which one does Nur use to make a suggestion?",groups:[["Opinio
