qwMe8izDHxo9QepG463HRoA0t5PaHwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Wf={code:"S3_U16",semester:3,unit:16,title:"Comfort Zone: Growth Beyond Limits",subtitle:"Why Should We Step Out of Our Comfort Zone?",module:3,stage:"Stage 2 · EXTEND",level:"B2+",sioLevel:2,hero:{tags:[["b2","B2+"],["c1","C1 stretch"],["bl","Bloom: Analyse → Evaluate"]],title:"The Challenge Week",paras:["Sevara Tursunova, a second-year student of English in **Navoi**, is clever, hard-working and quiet. She writes excellent essays, but she prefers listening to speaking, and she likes to know exactly what will happen next.","This week, one invitation after another could take her **out of her comfort zone**. Your team decides what Sevara does at **four key moments**. Saying yes is not always right, and saying no is not always weak: every option has a cost and a benefit, and every path ends with something Sevara learns."],rule:"Rule of respect: everyone’s comfort zone is different. We never laugh at fear, we discuss Sevara’s choices rather than our own private worries, and no decision is based on anyone’s health or looks."}},Vf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Two Club speakers on the podcast (exam Part 3): who says what? Notice how they check meaning and agree only up to a point, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read statements 1–4 first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Amara, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The text is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in adjectives for feelings, and /e/ or /eɪ/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about comfort zones in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for talking about challenges and fear. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group retells the bravest story they heard (use the wheel)."]},{id:"game",icon:"🧗",name:"The Challenge Week",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Scene reader","Speaker","Speaker","Timekeeper","Decision recorder"],desc:"Choose Your Path: guide Sevara through a week of invitations that stretch her, one decision at a time. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team can follow a different path.","Each student turns over one perspective card (Brave One, Careful One, Coach, Friend, Future Self) and keeps it for the whole game.","Timing: cards 1 min · Comfort map 3 min · The week 10 min (four scenes and an ending) · Look back 4 min.","Only one projector? The teacher shows the scene, teams discuss for one minute, and the class votes. The team with the best reason explains the choice."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping shy first-year students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 16, section 2 · Listen and Notice",steps:["**Before you listen:** read statements 1–4 and guess who probably said each one: Aziza, Leo or both of them.","Press **Play the podcast**. The speakers agree on some things and not on others: listen for _Fair enough_ and _up to a point, but_. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking meaning and agreeing up to a point.","**Your turn:** listen to Amara, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Number 2 is Aziza. She was terrified before her presentation.","gives an answer"],["B","True. But was Leo calm on his first evening?","challenges politely"],["A","No: “I felt out of my depth.” And he has never liked heights.","checks the text again"],["B","So they were both nervous. It’s C.","paraphrases"]],checks:[["How can you tell that a speaker only partly agrees?","listen for “I agree up to a point, but …”, “Not exactly …” or “Fair enough, but …”: the real view comes after “but”."],["Which phrase does Aziza use to check meaning?","Sorry, are you saying that …?"]]},pron:{ref:"Book: Lesson 16, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: endings like **-ous**, **-ent** and **-ed** are never stressed (*NERvous*, *CONfident*). In words ending in **-ic**, the syllable just before *-ic* is strong (*enthusiASTic*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /e/ or /eɪ/?","Say **both** words. /e/ is short and stays the same (*get*). /eɪ/ moves: start with /e/ and glide to /ɪ/ (*gate*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *embarrassed*. Which syllable is strong?",""],["A","*RASSED*? It’s at the end.","a first guess"],["T","Not quite. The ending *-ed* is never stressed. Try again.","the teacher gives a clue"],["B","em-*BAR*-rassed! And *de-TER-mined* works the same way.","uses the rule"],["T","Great. Now a long one: *enthusiastic*.",""],["A","It ends in *-ic*, so the syllable before it: enthusi-*AS*-tic.","uses the second rule"],["T","Yes! Now /e/ or /eɪ/? Listen: *late*. First or second: *let* or *late*?",""],["B","Second: *late*. My mouth moves.","checks the mouth"]],checks:[["Where is the stress in *confident*?","on CON: CON-fi-dent. The ending *-ent* is never stressed."],["Where is the stress in *enthusiastic*?","on AS: en-thu-si-AS-tic, just before *-ic*."],["What is the difference between *get* and *gate*?","*get* has a short /e/ that stays the same; *gate* has /eɪ/, a sound that moves from /e/ to /ɪ/."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it answers the question directly (*I’d say …*).","Follow the linking words: *To begin with* (a first reason) → *Take my own case* (an example) → *On the other hand* (the other side) → *This is why* (a result) → *All in all* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, I think … yes, mostly … because, um, you learn things … For example, my climbing course … But not always, if it’s dangerous … So, yes and no.","Attempt 1 · 90 s · many pauses"],["leo","I’d say it usually is a good idea, even though not every challenge is worth taking. To begin with, we don’t learn much when everything is easy. Take my own case: my climbing course gave me confidence. On the other hand, some risks are not sensible. All in all, step out, but think first.","Attempt 2 · 60 s · linking words"],["leo","I’d say it usually is, even though not every challenge is worth taking. We rarely grow when everything feels familiar: my climbing course, for instance, gave me a confidence I now use in every exam. That said, saying yes to everything can simply wear you out. All in all, step out of your comfort zone often, but bring your judgement with you.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What is something new you tried, and how did it go?",lines:[["mateo","Last summer I joined a dance class, and honestly, **it was well outside my comfort zone**. **I was nervous at first, but** the teacher was so patient. **I decided to give it a go** anyway, and **it turned out to be** the best part of my week. **Looking back, I’m glad I** didn’t give up after the first lesson, when I **felt out of my depth**!","speaker · 1 minute"],["amara","I heard six phrases: *outside my comfort zone*, *I was nervous at first, but*, *I decided to give it a go*, *It turned out to be*, *Looking back, I’m glad I* and *I felt out of my depth*. That’s a full row: **Bingo!**","listener reports"],["mateo","Six points plus three for the Bingo: nine points!","count the points"],["amara","Next time, try *It took a lot of nerve to …*. It’s on my card, and it’s a great C1 phrase.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which idea …?*).","Click the lines in order. Each line answers the line before. Nur and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: choosing a class challenge",lines:[["A","So, which challenge should our class try this month?","opens the topic"],["B","What about a short talk in English for every student?","an idea"],["A","Brave, but maybe too big for some. How about talks in small groups first?","reacts + a new idea"],["B","Fair enough. Small groups this month, the whole class next month.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make teams of five. Each student turns over one **perspective card** and keeps that role for the whole game.","**Round 1 · Comfort map (3 min):** what is inside a student’s comfort zone, what is at the edge, and what feels too far for now? Agree on two examples for each.","**Round 2 · The week (10 min):** one student reads the scene aloud. **Each perspective speaks once.** Then vote, click your option and say why.","Every path has **four scenes** and then an ending. Saying no is allowed: there is no “game over”, and every ending shows what Sevara learned.","At the ending, answer the reflection question together. Want to see another path? Press **Start again** after the lesson.","**Round 3 · Look back (4 min):** choose Sevara’s most useful step and her wisest decision, then plan her next challenge. One student presents it in one minute."],exTitle:"Sample game: Team Summit plays Scene 1",lines:[["","Scene 1 · Monday — Brave One Amara · Careful One Leo · Coach Aziza · Friend Mateo · Future Self Nur",""],["mateo","(reads the scene aloud) … Option A: say yes and practise every evening. Option B: offer the short closing summary. Option C: write the arguments, but don’t speak.","one student reads the scene and the options"],["amara","**This could be a real chance to** show everyone how good her ideas are. Her arguments are the best in the group!","Brave One: what she could gain"],["leo","**Before she decides, she should think about** the whole week. Opening a debate is a big job, and practising every evening takes a lot of time.","Careful One: the cost and the risk"],["aziza","**A good first step would be to** practise only the first minute, in front of two friends. After that, the rest feels much easier.","Coach: one small step"],["mateo","**Knowing Sevara, I think she’d** feel proud on stage, but only if she doesn’t feel pushed into it.","Friend: what she really wants"],["nur","**A year from now, she’ll be glad she** spoke, even for one minute. Nobody remembers a perfect speech, but she’ll remember that she tried.","Future Self: looking back"],["leo","Fair enough. With a short part and notes, the risk is much smaller. I can live with B.","the Careful One agrees"],["aziza","Let’s vote. B: four votes, A: one. Amara, can you explain our choice?","the team votes"],["amara","**On balance, the wiser choice is** B: it’s a real step out of her comfort zone, and she has a fair chance to succeed.","the team clicks B and explains why (C1 phrase)"]],checks:[["How many times does each perspective speak in a scene?","once, before the team votes."],["Is saying no a wrong answer?","no: every option has a cost and a benefit, and a thoughtful no can be a good choice."],["What does the Coach talk about?","practice, preparation and small steps, never anyone’s health."]]},drills:{ref:"Book: Lesson 16 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Speaking in front of the whole faculty is a big step for Sevara: it takes her right out of her ___.",o:["comfort zone","learning curve","horizons"],a:0},{q:"The first week of the new job was hard. It was a steep ___.",o:["challenge","learning curve","risk"],a:1},{q:"He was scared of heights, but he decided to ___ and joined the climbing course.",o:["face his fears","make mistakes","gain experience"],a:0},{q:"Applying for the summer school was a risk, but she decided to ___.",o:["give it a go","feel out of her depth","push herself back"],a:0},{q:"In my first advanced class, everyone spoke so fast that I ___.",o:["rose to the challenge","felt out of my depth","built confidence"],a:1},{q:"Living with students from other countries really ___.",o:["took a risk","broadened my horizons","made mistakes"],a:1},{q:"Volunteering at the festival helped me ___ in organising events.",o:["gain experience","step out","give a go"],a:0},{q:"Don’t worry if you ___: that’s how everyone learns a language.",o:["make mistakes","do mistakes","take mistakes"],a:0},{q:"The project was much harder than we expected, but the whole team ___.",o:["rose to the challenge","felt out of its depth","broadened its horizons"],a:0},{q:"Every short talk in class helps shy students to ___ little by little.",o:["take a risk","build confidence","push the challenge"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I decided to give it a go. → **She**",a:"She decided to give it a go."},{p:"She decided to give it a go. → **a negative**",a:"She didn’t decide to give it a go. / She decided not to give it a go."},{p:"I’m afraid of speaking in public. → **He**",a:"He’s afraid of speaking in public. (He → is!)"},{p:"He’s afraid of speaking in public. → **used to be**",a:"He used to be afraid of speaking in public."},{p:"He used to be afraid of speaking in public. → **a question: Did …?**",a:"Did he use to be afraid of speaking in public? (Did → use, without -d!)"},{p:"I’m not used to speaking English with strangers. → **She**",a:"She isn’t used to speaking English with strangers."},{p:"She isn’t used to speaking English with strangers. → **getting**",a:"She’s getting used to speaking English with strangers."},{p:"I’ve never performed on stage. → **before**",a:"I’ve never performed on stage before."},{p:"I’ve never performed on stage before. → **a question: Have you ever …?**",a:"Have you ever performed on stage before?"},{p:"If I join the club, I’ll meet new people. → **If she …**",a:"If she joins the club, she’ll meet new people. (If + present, not will!)"},{p:"If she joins the club, she’ll meet new people. → **an unreal situation: If she joined …**",a:"If she joined the club, she would meet new people."},{p:"If she joined the club, she would meet new people. → **the past: If she had joined …**",a:"If she had joined the club, she would have met new people."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Speaking in public is very difficult for me.",a:"Speaking in public is well outside my comfort zone."},{p:"I was afraid, but I did it.",a:"It took a lot of nerve, but I went through with it."},{p:"I tried it.",a:"I decided to give it a go."},{p:"It was very hard at the beginning.",a:"It was a steep learning curve."},{p:"I learned a lot from it.",a:"It was a real eye-opener."},{p:"I’m not ready to do it yet.",a:"I’d rather build up to it gradually."},{p:"Maybe it will go badly.",a:"What’s the worst that could happen?"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I am afraid from public speaking.",o:["I am afraid for public speaking.","I am afraid of public speaking.","I am afraid about public speaking."],a:1,why:"afraid of + noun or -ing: afraid of heights, afraid of speaking"},{q:"✗ I want to get more experiences in speaking English.",o:["I want to get more experience in speaking English.","I want to get many experience in speaking English.","I want to get an experience in speaking English."],a:0,why:"Experience (skill, knowledge) is uncountable. An experience (countable) is one event: Climbing was an amazing experience."},{q:"✗ I’m not used to speak in front of people.",o:["I’m not used to speaking in front of people.","I’m not use to speak in front of people.","I don’t used to speaking in front of people."],a:0,why:"be used to + -ing (= be familiar with something)"},{q:"✗ She made a risk and applied for the summer school.",o:["She did a risk and applied for the summer school.","She took a risk and applied for the summer school.","She had a risk and applied for the summer school."],a:1,why:"take a risk (not make or do)"},{q:"✗ The lecture was so long that I was very boring.",o:["The lecture was so long that I was very bored.","The lecture was so boring that I was very boring.","The lecture was so long that I was very bore."],a:0,why:"-ed = how a person feels (bored); -ing = what causes the feeling (a boring lecture)"},{q:"✗ Can you explain me the rules of the game?",o:["Can you explain to me the rules of the game?","Can you explain the rules of the game to me?","Can you explain me about the rules of the game?"],a:1,why:"explain something to somebody (not explain somebody something)"},{q:"✗ If I will join the debate club, I’ll speak better.",o:["If I join the debate club, I’ll speak better.","If I would join the debate club, I’ll speak better.","If I joining the debate club, I’ll speak better."],a:0,why:"After if, use the present simple for the future: If I join …, I’ll …"},{q:"✗ I have never been in abroad.",o:["I have never been to abroad.","I have never been abroad.","I have never been at abroad."],a:1,why:"abroad is an adverb: go abroad, study abroad (no preposition)"},{q:"✗ Everybody were nervous before the talent evening.",o:["Everybody was nervous before the talent evening.","Everybody are nervous before the talent evening.","Everybody have been nervous before the talent evening."],a:0,why:"everybody, everyone, nobody + singular verb (was, is, has)"}]},{title:"Stress: adjectives for feelings",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"feeling worried before something important",o:["NERvous","nerVOUS"],a:0,why:"The ending -ous is never stressed."},{q:"sure of yourself and your abilities",o:["conFIdent","CONfident"],a:1,why:"The ending -ent is never stressed."},{q:"feeling silly in front of other people",o:["emBARrassed","EMbarrassed"],a:0},{q:"having made a firm decision to do something",o:["DEtermined","deTERmined"],a:1},{q:"happy to try new and exciting things",o:["adVENturous","ADventurous"],a:0},{q:"very interested and excited about something",o:["enTHUsiastic","enthusiASTic"],a:1,why:"Words ending in -ic stress the syllable just before -ic."},{q:"not relaxed; a little worried or embarrassed",o:["unCOMfortable","uncomFORTable"],a:0,why:"Like COMfortable: the prefix un- does not move the stress."}]}],Jf={cardsStep:"Perspective cards",cardsTitle:"Perspective cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. In every scene, speak once from your perspective, then decide together.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Kf=[{name:"Round 1 · Comfort map",lv:"b2p",bloom:"Understand / Analyse",by:"nur",seconds:90,q:"Draw a quick comfort map for a typical university student: what is **inside** the comfort zone, what is **at the edge** (exciting, but a little scary), and what feels **too far** for now? Agree on two examples for each part, then explain one of them.",help:{b2:["… is inside most students’ comfort zone, because …","… is at the edge: it’s exciting, but …","For now, … feels too far, because …"],c1:["For many students, … is well within their comfort zone.","… pushes people slightly out of their comfort zone, which is exactly why …","What feels routine for one person can be daunting for another."]},model:"For most students I know, chatting with friends and studying alone in the library are well within their comfort zone. At the edge, I’d put asking a question in a big lecture and joining a club where you don’t know anyone: exciting, but a little scary. And for now, giving a speech to the whole university might feel too far for many people. That said, what feels routine for one person can be daunting for another, so every map is personal."},{name:"Round 2 · The week",lv:"b2p",bloom:"Analyse / Evaluate",by:"amara",seconds:0,tool:"path",q:"Read each scene aloud. Each perspective speaks once. Then choose together, click your option and explain why.",help:{b2:["This could be a real chance to …","Before she decides, she should think about …","A good first step would be to …"],c1:["It’s a risk worth taking, because …","The trade-off here is that …","On balance, the wiser choice is …"]},model:"I’m the Brave One, so I say this could be a real chance to show what Sevara can do. But Leo, our Careful One, reminds us that she has a lot on this week, and that’s fair. Aziza, our Coach, suggests a good first step: practise only the first minute with two friends. The trade-off here is courage against energy. On balance, the wiser choice is option B, because it stretches her without overwhelming her."},{name:"Round 3 · Look back",lv:"c1",bloom:"Evaluate / Create",by:"mateo",seconds:90,q:"Look back at Sevara’s week on your path. Which step helped her grow the most, and which decision showed the best judgement? Then plan her **next challenge** for the coming month: one step, one way to prepare, and one person who can help. One student presents the plan in one minute.",help:{b2:["The step that helped her most was …","Her best decision was …, because …","Next month, she could …"],c1:["Looking back, the turning point was …","What really paid off was …","Her next challenge should stretch her without overwhelming her: …"]},model:"Picture this: Sevara on a Monday morning, not knowing what the week will bring. Looking back, the turning point on our path was the seminar, when she offered to write the script instead of just staying silent. Her best decision, though, was asking Diyor to lead the volunteers with her, because it was brave and sensible at the same time. Next month, she could give a five-minute talk at the English club. She can prepare with key words on one card, and her teacher, Mrs Hamidova, can give her feedback."}],_f=[{e:"🚀",n:"The Brave One",r:"Sees the chance to grow.",lines:[["Your job","Say what Sevara could gain if she says yes: skills, confidence, new people."],["Useful phrase","This could be a real chance to …"]],x:"Courage is not the same as saying yes to everything: you may also say when a step is too big."},{e:"🛡️",n:"The Careful One",r:"Counts the cost.",lines:[["Your job","Name the real cost or risk of each option: time, energy, other promises."],["Useful phrase","Before she decides, she should think about …"]],x:"Never laugh at fear. Name the risk, then suggest how to make it smaller."},{e:"🧭",n:"The Coach",r:"Turns big steps into small ones.",lines:[["Your job","Suggest one practical step that would make the option easier: practice, preparation, a plan."],["Useful phrase","A good first step would be to …"]],x:"Talk about practice, preparation and rest in general, never about anyone’s health."},{e:"🤝",n:"The Friend",r:"Knows what Sevara really wants.",lines:[["Your job","Ask what would make Sevara proud and happy, not just what is easy or impressive."],["Useful phrase","Knowing Sevara, I think she’d …"]],x:"A good friend supports a thoughtful no as well as a brave yes."},{e:"🔭",n:"The Future Self",r:"Looks back from next year.",lines:[["Your job","Imagine Sevara one year from now. Which choice will she be glad she made, and which might she regret?"],["Useful phrase","A year from now, she’ll be glad she …"]],x:"Think about learning, not only about success: a step that went badly can still teach a lot."}],$f=[],ep={start:"s1",help:{b2:["If Sevara chooses …, she might …","The good thing about … is that …, but …","I’d go for option … because …"],c1:["It’s a risk worth taking, because …","The trade-off here is that …","On balance, the wiser choice is …"]},scenes:{s1:{title:"Monday: The first speaker",text:"Sevara Tursunova is a second-year student of English in Navoi. Her essays are among the best in her group, but she rarely speaks in class. On Monday, Javlon, the captain of the student debate club, stops her in the corridor. On Friday, the club is holding a debate: *Should every student spend one semester at a university in another city or country?* “Your written arguments are brilliant,” he says. “Will you be our first speaker? You’d open the debate in front of the whole faculty.” Sevara’s heart beats faster. *What if my mind goes blank?*",q:"What should Sevara say to Javlon? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. If Sevara says yes, she’ll be nervous all week, but she’ll probably grow the most, especially if the team practises with her. The good thing about option B is that she still speaks on stage, but the pressure is smaller. Option C uses her real strength, writing, but she misses the chance to practise speaking. I’d go for option B because it’s a real step out of her comfort zone, not a jump into the deep end.",seconds:60,options:[{label:"A",text:"Say yes, and ask the team to practise with her every evening this week.",next:"s2a"},{label:"B",text:"Offer to give the short closing summary instead: a smaller part, but still on stage.",next:"s2b"},{label:"C",text:"Say no to speaking, but offer to write the team’s arguments and help with the research.",next:"s2b"}]},s2a:{title:"Tuesday: An invitation from abroad",text:"Sevara has said yes, and the first practice on Monday evening went better than she expected. On Tuesday, her teacher, Mrs Hamidova, forwards an email: a six-week online project in English with students from Brazil, Poland and Indonesia. Together, they will write a guide for international students arriving in their cities. The first video call is on Thursday evening, and each member must introduce their city in two minutes. Sevara would love to show Navoi to the world, but she thinks: *They will all be more fluent than me. And this week is already full.*",q:"Should Sevara join the online project now? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? Sevara could record her two-minute introduction on her phone and listen to it before the call. If she joins now, she meets the team from the very first day, but her week becomes very busy. The good thing about option B is that she joins without pressure, but the others won’t hear her voice for a while. Option C protects her energy for the debate, but the chance may not come back. I’d go for option A because a recorded practice makes the first call much less scary.",seconds:60,options:[{label:"A",text:"Join now, and practise her two-minute introduction of Navoi tonight.",next:"s3b"},{label:"B",text:"Join, but ask to share a written introduction with photos first and to speak from the second call.",next:"s3a"},{label:"C",text:"Say “not this time”: the debate is enough for one week. Ask to join the next project instead.",next:"s3c"}]},s2b:{title:"Tuesday: A new sport",text:"Sevara won’t open Friday’s debate, but she is still helping the team, and Javlon has thanked her for being honest. On Tuesday, a notice in the sports hall catches her eye: the university’s new ultimate frisbee club invites beginners to a free training session on Wednesday evening. The coach is a PE teacher, and some of the players are international students. Sevara has never thrown a frisbee, and she won’t know anyone there. Her roommate, Madina, is surprised: “You? A team sport with strangers? That would be something new!”",q:"Should Sevara go to the training session? Which option would you choose, and why?",by:"mateo",m:"Picture this: Sevara on the field, missing her first catch, and everyone smiling, because they all missed theirs too! If she goes alone, she has to talk to strangers, and that is a real step. The good thing about going with Madina is that she feels safer, but she might only talk to her friend. Option C is careful, but watching is not the same as playing. I’d go for option A because a beginners’ session is made for people exactly like her.",seconds:60,options:[{label:"A",text:"Go alone, and introduce herself to the coach and the other players.",next:"s3b"},{label:"B",text:"Ask Madina to come with her, so she knows at least one person there.",next:"s3a"},{label:"C",text:"Not this week: ask the coach if she can watch one session first and join next time.",next:"s3c"}]},s3a:{title:"Wednesday: The talent evening",text:"On Wednesday, Nilufar, who is organising the faculty’s talent evening on Thursday, comes to find Sevara. Last month, for a class assignment, Sevara translated a short poem by Alisher Navoi, the great poet her city is named after, into English. Her teacher shared the translation, and Nilufar loved it. “One act has just cancelled,” she says. “Would you read your translation on stage tomorrow, in Uzbek and in English?” Sevara feels proud and terrified at the same time. *What if my voice shakes? What if people don’t like my translation?*",q:"What should Sevara say to Nilufar? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: at my school in Lagos, a very quiet student read her own poem at a concert, and people still talk about it. If Sevara reads alone, it’s a big step, and she’ll be nervous, but the translation is hers and she knows it well. The good thing about reading with Madina is that she shares the stage, but she also shares the moment. Option C shows her work without the stage, but nobody hears her voice. I’d go for option B because two voices in two languages is a beautiful idea.",seconds:60,options:[{label:"A",text:"Read the poem on stage alone, first in Uzbek and then in English.",next:"s4a"},{label:"B",text:"Ask her roommate, Madina, to read the Uzbek original while Sevara reads her English version.",next:"s4b"},{label:"C",text:"Say no to the stage, but let Nilufar display her translation on the poetry wall at the event.",next:"s4c"}]},s3b:{title:"Wednesday: The summer school",text:"On Wednesday, an announcement appears on the faculty website: a two-week summer school for students of English at a partner university abroad, with a grant that covers travel and accommodation. Applications close on Friday at midnight. Each student must send a one-minute video in English: *Why do you want to come?* Sevara has never travelled outside Uzbekistan on her own, and she knows her parents will have a lot of questions. *Am I really good enough?* she wonders. *And what will my family say?*",q:"What should Sevara do about the summer school? Which option would you choose, and why?",by:"leo",m:"Hold on, what does the announcement actually ask for? A one-minute video, not a perfect speech. If Sevara records it tonight, she’s quick and brave, but her parents may feel left out of a big decision. The good thing about option B is that her family is part of the plan, but she has less time to record. Option C is realistic, but next year the competition might be just as strong. I’d go for option B because a calm conversation at home makes a strong application easier.",seconds:60,options:[{label:"A",text:"Record the video tonight and send it, even if it isn’t perfect.",next:"s4c"},{label:"B",text:"Talk to her parents first, then record the video with feedback from Mrs Hamidova before Friday.",next:"s4a"},{label:"C",text:"Not this year: apply for a summer course in Tashkent first, and plan to apply abroad next year.",next:"s4b"}]},s3c:{title:"Thursday: One voice against the group",text:"In Thursday’s seminar, Sevara’s group of six must choose a topic for their final project. Sanjar, the most confident student in the group, suggests a video about street food in Navoi, and everyone agrees in seconds. Sevara has doubts: the project is due in two weeks, and nobody in the group knows how to edit a video. She also has a different idea: a podcast of interviews with older people about how Navoi has changed. Then the teacher asks, “So, is everyone happy with the video?” The room goes quiet.",q:"Should Sevara speak up now? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. If Sevara speaks up now, she might feel awkward, but the group can still change its plan before it’s too late. The good thing about option B is that she can explain her idea calmly in writing, but the group may have started on the video by then. Option C keeps the peace, but she may regret her silence if the video fails. I’d go for option A because a polite question is not an attack, and it could save the whole project.",seconds:60,options:[{label:"A",text:"Raise her hand, and explain her doubts and her podcast idea politely.",next:"s4a"},{label:"B",text:"Say nothing now, but send the group a short message tonight with both ideas side by side.",next:"s4c"},{label:"C",text:"Go along with the video, and offer to do the part she is good at: writing the script.",next:"s4b"}]},s4a:{title:"Friday: Question time",text:"It’s Friday afternoon, and the debate is almost over. Whatever her role, Sevara has helped to build her team’s arguments all week. Now it’s question time. A student from the other team stands up: “Studying in another city costs money. What about students whose families can’t pay for it?” Javlon looks down at his notes, but he can’t find an answer. Sevara knows one: during her research, she read about exchange programmes and grants that help with travel and living costs. In question time, any team member may answer. The hall is full.",q:"Should Sevara answer the question herself? Which option would you choose, and why?",by:"nur",m:"This is the moment when all her research pays off. If Sevara answers herself, it’s a brave moment, and the judges will notice it, but she has no time to prepare. The good thing about passing a note is that the team gets the answer and Javlon speaks, but Sevara stays in the background. Option C avoids the spotlight, but the moment will be gone. I’d go for option A because she knows the facts, and knowing the facts is her safety net.",seconds:60,options:[{label:"A",text:"Stand up and answer the question herself, in two or three clear sentences.",next:"e1"},{label:"B",text:"Pass Javlon a quick note with the key facts, so that he can answer.",next:"e4"},{label:"C",text:"Stay quiet, and talk to the student from the other team after the debate.",next:"e2"}]},s4b:{title:"Saturday: The leader is late",text:"On Saturday morning, Sevara arrives at a city park, where the university volunteer club is planting trees with a group of first-year students. She signed up weeks ago as a helper. Then the club leader, Akmal, calls: his train from Samarkand is delayed, and he won’t arrive before noon. “You’re the most organised person I know,” he says. “Could you lead the team until I get there? The plan is in the group chat.” Twelve first-year students are already waiting, holding their spades and looking at her.",q:"Should Sevara lead the team this morning? Which option would you choose, and why?",by:"mateo",m:"Picture this: twelve students, twelve spades, and every face turned towards Sevara! If she leads the whole morning, she’ll learn a lot about herself, but she might feel out of her depth at first. The good thing about sharing the job with Diyor is that nobody has to do it all alone, but two leaders can confuse people. Option C plays to her strengths, but she misses the chance to lead. I’d go for option B because sharing the lead is still leading.",seconds:60,options:[{label:"A",text:"Lead the team herself: read out the plan, give everyone a job and check on each group.",next:"e1"},{label:"B",text:"Ask Diyor, an experienced volunteer, to lead with her: he explains the planting, and she organises the groups.",next:"e4"},{label:"C",text:"Let Diyor lead the team, and take charge of a smaller job she knows well: the registration list and the photos.",next:"e3"}]},s4c:{title:"Sunday: The mountain trail",text:"Sunday was supposed to be Sevara’s quiet day. But on Saturday evening, a message arrives from the university hiking club: one place is free on tomorrow’s day trip to the Nurata mountains, and the bus leaves at six in the morning. She has never been on a club trip, and she doesn’t know anyone in the club. It has also been a long week, and she has a grammar test on Monday. Her mother says, “You’ve always wanted to see those mountains. But you also need some rest.”",q:"Should Sevara go on the trip? Which option would you choose, and why?",by:"leo",m:"Hold on, what does Sevara actually need most right now? If she goes, she sees something new and meets new people, but she starts Monday tired. The good thing about option B is that she won’t feel alone among strangers, but she still loses her quiet day. Option C protects her rest and her test, and that isn’t weakness: it’s planning. I’d go for option C this time, as long as she really signs up for the next trip.",seconds:60,options:[{label:"A",text:"Go on the trip, and use the bus journey to get to know the others.",next:"e1"},{label:"B",text:"Go, and ask the club leader to introduce her to an experienced member who can walk with her.",next:"e4"},{label:"C",text:"Say no this time: rest, prepare for her test, and sign up for the next trip today.",next:"e3"}]},e1:{end:!0,title:"Ending: The yes that grew",text:"Sevara ends the week surprised at herself. Her heart was racing when she began, but the fear grew smaller with every minute. People remembered what she said and did, not how nervous she looked. She has learned that confidence often comes after action, not before it: you don’t wait until you feel brave; you feel braver because you tried. Next month, she wants to say yes to one more thing that scares her a little.",q:"What did Sevara learn on your path? Which choice took the most courage, and was it also a wise choice?",by:"amara",m:"Let me give you a real example from our path: when Sevara stood up in question time, she wasn’t ready, but she knew her facts. She learned that confidence comes from doing, not from waiting. Her bravest choice was also a wise one, because she had prepared all week. In the long run, every small yes makes the next one easier."},e2:{end:!0,title:"Ending: Stretch, don’t snap",text:"Sevara’s week was full of small steps rather than giant leaps. She didn’t always take the spotlight, but she did more than she had ever done before, and she never pushed herself so far that she wanted to give up. She has learned about the stretch zone: the space just outside your comfort zone, where things feel a little uncomfortable but still possible. That is where she grew this week, one conversation at a time.",q:"What did Sevara learn on your path? What is in the stretch zone for a student like her, and how can she stay in it?",by:"aziza",m:"Let’s break it down step by step. On our path, Sevara chose steps that were a little scary, but never impossible, like talking to the other team after the debate. She learned that growth doesn’t need giant leaps. For a student like her, the stretch zone might be asking one question in every seminar. To stay in it, she should make each step slightly bigger than the last."},e3:{end:!0,title:"Ending: The wise no",text:"Sevara ends the week with a clear head. She said yes to some challenges and a thoughtful no to one that didn’t feel right at that moment, and she explained her reasons honestly. Some people were surprised, but nobody thought less of her. She has learned that stepping out of your comfort zone is not about saying yes to everything. A wise no protects the energy you need for the challenges that matter most, as long as it means “not yet”, not “never”.",q:"What did Sevara learn on your path? How can you tell the difference between a wise no and an excuse?",by:"leo",m:"Hold on, let’s look at the evidence from our path. Sevara said no, but she also made a concrete plan for next time, and that’s the difference. An excuse avoids the challenge forever; a wise no just chooses a better moment. If someone says no to everything, it’s probably fear talking. If they say no and immediately plan a next step, it’s good judgement."},e4:{end:!0,title:"Ending: Braver with others",text:"Sevara discovers that courage is easier to find when you are not alone. With a teammate beside her, she did things she would never have tried by herself, and she helped other people to shine too. Friends, teammates and teachers all played a part in her week, and she played a part in theirs. She has learned that asking for support is not a sign of weakness: it is often the smartest way to take a big step.",q:"What did Sevara learn on your path? Who can help a student to step out of their comfort zone, and how?",by:"nur",m:"What if technology could help here? A simple group chat for first-year students could connect shy students with older buddies. On our path, Sevara learned that support makes courage easier. Friends can come along, teachers can give feedback, and experienced students can share the first step. In the long run, a student who was helped today will help someone else tomorrow."}}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why should young people step out of their comfort zone?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** young people should step out of their comfort zone, because that is where real learning happens."],["Point","**The main reason is that** new challenges teach us skills and confidence that no textbook can give."],["Example","**For example,** when I gave my first presentation in English at a student conference in Tashkent, I was terrified, but afterwards I felt ready for almost anything."],["Close","**So, all things considered,** a little fear is a small price to pay for growing as a person."]],keys:["in my view","step out of your comfort zone","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Is it always a good idea to step out of your comfort zone?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say it usually is, **even though** not every challenge is worth taking."],["","**To begin with,** we rarely grow when everything feels easy and familiar."],["","**Take my own case:** I joined a climbing course last year, and the confidence I gained there now helps me in exams and interviews."],["","**On the other hand,** saying yes to everything can leave you exhausted, and some risks are simply not sensible."],["","**This is why** it makes sense to choose challenges that stretch you a little, rather than ones that overwhelm you."],["","**All in all,** step out of your comfort zone often, but use your judgement as well as your courage."]],keys:["even though","to begin with","on the other hand","all in all"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"How can teachers help shy students to speak up in class?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think teachers can do a great deal, and it starts with making mistakes feel normal."],["","To begin with, pair work gives quiet students a chance to try out their ideas before they speak to the whole class."],["","On top of that, a few seconds of thinking time before an answer helps students who need a moment to prepare."],["","Let me give you a real example: my debate coach in Lagos always let new members speak last, after they had heard how the others did it."],["","That said, teachers shouldn’t push anyone onto a stage before they are ready."],["","So, in a nutshell, shy students speak up when the classroom feels safe and the steps are small."]],extra:"My favourite subject at school was chemistry, especially the experiments in the lab.",keys:["pair work","thinking time","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Do we need to fail in order to grow?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I believe failure is one of the best teachers we have, as long as we learn from it."],["The main reason is that","a mistake shows you exactly what to do differently next time."],["For instance,","when I started surfing in Recife, I fell off the board again and again before I finally stood up."],["Having said that,","failing over and over without any support can make people give up completely."],["That’s why","it helps to have a coach or friends who remind you how far you’ve already come."],["Ultimately,","growth comes from trying, failing and trying again, not from never failing."]],distractors:["In contrast,","Meanwhile,"],keys:["learn from it","again and again","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"What is the best way to overcome a fear of speaking in public?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["start small","prepare, don’t memorise","for instance","focus on the message","it gets easier every time"],model:"I’d say the best way is to start small: speak to two friends first, then to a small group, and only later to a big audience. It also helps to prepare your ideas but not memorise every word, because if you forget one line, you can still carry on. For instance, before my first online presentation, I practised three times with my sister in Kuala Lumpur, using only key words on a card. Most importantly, focus on the message, not on yourself. And remember: it gets easier every time."}],np={title:"Exam Part 2 practice: helping shy first-year students",situation:"The English department at a university in Navoi wants to help first-year students who are too shy to speak in class. It can pay for only one idea: a speaking buddy scheme with older students, a weekly “Try Something New” club, or a one-day workshop on public speaking. Nur and Leo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"leo",lines:[["A","So, which idea would help shy first-years most? Shall we start with the buddies?"],["B","Sure, but won’t some students feel nervous with an older student one to one?"],["A","Possibly. So you’re saying the buddies might put too much pressure on them?"],["B","Not exactly. A patient, friendly buddy could make a huge difference."],["A","True. And the “Try Something New” club? It’s fun, and nobody has to be perfect."],["B","It is fun, but it might only attract confident students, don’t you think?"],["A","Good point. The workshop teaches real skills, but one day is short, isn’t it?"],["B","Exactly. So, shall we go for the buddies, and train them to be patient?"],["A","Agreed. That way, shy students get support every week, not just once."]],phrases:{Start:["Shall we start with …?","Which idea would help … most?"],Clarify:["So you’re saying (that) …?","Not exactly. …"],"Give the turn":["…, don’t you think?","…, isn’t it?"],"Agree and decide":["Good point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your student English club wants more students to take part in its events. Choose **one** idea: a “bring a friend” evening, small tables of four instead of one big stage, or a small prize for every first-time speaker. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["It’s well outside my comfort zone.","I was nervous at first, but …","I decided to give it a go.","It turned out to be …","What’s the worst that could happen?","I felt out of my depth.","Looking back, I’m glad I …","It took a lot of nerve to …","It was a real eye-opener."],B:["It took a lot of nerve to …","I rose to the challenge.","It’s well outside my comfort zone.","I’d rather build up to it gradually.","I was nervous at first, but …","It pushed me to …","Looking back, I’m glad I …","It was a real eye-opener.","I decided to give it a go."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["It’s well outside my comfort zone.","I was nervous at first, but …","I decided to give it a go.","It turned out to be …","What’s the worst that could happen?","I felt out of my depth.","Looking back, I’m glad I …","It took a lot of nerve to …","It was a real eye-opener.","I rose to the challenge.","It pushed me to …","I’d rather build up to it gradually."],questions:["What is something new you tried this year, and how did it go?","Is it easier for young people in Uzbekistan to try new things today than it was for their parents? Why?","Which is harder: speaking to a big audience or chatting with strangers? Why?","Should universities ask every student to try one new activity each semester?","When is it wise to say no to a challenge?","What would you try if you knew you couldn’t fail?"]},sp=[{type:"stress",title:"Stress Spot: adjectives for feelings",intro:"Tap the stressed syllable. Rules: endings like -ous, -ent and -ed are never stressed (NERvous, CONfident). In words ending in -ic, the syllable just before -ic is strong (enthusiASTic). Then listen and say the word.",follow:"Now use two of these adjectives in one sentence about Sevara’s Challenge Week.",items:[{w:"nervous",syl:["ner","vous"],s:0},{w:"confident",syl:["con","fi","dent"],s:0},{w:"embarrassed",syl:["em","bar","rassed"],s:1},{w:"determined",syl:["de","ter","mined"],s:1},{w:"adventurous",syl:["ad","ven","tu","rous"],s:1},{w:"courageous",syl:["cou","ra","geous"],s:1},{w:"uncomfortable",syl:["un","com","for","ta","ble"],s:1},{w:"enthusiastic",syl:["en","thu","si","as","tic"],s:3}]},{type:"pairs",title:"Sound Pairs: /e/ or /eɪ/?",intro:"Press Play and choose the word you hear. /e/ is short and stays the same (get, let). /eɪ/ moves: start with /e/ and glide to /ɪ/ (gate, late). Uzbek vowels do not glide like this, so face can easily sound like fes. Partner version: one student says a word, the partner points to it.",pairs:[["get","gate"],["let","late"],["wet","wait"],["test","taste"],["sell","sale"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: give it a go, out of my depth or rise to the challenge.","Say how Sevara feels at this moment, using two adjectives for feelings."],lp={title:"Step Up Speaking Club podcast: The Year I Said Yes",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Aziza talks to Leo about the climbing course that took him out of his comfort zone, and remembers her own first presentation in English.",tip:["Listen for partial agreement","Speakers in Part 3 often agree only partly: *I agree up to a point, but …*, *Not exactly …*, *Fair enough*. Check what each person really thinks after *but* before you choose *both of them*."],A:"aziza",B:"leo",lines:[["A","Welcome to the Club podcast. Today’s topic is comfort zones. Leo, last spring you signed up for a climbing course. Why?"],["B","For years, my life in Hamburg was safe and predictable: lectures, the library and the same three friends. I wanted to **step out of my comfort zone** and **face my fears**, because I have never liked heights."],["A","And how was the first evening?"],["B","Honestly? I **felt out of my depth**. Everyone else seemed to know what to do, and I **made mistakes** all the time. It was **a steep learning curve**, but our trainer kept saying, “Just **give it a go**. Nobody is judging you.”"],["A","[[0]] that’s the best advice anyone can get. [[1]] fear grows when we avoid things. I was terrified before my first presentation in English at a student conference in Tashkent, but I decided to **take a risk**, and the audience asked me more questions than anyone else."],["B","I remember! Your story made me **push myself** a little harder. A year later, I still climb every week. I’ve **built confidence**, **gained experience** in something completely new and **broadened my horizons**."],["A","So everyone should jump into something scary?"],["B","Not jump. You can **rise to the challenge** one small step at a time. [[2]] my climbing course, [[3]]: we started on a wall one metre high."],["A","[[4]] small steps are always better? Sometimes a big jump is the only way."],["B","[[5]] not for everyone. Some people need a jump; others need a ladder."],["A","Fair enough. Both can work, as long as you start."]],gaps:[[1,"The way I see it,"],[2,"That’s mainly because"],[3,"Take"],[3,"for example"],[4,"Sorry, are you saying that"],[5,"I agree up to a point, but"]],questions:[{q:"Who wanted to change a life that felt too predictable?",o:["Aziza","Leo","both of them"],a:1,why:"Leo: “For years, my life in Hamburg was safe and predictable … I wanted to step out of my comfort zone.”"},{q:"Who felt very nervous before trying something new?",o:["Aziza","Leo","both of them"],a:2,why:"Leo: “I felt out of my depth.” Aziza: “I was terrified before my first presentation in English.” Same feeling, different words."},{q:"Who thinks that avoiding something makes the fear bigger?",o:["Aziza","Leo","both of them"],a:0,why:"Aziza: “That’s mainly because fear grows when we avoid things.”"},{q:"Who prefers to build up to a challenge slowly?",o:["Aziza","Leo","both of them"],a:1,why:"Leo: “You can rise to the challenge one small step at a time.” Aziza says that sometimes a big jump is the only way."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Aziza use to check meaning, and which one does Leo use to agree only up to a point?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[3]],["Checking meaning",[4]],["Agreeing up to a point",[5]]]},use:{q:"Is it better to try a new challenge alone or with a friend? Why?",by:"amara",model:"The way I see it, it’s better to start with a friend. That’s mainly because a friend makes the first step less scary. Take my first debate in Lagos, for example: I only signed up because my roommate did, and by the end of the year I was the one encouraging her. Of course, sometimes you have to go alone. So, all in all, a friend can help you begin, but you have to keep going by yourself.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Uf,DIALOGUE:np,DRILLS:Gf,LESSON:Vf,LEVELS:tp,LISTEN:lp,MAIN:Jf,PAT
