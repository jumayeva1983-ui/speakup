","Think of a potter in Rishtan who now sends blue ceramics to buyers abroad, or a delivery rider in Poland whose boss is an app: how does the world change their choices?"],rule:"Rule of respect: the guests are fictional people. We ask about work, choices and opinions, never about health or appearance, and we talk about every country with respect. No stereotypes, and no ranking of nations."}},Zf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for the situation, attitude, main point and purpose, notice the speakers’ phrases, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Aziza, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:5,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Noun or verb? Stress in *export*, *import*, *increase*, and /ɪ/ or /iː/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each phrase after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student talks about then and now for a minute; two classmates listen for phrases of change. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best phrase they heard (use the wheel)."]},{id:"game",icon:"🎙",name:"Global Lives Live",min:18,lv:"c1",group:"3 shows of 5",kind:"five",roles:["Host","Guest","Audience","Audience","Audience · judge"],desc:"A talk show: interview a guest, ask follow-up questions, try a tough question and score the shows. (Book: section 6 · G6)",howto:["15 students = 3 shows of five. All shows run at the same time, each in its own corner of the room.","Roles: host, guest (in the hot seat) and three audience members; one of them is also the judge (👥 Class → Groups of 5).","Rounds: Interview 5 min · Audience 3 min · Tough question 3 min · Score 4 min (three one-minute final words). Time left? A new guest takes the hot seat.","Before the lesson, students read the sample show “Show A” (book, section 6, or the How to play step here)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about a global or local choice, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 2, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract, and each asks for something different: a reason for calling, an attitude, a main point or a purpose.","Press **Play the podcast**. You hear four short extracts. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking meaning, and describing change.","**Your turn:** listen to Aziza, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is B. Nur doesn’t hate online shopping.","gives an answer"],["B","What makes you say that?","asks for evidence"],["A","She buys gadgets online. For food, though, she prefers the market.","uses the text as evidence"],["B","Right: so it depends on what she’s buying.","paraphrases"]],checks:[["Why is a short-extracts task harder than one long text?","every extract is a new situation: you have to find who is speaking, where and why, very quickly."],["Which phrase does Mateo use to check that he has understood?","Do you mean that …?"]]},pron:{ref:"Book: Lesson 2, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the phrase. *an* or *the* = a noun; *to* = a verb. Tap the syllable you think is **strong**.","Green = correct, red = try again. The computer says the phrase: **repeat it** and **clap** on the strong syllable.","Remember the rule: in these words, the **noun** is strong at the **start** (*an EXport*), the **verb** at the **end** (*to exPORT*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: short /ɪ/ or long /iː/?","Say **both** words. /iː/: long, lips spread as if you are smiling. /ɪ/: short and relaxed.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *an export*. Which syllable is strong?",""],["A","*PORT*?","a first guess"],["T","Not quite. Listen again: an EX-port. It’s a noun.","the teacher repeats"],["B","So the noun is *EXport*, and the verb is *to exPORT*!","uses the rule"],["T","Yes! Everyone, say both and clap: an EX-port, to ex-PORT.","the class repeats"],["T","Now /ɪ/ or /iː/? Listen: *sheep*. First or second: *ship* or *sheep*?",""],["A","Second: *sheep*. It’s long, and I smile when I say it.","checks the mouth"]],checks:[["Where is the stress in *an import* and *to import*?","noun: IMport; verb: imPORT."],["How do you make /iː/?","make it long, with your lips spread, as if you are smiling."],["What do you do after a correct answer?","say the phrase aloud and clap on the stress."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think globalisation changed life in Navoi … because, um, we can buy things online … For example, my aunt, she sells bags … to other countries. So it changed a lot.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, globalisation has changed everyday life in Navoi a lot. The main reason is that we can reach people all over the world online. For example, my aunt sells her bags to customers abroad. So life is very different now.","Attempt 2 · 60 s · linking words"],["aziza","In my view, globalisation has changed life in Navoi more than we notice. We can reach the world at the click of a button. My aunt used to sew for neighbours; now she sells her bags abroad. All things considered, our town looks the same, but we live in it differently.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ 1 minute** and talks about **then and now**.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How has the internet changed the way your family shops?",lines:[["mateo","**Back then,** my grandmother **used to** walk to the market every morning and chat with every seller. **These days,** my mum orders most things on her phone. **The biggest change is that** shopping is faster but much quieter. **It’s become much easier to** buy things, but she misses the conversations.","speaker · 1 minute"],["nur","I heard five phrases: *Back then*, *used to*, *These days*, *The biggest change is that* and *It’s become much easier to*. *These days*, *used to* and *Back then* are the top row: **Bingo!**","listener reports"],["mateo","Brilliant! Five points plus three for the Bingo: eight points.","count the points"],["nur","Next time, try *There’s been a shift towards …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, the café needs …*).","Click the lines in order. Each line answers the line before. Aziza and Amara take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a birthday present for a friend abroad",lines:[["A","So, what should we send Leo for his birthday?","opens the topic"],["B","How about a T-shirt from a big international brand?","an idea"],["A","Good idea, but he can buy that in Hamburg. What about something local, like a small handmade bowl from Rishtan?","reacts + a new idea"],["B","Agreed. It’s light, it’s from Uzbekistan, and nobody else will give him one.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · sample show in section 6",steps:["Make shows of five. Give out the roles: **Host, Guest** and **three Audience members**. One audience member is also the **judge**.","**Guest cards:** the guest picks one card face down and reads it. Don’t open the **Secret** yet.","**Round 1 · Interview (5 min):** the host welcomes the audience and opens question cards one by one. The guest answers in role: *then*, *now* and *my view*.","**Round 2 · Audience (3 min):** each audience member asks one follow-up question about something the guest said.","**Round 3 · Tough question (3 min):** the host opens a tough card and reads it like a caller. The guest answers and reveals the Secret if it helps.","**Round 4 · Score (4 min):** each guest gives a one-minute final word to the whole class. The audiences of the other shows score it 0–5 on three criteria.","The judge gives one star (something good) and one wish (something to try next time)."],exTitle:"Sample show: Show A",lines:[["","Round 1 · Interview — Host Nur · Guest Aziza (as Dilnoza, a ceramics maker from Rishtan) · Audience Leo, Amara and Mateo (judge)",""],["nur","Good evening and welcome to **Global Lives Live**! My guest tonight makes ceramics in Rishtan, but her customers live all over the world. Dilnoza, what was your work like before?","host: welcome + first question card"],["aziza","Well, I **used to** sell my bowls only at the bazaar and to tourists who visited our workshop. **These days**, most of my orders come online, and I send parcels abroad.","guest: then and now"],["nur","What’s the best part of that change?","host: next question card"],["aziza","The feedback! A buyer once sent me a photo of my plate on her family table in another country. **That made me feel** that our tradition was travelling.","a vivid example"],["","Round 2 · Audience",""],["leo","**You mentioned** orders from abroad. **Is there anything** you don’t like about them?","a follow-up on something the guest said"],["aziza","Yes: some buyers want lots of identical plates very fast. But painting by hand takes time, so I say no politely and explain why.","an honest answer"],["amara","**How exactly** do you explain that to buyers who don’t speak Uzbek?","a second follow-up"],["aziza","I film a short video of the glazing. The video does the talking!",""],["","Round 3 · Tough question",""],["nur","Tough card: **“A caller says globalisation is killing local shops.”**","host reads the card like a caller"],["aziza","**I see why people think that, but** in my case it’s the opposite. And **here’s my secret:** I still use my grandfather’s notebook of patterns. The internet is helping an old tradition stay alive.","guest reveals the Secret"],["mateo","Judge’s feedback. **One star:** the photo on the family table, a great example. **One wish:** try a C1 phrase, like *There’s been a real shift towards …*","judge: one star, one wish"]],checks:[["Who sits in the hot seat and answers in role?","the guest."],["When does the guest reveal the Secret?","in Round 3, if it helps the answer to the tough question."],["Who gives the scores in Round 4?","the audiences of the other shows: 0–5 for each criterion."]]},drills:{ref:"Book: Lesson 2 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"My cousin ___ for a company in Germany: he never goes to an office.",o:["works remotely","makes a living","goes global"],a:0},{q:"With a good website, even a small pottery workshop can ___.",o:["lose touch","go global","shop online"],a:1},{q:"These days you can order a book from abroad ___.",o:["at the click of a button","in a sense of identity","on the way of life"],a:0},{q:"Video calls help families ___ when someone works abroad.",o:["make a living","lose touch","keep in touch"],a:2},{q:"Meeting people from other countries can really ___.",o:["broaden your horizons","open your produce","keep your touch"],a:0},{q:"Some parents worry that their children will ___ their roots.",o:["keep in touch with","lose touch with","go global with"],a:1},{q:"At the bazaar, I prefer to buy ___ because it’s fresher.",o:["a way of life","a sense of identity","local produce"],a:2},{q:"Learning English can ___ many new opportunities.",o:["open up","wipe out","lose touch"],a:0},{q:"Speaking Uzbek at home gives children a strong ___.",o:["way of life","sense of identity","click of a button"],a:1},{q:"Farming is still a traditional ___ in many villages.",o:["way of life","local produce","sense of identity"],a:0},{q:"It’s getting harder to ___ as a translator because of free apps.",o:["make a living","shop online","go global"],a:0},{q:"More and more people ___ instead of going to the shops.",o:["keep in touch","shop online","work remotely"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"My brother works remotely. → **My sister and I …**",a:"My sister and I work remotely."},{p:"My sister and I work remotely. → **for a company in Malaysia**",a:"My sister and I work remotely for a company in Malaysia."},{p:"My sister and I work remotely for a company in Malaysia. → **a question: Do you …?**",a:"Do you work remotely for a company in Malaysia?"},{p:"I keep in touch with my cousin by video call. → **my aunt in Turkey**",a:"I keep in touch with my aunt in Turkey by video call."},{p:"I keep in touch with my aunt in Turkey by video call. → **used to … by letter**",a:"I used to keep in touch with my aunt in Turkey by letter."},{p:"I used to keep in touch with my aunt in Turkey by letter. → **a question: How do you …?**",a:"How do you keep in touch with your aunt in Turkey?"},{p:"You can shop online at the click of a button. → **book a flight**",a:"You can book a flight at the click of a button."},{p:"You can book a flight at the click of a button. → **In the past, you couldn’t …**",a:"In the past, you couldn’t book a flight at the click of a button."},{p:"In the past, you couldn’t book a flight at the click of a button. → **a question: Can you …?**",a:"Can you book a flight at the click of a button?"},{p:"Studying abroad broadens your horizons. → **Learning a language**",a:"Learning a language broadens your horizons."},{p:"Learning a language broadens your horizons. → **has broadened my horizons**",a:"Learning a language has broadened my horizons."},{p:"Learning a language has broadened my horizons. → **a question: How has …?**",a:"How has learning a language broadened your horizons?"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Now more people shop online.",a:"There’s been a shift towards shopping online."},{p:"Life in my town is very different now.",a:"Life in my town has changed beyond recognition."},{p:"In the past, people bought bread at the bazaar every day.",a:"Back then, people would buy bread at the bazaar every day. (*would* for past habits)"},{p:"Globalisation has good and bad sides.",a:"Globalisation is a double-edged sword."},{p:"Globalisation gives young people more chances.",a:"Globalisation opens up a world of opportunities for young people."},{p:"I agree with you a little.",a:"I’d go along with that to some extent."},{p:"In the end, it depends on the person.",a:"Ultimately, it comes down to the individual."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I am working remotely since two years.",o:["I have been working remotely for two years.","I am working remotely for two years.","I work remotely since two years."],a:0,why:"for + a period of time; present perfect for something that started in the past and continues."},{q:"✗ Globalisation has a big influence to our life.",o:["Globalisation has a big influence for our life.","Globalisation has a big influence on our lives.","Globalisation is a big influence to our lives."],a:1,why:"an influence on something"},{q:"✗ I used to living in a village.",o:["I used to live in a village.","I use to living in a village.","I was used to live in a village."],a:0,why:"used to + verb (past habits and states)"},{q:"✗ We can buy everything from the online.",o:["We can buy everything from online.","We can buy everything in the online.","We can buy everything online."],a:2,why:"online works like an adverb here: no from, no the."},{q:"✗ My cousin studies in abroad.",o:["My cousin studies abroad.","My cousin studies at abroad.","My cousin is study abroad."],a:0,why:"abroad needs no preposition."},{q:"✗ The life in Tashkent changed a lot.",o:["The life in Tashkent has changed a lot.","Life in Tashkent has changed a lot.","Life in Tashkent is changing a lot since."],a:1,why:"No the with life in general; present perfect for a change up to now."},{q:"✗ This information are very useful.",o:["These information are very useful.","This informations are very useful.","This information is very useful."],a:2,why:"Information is uncountable."},{q:"✗ Nowadays people are more depend on the internet.",o:["Nowadays people depend more on the internet.","Nowadays people are more depend from the internet.","Nowadays people are depending more of the internet."],a:0,why:"depend on (a verb), or be dependent on (an adjective)"},{q:"✗ Compare with my grandparents, I travel a lot.",o:["Comparing my grandparents, I travel a lot.","Compared with my grandparents, I travel a lot.","Compare to my grandparents, I travel a lot."],a:1,why:"Compared with / Compared to …,"}]},{title:"Stress: noun or verb?",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"Dried fruit is an important ___ for many farmers in Uzbekistan. (noun)",o:["EXport","exPORT"],a:0,why:"Noun: stress at the start."},{q:"We ___ coffee because it doesn’t grow here. (verb)",o:["IMport","imPORT"],a:1,why:"Verb: stress at the end."},{q:"There has been an ___ in online shopping. (noun)",o:["INcrease","inCREASE"],a:0},{q:"Farmers in the valley ___ apricots. (verb)",o:["PROduce","proDUCE"],a:1},{q:"global → noun",o:["GLObalisation","gloBAlisation","globaliSAtion"],a:2,why:"-ation: the stress falls on A."},{q:"technology → adjective",o:["TECHnological","techNOlogical","technoLOGical"],a:2,why:"The stress moves: techNOlogy → technoLOGical."},{q:"communicate",o:["comMUnicate","COMmunicate","communiCATE"],a:0},{q:"international",o:["INternational","interNAtional","internaTIONal"],a:1}]}],Kf={cardsStep:"Guest cards",cardsTitle:"Guest cards",cardsHint:"The guest of each show picks one card face down: it turns over and opens. Read it, close it, and the next guest picks. Hosts and audiences may read the card too, but nobody opens the Secret before Round 3.",backWord:"Guest",hiddenLabel:"Secret",hiddenAll:"Show all secrets",questionWord:"Question",questionTitle:"Host’s question cards",questionHint:"The host opens one card at a time and asks the guest. Ask at least four questions. Model answers: a Club member plays one of the guests.",questionHelp:{b2:["I used to …, but these days I …","The biggest change is that …","For example, …"],c1:["Back then, I would …","Looking back, I’d say that …","What I didn’t expect was …"]},twistTitle:"Tough question cards",twistHint:"The host opens one card and reads it like a caller. The guest answers and reveals the Secret if it helps.",twistWord:"Tough card",twistHelp:{b2:["That’s a fair question. Let me explain.","I see why people think that, but …","Actually, here’s my secret: …"],c1:["I’d challenge that slightly: …","It’s not a simple choice between … and …","To be fair, that’s something I struggle with too."]},scoreTitle:"Score board",scoreHint:"Each guest gives a one-minute final word to the whole class. The audiences of the other two shows agree on 0–5 points for each criterion. Then each judge gives one star and one wish.",scoreCriteria:["Stays in role","Good examples","Then vs now"],teamWord:"Show",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Interview",lv:"b2",bloom:"Understand",by:"mateo",seconds:60,tool:"questions",q:"Host: welcome the audience, introduce your guest and ask questions from the cards. Guest: answer in role: life then, life now, and your view.",help:{b2:["Welcome to the show! Tonight our guest is …","I used to …, but these days I …","The biggest change is that …"],c1:["Back then, I would …","There’s been a real shift towards …","Looking back, I’d say that …"]},model:"Good evening, everyone, and welcome to Global Lives Live! Tonight our guest comes from Rishtan, a town famous for its blue ceramics. Not long ago, she only sold her bowls at the local bazaar. These days, her plates travel to kitchens on the other side of the world. So, let’s find out how that happened. Dilnoza, thank you for joining us. Could you start by telling us what your working day used to look like?"},{name:"Round 2 · Audience",lv:"b2",bloom:"Analyse",by:"aziza",seconds:90,q:"Audience: each of you asks the guest one follow-up question about something they said. Guest: give a clear answer and one example.",help:{b2:["You said that … Could you tell us more?","How exactly did … change?","Would you ever go back to …? Why?"],c1:["I’m curious about something you mentioned: …","Could you give us a concrete example of …?","How do you see … changing in the future?"]},model:"*(Question: “You said buyers abroad ask for certificates. Was that difficult?”)* Oh yes, very! At first I didn’t even know which documents I needed. My son found the information online, and we spent a whole winter learning the rules. We also had to change the way we dry and pack the fruit. It was stressful, but now our apricots look better and stay fresh for longer. So in the end, those strict rules actually made us better farmers."},{name:"Round 3 · Tough question",lv:"b2p",bloom:"Evaluate",by:"leo",seconds:60,tool:"twists",q:"The host opens a tough card and reads it like a caller. Guest: stay calm, answer honestly, and reveal your Secret if it helps your answer.",help:{b2:["That’s a fair question. …","I see why people think that, but …","Actually, here’s my secret: …"],c1:["I’d challenge that slightly: …","It’s not as simple as that. …","To be fair, that’s something I struggle with too."]},model:"*(Caller: “People like you should work for companies at home, not abroad.”)* Hold on, I’d challenge that slightly. I do work for a foreign company, but I live, shop and pay for everything here in Tashkent. And here’s my secret: I taught myself to code with free online courses in English, so now I run free weekend workshops for students who can’t afford private lessons. In a way, globalisation gave me skills that I’m bringing back home. It’s not as simple as local versus foreign."},{name:"Round 4 · Score",lv:"c1",bloom:"Evaluate / Create",by:"amara",seconds:60,tool:"score",q:"Final word: each guest speaks to the whole class for one minute. What has globalisation given you, and what has it cost you? Then the other shows give their scores.",help:{b2:["On the whole, …","What I’ve gained is … What I’ve lost is …","My message to young people is …"],c1:["All things considered, globalisation has been a double-edged sword for me.","If I could change one thing, it would be …","Ultimately, it comes down to …"]},model:"All things considered, globalisation has been a double-edged sword for me. On the one hand, it has given me clients on several continents and a job I could only have dreamt of when I worked with paper dictionaries. On the other hand, translation software means I now have to prove every day that a human translator is worth paying for. If I could change one thing, it would be how quickly people trust machines with words that really matter. Ultimately, though, I’d rather live in an open world and keep learning than hide from it."}],_f=[{t:"Then",q:"What was your everyday life like before things changed?",by:"leo",m:"Well, life was slower and much more local. My family grew apricots and grapes, and in summer we dried them on the roof. My father and I used to take the dried fruit to the bazaar in Samarkand and sell it ourselves. We knew every customer by name. To be honest, we didn’t think about other countries at all. The price depended on the harvest and on how good we were at bargaining."},{t:"Now",q:"What does a normal working day look like for you now?",by:"nur",m:"These days, my office is a desk by the window in my flat in Tashkent. I start work a bit later than my friends, because my team is in Europe and the time is different there. We have a short video meeting in English every morning, and then I write code and test it. The biggest change is that I hardly ever see my colleagues in person. We chat online all day, but I’ve only met two of them face to face."},{t:"Turning point",q:"When did you first notice that the world was changing your life? What happened?",by:"mateo",m:"Picture this: a quiet afternoon, an empty café, and a group of exchange students walking in. They asked if I could make something from their home countries. I said I’d try! The next week, one of them showed me a Japanese way of cutting fish, and I mixed it with our lime and chilli. People loved it. That was the moment I realised that my grandmother’s café could be Peruvian and international at the same time."},{t:"Best part",q:"What is the best thing globalisation has given you?",by:"amara",m:"Let me give you a real example. In my first week in Seoul, I couldn’t read a single sign, and I felt completely lost. Then a classmate from Brazil and another from Uzbekistan showed me how the buses work. Now the three of us study together every evening. For me, that’s the best thing: friends from all over the world. My course is in English, but I’m also learning Korean, so my horizons are getting broader every month."},{t:"Hardest part",q:"What has been the hardest change for you, and how did you deal with it?",by:"leo",m:"Hmm, the hardest part is that my boss is an app. When I delivered newspapers, I knew the people in the office, and if there was a problem, I could talk to someone. Now, if the app changes my pay or my routes, there’s nobody to ask. So I joined an online group of riders in my city. We share advice and help each other, and that makes the job feel a lot less lonely."},{t:"Communication",q:"How has the way you communicate changed: with customers, colleagues or family?",by:"aziza",m:"Let’s break it down step by step. With customers, almost everything is online now. I used to talk to tourists with my hands and a smile, but these days I write messages in English with a translation app and then check them with my nephew. With my family, nothing has changed: we still drink tea together after work. And with other potters, I actually communicate more, because we share photos and ideas in a group chat."},{t:"Identity",q:"Do you feel more global or more local than before? Why?",by:"amara",m:"That’s a difficult one. My clients are on several continents, and I switch between languages all day, so at work I feel very global. But when I go home, I speak Wolof with my family, and I feel deeply local. Actually, I think my job makes my sense of identity stronger. When you translate, you notice the things that can’t be translated: jokes, proverbs, greetings. Those little things remind me where I come from."},{t:"Advice",q:"What advice would you give a young person in Uzbekistan who wants to work in a global world?",by:"nur",m:"Can I start with my own mistake? For years I thought my job would never change, so I didn’t learn anything new. Then the factory bought new machines, and I had to learn very fast. So my advice is: keep learning, even when you feel comfortable. Learn English, learn how machines and apps work, and don’t be afraid to ask questions. A global world opens up opportunities, but only for people who are ready for them."}],$f=[{n:"Dilnoza Rakhimova",r:"Ceramics maker · Uzbekistan",look:{skin:"#E8BE98",hair:"#2E1C14",style:"bun",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Then","Sold blue bowls and plates at the bazaar and to tourists who visited her workshop in Rishtan."],["Now","Takes orders online, sends parcels abroad and films short videos of her work."],["My view","Mostly positive: more buyers, but some want fast, cheap copies of old patterns."]],x:"She learnt the traditional ishkor glaze from her grandfather and still uses his notebook of patterns."},{n:"Sardor Tursunov",r:"Software developer · Uzbekistan",look:{skin:"#E3B48C",hair:"#1E1511",style:"short",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["Then","Worked in an office in Tashkent and travelled to work by metro every day."],["Now","Works remotely for a company in Europe; meetings in English, colleagues he rarely meets."],["My view","Mixed: a good job and new skills, but he misses chatting with colleagues in person."]],x:"He taught himself to code with free online courses in English and now runs free weekend workshops for students."},{n:"Ana Lucía Romero",r:"Café owner · Peru",look:{skin:"#C9926A",hair:"#1F1410",style:"long",top:"#F7C08E",bg:"#FFE4D6"},lines:[["Then","Ran her grandmother’s small café, which served only dishes from their region."],["Now","Her menu mixes Peruvian, Japanese and Chinese flavours; tourists and locals share tables."],["My view","Mostly positive: food is a conversation between cultures."]],x:"She keeps her grandmother’s handwritten recipe book and still cooks one dish from it every Sunday."},{n:"Tomasz Nowak",r:"Delivery rider · Poland",look:{skin:"#F3D2B8",hair:"#8A5A35",style:"short",beard:!0,top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Then","Delivered newspapers by bike for a local office and knew everyone there."],["Now","Delivers food ordered through an app; the app decides his routes and his pay."],["My view","Worried: the work is flexible, but there is nobody to talk to when something goes wrong."]],x:"He once cycled across his whole country to raise money for a village library."},{n:"Fatima Diallo",r:"Translator · Senegal",look:{skin:"#6F4630",hair:"#1C130E",style:"bun",glasses:!0,top:"#F7D774",bg:"#FFF3C4"},lines:[["Then","Translated letters for local businesses with paper dictionaries."],["Now","Works for clients on several continents and checks the mistakes of translation software."],["My view","Mixed: more work, but machines are cheaper, so she has to offer something they can’t."]],x:"She speaks Wolof, French, English, Arabic and Spanish, and has translated a book of children’s stories."},{n:"Nguyen Thi Lan",r:"Factory technician · Vietnam",look:{skin:"#EDCBA8",hair:"#1A1414",style:"long",top:"#F5A9BF",bg:"#FFE1EA"},lines:[["Then","Sewed shirts on a production line in a big clothes factory."],["Now","Controls the machines that do the sewing and repairs them when they stop."],["My view","Mixed: she has new skills, but some of her friends lost their jobs to the machines."]],x:"She invented a small tool that makes the machines faster to clean, and the factory now uses it."},{n:"Bekzod Ergashev",r:"Fruit farmer · Uzbekistan",look:{skin:"#D9A57C",hair:"#2B1A12",style:"short",beard:!0,top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Then","Sold dried apricots and raisins at the bazaar in Samarkand."],["Now","Sells dried fruit to buyers abroad, who ask for certificates and careful packaging."],["My view","Mostly positive: better prices, but the paperwork is hard and the rules keep changing."]],x:"He keeps a box of seeds from old local apricot varieties that his family has grown for generations."},{n:"Wanjiru Kamau",r:"Exchange student · Kenya",look:{skin:"#7A4B32",hair:"#21160F",style:"curly",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Then","Studied at a university near her home town and lived with her family."],["Now","Studies engineering in South Korea; lectures in English, friends from many countries."],["My view","Mostly positive: her horizons are wider, but she sometimes feels between two worlds."]],x:"She organised her dormitory’s first international food night and cooked a Kenyan dish for everyone."}],ep=[{t:"Caller: “Globalisation is killing local shops.”",q:"Answer the caller. Do you agree? What can local businesses do?",by:"mateo",m:"Picture this: a tiny café, and a big international chain opening across the street. Scary, right? That happened to me, and I won’t pretend it was easy. But I’d challenge the idea that globalisation only destroys. It also brought me new customers, new recipes and new ideas. Local businesses survive when they offer something a chain can’t: a personal welcome, a family recipe, a story. So, to the caller I’d say: don’t try to copy the giants. Be proudly local, and let the world come to you."},{t:"Viewer: “Aren’t you just copying other cultures?”",q:"Is your new way of life still your own? Explain.",by:"aziza",m:"Let’s break it down step by step. Yes, I’ve picked up a lot here: I eat with chopsticks, I bow slightly when I say thank you, and half of my playlist is Korean now. But copying would mean pretending to be someone else, and I’m not doing that. I still cook Kenyan food on Sundays and call my grandmother every week. I’d say I’m adding, not replacing. My way of life has more layers now, but the bottom layer is still mine."},{t:"Surprise: no internet for a whole week!",q:"The internet stops working for a whole week. How would your work and life change? What would you do?",by:"nur",m:"What if technology suddenly disappeared? For me, it would be a disaster at first, because the app is my boss: no internet, no orders. To be fair, though, it might also be a useful wake-up call. I’d go round the restaurants in my area and offer to deliver for them directly, the old-fashioned way, with a notebook and a phone. I suspect a lot of people would rediscover their neighbours that week. It would show us how much we depend on one connection."},{t:"Young viewer: “Should I stay or go abroad?”",q:"A young viewer can’t decide: stay in their home town or go abroad? Give honest advice, based on your guest’s story.",by:"amara",m:"Let me give you a real example: my own son. He wanted to leave our village, and I was worried that we would lose him. In the end, he studied agriculture abroad for a while and then came home with ideas that saved our business. So my honest advice is this: it isn’t a choice between staying and leaving. Go and broaden your horizons if you can, but keep in touch with home. The best ideas often travel in both directions."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"How has globalisation changed everyday life in your town?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** globalisation has changed everyday life in Navoi more than most people notice."],["Point","**The main reason is that** we can now reach people and products from all over the world **at the click of a button**."],["Example","**For example,** my aunt used to sew bags for her neighbours, but now she sells them online to customers abroad."],["Close","**So, all things considered,** our town looks the same, but the way we live in it is very different."]],keys:["in my view","at the click of a button","for example","all things considered"]},{name:"Level 2",sub:"6 parts · stretch",type:"order",lv:"b2p",by:"leo",q:"Is it better to buy local produce or imported food?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say local produce is usually the better choice, **although** imported food has its place."],["","**First of all,** local food often travels a shorter distance, so it can be fresher."],["","**For instance,** in summer the vegetables at my local market in Hamburg often come from farms near the city."],["","**However,** some things simply don’t grow where we live, like coffee in Germany."],["","**That’s why** it makes sense to buy local when we can and import what we can’t grow."],["","**In short,** the smartest shopping basket is mostly local, with a little bit of the world in it."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Does globalisation make young people lose their sense of identity?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","To be honest, I don’t think globalisation simply erases who we are."],["","It’s true that teenagers in Lagos and Tashkent might wear the same trainers and follow the same singers."],["","But identity goes much deeper than clothes or playlists."],["","It lives in our languages, our families and the way we celebrate."],["","If anything, meeting other cultures online often makes young people more curious about their own roots."],["","So, in a nutshell, globalisation changes the surface, but our sense of identity can stay strong underneath."]],extra:"My favourite subject at school was chemistry because the experiments were exciting.",keys:["erases who we are","much deeper than","if anything","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Would you like to work remotely for a company in another country?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I’d love to try it, at least for a few years."],["The main reason is that","it would let me work with people from all over the world without leaving my family."],["For instance,","a friend of mine in Recife edits videos for a studio abroad and learns something new from his colleagues every week."],["Having said that,","working from home can feel lonely, and time differences can mean meetings late at night."],["That’s why","I’d want a job with at least some chances to meet my team in person."],["Ultimately,","remote work is a great opportunity, as long as it doesn’t take over your whole life."]],distractors:["In contrast,","Similarly,"],keys:["people from all over the world","without leaving my family","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"Does globalisation help everyone equally?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["not everyone gains in the same way","skills and connections","for instance","some jobs disappear","the key is training"],model:"I’d say not everyone gains in the same way. People with internet access, languages, skills and connections can use globalisation to grow: for instance, a designer in Kuala Lumpur can now find clients on another continent. On the other hand, some jobs disappear when factories move or machines take over, and the people who lose them don’t always get a second chance. So, in my view, the key is training: if governments and companies help people learn new skills, far more of us can benefit."}],np={title:"Exam Part 2 practice: a new menu for the university café",situation:"Your university café wants to change its menu. There are three ideas: only local Uzbek dishes, popular international dishes, or a mixed menu with a world dish of the week. Aziza and Amara are discussing them. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"amara",lines:[["A","So, the café needs a new menu. Shall we start with the idea of only local dishes?"],["B","Sure. Local food is fresh and cheap, but wouldn’t international students get a bit bored with it?"],["A","Maybe. Sorry, do you mean that they’d miss food from home?"],["B","Partly, yes. And local students like trying new things too. That’s why the international menu sounds tempting."],["A","I see your point, but you can get pizza and burgers everywhere already. Our café would lose its character, wouldn’t it?"],["B","True. So what about the mixed menu? Local dishes every day, plus one world dish each week."],["A","I like that. And the world dish could be cooked with local produce, so it stays affordable."],["B","Great idea. International students could even suggest the recipes. So, shall we go for the mixed menu?"],["A","Agreed. That way, the café feels like home for everyone."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, wouldn’t it?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: a new shopping street is opening in your town. It has room for **one** of these: a big international chain store, a market for local farmers and craftspeople, or small cafés with food from different countries. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["These days, …","… used to …","Back then, …","Compared to …,","The biggest change is that …","There’s been a shift towards …","It’s become much easier to …","… is no longer …","Whereas …, now …"],B:["Nowadays, …","In the past, …","… has changed a lot since …","Compared to …,","… used to …","It’s become much easier to …","… is far more … than it used to be.","There’s been a shift towards …","The biggest change is that …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["These days, …","Nowadays, …","In the past, …","Back then, …","… used to …","Compared to …,","… has changed a lot since …","The biggest change is that …","There’s been a shift towards …","It’s become much easier to …","… is no longer …","Whereas …, now …","… is far more … than it used to be."],questions:["How has the internet changed the way your family shops?","What did people in your town do in their free time in the past, and what do they do now?","Which foreign food, product or app has become part of everyday life in Uzbekistan?","How is studying today different from studying in your parents’ time?","Would you like to work remotely for a company in another country? Why or why not?","Is it easier or harder to keep traditions alive in a globalised world?"]},sp=[{type:"stress",title:"Stress Spot: noun or verb?",intro:"Tap the stressed syllable. Rule: in these words, the noun is stressed at the start (an EXport) and the verb at the end (to exPORT). Then listen and say the phrase.",follow:"Now say one sentence with *export* as a noun and as a verb.",items:[{w:"an export",syl:["an","ex","port"],s:1},{w:"to export",syl:["to","ex","port"],s:2},{w:"an import",syl:["an","im","port"],s:1},{w:"to import",syl:["to","im","port"],s:2},{w:"an increase",syl:["an","in","crease"],s:1},{w:"to increase",syl:["to","in","crease"],s:2},{w:"the produce",syl:["the","pro","duce"],s:1},{w:"to produce",syl:["to","pro","duce"],s:2}]},{type:"pairs",title:"Sound Pairs: /ɪ/ or /iː/?",intro:"Press Play and choose the word you hear. /iː/: long, lips spread as if you are smiling. /ɪ/: short and relaxed. Partner version: one student says a word, the partner points to it.",pairs:[["ship","sheep"],["live","leave"],["chip","cheap"],["fill","feel"],["bit","beat"]]}],op=["Use *used to* and *now* in one sentence.","Ask the guest a follow-up question that starts with “How exactly …?”","Give a real example from Uzbekistan.","Give an example from another country.","Compare then and now with a C1 phrase.","Disagree politely with one thing the guest said."],lp={title:"Step Up Speaking Club: Half Local, Half Global",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Nur and Mateo talk about how the wider world has changed their everyday lives. Each extract is a different situation.",tip:["Listen for the situation","Each extract starts something new. In the first few seconds, ask yourself: who is speaking, where are they, and why? Then read the question for that extract again."],A:"nur",B:"mateo",lines:[["A","*Extract 1.* Hi Mateo, it’s Nur. A quick question about our Speaking Club talk on Friday. My cousin in Penang **works remotely** for a design company in Sweden. She **makes a living** without ever meeting her boss in person. Is she a good example for our talk, or is she too unusual? Call me back!"],["B","*Extract 2.* Nur, you won’t believe it. I ordered a camera lens from Japan **at the click of a button**, and it’s already here. Do you **shop online** much?"],["A","For gadgets, yes. But for food, [[0]] nothing beats **local produce**. [[1]] I like knowing who grew it. [[2]] the night market near my flat: the same family has sold mangoes there for years."],["B","[[3]] online is fine for things, but not for food?"],["A","Exactly. Things can travel; mangoes should be fresh."],["B","*Extract 3.* In my grandparents’ village, the **way of life** hardly changed for decades. Today my cousins there chat with friends in Lisbon and Lagos every evening. For me, the internet doesn’t only help families **keep in touch**; it **broadens our horizons**. [[4]] a life that is half local and half global."],["A","*Extract 4.* Some people say that if we all watch the same series, we’ll **lose touch with** our roots. I see it differently. A batik maker in Kelantan now sells her cloth to buyers in Canada. She **went global**, but every pattern still shows where she comes from. The wider world can **open up opportunities** without taking away our **sense of identity**."]],gaps:[[1,"if you ask me,"],[2,"That’s mainly because"],[3,"A good example is"],[4,"Do you mean that"],[5,"There’s been a real shift towards"]],questions:[{q:"Extract 1. Why is Nur calling Mateo?",o:["to tell him about a job in Sweden","to ask if her cousin is a good example for their talk","t
