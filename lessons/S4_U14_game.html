trength."}},Zf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Two Club speakers on the podcast (exam Part 3): who says what? Mateo and Leo talk about living alone, feeling lonely and making the first move. Listen for a distinction, notice how Leo checks meaning and agrees only partly, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read statements 1–4 first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Nur, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about people in general; nobody has to talk about their own feelings.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about being alone and together (ISolate → isoLAtion), and /ŋ/ or /ŋk/: thing or think? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 4: put six parts of an answer about technology and loneliness in order and choose the right linking word for each part (two words are extra), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 4; fast pairs try Level 5, pairs who need help go back to Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about being alone, feeling cut off and reaching out. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","The questions are about people in general. Nobody has to talk about their own feelings."]},{id:"game",icon:"🪑",name:"The Long Table",min:18,lv:"c1",group:"3 groups of 5",kind:"five",roles:["Host","Guest","Interviewer","Interviewer","Idea keeper"],desc:"Hot Seat with guests: one student answers as a fictional guest who knows about being alone, the group asks questions, reads letters from people who feel cut off, challenges the guest and writes three connection ideas for the city’s Reach Out Week. (Book: section 6 · Game School: Hot Seat)",howto:["15 students = 3 groups of five. All groups run at the same time, each at its own “table” (👥 Class → Groups of 5).","Roles: host, guest (in the hot seat), two interviewers and an idea keeper. The guest takes one guest card; the others may read it, but nobody opens the Secret before Round 3.","Rounds: The interview 5 min · Letters to the table 4 min · Challenge the guest 4 min · Connection idea and score 5 min. Next lesson, rotate the roles.","Sensitive topic: the letters come from fictional people. Nobody is asked about their own loneliness or family; if a student wants to share something, they may, but nobody has to."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping new students feel at home, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 44, section 2 · Listen and Notice",steps:["**Before you listen:** read statements 1–4 and guess who probably said each one: Mateo, Leo or both of them.","Press **Play the podcast**. Listen for a distinction: _living alone_ and _feeling lonely_, _many contacts_ and _a sense of belonging_. Decide which idea each speaker really holds. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: checking meaning, opinion, agreeing partly, reason and example.","**Your turn:** listen to Nur, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Number 2 is Leo. He says numbers aren’t everything.","gives an answer"],["B","He does. But doesn’t Mateo say something similar earlier?","challenges politely"],["A","“… you can feel it anywhere, even surrounded by people in a full classroom.”","checks the text again"],["B","So they both think lots of people around you aren’t enough. It’s C, both of them.","paraphrases"]],checks:[["What should you do when speakers separate two similar ideas?","decide which idea each speaker holds. Mateo: “… you can feel it anywhere, even surrounded by people …” Leo: “… numbers aren’t everything …” Different words, same idea, so the answer is “both of them”."],["Which phrase does Leo use to check what Mateo means?","So, in other words, …?"]]},pron:{ref:"Book: Lesson 44, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: endings like **-ly**, **-ness** and **-ful** don’t move the stress (*LONEly → LONEliness*), but **-tion** does (*ISolate → isoLAtion*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ŋ/ (*thing*, *sing*) or /ŋk/ (*think*, *sink*)?","You already know /ŋ/ from Uzbek words like *tong* and *ming*. In *thing*, stop there. In *think*, add a short, clear /k/ at the end.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *isolate*. Which syllable is strong?",""],["A","The first: *IS*-o-late.","a correct first guess"],["T","Good. Now *isolation*.",""],["B","Still *IS*? *IS*-o-la-tion?","a guess"],["T","Remember what *-tion* does.","the teacher gives a clue"],["B","The syllable before *-tion*: i-so-*LA*-tion. The stress moved!","uses the rule"],["T","Great! Now listen: *think*. First or second: *thing* or *think*?",""],["A","Second: *think*. I heard a /k/ at the end.","listens for the ending"]],checks:[["Where is the stress in *loneliness*?","on LONE: LONE-li-ness (-ly and -ness don’t move the stress)."],["Where is the stress in *connection*?","on NEC: con-NEC-tion (the syllable before -tion)."],["Which word ends in /ŋk/: *sing* or *sink*?","*sink*: there is a short /k/ after /ŋ/."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 4**: six parts **without linking words**, and a list of linking words with **two extra** ones.","First put the parts in order. Find the **general position** (*… more connected, but not always closer …*) and the **close**.","Then choose a linking word for each part. Ask what the part does: a positive point (*On the plus side*), an example (*To give an example*), the other side (*However*), a result (*Consequently*) or the close (*On balance*).","Press **✔ Check**. If the order is right but a word is wrong, the app tells you: look at the linking words again.","Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 5** (key words only). Need more help? Go back to **Level 3**."],exTitle:"How Amara’s answer changed in 4/3/2",lines:[["amara","Um, technology … connects, yes … video call is good, my aunt in Lagos, she talks with grandchildren … but, um, people scroll and don’t talk … so, both …","Attempt 1 · 90 s · many pauses"],["amara","Broadly speaking, technology has made us more connected, but not always closer. On the plus side, a video call can bring families together across continents. To give an example, my aunt in Lagos sees her grandchildren in London every Sunday. However, scrolling can take the place of real conversations. Consequently, some people have many online friends and still feel alone. On balance, technology is a bridge, but we have to walk across it.","Attempt 2 · 60 s · linking words"],["amara","Broadly speaking, technology has widened our connections without always deepening them. On the plus side, it works small miracles: my aunt in Lagos watches her grandchildren grow up in London, every Sunday, on her phone. However, endless scrolling can quietly replace the conversations that make friendships strong, and consequently, some people have hundreds of online friends and nobody to call. On balance, technology is a bridge, but we still have to walk across it.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 4?","the parts have no linking words: you choose them from a list with two extra words."],["How many times do you say your own answer?","three times, to three different partners."],["Which linking word introduces a result?","*Consequently, …*"]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks about **people in general**, not about classmates.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How can a new student make friends at university?",lines:[["leo","Well, in the first weeks many new students **feel cut off from** everyone they know. My advice is to **make the first move**: **strike up a conversation** before a lecture, even about the weather. Joining a club really helps to **break the ice**, and slowly you **build a support network**. And if you see someone sitting alone, **reach out to** them: they might be waiting for exactly that. Some people simply **enjoy their own company**, and that’s fine too.","speaker · 1 minute"],["aziza","I heard seven phrases: *feel cut off from*, *make the first move*, *strike up a conversation*, *break the ice*, *build a support network*, *reach out to* and *enjoy their own company*. That’s a full row: **Bingo!**","listener reports"],["leo","Seven points plus three for the Bingo: ten points!","count the points"],["aziza","Next time, try *a sense of belonging*. It’s on my card, and it fits this topic perfectly.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you talk about a classmate’s feelings?","no: talk about people in general, or about fictional examples."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Shall we go through the ideas one by one?*).","Click the lines in order. Each line answers the line before. Amara and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: the new neighbour",lines:[["A","Have you met the new family on the third floor? They don’t know anyone yet.","opens the topic"],["B","Not yet. Shall we take them some bread and say hello?","an idea"],["A","Good idea. And let’s invite them to the courtyard tea on Friday.","agrees + an idea"],["B","Deal. I’ll bake the bread.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School · Hot Seat · section 6",steps:["Make groups of five: **Host, Guest, Interviewer 1, Interviewer 2, Idea keeper** (👥 Class → Groups of 5). Next lesson, the roles move one place.","**Guest cards:** the guest turns over one card and reads it: *My life*, *What I learned*, *My advice*. You are now that guest. Don’t open the **Secret** yet.","**Round 1 · The interview (5 min):** the host introduces the guest and opens question cards one by one. The guest answers in role for about 45 seconds each.","**Round 2 · Letters to the table (4 min):** the host opens a letter. The guest explains what might be happening and gives advice; each interviewer adds one idea or asks a follow-up question.","**Round 3 · Challenge the guest (4 min):** each interviewer challenges the guest with an opinion from the audience. The guest agrees with part of it, explains their view and may reveal the **Secret**.","**Round 4 · Connection idea and score (5 min):** the guest gives a one-minute connection idea for the city. The idea keeper reads the group’s **three ideas**, and the group gives 0–5 points for each criterion, plus one star and one wish."],exTitle:"Sample table: Table Chorsu",lines:[["","Host Aziza · Guest Mateo (as Bakyt Osmonov, shepherd) · Interviewers Leo and Nur · Idea keeper Amara",""],["aziza","Welcome to **the Long Table**! Our first guest spends every summer alone in the mountains with his sheep. Bakyt, **is being alone the same as being lonely?**","host: welcome + first question card"],["mateo","**Not at all.** In the mountains I’m alone for weeks, but I rarely feel lonely. **I chose that life**, and I talk to my family by radio every evening.","guest answers in role"],["","Round 2 · Letters to the table",""],["aziza","A letter from Leila, who works from home: “**Some days I don’t speak to a single person until the evening.**”","host opens a letter"],["mateo","Leila, **that sounds hard, and you’re not the only one**. **One small step could be** to work from a café or a library once a week, just to be among people.","guest: understanding + advice"],["nur","**Could she also** join a class in the evening, so she meets the same people every week?","interviewer adds an idea"],["","Round 3 · Challenge the guest",""],["leo","**Some people would say** that people who like being alone are unfriendly. What do you think?","interviewer challenges"],["mateo","**I’d disagree with that.** Enjoying your own company isn’t the same as disliking people. **And here’s my secret:** I carve small wooden animals for my nieces during the quiet evenings.","guest: disagrees + Secret"],["amara","Our three ideas: a weekly “work together” morning at the library, tea tables in the parks, and a phone line for older neighbours. Scores: understanding 5, practical ideas 4, kind tone 5. Star: the radio calls. Wish: one more idea for young people.","idea keeper: ideas, scores, star, wish"]],checks:[["Who opens the question cards and the letters?","the host."],["What does the guest do in Round 3?","agrees or disagrees with part of the challenge, explains their view and may reveal the Secret."],["Can the group ask a classmate whether they feel lonely?","no: the letters come from fictional people. We talk about people in general."]]},drills:{ref:"Book: Lesson 44 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"She lives alone, but she isn’t lonely: she really ___.",o:["enjoys her own company","loses touch","feels cut off"],a:0},{q:"He’s polite to the neighbours, but he mostly ___.",o:["keeps himself to himself","makes the first move","breaks the ice"],a:0},{q:"When the road was closed by snow, the village felt completely ___ the rest of the country.",o:["cut off from","reached out to","in touch with"],a:0},{q:"Experts use the term ___ when someone has very few contacts with other people.",o:["social isolation","a support network","a lifeline"],a:0},{q:"Joining the choir gave him ___: he finally felt part of something.",o:["a sense of belonging","a constant stream","social isolation"],a:0},{q:"Nobody spoke, so I decided to ___ and say hello.",o:["make the first move","keep myself to myself","lose touch"],a:0},{q:"For many older people living alone, a daily phone call is ___.",o:["a lifeline","an ice","a first move"],a:0},{q:"On the bus, an old man ___ with me about the weather.",o:["struck up a conversation","reached out","cut off"],a:0},{q:"A funny question at the start of the meeting helped to ___.",o:["break the ice","keep in touch","lose touch"],a:0},{q:"In a new city, it takes time to ___ of friends and neighbours.",o:["build a support network","strike up a lifeline","cut off a network"],a:0},{q:"If a friend seems quiet for weeks, ___ them and ask how they are.",o:["reach out to","cut off from","keep to"],a:0},{q:"After school, we moved to different cities and slowly ___ each other.",o:["lost touch with","struck up","reached out"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"She lives alone. She isn’t lonely. → **Although …**",a:"Although she lives alone, she isn’t lonely."},{p:"I moved to a new city. I didn’t know anyone. → **When I …, I …**",a:"When I moved to a new city, I didn’t know anyone."},{p:"He spends a lot of time alone. → **on his own**",a:"He spends a lot of time on his own."},{p:"Call your grandmother more often. → **It would be nice to …**",a:"It would be nice to call your grandmother more often."},{p:"Nobody invited him. → **He wasn’t …**",a:"He wasn’t invited by anybody. / He wasn’t invited. (passive)"},{p:"I haven’t seen my old friend for years. → **We’ve lost …**",a:"We’ve lost touch with each other."},{p:"Talk to her. She might feel better. → **If you …, she might …**",a:"If you talk to her, she might feel better."},{p:"Being alone is not always bad. → **There’s nothing wrong with …**",a:"There’s nothing wrong with being alone sometimes. (with + -ing)"},{p:"Someone should start the conversation. → **Somebody has to …**",a:"Somebody has to make the first move."},{p:"I wish I had more friends here. → **I’d like to …**",a:"I’d like to make more friends here. (make friends, not make friendship)"},{p:"He feels lonely. He doesn’t say it. → **even though**",a:"He feels lonely even though he doesn’t say it."},{p:"Ask for help. Don’t wait. → **The sooner …, the …**",a:"The sooner you ask for help, the better."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"He doesn’t talk to people much.",a:"He tends to keep himself to himself."},{p:"She likes being alone.",a:"She genuinely enjoys her own company."},{p:"They feel far from everyone.",a:"They feel completely cut off from everyone."},{p:"Someone must talk first.",a:"Someone has to make the first move."},{p:"We don’t talk any more.",a:"We’ve lost touch over the years."},{p:"The club made her feel part of the group.",a:"The club gave her a real sense of belonging."},{p:"Phone calls help her a lot.",a:"Those phone calls are a real lifeline for her."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ In a new city, people often feel themselves lonely.",o:["In a new city, people often feel lonely.","In a new city, people often feel themselves alone.","In a new city, people often feel lonelily."],a:0,why:"feel + adjective (no themselves / myself)"},{q:"✗ He misses with his family.",o:["He misses his family.","He misses to his family.","He is missing with his family."],a:0,why:"miss somebody (no preposition)"},{q:"✗ She was very alone after the move.",o:["She was very lonely after the move.","She was very alonely after the move.","She was very much alone feeling after the move."],a:0,why:"alone = without other people (not with very); lonely = the sad feeling"},{q:"✗ I want to make friendship with my new neighbour.",o:["I want to make friends with my new neighbour.","I want to do friendship with my new neighbour.","I want to make a friend to my new neighbour."],a:0,why:"make friends with somebody"},{q:"✗ We keep in touch to our old classmates.",o:["We keep in touch with our old classmates.","We keep in touch for our old classmates.","We keep touch with our old classmates."],a:0,why:"keep in touch with"},{q:"✗ He doesn’t have nobody to talk to.",o:["He doesn’t have anybody to talk to.","He doesn’t have somebody to talk.","He has not nobody to talk to."],a:0,why:"one negative only: doesn’t … anybody (or: has nobody)"},{q:"✗ She spends a lot of time with herself.",o:["She spends a lot of time by herself.","She spends a lot of time with her own.","She spends many time by herself."],a:0,why:"by yourself / on your own = alone"},{q:"✗ Can you help to me with this letter?",o:["Can you help me with this letter?","Can you help for me with this letter?","Can you helping me with this letter?"],a:0,why:"help somebody (no to)"}]},{title:"Stress: being alone and together",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"feeling sad because you are alone",o:["LONEly","loneLY"],a:0},{q:"the feeling of being lonely (noun)",o:["LONEliness","loneLIness"],a:0,why:"-ly and -ness don’t move the stress."},{q:"to keep someone or something apart from others (verb)",o:["ISolate","isoLATE"],a:0},{q:"being kept apart from others (noun)",o:["isoLAtion","ISolation"],a:0,why:"Before -tion, the syllable is strong, so the stress moves."},{q:"a link between people",o:["conNECtion","CONnection"],a:0},{q:"the people who live in one area",o:["comMUnity","COMmunity"],a:0},{q:"being alone in a peaceful way, by choice",o:["SOLitude","solITude"],a:0}]}],Uf={cardsStep:"Guest cards",cardsTitle:"Guest cards",cardsHint:"The guest of each group picks one card face down: it turns over and opens. Read it, close it, and the next guest picks. The host, the interviewers and the idea keeper may read the card too, but nobody opens the Secret before Round 3.",backWord:"Guest",hiddenLabel:"Secret",hiddenAll:"Show all secrets",questionWord:"Question",questionTitle:"Host’s question cards",questionHint:"The host opens one card at a time and asks the guest. Ask at least four questions. Model answers: a Club member plays one of the guests.",questionHelp:{b2:["In my life, I’ve learned that …","For me, being alone means …","The difference is that …"],c1:["Contrary to what many people think, …","What I came to realise is that …","In my experience, what tends to help is …"]},twistWord:"Letter",twistTitle:"Letters to the table",twistHint:"The host opens one letter and reads it aloud. The guest explains what might be happening and gives practical, kind advice. Each interviewer adds one idea or asks a follow-up question. The people who wrote the letters are fictional.",twistHelp:{b2:["That sounds hard, and you’re not the only one.","One small step could be to …","Rather than …, try …"],c1:["What might be going on is …","A small step that often works is …","If the feeling stays with you for weeks, …"]},scoreTitle:"Table score sheet",scoreHint:"After the guest’s connection idea, the host, the interviewers and the idea keeper agree on 0–5 points for each criterion. Then the idea keeper reads the group’s three connection ideas for Reach Out Week, one star and one wish.",scoreCriteria:["Understanding","Practical ideas","Kind tone"],teamWord:"Table",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · The interview",lv:"b2p",bloom:"Understand",by:"aziza",seconds:60,tool:"questions",q:"Host: welcome everyone to the Long Table, introduce your guest and ask questions from the cards. Guest: answer in role, about 45 seconds each: your life, what you learned and what you advise.",help:{b2:["Welcome to the Long Table! Our first guest …","In my life, I’ve learned that …","The difference is that …"],c1:["It’s a real pleasure to welcome …","Contrary to what many people think, …","What I came to realise is that …"]},model:"Good evening, and welcome to the Long Table, the heart of Reach Out Week here in Namangan. Our first guest has spent a whole winter at a research station in the Antarctic, with only a handful of colleagues and months of darkness, so she knows more about isolation than most of us ever will. Valentina, thank you for coming all the way from Chile. Let’s start with a simple question: is being alone the same as being lonely?"},{name:"Round 2 · Letters to the table",lv:"b2p",bloom:"Apply / Analyse",by:"nur",seconds:60,tool:"twists",q:"The host opens **one letter** and reads it aloud. Guest: explain what might be happening and give **one practical, kind piece of advice**. Interviewers: each add one idea or ask a follow-up question.",help:{b2:["That sounds hard, and you’re not the only one.","One small step could be to …","Rather than …, try …"],c1:["What might be going on is …","A small step that often works is …","If the feeling stays with you for weeks, …"]},model:"Sherzod, thank you for writing; that took courage, and you’re far from the only one. What might be going on is that everyone else looks confident, so it seems as if they all found friends on the first day, but many of them feel exactly like you. A small step that often works is to sit in the same place every lecture and say one thing to the person next to you. Then join one club, just one, where you meet the same faces every week. And if the feeling stays with you for weeks and starts to affect your sleep or your studies, talk to the university counsellor."},{name:"Round 3 · Challenge the guest",lv:"c1",bloom:"Evaluate",by:"leo",seconds:60,q:"Interviewers: challenge the guest with an opinion from the audience, for example **“Loneliness is just a feeling: people should get over it.”** · **“Social media has solved loneliness.”** · **“People who like being alone are unfriendly.”** Guest: agree with part of it, explain your own view and reveal your **Secret** if it helps.",help:{b2:["Some people would say that …","I agree up to a point, but …","Actually, here’s my secret: …"],c1:["I’d challenge that slightly: …","There’s a grain of truth in that; however, …","What matters more, I’d argue, is …"]},model:"*(Challenge: “Social media has solved loneliness.”)* There’s a grain of truth in that: social media can keep people in touch across huge distances, and for someone far from home, a message can be a lifeline. However, a hundred likes are not the same as one person who notices that you’re quiet. What matters more, I’d argue, is whether online contact leads to real conversations, by phone or face to face. And here’s my secret: at the research station, we weren’t allowed to send photos home every day, so we wrote long letters instead, and they brought us closer than any post ever did."},{name:"Round 4 · Connection idea and score",lv:"c1",bloom:"Evaluate / Create",by:"amara",seconds:60,tool:"score",q:"Guest: give a one-minute **connection idea** for the city’s Reach Out Week. Idea keeper: read the group’s **three connection ideas**. Then the group gives scores, one star and one wish.",help:{b2:["My idea for the city is …","It would help people who …","And remember: asking for help is …"],c1:["If there’s one thing I’d like the city to try, it’s …","What makes it work is that …","Ultimately, it comes down to …"]},model:"If there’s one thing I’d like the city to try, it’s “tea tables” in every park: a long table, a teapot and a sign saying “Sit down and say hello”, every Saturday afternoon. What makes it work is that nobody needs an invitation and nobody has to explain why they came. Students, grandparents, new families and people who work from home could all sit at the same table. And for anyone who can’t come out, volunteers could phone them instead. Ultimately, it comes down to making the first move easier, because most people are waiting for someone else to make it."}],_f=[{n:"Valentina Ríos",r:"Polar researcher · Chile",look:{skin:"#E8BE98",hair:"#3A2418",style:"bun",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My life","She spent a whole winter at a research station in the Antarctic with a small team, far from everyone else."],["What I learned","Being far away was easy to plan for. Feeling far away was harder: small routines and kind words made the difference."],["My advice","Keep a daily routine with other people in it, even a short one: a shared meal, a walk, a call at the same time every day."]],x:"She can bake bread without a recipe: at the station, she baked every Sunday for the whole team."},{n:"Davron Ibragimov",r:"Long-distance lorry driver · Uzbekistan",look:{skin:"#E3B48C",hair:"#2B1A12",style:"short",beard:!0,top:"#F7C08E",bg:"#FFE4D6"},lines:[["My life","He drives long routes across Central Asia and Europe and is often away from home for weeks."],["What I learned","The road is quiet, but he is rarely lonely: he has learned to enjoy his own company and to stay close to his family from far away."],["My advice","Agree on a regular time to talk with the people you love, and keep it, even when you are tired."]],x:"He keeps a small notebook of the best roadside tea houses on every route, with a short note about the owners."},{n:"Shahnoza Mirzaeva",r:"Telephone volunteer · Uzbekistan",look:{skin:"#E3B48C",hair:"#1E1511",style:"hijab",scarf:"#B7A6F2",bg:"#ECE6FF"},lines:[["My life","Every week, she phones older people in Namangan who live alone and would like someone to talk to."],["What I learned","Many of them don’t want advice. They want someone who remembers what they said last week."],["My advice","Listen more than you speak, and ask about things that matter to the other person: their garden, their memories, their news."]],x:"She writes down one small detail from every call, like the name of a cat or a favourite song, so she can ask about it next time."},{n:"Tariq Nasser",r:"Remote software developer · Jordan",look:{skin:"#D9A47C",hair:"#1C130E",style:"short",glasses:!0,top:"#8ED7B8",bg:"#D6F3E7"},lines:[["My life","He works from home for a company in another country, and he meets his colleagues only on screens."],["What I learned","Working from home gave him freedom, but at first he went days without a real conversation, and he didn’t notice it until he felt low."],["My advice","Build people into your week on purpose: a shared workspace, a sports team or lunch with a friend."]],x:"He plays the oud, and every Thursday he plays with a small group of musicians who don’t know anything about software."},{n:"Bakyt Osmonov",r:"Shepherd · Kyrgyzstan",look:{skin:"#E3B48C",hair:"#1E1511",style:"short",top:"#F5A9BF",bg:"#FFE1EA"},lines:[["My life","Every summer he takes his family’s sheep to the high mountain pastures and lives there alone for weeks."],["What I learned","Being alone by choice can be peaceful. He feels lonelier in a noisy city than on a quiet mountain."],["My advice","Learn the difference between solitude and loneliness: one fills you up, the other empties you."]],x:"He carves small wooden animals for his nieces during the quiet evenings."},{n:"Eilidh MacLeod",r:"Island schoolteacher · Scotland",look:{skin:"#F6DCC8",hair:"#B5562C",style:"long",top:"#F7D774",bg:"#FFF3C4"},lines:[["My life","She teaches at a tiny school on a small island, where the ferry sometimes can’t sail for days in winter."],["What I learned","On the island, everyone notices if someone hasn’t been seen for a while. That habit protects people."],["My advice","Notice the people around you. If someone hasn’t been seen for a while, knock on their door or send a message."]],x:"She keeps a box of board games in her classroom, and on stormy days the whole island is invited to play."},{n:"Hannelore Weiss",r:"Librarian · Austria",look:{skin:"#F2D3B6",hair:"#C9C9C9",style:"bun",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["My life","She runs a “chatting table” in her library: one table where anyone can sit down and talk to a stranger."],["What I learned","Many people are lonely not because nobody likes them, but because nobody gives them a reason to start a conversation."],["My advice","Give people an easy reason to talk: a shared table, a question of the day, a game."]],x:"She can say “Would you like a cup of tea?” in more than twenty languages, and she uses every one of them at the chatting table."},{n:"Marta Kowalczyk",r:"Home-sharing project organiser · Poland",look:{skin:"#F6DCC8",hair:"#5A3A22",style:"curly",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My life","She runs a project where students rent a room in the home of an older person who lives alone, in return for help and company."],["What I learned","Both sides often feel less alone: the student has a home, and the older person has someone to share dinner with."],["My advice","Connect people who need each other, even if they seem very different at first."]],x:"She has a photo album of every pair she has matched, and each pair wrote one sentence about the other on the first page."}],$f=[{t:"Letter from Sherzod, first-year student",q:"“Everyone seems to have made friends in the first week except me. I sit at the back and leave straight after lectures.” What might be happening, and what small steps could help him?",by:"nur",m:"Sherzod, thank you for writing; you’re far from the only one. What might be going on is that everyone else looks confident, so it seems as if they all found friends on day one, but many of them feel exactly like you. A small step that often works is to sit in the same place every lecture and say one thing to the person next to you. Then join one club where you meet the same faces every week. If the feeling stays with you for weeks, talk to the university counsellor."},{t:"Letter from Rafael, exchange student from Peru",q:"“Everyone here is friendly, but I eat dinner alone every evening, and I miss my family’s noisy kitchen.” How could he bring a little of that “noisy kitchen” into his new life?",by:"mateo",m:"Rafael, that sounds hard: the evenings are often when people miss home most. One small step could be to invite two or three people to cook together once a week, maybe a dish from Peru one week and a dish from Uzbekistan the next. Cooking gives everyone something to do, so the conversation starts on its own. And keep a regular call with your family, at the same time every week, so you have something to look forward to."},{t:"Letter from Leila, who works from home",q:"“Some days I don’t speak to a single person until the evening. I like my job, but the days feel very quiet.” What could she change in her week without changing her job?",by:"leo",m:"Leila, you’re not the only one: working from home gives a lot of freedom, but it can take away the small conversations we used to have without trying. Rather than waiting for people to find you, build them into your week on purpose: work from a library or a café twice a week, join an evening class, or have lunch with a friend every Wednesday. Small, regular contact is worth more than one big party a month."},{t:"Letter from Rahima opa",q:"“My children and grandchildren moved to Tashkent for work. They call every Sunday, but the house is very quiet the rest of the week.” How could she feel more connected, both to her family and to people nearby?",by:"aziza",m:"Rahima opa, that sounds hard, and many families know this feeling. One small step could be to ask the grandchildren to send a short voice message every day, not just on Sunday: hearing their voices often helps a lot. Nearby, the mahalla might have a group for neighbours who like gardening, cooking or sewing, and your experience would be welcome there. And maybe a student could visit once a week to learn a family recipe from you."},{t:"Letter from Ravshan aka, a retired engineer",q:"“I worked with the same team for many years. Now I’m retired, and I miss my colleagues and my reasons to get up in the morning.” How could he find new people and new reasons to get up?",by:"amara",m:"Ravshan aka, what might be going on is that work gave you not only colleagues but also a routine and a purpose, and you’ve lost all three at once. A small step that often works is to use your skills in a new way: many schools and youth clubs would love an engineer to help with science projects, and repair cafés need people who can fix things. You’d meet people, and you’d have a reason to get up on those mornings."},{t:"Letter from Gulshan, second-year student",q:"“My best friend has stopped coming out with us. She always says she’s busy. How can I help her without being pushy?” How can a friend help in a kind way, and when is professional help needed?",by:"nur",m:"Gulshan, it’s kind of you to care. Choose a calm moment and say what you’ve noticed, without judging: “We miss you; is everything all right?” works better than “Why are you avoiding us?”. Then invite her to something small, just the two of you, like a walk or a cup of tea. Listen more than you speak. If she seems unhappy for a long time, gently suggest the university counsellor, and offer to go with her. You can support her, but you don’t have to fix it alone."}],ep=[{t:"Your life",q:"Tell us about your life and your work. Why do you know so much about being alone?",by:"aziza",m:"I’m a polar researcher, and I once spent a whole winter at a research station in the Antarctic, with a small team and months of darkness. We couldn’t leave, and nobody could visit. So I’ve thought a lot about being alone. Before I went, I expected to feel lonely all the time. In fact, the hardest days weren’t the darkest ones: they were the days when the team stopped talking to each other."},{t:"Alone or lonely?",q:"Is being alone the same as being lonely?",by:"mateo",m:"Not at all. Being alone is a situation: there’s nobody around you. Loneliness is a feeling: you want more connection than you have. You can be alone on a mountain and feel completely at peace, and you can be in a crowded room and feel very lonely. Many people use the word “solitude” for the good kind of being alone, the kind you choose."},{t:"Who feels cut off?",q:"In your experience, when do people most often feel cut off from others?",by:"nur",m:"Often at moments of change: when they move to a new city, start university, retire or work from home for the first time. Old routines disappear, and new ones haven’t started yet. It can happen to anyone, at any age, and it’s nobody’s fault. The good news is that a change also means a chance to build something new."},{t:"Spotting it",q:"How can we notice that someone around us might be feeling isolated?",by:"leo",m:"Sometimes people stop coming to things they used to enjoy, reply less, or always say they’re busy. But we should be careful not to guess or label anyone. The simplest thing is to stay in touch and ask kindly, without pressure: “I haven’t seen you for a while; would you like to get a tea?” If they say no, ask again another time."},{t:"Screens",q:"Do phones and social media make people more connected or more isolated?",by:"amara",m:"Both, I think. A video call can be a lifeline for someone far from home. But scrolling through other people’s happy photos can make us feel left out, and messages can replace the real conversations that make friendships strong. What matters is how we use them: as a bridge to people, or as a wall between us and the people right next to us."},{t:"Enjoying solitude",q:"Can people learn to enjoy their own company? How?",by:"mateo",m:"Yes, and it’s a skill worth learning. Start with something you enjoy doing alone: walking, reading, cooking or playing music. Do it on purpose, not just while you wait for someone. Over time, being alone stops feeling like an empty space and starts feeling like time for yourself. People who enjoy their own company often find it easier to be good company for others too."},{t:"The first move",q:"Why is it so hard to make the first move, and how can we make it easier?",by:"nur",m:"Because we’re afraid of being rejected, and we often think everyone else already has enough friends. Usually, that isn’t true: many people are waiting for someone else to start. It helps to have an easy reason to talk, like a question about the lecture, a shared activity or a simple invitation. One small conversation is enough for the first step."},{t:"Asking for help",q:"When should someone ask for professional help, and where can they find it?",by:"aziza",m:"If feeling lonely or low lasts for weeks, or starts to affect someone’s sleep, studies, work or appetite, it’s time to talk to a professional: a university counsellor, a doctor or a support line. Friends and family can help by listening without judging and by offering to go along. Asking for help is a sign of strength, not weakness, and the earlier, the better."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Do you prefer to spend your free time alone or with other people?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I like both, but it depends on my mood."],["Point","**The main reason is that** I need time alone to rest, and time with friends to have fun."],["Example","**For example,** after a busy week in Navoi, I spend Saturday morning reading, and in the evening I meet my cousins."],["Close","**So, all in all,** a good weekend for me has a little of both."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"How can a new student make friends at university?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**Honestly, I think the most important thing is** to make the first move, even if it feels strange."],["","**First,** start small: say hello to the person next to you before a lecture."],["","**Then,** join one club or society where you meet the same people every week."],["","**For instance,** at my university in Kuala Lumpur, I made my best friends in the photography club."],["","**On top of that,** say yes to invitations, even when you feel a little shy."],["","**In short,** be brave, be regular and be patient: friendships take time."]],keys:["the most important thing is","first","then","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"mateo",q:"Is it possible to feel lonely in a crowd?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that it’s not only possible but actually quite common."],["","First and foremost, loneliness is about the quality of our connections, not the number of people around us."],["","Equally, in a big city, people can pass hundreds of others every day without speaking to anyone."],["","To illustrate this, a cousin of mine who moved to a big city for work told me that his first months there were the loneliest of his life."],["","Admittedly, a crowd can also be the place where we meet new people."],["","Overall, what protects us from loneliness is not a crowd but a few people who really know us."]],extra:"My cousin’s new flat is on the tenth floor, and it has a great view of the river.",keys:["first and foremost","equally","admittedly","overall"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"Has technology made people more connected or more isolated?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Broadly speaking,","technology has made us more connected, but not always closer."],["On the plus side,","a video call can bring families together across whole continents."],["To give an example,","my aunt in Lagos sees her grandchildren in London every Sunday on her phone."],["However,","hours of scrolling can take the place of real conversations with the people nearby."],["Consequently,","some people have hundreds of online friends and still feel alone."],["On balance,","technology is a bridge, but we still have to walk across it."]],distractors:["Likewise,","In the meantime,"],keys:["more connected, not always closer","a video call","real conversations","a bridge"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"leo",q:"What can a city do to help people feel less isolated?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["places to meet","free and open to everyone","for example","older people and newcomers","volunteers"],model:"I think the most important thing a city can do is to create places to meet: parks with benches, libraries, community centres and squares where people naturally stop and talk. These places should be free and open to everyone, because loneliness often affects people who don’t have much money. For example, in Hamburg some libraries organise language cafés where anyone can come and practise a language over tea. A city could also think especially about older people and newcomers, who are more likely to feel cut off. And finally, it could support volunteers who visit or phone people living alone."}],np={title:"Exam Part 2 practice: helping new students feel at home",situation:"A university in Namangan wants to help new students, including international students, feel at home in their first term. It can choose only one idea: a weekly shared dinner in the student residence, a big club fair in the first week, or a “coffee roulette” that pairs students at random for a chat every Friday. Amara and Mateo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"amara",B:"mateo",lines:[["A","Shall we go through the ideas one by one? The shared dinner sounds lovely."],["B","It does. Cooking and eating together is a great way to break the ice, isn’t it?"],["A","Definitely, but only students who live in the residence would come."],["B","Good point. What about the club fair? Every new student could go."],["A","Yes, but it’s only one day. Would shy students really join a club?"],["B","Maybe not. The coffee roulette might be better for them: nobody has to make the first move."],["A","And they’d meet someone new every week, all term."],["B","So shall we go for the coffee roulette, and add a club fair stand to it?"],["A","Agreed. That way, even the quietest students get a chance to connect."]],phrases:{Start:["Shall we go through the ideas one by one?","…, isn’t it?"],Clarify:["Definitely, but …","Would … really …?"],"Give the turn":["What about …?","Good point."],"Agree and decide":["… might be better for them.","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your faculty wants older people in the neighbourhood to feel less alone. Choose **one** idea: students visit them once a week, a monthly tea afternoon at the university, or a phone call scheme run by student volunteers. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["They feel cut off from …","She enjoys her own company.","Someone has to make the first move.","It helps to break the ice.","a sense of belonging","reach out to someone","We’ve lost touch.","It’s a real lifeline.","strike up a conversation"],B:["He keeps himself to himself.","reach out to someone","build a support network","She enjoys her own company.","social isolation","It helps to break the ice.","It’s a real lifeline.","They feel cut off from …","a sense of belonging"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["They feel cut off from …","She enjoys her own company.","Someone has to make the first move.","It helps to break the ice.","a sense of belonging","reach out to someone","We’ve lost touch.","It’s a real lifeline.","strike up a conversation","He keeps himself to himself.","build a support network","social isolation"],questions:["How can a new student make friends at university?","Is it possible to feel lonely in a crowd? Why (not)?","What can neighbours do for older people who live alone?","Why do some people enjoy their own company more than others?","In Uzbekistan, how do mahallas and families help people stay connected? Is it similar in another country you know?","Do phones bring people closer together or push them apart?"]},op=[{type:"stress",title:"Stress Spot: words about being alone and together",intro:"Tap the stressed syllable. Rules: -ly, -ness and -ful don’t move the stress (LONEly → LONEliness); before -tion, the syllable is strong, so the stress can move (ISolate → isoLAtion). Then listen and say the word.",follow:"Now use two of these words in one sentence about the Long Table.",items:[{w:"lonely",syl:["lone","ly"],s:0},{w:"loneliness",syl:["lone","li","ness"],s:0},{w:"isolate",syl:["i","so","late"],s:0},{w:"isolation",syl:["i","so","la","tion"],s:2},{w:"connect",syl:["con","nect"],s:1},{w:"connection",syl:["con","nec","tion"],s:1},{w:"community",syl:["com","mu","ni","ty"],s:1},{w:"solitude",syl:["sol","i","tude"],s:0}]},{type:"pairs",title:"Sound Pairs: /ŋ/ or /ŋk/?",intro:"Press Play and choose the word you hear. /ŋ/ (thing, sing) is the sound in Uzbek words like tong and ming: stop there, with no /g/ after it. /ŋk/ (think, sink) adds a short, clear /k/. Partner version: one student says a word, the partner points to it.",pairs:[["thing","think"],["sing","sink"],["wing","wink"],["bang","bank"],["sung","sunk"]]}],sp=["Use two C1 phrases in your next answer.","Ask the guest a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Give one idea that would cost the city nothing.","Sum up the guest’s best advice in one sentence."],lp={title:"Step Up Speaking Club podcast: Alone or Lonely?",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Mateo and Leo talk about Mateo’s neighbour in Recife who lives alone but is rarely lonely, why many contacts are not always enough, a classmate at a bus stop and a small habit in Aziza’s mahalla in Navoi.",tip:["Listen for a distinction","Speakers often separate two ideas that sound alike: *living alone* and *feeling lonely*, *many contacts* and *a sense of belonging*. Decide which idea each speaker really holds before you choose. The answer is “both of them” only if both speakers hold the same idea."],A:"mateo",B:"leo",lines:[["A","My neighbour in Recife, Dona Célia, lives alone, but she’s rarely lonely. She **enjoys her own company**: in the mornings she reads and looks after her garden, and she mostly **keeps herself to herself**."],["B","[[0]] living alone and feeling lonely are two different things?"],["A","Exactly. Being alone is her choice. Loneliness is the feeling of being **cut off from** other people. [[1]] you can feel it anywhere, even surrounded by people in a full classroom."],["B","[[2]] People often talk about **social isolation** when someone has very few contacts, and for older people that’s a real risk. But you’re right that numbers aren’t everything. A friend of mine in Hamburg has hundreds of online friends, and she still says she lacks **a sense of belonging**."],["A","So what helps? Often, someone has to **make the first move**. When I moved to a new city, a classmate **struck up a conversation** at the bus stop and invited me to a football game. That simple invitation **broke the ice** and helped me **build a support network**."],["B","[[3]] most people are waiting for someone else to start. [[4]] Aziza’s mahalla in Navoi: neighbours knock on the door of an older person who hasn’t been seen for a few days. It’s a small habit, but for some people it’s **a lifeline**."],["A","And it’s easy to copy. If someone seems quiet, **reach out to** them. And if you’ve **lost touch with** an old friend, send a message today."]],gaps:[[1,"So, in other words,"],[2,"I’d say that"],[3,"I’m with you up to a point."],[4,"That’s mainly because"],[5,"One example is"]],questions:[{q:"Who describes a person who is happy to spend time alone?",o:["Mateo","Leo","both of them"],a:0,why:"Mateo: “She enjoys her own company …” Leo only checks what Mateo means."},{q:"Who thinks that having lots of people around you is not enough?",o:["Mateo","Leo","both of them"],a:2,why:"Mateo: “… you can feel it anywhere, even surrounded by people in a full classroom.” Leo: “… numbers aren’t everything.” Same idea, different words."},{q:"Who talks about a small habit that helps older people?",o:["Mateo","Leo","both of them"],a:1,why:"Leo: “… neighbours knock on the door of an older person who hasn’t been seen for a few days.” Mateo’s neighbour lives alone by choice."},{q:"Who made new friends thanks to a classmate’s invitation?",o:["Mateo","Leo","both of them"],a:0,why:"Mateo: “… a classmate struck up a conversation at the bus stop and invited me to a football game.” Leo’s friend in Hamburg still lacks a sense of belonging."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Leo use to check meaning, and which one to agree only partly?",groups:[["Checking meaning",[1]],["Opinion",[2]],["Agreeing partly",[3]],["Reason",[4]],["Example",[5]]]},use:{q:"Should neighbours check on older people who live alone, or is that too much? Why?",by:"nur",model:"I’d say that neighbours should check on them, as long as they respect their privacy. That’s mainly because an older person who lives alone may not ask for help, even when they need it. One example is my aunt’s building in Kuala Lumpur: every Sunday, one neighbour on each floor knocks on a few doors, just to say hello. Some people say that’s too much and that people want to be left alone. I agree up to a point: a quick hello is enough, not a long visit. So, all in all, a small knock on the door can be a lifeline.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Gf,DIALOGUE:np,DRILLS:Kf,LESSON:Zf,LEVELS:tp,LISTEN:lp,MAIN:Uf,PRON:op,QUESTIONS:ep,ROUNDS:Jf,TWIST
