1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Qf={code:"S3_U06",semester:3,unit:6,title:"Urbanisation: Causes and Effects of Migration to Cities",subtitle:"Why Do People Move to Cities, and What Changes When They Do?",module:2,stage:"Stage 1 · BUILD",level:"B2",sioLevel:1,hero:{tags:[["b2","B2"],["c1","C1 stretch"],["bl","Bloom: Understand → Evaluate"]],title:"City Budget: Kamalak District",paras:["Imagine: **Kamalak** is a new district on the edge of Navoi. Every year, more families move here from villages and small towns to find work and to study. This year the district council has money for **only four of ten projects**. Your team of five is the council: which four projects will make Kamalak a good place to live for **everyone**, newcomers and old neighbours alike?","Think of growing cities from Tashkent to Lagos and São Paulo: when many people arrive at once, a city needs homes, transport, schools, clean water and jobs, all at the same time."],rule:"Rule of respect: no stereotypes about villages, cities or newcomers. We judge projects and arguments, never people’s origin, health or looks."},lock:{prompt:"Read the clues aloud in English and explain each digit to your partner.",clues:["Digit 1: the number of projects the council can pay for this year.","Digit 2: the number of projects that must wait.","Digit 3: the number of students in each council.","Digit 4: the second digit minus the first."],answer:"4652"}},Zf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for the speaker’s purpose, attitude and main point, notice the phrases of cause and effect, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:5,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word stress in long words about cities, and /æ/ or /e/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases of cause and effect. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best phrase they heard (use the wheel)."]},{id:"game",icon:"🏙",name:"City Budget",min:18,lv:"c1",group:"3 councils of 5",kind:"five",roles:["Presenter","Questioner","Note-taker","Timekeeper","Language judge"],desc:"Describe, persuade and decide: which four projects will help the new district of Kamalak grow well? (Book: section 6 · G6)",howto:["15 students = 3 councils of five. All councils play at the same time with their own decision board.","Roles: presenter, questioner, note-taker, timekeeper, language judge. Rotate after each round (👥 Class → Groups of 5).","Rounds: Describe 4 min · Persuade 4 min · Twist 3 min · Decide 3 min. Then each presenter speaks for 1 minute.","Before the lesson, students read the sample game “Council Navoi” (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about traffic in the city centre, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 6, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract, and each asks for something different: a reason for calling, an attitude, a main point or a purpose.","Press **Play the podcast**. You hear four short extracts. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking meaning and describing an effect.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is B. Amara likes Lagos.","gives an answer"],["B","But she says housing is hard. Why B?","asks for evidence"],["A","She says the hard part is housing, but then: “It’s full of chances. It just isn’t cheap.”","uses the text as evidence"],["B","Right: so she sees both sides.","paraphrases"]],checks:[["Why can the first answer you hear be a trap in Part 1?","speakers often mention an idea and then reject it or add “but”. Wait for the end of the extract before you choose."],["Which phrase does Mateo use to check that he has understood?","So are you saying that …?"]]},pron:{ref:"Book: Lesson 6, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the rule: in **-tion** and **-ity** words, the stress falls **just before** the ending: urbani-SA-tion, commu-NI-ty. Careful: **IN**frastructure.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /æ/ or /e/?","Say **both** words. /æ/: drop your jaw and open your mouth wide, as in *land*. /e/: open your mouth only a little, as in *lend*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *population*. Which syllable is strong?",""],["A","*PO*?","a first guess"],["T","Not quite. Listen again: po-pu-LA-tion.","the teacher repeats"],["B","*LA*! It’s just before *-tion*.","uses the rule"],["T","Yes! Everyone, say it and clap on LA: po-pu-LA-tion.","the class repeats"],["T","Now /æ/ or /e/? Listen: *men*. First or second: *man* or *men*?",""],["A","Second: *men*. My mouth is only a little open.","checks the mouth"]],checks:[["Where is the stress in *opportunity*?","on TU: op-por-TU-ni-ty (just before -ity)."],["How do you make /æ/?","drop your jaw and open your mouth wide; the sound is longer and more open than /e/."],["What do you do after a correct answer?","say the word aloud and clap on the stress."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think young people go to cities because … there is more work, and, um, universities … For example, my cousin went to Navoi … So I think it’s for work.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, young people move to cities for better opportunities. The main reason is that cities have more jobs and universities. For example, my cousin moved from a village near Nurata to Navoi to study. So it’s a step towards a better future.","Attempt 2 · 60 s · linking words"],["aziza","In my view, most young people move to cities in search of better opportunities. Cities simply offer more jobs, universities and services than most villages. My cousin, for example, left a village near Nurata to study in Navoi, and now she works at a hospital there. All things considered, the move is a step forward, but it’s rarely an easy one.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ 1 minute** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What happens to a village when many young people leave?",lines:[["nur","**The main cause is** simple: young people go where the jobs are. **As a result,** some villages have mostly older people and children. **This leads to** empty classrooms and fewer customers for local shops. **On the positive side,** many young people send money home, and some come back with new skills. **The downside is that** families see each other less. **In the long run,** villages need good internet and small businesses. **That’s why** online work could really help.","speaker · 1 minute"],["mateo","I heard seven phrases: *The main cause is*, *As a result*, *This leads to*, *On the positive side*, *The downside is that*, *In the long run* and *That’s why*. That’s the middle row: **Bingo!**","listener reports"],["nur","Great! Seven points plus three for the Bingo: ten points.","count the points"],["mateo","Next time, try *One reason is that …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, the city wants …*).","Click the lines in order. Each line answers the line before. Leo and Nur take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **Swap roles** and read again.","**Your own conversation:** press **▶ 2 minutes**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: getting to university",lines:[["A","So, how should we get to the university now that we live further away?","opens the topic"],["B","How about taking a taxi together every morning?","an idea"],["A","Good idea, but it’s quite expensive. What about the new bus? It stops right outside.","reacts + a new idea"],["B","Agreed. Let’s try the bus this week and see how long it takes.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · sample game in section 6",steps:["Make councils of five. Give out five roles: **Presenter, Questioner, Note-taker, Timekeeper, Language judge**. After every round, the roles move to the left.","**Open the budget:** read the clues aloud and find the 4-digit code.","**Round 1 · Describe (4 min):** each student turns over one project card and describes it. The questioner asks one question.","**Round 2 · Persuade (4 min):** two reasons + one example for your project. Disagree politely.","**Round 3 · Twist (3 min):** open one twist card. Does it change your list?","**Round 4 · Decide (3 min):** everyone votes for four projects. Equal votes? One more reason each, then vote again. Click the four winners on the decision board.","**Present (1 min):** the presenter gives the council’s budget and says politely why one project must wait."],exTitle:"Sample game: Council Navoi",lines:[["","Round 1 · Describe — Presenter Aziza · Questioner Leo · Note-taker Amara · Timekeeper Nur · Judge Mateo",""],["aziza","This project is a **new bus line** from Kamalak to the city centre. It would mainly help people without a car: students, workers on early shifts and older neighbours. **Kamalak needs it because** many newcomers spend a long time getting to work.","What does it do? Who does it help? Why now?"],["leo","Why not just build a wider road? **Can you give an example?**","questioner asks one question"],["aziza","A wider road helps people with cars. My cousin doesn’t have one: he walks forty minutes to his bus stop every morning.","a real, personal example"],["","Round 2 · Persuade — Presenter Mateo · Questioner Aziza · Note-taker Leo · Timekeeper Amara · Judge Nur",""],["amara","**First and foremost,** the job centre helps newcomers **make ends meet** from their first month. **On top of that,** people with jobs pay rent and shop locally, so the whole district gains.","two reasons"],["leo","**That’s a fair point, but** couldn’t people just look for jobs online?","polite disagreement"],["amara","Not everyone can. In Lagos I saw volunteers helping people write their first CV. **In the long run,** a small centre like that changes lives.","the example wins the point"],["","Round 3 · Twist — Presenter Nur · Questioner Mateo · Note-taker Aziza · Timekeeper Leo · Judge Amara",""],["nur","Our twist card says: **“Heavy rain floods several streets in Kamalak overnight.”**","twist card"],["mateo","**Picture this:** families can’t get to work, and the water gets into the flats. Clean water and drainage must go to the top of our list.","a reason"],["","Round 4 · Decide — Presenter Amara · Questioner Nur · Note-taker Mateo · Timekeeper Aziza · Judge Leo",""],["leo","Feedback: two stars, Amara’s Lagos example and Mateo’s *“Picture this”*. One wish: we said *“because”* in every sentence; next time, try *“This is mainly due to …”*.","language judge"],["amara","**On balance,** our council chose clean water and drainage, affordable housing, the bus line and the job centre. **Together they give** newcomers a safe home, a way to get around and a way to earn a living. **It was a hard choice** to leave out the village fund, so we suggest it as the first project next year.","presenter · 1 minute"]],checks:[["Who asks a question after each speaker?","the questioner."],["How many votes does each student have in Round 4?","four: one for each project."],["What happens if projects have the same number of votes?","each side gives one more reason; then vote again between those projects only."]]},drills:{ref:"Book: Lesson 6 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Many young people leave ___ because there is little work in winter.",o:["rural areas","traffic congestion","the cost of living"],a:0},{q:"My cousin moved to Tashkent for better ___: he wants to become an engineer.",o:["prospects","housing","pressure"],a:0},{q:"Rent, food and transport are expensive here: ___ is much higher than in my village.",o:["a close-knit community","the cost of living","affordable housing"],a:1},{q:"In his first year in the city, he worked two jobs just to ___.",o:["settle in","leave behind","make ends meet"],a:2},{q:"The council wants to build ___, so that young families can pay the rent.",o:["affordable housing","rural areas","job opportunities"],a:0},{q:"It took me a few months to ___ in my new neighbourhood.",o:["put pressure","settle in","make ends meet"],a:1},{q:"Fast growth can ___ schools, clinics and buses.",o:["leave behind","settle in","put pressure on"],a:2},{q:"In the rush hour, ___ makes a short trip take an hour.",o:["traffic congestion","a close-knit community","better prospects"],a:0},{q:"In my grandparents’ village there is a ___: everybody helps everybody.",o:["cost of living","close-knit community","job opportunity"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"My cousin moved to Navoi. → **Tashkent**",a:"My cousin moved to Tashkent."},{p:"My cousin moved to Tashkent. → **to find a job**",a:"My cousin moved to Tashkent to find a job."},{p:"My cousin moved to Tashkent to find a job. → **a question: Why …?**",a:"Why did your cousin move to Tashkent?"},{p:"The city is growing fast. → **Our district**",a:"Our district is growing fast."},{p:"Our district is growing fast. → **present perfect: … a lot in the last few years**",a:"Our district has grown a lot in the last few years."},{p:"Our district has grown a lot in the last few years. → **a question: How much …?**",a:"How much has our district grown in the last few years?"},{p:"New buses would reduce traffic congestion. → **A metro line**",a:"A metro line would reduce traffic congestion."},{p:"A metro line would reduce traffic congestion. → **if: If the city built …**",a:"If the city built a metro line, it would reduce traffic congestion."},{p:"If the city built a metro line, it would reduce traffic congestion. → **a negative: didn’t build**",a:"If the city didn’t build a metro line, traffic congestion would get worse."},{p:"It’s hard to make ends meet in the city. → **for students**",a:"It’s hard for students to make ends meet in the city."},{p:"It’s hard for students to make ends meet in the city. → **past: in my first year**",a:"It was hard for me to make ends meet in my first year in the city."},{p:"It was hard for me to make ends meet in my first year in the city. → **a question: Was it …?**",a:"Was it hard for you to make ends meet in your first year in the city?"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"People go to cities because there are more jobs.",a:"This is mainly due to the job opportunities that cities offer. / The main driving force is work."},{p:"So the buses are very full.",a:"As a consequence, buses are often overcrowded."},{p:"This makes rents go up.",a:"This drives up rents. / This leads to higher rents."},{p:"A good thing is that people meet new ideas.",a:"On the plus side, newcomers bring new skills and ideas."},{p:"A bad thing is that villages become empty.",a:"The downside is that some villages lose their young people."},{p:"Later, this will be a big problem.",a:"In the long run, this could become a serious problem."},{p:"I think the city must plan better.",a:"I’d argue that the city needs to plan more carefully for growth."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ My brother moved in Tashkent last year.",o:["My brother moved to Tashkent last year.","My brother moved at Tashkent last year.","My brother was moved to Tashkent last year."],a:0,why:"move to a place"},{q:"✗ I live in Navoi since three years.",o:["I am living in Navoi since three years.","I’ve lived in Navoi for three years.","I live in Navoi for three years."],a:1,why:"present perfect + for (a period of time)"},{q:"✗ Life in city is more expensive.",o:["The life in city is more expensive.","Life in a city is more expensive.","Life in city is more expensiver."],a:1,why:"a city (any city) or the city (this city)"},{q:"✗ There are many peoples in the bus.",o:["There are many people on the bus.","There is many people on the bus.","There are much people in the bus."],a:0,why:"people is plural; on the bus"},{q:"✗ In the village there is not jobs.",o:["In the village there are not job.","In the village there isn’t no jobs.","In the village there aren’t many jobs."],a:2,why:"jobs is plural: there aren’t (many) jobs"},{q:"✗ Rent in the city is more higher.",o:["Rent in the city is more high.","Rent in the city is higher.","Rent in the city is most higher."],a:1,why:"higher already means “more high”."},{q:"✗ My parents want that I stay in the village.",o:["My parents want me to stay in the village.","My parents want me stay in the village.","My parents want that me stay in the village."],a:0,why:"want somebody to do something"},{q:"✗ I need an information about buses.",o:["I need informations about buses.","I need some information about buses.","I need a informations about buses."],a:1,why:"information is uncountable: some information"}]},{title:"Stress: word families",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"migrate → noun",o:["MIgration","miGRAtion","migraTION"],a:1,why:"Just before -tion."},{q:"urban → noun (the process)",o:["urbaniSAtion","URbanisation","urBAnisation"],a:0,why:"The stress moves: URban → urbaniSAtion."},{q:"populate → noun",o:["POpulation","populaTION","popuLAtion"],a:2},{q:"environment → adjective",o:["enVIronmental","environMENtal","ENvironmental"],a:1,why:"The stress moves: enVIronment → environMENtal."},{q:"community",o:["comMUnity","COMmunity","communiTY"],a:0,why:"Just before -ity."},{q:"infrastructure",o:["infraSTRUCture","INfrastructure","inFRAstructure"],a:1,why:"An exception: the stress is on the first syllable."}]}],Yf={lockStep:"Open the budget",lockTitle:"Open the council’s budget file",lockOk:"The budget file is open! Go to the project cards.",cardsStep:"Project cards",cardsTitle:"Project cards",cardsHint:"Each student picks a card: it turns over and opens. Read it, close it, and the next student picks. Everyone takes one or two projects to describe in Round 1.",backWord:"Project",hiddenLabel:"Think about",hiddenAll:"Show all “Think about” questions",twistTitle:"Twist cards",twistHint:"Open one card. Your council discusses how it changes your list.",twistWord:"Twist",twistHelp:{b2:["Because of this card, we should …","I think we can keep …, but …","Maybe we could swap … for …"],c1:["In light of this, it might make sense to …","This changes our priorities, because …","What if we replaced … with …?"]},voteTitle:"Decision board",voteHint:"Each council member votes for four projects (one vote each). Count the votes with + and −, then click the four winners to put them in the budget. Equal votes? One more reason each, then vote again between those projects only.",capacity:4,teamWord:"Council",teamIcon:"",teamKind:"five",teams:3,doneText:"Now the presenter explains the council’s budget."},Jf=[{name:"Round 1 · Describe",lv:"b2",bloom:"Understand",by:"aziza",seconds:60,q:"Choose one project card. Describe it: what does it do, who does it help, and why does Kamalak need it?",help:{b2:["This project would …","It would mainly help …","Kamalak needs it because …"],c1:["The idea behind this project is to …","The people who would benefit most are …","Without it, …"]},model:"This project is a new bus line from Kamalak to the city centre. It would connect the new blocks of flats with the university, the bazaar and the hospital. It would mainly help people who don’t have a car: students, workers on early shifts and older neighbours. Kamalak needs it because many newcomers spend a long time getting to work, and some of them miss job opportunities in the centre."},{name:"Round 2 · Persuade",lv:"b2p",bloom:"Evaluate",by:"amara",seconds:60,q:"Why should your project be one of the four? Give two reasons and an example.",help:{b2:["First and foremost, …","On top of that, …","If we don’t pay for it, …"],c1:["The strongest argument for … is that …","It’s worth bearing in mind that …","In the long run, this project would …"]},model:"First and foremost, a job centre helps newcomers to make ends meet from their very first month in Kamalak. On top of that, it helps the whole district: people with jobs can pay rent, shop locally and support their families. For example, in Lagos I saw a small centre where volunteers helped people write their first CV and prepare for interviews. It’s worth bearing in mind that a job centre is cheap compared with a new building, but in the long run it can change many lives."},{name:"Round 3 · Twist",lv:"b2p",bloom:"Analyse",by:"leo",seconds:0,tool:"twists",q:"Open a twist card. Does it change your list? Which projects should stay, and why?",help:{b2:["Because of this card, we should …","I think we can keep …, but …","Maybe we could swap … for …"],c1:["In light of this, it might make sense to …","That’s a fair point, but …","What if we replaced … with …?"]},model:"Hold on: if heavy rain can flood our streets, clean water and drainage can’t wait. I’d move it to the top of our list, because a flood affects every family in Kamalak, old and new. Maybe we could swap the park for drainage this year and plant trees along the new drains next year."},{name:"Round 4 · Decide",lv:"c1",bloom:"Evaluate / Create",by:"nur",seconds:0,tool:"decide",q:"Agree on four projects. Explain your choice and politely say why one project must wait.",help:{b2:["We’d choose … because together they …","We really liked …, but …","It was a hard choice."],c1:["On balance, …","Taking everything into account, …","… could be our first project next year."]},model:"On balance, we’d choose affordable housing, clean water and drainage, the new bus line and the job centre. Together they give newcomers a home, a safe district, a way to get around and a way to make ends meet. We really liked the fund for villages, but it was a hard choice: it helps people outside Kamalak, so we suggest asking the region to support it next year."}],_f=[{e:"🏠",n:"Affordable housing",r:"Housing",lines:[["What it does","Builds blocks of flats with low rents for families and young workers."],["Who it helps","Newcomers who now share small, crowded flats."]],x:"If rents are low, will even more people move to Kamalak? Is that good or bad?"},{e:"🚌",n:"A new bus line",r:"Transport",lines:[["What it does","Runs from early morning to late evening between Kamalak, the city centre, the university and the bazaar."],["Who it helps","Students, workers and anyone without a car."]],x:"Would a bus line help more people than a wider road for cars?"},{e:"🏫",n:"A new school",r:"Education",lines:[["What it does","Opens a school, so that classes are smaller and pupils don’t have to study in two shifts."],["Who it helps","Families with children, and teachers who now have very large classes."]],x:"What makes a district a good place to grow up in?"},{e:"🩺",n:"A family clinic",r:"Health care",lines:[["What it does","Opens a clinic with doctors and nurses close to the new blocks of flats."],["Who it helps","Everyone who now travels across the city to see a doctor."]],x:"Should every new district have a clinic before it has new shops?"},{e:"🌳",n:"A park with trees",r:"Green space",lines:[["What it does","Turns an empty plot of land into a park with shade, benches and a playground."],["Who it helps","Everyone, especially in the hot summer months."]],x:"Is a park a luxury or a need in a hot, fast-growing district?"},{e:"💼",n:"A job centre for newcomers",r:"Work",lines:[["What it does","Helps people find work, write a CV and learn about their rights at work."],["Who it helps","New arrivals from villages and small towns."]],x:"Should newcomers get special help, or should everyone get the same help?"},{e:"🌾",n:"A fund for villages",r:"Villages",lines:[["What it does","Gives money to nearby villages for small businesses, internet and repairs, so that fewer people have to leave."],["Who it helps","Families who would like to stay in their village."]],x:"Is it better to help people move, or to help them stay?"},{e:"🚰",n:"Clean water and drainage",r:"Water",lines:[["What it does","Brings clean tap water to every new block and builds drains for heavy rain."],["Who it helps","Every family in Kamalak, old and new."]],x:"Why do people often forget about the things they can’t see, like pipes and drains?"},{e:"♻️",n:"A recycling centre",r:"Environment",lines:[["What it does","Collects plastic, paper and glass, so that less rubbish ends up in landfill."],["Who it helps","The whole district, and the land and air around it."]],x:"Who should pay for rubbish: the city, the shops or the people?"},{e:"🎓",n:"An evening college",r:"Skills",lines:[["What it does","Offers evening classes in languages, computers and practical skills like electrical work."],["Who it helps","Adults who work during the day and want a better job."]],x:"Can learning change a person’s life faster than a new building?"}],$f=[{t:"Heavy rain floods several streets in Kamalak overnight.",q:"Which project would help most now? Does your list change?",by:"leo",m:"Hold on: this changes our priorities. If the streets flood, families can’t get to work or school, and the water can get into homes. I’d move clean water and drainage to the top of our list, because it protects everyone. Maybe we could swap the park for drainage this year and plant the trees next year."},{t:"A new factory will open near Kamalak next year. It needs workers with practical skills.",q:"Which projects help local people get these jobs? Which ones become more urgent?",by:"mateo",m:"Picture this: the factory opens, but the best jobs go to people from other cities, because nobody in Kamalak has the right skills. That’s why I’d move the evening college into our four. The bus line matters, too, because workers need to get to the factory on time. I’d take out the recycling centre for now, although it’s a hard choice."},{t:"People from a nearby village write to the council: “Our young people are leaving. Please help us, too.”",q:"Answer them. Should Kamalak’s money help a village? Why or why not?",by:"nur",m:"What if helping the village also helps Kamalak? If the village has good internet and small businesses, fewer families will have to move here in a hurry, and there will be less pressure on our schools and clinics. So I’d argue for the fund for villages, even if one project in Kamalak has to wait a year."},{t:"The budget shrinks: only three projects this year.",q:"Which project would you remove, and why?",by:"aziza",m:"Let’s break it down step by step. Housing and clean water are basic needs, so they stay. Between the bus line and the job centre, I’d keep the bus line, because it also takes people to jobs in the city centre. It wasn’t an easy choice, but the job centre could start small, with volunteers in the mahalla office."}],ep=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why do so many young people move from villages to cities?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** most young people move to cities because they are looking for better opportunities."],["Point","**The main reason is that** cities offer more jobs, universities and services than most villages."],["Example","**For example,** my cousin moved from a village near Nurata to Navoi to study, and now she works at a hospital there."],["Close","**So, all things considered,** moving to a city is often a step towards a better future, but it is rarely easy."]],keys:["in my view","better opportunities","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Is life in a big city better than life in the countryside?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say it depends on what you need, **although** cities clearly offer more choice."],["","**First of all,** in a city you can usually find work, study and entertainment close to home."],["","**For instance,** when my aunt moved from a small village to Hamburg, she could finally study in the evening after work."],["","**However,** city life is often more expensive and more stressful, and many people miss nature."],["","**That’s why** some of my friends now work online from their home villages."],["","**In short,** the city is better for some things, and the countryside for others."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"nur",q:"Should governments try to stop people from moving to big cities?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Honestly, I don’t think governments should stop people from moving, because everyone has the right to choose where they live."],["","What they can do, though, is make life in smaller towns more attractive."],["","If villages have good schools, clinics and fast internet, fewer people will feel they have to leave."],["","In Malaysia, for example, I know young people who run small online businesses from their home towns."],["","At the same time, cities must prepare for newcomers with enough housing and transport."],["","So, in a nutshell, the answer is not to stop migration, but to manage it wisely."]],extra:"My favourite thing about Kuala Lumpur is the night markets, especially the food stalls.",keys:["make … more attractive","at the same time","manage it wisely","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"What are the effects of fast urbanisation on a city?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think fast urbanisation brings both opportunities and problems."],["On the one hand,","a growing city attracts new businesses, skills and ideas."],["For instance,","in Lagos, where I grew up, many young people are starting their own companies."],["On the other hand,","if housing and transport don’t grow as fast as the population, traffic congestion and overcrowding follow."],["That’s why","good planning matters as much as new buildings."],["Ultimately,","a city grows well only when it grows for everyone."]],distractors:["Similarly,","In addition,"],keys:["opportunities and problems","on the one hand","good planning","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"What will cities look like in fifty years?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["greener and smarter","more people, less space","picture this","cities for people, not cars","the choices we make now"],model:"I think cities in fifty years will be greener and smarter, but probably more crowded, too: more people will have to share less space. Picture this: instead of car parks, there are parks and cycle lanes, and quiet electric buses come every few minutes. In São Paulo, where I’m from, traffic is part of daily life, so I’d love to see cities designed for people, not cars. However, this future won’t happen by itself. It depends on the choices we make now: where we build homes, how we travel and how we share our streets."}],tp={title:"Exam Part 2 practice: less traffic in the city centre",situation:"The city wants one idea to reduce traffic in the centre of Navoi. There are three ideas: a new bus line, a bike-sharing scheme, or a car-free Sunday every week. Leo and Nur are discussing them. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"nur",lines:[["A","So, the city wants one idea to reduce traffic in the centre. Shall we start with the new bus line?"],["B","Sure. It would help, but wouldn’t it take a long time to plan the route and build the stops?"],["A","Sorry, do you mean that people would have to wait too long for any change?"],["B","Exactly. What do you think about a bike-sharing scheme? It’s cheaper and quicker to start."],["A","I like it, but summers here are very hot. Not everyone can cycle in that heat, can they?"],["B","That’s a fair point. ct 1.* Hi Mateo, it’s Amara. I’m planning our Club talk about moving to the city. Aziza says her cousin Dilshod left his village near Nurata for Navoi last autumn. Like many young people from **rural areas**, he went for **job opportunities** and **better prospects**. Could we invite him to speak on Thursday? Let me know!"],["B","*Extract 2.* Amara, you grew up in Lagos. Is it easy for newcomers there?"],["A","Not really. [[0]] the hardest part is finding **affordable housing**. [[1]] the number of people who arrive every year. [[2]] my cousin, [[3]]: he shared one room with two friends for a year before he could **settle in**."],["B","[[4]] Lagos is a bad place for newcomers?"],["A","No! It’s full of chances. It just isn’t cheap."],["B","*Extract 3.* In São Paulo, where I studied, people arrived faster than the city could build. Newcomers **put pressure on** buses, schools and clinics. [[5]] **traffic congestion** is part of daily life, and buses in the rush hour are **overcrowded**. On top of that, **the cost of living** keeps rising, so many young workers can hardly **make ends meet**."],["A","*Extract 4.* My uncle **left behind** a village in the east of Nigeria where everyone knew his name. Lagos gave him work, and he’s proud of that. But he still misses the **close-knit community** he grew up in, so he goes home every December and calls his old neighbours every Sunday."]],gaps:[[1,"As I see it,"],[2,"This is mainly due to"],[3,"Take"],[3,"for instance"],[4,"So are you saying that"],[5,"As a consequence,"]],questions:[{q:"Extract 1. Why is Amara calling Mateo?",o:["to tell him that she is moving to Navoi","to ask if they can invite Dilshod to speak at the Club","to ask him about jobs in Nurata"],a:1,why:"“Could we invite him to speak on Thursday? Let me know!”"},{q:"Extract 2. What is Amara’s attitude to Lagos?",o:["She thinks newcomers should not go there.","She thinks it offers many chances, although housing is expensive.","She thinks finding a room there is
