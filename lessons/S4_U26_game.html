**one piece of evidence is not what it seems**."],rule:"Rule of respect: this is a fictional case, and nobody is hurt. Question the evidence, never a classmate, and never judge the people in the case by their looks or where they come from."}},Kf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Two Club speakers on the podcast (exam Part 3): who says what? Mateo and Aziza both have a cousin who works with forensic evidence, in São Paulo and in Tashkent. Are crime dramas anything like the real job? Listen for a question, not an opinion, notice how Aziza checks meaning and disagrees politely, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read statements 1–4 first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Amara, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about crime series and how science works, not about real crimes they know of.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress that moves in word families (ANalyse → aNALysis), and consonant groups: blow or below? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: build your own answer to “Can evidence ever lie?” from a chain of key words only, then say it three times, faster each time. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support go back to Level 4 or 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners (90, 60, 45 seconds).","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about evidence, investigations and jumping to conclusions. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most convincing argument they heard (use the wheel)."]},{id:"game",icon:"🔎",name:"The Empty Case",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Expert and timekeeper","Expert","Expert","Expert","Expert and note-taker"],desc:"Hidden Roles (Detective): each expert holds one secret piece of evidence. Report it, cross-examine each other, read the lab reports, build a case theory and find the hidden rookie whose evidence was contaminated. (Book: section 6 · Game School: Hidden Roles)",howto:["15 students = 3 teams of exactly five (👥 Class → Groups of 5): the case needs all five expert cards. A group of four? One student holds two cards. A sixth student is the Chief Inspector, who chairs the team and keeps time.","Secret cards: one phone per team, passed from student to student, or print the cards and cut them up. After a team has picked, press “Turn all back” for the next team.","Rounds: Briefing 2 min · Cross-examination 4 min · Lab reports 3 min · Case theory 3 min · Reveal and reflect 4 min.","The Expert’s Oath: you may keep quiet about your lab notebook, but you may never lie when someone asks you a direct question."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about protecting a museum exhibition, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 56, section 2 · Listen and Notice",steps:["**Before you listen:** read statements 1–4 and guess who probably said each one: Mateo, Aziza or both of them.","Press **Play the podcast**. Listen for a question, not an opinion: _Do you mean to say that …?_ checks an idea; it does not agree with it. Listen to the reply. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, checking meaning, example and disagreeing politely.","**Your turn:** listen to Amara, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Number 3 is B. Aziza talks about a trace too.","gives an answer"],["B","She does, but does she say it, or does she ask it?","challenges politely"],["A","“Do you mean to say that a trace proves that someone did it?” And Mateo: “No, not at all. It shows that someone was there, not what they did.”","checks the text again"],["B","So Aziza only asks; the view is Mateo’s. It’s A.","paraphrases"]],checks:[["Why should you listen for a question, not an opinion?","a speaker who checks meaning is asking, not agreeing. Aziza asks “Do you mean to say that a trace proves that someone did it?”, and Mateo answers “No, not at all.”"],["Which phrase does Aziza use to disagree politely?","I’d be careful about saying that …"]]},pron:{ref:"Book: Lesson 56, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: in word families the stress can **move**: *ANalyse → aNALysis*, *inVEStigate → investiGAtion*. Before **-tion**, the syllable is strong.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: a **consonant group** (*blow*, *plight*) or a word with a **vowel between** (*below*, *polite*)?","In *blow*, the /b/ and the /l/ go together, with no vowel between them. Don’t say “b-low” or “i-blow”.","Pairs: Student A says one word from a pair; Student B says “group” or “vowel”. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *analyse*. Which syllable is strong?",""],["A","The first one: *AN*-a-lyse.",""],["T","Good. Now *analysis*.",""],["B","Still *AN*? *AN*-a-ly-sis?","a guess"],["T","Listen again: the stress moves in this family.","the teacher gives a clue"],["B","a-*NAL*-y-sis. The second syllable!","listens and corrects"],["T","Great! Now listen: *blow* or *below*?",""],["A","*Blow*: one syllable, the /b/ and the /l/ together.","listens for the group"]],checks:[["Where is the stress in *investigation*?","on GA: in-ves-ti-GA-tion (the syllable before -tion)."],["Where is the stress in *evidence*?","on EV: EV-i-dence."],["How many syllables are there in *prayed*?","one: /preɪd/. *Parade* has two."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences**, only a **chain of key words**.","Plan in 30 seconds: what is your **position**, which key word gives the **other side**, which one is your **example**, and how will you **close**?","Add your own linking phrases: *Strictly speaking … · Take … · The trouble is … · That is why … · In the end …*","Then go to **Say it: 4/3/2**: answer three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language tighter each time.","At the end, compare your answer with the **model answer**. Steal one phrase you like.","Need more support? Go back to **Level 4** (choose the linking words) or **Level 3**."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Evidence … it doesn’t lie, I think, but people … they read it wrong? Like, a fingerprint, it says you were there, not what you did … and samples get dirty … and people decide too fast …","Attempt 1 · 90 s · many pauses"],["leo","Strictly speaking, evidence doesn’t lie, but people read it. Take a fingerprint: it shows you were there, not what you did. The trouble is that samples can be contaminated, and people jump to conclusions. That is why everything should be checked twice.","Attempt 2 · 60 s · linking phrases"],["leo","Strictly speaking, evidence never lies; the people who read it sometimes do, or at least they get it wrong. A fingerprint places you at a scene, but it says nothing about what you did there. The trouble is that samples get contaminated and investigators jump to conclusions. In the end, evidence is only as honest as the checks behind it.","Attempt 3 · 45 s · same ideas, tighter language"]],checks:[["What is new at Level 5?","there are no sentences: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners: 90, 60 and 45 seconds."],["Which phrase brings in a problem?","*The trouble is that …* (then give your answer with *That is why …*)."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is forensic science on TV realistic?",lines:[["amara","Not really. On TV, a detective walks onto **the crime scene**, finds one hair and **solves the case** before the adverts. In reality, experts **collect evidence** slowly and carefully, because it’s so easy to **contaminate a sample**. And they don’t **jump to conclusions**: they **follow every lead**, **rule out** suspects one by one and then **piece together** what happened. Real forensic work is patient, not dramatic.","speaker · 1 minute"],["mateo","I heard eight phrases: *the crime scene*, *solve the case*, *collect evidence*, *contaminate a sample*, *jump to conclusions*, *follow a lead*, *rule out* and *piece together*. That’s a full row: **Bingo!**","listener reports"],["amara","Eight points plus three for the Bingo: eleven points!","count the points"],["mateo","Next time, try *a solid alibi*. It’s on my card, and it would fit your point about ruling people out.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Should you describe real crimes in detail?","no: talk about evidence and investigation in general, or about the fictional case."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Shall we start with the cameras?*).","Click the lines in order. Each line answers the line before. Aziza and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: the missing charger",lines:[["A","Luana, the lab charger has gone again. Shall we lock it in the cupboard?","opens the topic"],["B","Maybe, but then nobody can use it in the evening. What about a sign-out sheet?","a doubt + an idea"],["A","Good idea. Name, time out, time back.","agrees + adds detail"],["B","Deal. Sheet first, cupboard if it disappears again.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School: Hidden Roles · section 6",steps:["Make teams of five. One at a time, each student picks an **expert card**, reads it alone and closes it: the card turns back and shows **Taken**. Then open your **lab notebook** and read it too.","**Keep your card secret.** Don’t show your screen; you will **report** your evidence in your own words. **The Expert’s Oath:** you may keep quiet about your notebook, but you may **never lie** when someone asks you a direct question.","**Round 1 · Briefing (2 min):** each expert reports their finding in two or three sentences. The note-taker writes it on the case board (book, section 6). No conclusions yet.","**Round 2 · Cross-examination (4 min):** open a question card, choose an expert and ask. Listen for **how** each piece of evidence was collected.","**Round 3 · Lab reports (3 min):** open the lab reports one by one. After each one, say what it **rules in** or **rules out**.","**Round 4 · Case theory (3 min):** agree who opened the case, when, where the astrolabe is now, whether it was a theft, and **which evidence you trust least**. Use *must have*, *might have*, *can’t have*.","**Round 5 · Reveal and reflect:** turn the cards over and read every lab notebook aloud. Did you find the hidden rookie?"],exTitle:"Sample game: Team Beacon practises on a small case (a charger missing from the library)",lines:[["","Practice case · Cross-examination — Chief Inspector Aziza · Experts Leo, Nur, Amara, Mateo",""],["aziza","Nur, you found a fingerprint on the cupboard. **How exactly did you collect it?**","opens a question card: How did you collect it?"],["nur","I dusted it, photographed it and lifted it with fresh tape. **I followed the procedure to the letter.**","a reliable expert answers"],["amara","Mateo, **who else could have touched** the cupboard before you got there?","a second question"],["mateo","Well, it’s the library cupboard, so … quite a lot of people. **I can’t rule out** that the print is days old.","admits a limit"],["leo","So the print **places someone there**, but it **doesn’t prove** they took the charger.","draws a careful conclusion"],["aziza","Agreed. **It might have been** anyone with a library card. Let’s **not jump to conclusions** until the lab reports.","hedges (C1)"]],checks:[["Can you show your expert card to the team?","no: report it in your own words."],["What is the Expert’s Oath?","you may keep quiet about your notebook, but you may never lie to a direct question."],["What must the team decide in Round 4?","who, when, where the astrolabe is, whether it was a theft, and which evidence they trust least."]]},drills:{ref:"Book: Lesson 56 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Zf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Nobody may enter ___ until the experts have finished.",o:["the crime scene","the solid alibi","the reasonable doubt"],a:0},{q:"The team wore gloves to ___ without damaging anything.",o:["collect evidence","jump to conclusions","rule out"],a:0},{q:"Every contact ___, even if it is invisible.",o:["leaves a trace","solves the case","follows a lead"],a:0},{q:"If you use dirty tools, you may ___.",o:["contaminate a sample","piece together","rule out a suspect"],a:0},{q:"The camera shows he was at home, so we can ___ him ___.",o:["rule … out","piece … together","leave … a trace"],a:0},{q:"Slowly, the detectives ___ what happened that night.",o:["pieced together","contaminated","followed up with"],a:0},{q:"Don’t ___: one footprint proves nothing.",o:["jump to conclusions","leave a trace","collect evidence"],a:0},{q:"She was on a train all evening: she has ___.",o:["a solid alibi","a crime scene","a lead"],a:0},{q:"A motive and an opportunity are only ___.",o:["circumstantial evidence","a solid alibi","a clean sample"],a:0},{q:"After six months, the police finally ___.",o:["solved the case","left a trace","jumped to conclusions"],a:0},{q:"A witness saw a blue van, so the team decided to ___.",o:["follow that lead","rule out that lead","contaminate that lead"],a:0},{q:"In many countries, guilt must be proved ___.",o:["beyond reasonable doubt","by circumstantial evidence","at the crime scene"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I’m sure he took it. → **must have**",a:"He must have taken it."},{p:"He must have taken it. → **It’s impossible: can’t have**",a:"He can’t have taken it."},{p:"Maybe she opened the case. → **might have**",a:"She might have opened the case."},{p:"Someone opened the case. → **passive: The case …**",a:"The case was opened (by someone)."},{p:"The case was opened. → **between 22:35 and 23:05**",a:"The case was opened between 22:35 and 23:05."},{p:"They didn’t wear gloves, so they contaminated the sample. → **If they had …**",a:"If they had worn gloves, they wouldn’t have contaminated the sample. (third conditional)"},{p:"The fingerprint is important. → **What matters most is …**",a:"What matters most is the fingerprint."},{p:"We checked the evidence, and then we decided. → **Only after …**",a:"Only after we had checked the evidence did we decide. (inversion)"},{p:"The print shows he was there. It doesn’t show what he did. → **not …, but …**",a:"The print shows not what he did, but only that he was there."},{p:"We need more evidence. → **uncountable: a piece of …**",a:"We need one more piece of evidence."},{p:"The guard has an alibi. → **so we can …**",a:"The guard has an alibi, so we can rule him out."},{p:"It is possible that the sample was contaminated. → **The sample may …**",a:"The sample may have been contaminated."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I think he did it, but I’m not sure.",a:"He may well have done it, but we can’t rule out other explanations."},{p:"This proves he was there.",a:"This places him at the scene, but it doesn’t prove what he did."},{p:"Don’t decide too fast.",a:"Let’s not jump to conclusions."},{p:"Maybe the sample is dirty.",a:"The sample may have been contaminated."},{p:"He can’t be the one: he was at home.",a:"He has a solid alibi, so we can rule him out."},{p:"Let’s put the facts together.",a:"Let’s piece together what actually happened."},{p:"We are almost sure.",a:"Everything points strongly in one direction."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ The experts found many evidences.",o:["The experts found a lot of evidence.","The experts found many evidence.","The experts found an evidences."],a:0,why:"evidence is uncountable: a lot of evidence, a piece of evidence"},{q:"✗ He must stole the key.",o:["He must have stolen the key.","He must has stolen the key.","He must to steal the key."],a:0,why:"must / might / can’t + have + past participle for the past"},{q:"✗ The police has found a new clue.",o:["The police have found a new clue.","The police is found a new clue.","The polices have found a new clue."],a:0,why:"the police takes a plural verb: the police are, the police have"},{q:"✗ She can’t to be the thief.",o:["She can’t be the thief.","She can’t being the thief.","She doesn’t can be the thief."],a:0,why:"can’t + infinitive without to"},{q:"✗ She might took the astrolabe.",o:["She might have taken the astrolabe.","She might taken the astrolabe.","She might has took the astrolabe."],a:0,why:"might have + past participle"},{q:"✗ They made an investigation of the theft.",o:["They carried out an investigation into the theft.","They did an investigation of the theft.","They made investigating of the theft."],a:0,why:"carry out / conduct an investigation into something"},{q:"✗ We need more proofs.",o:["We need more proof.","We need more of proofs.","We need much proofs."],a:0,why:"proof (= evidence that something is true) is uncountable"},{q:"✗ The guard said me that he was at the desk.",o:["The guard told me that he was at the desk.","The guard said to me that he is at the desk.","The guard told that he was at the desk."],a:0,why:"tell someone (that) …; say (that) … / say to someone"}]},{title:"Stress: words about investigation",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"facts that show something is true",o:["EVidence","eVIdence"],a:0},{q:"using science to investigate crimes",o:["foRENsic","FOrensic"],a:0},{q:"to examine something in detail (verb)",o:["ANalyse","anaLYSE"],a:0},{q:"a detailed examination (noun)",o:["aNALysis","ANalysis"],a:0,why:"The stress moves in this word family."},{q:"a careful search for the truth",o:["investiGAtion","inVEStigation"],a:0,why:"Before -tion, the syllable is strong."},{q:"a person whose job is to solve crimes",o:["deTECtive","DEtective"],a:0},{q:"making you think something is wrong",o:["susPIcious","SUSpicious"],a:0}]}],Yf={cardsStep:"Expert cards",cardsTitle:"Expert cards",cardsHint:"One student at a time picks a card, reads the finding alone and then opens the lab notebook. Close it: the card turns back and shows “Taken”. Then pass the phone on. Keep your card secret: you will report it in your own words. The Expert’s Oath: you may keep quiet about your notebook, but you may never lie when someone asks you a direct question.",backWord:"Expert",cardsSecret:!0,hiddenLabel:"Lab notebook",questionWord:"Question",questionTitle:"Cross-examination cards",questionHint:"Open a card, choose one expert and ask the question. The expert answers truthfully (the Expert’s Oath). Everyone else listens for how the evidence was collected, and the note-taker marks the case board.",questionHelp:{b2:["How exactly did you …?","Are you sure that …?","Could someone else have …?"],c1:["Talk me through how you …","How confident would you say you are that …?","Is there any chance that …?"]},twistWord:"Lab report",twistTitle:"Lab reports",twistHint:"Open one lab report at a time and read it aloud. Then say what it rules in or rules out, and which expert’s evidence it supports or questions. Open all five before Round 4.",twistHelp:{b2:["This means that … can’t have …","This supports …’s evidence.","So we can rule out …"],c1:["This throws doubt on …","Taken together with …, this suggests that …","If this is right, then … must have …"]},revealTitle:"Open the lab notebooks",revealHint:"One by one, say “I was the … expert” and turn your card over here. Read your **lab notebook** aloud. Which evidence was unreliable, and did your team find the hidden rookie? One point for the right person, one for the right reason.",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Briefing",lv:"c1",bloom:"Understand / Analyse",by:"mateo",seconds:120,q:"Each expert reports their **finding** in two or three sentences, **in your own words**, without showing the screen. Say **what** you found and **where**. The note-taker writes every finding on the case board (book, section 6). **No conclusions yet.**",help:{b2:["I examined …","What I found was …","It was on / in / near …"],c1:["My finding is fairly clear-cut: …","What stands out is …","At this stage, all I can say is that …"]},model:"Here is how a briefing sounds, from a practice case, a charger missing from the university library: “I examined the cupboard where the charger is kept. What stands out is a single clear fingerprint on the handle, and dust everywhere else, as if nobody had opened it for days. At this stage, all I can say is that one person touched the handle recently. I can’t yet tell you who, or when.”"},{name:"Round 2 · Cross-examination",lv:"c1",bloom:"Analyse / Evaluate",by:"aziza",tool:"questions",seconds:240,q:"Take turns. Open a **question card**, choose one expert and ask. Experts answer truthfully: you may keep quiet about your notebook, but you may **never lie** to a direct question. Listen for **how** the evidence was collected, stored and checked. Everybody asks at least once.",help:{b2:["How exactly did you …?","Who else touched …?","Are you sure that …?"],c1:["Talk me through how you …","Is there any chance that …?","So, strictly speaking, your evidence shows only that …"]},model:"In our practice case, the key question was “Who else could have touched it?” The fingerprint expert admitted that the cupboard is used by everyone in the library, so the print might have been days old. Then we asked the timeline expert how she knew when the library closed, and she said she had copied the times from the door system and checked its clock. So, strictly speaking, the fingerprint showed only that someone had been there, while the door log was much more solid."},{name:"Round 3 · Lab reports",lv:"c1",bloom:"Analyse / Evaluate",by:"nur",tool:"twists",seconds:180,q:"Open the five **lab reports** one by one and read each one aloud. After each report, say what it **rules in** or **rules out**, and whose evidence it **supports** or **questions**. The note-taker crosses out every person the team can rule out.",help:{b2:["This means that … can’t have …","This supports …’s evidence.","So we can rule out …"],c1:["This throws doubt on …","Taken together with …, this suggests that …","If this is right, then … must have …"]},model:"Taken together, the lab reports change the picture. The preview photos give an innocent reason for the collector’s fingerprints on the glass, so those prints no longer point at him. The reports on gloves and shoes describe what each person was wearing, so we can compare them with the fibres and the footprints. And the report on the basement tells us something important: if the footprints really lead down there, the astrolabe may never have left the building."},{name:"Round 4 · Case theory",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:180,q:"Agree on your **case theory**: **who** opened the case, **when** (between which times), **where** the astrolabe is now, and whether it was **a theft**. Say how sure you are: **certain**, **probable** or **possible**. Then name the evidence you **trust least**, and the expert you think is the **hidden rookie**, with one reason. Use *must have*, *might have* and *can’t have*.",help:{b2:["… must have opened the case, because …","… can’t have done it, because …","We trust … least, because …"],c1:["Everything points to …","We can’t entirely rule out …, but …","The weak link in the chain is …"]},model:"Here is how a case theory sounds, from the practice case: “Everything points to a member of staff. The door log shows the library was locked at nine, and only staff cards opened it after that, so a student can’t have taken the charger at night. The fingerprint is the weak link in the chain: the cupboard is used by everyone, so it might have been there for days. We’re fairly certain about when, but only probable about who. And we don’t think it was a theft: the charger may simply have been borrowed.”"},{name:"Round 5 · Reveal and reflect",lv:"c1",bloom:"Evaluate",by:"amara",tool:"reveal",seconds:0,q:"Turn the cards over and read every **lab notebook** aloud. Which piece of evidence was unreliable, and why? Was your theory right? Then step out of the game: how could a mistake like this affect a **real** investigation, and what protects innocent people from it, in Uzbekistan and in other countries?",help:{b2:["The unreliable evidence was …, because …","Our theory was right / wrong about …","Mistakes like this can …"],c1:["In hindsight, the clue was …","What this shows is that evidence is only as good as …","What protects people is …"]},model:"In hindsight, the clue was in the trace expert’s notebook: the blue wool thread was collected with the same tweezers that had just been used on the coats in the cloakroom, so it may have come from Mr Kamali’s scarf there, not from the case. His fingerprints on the glass were from the preview. The real story is less dramatic. Mirela Dragan, the restorer, has a key and works in white cotton gloves and soft shoes. She must have noticed a loose ring on the astrolabe after the preview, opened the case before 23:05 and carried it down to her workshop to repair it before the opening. It was never stolen: the footprints lead to the basement, and there is no exit there. What this shows is that evidence is only as good as the way it is collected. What protects innocent people is careful procedure, a second check and the courage to say: “I might be wrong.”"}],_f=[{e:"🖐",n:"Fingerprints",r:"Expert card · fingerprint examiner",lines:[["Your finding","On the **outside** of the glass door: clear fingerprints of **Reza Kamali**, the visiting collector. On the **lock** of the case: **no fingerprints at all**, only smooth marks, as if the person who opened it wore **gloves**."],["Report it","In your own words. Don’t show your screen."]],x:"Dusted at 7:05, photographed and lifted with fresh tape; sealed in an envelope at once. You followed every rule: your evidence is reliable."},{e:"🧵",n:"Fibres",r:"Expert card · fibre analyst",lines:[["Your finding","Three short **white cotton** fibres caught in the **lock** of the case, the kind that come from a **cotton glove**."],["Report it","In your own words. Don’t show your screen."]],x:"Collected at 7:15 with new, clean tweezers and sealed in a labelled bag. You followed every rule: your evidence is reliable."},{e:"👣",n:"Footprints",r:"Expert card · footprint analyst",lines:[["Your finding","Dusty prints of **small, soft, flat-soled shoes** go from the case to the **staff stairs down to the basement**. **No prints** lead from the case to the main exit."],["Report it","In your own words. Don’t show your screen."]],x:"Photographed at 7:20 with a measuring scale before anyone walked on the floor. You followed every rule: your evidence is reliable."},{e:"🚪",n:"Door log",r:"Expert card · timeline analyst",lines:[["Your finding","Main exit: opened at **22:10** with a guest pass (Reza Kamali) and at **22:40** with the designer’s card (Yuki Tanabe). Basement door: opened at **23:05** and **23:50** with **a staff card**; the old system does not record whose. The front-desk camera shows the night guard **at his desk from 23:00 to 23:40**."],["Report it","In your own words. Don’t show your screen."]],x:"Copied straight from the door system at 7:30; you checked that the system clock was correct. You followed every rule: your evidence is reliable."},{e:"🔬",n:"Trace",r:"Expert card · trace analyst",lines:[["Your finding","One **dark-blue wool thread** on the velvet stand **inside** the case. Its colour and wool match the scarf of **Reza Kamali**, the visiting collector."],["Report it","In your own words. Don’t show your screen."]],x:"**Your secret: you are the rookie.** At 7:00 you took samples from the guests’ coats and scarves in the cloakroom, including Mr Kamali’s. At 7:40 you collected this thread with **the same tweezers**, and you **didn’t clean them** in between. Don’t mention it first, but if someone asks you directly how you collected it, you must tell the truth."}],$f=[{t:"The preview photos",q:"Photos from last night’s preview show **Reza Kamali at 21:40**, leaning close to the case with **both hands on the glass**, admiring the astrolabe. Many guests did the same.",by:"mateo",m:"This throws doubt on the fingerprints as a clue against Mr Kamali. His prints are on the outside of the glass, and the photos give an innocent reason for them: he touched the case during the preview, in front of everybody. The prints place him near the case, but not inside it, and they can’t tell us anything about what happened after 22:35."},{t:"The keys",q:"Only **two keys** open the glass cases. One belongs to the restorer, **Mirela Dragan**, who keeps it on her belt. The other is kept in the night guard’s **desk drawer**; this morning the drawer was locked, with the key inside.",by:"nur",m:"Since the glass isn’t broken, whoever opened the case must have used a key. That narrows things down: the restorer had one, and the guard had access to the other. Taken together with the door log, this suggests that the collector and the designer, who had already left, can’t have opened the case, unless one of them somehow had a key, and there’s no evidence of that."},{t:"Gloves",q:"The museum’s restorer handles objects in **white cotton gloves**. The night guard wears **black wool gloves** on his winter rounds. The designer was seen carrying lamps with **bare hands**. The collector arrived in **brown leather gloves**.",by:"aziza",m:"This supports the fibre expert’s evidence and narrows it down: the white cotton fibres in the lock match only the restorer’s working gloves. If this is right, then the person who opened the case must have been wearing cotton gloves, which also explains why there are no fingerprints on the lock. The guard’s wool gloves and the collector’s leather ones don’t match."},{t:"Shoes",q:"The night guard wears **heavy boots with deep treads**. The restorer works in **soft, flat shoes**. The designer wore **trainers with a zigzag sole**. The collector wore **smart leather shoes with heels**.",by:"leo",m:"Taken together with the footprints, this is quite telling. Small, soft, flat-soled prints fit the restorer’s work shoes and nobody else’s: boots, trainers with a zigzag pattern and heels would all leave very different marks. So the person who walked from the case to the staff stairs was probably the restorer."},{t:"The basement",q:"The staff stairs lead **only to the basement**: a storeroom and the **restorer’s workshop**, where objects are cleaned and repaired. There is **no exit** from the basement to the street.",by:"amara",m:"This changes the question. If the footprints lead to the basement and there is no way out from there, the astrolabe may never have left the building. And the basement door opened at 23:05 with a staff card. So rather than asking “Who stole it?”, we should be asking “Who took it downstairs, and why?”"}],ep=[{t:"How did you collect it?",q:"Ask one expert: **How exactly did you collect your evidence, and with what?** Listen for anything that could have gone wrong.",by:"nur",m:"Talk me through it? Of course. I photographed the evidence first, exactly where it was, with a scale next to it. Then I collected it with new gloves and clean tools, and sealed it in a labelled bag straight away. Nothing else touched it, and I wrote the time on the label."},{t:"Who else touched it?",q:"Ask one expert: **Who else could have touched your evidence, or the place where you found it, before you got there?**",by:"mateo",m:"That’s a fair question. Last night there was a preview, so a lot of people were near that case. I can’t rule out that some marks are from the evening. What I can say is that nobody walked on that floor this morning before I photographed it."},{t:"When exactly?",q:"Ask one expert: **When exactly did your evidence get there? Before or after 22:35, when the astrolabe was still in the case?**",by:"leo",m:"Strictly speaking, my evidence doesn’t have a clock on it. All I can say is that it was there at seven this morning. To know whether it got there before or after 22:35, we need to put it next to the door log and the photo the designer took."},{t:"Another explanation?",q:"Ask one expert: **Is there an innocent explanation for your evidence?** What else could it mean?",by:"amara",m:"Yes, I think there is. My evidence shows that someone was there and what they were wearing, but it doesn’t say why they were there. People who work in a museum touch cases and walk on stairs every day. So it could mean a theft, or it could mean someone simply doing their job."},{t:"How sure are you?",q:"Ask one expert: **On a scale from “possible” to “certain”, how sure are you about your finding, and why?**",by:"aziza",m:"I’d say I’m fairly certain about what I found, but only fairly sure about what it means. The finding itself is clear: I photographed it and anyone can check it. What it means depends on the other evidence, so I’d call my conclusion probable, not certain."},{t:"What doesn’t fit?",q:"Ask one expert: **Which other expert’s evidence doesn’t fit with yours?** How could both be true?",by:"nur",m:"Something doesn’t quite fit. My evidence points one way, but one finding points to a person who left the building long before the case was opened. Either that person came back, which the door log doesn’t show, or one of the two pieces of evidence is not what it seems."},{t:"Where was it stored?",q:"Ask one expert: **Where has your evidence been since you collected it, and who has had it?**",by:"leo",m:"It’s been in a sealed, labelled bag in my case since the moment I collected it, and nobody else has opened it. The label has the time, the place and my name on it, so anyone can follow it from the scene to the lab. That’s what we call the chain of custody."},{t:"What would change your mind?",q:"Ask one expert: **What new evidence would make you change your mind about what your finding means?**",by:"mateo",m:"If someone could show me that my evidence was moved, or that it could have got there another way, I’d change my mind straight away. A good expert isn’t trying to win an argument. The aim is to find out what happened, even if that means admitting I was wrong."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Do you enjoy detective stories? Why (not)?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**Yes, I really do** enjoy detective stories."],["Point","**The main reason is that** they make me think while I’m reading or watching."],["Example","**For example,** my brother and I watch a detective series in Navoi every Friday and try to guess the ending before the detective does."],["Close","**So, all in all,** they are fun and they train my brain at the same time."]],keys:["yes, I really do","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"Why are crime dramas so popular?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think there are a few reasons** why crime dramas are so popular."],["","**First of all,** everybody loves a puzzle."],["","**What’s more,** we want to see that wrong things are put right in the end."],["","**For instance,** my aunt in Kuala Lumpur never misses a detective show, because she says the ending always makes her feel calm."],["","**On top of that,** the stories often show places and jobs we never see in real life."],["","**In short,** crime dramas give us a puzzle, a hero and a happy ending."]],keys:["a few reasons","first of all","what’s more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"mateo",q:"Is forensic science on TV realistic?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d say it isn’t very realistic, although it does get some things right."],["","First and foremost, real tests take days or weeks, not a few minutes."],["","Equally, real experts rarely chase suspects or question them: they work in labs."],["","To illustrate this, a cousin of mine who studies forensic science in São Paulo spends most of her day labelling samples and writing reports."],["","Admittedly, TV shows do teach people that every contact can leave a trace."],["","Overall, they are good entertainment, but not a good picture of the job."]],extra:"São Paulo is one of the biggest cities in South America.",keys:["first and foremost","equally","admittedly","overall"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"Are eyewitnesses reliable?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["On the whole,","eyewitnesses are useful, but they are less reliable than many people think."],["Admittedly,","a witness can notice things that no camera records."],["However,","memory can change under stress or after people talk to each other."],["For example,","after a minor accident in my street in Lagos, three neighbours remembered three different colours for the same car."],["As a result,","investigators usually look for evidence that supports what witnesses say."],["To sum up,","a witness is a starting point, not the final answer."]],distractors:["Likewise,","Meanwhile,"],keys:["useful but less reliable","no camera records","stress","a starting point"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"leo",q:"Can evidence ever lie?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["doesn’t lie, but","people read it","take a fingerprint","contamination","jump to conclusions","check it twice"],model:"Strictly speaking, evidence can’t lie, because it has no intentions; but it can certainly mislead, because people read it, and people make mistakes. Take a fingerprint: it can place someone at a scene, but it says nothing about when they were there or what they did. The trouble is that samples can be contaminated by careless handling, and once investigators have a favourite theory, it’s all too easy to jump to conclusions and notice only the evidence that fits. That is why good forensic work is slow and a little boring: every step is recorded, and every result is checked twice, ideally by someone else. In the end, evidence is only as honest as the people and the procedures behind it."}],np={title:"Exam Part 2 practice: protecting a new museum exhibition",situation:"A city museum in Samarkand is opening an exhibition of old astronomical instruments, and it can pay for only one extra security measure: more cameras, a second night guard, or glass cases with alarms. Aziza and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"mateo",lines:[["A","Shall we start with the cameras? They seem the obvious choice."],["B","They do, but cameras only record a problem; they don’t stop it, do they?"],["A","Fair point. What about a second night guard, then?"],["B","A person can react, which is a big plus. But guards get tired at night."],["A","True. So maybe the alarmed cases are better: they protect each object directly."],["B","And an alarm never falls asleep."],["A","Mind you, if an alarm goes off and nobody is there, it’s not much use."],["B","So shall we go for the alarmed cases, connected to the guard who’s already there?"],["A","Agreed. That way, the objects are protected and someone can react straight away."]],phrases:{Start:["Shall we start with …?","…, don’t they? / do they?"],Clarify:["They do, but …","Mind you, if …"],"Give the turn":["What about …, then?","Fair point."],"Agree and decide":["So maybe … are better.","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: the shared laptop in your faculty’s study room keeps going missing for days. Choose **one** solution: a sign-out sheet, a locked cupboard with one key at the office, or a small camera in the room. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["the crime scene","collect evidence","leave a trace","contaminate a sample","rule out","piece together","jump to conclusions","solve the case","follow a lead"],B:["a solid alibi","circumstantial evidence","beyond reasonable doubt","jump to conclusions","collect evidence","rule out","leave a trace","the crime scene","piece together"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["the crime scene","collect evidence","leave a trace","contaminate a sample","rule out","piece together","jump to conclusions","a solid alibi","circumstantial evidence","solve the case","follow a lead","beyond reasonable doubt"],questions:["Is forensic science on TV realistic?","Why do people so often jump to conclusions?","Should we trust science more than eyewitnesses?","Why are detective stories popular all over the world?","Are detective stories and crime series popular in Uzbekistan? Which ones do people know from other countries?","Would forensic science be an interesting job? Why (not)?"]},sp=[{type:"stress",title:"Stress Spot: words about investigation",intro:"Tap the stressed syllable. Rule: in word families the stress can move: ANalyse → aNALysis, inVEStigate → investiGAtion. Before -tion, the syllable is strong. Then listen and say the word.",follow:"Now use two of these words in one sentence about the Empty Case.",items:[{w:"evidence",syl:["ev","i","dence"],s:0},{w:"forensic",syl:["fo","ren","sic"],s:1},{w:"analyse",syl:["an","a","lyse"],s:0},{w:"analysis",syl:["a","nal","y","sis"],s:1},{w:"investigate",syl:["in","ves","ti","gate"],s:1},{w:"investigation",syl:["in","ves","ti","ga","tion"],s:3},{w:"detective",syl:["de","tec","tive"],s:1},{w:"suspicious",syl:["sus","pi","cious"],s:1}]},{type:"pairs",title:"Sound Pairs: consonant groups (blow or below?)",intro:"Press Play and choose the word you hear. In blow, plight, prayed, claps and train, two consonants go together at the start, with no vowel between them. In below, polite, parade, collapse and terrain, there is a short vowel /ə/ between them. Native Uzbek words rarely begin with two consonants, so some Uzbek speakers add a vowel (b-low, i-blow), and blow starts to sound like below. Partner version: one student says a word, the partner says “group” or “vowel”.",pairs:[["blow","below"],["plight","polite"],["prayed","parade"],["claps","collapse"],["train","terrain"]]}],op=["Use two C1 phrases in your next answer.","Ask the expert who spoke last a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say which person you can rule out, and why.","Say your case theory again in three sentences, without notes."],ip={title:"Step Up Speaking Club podcast: What TV Detectives Get Wrong",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Mateo and Aziza both have a cousin who works with forensic evidence, in São Paulo and in Tashkent. Are crime dramas on TV anything like the real job?",tip:["Listen for a question, not an opinion","In a conversation, a speaker often checks an idea by asking about it: *Do you mean to say that …?* That is a question, not their opinion. Listen to the reply, and choose the speaker who really holds the view."],A:"mateo",B:"aziza",lines:[["A","Welcome to the Club podcast. My cousin Luana studies forensic science in São Paulo, and she refuses to watch crime dramas with me. “On TV,” she says, “someone finds one hair at **the crime scene**, and ten minutes later the detective has **solved the case**.”"],["B","My cousin in Tashkent is training to be a forensic expert, and she says the same. [[0]] these shows make people expect miracles. Real experts **collect evidence** slowly, with gloves and clean tools."],["A","[[1]] it’s so easy to **contaminate a sample**: one touch with a bare hand and the result is useless. And Luana says every contact **leaves a trace**."],["B","[[2]] a trace proves that someone did it?"],["A","No, not at all. It shows that someone was there, not what they did. That’s why the biggest danger is to **jump to conclusions**."],["B","Exactly. A good team **follows every lead**, **rules out** people one by one, and only then **pieces together** what happened. [[3]] a case my cousin studied: a man had **a solid alibi**, but the team still checked it, hour by hour."],["A","Personally, I think **circumstantial evidence** should never be enough on its own."],["B","[[4]] it’s never enough. Several small clues together can tell a strong story. But in many countries, guilt must be proved **beyond reasonable doubt**. As my cousin puts it: “Our job isn’t to find someone guilty. It’s to find out what happened.”"],["A","Luana would agree with every word."]],gaps:[[1,"My feeling is that"],[2,"The main reason, I think, is that"],[3,"Do you mean to say that"],[4,"Take the case of"],[5,"I’d be careful about saying that"]],questions:[{q:"Who has a relative who is studying or training in forensic science?",o:["Mateo","Aziza","both of them"],a:2,why:"Mateo: “My cousin Luana studies forensic science in São Paulo …” Aziza: “My cousin in Tashkent is training to be a forensic expert …”"},{q:"Who explains how a sample can be ruined?",o:["Mateo","Aziza","both of them"],a:0,why:"Mateo: “one touch with a bare hand and the result is useless.” Aziza mentions gloves and clean tools, but not what can go wrong."},{q:"Who says that a trace does not show what a person did?",o:["Mateo","Aziza","both of them"],a:0,why:"Mateo: “It shows that someone was there, not what they did.” Aziza only asks: “Do you mean to say that a trace proves that someone did it?”"},{q:"Who thinks that several small clues together can be convincing?",o:["Mateo","Aziza","both of them"],a:1,why:"Aziza: “Several small clues together can tell a strong story.” Mateo thinks circumstantial evidence “should never be enough on its own”."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Aziza use to check meaning, and which one does she use to disagree politely?",groups:[["Opinion",[1]],["Reason",[2]],["Checking meaning",[3]],["Example",[4]],["Disagreeing politely",[5]]]},use:{q:"Should TV crime series try to be realistic, or is good entertainment enough? Why?",by:"amara",model:"My feeling is that they should try, at least a little. The main reason, I think, is that many viewers believe what they see. Take the case of my neighbour in Lagos: after one detective series, she was sure that a single fingerprint could solve any crime. Of course, nobody wants a series that feels like a lecture, so I’d be careful about saying that every detail must be correct. In short: be exciting, but don’t teach people things that aren’t true.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},lp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Gf,DIALOGUE:np,DRILLS:Zf,LESSON:Kf,LEVELS:tp,LISTEN:ip,MAIN:Yf,PRON:sp,QUESTIONS:ep,ROUNDS:Jf,TWISTS:$f,UNIT:Uf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"5542c15d-ffb8-48e5-8d71-34ee51
