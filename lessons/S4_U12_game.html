n purpose: the way out is behind **five locked doors**, and every door tests how people **remember** and **learn**.","Read each puzzle, talk it through in English and type the answer. When a door opens, explain **how** you know. Mrs Nazarova is waiting at the exit with tea and one last question: which way of learning will you use for your next exam?"],rule:"Rule of the night: no answer counts until someone explains why. Question ideas, never people, and give everyone a turn to speak."}},Kf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts (exam Part 1): Leo crams for exams in Hamburg, a tutor’s better method, how Aziza’s grandmother in Navoi remembers names, and Leo’s Russian. Listen for the result, notice how the speakers check meaning and give tips, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Mateo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress that moves (reVISE → reVIsion, rePEAT → repeTItion), and /θ/ or /f/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 3: put six parts of an answer about memorising in the age of search engines in order and bin the sentence that does not belong, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 3; fast pairs try Level 4 or 5.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about remembering, forgetting and studying. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the best study tip they heard (use the wheel)."]},{id:"game",icon:"🔑",name:"The Memory House",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Reader","Memory Keeper","Checker","Timekeeper","Reporter"],desc:"Escape Room: open five locked doors in a small museum by solving puzzles about remembering and learning in English, and explain how you solved each one. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team moves at its own speed.","Each student turns over one role card (Reader, Memory Keeper, Checker, Timekeeper, Reporter) and keeps it for the whole game.","Timing: cards 1 min · Memory warm-up 2 min · The doors 12 min (five doors, about 2 minutes each) · Think back 3 min.","Only one projector? The teacher shows one door at a time; teams discuss and write their answer on paper. A team scores a point only for the right answer AND a clear explanation."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping first-year students study better, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 42, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions, one for each extract: Leo’s old method, the tutor’s advice, Aziza’s grandmother and Leo’s Russian.","Press **Play the podcast**. Listen for the result: _a week later …_, _but the information stayed._ Don’t stop at what the speaker did. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: checking meaning, opinion, giving a tip, example and reason.","**Your turn:** listen to Mateo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Extract 3 is B. She looks at an old photo.","gives an answer"],["B","She does, but is that for a name or for a word?","challenges politely"],["A","“… when a name slips her mind, she doesn’t panic: she goes through the alphabet …”","checks the text again"],["B","So for a name, she stays calm and uses the alphabet. It’s C.","paraphrases"]],checks:[["Why should you listen for the result in a short extract?","questions often ask what happened in the end (“a week later most of it had gone”, “but the information stayed”), not only what the speaker did."],["Which phrase does Aziza use to check what Leo means?","Hold on, are you saying that …?"]]},pron:{ref:"Book: Lesson 42, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-sion** and **-tion**, the syllable is strong, so the stress can move: *reVISE → reVIsion*, *rePEAT → repeTItion*, *CONcentrate → concenTRAtion*.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /θ/ (*three*, *thought*) or /f/ (*free*, *fought*)?","For /θ/, put the tip of your tongue **between your teeth** and blow gently. For /f/, your top teeth touch your **bottom lip**.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *revise*. Which syllable is strong?",""],["A","The second: re-*VISE*.","a correct first guess"],["T","Good. Now *revision*.",""],["B","Still *VI*? re-*VI*-sion.","uses the -sion rule"],["T","Yes. And *repetition*?",""],["B","Before *-tion*: re-pe-*TI*-tion. The stress moved!","uses the rule"],["T","Great! Now listen: *three*. First or second: *three* or *free*?",""],["A","First: *three*. My tongue was between my teeth.","feels the tongue"]],checks:[["Where is the stress in *memorise*?","on MEM: MEM-o-rise."],["Where is the stress in *concentration*?","on TRA: con-cen-TRA-tion (the syllable before -tion)."],["Which word starts with /θ/: *thirst* or *first*?","*thirst*: the tongue goes between the teeth."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 3**: six parts, **no labels**, and **one extra sentence** that does not belong.","Find the extra sentence first and send it to the bin with **🗑**. It may be true, but it does not answer the question.","Find the **first part**: it gives a clear position (*I firmly believe that …*).","Follow the linking words: *First and foremost* → *Equally* → *To illustrate this* → *Admittedly* (the other side) → *Overall* (the close).","Press **✔ Check**. Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 4** (choose the linking words) or **Level 5** (key words only)."],exTitle:"How Mateo’s answer changed in 4/3/2",lines:[["mateo","Um, yes, I think we still need to … remember things … because, um, phone is not always there … my friend, he is a nurse, he must know things fast … but yes, we can search also.","Attempt 1 · 90 s · many pauses"],["mateo","I firmly believe that memorising is still important. First and foremost, you can’t think about facts you don’t know. Equally, some jobs need knowledge fast. To illustrate this, my friend in Recife is a nurse, and she can’t search the internet in an emergency. Admittedly, we don’t need to learn everything by heart. Overall, we need both: memory and search.","Attempt 2 · 60 s · linking words"],["mateo","I firmly believe that memorising still matters, because you can’t think with knowledge you haven’t got. Some jobs simply leave no time to search: a friend of mine who is a nurse in Recife has to know the key steps instantly in an emergency. Admittedly, nobody needs to learn every date by heart any more. Overall, search engines change what we memorise, not whether we need to.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 3?","one extra sentence that does not belong: find it and bin it."],["How many times do you say your own answer?","three times, to three different partners."],["Which linking word introduces the other side?","*Admittedly, …*"]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How do you remember new words in a foreign language?",lines:[["amara","Well, I used to **learn lists by heart**, but **I forgot them within a week**. Now **I test myself** with small cards: one side English, one side my language. I go back to them **a little and often**, not all at once. And I always **put the word in a sentence**, because then **it sticks**. If a word is **on the tip of my tongue**, I don’t look it up immediately; I try to remember it first.","speaker · 1 minute"],["leo","I heard six phrases: *learn by heart*, *I forgot them*, *I test myself*, *a little and often*, *it sticks* and *on the tip of my tongue*. That’s a full row: **Bingo!**","listener reports"],["amara","Six points plus three for the Bingo: nine points!","count the points"],["leo","Next time, try *It rings a bell*. It’s on my card, and it’s very natural.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Should you invent statistics about memory?","no: give reasons and your own study habits, not invented numbers."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Where do we start?*).","Click the lines in order. Each line answers the line before. Mateo and Nur take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a forgotten birthday",lines:[["A","Oh no, it’s Dilshod’s birthday today, and it completely slipped my mind!","opens the topic"],["B","Don’t worry. Shall we call him now and sing?","an idea"],["A","Good idea. And let’s put everyone’s birthday in our phones tonight.","agrees + an idea"],["B","Deal. I’ll set the reminders.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · note sheet in section 6",steps:["Make teams of five. Each student turns over one **role card** and keeps that role for the whole game.","**Round 1 · Memory warm-up (2 min):** look at the list of ten museum objects for 30 seconds, then close your eyes and recall as many as you can as a team. Which tricks helped?","**Round 2 · The doors (12 min):** the Reader reads the door aloud. Discuss, test every idea, then type your answer and press **Unlock**.","Stuck? Press **Hint**. A wrong answer is not a problem: read the clues again and try another idea.","When a door opens, the Reporter explains **how** your team solved it. Then press **Next door**.","**Round 3 · Think back (3 min):** which learning strategy from tonight will you use for your next exam, and why? One student presents your answer in one minute."],exTitle:"Sample game: the Club tries Mrs Nazarova’s practice door",lines:[["","Practice door — Reader Nur · Memory Keeper Amara · Checker Leo · Timekeeper Aziza · Reporter Mateo",""],["nur","(reads aloud) “My locker code is three digits: the number of seasons in a year, then the number of continents my grandfather visited, then the number of legs on a spider. My grandfather visited Asia and Europe only.”","the Reader reads the puzzle aloud"],["mateo","Four seasons, two continents … and spiders have six legs?","a quick first idea"],["leo","**Hold on. How do we know that?** I’m sure spiders have eight legs. Insects have six.","the Checker tests the idea"],["amara","I’ll write it in chunks: 4 … 2 … 8.","the Memory Keeper writes it down"],["aziza","Thirty seconds left. Nur, do you agree?","the Timekeeper watches the time and the turns"],["nur","Yes. **So the only possible code is** 428.","agrees"],["mateo","**We worked it out like this:** first, we turned each clue into one number. **We nearly made a mistake** with the spider, but Leo checked it. **The key clue turned out to be** “Asia and Europe only”: two continents.","the Reporter explains after the door opens (C1 phrases)"]],checks:[["What does the Checker do?","tests every idea (*How do we know that?*): the Checker questions ideas, never people."],["When do you type an answer?","when the team agrees and someone can explain why it is the only possible answer."],["What happens after a door opens?","the Reporter explains how the team solved it; then the next door appears."]]},drills:{ref:"Book: Lesson 42 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Yf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"I didn’t study all term, so I had to ___ the night before.",o:["cram for the exam","ring a bell","jog my memory"],a:0},{q:"We had to ___ the poem and say it in front of the class.",o:["learn by heart","slip our minds","brush up"],a:0},{q:"Repeating lists again and again without understanding is called ___.",o:["rote learning","a memory like a sieve","the tip of the tongue"],a:0},{q:"The lecture was so fast that I couldn’t ___ all the information.",o:["take in","ring","slip"],a:0},{q:"Short tests every week help students ___ for longer.",o:["retain information","cram the exam","rack the brains"],a:0},{q:"Sorry I didn’t call you: it completely ___.",o:["slipped my mind","rang a bell","jogged my memory"],a:0},{q:"Her name is ___: I almost have it!",o:["on the tip of my tongue","a memory like a sieve","learnt by heart"],a:0},{q:"I ___ all evening, but I couldn’t remember the password.",o:["racked my brains","rang a bell","took in"],a:0},{q:"“Mrs Nazarova?” Hmm, that name ___. Have we met her?",o:["rings a bell","slips my mind","takes in"],a:0},{q:"Looking at old photos can ___ about things you thought you had forgotten.",o:["jog your memory","cram your exam","rack your memory"],a:0},{q:"Before my trip to Germany, I need to ___ my German.",o:["brush up on","take in","slip"],a:0},{q:"I forget everything! I’ve got ___.",o:["a memory like a sieve","a tip of the tongue","a rote learning"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I remember. I locked the door. → **I remember + -ing**",a:"I remember locking the door. (remember + -ing = a memory of the past)"},{p:"Lock the door! Don’t forget. → **Remember to …**",a:"Remember to lock the door. (remember to = don’t forget to do it)"},{p:"I forgot. I had already sent the email. → **I forgot (that) I had …**",a:"I forgot that I had already sent the email."},{p:"I used to learn lists by heart. → **I’m used to …** (now)",a:"I’m used to learning new words with cards. (be used to + -ing)"},{p:"Revise a little every day. → **It’s better to … than to …**",a:"It’s better to revise a little every day than to cram the night before."},{p:"The more you test yourself, … → **the more …**",a:"The more you test yourself, the more you remember."},{p:"I didn’t write it down. I forgot it. → **If I had …**",a:"If I had written it down, I wouldn’t have forgotten it."},{p:"Can you remind me? → **Could you remind me to …?**",a:"Could you remind me to call Mrs Nazarova?"},{p:"She remembers faces well. → **She’s good at …**",a:"She’s good at remembering faces."},{p:"The words were learnt. (by the students) → **active**",a:"The students learnt the words."},{p:"I can’t remember his name. → **His name has …**",a:"His name has slipped my mind."},{p:"Students forget information quickly. → **Information is …**",a:"Information is quickly forgotten. (passive)"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I forgot.",a:"It completely slipped my mind."},{p:"I almost remember.",a:"It’s on the tip of my tongue."},{p:"I know that name a little.",a:"That name rings a bell."},{p:"I studied a lot at the last minute.",a:"I crammed for the exam the night before."},{p:"I want to practise my French again.",a:"I need to brush up on my French."},{p:"Repeating is not enough.",a:"Rote learning alone rarely leads to real understanding."},{p:"This helps me remember.",a:"This really helps the information stick."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ Remind me about calling her.",o:["Remind me to call her.","Remind me calling her.","Remember me to call her."],a:0,why:"remind somebody to do something"},{q:"✗ Can you remember me your phone number?",o:["Can you remind me of your phone number?","Can you remember me of your phone number?","Can you memory me your phone number?"],a:0,why:"remind (another person); remember (yourself)"},{q:"✗ I forgot my keys at home.",o:["I left my keys at home.","I forgot my keys in home.","I was forgot my keys at home."],a:0,why:"with a place: leave something somewhere (I forgot my keys = no place)"},{q:"✗ I learnt it from heart.",o:["I learnt it by heart.","I learnt it with heart.","I learnt it on heart."],a:0,why:"learn by heart"},{q:"✗ I have a good memory about faces.",o:["I have a good memory for faces.","I have a good memory of faces.","I have good memory about faces."],a:0,why:"a good memory for names / faces / numbers"},{q:"✗ She explained us how to revise.",o:["She explained to us how to revise.","She explained us to revise.","She explained how us to revise."],a:0,why:"explain (something) to somebody"},{q:"✗ I need to repeat for the exam.",o:["I need to revise for the exam.","I need to repeat the exam for.","I need to repetition for the exam."],a:0,why:"revise (British) / review (American) = study again before an exam; repeat = say or do again"},{q:"✗ I can’t remember where did I put it.",o:["I can’t remember where I put it.","I can’t remember where I did put it.","I can’t remember where put I it."],a:0,why:"indirect question: no did, statement word order"}]},{title:"Stress: words about learning",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"the ability to remember",o:["MEMory","meMOry"],a:0},{q:"to learn something so that you remember it exactly",o:["MEMorise","memoRISE"],a:0},{q:"to study again before an exam (verb)",o:["reVISE","REvise"],a:0},{q:"studying again before an exam (noun)",o:["reVIsion","REvision"],a:0,why:"Before -sion, the syllable is strong."},{q:"doing something again and again",o:["repeTItion","rePEtition"],a:0,why:"Before -tion, the syllable is strong, so the stress moves."},{q:"giving all your attention to something",o:["concenTRAtion","CONcentration"],a:0,why:"Before -tion, the syllable is strong."},{q:"the ability to understand and learn",o:["inTELligence","INtelligence"],a:0}]}],Uf={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. Every role helps at every door.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Memory warm-up",lv:"b2p",bloom:"Apply",by:"aziza",seconds:60,q:"Look at these ten objects from the Memory House for **30 seconds**: *a brass teapot, a school bell, a blue suitcase, a sewing machine, a chess set, a camera, a pair of red boots, a radio, a clay jug, a bicycle bell*. Then close the screen and, as a team, say as many as you can remember. Which tricks helped: **grouping**, **a story**, **pictures in your head** or **first letters**?",help:{b2:["I remembered … because …","We put them in groups: …","The trick that helped me was …"],c1:["What really helped was linking … to …","We chunked the list into …","If we did it again, we’d …"]},model:"We remembered nine out of ten, and the trick was grouping. We chunked the list into three groups: things for the kitchen, the teapot and the clay jug; things that make a sound, the school bell, the radio and the bicycle bell; and things for travelling, the suitcase, the boots and the camera. That left the sewing machine and the chess set, and Amara made a little story: a grandmother sewing while her grandson played chess. The one we forgot was the chess set, ironically, so the story wasn’t strong enough. Next time, we’d make it funnier."},{name:"Round 2 · The doors",lv:"b2p",bloom:"Analyse / Evaluate",by:"mateo",seconds:0,tool:"escape",q:"Read each door aloud. Discuss, test every idea and agree on one answer. Type it and press Unlock. When the door opens, the Reporter explains how you solved it.",help:{b2:["Let me read that part again: …","Hold on. How do we know that?","So far, we’ve ruled out …"],c1:["If that were true, then …","We ruled out … because …","The key clue turned out to be …"]},model:"I’m the Reporter, so let me explain. First, our Reader read the clues twice. Then our Memory Keeper wrote every possibility in a small table. Our Checker tested each idea: “How do we know that?” We ruled out two answers because they broke one of the rules in the puzzle, so the only possible answer was the third. The key clue turned out to be one small phrase that was easy to miss."},{name:"Round 3 · Think back",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:90,q:"Think back on the five doors. Which **learning strategy** from tonight will you use for your next exam: **first letters**, **chunking**, **testing yourself**, **spreading your study over several days** or **linking new facts to a story**? Give an example from one door, and explain why the strategy suits you.",help:{b2:["The strategy I’ll use is …","For example, at Door …, we …","It suits me because …"],c1:["Looking back, what struck me most was …","Rather than cramming, I’m going to …","The same approach would work for …"]},model:"Looking back, what struck me most was Door 4, the study plans. I’ve always been a crammer: I read my notes again and again the night before, and then I forget half of it after the exam. Rather than cramming, I’m going to try Kamron’s plan: short sessions spread over the week, and testing myself with cards instead of rereading. It suits me because I get bored quickly, and short sessions are easier to start. The same approach would work for learning new English words, too."}],_f=[{e:"📖",n:"The Reader",r:"Reads every door aloud.",lines:[["Your job","Read the puzzle and the clues aloud, slowly and clearly. Read a part again when the team asks."],["Useful phrase","Let me read that part again: …"]],x:"Read numbers, times and small words like only, not, first and last very carefully: they are often the key."},{e:"🗂",n:"The Memory Keeper",r:"Writes it down and keeps it in order.",lines:[["Your job","Write every possibility on the note sheet, in a small table or in chunks, and cross out the ones the team rules out."],["Useful phrase","So far, we’ve ruled out …"]],x:"Don’t trust anyone’s memory, including your own: if it matters, write it down."},{e:"🔍",n:"The Checker",r:"Questions every idea.",lines:[["Your job","Test each answer before the team types it. Ask how we know, and check it against every clue."],["Useful phrase","Hold on. How do we know that?"]],x:"Question ideas, never people. Say what is wrong with the idea, not with the person who said it."},{e:"⏱️",n:"The Timekeeper",r:"Watches the time and the turns.",lines:[["Your job","Say when half the time has gone, and make sure everyone in the team speaks."],["Useful phrase","One minute left. Let’s hear from …"]],x:"If one person is talking a lot, invite a quiet person: What do you think, …?"},{e:"🎤",n:"The Reporter",r:"Explains the answer.",lines:[["Your job","When a door opens, explain how the team solved it in three or four sentences."],["Useful phrase","We worked it out like this: first, …"]],x:"Use first, then, so and that’s why: a clear order makes a clear explanation."}],$f=[],ep={help:{b2:["First, we checked …","This can’t be right, because …","So the only possible answer is …"],c1:["If that were true, then …","We ruled out … because …","The key clue turned out to be …"]},doors:[{title:"Door 1 · The morning routine",text:"Mrs Nazarova never writes her passwords down. Instead, she uses the **first letters** of the four jobs she does every morning, **in order**. Her four jobs are: **open** the shutters, **water** the plants, **dust** the glass cases and **read** the post. What is the password for Door 1? Type the four-letter word.",clues:["“I always water the plants first, while the museum is still cool.”","“I read the post straight after I open the shutters.”","“Dusting the cases is the last job of the morning.”"],answer:"WORD",accept:["w o r d","w-o-r-d"],hint:"Give each job a position: first, second, third, last. Two clues tell you the first and the last job. The middle clue gives you the order of the other two.",q:"Explain how you solved it. Which clue gave you the middle of the word?",by:"aziza",m:"First, we found the easy positions: watering is first, so W, and dusting is last, so D. That left opening the shutters and reading the post. The middle clue says she reads the post straight after she opens the shutters, so O comes before R. So the only possible answer is W, O, R, D: “word”. A good password for a museum about memory!",seconds:60},{title:"Door 2 · Three chunks",text:"The night guard, Mr Behzod, has a keypad code with five digits. “Long numbers are hard to remember,” he says, “so I learnt mine in **three chunks**, and each chunk is a number that everybody knows.” Type the code.",clues:["“My first chunk is the number of months in a year.”","“My second chunk is the number of days in a week.”","“My last chunk is the number of hours in a day.”"],answer:"12724",accept:["12 7 24","12-7-24","12 724","127 24"],hint:"Turn each clue into a number, then put the numbers together in the same order: chunk 1, chunk 2, chunk 3.",q:"Explain how you solved it. Why is it easier to remember a number in chunks?",by:"nur",m:"We worked it out like this: twelve months, seven days and twenty-four hours, so 12, 7 and 24: 12724. Five separate digits are hard to remember, but three chunks that you already know are easy. That’s why people often say phone numbers in groups. The key clue turned out to be the word “chunks”: once we saw it, we stopped looking for five separate numbers.",seconds:60},{title:"Door 3 · Three witnesses",text:"This morning, a visitor borrowed a blue folder of old photos from the reading room. Mrs Nazarova asked three other visitors what they remembered, and she also checked the museum’s visitor log. One visitor **added a detail that never happened**: memory sometimes fills in gaps. Which visitor? Type the letter.",clues:["**Visitor log:** 10.05: a woman in a green coat signs in at the reading room. 10.20: she signs out and takes the blue folder with her. No bag or umbrella is listed.","**A:** “A woman in a green coat came in at about ten.”","**B:** “When she left, she was carrying a folder. I think it was blue.”","**C:** “She left in a hurry with the folder and a red umbrella.”"],answer:"C",accept:["visitor c","letter c"],hint:"Check each visitor’s memory against the log, detail by detail. Being unsure (“I think”) is not the same as adding something.",q:"Explain how you solved it. Why isn’t visitor B the wrong one, even though B isn’t sure?",by:"leo",m:"First, we checked each visitor against the log. Visitor A is right: a green coat at about ten. Visitor B says “I think it was blue”: B isn’t sure, but the folder really was blue, so B didn’t add anything. Visitor C says she left “in a hurry” with “a red umbrella”, but the log lists no umbrella. We ruled out A and B because everything they said matches the log. So the only possible answer is C: the umbrella was added by memory.",seconds:60},{title:"Door 4 · The study plans",text:"Four museum volunteers prepared for the museum’s guide exam. Mrs Nazarova’s card says: “The volunteer who did best followed my **three rules**: **short sessions**, **spread over several days**, and **testing yourself** instead of just rereading. Only one volunteer followed all three.” Who was it? Type the name.",clues:["**Aziz:** studied for six hours the night before the exam, testing himself with question cards.","**Dildora:** studied for twenty minutes every day for a week, rereading and highlighting her notes.","**Kamron:** studied for twenty minutes every other day for two weeks, covering his notes and saying the answers aloud.","**Lola:** studied for half an hour every evening for a week, copying her notes neatly into a new notebook."],answer:"Kamron",accept:[],hint:"Check each volunteer against all three rules, one rule at a time. Covering your notes and saying the answers is a way of testing yourself.",q:"Explain how you solved it. Which rule ruled out the most volunteers?",by:"amara",m:"We made a small table with the three rules. Aziz tested himself, but six hours in one night is neither short nor spread out. Dildora had short sessions over a week, but she only reread and highlighted. Lola studied every evening, but copying notes isn’t testing yourself. Kamron had short sessions, spread over two weeks, and he covered his notes and said the answers aloud: that’s testing himself. So the only possible answer is Kamron. The rule that ruled out the most volunteers was “testing yourself”.",seconds:60},{title:"Door 5 · The three galleries",text:"The last door! The museum has three galleries: **North**, **East** and **West**. Each gallery has one guide, and each guide gives tours in a different language: **English**, **Spanish** or **Uzbek**. Mrs Nazarova has left two clues. Which language is spoken in the **West** gallery? Type the language.",clues:["“The English-speaking guide works in neither the East gallery nor the West gallery.”","“The Spanish-speaking guide works in the gallery where the sun rises.”"],answer:"Uzbek",accept:["uzbek language","in uzbek","o'zbek","ozbek"],hint:"The first clue tells you exactly where the English-speaking guide works. For the second clue: in which direction does the sun rise?",q:"Explain how you solved it. Which piece of general knowledge did you need?",by:"mateo",m:"First, we used clue one: the English-speaking guide is in neither the East nor the West gallery, so the English tours must be in the North gallery. Then clue two: the sun rises in the east, so the Spanish-speaking guide works in the East gallery. That leaves only the West gallery and only Uzbek. We ruled out English and Spanish because their galleries were already fixed. The key clue turned out to be “where the sun rises”: a fact we all know, but had to remember at the right moment.",seconds:60}],end:{title:"The exit is open!",text:"Mrs Nazarova is waiting at the main entrance with a pot of green tea. “Well done! You didn’t just remember: you organised, checked and explained. That’s how real learning works.” Now go to **Round 3** and choose the learning strategy you will take home."}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"How do you usually prepare for an important exam?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I usually start preparing about two weeks before an important exam."],["Point","**The main reason is that** I remember much more when I study a little every day than when I study all night."],["Example","**For example,** before my English exam in Navoi, I made small cards with new words and tested myself on the bus."],["Close","**So, all in all,** a short plan and a few minutes a day work better for me than one long night."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"What helps people remember new words in a foreign language?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**Honestly, I think the most important thing is** to use a new word, not just to read it."],["","**First,** write it in a sentence about your own life, so it means something to you."],["","**Then,** test yourself a few days later instead of just reading the list again."],["","**For instance,** my cousin in Kuala Lumpur learns Japanese words with cards and says each one in a sentence before she turns the card over."],["","**On top of that,** grouping words by topic makes them easier to find in your memory."],["","**In short,** use the words, test yourself and keep them in groups."]],keys:["the most important thing is","first","then","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"mateo",q:"Is it still important to memorise information when we can look everything up online?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I firmly believe that memorising still matters, although perhaps in a different way."],["","First and foremost, you can’t think critically about facts that you don’t know at all."],["","Equally, some jobs simply don’t leave time to search for information."],["","To illustrate this, a friend of mine who is a nurse in Recife has to know the key steps instantly in an emergency."],["","Admittedly, nobody needs to learn every date or phone number by heart any more."],["","Overall, search engines change what we need to memorise, not whether we need to."]],extra:"Recife has beautiful beaches, and many tourists visit it every year.",keys:["first and foremost","equally","admittedly","overall"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"Should schools focus less on exams?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","schools should keep exams but give them a smaller role."],["On the one hand,","exams motivate many students to review what they have learnt."],["On the other hand,","when everything depends on one exam, students often cram and forget soon afterwards."],["For example,","my younger sister in Lagos crammed for a history exam, passed it and could remember almost nothing a month later."],["That’s why","regular small tests and projects might show what students really know."],["Ultimately,","the goal of school is learning that lasts, not just a good mark on one day."]],distractors:["Similarly,","As a result,"],keys:["a smaller role","cram and forget","small tests and projects","learning that lasts"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"leo",q:"What is the best way to learn a new skill?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["small steps","practise a little and often","for example","learn from mistakes","teach someone else"],model:"I think the best way to learn a new skill is to break it into small steps, so you don’t feel overwhelmed. Then practise a little and often, rather than for hours once a week. For example, when I learnt to play the guitar in Hamburg, I practised for fifteen minutes every evening, and after a few months I could play songs with friends. It’s also important to learn from mistakes instead of avoiding them. And finally, try to teach someone else what you know: explaining a skill shows you very quickly what you haven’t really understood yet."}],np={title:"Exam Part 2 practice: helping first-year students study better",situation:"A university in Navoi wants to help first-year students study more effectively. It can support only one idea: a “study skills week” with short workshops, a quiet study room that stays open late, or a peer-tutoring scheme where second-year students help first-years. Mateo and Nur are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"mateo",B:"nur",lines:[["A","So, where do we start? The study skills week sounds useful."],["B","It does. Students could learn how to plan and how to revise, couldn’t they?"],["A","Exactly. But a week is soon over. Would they remember it all in May?"],["B","Probably not. What about the quiet study room? Lots of students need one."],["A","True, but a room doesn’t teach you how to study better, does it?"],["B","Good point. So the peer tutors might be best: they’d be there all year."],["A","And first-years often listen to older students more than to teachers."],["B","So shall we go for the peer tutors, and ask them to share study tips in their first session?"],["A","Agreed. That way, the skills don’t disappear after one week."]],phrases:{Start:["So, where do we start?","… sounds useful."],Clarify:["…, couldn’t they?","Would they …?"],"Give the turn":["What about …?","…, does it?"],"Agree and decide":["Good point.","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your class wants to remember the new English words from this term. Choose **one** idea: a weekly word quiz game, a shared online list with example sentences, or a “word wall” in the classroom. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["I learnt it by heart.","It slipped my mind.","It’s on the tip of my tongue.","I test myself.","A little and often.","It really sticks.","I crammed for it.","It rings a bell.","I need to brush up on …"],B:["I racked my brains.","A little and often.","It rings a bell.","I’ve got a memory like a sieve.","It slipped my mind.","It jogged my memory.","I learnt it by heart.","I test myself.","It really sticks."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["I learnt it by heart.","It slipped my mind.","It’s on the tip of my tongue.","I test myself.","A little and often.","It really sticks.","I crammed for it.","It rings a bell.","I need to brush up on …","I racked my brains.","I’ve got a memory like a sieve.","It jogged my memory."],questions:["How do you remember new words in a foreign language?","Is cramming the night before an exam ever a good idea?","Have phones made our memories worse? Why (not)?","What is the best way to learn a new skill?","Do schools in Uzbekistan ask students to learn a lot by heart? Is it the same in another country you know?","Which do you remember better: things you read, things you hear or things you do?"]},sp=[{type:"stress",title:"Stress Spot: words about learning",intro:"Tap the stressed syllable. Rules: before -sion and -tion, the syllable is strong, so the stress can move (reVISE → reVIsion, rePEAT → repeTItion, CONcentrate → concenTRAtion). Then listen and say the word.",follow:"Now use two of these words in one sentence about the Memory House.",items:[{w:"memory",syl:["mem","o","ry"],s:0},{w:"memorise",syl:["mem","o","rise"],s:0},{w:"remember",syl:["re","mem","ber"],s:1},{w:"revise",syl:["re","vise"],s:1},{w:"revision",syl:["re","vi","sion"],s:1},{w:"repetition",syl:["rep","e","ti","tion"],s:2},{w:"concentrate",syl:["con","cen","trate"],s:0},{w:"concentration",syl:["con","cen","tra","tion"],s:2}]},{type:"pairs",title:"Sound Pairs: /θ/ or /f/?",intro:"Press Play and choose the word you hear. For /θ/ (three, thought), put the tip of your tongue between your teeth and blow gently. For /f/ (free, fought), your top teeth touch your bottom lip. Some Uzbek speakers may say /θ/ like /s/, /t/ or /f/, so three can sound like free or tree: let your tongue come forward. Partner version: one student says a word, the partner points to it.",pairs:[["three","free"],["thought","fought"],["thin","fin"],["thirst","first"],["death","deaf"]]}],op=["Use two C1 phrases in your next answer.","Ask the Reporter a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say which learning strategy you would NOT use, and why.","Explain the last door again in three sentences, without notes."],lp={title:"Step Up Speaking Club: Why I Stopped Cramming",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Leo and Aziza talk about memory: how Leo crammed for exams in Hamburg, what a tutor taught his study group, how Aziza’s grandmother in Navoi remembers names and words, and how Leo is brushing up on his Russian. Each extract is a different situation.",tip:["Listen for the result","In short extracts, speakers often describe what they did and then what happened: *a week later …*, *but the information stayed*. Questions often ask about the result, so don’t stop at what the speaker did."],A:"leo",B:"aziza",lines:[["A","*Extract 1.* In my first year in Hamburg, I always **crammed for exams**. I would **learn** whole pages **by heart** the night before, pass the exam, and a week later most of it had gone. That kind of **rote learning** got me through, but I didn’t really **take in** much."],["B","[[0]] you passed, but you didn’t really learn?"],["A","Pretty much."],["A","*Extract 2.* Then I joined a study group. Our tutor showed us how to **retain information** for longer: short sessions spread over several days, and testing ourselves instead of rereading. At first it felt slower, but the information stayed. [[1]] slower is often faster in the end."],["B","*Extract 3.* My grandmother in Navoi has her own methods. [[2]] stay calm. [[3]] when a name **slips her mind**, she doesn’t panic: she goes through the alphabet until the name **rings a bell**. And when a word is **on the tip of her tongue**, she **racks her brains** for a moment, then looks at an old photo to **jog her memory**."],["A","*Extract 4.* Before my exchange in Uzbekistan, I want to **brush up on** my Russian, so I’m using the same system, [[4]] it works. Even someone like me, with **a memory like a sieve**, can remember things for longer."]],gaps:[[1,"Hold on, are you saying that"],[2,"In my experience,"],[3,"The trick is to"],[4,"For example,"],[5,"simply because"]],questions:[{q:"Extract 1. What was the problem with Leo’s first-year method?",o:["He failed most of his exams.","He soon forgot what he had learnt.","He had no time to study."],a:1,why:"“… pass the exam, and a week later most of it had gone.” He passed, so A is wrong."},{q:"Extract 2. What did the tutor show the study group?",o:["short sessions and testing yourself","rereading notes every evening","learning whole pages by heart"],a:0,why:"“… short sessions spread over several days, and testing ourselves instead of rereading.”"},{q:"Extract 3. What does Aziza’s grandmother do when she forgets a name?",o:["She asks someone in the family.","She looks at an old photo straight away.","She stays calm and goes through the alphabet."],a:2,why:"“… when a name slips her mind, she doesn’t panic: she goes through the alphabet …” The photo is for a word, and only after she racks her brains."},{q:"Extract 4. Why is Leo using the same system for his Russian?",o:["His tutor told him to.","It has worked for him.","He has very little time."],a:1,why:"“… I’m using the same system, simply because it works.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, an example, a reason? Which one does Aziza use to check meaning, and which one gives a tip?",groups:[["Checking meaning",[1]],["Opinion",[2]],["Giving a tip",[3]],["Example",[4]],["Reason",[5]]]},use:{q:"Should students learn poems or texts by heart at school? Why or why not?",by:"mateo",model:"In my experience, learning a short text by heart can be useful, but only if you understand it first. For example, at school in Recife we learnt a famous poem, and I still remember it, simply because our teacher made us discuss every line before we memorised it. The trick is to learn the meaning, not just the words. So, all in all, learning by heart is fine, but rote learning alone isn’t enough.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Gf,DIALOGUE:np,DRILLS:Yf,ESCAPE:ep,LESSON:Kf,LEVELS:tp,LISTEN:lp,MAIN:Uf,PRON:sp,ROUNDS:Jf,TWISTS:$f,UNIT:Zf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},up={openverse:"f7ec6a16-8f7c-4372-861e-ecb5f4b3a350",title:null,creator:null,source:"rawpixel",url:"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvZnJnYWxsZXJ5X2FydF9hcnRfZ2FsbGVyeS1pbWFnZS1reWNneW0xdS5qcGc.jpg",page:"https://www.rawpixel.com/image/6061710/free-public-domain-cc
