e",min:15,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Listen to a Club podcast interview about planting trees on a hot street (exam format), notice how the speakers give opinions and check meaning, then use the phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The text is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about green cities (susTAINable, irriGAtion, CANopy), and /iː/ or /eɪ/: tree or tray? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Are trees a luxury or a necessity for cities?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about trees, shade and green cities. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most surprising argument for or against trees they heard (use the wheel)."]},{id:"game",icon:"🌳",name:"Thirty Summers",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Lead designer","Tree expert","Care planner","Sketcher","Board member"],desc:"Pitch Room for a greener city: turn over a city site, sketch a tree plan, pitch it to the Green City Board, defend it after a time jump of 10, 20 or 30 years, answer residents’ objections, and let the Board score it. (Book: section 6 · Game School: Pitch Room)",howto:["15 students = 3 teams of five (👥 Class → Groups of 5). Each team plans trees for one site.","Roles: lead designer (pitches), tree expert (which trees and where), care planner (water and who looks after the trees), sketcher (draws the plan in the book), board member (sits on the Green City Board, opens time-jump cards for another team, plays a resident in Round 5 and scores).","Rounds: Read the site 2 min · Plan and sketch 4 min · Pitch 4 min (75 s per team) · Time jump 3 min · Residents’ objections 3 min · The Board decides 2 min.","Only one projector? Teams work on paper; the teacher opens the cards on the screen for each team in turn."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about one green project for a university campus, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 67, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions and underline the key words. In an interview, the questions often ask **why** a speaker says something or **how she feels**.","Press **Play the podcast**. Choose A, B or C. Press **Check**: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, or checking and clarifying.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","For question 3, I chose B. She isn’t angry with the city.","gives an answer"],["B","What makes you say that?","asks for evidence"],["A","She says, *I understand why the city did it, but I still miss it.*","quotes the text"],["B","Right: she accepts the reason, but she feels the loss.","paraphrases"]],checks:[["Why does Nur ask *Sorry, what exactly do you mean by …?*","to get Aziza to explain a word (“adopted”) more clearly."],["Which phrase introduces Aziza’s example?","A case in point is …"]]},pron:{ref:"Book: Lesson 67, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion**, **-ity** and **-ic**, the syllable is strong (*irriGAtion*, *polLUtion*). *CANopy* and *TEMperature* are strong at the start.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /iː/ (*tree*, *green*) or /eɪ/ (*tray*, *grain*)?","/iː/ is one long sound: smile and keep your tongue high. /eɪ/ moves: start at *e* and glide up to *ɪ*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *irrigation*. Which syllable is strong?",""],["A","The first: *IR*-ri-ga-tion?","a guess"],["T","Listen again: ir-ri-*GA*-tion. What comes after it?","the teacher gives a clue"],["A","*-tion*! So the syllable before it is strong.","uses the rule"],["T","Good. Now *canopy*.",""],["B","*CAN*-o-py: strong at the start.","listens"],["T","Yes! Now: *grain*. First or second: *green* or *grain*?",""],["B","Second: *grain*. My voice moves from *e* to *ɪ*.","feels the glide"]],checks:[["Where is the stress in *pollution*?","on LU: pol-LU-tion (the syllable before -tion)."],["Where is the stress in *temperature*?","on TEM: TEM-per-a-ture (at the start)."],["Which word has a sound that moves: *see* or *say*?","*say*: /eɪ/ glides; *see* has one long /iː/."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*To start with*, *Granted*, *Take …*, *Ultimately*).","Make sure your answer has a clear **position**, a **reason**, one **example**, a fair **concession** and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, a necessity, I think. Shade, cooler streets. My street in Hamburg, old trees, er, everybody walks there. Trees cost money, yes. But, um, the right tree, the right place.","Attempt 1 · 90 s · the key words, many pauses"],["leo","I think trees are a necessity, not a luxury. They give shade and keep streets cooler in summer. For example, my old street in Hamburg has big lime trees, and people choose to walk there. Of course, trees cost money to water and care for. But if we plant the right tree in the right place, it pays back.","Attempt 2 · 60 s · linking phrases"],["leo","Trees are a necessity, not a decoration. They cool the street and clean the air for free, every day. The lime trees on my old street in Hamburg turn a hot walk into a pleasant one. Granted, they need water and care, but the right tree in the right place gives back far more than it costs.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Which is better: one big park or trees on every street?",lines:[["amara","**I’d go as far as to say** that street trees matter more. A park is lovely at the weekend, **but it’s not just about** weekends: people need shade on the way to work. **In the long run,** a **tree canopy** over every street cools the whole city. **Let’s be realistic,** though: **who will look after** all those trees?","speaker · 1 minute"],["nur","I heard six: *I’d go as far as to say*, *it’s not just about*, *in the long run*, *tree canopy*, *Let’s be realistic* and *who will look after*. That’s a row: **Bingo!**","listener reports"],["amara","Six points plus three: nine!","count the points"],["nur","Next time, try *native species*: it’s on my card, and it answers your own question about care.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*The university can fund one green project …*).","Click the lines in order. Each line answers the line before. Nur and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a class plant",lines:[["A","Our classroom could have one plant: a small tree in a pot or a herb box.","opens the topic"],["B","The tree looks nicer, but who waters it in the holidays?","a doubt"],["A","True. The herb box needs less water, and we can use the herbs.","an argument"],["B","Then let’s start with the herbs, and try a tree next year.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School: Pitch Room · section 6",steps:["Make teams of five: **lead designer**, **tree expert**, **care planner**, **sketcher** and **board member**. The three board members together are the **Green City Board**.","**Round 1 · Read the site (2 min):** the lead designer turns over one **site card**. Read it and its **site survey**. Agree on the site’s three biggest needs and one limit.","**Round 2 · Plan and sketch (4 min):** which trees, where, how they get water and who looks after them. The sketcher draws the plan in the book.","**Round 3 · The pitch (75 s per team):** pitch to the Board and hold up the sketch. Say what the site will feel like on a July afternoon in ten years.","**Round 4 · Time jump:** a board member from another team opens a **time-jump card** for your team. One minute: adapt or defend your plan.","**Round 5 · Residents’ objections:** board members play residents and open **objection cards**. Acknowledge, answer, offer.","**Round 6 · The Board decides:** each board member scores the other teams on four criteria. Which plan gets the money?"],exTitle:"Sample game: Team Chinar (the school yard)",lines:[["","Lead designer: Aziza · Tree expert: Mateo · Care planner: Nur · Sketcher: Amara · Board member: Leo (on the Board for the other teams)",""],["aziza","Our site is the school yard: hot asphalt, no shade, and the survey says the school has a gardening club looking for a project. **Our three needs:** shade for the break, cooler classrooms on the south side, and something the pupils can own.","Round 1 · reads the site"],["mateo","**I’d suggest native, drought-tolerant trees** along the south wall, not in the middle, because the pupils need open space to play.","Round 2 · the tree expert"],["nur","**And for care:** every class adopts one tree. The gardening club waters them in the summer holidays, with drip irrigation from the school’s tap.","Round 2 · the care planner"],["","… Round 4 · Time jump …",""],["leo","(board member, opening the card) **Thirty years later:** a pest attacks one kind of tree across the city. How many of your trees are the same kind?","a time-jump card"],["aziza","**Good question.** We planned three different native species, so one pest can’t take the whole row. **If anything,** this card shows why we mixed them.","defends the plan"],["","… Round 5 · Residents’ objections …",""],["leo","(as a parent) **My worry is that** children will climb the trees and fall.","an objection"],["amara","**That’s a fair worry.** For the first years, the trees are too thin to climb. **What we can offer** is a low bench around each trunk, so children sit under them rather than climb them.","acknowledge, answer, offer"]],checks:[["What do you do with a time-jump card?","say in one minute whether your plan still works, and adapt or defend it."],["How do you answer a resident’s objection?","acknowledge the worry, answer it, and offer something."],["Who scores your team?","the board members of the other teams, never your own."]]},drills:{ref:"Book: Lesson 67 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"On a hot afternoon, big old trees ___ for people waiting at the bus stop.",o:["provide shade","take root","cut down"],a:0},{q:"Leaves catch dust, so trees help to ___.",o:["filter the air","soak up the shade","plant saplings"],a:0},{q:"During a storm, trees and soil ___ before it floods the road.",o:["soak up rainwater","filter the shade","take root"],a:0},{q:"In spring, the volunteers ___ along both sides of the street.",o:["planted saplings","cut down saplings","soaked up saplings"],a:0},{q:"Trees that grow naturally in a region are called ___.",o:["native species","green spaces","tree canopies"],a:0},{q:"A ___ tree can survive long periods with little water.",o:["drought-tolerant","native-tolerant","shade-tolerant"],a:0},{q:"Most of the young trees have ___ and are growing well.",o:["taken root","provided shade","cut down"],a:0},{q:"When each family adopted a tree, they felt a ___.",o:["sense of ownership","tree canopy","heat island"],a:0},{q:"Parks, gardens and squares with grass are all ___.",o:["green spaces","native species","saplings"],a:0},{q:"Stone and asphalt store heat, which creates an ___.",o:["urban heat island","urban tree canopy","urban green space"],a:0},{q:"The branches of the old plane trees form a ___ over the street.",o:["tree canopy","heat island","sense of ownership"],a:0},{q:"When the road was widened, the old tree was ___.",o:["cut down","taken root","planted"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"The volunteers planted the trees. → **passive: The trees …**",a:"The trees were planted by the volunteers."},{p:"The trees were planted last spring. → **The trees have been … since …**",a:"The trees have been growing since last spring."},{p:"Nobody watered the saplings, so they dried out. → **If somebody had …**",a:"If somebody had watered the saplings, they wouldn’t have dried out."},{p:"The city should have planted trees years ago. → **Trees should …**",a:"Trees should have been planted years ago."},{p:"The trees need water. Otherwise, they die. → **unless**",a:"The trees die unless they get water."},{p:"What the street needs most is shade. → **It’s shade that …**",a:"It’s shade that the street needs most."},{p:"We rarely think about trees until they are gone. → **Rarely …(inversion)**",a:"Rarely do we think about trees until they are gone."},{p:"The trees grow taller. The street becomes cooler. → **The taller …, the cooler …**",a:"The taller the trees grow, the cooler the street becomes."},{p:"Trees give shade. They also clean the air. → **not only … but also**",a:"Trees not only give shade but also clean the air."},{p:"Families adopted the trees, and the trees survived. → **Having adopted …**",a:"Having adopted the trees, the families made sure they survived."},{p:"I wish the city hadn’t cut down the old tree. → **If only …**",a:"If only the city hadn’t cut down the old tree!"},{p:"Someone has to look after the trees. → **It’s essential that someone …**",a:"It’s essential that someone look after the trees."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Trees make the street cooler.",a:"Trees provide shade and help the street stay noticeably cooler."},{p:"I think every street needs trees.",a:"I’d go as far as to say that a street without trees isn’t finished."},{p:"The trees died because nobody watered them.",a:"That was largely because nobody felt responsible for watering them."},{p:"For example, our neighbour waters his tree.",a:"A case in point is our neighbour, who waters “his” tree every evening."},{p:"Trees cost money, but they are worth it.",a:"Granted, trees cost money, but in the long run they give back far more."},{p:"We should choose trees that need little water.",a:"We should opt for native, drought-tolerant species."},{p:"Do you mean the families water the trees?",a:"So, if I’ve understood you correctly, the families water the trees themselves?"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ In summer, big trees give a nice shadow.",o:["In summer, big trees give nice shade.","In summer, big trees give a nice shadows.","In summer, big trees make a nice shadow for people."],a:0,why:"shade = a cool place out of the sun; a shadow = the dark shape of something"},{q:"✗ Last spring we sowed trees near our school.",o:["Last spring we planted trees near our school.","Last spring we sowed trees in our school.","Last spring we were sowing trees near our school."],a:0,why:"plant a tree; sow seeds (both are ekmoq in Uzbek)"},{q:"✗ The air in the park is more fresh.",o:["The air in the park is fresher.","The air in the park is more fresher.","The air in the park is the more fresh."],a:0,why:"short adjectives: fresh → fresher"},{q:"✗ In our street there is no any trees.",o:["In our street there are no trees.","In our street there isn’t no trees.","In our street there are no any trees."],a:0,why:"no + noun, or not any + noun; never no any"},{q:"✗ Volunteers must to water the young trees.",o:["Volunteers must water the young trees.","Volunteers must watering the young trees.","Volunteers musts water the young trees."],a:0,why:"must + infinitive without to"},{q:"✗ The city must plant more green.",o:["The city must plant more trees.","The city must plant more greens.","The city must plant the more green."],a:0,why:"plant trees / create green spaces; green is not a countable thing you plant"},{q:"✗ Trees help to decrease the pollution of air.",o:["Trees help to reduce air pollution.","Trees help to decrease the air’s pollutions.","Trees help reducing the pollution of the air’s."],a:0,why:"air pollution (noun + noun); reduce pollution"},{q:"✗ The old tree was cut last year, so the street is hot.",o:["The old tree was cut down last year, so the street is hot.","The old tree was cutted down last year, so the street is hot.","The old tree was cut off last year, so the street is hot."],a:0,why:"cut down a tree (the whole tree falls); cut → cut → cut"}]},{title:"Stress: words about green cities",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"able to continue for a long time without harming nature",o:["susTAINable","SUStainable"],a:0},{q:"bringing water to plants through pipes or channels",o:["irriGAtion","IRrigation"],a:0,why:"Before -tion, the syllable is strong."},{q:"the leaves and branches of trees above you",o:["CANopy","caNOpy"],a:0},{q:"dirt and harmful substances in the air or water",o:["polLUtion","POLlution"],a:0,why:"Before -tion, the syllable is strong."},{q:"how hot or cold something is",o:["TEMperature","temPERature"],a:0},{q:"the natural world around us",o:["enVIronment","ENvironment"],a:0},{q:"a person who works for free to help others",o:["volunTEER","VOLunteer"],a:0}]}],Gf={cardsStep:"Site cards",cardsTitle:"Site cards",cardsHint:"Each team’s lead designer picks one card: it turns over and opens. Read the site, its problem and its limits aloud to your team. Then open the “Site survey”: it is a fact only your team knows until the pitch. Close the card, and the next team picks.",backWord:"Site",hiddenLabel:"Site survey",hiddenAll:"Show all site surveys",twistWord:"Year",twistTitle:"Time-jump cards",twistHint:"A board member from another team opens one card and reads it aloud: it is now 10, 20 or 30 years later. The team has **one minute**: does the plan still work? **Adapt** it or **defend** it, with a reason. The board member may ask one more question.",twistHelp:{b2:["Our plan still works, because …","We would change one thing: …","We planned for this: …"],c1:["If anything, this shows why we …","We’d adapt the plan by …","With hindsight, we should have …, so now we would …"]},questionWord:"Objection",questionTitle:"Residents’ objection cards",questionHint:"Board members now play **residents**. Open one card and ask the team as that resident, in your own words. One team member answers in **45 seconds**: **acknowledge** the worry, **answer** it, and **offer** something. The resident says *I can live with that* or *I’m still worried, because …*",questionHelp:{b2:["I understand your worry.","In fact, …","What we can do is …"],c1:["That’s a perfectly fair concern.","The way we’ve planned it, …","What we can offer you is …"]},scoreTitle:"Green City Board score sheet",scoreHint:"Each board member scores every team except their own: 0–5 for each criterion. Then say one thing that convinced you and one thing to improve. The plan with most points gets the money from **Thirty Summers**.",scoreCriteria:["Fits the site","Water and care","Thirty summers","The pitch"],teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Read the site",lv:"c1",bloom:"Analyse",by:"nur",seconds:120,q:"Read your site card and the **site survey**. Agree on the site’s **three biggest needs** (shade? cooler air? less flooding? a place to sit?) and **one limit** your plan must respect (cables, parking, open space, floods …).",help:{b2:["The biggest problem here is …","People need …","We must be careful with …"],c1:["What this site needs above all is …","The survey changes things: …","Whatever we plan, we can’t ignore …"]},model:"What this site needs above all is shade: people wait at this bus stop in the full afternoon sun, with nothing but a thin glass roof. The second need is somewhere to sit, and the third is cooler air, because the stop is right next to four lanes of traffic. Our limit is the narrow pavement, with cables underneath it. But the survey changes things: there’s an old aryk behind the stop, under a metal cover, so water may be closer than we thought."},{name:"Round 2 · Plan and sketch",lv:"c1",bloom:"Create",by:"aziza",seconds:240,q:"Plan your trees: **which kinds** (native? drought-tolerant? tall or small?), **where exactly** they go, **how they get water**, and **who looks after them** for the first three summers. The sketcher draws the site in the book (section 6): trees as circles, water as blue lines, seats as squares.",help:{b2:["We’d plant … along …","They get water from …","… will look after them."],c1:["We’d opt for …, because they …","Water would come from …, so …","Care is the heart of the plan: …"]},model:"We’d opt for three native, drought-tolerant species, so that one dry summer or one pest can’t destroy the whole row. They go behind the bus stop, not on the narrow pavement, so the roots stay away from the cables, and the branches will reach over the shelter as they grow. Water would come from the old aryk, with a simple drip line to each tree. Care is the heart of the plan: the café and the two shops next to the stop adopt one tree each, and the city waters the rest for the first three summers."},{name:"Round 3 · The pitch",lv:"c1",bloom:"Create",by:"mateo",seconds:75,q:"Pitch your plan to the **Green City Board** in **75 seconds**: the site and its problem, your trees, water and care, and **what the site will feel like on a July afternoon ten years from now**. Hold up your sketch. The Board listens and notes one question.",help:{b2:["Our site is …, and the problem is …","Our plan is to …","In ten years, …"],c1:["Picture this site on a July afternoon: …","What makes our plan different is …","Ten summers from now, …"]},model:"Picture this car park on a July afternoon: no shade, hot cars, and a corner that floods every spring. Our plan doesn’t remove a single parking space. Instead, we turn the strips between the rows into long, low beds with native trees that can stand both dry summers and wet springs, and the flooded corner becomes a rain garden that soaks up the water. The supermarket adopts the trees and waters them from the roof’s rainwater tank. Ten summers from now, people will park in the shade, and the car park will finally have a reason to be proud of itself."},{name:"Round 4 · Time jump",lv:"c1",bloom:"Evaluate",by:"leo",tool:"twists",seconds:60,q:"A board member from another team opens **one time-jump card** for your team. It is now **10, 20 or 30 years later**. You have **one minute**: does your plan still work? **Adapt** it or **defend** it, with a reason.",help:{b2:["Our plan still works, because …","We would change …","We planned for this: …"],c1:["If anything, this shows why we …","We’d adapt the plan by …","With hindsight, we should have …, so now we would …"]},model:"Twenty years later, the city wants to widen the road by one lane, and our trees are in the way. We’d defend the plan, but not blindly. If anything, this card shows why we put the trees behind the bus stop and not on the pavement: the new lane can be built without cutting down a single one. Where one tree does stand in the way, we’d ask the city to move the lane a metre, because a twenty-year-old tree can’t be replaced in a summer."},{name:"Round 5 · Residents’ objections",lv:"c1",bloom:"Evaluate",by:"amara",tool:"questions",seconds:45,q:"Board members now play **residents**. Each opens one **objection card** and asks your team. One team member answers in **45 seconds**: **acknowledge** the worry, **answer** it, and **offer** something.",help:{b2:["I understand your worry.","In fact, …","What we can do is …"],c1:["That’s a perfectly fair concern.","The way we’ve planned it, …","What we can offer you is …"]},model:"That’s a perfectly fair concern: leaves do fall, and someone has to sweep them up. The way we’ve planned it, most of our trees keep their leaves for a long time and drop them over a few weeks, not all at once. What we can offer you is a leaf day each autumn: the school’s gardening club collects the leaves, and they go into compost for the trees themselves. So the leaves don’t end up in the drains; they end up back at the roots."},{name:"Round 6 · The Board decides",lv:"c1",bloom:"Evaluate",by:"nur",tool:"score",seconds:60,q:"Each board member scores every team except their own, 0–5 for **fits the site**, **water and care**, **thirty summers** (will it still work?) and **the pitch**. Which plan gets the money? Then step out of the game: **are trees a luxury or a necessity for cities?**",help:{b2:["We give the money to …, because …","Their strongest point was …","Trees are a … for cities, because …"],c1:["What tipped the balance for us was …","Their plan was the only one that …","For me, trees are a necessity, because …"]},model:"We give the money to the school-yard team. What tipped the balance for us was the care plan: every class adopts a tree, and the gardening club waters them in the holidays, so the trees belong to someone from the first day. Their answer to the time-jump card was strong, too: they had mixed three species, so one pest couldn’t destroy the row. Stepping out of the game, I’d say trees are a necessity, not a luxury: a city without them is simply hotter, louder and harder to love."}],_f=[{e:"🚏",n:"The bus stop on the main road",r:"City centre · four lanes of traffic",lines:[["The site","A busy bus stop with a thin glass roof. People wait here in the full afternoon sun."],["Needs","Shade, somewhere to sit, cooler air."],["Limits","A narrow pavement with cables underneath it."]],x:"An old aryk (irrigation channel) runs behind the bus stop, under a metal cover."},{e:"🏫",n:"The school yard",r:"A school on the edge of the centre",lines:[["The site","A wide asphalt yard. In the break, pupils stand in the few narrow shadows of the building."],["Needs","Shade for the breaks, cooler classrooms on the south side."],["Limits","Pupils need open space to run and play ball."]],x:"The school has a gardening club that is looking for a project, and a tap in the yard."},{e:"🅿",n:"The supermarket car park",r:"Next to a new supermarket",lines:[["The site","A wide, flat car park: no trees, hot cars, hot asphalt."],["Needs","Shade, cooler air, somewhere for rain to go."],["Limits","The owner does not want to lose parking spaces."]],x:"After heavy rain, one corner of the car park floods every spring."},{e:"🌊",n:"The canal bank",r:"A walking path along a canal",lines:[["The site","A long path beside a canal. The bank is slowly falling into the water."],["Needs","Shade for walkers, roots to hold the bank together."],["Limits","In spring, the water rises and covers the lowest part of the bank."]],x:"Some of the old willows along the bank are dying, and nobody has planted new ones."},{e:"🧺",n:"The market square",r:"An open-air market",lines:[["The site","A big paved square where traders sit under umbrellas from early morning."],["Needs","Shade for traders and shoppers, a cooler square."],["Limits","Lorries deliver goods at dawn and need room to turn."]],x:"The traders already pay a small fee every month for cleaning the square."},{e:"🏢",n:"The new courtyard",r:"A new housing estate",lines:[["The site","A courtyard between four new blocks of flats: bare soil and a few benches."],["Needs","Shade, a place for families to meet, green views from the windows."],["Limits","An underground car park lies under half of the courtyard: roots cannot go deep there."]],x:"The residents have a busy group chat, and several of them have asked for “real trees, not bushes”."},{e:"🏘",n:"The mahalla street",r:"An old residential street",lines:[["The site","A narrow street of family houses. A few old trees are left; others were cut down years ago."],["Needs","Shade again, as the street used to have."],["Limits","House walls and gates are close to the road."]],x:"An older resident remembers exactly where the old trees grew and where the old aryk ran."},{e:"🚶",n:"The path to the university",r:"From the bus station to the campus",lines:[["The site","A long, straight path that hundreds of students walk every morning, with no shade at all."],["Needs","Shade for the walk, places to stop and sit."],["Limits","Lights and a water pipe run along one side of the path."]],x:"The university’s biology students are looking for a long-term field project."}],$f=[{t:"10 years later · The roots",q:"**Ten years later:** your trees are taller than the bus shelters and walls around them, but their roots have lifted some paving stones. Does your plan still work?",by:"mateo",m:"We planned for this, at least partly: we chose trees with deep roots rather than wide, shallow ones, and we left a wide soft bed around each trunk. Where the paving has lifted, we’d adapt the plan by replacing the stones with a porous surface that lets water through, so the roots go down, not sideways. Cutting the trees for the sake of a few stones would be the wrong way round."},{t:"10 years later · The carers move",q:"**Ten years later:** most of the people who adopted your trees have moved away. Nobody new has taken over, and nobody waters the trees in summer. What now?",by:"nur",m:"With hindsight, we should have written the care into a place, not a person. So now we would adapt the plan: the trees are adopted by the building, the school or the shop, not by one family, and the job passes on to whoever lives or works there next. By year ten, the trees need much less water anyway, because their roots go deep. The danger was always the first three summers, not the tenth."},{t:"20 years later · A very dry summer",q:"**Twenty years later:** a very dry summer. For two months, the city limits the water that can be used for gardens and trees. Will your trees survive?",by:"aziza",m:"If anything, this card shows why we chose native, drought-tolerant species: they are used to dry summers. A twenty-year-old tree has deep roots and can reach water that a young one cannot. We’d also defend the drip line: it puts every drop where the roots are, instead of watering the pavement. If the limits last longer, we’d ask the city to put street trees first in the queue, because one dead tree takes twenty years to replace."},{t:"20 years later · A wider road",q:"**Twenty years later:** the city wants to widen the road next to your site by one lane. Some of your trees may be in the way.",by:"leo",m:"We’d defend the plan, but not blindly. Most of our trees stand back from the road, so the lane can be built without cutting them down. Where one tree is in the way, we’d ask the city to bend the lane slightly or narrow the parking strip instead. A twenty-year-old tree gives shade that no new sapling can give for another twenty years, so the cost of cutting it is higher than it looks."},{t:"30 years later · Too much shade?",q:"**Thirty years later:** the trees are fully grown. Some residents say the deep shade makes their windows dark in winter, and the leaves block the drains every autumn.",by:"amara",m:"This is a good problem to have, but it is still a problem. We’d adapt the plan in two ways. First, careful pruning: thinning the branches lets winter light through without losing summer shade. Second, the leaf day: once a year, volunteers collect the leaves before they reach the drains, and they go into compost. And next time, near windows, we’d choose trees that lose their leaves in winter, so the light comes back exactly when people need it."},{t:"30 years later · A pest",q:"**Thirty years later:** a pest attacks one kind of tree across the city, and many trees of that kind are dying. How many of your trees are the same kind?",by:"mateo",m:"This is exactly why we planted three different native species instead of one: a pest that attacks one kind can’t take the whole row. We might lose a third of our trees, which would hurt, but the street would still have shade while we replant. If we had planted only one kind because it looked neat, we would be starting again from nothing."}],ep=[{t:"The shopkeeper",q:"“Your trees will hide my shop sign from the street. Customers won’t find me.”",by:"aziza",m:"I understand your worry: your sign is how people find you. The way we’ve planned it, the trees go between the shops, not in front of the doors, and their lowest branches will be pruned high, so the sign stays visible. What we can offer you is this: on a hot day, people walk slowly in the shade and look at the windows. A shady street is good for business."},{t:"The driver",q:"“You’re taking away parking spaces. Where am I supposed to park?”",by:"leo",m:"That’s a perfectly fair concern. In fact, our plan doesn’t remove a single space: the trees go in the strips between the rows, which are empty asphalt now. What we can offer you is a cooler car: park under a tree in July, and you won’t burn your hands on the steering wheel."},{t:"The neighbour",q:"“Who is going to sweep up all those leaves in autumn? Not me.”",by:"amara",m:"That’s fair: leaves do fall, and someone has to deal with them. The way we’ve planned it, the leaves fall over a few weeks, not in one day. What we can offer you is a leaf day each autumn: volunteers collect them, and they go into compost for the trees themselves."},{t:"The parent",q:"“Children will climb the trees and fall. Who is responsible then?”",by:"nur",m:"Every parent would ask that. For the first years, the trees are far too thin to climb. Later, the lowest branches will be pruned high, so they are out of reach. What we can offer is a low bench around each trunk, so children sit under the trees rather than climb them."},{t:"The ground-floor resident",q:"“A big tree outside my window will make my flat dark.”",by:"mateo",m:"That’s a real concern, and we’ve thought about it. Near windows, we’ve chosen trees that lose their leaves in winter: shade in summer, when you need it, and light in winter, when you want it. What we can offer you is a say: before we plant, you can tell us exactly where you don’t want a tree."},{t:"The engineer",q:"“Roots crack pipes and cables. I’ve seen it happen.”",by:"leo",m:"You’re right that it happens, so we planned around it. Our trees stand away from the pipes and cables marked on the site plan, and we’ve chosen species with deep roots rather than wide, shallow ones. What we can offer you is a root barrier: a simple wall in the soil that sends the roots down, not sideways."},{t:"The taxpayer",q:"“The road is full of holes. Why spend money on trees?”",by:"aziza",m:"I understand: the holes are annoying, and they’re dangerous. But it isn’t one or the other. A tree costs much less than a road, and the shade it gives also protects the asphalt from the sun, so the road cracks more slowly. What we can offer is to plant the trees when the road is repaired, so the street is dug up only once."},{t:"The older resident",q:"“We had trees here before, and the city cut them down. Why should we trust you now?”",by:"amara",m:"That’s a perfectly fair question, and I’m sorry about the old trees. This time, the trees won’t belong only to the city: every one will be adopted by a family, a shop or the school on the street. What we can offer you is a role: you remember where the old trees grew, so we’d like you to show us where the new ones should go."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Do you enjoy spending time in parks? Why (not)?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I love spending time in parks, especially in summer."],["Point","**The main reason is that** the trees make the air cooler and the city quieter."],["Example","**For example,** in Navoi I often study on a bench under the trees after my lectures."],["Close","**So, all in all,** a park is my favourite place to relax in the city."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"mateo",q:"Why do people feel better under trees?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first reason is that** trees give us shade, so our bodies feel cooler at once."],["","**Then,** green leaves are restful to look at after hours of screens and traffic."],["","**What is more,** trees make the city quieter, because they soften the noise of the street."],["","**For instance,** in Recife my family always meets in the same square, under one huge old tree."],["","**Finally,** trees remind us of time: they were there before us and will be there after us."],["","**In short,** under a tree we slow down, and that makes us feel better."]],keys:["the first reason","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"nur",q:"Should a city spend its money on street trees or on big parks?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that street trees should come first, although parks still matter."],["","To begin with, people need shade where they walk and wait every day, not only at the weekend."],["","On top of that, trees along every street spread the cooling effect across the whole city."],["","A case in point is my route to university in Kuala Lumpur: the shady streets are the ones everybody chooses to walk along."],["","Admittedly, a big park gives space for sport and events that a street never can."],["","On balance, a city should plant trees on every street first, and then add parks where there is room."]],extra:"My cousin in Kuala Lumpur has just bought a new bicycle.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"Who should look after the trees in a city?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","looking after city trees should be shared between the city and the people who live near them."],["After all,","the city has the money and the experts, but it cannot water every tree every day."],["However,","residents walk past the trees every day and notice at once when one is in trouble."],["For example,","on my street in Lagos, a neighbour noticed a sick tree long before the city did."],["That is why","the best schemes give residents a small job, like watering, and the city the big ones, like pruning."],["Ultimately,","a tree survives when someone feels it is theirs."]],distractors:["Similarly,","Otherwise,"],keys:["shared","money and experts","residents notice","someone feels it is theirs"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"leo",q:"Are trees a luxury or a necessity for cities?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["a necessity, not a decoration","shade, cooler streets, cleaner air","lime trees on an old street in Hamburg","granted: water and care cost money","the right tree in the right place","a city without trees is harder to live in"],model:"I’d say trees are a necessity, not a decoration. Every day, without asking for anything, they give us shade, cooler streets and cleaner air. I grew up on an old street in Hamburg lined with huge lime trees, and in summer it was the street everyone chose to walk along, even if it was the longer way. Granted, trees are not free: someone has to water them, prune them and sometimes repair the pavement around them. But if a city plants the right tree in the right place, and makes sure somebody looks after it, it gives back far more than it costs. A city without trees is simply hotter, louder and harder to live in."}],np={title:"Exam Part 2 practice: one green project for the campus",situation:"A university in Tashkent can fund one green project this year: a row of shade trees along the main path, a rooftop garden on the library, or a green wall of climbing plants on the canteen. Nur and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"mateo",lines:[["A","The university can fund one green project this year. Shall we start with the trees along the main path?"],["B","Sure. Everyone walks that path, so everyone would get the shade, wouldn’t they?"],["A","They would, although young trees take years to give real shade."],["B","Good point. What about the rooftop garden on the library?"],["A","It’s a lovely idea, but only a few students would ever go up there."],["B","True. And the green wall? The canteen gets very hot in the afternoon."],["A","It could cool the building, but climbing plants need a lot of care."],["B","So shall we choose the trees, and plant bigger ones so the shade comes sooner?"],["A","Agreed. That way, the whole campus benefits, now and for years to come."]],phrases:{Start:["The university can fund one …","Shall we start with …?"],Clarify:["…, wouldn’t they?","They would, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["So shall we choose …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your city can do **one** thing next summer: plant trees at every bus stop, open a new park on the edge of the city, or give free saplings to every family who promises to water one. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["I’d go as far as to say …","provide shade","Let’s be realistic: …","It’s not just about …","in the long run","Who will look after …?","native species","tree canopy","soak up rainwater"],B:["green spaces","in the long run","drought-tolerant","I’d go as far as to say …","Who will look after …?","provide shade","native species","On a hot afternoon, …","Let’s be realistic: …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["I’d go as far as to say …","provide shade","Let’s be realistic: …","It’s not just about …","in the long run","Who will look after …?","native species","tree canopy","soak up rainwater","green spaces","drought-tolerant","On a hot afternoon, …"],questions:["Which is better: one big park or trees on every street?","Should every new building come with new trees? Who should pay?","Who should water the trees in a city: the city or the people who live there?","What do trees give to a city in Uzbekistan? Is it different in another country you know?","Is it ever right to cut down an old tree? When?","Would you rather live on a shady street with little parking, or a sunny one with plenty of parking?"]},sp=[{type:"stress",title:"Stress Spot: words about green cities",intro:"Tap the stressed syllable. Rule: before -tion, the syllable is strong (irriGAtion, polLUtion). CANopy and TEMperature are strong at the start. Then listen and say the word.",follow:"Now use two of these words in one sentence about your site in Thirty Summers.",items:[{w:"sustainable",syl:["sus","tain","a","ble"],s:1},{w:"irrigation",syl:["ir","ri","ga","tion"],s:2},{w:"canopy",syl:["can","o","py"],s:0},{w:"pollution",syl:["pol","lu","tion"],s:1},{w:"temperature",syl:["tem","per","a","ture"],s:0},{w:"environment",syl:["en","vi","ron","ment"],s:1},{w:"volunteer",syl:["vol","un","teer"],s:2},{w:"community",syl:["com","mu","ni","ty"],s:1}]},{type:"pairs",title:"Sound Pairs: /iː/ or /eɪ/? (tree or tray?)",intro:"Press Play and choose the word you hear. /iː/ (tree, green, feel, see, keep) is one long sound: smile and keep your tongue high. /eɪ/ (tray, grain, fail, say, cape) moves: start at e and glide up to ɪ. If /eɪ/ comes out as a short, flat e, tray can sound like a different word. Partner version: one student says a word, the partner points to it.",pairs:[["tree","tray"],["green","grain"],["feel","fail"],["see","say"],["keep","cape"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say what the site will look like in thirty years.","Answer a worry: acknowledge, answer, offer."],lp={title:"Step Up Speaking Club podcast: Thirty Summers",format:"Interview · like exam Part 4 (multiple choice)",intro:"Nur interviews Aziza about a tree-planting project on a hot street in Navoi.",tip:["Listen for attitude","Many questions ask how a speaker feels or why she says something. Listen for words like honestly, but, I understand, I still …: they often show the speaker’s real attitude."],A:"nur",B:"aziza",lines:[["A","Welcome to the Step Up Speaking Club podcast. My guest is Aziza, who planted trees on a street in Navoi last spring with a group of student volunteers. Why that street, Aziza?"],["B","On a July afternoon, it’s just asphalt and parked cars, with no shade at all. [[0]] a street without trees isn’t finished. Trees **provide shade**, they **filter the air**, and in a storm they **soak up rainwater**. But honestly, our first try was a disappointment. We **planted saplings**, took photos and went home, and by August many of them had dried out. [[1]] nobody felt the trees were theirs."],["A","[[2]] the problem wasn’t the planting, but what happened afterwards?"],["B","Exactly. So the next spring, we chose **native species**, which are more **drought-tolerant**, and every family on the street adopted a tree."],["A","[[3]] “adopted”?"],["B","Each family promised to water one. [[4]] our neighbour on the corner: he waters “his” tree every evening! That **sense of ownership** made all the difference: almost every tree has **taken root**."],["A","Some people say parks matter more than street trees. Your view?"],["B","Parks and other **green spaces** are wonderful, but people need shade where they walk and wait. Asphalt stores the sun’s heat, which is why scientists talk about the **urban heat island**, and a **tree canopy** over a street really helps."],["A","And the old trees?"],["B","That’s the sad part. When the road in my grandparents’ mahalla was widened, an old chinar, a plane tree people had sat under for generations, was **cut down**. I understand why the city did it, but I still miss it. Planting is easy; it’s the next thirty summers that matter."]],gaps:[[1,"I’d go as far as to say that"],[2,"That was largely because"],[3,"So, if I’ve understood you correctly,"],[4,"Sorry, what exactly do you mean by"],[5,"A case in point is"]],questions:[{q:"Why did many of the first saplings dry out?",o:["They needed a lot of water.","Nobody took responsibility for them.","The summer was unusually hot."],a:1,why:"“That was largely because nobody felt the trees were theirs.” The trees that need less water came later, the next spring."},{q:"When Nur says “So, if I’ve understood you correctly, …”, she wants to …",o:["disagree politely.","check that she has understood.","move on to a new topic."],a:1,why:"She repeats Aziza’s idea in other words and waits for her to confirm: “Exactly.”"},{q:"How does Aziza feel about the old chinar that was cut down?",o:["The city had no reason to do it.","She accepts the reason but feels the loss.","She is glad the road is wider."],a:1,why:"“I understand why the city did it, but I still miss it.”"},{q:"“Planting is easy; it’s the next thirty summers that matter” means that …",o:["trees need people to care for them for years.","trees should only be planted in summer.","old trees are more useful than young ones."],a:0,why:"The whole story says so: the first saplings died without care; the adopted ones took root."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason or an example? Which two does Nur use to check and clarify what Aziza means?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[5]],["Checking and clarifying",[3,4]]]},use:{q:"Which place in your town or city needs trees most, and why?",by:"leo",model:"I’d go as far as to say that the bus stops in my part of Hamburg need trees more than any park does. That’s largely because people wait there every day, often for ten minutes or more, and a glass shelter gives no real shade. A case in point is the stop outside my old school: on a sunny afternoon, it turns into an oven, and everyone stands outside it instead. So, all in all, I’d plant trees where people actually wait and walk, not only where they go at the weekend.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ap=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARD
