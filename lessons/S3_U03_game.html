Pairs sort the five phrases.","Step 3: everybody listens to Nur, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word stress with -ment, -ness, -ful and -able, and /ʊ/ or /uː/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer about culture shock in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for giving advice and describing reactions. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best piece of advice they heard (use the wheel)."]},{id:"game",icon:"🧭",name:"First Month Abroad",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Scene reader","Speaker","Speaker","Speaker","Decision recorder"],desc:"Choose Your Path: guide Sardor through his first month abroad, one decision at a time. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team can follow a different path.","Each student turns over one perspective card (Optimist, Worrier, Planner, Local Friend, Culture Detective) and keeps it for the whole game.","Timing: cards 1 min · Before you go 3 min · The journey 10 min (four scenes and an ending) · Look back 4 min.","Only one projector? The teacher shows the scene, teams discuss for one minute, and the class votes. The team with the best reason explains the choice."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about welcoming a new international student, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 3, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: a fact, the speaker’s purpose, his attitude and his main message.","Press **Play the podcast**. Listen for the signposts (_First, … · So, here’s my message_). Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Leo said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, advice, and checking with the audience.","**Your turn:** listen to Nur, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","For question 3 I chose B. Leo doesn’t mind standing out.","gives an answer"],["B","Are you sure? He calls his Uzbek terrible.","challenges politely"],["A","Yes, but then he says you don’t have to be invisible to adapt.","uses the text as evidence"],["B","OK, so he accepts it and adapts anyway.","paraphrases"]],checks:[["How do signposts help you in a long talk?","they tell you what comes next, so you can follow the questions in order."],["Which phrase does Leo use to give advice?","If I were you, I’d …"]]},pron:{ref:"Book: Lesson 3, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the rule: **-ment, -ness, -ful and -able do not move the stress.** Find the base word (*excite*), and the stress stays there (*exCITEment*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ʊ/ or /uː/?","Say **both** words. /uː/ is long: round your lips tightly and push them forward (*pool*). /ʊ/ is short, with lips only a little rounded (*pull*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *homesickness*. Which syllable is strong?",""],["A","*NESS*? It’s the ending.","a first guess"],["T","Not quite. Find the base word first: *homesick*.","the teacher gives the rule"],["B","*HOME*-sick … so *HOME*-sick-ness! The ending doesn’t move the stress.","uses the rule"],["T","Yes! Everyone, say it and clap on HOME: HOME-sick-ness.","the class repeats"],["T","Now /ʊ/ or /uː/? Listen: *fool*. First or second: *full* or *fool*?",""],["A","Second: *fool*. It’s long, and my lips are tight and round.","checks the mouth"]],checks:[["Where is the stress in *excitement*?","on CITE: ex-CITE-ment, the same as in *excite*."],["How do you make /uː/?","make it long and round your lips tightly, as in *pool* and *food*."],["What do you do after a correct answer?","say the word aloud and clap on the stress."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think the hardest part is … small things, because, um, you don’t know how to do them … For example, my friend in the supermarket couldn’t find … things for plov. So, small things.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, the hardest part is the small, everyday things. The main reason is that you have to think about things you usually do automatically. For example, a friend of mine couldn’t find the ingredients for plov in a supermarket abroad. So small things are hard.","Attempt 2 · 60 s · linking words"],["aziza","In my view, the hardest part of a new culture is not the big things but the everyday ones. Suddenly you have to think about shopping, greetings, asking for help. A friend of mine felt completely lost in a supermarket because she couldn’t find anything for plov. All things considered, culture shock is a thousand small surprises, and you get used to them one by one.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What advice would you give to an international student who has just arrived in Navoi?",lines:[["leo","**If I were you, I’d** start with the bazaar. **At first, it can be hard to** understand the prices and the bargaining, **but** people are friendly and curious. **What surprises many people is** how often they are offered tea. **It might be a good idea to** learn a few Uzbek words, like *rahmat* for *thank you*. **The best thing you can do is** say yes to invitations.","speaker · 1 minute"],["amara","I heard five phrases: *If I were you, I’d*, *At first, it can be hard to*, *What surprises many people is*, *It might be a good idea to* and *The best thing you can do is*. That’s the top row: **Bingo!**","listener reports"],["leo","Great! Five points plus three for the Bingo: eight points.","count the points"],["amara","Next time, try *It takes a while to get used to …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, … we need to choose …*).","Click the lines in order. Each line answers the line before. Aziza and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a welcome gift for a new classmate",lines:[["A","So, what should we give our new classmate from abroad?","opens the topic"],["B","How about a map of Navoi with our favourite places on it?","an idea"],["A","Nice, but she can find maps online. What about a small phrasebook we write ourselves?","reacts + a new idea"],["B","Agreed. Let’s write it together this weekend.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · sample game in section 6",steps:["Make teams of five. Each student turns over one **perspective card** and keeps that role for the whole game.","**Round 1 · Before you go (3 min):** what should Sardor pack, prepare and learn? Agree on your top three.","**Round 2 · The journey (10 min):** one student reads the scene aloud. **Each perspective speaks once.** Then vote, click your option and say why.","Every path has **four scenes** and then an ending. There is no “game over”: every ending shows what Sardor learned.","At the ending, answer the reflection question together. Want to see another path? Press **Start again** after the lesson.","**Round 3 · Look back (4 min):** give three pieces of advice to next year’s exchange students. One student presents them in one minute."],exTitle:"Sample game: Team Silk Road plays Scene 2",lines:[["","Scene 2 · The night market — Optimist Amara · Worrier Leo · Planner Aziza · Local Friend Nur · Culture Detective Mateo",""],["aziza","(reads the scene aloud) … Option A: laugh too, ask Hafiz to teach him the dishes and tell everyone about plov. Option B: smile, eat slowly and go back early.","one student reads the scene and the options"],["amara","**Look on the bright side:** if he asks about the dishes, he’ll pick up new words, and they’ll see he’s interested. It’s a perfect way to **break the ice**.","Optimist: the benefit"],["leo","**My worry is that** he’s exhausted. If he tries too hard tonight, he might feel even more lost.","Worrier: the cost"],["nur","**From their point of view,** laughing together is friendly. They’re not laughing *at* him; they just forgot to switch to English.","Local Friend: the hosts’ view"],["mateo","**Maybe the reason** Hafiz chose a spicy dish **is that** it’s his favourite, so he’s sharing something important. Saying “It’s hot, but delicious!” would mean a lot to him.","Culture Detective: the hidden reason, without judging"],["aziza","**Step one would be to** ask one simple question, **and then** tell them about plov. After that, he can go home and rest.","Planner: the next step"],["leo","OK, if he can still leave early, the risk is smaller. I can live with A.","the Worrier changes his mind"],["nur","Let’s vote. A: five votes. B: nobody. Aziza, can you explain our choice?","the team votes"],["aziza","**Weighing it all up,** we choose A, because one funny moment can turn strangers into friends, and he can still rest afterwards.","the team clicks A and explains why (C1 phrase)"]],checks:[["How many times does each perspective speak in a scene?","once, before the team votes."],["What does the Worrier do?","names the cost or risk of an option and, if possible, how to make it smaller."],["Can your team lose the game?","no: every path ends with something Sardor learned."]]},drills:{ref:"Book: Lesson 3 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"In the first week abroad, many students experience ___: everything feels strange.",o:["culture shock","comfort zone","open mind"],a:0},{q:"After a month, Sardor started to ___ the spicy food.",o:["get used to","stand out","break the ice"],a:0},{q:"A funny question about food can help to ___ with new classmates.",o:["fit in","break the ice","make an effort"],a:1},{q:"He missed his family and felt very ___ in the evenings.",o:["homesick","comfortable","open-minded"],a:0},{q:"Mei’s “maybe” caused a ___: Sardor thought it meant yes.",o:["misunderstanding","culture shock","comfort zone"],a:0},{q:"It takes time to ___ a new way of studying.",o:["adapt to","stand out","find"],a:0},{q:"With his bright Uzbek hat, Sardor really ___ at the Culture Fair.",o:["stood out","fitted in","got used"],a:0},{q:"Speaking in front of the class took him ___.",o:["out of his comfort zone","into his comfort zone","out of his open mind"],a:0},{q:"When something surprises you, try to ___ and ask before you judge.",o:["keep an open mind","stand out","feel homesick"],a:0},{q:"By the end of the second month, he had ___: he knew the buses, the shops and the people.",o:["found his feet","broken the ice","stood out"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I’m getting used to the weather. → **the food**",a:"I’m getting used to the food."},{p:"I’m getting used to the food. → **the noise in the dormitory**",a:"I’m getting used to the noise in the dormitory."},{p:"I’m getting used to the noise in the dormitory. → **already**",a:"I’ve already got used to the noise in the dormitory. (Already → present perfect!)"},{p:"She felt homesick. → **in her first month**",a:"She felt homesick in her first month."},{p:"She felt homesick in her first month. → **a negative**",a:"She didn’t feel homesick in her first month."},{p:"She didn’t feel homesick in her first month. → **a question: Did …?**",a:"Did she feel homesick in her first month?"},{p:"He made an effort to fit in. → **They**",a:"They made an effort to fit in."},{p:"They made an effort to fit in. → **a big effort**",a:"They made a big effort to fit in."},{p:"They made a big effort to fit in. → **a question: Why …?**",a:"Why did they make such a big effort to fit in?"},{p:"Try to keep an open mind. → **Don’t forget**",a:"Don’t forget to keep an open mind."},{p:"Don’t forget to keep an open mind. → **It’s important**",a:"It’s important to keep an open mind."},{p:"It’s important to keep an open mind. → **when you live abroad**",a:"It’s important to keep an open mind when you live abroad."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"You should join a club.",a:"If I were you, I’d join a club. / It might be a good idea to join a club."},{p:"Don’t call home every hour.",a:"Try not to call home every hour. / It’s probably best not to call home every hour."},{p:"I was very surprised by the weather.",a:"What surprised me most was the weather."},{p:"It was difficult at first, but now it’s OK.",a:"It took me a while to get used to it, but now I’m fine."},{p:"Option A is good, but it’s risky.",a:"The trade-off here is that option A is exciting, but risky."},{p:"Later, this will help him.",a:"In the long run, this will help him."},{p:"So we choose option B.",a:"Weighing it all up, we’d go for option B."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I can’t get used to wake up so early.",o:["I can’t get used to waking up so early.","I can’t get used to woke up so early.","I can’t get use to wake up so early."],a:0,why:"get used to + -ing"},{q:"✗ He adapted the new culture quickly.",o:["He adapted for the new culture quickly.","He adapted to the new culture quickly.","He was adapted the new culture quickly."],a:1,why:"adapt to something"},{q:"✗ She feels herself homesick.",o:["She feels homesick.","She is feeling herself homesick.","She feels her homesick."],a:0,why:"feel + adjective, without herself"},{q:"✗ Can you give me an advice?",o:["Can you give me some advices?","Can you give me advices?","Can you give me some advice?"],a:2,why:"Advice is uncountable: some advice / a piece of advice."},{q:"✗ I’m used to live alone.",o:["I’m used to living alone.","I used to living alone.","I’m use to live alone."],a:0,why:"be used to + -ing"},{q:"✗ He explained me the rules.",o:["He explained to me about the rules.","He explained the rules to me.","He explained for me the rules."],a:1,why:"explain something to somebody"},{q:"✗ It was very interesting experience.",o:["It was a very interesting experience.","It was very interesting experiences.","It was the very interesting experience."],a:0,why:"an experience (an event) is countable: use a."},{q:"✗ I want that you help me.",o:["I want you help me.","I want you to help me.","I want that you helping me."],a:1,why:"want somebody to do something"},{q:"✗ He made a big effort for learn Malay.",o:["He made a big effort to learn Malay.","He made a big effort for learning Malay.","He did a big effort to learn Malay."],a:0,why:"make an effort to do something"}]},{title:"Stress: word families",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"excite → noun",o:["exCITEment","EXcitement","exciteMENT"],a:0,why:"-ment does not move the stress."},{q:"comfort → adjective",o:["comFORTable","COMfortable","comfortABle"],a:1,why:"-able does not move the stress: COMfort → COMfortable."},{q:"aware → noun",o:["Awareness","aWAREness","awareNESS"],a:1,why:"-ness does not move the stress."},{q:"adapt → noun",o:["aDAPtation","adapTAtion","Adaptation"],a:1,why:"-tion moves the stress: aDAPT → adapTAtion."},{q:"culture → adjective",o:["CULtural","culTUral","cultuRAL"],a:0},{q:"understand → noun with mis-",o:["MISunderstanding","misUNderstanding","misunderSTANDing"],a:2,why:"The stress stays on STAND, as in underSTAND."}]}],Gf={cardsStep:"Perspective cards",cardsTitle:"Perspective cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. In every scene, speak once from your perspective, then decide together.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Before you go",lv:"b2",bloom:"Apply",by:"aziza",seconds:60,q:"Sardor leaves Navoi in two weeks. What should he pack, prepare and learn before he goes? Agree on your top three.",help:{b2:["He should definitely …","It’s a good idea to …, because …","Don’t forget to …"],c1:["It would be wise to …","One thing people often forget is …","If I were him, I’d make sure …"]},model:"Let’s break it down step by step. First, he should definitely learn a few words in Malay, like *terima kasih* for *thank you*: people usually smile when you make an effort. Second, it’s a good idea to pack light clothes and an umbrella, because the weather is hot and it often rains. And one thing people often forget is a small gift from home. If I were him, I’d take dried apricots or a photo book of Navoi to share."},{name:"Round 2 · The journey",lv:"b2p",bloom:"Analyse / Evaluate",by:"amara",seconds:0,tool:"path",q:"Read each scene aloud. Each perspective speaks once. Then choose together, click your option and explain why.",help:{b2:["Look on the bright side: …","My worry is that …","Step one would be to …, and then …"],c1:["From their point of view, …","Maybe the reason is that …, so …","Weighing it all up, we’d choose …"]},model:"I’m the Optimist, so look on the bright side: if Sardor goes to the welcome lunch, he’ll meet students who feel exactly like him. Leo, our Worrier, says he might feel shy, and that’s true. But Aziza’s plan helps: step one would be to talk to just one person, and then he can leave if he wants. Weighing it all up, we’d choose option B, because a small, brave step now can make the whole semester easier."},{name:"Round 3 · Look back",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:90,q:"Next year, another student from Navoi will spend a semester abroad. As a team, give three pieces of advice about adapting to a new culture. Use what happened to Sardor on your path.",help:{b2:["My main piece of advice is …","Try not to …","It’s completely normal to …"],c1:["Looking back, the key is …","Whatever happens, …","Don’t be afraid to …"]},model:"Hold on, let’s base our advice on evidence: on our path, Sardor’s best moments came after he asked questions. So my main piece of advice is to keep an open mind and ask before you judge. Second, it’s completely normal to feel homesick in the first weeks; it doesn’t mean you made the wrong choice. Finally, don’t be afraid to step out of your comfort zone, but one small step at a time: one question, one new dish, one new friend."}],_f=[{e:"☀️",n:"The Optimist",r:"Sees the chance in every problem.",lines:[["Your job","Find the benefit in each option: what could Sardor gain?"],["Useful phrase","Look on the bright side: …"]],x:"Be positive, but stay realistic: you may name one small risk too."},{e:"🌧️",n:"The Worrier",r:"Asks what could go wrong.",lines:[["Your job","Name the cost or the risk of each option."],["Useful phrase","My worry is that …"]],x:"Don’t just say no: suggest how to make the risk smaller."},{e:"🗺️",n:"The Planner",r:"Thinks about the next step.",lines:[["Your job","Say what Sardor should do first, and what comes after."],["Useful phrase","Step one would be to …, and then …"]],x:"Think about time: tonight, this week, this semester."},{e:"🤝",n:"The Local Friend",r:"Sees it from the hosts’ side.",lines:[["Your job","Imagine how the people in the scene might feel about each option."],["Useful phrase","From their point of view, …"]],x:"Talk about the people in the scene, not about a whole nation."},{e:"🔍",n:"The Culture Detective",r:"Looks for the reason behind a reaction.",lines:[["Your job","Explain what might be behind a surprising reaction, without judging."],["Useful phrase","Maybe the reason is that …, so …"]],x:"Ask yourself: is this culture, personality, or just a busy day?"}],$f=[],ep={start:"s1",help:{b2:["If Sardor chooses …, he might …","The good thing about … is that …, but …","I’d go for option … because …"],c1:["The trade-off here is that …","In the long run, this could …","Weighing it all up, …"]},scenes:{s1:{title:"Arrival in Kuala Lumpur",text:"After a long journey from Navoi, Sardor steps out of the airport into warm, humid air. His university buddy, Nur, meets him and takes him to the student residence. Everything feels new: the signs in Malay and English, the traffic, the busy streets. In the evening, his roommate, Hafiz, invites him to a night market with a few friends. Sardor is exhausted, his suitcase is still closed, and his mother is waiting for a video call.",q:"Should Sardor go out tonight or rest? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. The good thing about the night market is that Sardor can break the ice with Hafiz on his very first day, but he is exhausted. If Sardor chooses to stay in, he might feel calmer tomorrow, but he could miss a friendly invitation. Weighing it all up, I’d go for option A because first invitations matter, and he can still call his mother when he gets back.",seconds:60,options:[{label:"A",text:"Go to the night market with Hafiz, even though he is tired.",next:"s2a"},{label:"B",text:"Stay in: call his family, unpack and go to bed early.",next:"s2b"}]},s2a:{title:"The night market",text:"The market is loud, bright and full of delicious smells. Hafiz and his friends switch between Malay and English, and Sardor understands only half of the jokes. Hafiz orders him nasi lemak, rice cooked in coconut milk, with a spicy sauce. It is much spicier than anything Sardor eats at home, and his eyes start to water. Everyone laughs kindly. Then one of the friends asks, “So what do people eat in Uzbekistan?”",q:"How should Sardor react? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: when my cousin moved abroad, she laughed at her own mistakes, and people relaxed around her. The good thing about option A is that Sardor turns an awkward moment into a conversation about plov. If he chooses B, he protects his energy, but he might look unfriendly. In the long run, laughing together could help him fit in, so I’d go for option A.",seconds:60,options:[{label:"A",text:"Laugh too, ask Hafiz to teach him the names of the dishes, and tell everyone about plov.",next:"s3a"},{label:"B",text:"Smile, eat slowly, and go back to his room early to rest.",next:"s3b"}]},s2b:{title:"A quiet start",text:"Sardor sleeps for eleven hours. When he wakes up, it is almost noon, and he has missed the orientation tour. His phone shows a message from Nur: “We missed you! There’s a welcome lunch for international students on Friday.” He spends the afternoon unpacking and talks to his family for a long time. After the call, the room feels very quiet, and he starts to feel a little homesick.",q:"What should Sardor do next? Which option would you choose, and why?",by:"mateo",m:"Picture this: Sardor alone in a quiet room on a sunny afternoon. Not great! If he goes to the international office, he’ll get clear answers, but it won’t help him make friends. The good thing about the lunch is that everyone there is new, too, but he might feel shy. The trade-off with waiting is that every day it gets harder to start. I’d go for option B because new people are the best cure for a quiet room.",seconds:60,options:[{label:"A",text:"Go to the international office and ask what he missed.",next:"s3c"},{label:"B",text:"Go to the welcome lunch on Friday, even though he knows nobody there.",next:"s3a"},{label:"C",text:"Wait until he feels more settled before he meets new people.",next:"s3b"}]},s3a:{title:"The group project",text:"Three weeks later, Sardor’s lecturer puts him in a project group with Mateo, an exchange student from Brazil, and two local students, Mei and Arif. Mateo talks a lot and has ideas for everything. At the first meeting, Sardor suggests a plan. Mei says, “Hmm, interesting. Maybe we can think about it.” Sardor thinks that means yes. Two days later, he finds out the group has chosen a different plan without him.",q:"What should Sardor do about the misunderstanding? Which option would you choose, and why?",by:"leo",m:"Hold on, what’s the evidence that the group ignored him on purpose? There isn’t any. If Sardor chooses A, everyone gets clear rules, but Mei might feel criticised in front of the others. The good thing about B is that Mei can explain herself without pressure. Maybe “think about it” was her polite way of saying no. In the long run, this could build trust, so I’d go for option B.",seconds:60,options:[{label:"A",text:"Raise it at the next meeting and suggest clear rules for making decisions.",next:"s4b"},{label:"B",text:"Talk to Mei privately and ask what she really meant.",next:"s4a"}]},s3b:{title:"Missing home",text:"This month, heavy rain falls almost every afternoon, and Sardor stays in his room more and more. He watches Uzbek videos, calls home every evening and misses his mother’s plov. In class he is quiet, and he has not made any close friends yet. One evening, Hafiz knocks on the door: “Some of us cook together in the shared kitchen on Sundays. You’re welcome to join us.”",q:"How can Sardor deal with feeling homesick? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? Sardor calls home every day, and that’s lovely, but it might keep his mind in Navoi. The good thing about option A is that plov is something he knows well, so he can feel confident and share his culture, but cooking for many people is stressful. If he chooses B, he meets people with the same hobby. Weighing it all up, I’d go for option A first.",seconds:60,options:[{label:"A",text:"Offer to cook plov for everyone in the shared kitchen on Sunday.",next:"s4c"},{label:"B",text:"Join a university club, such as badminton or photography, to meet people.",next:"s4a"}]},s3c:{title:"Asking for help",text:"At the international office, a friendly officer explains what Sardor missed. Then she mentions something that worries him: in many courses, part of the grade is for class participation. Sardor is used to speaking in class only when the teacher asks him a question. Here, many students ask questions and even disagree politely with the lecturer. The officer suggests two things: a weekly language café for local and international students, or a talk with his lecturer.",q:"Which kind of help should Sardor choose? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: before my first debate, I practised with friends in a café, where mistakes didn’t matter. The good thing about the language café is that Sardor can practise speaking without grades, but it won’t explain the lecturer’s rules. If he chooses B, he gets clear answers, but emailing a lecturer might feel scary. I’d go for option A because confidence comes first.",seconds:60,options:[{label:"A",text:"Join the weekly language café to practise speaking in a relaxed place.",next:"s4c"},{label:"B",text:"Email his lecturer and ask how participation works in her class.",next:"s4b"}]},s4a:{title:"An invitation",text:"Nur invites Sardor to her family’s open house on Saturday: friends and neighbours drop in during the day to eat and chat. Sardor is pleased, but nervous. In Navoi, he knows exactly how a guest behaves: what to bring, where to sit, how to accept tea. Here, he isn’t sure about anything. He also has an essay due on Monday, and he hasn’t started it yet.",q:"How should Sardor handle the invitation? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. The good thing about asking Nur is that Sardor won’t worry all evening, but he might still feel like a tourist. If he chooses B, his gift starts a conversation, but he needs time to find the right one. The trade-off with staying home is clear: a better essay, but a missed chance. Weighing it all up, I’d go for option A because a simple question costs nothing.",seconds:60,options:[{label:"A",text:"Ask Nur what guests usually do, then go and watch carefully.",next:"e3"},{label:"B",text:"Go and bring a small gift from Uzbekistan, ready to tell its story.",next:"e4"},{label:"C",text:"Thank Nur warmly, stay home to finish the essay, and suggest coffee next week.",next:"e2"}]},s4b:{title:"The presentation",text:"It is presentation week. Sardor’s project group, with Mateo, Mei and Arif, has ten minutes in front of the class, and every member must answer at least one question at the end. Mateo wants to present most of the talk because he loves speaking. Sardor did a lot of the research, but he is nervous about speaking English in front of everyone. He is also not sure how to answer politely if the lecturer disagrees with him.",q:"What should Sardor do before the presentation? Which option would you choose, and why?",by:"leo",m:"Hold on, what does the lecturer actually want? Everyone must speak. So if Sardor chooses C, he avoids stress, but he might lose marks and a chance to grow. The good thing about A is that practice makes him calmer, but Mateo might feel his favourite job is being taken. B is clever: he prepares for the hardest part. Weighing it all up, I’d go for option A because sharing the talk is fair.",seconds:60,options:[{label:"A",text:"Ask Mateo to share the talk equally, and practise together twice.",next:"e1"},{label:"B",text:"Prepare possible questions with Mei and offer to answer them at the end.",next:"e3"},{label:"C",text:"Let Mateo do the talking, and make the slides instead.",next:"e2"}]},s4c:{title:"The Culture Fair",text:"The international office is organising a Culture Fair, and every exchange student can run a small stall. Sardor’s new friends want to help him. He wants to show Uzbekistan, but how? Plov for a crowd needs a big pot, a kitchen and a lot of time. Photos and words are easier, but will anyone stop? Then Mateo, an exchange student from Brazil, has another idea: “Let’s share a stall: Uzbekistan meets Brazil!”",q:"What kind of stall should Sardor choose? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? Sardor could play a video of a Navoi bazaar on a laptop at any stall. The good thing about plov is that food brings people over, but it’s a lot of work. If he chooses B, visitors learn something, but they might walk past. The trade-off with sharing a stall is less space, but more visitors. I’d go for option C because two cultures side by side start conversations.",seconds:60,options:[{label:"A",text:"Cook plov with his friends and serve it with green tea.",next:"e4"},{label:"B",text:"Show photos of Navoi and Samarkand and teach visitors ten Uzbek words.",next:"e4"},{label:"C",text:"Share a stall with Mateo and compare traditions from both countries.",next:"e1"}]},e1:{end:!0,title:"Ending: Bridges, not walls",text:"By the end of the semester, Sardor has friends from several countries. He has learned that people don’t need to be the same to work well together; they need clear, kind communication and a little patience. Some things still feel strange to him, and that’s fine. On his last evening, his friends teach him a song, and he teaches them how to say “See you soon!” in Uzbek: *Koʻrishguncha!*",q:"What did Sardor learn on your path? Which of your team’s choices helped him most, and why?",by:"aziza",m:"Let’s break it down step by step. Sardor learned that adapting is teamwork: he made an effort, and other people met him halfway. On our path, the choice that helped most was working side by side with others, because it turned classmates into friends. In the long run, that lesson will help him at home in Navoi too, in any group with different personalities."},e2:{end:!0,title:"Ending: Slow and steady",text:"Sardor’s semester is quieter than he expected. He studies hard, and his grades are good. Little by little, he finds his feet: he knows the bus routes, his favourite food stall and a few friendly faces in class. He learns that adapting is not a race, and that it is fine to choose what you are ready for. Looking back, though, he wishes he had said yes a little more often.",q:"What did Sardor learn on your path? Would you change one of your team’s choices now? Why or why not?",by:"mateo",m:"Picture this: Sardor on the plane home, happy with his grades, but thinking about the chances he didn’t take. He learned that protecting your energy is important, and that’s a real skill. But if we played again, I’d change one choice and say yes to one more invitation. The trade-off was safety now against stories later, and in the long run, stories matter more."},e3:{end:!0,title:"Ending: The culture detective",text:"Sardor learns to stop guessing and start asking. When something surprises him, he asks, “What does this mean here?” instead of deciding that it is rude or strange. He discovers that many misunderstandings disappear after one honest question. By the end of the semester, other exchange students come to him for advice, and he keeps a notebook of “little rules” to give to the next student from Navoi.",q:"What did Sardor learn on your path? Which question would you add to his notebook of “little rules”?",by:"amara",m:"Let me give you a real example from our path: every time Sardor asked a question instead of guessing, things got easier. He learned that a question is not a weakness; it shows respect. I’d add this to his notebook: “When someone says *maybe*, ask what would make it a yes.” In the long run, that question could save him from many misunderstandings."},e4:{end:!0,title:"Ending: A piece of Navoi abroad",text:"Sardor discovers that sharing his own culture helps him feel at home. People remember his stories about Navoi, and they start asking him questions about Uzbekistan. He learns that fitting in does not mean forgetting who you are. At the same time, he keeps an open mind and tries things he would never try at home. When he leaves, his friends say, “Next time, we’ll visit you!”",q:"What did Sardor learn on your path? How can someone share their culture without showing off?",by:"leo",m:"Hold on, there’s a balance here. Sardor learned that his culture is a bridge, not a wall, but only because he also listened. If he had talked only about Navoi, people might have lost interest. The good thing about his choices is that he shared and asked in equal measure. Weighing it all up, the lesson is this: bring your culture with you, but leave space for theirs."}}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"What is the hardest part of moving to a new culture?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** the hardest part of moving to a new culture is not the big things, but the small, everyday ones."],["Point","**The main reason is that** you suddenly have to think about things you usually do automatically, like shopping, greeting people or asking for help."],["Example","**For example,** a friend of mine who studied abroad said her hardest moment was in a supermarket, where she couldn’t find any of the ingredients for plov."],["Close","**So, all things considered,** culture shock is really a thousand small surprises, and you **get used to** them one by one."]],keys:["in my view","everyday things","for example","get used to"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Is culture shock always a bad thing?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say no, **although** it can feel terrible at the time."],["","**First of all,** it shows you that your own way of doing things is only one way among many."],["","**For instance,** an exchange student in Navoi might be surprised when a neighbour invites them in for tea after only one short conversation."],["","**However,** if nobody helps you, the shock can slowly turn into loneliness."],["","**That’s why** support from buddies and teachers matters so much in the first weeks."],["","**In short,** culture shock is uncomfortable, but it’s also one of the fastest ways to learn."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"How can universities help international students to adapt?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think universities can do a lot, but the most useful help is often the simplest."],["","To begin with, a buddy programme gives every new student a local friend from the very first day."],["","On top of that, clear information in plain English saves students from many small misunderstandings."],["","Let me give you a real example: at my university, buddies meet new students on arrival and show them how to get a local SIM card."],["","That said, students also need to make an effort themselves and step out of their comfort zone."],["","So, in a nutshell, good support opens the door, but the student still has to walk through it."]],extra:"My favourite way to relax after exams is watching old films with my sister.",keys:["buddy programme","plain English","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Should you change your habits when you live in another country?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think you should change some of your habits, but not your values."],["The main reason is that","small changes show respect and make everyday life much easier."],["For instance,","if the people around you take off their shoes at the door, it costs you nothing to do the same."],["Having said that,","you don’t have to pretend to be someone else in order to fit in."],["That’s why","the best approach is to keep an open mind and keep your own identity at the same time."],["Ultimately,","adapting is about adding new habits, not deleting old ones."]],distractors:["In contrast,","Similarly,"],keys:["habits, not values","show respect","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"What is the best way to break the ice in a new culture?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["it depends on the situation","ask simple questions","share something from home","for instance","laugh at your own mistakes"],model:"I’d say it depends on the situation, but in most cases the best way to break the ice is to ask simple questions. People usually enjoy explaining their food, their city or their language. It also helps to share something from home. For instance, when I joined an online study group, I showed everyone how we make teh tarik in Malaysia, and suddenly everyone had a story about their favourite drink. Finally, laugh at your own mistakes: it shows you’re relaxed, and it helps other people relax too."}],np={title:"Exam Part 2 practice: welcoming a new international student",situation:"A new exchange student from abroad is joining your university in Navoi next week. You can organise **one** thing: a city tour on her first weekend, a conversation partner who meets her every week, or a welcome dinner with Uzbek dishes. Aziza and Leo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"leo",lines:[["A","So, a new exchange student arrives next week, and we need to choose one way to welcome her. Shall we start with the city tour?"],["B","Sure. A tour is a great way to break the ice, but won’t she be too tired on her first weekend?"],["A","Good point. Sorry, do you mean that we should wait a week or two?"],["B","Exactly. At first everything is new, so she might just want to rest and find her feet."],["A","I see. What about a conversation partner? Someone she can meet every week and ask anything."],["B","I like that. It’s less exciting than a dinner, but it helps on the difficult days too, doesn’t it?"],["A","True. A dinner is lovely, but it happens only once, and she might feel shy with so many new faces."],["B","So, shall we go for the conversation partner, and plan the city tour for later in the month?"],["A","Agreed. That way she has a friend from day one and something to look forward to."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, doesn’t it?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: an exchange student from abroad is joining your group for a semester. Choose **one** way to help them settle in: a “survival phrasebook” of Uzbek words, a weekly cooking evening, or a group chat with useful tips about Navoi. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["If I were you, I’d …","At first, it can be hard to …","What surprises many people is …","It might be a good idea to …","Try not to …","It takes a while to get used to …","The best thing you can do is …","It can be a real shock when …","Why don’t you …?"],B:["It can be a real shock when …","The best thing you can do is …","You should definitely …","It takes a while to get used to …","If I were you, I’d …","It’s completely normal to feel …","Why don’t you …?","What surprises many people is …","It might be a good idea to …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["If I were you, I’d …","You should definitely …","It might be a good idea to …","Why don’t you …?","Try not to …","The best thing you can do is …","At first, it can be hard to …","It can be a real shock when …","What surprises many people is …","It takes a while to get used to …","It’s completely normal to feel …","It’s probably best not to …"],questions:["What advice would you give to an international student who has just arrived in Navoi?","What might surprise a visitor on their first day in Uzbekistan?","How can a new student break the ice in a group?","What should someone pack for a semester abroad, and why?","Why do people often feel homesick in a new place, and what can help?","Which is harder to get used to: new food, new weather or new rules? Why?"]},sp=[{type:"stress",title:"Stress Spot: -ment, -ness, -ful, -able",intro:"Tap the stressed syllable. Rule: -ment, -ness, -ful and -able do not move the stress. Find the base word, and the stress stays there. Then listen and say the word.",follow:"Now use two of these words in one sentence about Sardor’s first week.",items:[{w:"excitement",syl:["ex","cite","ment"],s:1},{w:"embarrassment",syl:["em","bar","rass","ment"],s:1},{w:"homesickness",syl:["home","sick","ness"],s:0},{w:"loneliness",syl:["lone","li","ness"],s:0},{w:"awareness",syl:["a","ware","ness"],s:1},{w:"respectful",syl:["re","spect","ful"],s:1},{w:"disappointment",syl:["dis","ap","point","ment"],s:2},{w:"comfortable",syl:["com","fort","a","ble"],s:0}]},{type:"pairs",title:"Sound Pairs: /ʊ/ or /uː/?",intro:"Press Play and choose the word you hear. /uː/ is long: round your lips tightly and push them forward (pool). /ʊ/ is short, with lips only a little rounded (pull). Many learners make both sounds the same, so listen carefully. Partner version: one student says a word, the partner points to it.",pairs:[["full","fool"],["pull","pool"],["look","Luke"],["hood","who’d"],["soot","suit"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: fit in, find your feet or break the ice.","Describe how Sardor feels at this moment in two sentences."],ip={title:"Step Up Speaking Club Ideas Evening: A Thousand Small Surprises",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s online Ideas Evening, Leo gives a short talk about his exchange semester in Tashkent.",tip:["Listen for the signposts","In a talk, speakers often tell you what comes next: First, … · Later, … · So, here’s my message. The questions follow the talk in order, so the signposts help you find each answer."],A:"leo",B:"aziza",lines:[["A","Good evening, everyone. Last spring I spent a semester as an exchange student in Tashkent, and tonight I want to talk about **culture shock**. [[0]] it isn’t one big shock at all. It’s a thousand small surprises."],["A","In my first week, everything was exciting. In my third week, I felt **homesick** for the first time. [[1]] the small things were suddenly hard: how to greet people, how to say no to a third cup of tea, how to ask a lecturer a question. I was tired of not knowing the rules."],["A","[[2]] dinner at a friend’s home. His mother kept filling my plate, and I kept eating, because I thought it was rude to refuse. That was my biggest **misunderstanding**! Later my friend explained that in his family it’s fine to leave a little food on your plate. We both laughed, and the story helped to **break the ice** with his whole family."],["A","So how did I **find my feet**? First, I tried to **make an effort** every day: ten new words in Uzbek, one new street, one new conversation. Slowly I started to **get used to** the rhythm of the city. I also learnt to **keep an open mind**: when something felt strange, I asked why before I judged it."],["A","Did I **fit in**? Not completely. With my terrible Uzbek and my questions about everything, I always **stood out**. But you don’t have to be invisible to **adapt to** a new place. [[3]] join something: a football team, a choir, a cooking class. Shared activities do half the work for you. [[4]]"],["A","So, here’s my message. Culture shock is not a sign that you’ve failed. It’s a sign that you’ve left your **comfort zone**, and that’s exactly where you learn the most. Thank you."]],gaps:[[1,"Personally, I’d say"],[2,"I think that’s because"],[3,"A typical example was"],[4,"If I were you, I’d"],[5,"Does that make sense?"]],questions:[{q:"When did Leo first feel homesick in Tashkent?",o:["in his first week","in his third week","at the end of the semester"],a:1,why:"“In my first week, everything was exciting. In my third week, I felt homesick for the first time.”"},{q:"Why does Leo tell the story about dinner at his friend’s home?",o:["to show how a misunderstanding can bring people closer","to complain about the food in Tashkent","to explain why he stopped visiting friends"],a:0,why:"“We both laughed, and the story helped to break the ice with his whole family.”"},{q:"How does Leo feel about standing out?",o:["He is embarrassed and wants to hide.","He accepts it: you can adapt without being invisible.","He thinks it helped him get better marks."],a:1,why:"“You don’t have to be invisible to adapt to a new place.”"},{q:"Which sentence is closest to Leo’s main message?",o:["Culture shock means you chose the wrong country.","Feeling uncomfortable in a new culture is normal, and it helps you learn.","Exchange students should avoid new activities at first."],a:1,why:"“Culture shock is not a sign that you’ve failed. … that’s exactly where you learn the most.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example, a piece of advice? Which one does Leo use to check that the audience is following?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[3]],["Advice",[4]],["Checking with the audience",[5]]]},use:{q:"What advice would you give to an international student in their first month in a new country?",by:"nur",model:"Personally, I’d say the first month is the hardest. I think that’s because everything is new at once: the food, the language, the way people study. If I were you, I’d find a local buddy in the first week. A typical example was a Brazilian friend of mine in Kuala Lumpur: his buddy took him to a night market on his third day, and after that he found his feet much faster. So, all in all, you don’t have to do it alone.",ticks:["an opinion","a reason","a piece of advice","an example"],seconds:60}},lp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Yf,DIALOGUE:np,DRILLS:Uf,LESSON:Kf,LEVELS:tp,LISTEN:ip,MAIN:Gf,PATH:ep,PRON:sp,ROUNDS:Jf,TWISTS:$f,UNIT:Zf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},up={openverse:"1dc13122-f6e8-4a69-bdbd-78b72590cf36",title:"Airport Terminal",creator:"Matt Moloney",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/4
