Boa5th5SmHLaXSQrnJq4VKJebIx8vAlUNjs8Hi/ouVQYYafuTlZCuDot4kLCWQbLqCKVmr91KMjVTNANKrlOrGDQKV9Ksmf8+i7CfBzNf1syAtk2iEj4wlh8pGf+54Sv1EVusuvPzwTcE5OSY2F7CmGPl077SHCaFA/UaQ9AAZx5+myzmoJ8YbTa4Rj6undyX3KdSjNLvqdcAuujl5ukyi+v/EfVfEG+qwMe8izDHxo9QepG463HRoA0t5PaHwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Vp={code:"S4_U01",semester:4,unit:31,title:"Gender Discrimination and Equal Opportunities",subtitle:"What Does Real Equality Look Like?",module:7,stage:"Stage 3 · ARGUE",level:"B2+ (with C1 tasks)",sioLevel:3,hero:{tags:[["b2","B2+ (with C1 tasks)"],["bl","Bloom: Analyse → Evaluate"]],title:"The Fair Pay Court: The Arvenn Case",paras:["**Arvenn Engineering** is a fictional firm in the fictional city of **Lumera**. It designs bridges, water systems and solar farms. Last spring, two site engineers with the same job, a woman and a man, prepared a project budget together and saw each other’s salaries for the first time: she was paid less. The firm says the difference began with what each of them asked for when they were hired, and it has now corrected it.","The case has started an argument across the city. Should every large company have to publish a yearly **equal pay report**, showing what women and men earn at each level and who is promoted? Today the student **Fair Pay Court** decides. The motion: **This court would require every large company in Lumera to publish an equal pay report each year.**"],rule:"Rule of respect: we argue about rules and evidence, never about people. Neither side speaks “for men” or “for women”: both want fair treatment. Nobody is asked about their own family or their own experiences, and stereotypes are quoted only to be questioned."}},Qp=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A short talk from the Club (exam Part 2): listen for what everybody agrees on, why unfairness is hard to see, why Nur mentions Mateo’s father and her main message, notice how she contrasts the rule with real life, then use her phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Amara, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about people in general, not about their own families.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about equality and work, and /ɪə/ or /eə/ (fear or fair?). (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 3: put six parts of an answer about opening every subject to everyone in order and find the sentence that does not belong; then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 3; fast pairs try Level 4 or 5.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student argues for a minute; two classmates listen for phrases for discussing fairness. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group reports the strongest argument they heard (use the wheel)."]},{id:"game",icon:"⚖️",name:"The Fair Pay Court",min:18,lv:"c1",group:"3 courts of 5",kind:"five",roles:["Proposition Counsel","Proposition Witness (Ravi)","Opposition Counsel","Opposition Witness (Helena)","Judge"],desc:"Court & Debate with witnesses: a site engineer and an HR director give evidence, both sides answer each other’s claims, and the Judge decides whether every large company should publish an equal pay report. (Book: section 6 · G8)",howto:["15 students = 3 courts of five, all at the same time. Each court plays on its own phone or laptop (the game works offline). Every student speaks in at least two rounds.","Each student turns over one role card: a Counsel and a Witness for each side, and one Judge. The witnesses speak in role as Ravi, a site engineer, or Helena, an HR director; the Judge keeps time and scores.","Timing: roles 1 min · Prepare 3 min · Openings 3 min · Witnesses 4 min · Claims 2 min · Closing and verdict 5 min.","Only one projector? Run one court at the front with three judges from the class, who agree on each score together. Everybody else notes the best question and the best answer of each side. Six in a court? Add a second Judge."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping students try subjects where one gender is rare, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Kp={listen:{ref:"Book: Lesson 31, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: what everybody agrees on, why unfairness is hard to see, why Nur talks about Mateo’s father, and her main message.","Press **Play the podcast**. Listen for the rule and for real life: _In principle, …_, _but in practice …_ The answer is often after _but_. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Nur said; tap a line to hear it again.","Sort the five phrases: rule and real life, reason, example, conceding a point and opinion.","**Your turn:** listen to Amara, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is A. Nur says companies hide their rules.","gives an answer"],["B","Are you sure? I don’t think she said anything about hiding.","challenges politely"],["A","“The reason is that it is made of many small things …”","checks the text again"],["B","So it’s hard to see because it’s lots of small decisions. It’s B.","paraphrases"]],checks:[["How can you follow a talk that compares a rule with real life?","listen for “in principle … but in practice”: the first part is the rule or what people say; the second part is what really happens. Questions often test the second part."],["Which phrase does Nur use to admit that the other side has a point?","To be fair, …"]]},pron:{ref:"Book: Lesson 31, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-ity** and **-tion**, the syllable is strong (*eQUALity*, *discrimiNAtion*). Words ending in **-eer** are stressed on the end (*engiNEER*, *caREER*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɪə/ or /eə/?","Say **both** words. /ɪə/ (*here*, *fear*) starts high, near /ɪ/, and glides to a short, weak /ə/. /eə/ (*hair*, *fair*) starts lower and more open, near /e/.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *opportunity*. Which syllable is strong?",""],["A","*OP*? It’s the first one.","a first guess"],["T","Not quite. Remember the ending *-ity*. Listen again: op-por-*TU*-ni-ty.","the teacher gives a clue"],["B","So it’s the same with *equality*: e-*QUAL*-i-ty.","uses the rule"],["T","Exactly. And *engineer*?",""],["A","It ends in *-eer*, so the end is strong: en-gi-*NEER*.","uses the second rule"],["T","Great. Now, /ɪə/ or /eə/? Listen: *fair*. First or second: *fear* or *fair*?",""],["B","Second: *fair*. My mouth starts more open, and I don’t say a strong *r* at the end.","checks the shape of the mouth"]],checks:[["Where is the stress in *discrimination*?","on NA: dis-cri-mi-NA-tion, just before *-tion*."],["Where is the stress in *career*?","on REER: ca-REER. Words ending in *-eer* are stressed on the end."],["How do you say the *r* in *fair* or *here* in British English?","you don’t: it is silent at the end, unless the next word starts with a vowel (*fair_and square*)."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 3**: six parts, **no labels**, and **one extra sentence that does not belong**.","Find the **first part**: it answers the question directly (*Personally, I think …*).","Follow the logic: a reason → how to change it → an example → the other side (*Even so*) → the close (*in a nutshell*).","Send the extra sentence to the bin with **🗑**: it may be true, but it does not answer the question.","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds."],exTitle:"How Nur’s answer changed in 4/3/2",lines:[["nur","Um, I think yes … because, um, some students don’t choose engineering … they don’t see, um, people like them … So mentors are good … But, um, they must choose themselves.","Attempt 1 · 90 s · many pauses"],["nur","Personally, I think they should, as long as they don’t push anyone. Many students never choose a subject because they rarely see someone like them doing it. Mentors and role models can change that. At my university, a mentoring scheme made the first year much easier. Even so, the final choice must stay with the student.","Attempt 2 · 60 s · linking words"],["nur","Personally, I think they should, as long as they open doors rather than push people through them. Talented students often rule out a subject simply because they have never seen someone like them doing it. At my university in Kuala Lumpur, a mentoring scheme with women engineers made the first year feel far less lonely. Even so, the choice has to stay with the student. In a nutshell: make every subject feel possible, then let people choose.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 3?","one sentence does not belong: find it and send it to the bin."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Should companies publish what they pay their staff?",lines:[["leo","**In principle,** yes, **but in practice** it depends how it’s done. **The real question is** whether people can see if the same job gets the same pay. **There’s a difference between** publishing every salary **and** publishing pay for each level. **To be fair to both sides,** an average alone can mislead. **It all comes down to** trust: if staff can check, they believe the system.","speaker · 1 minute"],["amara","I heard five phrases: *In principle … but in practice*, *The real question is*, *There’s a difference between … and*, *To be fair to both sides* and *It all comes down to*. That’s a full row: **Bingo!**","listener reports"],["leo","Five points plus three for the Bingo: eight points!","count the points"],["amara","Next time, try *That’s a sweeping generalisation*. You could use it when someone says “all companies are unfair”.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, how can the university …?*).","Click the lines in order. Each line answers the line before. Nur and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a club poster",lines:[["A","So, which photo shall we put on the robotics club poster?","opens the topic"],["B","What about one of the whole team at the competition?","an idea"],["A","Nice, but it’s quite small. Could we add a close-up of two members building the robot?","reacts + a new idea"],["B","Good idea: one of each, so everyone can picture themselves in the club.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G8 · section 6",steps:["Make courts of five. Each student turns over one **role card**: a **Counsel** and a **Witness** for the Proposition (publish pay reports), the same for the Opposition (fix pay inside the firm), and the **Judge**.","**Round 1 · Prepare (3 min):** open the six **exhibits**. Each side picks its two strongest. Counsel and witness agree on two main arguments and on what the witness will say.","**Round 2 · Openings:** each counsel speaks for **60 seconds**. The Judge asks each side one short question.","**Round 3 · Witnesses:** each counsel asks their own witness two open questions (use the **question cards**). Then the other counsel asks **one** short cross-question. Witnesses answer **in role**: *“I …”*.","**Round 4 · Claims:** each witness opens a **claim card** from the *other* side and answers it in role (**45 seconds**): concede what is true, then show what it misses.","**Round 5 · Closing and verdict:** the counsel sum up. The Judge scores both sides 0–5 on five criteria, presses **Announce the verdict**, gives two reasons and proposes one rule for Lumera’s companies."],exTitle:"Sample game: Rounds 2–5 in Court A",lines:[["","Judge Leo · Proposition: Aziza (counsel) and Mateo (as Ravi, the site engineer) · Opposition: Nur (counsel) and Amara (as Helena, the HR director)",""],["aziza","**Our case rests on one simple fact:** Arvenn’s gap was found by chance. **A problem that only luck can reveal is a problem that will stay hidden** in most companies.","Proposition Counsel: opening statement"],["nur","**Nobody in this court defends unequal pay.** Our point is narrower: a single public average **can punish the firms that are changing fastest** and expose the salaries of people in small teams.","Opposition Counsel: opening statement"],["","… Round 3 · Witnesses …",""],["aziza","Ravi, how did you find out about the difference?","an open question to her own witness"],["mateo","We were preparing a budget for a bridge project, and the staff costs were on one page. We had the same title, the same projects and the same years in the firm. The only difference was the number next to our names.","Ravi answers in role"],["nur","One question, Ravi: did Arvenn correct your colleague’s salary without any public report?","a short cross-question"],["mateo","Yes, it did, within weeks. But only after we found it ourselves.","a short, honest answer"],["","… Round 4 · Claims …",""],["amara","(as Helena, reads a claim card) *“What isn’t measured isn’t fixed.”* **I agree that it has to be measured. The question is who sees the numbers and how they are explained.** A bare average told the public that my firm was unfair, when in fact we had simply hired a lot of young women engineers.","Helena answers a claim from the other side"],["","… Round 5 · Verdict …",""],["leo","**Having weighed both sides, the court finds for** the Proposition, by twenty points to eighteen. **The decisive moment was** Ravi’s answer that the gap was found by chance. **Even so,** Helena was right about averages. So the court proposes a rule: reports show pay for each level, not one company-wide figure, and every company may add a short explanation.","the Judge explains the verdict and proposes a rule"]],checks:[["What is the difference between an open question and a cross-question?","an open question lets your own witness tell their story (What …? How …? Why …?); a cross-question to the other witness is short and needs a short answer."],["Who answers the claim cards in Round 4?","the witnesses, in role: each opens a card marked with the other side’s name."],["What does the Judge add after the verdict?","two reasons for the decision and one rule for Lumera’s companies."]]},drills:{ref:"Book: Lesson 31 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Zp=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Two engineers who build the same bridge should get ___.",o:["equal pay for equal work","a work–life balance","a role model"],a:0},{q:"A fair university gives every student ___ to study the subject they love.",o:["equal opportunities","unconscious bias","a career ladder"],a:0},{q:"The difference between what women and men earn on average is called ___.",o:["the gender pay gap","fair treatment","a level playing field"],a:0},{q:"Our lecturer, who designs bridges, is ___ for many first-year students.",o:["a role model","a pay gap","a stereotype"],a:0},{q:"Interviewers can judge people unfairly without realising it: this is ___.",o:["unconscious bias","fair treatment","equal opportunities"],a:0},{q:"In many families today, both partners ___: they cook, clean and look after the children.",o:["share household responsibilities","climb the career ladder","challenge a stereotype"],a:0},{q:"She worked hard for years to ___ from junior engineer to site manager.",o:["climb the career ladder","share household responsibilities","level the field"],a:0},{q:"People should be ___, not because they are friends with the boss.",o:["promoted on merit","promoted on bias","given a playing field"],a:0},{q:"A woman pilot in a school visit can help to ___ about who can fly a plane.",o:["challenge a stereotype","climb a ladder","share a responsibility"],a:0},{q:"Flexible hours help both mothers and fathers to find a good ___.",o:["work–life balance","pay gap","career ladder"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"She is an engineer. → **he / a nurse**",a:"He is a nurse. (a/an before a job; he for a man, she for a woman)"},{p:"He is a nurse. → **my cousin … works in Samarkand**",a:"My cousin is a nurse. He works in Samarkand."},{p:"They paid her less than him. → **passive: She was …**",a:"She was paid less than him."},{p:"She was paid less than him. → **for the same job**",a:"She was paid less than him for the same job."},{p:"The firm treated them differently. → **should have …**",a:"The firm should have treated them equally."},{p:"Women are not promoted as often as men. → **It is not fair that …**",a:"It is not fair that women are not promoted as often as men."},{p:"The firm discriminated against her. → **a question: Did …?**",a:"Did the firm discriminate against her?"},{p:"Companies publish their pay data. → **If companies published …, …**",a:"If companies published their pay data, gaps would be easier to see."},{p:"If companies published their pay data, gaps would be easier to see. → **the past: had published**",a:"If companies had published their pay data, the gap would have been found earlier."},{p:"Her salary is the same as his. → **equal to**",a:"Her salary is equal to his."},{p:"Everybody should be treated fairly. → **regardless of gender**",a:"Everybody should be treated fairly, regardless of gender."},{p:"Real equality is about fair chances. It is not about making everyone the same. → **not …, but …**",a:"Real equality is not about making everyone the same, but about giving everyone fair chances."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Men and women should have the same chances.",a:"Everyone deserves a level playing field, whatever their gender."},{p:"This is not fair.",a:"This is a clear case of unequal treatment."},{p:"Some people think only men can be engineers.",a:"The idea that engineering is a man’s job is a stereotype worth challenging."},{p:"She should get the same money.",a:"Equal work should mean equal pay, with no exceptions."},{p:"Maybe they don’t mean to be unfair.",a:"Much of the problem may be unconscious bias rather than bad intentions."},{p:"Both sides have a point.",a:"There is something to be said for both positions."},{p:"We need to change things.",a:"What is needed is not a slogan but a set of fair rules."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ My sister is an engineer. He works on a bridge project.",o:["My sister is an engineer. She works on a bridge project.","My sister is an engineer. It works on a bridge project.","My sister is engineer. He works on a bridge project."],a:0,why:"Uzbek *u* means both *he* and *she*; English chooses: a woman = *she*, a man = *he*."},{q:"✗ She is engineer at Arvenn.",o:["She is the engineer at Arvenn.","She is an engineer at Arvenn.","She engineer at Arvenn."],a:1,why:"a job after *be* needs *a/an*: she is an engineer, he is a nurse."},{q:"✗ The company discriminated her.",o:["The company discriminated against her.","The company discriminated to her.","The company was discriminated her."],a:0,why:"discriminate **against** somebody"},{q:"✗ Her salary is equal with his.",o:["Her salary is equal to his.","Her salary is equal his.","Her salary is equally with his."],a:0,why:"equal **to** something"},{q:"✗ Everybody should be treated equal.",o:["Everybody should be treated equally.","Everybody should treated equal.","Everybody should be treat equally."],a:0,why:"an adverb describes the verb: treated **equally**, paid **fairly**"},{q:"✗ Ravi works at Arvenn since many years.",o:["Ravi is working at Arvenn since many years.","Ravi has worked at Arvenn for many years.","Ravi worked at Arvenn since many years."],a:1,why:"from the past until now: present perfect + **for** a period (for many years) or **since** a point (since 2020)"},{q:"✗ Women’s salaries are less than men.",o:["Women’s salaries are lower than men’s.","Women’s salaries are less than men.","Women salaries are lower than men."],a:0,why:"salaries are **high** or **low**; compare like with like: women’s salaries … men’s (salaries)"},{q:"✗ Both of parents should share the housework.",o:["Both parents should share the housework.","Both of parent should share the housework.","The both parents should share the housework."],a:0,why:"both + plural noun (both parents) or both of + the/my … (both of my parents)"}]},{title:"Stress: words about equality",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"being equal; the same rights for everyone",o:["eQUALity","Equality","equaliTY"],a:0,why:"-ity: stress the syllable just before the ending."},{q:"a chance to do something",o:["OPportunity","opporTUnity"],a:1,why:"-ity: stress the syllable just before the ending."},{q:"treating someone unfairly because of who they are",o:["disCRImination","discrimiNAtion"],a:1,why:"-tion: stress the syllable just before the ending."},{q:"a move to a higher job",o:["proMOtion","PROmotion"],a:0},{q:"a fixed, simple idea about a group of people",o:["STEreotype","stereOtype"],a:0},{q:"a person who designs machines, bridges or systems",o:["ENgineer","engiNEER"],a:1,why:"-eer is stressed: engiNEER, caREER, volunTEER."},{q:"the jobs you do during your working life",o:["CAreer","caREER"],a:1,why:"-eer is stressed."},{q:"a person you work with",o:["COLleague","colLEAGUE"],a:0}]}],Jp={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to your court and keep it for the whole game. Each side has a Counsel, who argues the case, and a Witness, who speaks in role as Ravi, a site engineer, or Helena, an HR director. The Judge chairs the court.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",evidenceWord:"Exhibit",evidenceTitle:"Exhibits: the Arvenn case file",evidenceHint:"Open all six exhibits. Each one is marked with the side it helps more. Pick your side’s two strongest, and decide what you will say if the other side uses theirs.",evidenceHelp:{b2:["This exhibit shows …","It supports our case, because …","They will probably use Exhibit … to say …"],c1:["What this exhibit really shows is …","Taken together, Exhibits … and … suggest …","This exhibit proves less than it seems to, because …"]},questionWord:"Question",questionTitle:"Question cards for the counsel",questionHint:"Counsel: open a card for your witness, read the question aloud and let the witness answer in role. Cards marked “cross-question” are for the OTHER side’s witness. You may also ask your own questions.",questionHelp:{b2:["Can you tell the court how …?","Why do you think …?","Is it true that …?"],c1:["Could you explain to the court how …?","In your experience as …, why does …?","Would you accept that …?"]},rebuttalWord:"Claim",rebuttalTitle:"Claim cards: what the other side says",rebuttalHint:"Witnesses: open one card marked with the OTHER side’s name and answer it in role in 45 seconds. Concede what is true, then show what the claim misses. Your counsel may add one sentence.",rebuttalHelp:{b2:["I accept part of that, but …","This claim ignores …","In my job, I have seen …"],c1:["I’d concede that …; what it overlooks is …","The flaw in this claim is …","That’s precisely why …"]},teamWord:"Court",teamIcon:"",teamKind:"five",teams:3},Gp={motionWord:"The motion before the court",motion:"This court would require every large company in Lumera to publish an equal pay report each year.",sides:[{name:"Proposition",short:"Publish pay reports",stance:"Every large company should publish a yearly report on what women and men earn at each level and who is promoted. Gaps that nobody can see never get fixed."},{name:"Opposition",short:"Fix pay inside",stance:"Equal pay matters, but a compulsory public report is a blunt tool: averages can mislead and small teams lose privacy. Companies should fix pay with clear pay bands, salary ranges in job adverts and fair promotion rules."}],judges:1,criteria:["Arguments","Evidence","Questions and answers","Rebuttal","Language"],turnsTitle:"Order of speakers",verdictTitle:"The Judge’s score sheet",verdictHint:"The Judge scores both sides 0–5 for each criterion, then presses **Announce the verdict**, gives two reasons and proposes **one rule** for Lumera’s companies. Score the arguments and answers, never the speakers as people.",winWord:"wins the case"},Yp=[{name:"Round 1 · Prepare",lv:"b2p",bloom:"Understand / Analyse",by:"aziza",seconds:180,tool:"evidence",q:"Open the exhibits. Counsel and witness pick your side’s **two strongest exhibits** and agree on **two main arguments**. Witnesses: plan what you will tell the court. The Judge prepares one question for each side.",help:{b2:["main argument","Exhibit … helps us","they will say … → we answer …"],c1:["our case rests on …","the exhibit that does most for us","be ready for the objection that …"]},model:"Our case rests on one idea: a gap that nobody can see is a gap that nobody fixes. Exhibit A is the one that does most for us: two engineers with the same title, the same projects and different salaries, and the difference was found only by chance. Exhibit B helps too, because Arvenn’s own review had noticed a problem and then filed it away. They will probably use the averages in Exhibit D, so Ravi should say clearly that we want pay shown for each level, not one company-wide number."},{name:"Round 2 · Opening statements",lv:"b2p",bloom:"Apply / Analyse",by:"nur",seconds:0,tool:"turns",turns:[{side:0,who:"Proposition Counsel",task:"Say what the motion means in your own words and give your side’s two main arguments.",seconds:60},{side:1,who:"Opposition Counsel",task:"Give your side’s two main arguments. You may answer one point from the Proposition.",seconds:60},{side:null,who:"Judge",task:"Ask each counsel one short question. Each answers in one or two sentences.",seconds:60}],q:"Opening statements: each counsel presents the case in **60 seconds**. Say where your side stands, then give two arguments.",help:{b2:["our side believes … for two reasons","firstly · secondly","we will show that …"],c1:["nobody here defends …; our point is narrower","at the heart of this case is …","we will show the court that …"]},model:"Nobody in this court defends unequal pay. Our point is narrower: a compulsory public report is the wrong tool. Firstly, averages mislead. Exhibit D shows a firm that hired many young women engineers: they are still at junior levels, so its average looks worse than that of a firm that hires almost no women at all. Secondly, in a small team a report by gender can reveal exactly what one or two people earn. We will show the court that fair pay bands and open salary ranges fix the cause, while a public average only describes the symptom."},{name:"Round 3 · Witnesses",lv:"b2p",bloom:"Apply / Analyse",by:"mateo",seconds:0,tool:["questions","turns"],turns:[{side:0,who:"Proposition Counsel → Ravi",task:"Ask your witness two open questions (a question card or your own). Ravi answers in role.",seconds:75},{side:1,who:"Opposition Counsel → Ravi",task:"Cross-question: ask Ravi one short, sharp question. He answers in one or two sentences.",seconds:30},{side:1,who:"Opposition Counsel → Helena",task:"Ask your witness two open questions (a question card or your own). Helena answers in role.",seconds:75},{side:0,who:"Proposition Counsel → Helena",task:"Cross-question: ask Helena one short, sharp question. She answers in one or two sentences.",seconds:30}],q:"Witnesses: each counsel asks their own witness **two open questions**; then the other counsel asks **one cross-question**. Witnesses answer **in role**, with “I …”.",help:{b2:["when I found out …","what surprised me most …","I’m not sure, but …"],c1:["what struck me at the time was …","to be fair to the other side, …","if I may add one thing, …"]},model:"What struck me at the time was how ordinary it was. We were preparing a budget for a bridge project, and the staff costs were on one page. Same title, same projects, same years in the firm, and a different number next to each name. My colleague was not angry at first; she was just surprised that nobody had noticed for so long. To be fair to Arvenn, they corrected it quickly. But they corrected it because two engineers happened to share a spreadsheet, not because anyone was checking."},{name:"Round 4 · Claims",lv:"c1",bloom:"Evaluate",by:"amara",seconds:0,tool:["rebuttals","turns"],turns:[{side:1,who:"Helena (Opposition Witness)",task:"Open one claim card marked “Publish pay reports” and answer it in role. Your counsel may add one sentence.",seconds:45},{side:0,who:"Ravi (Proposition Witness)",task:"Open one claim card marked “Fix pay inside” and answer it in role. Your counsel may add one sentence.",seconds:45}],q:"Claims: each witness opens a claim card from the **other side** and answers it in role in **45 seconds**. Concede what is true, then show what the claim misses.",help:{b2:["I accept part of that, but …","this claim ignores …","in my job, I have seen …"],c1:["I’d concede that …; what it overlooks is …","the flaw in this claim is …","that’s precisely why …"]},model:"I’d concede that what isn’t measured is rarely fixed. In my firm we measure pay at every level, every year. What this claim overlooks is the difference between measuring and publishing a single number. When our average was shown without any explanation, people concluded that we treat women unfairly, when in fact we had simply hired many young women who are still at the start of their careers. That’s precisely why I prefer internal checks by an independent reviewer: they find the real problems instead of the headlines."},{name:"Round 5 · Closing and verdict",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:0,tool:["turns","verdict"],turns:[{side:0,who:"Proposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:1,who:"Opposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:null,who:"Judge",task:"Score both sides, announce the verdict and give two reasons. Then propose one rule for Lumera’s companies.",seconds:60}],q:"Closing and verdict: the counsel sum up in **45 seconds**. Then the Judge scores, announces the verdict, explains it and proposes one rule for Lumera’s companies.",help:{b2:["to sum up, we have shown …","the court has decided …","from now on, companies should …"],c1:["at its heart, this case is about …","having weighed both sides, the court finds for …","the decisive moment was …"]},model:"Having weighed both sides, the court finds for the Opposition, by nineteen points to seventeen. The decisive moment was Helena’s answer about averages: a single public number can make a company that is opening its doors to women look worse than one that keeps them shut. That said, Ravi showed that a gap can survive for years when nobody outside the HR office looks. So the court proposes a rule: every large company has its pay checked each year by an independent reviewer, and publishes the pay range for each level, with a short explanation."}],_p=[{e:"⚖️",n:"The Judge",r:"Chairs the court and gives the verdict.",lines:[["Your job","Call each speaker and start the timer, ask each counsel one question, score both sides, explain the verdict and propose one rule for Lumera’s companies."],["Useful phrase","The court calls … · Having weighed both sides, the court finds for …"]],x:"Listen for the best reasons, not the loudest voice. A witness who concedes a weak point honestly can be very convincing."},{e:"📣",n:"Proposition Counsel",r:"Lead speaker · publish pay reports",lines:[["Your side","Every large company should publish a yearly report on what women and men earn at each level and who is promoted."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Our case rests on one simple fact: …"]],x:"Expect the argument that averages mislead. You can answer it: a good report shows pay for each level, and a company can add an explanation."},{e:"🛠️",n:"Proposition Witness: Ravi",r:"A site engineer at Arvenn Engineering · publish pay reports",lines:[["Who you are","Ravi Menon, a site engineer at Arvenn, the fictional firm in this case. You and a colleague with the same job discovered that she was paid less."],["What you can tell the court","You found the difference while preparing a project budget, where the staff costs were on one page. You had the same title, projects and years in the firm. With your colleague’s agreement, you both went to HR, and Arvenn corrected her salary within weeks. Afterwards, several other colleagues asked HR to check their pay too. Arvenn also moved its promotion interviews from early evening to working hours, which helped staff with family duties, mothers and fathers alike."],["Your job","Answer questions in role (Round 3) and answer one claim from the Opposition (Round 4)."]],x:"Speak as Ravi: “I …”. Do not share your colleague’s private details: talk about what happened at work. Be fair to Arvenn: it fixed the problem quickly once it was found."},{e:"📣",n:"Opposition Counsel",r:"Lead speaker · fix pay inside",lines:[["Your side","Equal pay matters, but a compulsory public report is a blunt tool. Companies should fix pay with clear pay bands, salary ranges in job adverts and fair promotion rules."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Nobody in this court defends unequal pay; our point is narrower: …"]],x:"A good cross-question is short and needs a short answer: “Did Arvenn correct the salary without any public report?”"},{e:"📋",n:"Opposition Witness: Helena",r:"HR director at Kalden Waterworks · fix pay inside",lines:[["Who you are","Helena Brandt, the HR director of Kalden Waterworks, another fictional engineering firm in Lumera. You are responsible for pay and promotion."],["What you can tell the court","In recent years Kalden has hired many young women engineers. They are still at junior levels, so the company-wide average for women is lower, although people at the same level earn the same. When a newspaper printed that average without an explanation, Kalden was called unfair. Some of your offices are small, with only one or two women, so pay shown by gender would reveal their salaries. Kalden already publishes a salary range in every job advert and has its pay checked every year by an independent reviewer."],["Your job","Answer questions in role (Round 3) and answer one claim from the Proposition (Round 4)."]],x:"You are not against equal pay: you are against one public number with no explanation. Concede what Arvenn got wrong, then explain what works better."}],$p=[],ef=[{t:"To Ravi: How did you and your colleague find out about the difference in pay?",q:"Proposition Counsel: ask this question. Ravi: answer in role in about 30 seconds.",by:"mateo",m:"Completely by chance. We were preparing a budget for a bridge project, and the staff costs were on one page. We have the same title, we work on the same projects and we joined the firm in the same year, yet the numbers next to our names were different. If we hadn’t shared that spreadsheet, I honestly think nobody would ever have noticed."},{t:"To Ravi: Why do you believe a public report would help?",q:"Proposition Counsel: ask this question. Ravi: answer in role in about 30 seconds.",by:"mateo",m:"Because once our story came out, several colleagues asked HR to check their pay too. People had questions; they just had no way to ask them. A yearly report would make every company ask itself those questions before someone finds the answer by accident. And it protects everyone: a man can be underpaid as well, and he would see it too."},{t:"Cross-question to Ravi: Did Arvenn correct your colleague’s salary without any public report?",q:"Opposition Counsel: ask this question. Ravi: answer honestly in one or two sentences.",by:"mateo",m:"Yes, it did, within weeks. But only after we found the problem ourselves."},{t:"To Helena: Why doesn’t an average tell the whole story?",q:"Opposition Counsel: ask this question. Helena: answer in role in about 30 seconds.",by:"amara",m:"Because an average mixes everybody together. In recent years we have hired many young women engineers, which we are proud of. They are at the start of their careers, so they earn junior salaries, like the young men who joined with them. The company-wide average for women therefore looks low, and a newspaper called us unfair. A firm that hired no young women at all would have looked better."},{t:"To Helena: What would you do instead of a compulsory public report?",q:"Opposition Counsel: ask this question. Helena: answer in role in about 30 seconds.",by:"amara",m:"Three things. First, clear pay bands, so everyone at one level knows the range they are in. Second, a salary range in every job advert, so new staff don’t depend on how well they negotiate. Third, a yearly check by an independent reviewer, who reports to the board and to the staff. That fixes the cause of a gap, not just its headline."},{t:"Cross-question to Helena: If your pay is fair at every level, what would you lose by publishing it with an explanation?",q:"Proposition Counsel: ask this question. Helena: answer honestly in one or two sentences.",by:"amara",m:"Time, and in our small offices, privacy. But I accept that a report with a clear explanation would be much less harmful than a bare average."}],tf=[{side:0,t:"Two contracts from Arvenn Engineering: the same job title, the same projects, the same year of joining, different salaries. The difference began on the day they were hired and was never checked again.",q:"What does this exhibit show about how pay gaps survive? Use it to support the Proposition.",by:"aziza",m:"This exhibit shows that a gap does not need a bad person to survive; it only needs silence. Nobody decided to pay the woman less every year. One difference at the start was simply carried forward, year after year, because nobody compared the numbers. A yearly report would force that comparison to happen."},{side:0,t:"An internal email from Arvenn’s HR office, written two years before the case: a pay review found “some differences that need a closer look”. No action followed, and the review was never shared with staff.",q:"How can the Proposition use this email to answer the claim that companies can fix pay on their own?",by:"mateo",m:"This email shows that Arvenn had already noticed a problem, and then nothing happened. Internal checks are only as strong as the will to act on them. When a review stays in a drawer, nobody outside it can ask why. A public report turns a private note into a question the company must answer."},{side:0,t:"Notes from a careers fair at Lumera Technical University: several final-year students, women and men, said they would prefer an employer that publishes its pay data, because “then we know what to ask for”.",q:"How can the Proposition use these notes to show that reports help young people and good employers?",by:"aziza",m:"These notes show that openness is not only a duty; it can be an advantage. Young engineers want to know that they will be paid fairly before they sign a contract. A company with fair pay has nothing to fear from a report: it can use it to attract the best graduates, women and men alike."},{side:1,t:"Kalden Waterworks’ pay table: in recent years the firm has hired many young women engineers. They are still at junior levels, so the company-wide average for women is lower, although people at the same level earn the same.",q:"What does this table say about publishing one average? Use it to support the Opposition.",by:"nur",m:"This table shows that an average can punish exactly the firms that are making progress. Kalden opened its doors to young women engineers, so for now many of its women are juniors. A single public number makes Kalden look unfair, while a firm that hires no young women at all looks perfect. That is the opposite of what the rule is meant to achieve."},{side:1,t:"A letter from a team leader in a small regional office: “Only two of our engineers are women. If our office has to publish pay by gender, everyone will know exactly what those two colleagues earn.”",q:"How can the Opposition use this letter to show a risk of the motion?",by:"amara",m:"This letter shows that a rule designed to protect women could expose them instead. In a small team, a figure for women is not an average at all: it is two people’s salaries in a newspaper. Equality should never cost people their privacy, so any rule would have to protect small groups."},{side:1,t:"Arvenn’s action plan after the case: pay bands for every level, a salary range in every job advert, a yearly check by an independent reviewer, and promotion interviews held during working hours.",q:"How can the Opposition use this plan to argue that companies can fix the causes without a compulsory report?",by:"nur",m:"This plan shows that the real fixes happen inside the company. Pay bands and salary ranges stop gaps from starting at the hiring stage, and moving interviews into working hours helps every parent with family duties. None of these steps needs a public average. A report describes a gap; these rules prevent it."}],nf=[{side:0,t:"“What isn’t measured isn’t fixed. Arvenn’s gap lasted for years because nobody outside HR could see it.”",q:"You are Helena (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"I’d concede that what isn’t measured is rarely fixed. But this claim mixes up measuring and publishing. We measure pay at every level, every year, with an independent reviewer. What the claim overlooks is that a published average can be measured perfectly and still tell the wrong story, as ours did. Measure everything, yes; publish only what is explained."},{side:0,t:"“A report protects everyone: men can be underpaid too, and they would see it as well.”",q:"You are Helena (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"That’s true, and it’s a fair point: unfair pay is not only a women’s problem. However, the flaw in this claim is that a report by gender only compares two large groups. One underpaid man in a big team disappears inside the average. What protects him is a clear pay band for his level and the right to ask for a check, not a figure in the newspaper."},{side:0,t:"“Young engineers deserve to know which firms pay fairly before they sign a contract.”",q:"You are Helena (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"I agree completely with the aim. That’s precisely why we print a salary range in every job advert: a graduate can see what the job pays before the interview. What this claim overlooks is that a company-wide average says nothing about the job you are applying for. A range for each job is more useful to a young engineer than any yearly report."},{side:1,t:"“Averages lie: a firm that hires many young women will look unfair, while a firm that hires none looks perfect.”",q:"You are Ravi (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"mateo",m:"I accept that a single average can mislead. But this claim attacks a bad report, not the idea of reporting. A good report shows pay for each level, and the company adds an explanation. Then Kalden’s story becomes a good one: many young women joining, paid the same as the men at their level. Without any report, we would never know which firm is which."},{side:1,t:"“In a small team, a report is just a list of private salaries.”",q:"You are Ravi (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"mateo",m:"I’d concede that privacy matters, and I wouldn’t want my colleague’s salary in a newspaper either. But the motion is about large companies, and a report can join small groups together so that nobody can be identified. The flaw in this claim is that it treats a problem in the details as a reason to drop the whole idea."},{side:1,t:"“Reports turn equality into public relations: firms will polish the numbers instead of fixing the causes.”",q:"You are Ravi (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"mateo",m:"There is some truth in that: any number can be polished. However, in my firm the problem was not polished numbers; it was no numbers at all. An internal review found differences and was quietly filed away. A public report would at least have made someone answer for it. Polishing is a risk; silence is a certainty."}],rf=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why does equal pay for equal work matter?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** equal pay for equal work matters because it is the simplest test of fairness at work."],["Point","**The main reason is that** a salary tells people how much their work is valued."],["Example","**For example,** if two engineers in Navoi build the same bridge, nobody can explain why one of them should earn less."],["Close","**So, all things considered,** equal pay is not a favour to anyone; it is basic respect."]],keys:["in my view","the main reason is that","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"mateo",q:"Should household responsibilities be shared equally?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say they should be shared fairly, **but** fairly doesn’t always mean exactly half each."],["","**On the one hand,** when both partners work, it makes sense for both to cook, clean and look after the children."],["","**In my parents’ home in Recife, for instance,** whoever gets home first starts the dinner."],["","**On the other hand,** every family is different, and each couple should agree on what works for them."],["","**What matters most, then, is** that nobody is expected to do a job just because they are a man or a woman."],["","**All in all,** sharing the work at home is about respect, not about counting minutes."]],keys:["but","on the one hand","on the other hand","all in all"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"nur",q:"Should universities encourage students to study subjects where their gender is rare?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think they should, as long as they open doors rather than push anyone through them."],["","Talented students often rule out a subject because they have never seen anyone like them doing it."],["","Mentors and visits from role models can change that far more than any slogan."],["","At my university in Kuala Lumpur, a mentoring scheme with women engineers made the first year far less lonely."],["","Even so, the final choice must stay with the student, not with a target on a chart."],["","In a nutshell, universities should make every subject feel possible for everyone, then let people choose."]],extra:"Our engineering building has just been painted bright blue.",keys:["open doors","role models","even so","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"leo",q:"Is a scholarship only for women in engineering fair?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Broadly speaking,","I can see why such scholarships exist, although I’d prefer support that is open to everyone."],["The key point is that","where one group is rare in a subject, a targeted scholarship tells them clearly that they are welcome."],["Take, for example,","my cousin’s university in Hamburg, which pairs every first-year student who is the only woman, or the only man, in a group with a mentor."],["Admittedly,","a scholarship for one group can feel unfair to a talented student from the other group who also needs the money."],["Even so,","it can be a reasonable temporary step, as long as it is reviewed regularly."],["Ultimately,","the aim should be a day when such scholarships are simply no longer needed."]],distractors:["Suddenly,","Meanwhile,"],keys:["broadly speaking","the key point is that","admittedly","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"amara",q:"What does real equality look like in a workplace?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["same job, same pay","promotion on merit","flexible hours for everyone","no jokes based on stereotypes","everyone feels heard"],model:"Real equality at work is less about slogans and more about everyday habits. First, the same job gets the same pay, and people can check that it does. Second, promotion depends on merit, so the interesting projects go to whoever is best for them, not to whoever is most like the boss. Third, flexible hours are offered to everyone, so that both mothers and fathers can look after their families without losing their careers. In a friend’s office in Lagos, the most noticeable change was a small one: jokes based on stereotypes simply stopped being funny. In the end, a workplace is equal when everyone feels that they are heard."}],sf={title:"Exam Part 2 practice: trying a new subject",situation:"Your university wants more students to try subjects where one gender is rare, for example women in engineering or men in nursing and primary teaching. There are three ideas: a mentoring scheme with graduates, open days with hands-on workshops, or a series of talks by role models. Nur and Leo are discussing them. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"leo",lines:[["A","So, how can we encourage students to try these subjects? Shall we start with the mentoring scheme?"],["B","Sure. Mentors could answer real questions, but would there be enough of them?"],["A","So you mean there might not be enough graduates to go round?"],["B","Exactly. What do you think of the open days with hands-on workshops?"],["A","They’re fun and practical, but they only last a day, don’t they?"],["B","True. And the talks? Seeing someone like you on stage can be powerful."],["A","That’s a fair point, but a talk can feel a bit distant, can’t it?"],["B","Maybe. So, shall we combine them: open days first, then mentors for anyone who signs up?"],["A","Agreed. That way, students get a taste first and real support afterwards."]],phrases:{Start:["Shall we start with …?","So, how can we …?"],Clarify:["So you mean (that) …?","Exactly."],"Give the turn":["What do you think of …?","…, don’t they?","…, can’t it?"],"Agree and decide":["That’s a fair point, but …","So, shall we combine them?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your university wants every student to feel welcome in every club and sport. Choose **one** idea: mixed teams for friendly tournaments, taster sessions for clubs that usually attract only men or only women, or a “Try Something New” week. Discuss for 2 minutes and decide together.",seconds:120}},of={cards:{A:["In principle, …, but in practice …","The real question is …","Equal doesn’t always mean identical.","There’s a difference between … and …","That’s a sweeping generalisation.","To be fair to both sides, …","It’s not about …; it’s about …","People should be judged on merit.","It all comes down to …"],B:["To be fair to both sides, …","That may be true, but it doesn’t explain …","In principle, …, but in practice …","What matters in the end is …","It all comes down to …","The real question is …","People should be judged on merit.","There’s a difference between … and …","Equal doesn’t always mean identical."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["In principle, …, but in practice …","The real question is …","Equal doesn’t always mean identical.","There’s a difference between … and …","That’s a sweeping generalisation.","To be fair to both sides, …","It’s not about …; it’s about …","People should be judged on merit.","It all comes down to …","That may be true, but it doesn’t explain …","What matters in the end is …","Fair treatment starts with …"],questions:["What does equal opportunity mean at a university?","Are some jobs still seen as “for men” or “for women”? Is that changing?","How have family roles in Uzbekistan changed over the last two generations?","Should companies publish what they pay their staff?","Who could be a good role model for young people who want to work in science or engineering?","Is it enough to judge people on merit, or should we also think about the obstacles they face?"]},af=[{type:"stress",title:"Stress Spot: words about equality",intro:"Tap the stressed syllable. Rules: before -ity and -tion, the syllable is strong (eQUALity, discrimiNAtion). Words ending in -eer are stressed on the end (engiNEER, caREER). Then listen and say the word.",follow:"Now use equality, opportunity and career in one sentence about the Fair Pay Court.",items:[{w:"equality",syl:["e","qual","i","ty"],s:1},{w:"opportunity",syl:["op","por","tu","ni","ty"],s:2},{w:"discrimination",syl:["dis","cri","mi","na","tion"],s:3},{w:"promotion",syl:["pro","mo","tion"],s:1},{w:"stereotype",syl:["ste","re","o","type"],s:0},{w:"colleague",syl:["col","league"],s:0},{w:"engineer",syl:["en","gi","neer"],s:2},{w:"career",syl:["ca","reer"],s:1},{w:"transparency",syl:["trans","pa","ren","cy"],s:1}]},{type:"pairs",title:"Sound Pairs: /ɪə/ or /eə/?",intro:"Press Play and choose the word you hear. /ɪə/ (here, fear, ear) starts high, near /ɪ/, and glides to a short, weak /ə/. /eə/ (hair, fair, air) starts lower and more open, near /e/; in much modern British English it is close to one long sound. In British English the r at the end is silent unless a vowel follows. Some Uzbek speakers say a strong r at the end, or make both words sound the same: start the glide from the right place. Partner version: one student says a word, the partner points to it.",pairs:[["here","hair"],["fear","fair"],["ear","air"],["peer","pair"],["dear","dare"],["steer","stare"]]}],lf=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: a level playing field, unconscious bias or promoted on merit.","Concede one point from the other side before you disagree."],uf={title:"Step Up Speaking Club Ideas Evening: Equal on Paper, Equal in Practice?",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s Ideas Evening, Nur talks about equality at work and at home: what everybody agrees on, why unfairness is often hard to see, what helped Aziza and Mateo’s father, and what real equality means.",tip:["Listen for “in principle … in practice”","Speakers often put the rule and real life side by side: *In principle, …*, *but in practice …*, *on paper*, *in real life*. The answer is usually in the second part, so keep listening after *but*."],A:"nur",B:"aziza",lines:[["A","Good evening, everyone. At our last club debate, we all agreed on two things: women and men should have **equal opportunities** in study and work, and there should be **equal pay for equal work**. [[0]] nobody disagrees, but in practice people still talk about **the gender pay gap**. So where does the gap come from?"],["A","My aunt is a civil engineer in Kuala Lumpur, and she says the problem is rarely one big unfair rule. Why is it so hard to see, then? [[1]] it is made of many small things: who gets the interesting projects, who is invited to meetings, who is expected to stay late. Each one is small, but together they make it harder to **climb the career ladder**. Often nobody means any harm. It is simply **unconscious bias**."],["A","Small things can also help. [[2]] my friend Aziza. At her university in Navoi, women and men study engineering and medicine side by side, and what helped her most was **a role model**: a lecturer who designs bridges. Mateo reminded us that equality concerns men too. His father **shares household responsibilities** at home, and when colleagues joked about it, he cooked them dinner: a friendly way to **challenge a stereotype**."],["A","[[3]] some people at the debate had a point: equality should not mean making everyone the same. Real equality is not about identical lives. It means **a level playing field**: people are **promoted on merit**, and everyone gets **fair treatment**, whoever they are."],["A","[[4]] the next step is not a new slogan but many small, fair habits, so that women and men can both find a **work–life balance** that suits them. Thank you."]],gaps:[[1,"In principle,"],[2,"The reason is that"],[3,"A case in point is"],[4,"To be fair,"],[5,"As far as I’m concerned,"]],questions:[{q:"What does Nur say about equal opportunities and equal pay?",o:["Most people at the club debate disagreed about them.","Everybody accepts them, but a gap still exists in real life.","They have already been achieved in most countries."],a:1,why:"“In principle, nobody disagrees, but in practice people still talk about the gender pay gap.”"},{q:"According to Nur’s aunt, unfairness at work is often hard to see because …",o:["companies hide their rules from their staff.","it is made of many small decisions, often without bad intentions.","women rarely talk about it with their colleagues."],a:1,why:"“The reason is that it is made of many small things … Often nobody means any harm. It is simply unconscious bias.”"},{q:"Why does Nur mention Mateo’s father?",o:["to show that equality also concerns men","to show that his colleagues were unkind","to show that men are better cooks than people think"],a:0,why:"“Mateo reminded us that equality concerns men too.” The dinner was a friendly way to challenge a stereotype, not a complaint about his colleagues."},{q:"What is Nur’s main message?",o:["Equality means that everyone should live in the same way.","One big new rule will close the gap quickly.","Real equality is a level playing field, built from many small, fair habits."],a:2,why:"“Real equality is not about identical lives. It means a level playing field … the next step is not a new slogan but many small, fair habits.”"}],notice:{q:"Look at phrases 1–5. Which one gives a reason, an example, an opinion? Which one contrasts the rule with real life, and which one admits that the other side has a point?",groups:[["Rule and real life",[1]],["Reason",[2]],["Example",[3]],["Conceding a point",[4]],["Opinion",[5]]]},use:{q:"Is unconscious bias harder to fix than an unfair rule? Why or why not?",by:"amara",model:"As far as I’m concerned, it is harder, at least at first. The reason is that you can change a rule in one meeting, but people rarely notice their own unconscious bias. A case in point is my medical school in Lagos: there was never a rule against women in surgery, yet some students still expected every surgeon to be a man. To be fair, that is changing, because students now meet more role models. So, all in all, rules are the easy part; habits take longer.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},cf=Object.freeze(Object.defineProperty({__proto__:null,BINGO:of,CARDS:_p,DEBATE:Gp,DEMOS:Kp,DIALOGUE:sf,DRILLS:Zp,EVIDENCE:tf,LESSON:Qp,LEVELS:rf,LISTEN:uf,MAIN:Jp,PRON:af,QUESTIONS:ef,REBUTTALS:nf,ROUNDS:Yp,TWISTS:$p,UNIT:Vp,WILDCARDS:lf},Symbol.toStringTag,{value:"Module"})),df={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},hf={openverse:"77b46477-0c90-4ce9-9205-6414512f98c0",title:"At Fermilab, working on Cryogenic",creator:"U.S. Department of Energy",source:"rawpixel",url:"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvZmw0OTQ2ODI0ODk5My1pbWFnZS1rcDUzaDByYy5qcGc.jpg",page:"https://www.rawpixel.com/image/3325563/free-photo-image-hijab-microscope-cc0",license:"CC0",width:7769,height:4370},pf={openverse:"2ac1699a-a665-4497-997c-b506ae076ebf",title:"Microphone Audio",creator:"Maciej Korsan",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/IQVHQYS3GL.jpg",page:"https://stocksnap.io/photo/microphone-audio-IQVHQYS3GL",license:"CC0",width:4837,height:3225},ff={
