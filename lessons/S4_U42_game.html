ouch on your hands, but **no taste, no real weight, no water and no real tiredness**. So when someone tells a story, nobody can be sure: did it happen **for real**, or was it **rendered** in a virtual world?","Each student draws a **secret memory card**: what happened, a few details, and the secret, **Real** or **Rendered**. Tell your memory as a true story, answer the circle’s questions, and try to make the listeners guess wrong. Then the harder question: **does it matter?**"],rule:"Rule of the gallery: every memory is fictional, safe and pleasant. Nobody talks about their own screen time or habits, and nobody is judged for loving or avoiding technology. Guess from the story, never from the storyteller."}},Uf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): a voice message, a podcast tip, a conversation about work and a short comment. Listen for feelings, purpose and meaning, notice the speakers’ phrases, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Aziza, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about virtual worlds (VIRtual, reALity, imMERsive), and final /p/ or /b/: tap or tab? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Will we spend more of our lives in virtual worlds, and is that a good thing?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about virtual reality and digital futures. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most surprising idea they heard (use the wheel)."]},{id:"game",icon:"🥽",name:"Real or Rendered?",min:18,lv:"c1",group:"3 gallery circles of 5",kind:"five",roles:["Storyteller · host","Storyteller · timekeeper","Storyteller · scorekeeper","Storyteller","Storyteller"],desc:"Hidden Roles as a bluffing game: each student draws a secret memory card, real or rendered in VR. Tell it as a true story, answer the circle’s questions, guess Real or Rendered, turn the cards over, then discuss: does it matter? (Book: section 6 · Game School G6)",howto:["15 students = 3 gallery circles of five, all at the same time, each with its own phone or laptop. Everyone is a storyteller and a listener; one also hosts, one keeps time, one keeps the score.","Memory cards: pass the phone round. Each student picks one card, reads it alone, opens the secret, closes it and remembers the memory number. Nobody shows the screen.","Timing: cards 2 min · Stories 5 min · Questions 4 min · Verdicts 2 min · Reveal 2 min · Does it matter? 3 min.","Every circle uses the same ten cards, and the deck is shuffled, so a circle may have any mix of real and rendered memories. Six at a circle? Two students share one memory and tell it together. “Print the cards” prints the secrets too: the teacher keeps that sheet."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about how the Club should spend its budget: VR headsets, a day trip or an online exchange, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 72, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract, and each asks for something different: a feeling, a purpose, the same idea in other words, or the main point.","Press **Play the podcast**. You hear four short extracts. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking, and summing up.","**Your turn:** listen to Aziza, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 1 is A. Leo enjoyed the lesson.","gives an answer"],["B","What makes you say that?","asks for evidence"],["A","He calls it the most immersive experience he’s ever had in a classroom. But he isn’t sure he remembers a single date.","uses the text as evidence"],["B","Right: so he’s impressed, but a little unsure what he actually learnt.","paraphrases"]],checks:[["Why is a short-extracts task harder than one long text?","every extract is a new situation: you have to find who is speaking, where and why, very quickly."],["Which phrase does Leo use to check he has understood Nur?","Correct me if I’m wrong, but …"]]},pron:{ref:"Book: Lesson 72, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-ity**, **-ology** and **-tion**, the syllable is strong (*reALity*, *techNOLogy*, *simuLAtion*); *VIRtual*, *DIGital* and *AVatar* are strong at the start.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /p/ (*tap*, *cap*) or /b/ (*tab*, *cab*)?","/p/ at the end is short and sharp. /b/ is soft, and the vowel before it is a little longer: *ta-a-b*. Don’t turn *tab* into *tap*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *reality*. Which syllable is strong?",""],["A","The first: *RE*-al-i-ty?","a guess"],["T","Listen again: re-*AL*-i-ty. What comes after it?","the teacher gives a clue"],["A","*-ity*! So *AL* is strong.","uses the rule"],["T","Good. Now *virtual* and *avatar*.",""],["B","*VIR*-tu-al and *AV*-a-tar: both strong at the start.","notices the pattern"],["T","Yes! Now listen: *cab*. First or second: *cap* or *cab*?",""],["B","Second: *cab*. The vowel is longer, and the end is soft.","listens for the length"]],checks:[["Where is the stress in *technology*?","on NOL: tech-NOL-o-gy (before -ology)."],["Where is the stress in *immersive*?","on MER: im-MER-sive."],["Which word has the longer vowel: *rope* or *robe*?","*robe*: the vowel before a final /b/ is longer."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*To my mind*, *It all stems from the fact that*, *One example that springs to mind is*, *The bottom line is that*).","Make sure your answer has a clear **position**, a **gain** and a **loss**, one **example** and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Mateo’s answer changed in 4/3/2",lines:[["mateo","Um, yes, more time in virtual worlds. School, work, travel. My cousin in Recife, er, his team is in three countries. Good, but no handshake. A tool, not a home.","Attempt 1 · 90 s · the key words, many pauses"],["mateo","I think we will spend more time in virtual worlds, at school, at work and when we travel. For example, my cousin in Recife works with a team in three countries, and they meet in a virtual office. That is good, but you can’t shake hands. So VR is a tool, not a home.","Attempt 2 · 60 s · linking phrases"],["mateo","To my mind, more of our lives will move into virtual worlds, and that is both a gift and a risk. One example that springs to mind is my cousin in Recife, whose team in three countries meets every morning in a virtual office. What they gain is distance made small; what they lose is the handshake and the chat by the coffee machine. The bottom line is that a virtual world is a wonderful tool, but a poor home.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Will students in 2040 still go to school in a building?",lines:[["amara","**To my mind,** yes, they will. A VR lesson can be **an immersive experience**, but school is also about **face-to-face contact**: friends, teachers, the noise in the corridor. **It all stems from** what school is for. And **the digital divide** matters too: not every family in Lagos can afford a headset. **The bottom line is** that headsets will come into the building; they won’t replace it.","speaker · 1 minute"],["leo","I heard six phrases: *To my mind*, *an immersive experience*, *face-to-face contact*, *It all stems from*, *the digital divide* and *The bottom line is*. That’s a full row: **Bingo!**","listener reports"],["amara","Six points plus three for the Bingo: nine!","count the points"],["leo","Next time, try *blur the line between*. It’s on my card, and it fits your point about headsets in the classroom.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you talk about your own screen time?","no: talk about school, work, travel and the future in general."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*We can only afford one thing this year …*).","Click the lines in order. Each line answers the line before. Amara and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a museum app or a real visit",lines:[["A","The class can either buy a museum app or visit the museum once.","opens the topic"],["B","The app would last all year, wouldn’t it?","a reason"],["A","True, but nothing beats standing in front of the real thing.","an argument"],["B","Then let’s visit first and use the app to remember it.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make gallery circles of five. Choose a **host**, a **timekeeper** and a **scorekeeper**; everyone is also a **storyteller** and a **listener**.","**Memory cards (2 min):** pass the phone round. Pick one card, read it alone, open **Your secret** (Real or Rendered?), close it and remember your **memory number**.","**Round 1 · The story (60 s each):** tell your memory as a **true story**. Add details of your own. Listeners note one detail that sounds lived and one that sounds too perfect.","**Round 2 · Questions:** listeners open **question cards** and ask; storytellers answer at once. Remember the booth rule: **no taste, no real weight, no water, no real tiredness**.","**Round 3 · Real or Rendered?** Every listener writes a verdict and the deciding clue for each storyteller (book, section 6), then says it aloud.","**Round 4 · Reveal:** turn the cards over by number. A storyteller scores **1 point for every listener who guessed wrong**; a listener scores **1 point for every right guess**.","**Round 5 · Does it matter?** Open dilemma cards: is a virtual experience less real, or less valuable?"],exTitle:"Sample game: a practice memory at Circle A (not on the cards)",lines:[["","Host: Nur · Timekeeper: Mateo · Scorekeeper: Amara · Storytellers and listeners: everyone",""],["leo","(practice memory: a night boat trip) **I’ll never forget** the lake that night: hundreds of paper lanterns on the water, and a boatman singing very quietly.","tells it as a true story"],["aziza","(question card: Taste) **Did you eat or drink anything?** What did it taste like?","asks a question card"],["leo","Sweet tea from a flask, **slightly smoky**, because the flask had stood by the fire.","answers with detail"],["mateo","**And your hands?** Was the lantern heavy?","a follow-up question (Boomerang)"],["leo","Light as a leaf. **Well, no:** it was wet, so quite heavy, actually.","corrects himself"],["","… Round 3 · Real or Rendered? …",""],["amara","**What gave it away for me** was the lantern. The weight changed in the middle of the answer: **rendered**.","a verdict with a reason"],["nur","**I’m not so sure.** A real memory changes too, and a booth can’t give you the taste of smoky tea. **Real.**","disagrees with a reason"],["","… Round 4 · Reveal …",""],["leo","**Believe it or not, it was real.** Nur, one point to you. Amara, Aziza and Mateo guessed wrong: **three points to me!**","reveals and scores"]],checks:[["What can a 2040s booth in this game not give you?","taste, real weight, water and real tiredness. It gives sight, sound, smell, wind, warmth and a light touch."],["How do you score?","a storyteller gets 1 point for every listener who guessed wrong; a listener gets 1 point for every right guess."],["What do you guess from: the story or the storyteller?","from the story and the answers, never from who the storyteller is."]]},drills:{ref:"Book: Lesson 72 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Before the lesson, everyone had to ___ and adjust the straps.",o:["put on a headset","keep in touch","work remotely"],a:0},{q:"Walking through the old harbour in VR was ___: I forgot I was in a classroom.",o:["an immersive experience","a virtual meeting","the digital divide"],a:0},{q:"Before her trip to Khiva, she took ___ on her laptop.",o:["a virtual tour","an online community","face-to-face contact"],a:0},{q:"With ___, you hold up your phone and see a ruined building as it once was.",o:["augmented reality","a virtual meeting","the digital divide"],a:0},{q:"Many people now ___: they do their job from home or a café.",o:["work remotely","keep in touch","put on a headset"],a:0},{q:"After every ___, she still didn’t know what her colleagues were really like.",o:["virtual meeting","online community","immersive experience"],a:0},{q:"Nur would like a bit more ___ with her team: once a month, maybe.",o:["face-to-face contact","augmented reality","virtual reality"],a:0},{q:"Leo’s chess club is ___: players from four continents.",o:["an online community","a virtual tour","the digital divide"],a:0},{q:"VR may ___ online and offline life even more.",o:["blur the line between","keep in touch with","work remotely from"],a:0},{q:"Not everyone can afford a headset: ___ is real.",o:["the digital divide","augmented reality","face-to-face contact"],a:0},{q:"I still ___ with my school friends: we meet up and talk.",o:["keep in touch","work remotely","blur the line"],a:0},{q:"In ___, you can look around a computer-made world as if you were really there.",o:["virtual reality","the digital divide","an online community"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check.",items:[{p:"People spend more time in virtual worlds. → **By 2050, people will be …**",a:"By 2050, people will be spending more time in virtual worlds."},{p:"VR changes the way we work. → **By 2050, VR will have …**",a:"By 2050, VR will have changed the way we work."},{p:"More and more schools use VR headsets. → **passive: VR headsets are being …**",a:"VR headsets are being used in more and more schools."},{p:"Perhaps the lesson was in VR. → **The lesson might …**",a:"The lesson might have been in VR."},{p:"I’m sure it wasn’t real. → **It can’t …**",a:"It can’t have been real."},{p:"Teams need some face-to-face contact. Otherwise, they stop trusting each other. → **unless**",a:"Unless teams have some face-to-face contact, they stop trusting each other."},{p:"The headset isn’t the problem. The way we use it is. → **It isn’t …, it’s …**",a:"It isn’t the headset, it’s the way we use it."},{p:"We need cheaper headsets. → **What we need is …**",a:"What we need is cheaper headsets."},{p:"We have rarely seen technology change so fast. → **Rarely …(inversion)**",a:"Rarely have we seen technology change so fast."},{p:"VR gets more realistic. It gets harder to tell what is real. → **The more …, the harder …**",a:"The more realistic VR gets, the harder it is to tell what is real."},{p:"People wrote letters. Now they send voice messages. → **used to …, but now …**",a:"People used to write letters, but now they send voice messages."},{p:"I wish I had seen the real concert. → **If only …**",a:"If only I had seen the real concert!"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I think VR lessons are very good.",a:"To my mind, a VR lesson is the most immersive experience a classroom can offer."},{p:"The reason is that you can see things.",a:"It all stems from the fact that you don’t just read about the past; you stand in it."},{p:"For example, my cousin’s trip.",a:"One example that springs to mind is my cousin’s trip to Khiva."},{p:"I work from home and meet people online.",a:"I work remotely, and most of my meetings are virtual meetings."},{p:"Online life and real life are mixing.",a:"VR is blurring the line between online and offline life."},{p:"So the main thing is people, not technology.",a:"The bottom line is that people, not technology, make a friendship real."},{p:"Do you mean you want to see your team more?",a:"Correct me if I’m wrong, but you’d like more face-to-face contact with your team?"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I met with my pen friend in online.",o:["I met my pen friend online.","I met with my pen friend at online.","I met my pen friend in the online."],a:0,why:"online is an adverb here: no “in” (a calque of “onlayn tarzda”); meet + person"},{q:"✗ I played a VR game during two hours.",o:["I played a VR game for two hours.","I played a VR game while two hours.","I played a VR game during two hours long."],a:0,why:"for + a length of time; during + a noun (during the lesson); a calque of “ikki soat davomida”"},{q:"✗ I want that VR will be cheaper.",o:["I want VR to be cheaper.","I want that VR is cheaper.","I want VR will be cheaper."],a:0,why:"want + object + to (a calque of “VR arzonroq boʻlishini xohlayman”)"},{q:"✗ Internet changes our life every day.",o:["The internet is changing our lives every day.","Internet is changing our life every day.","An internet changes our lives every day."],a:0,why:"the internet (with the); our lives (plural)"},{q:"✗ VR gives possibility to travel without leaving home.",o:["VR makes it possible to travel without leaving home.","VR gives possibility for travel without leaving home.","VR gives the possibility travel without leaving home."],a:0,why:"make it possible to … (or: gives us the chance to …)"},{q:"✗ I have many experiences in using VR headsets.",o:["I have a lot of experience of using VR headsets.","I have many experience in using VR headsets.","I have much experiences of using VR headsets."],a:0,why:"experience = skill is uncountable (an experience = one event)"},{q:"✗ Technologies is developing very fast.",o:["Technology is developing very fast.","Technologies is develop very fast.","The technologies is developing very fast."],a:0,why:"technology (in general) is uncountable + is"},{q:"✗ In future, people will live in virtual world.",o:["In the future, people will spend more time in virtual worlds.","In future, people will live in the virtual world.","In the future people live in virtual world."],a:0,why:"in the future = at a later time; a virtual world / virtual worlds (countable)"}]},{title:"Stress: words about virtual worlds",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"not real, but made by a computer",o:["VIRtual","virTUal"],a:0},{q:"the real world, as it is",o:["reALity","REality"],a:0,why:"Before -ity, the syllable is strong."},{q:"using computers and numbers",o:["DIGital","diGItal"],a:0},{q:"making you feel completely inside something",o:["imMERsive","IMmersive"],a:0},{q:"machines, computers and the science behind them",o:["techNOLogy","TECHnology"],a:0,why:"Before -ology, the syllable is strong."},{q:"a picture or figure that stands for you in a game or virtual world",o:["AVatar","aVAtar"],a:0},{q:"a copy of a real situation, made for practice",o:["simuLAtion","SImulation"],a:0,why:"Before -tion, the syllable is strong."}]}],Jf={cardsStep:"Memory cards",cardsTitle:"Memory cards",cardsHint:"Pass the phone round. Pick one card and read your memory alone. Then press “Show: Your secret” to see whether it was Real or Rendered. Close it: the card turns back and shows “Taken”. Remember your memory number (you need it in Round 4) and keep everything secret. You will tell the memory in your own words, as if it were true, and you may add details of your own.",backWord:"Memory",cardsSecret:!0,hiddenLabel:"Your secret",questionWord:"Question",questionTitle:"Question cards",questionHint:"Open a card, choose one storyteller and ask the question. The storyteller answers at once, with detail. Then ask **one follow-up question** of your own. Listen for answers that sound **too perfect**, too vague, or truly lived. Booth rule: **no taste, no real weight, no water, no real tiredness**.",questionHelp:{b2:["What could you … when …?","Who else was there when …?","And what happened just after …?"],c1:["Talk me through the moment when …","What exactly did … feel like?","You said …, so how come …?"]},twistWord:"Dilemma",twistTitle:"Does it matter?",twistHint:"Open one dilemma card and read it aloud. Discuss it as a circle for about a minute: is the virtual experience **less real**, or **less valuable**, than the real one? Then open another.",twistHelp:{b2:["I think it’s just as real, because …","Something is missing: …","It depends on …"],c1:["It may be virtual, but the … is real.","What a virtual version can’t give you is …","Whether it matters depends largely on …"]},revealTitle:"Turn the memories over",revealHint:"One storyteller at a time: say your **memory number** and turn that card over here. Read your secret aloud. **Score:** you get **1 point for every listener who guessed wrong**; every listener who guessed right gets **1 point**. Which answer nearly gave you away, and which bluff worked best?",teamWord:"Circle",teamIcon:"",teamKind:"five",teams:3},Zf=[{name:"Round 1 · The story",lv:"b2p",bloom:"Apply / Create",by:"leo",seconds:60,q:"One storyteller at a time: tell your memory **as a true story** in **60 seconds**. Say where you were, what happened, what you saw, heard and felt, and why you remember it. Listeners: note one detail that sounds **truly lived** and one that sounds **too perfect**.",help:{b2:["It happened when I …","The first thing I noticed was …","I’ll never forget the moment when …"],c1:["It was one of those days when …","What struck me most was …","Even now, I can still …"]},model:"Here is how a story sounds, from a practice memory that is not on the cards: “It was one of those evenings when the whole world seems to slow down. I was in a small boat on a lake, and hundreds of paper lanterns were floating around us, each with a candle inside. What struck me most was the silence: even the children were whispering. The air smelt of rain and candle smoke, and the boatman sang very quietly as he rowed. Even now, when I close my eyes, I can still see one lantern drifting away on its own.”"},{name:"Round 2 · Questions",lv:"c1",bloom:"Analyse",by:"aziza",tool:"questions",seconds:240,q:"Listeners open **question cards** and ask the storytellers. Answer at once and with detail: long pauses look suspicious. After each answer, the listener asks **one follow-up question** and passes the turn on (Boomerang). Remember the booth rule: sight, sound, smell, wind, warmth and a light touch, but **no taste, no real weight, no water and no real tiredness**.",help:{b2:["What could you smell when …?","Who else was there?","And just after that?"],c1:["Talk me through the moment when …","You mentioned …, so how come …?","What exactly did … feel like in your hands?"]},model:"In the practice game, the best question was the simplest one: “What did your hands feel?” The storyteller with the lantern memory said the lantern was “lighter than a leaf”, and then, a second later, that it was “quite heavy, actually”. That small change made the whole circle suspicious. A good follow-up question doesn’t accuse anyone. It just asks for one more detail and lets the story check itself."},{name:"Round 3 · Real or Rendered?",lv:"c1",bloom:"Evaluate",by:"amara",seconds:120,q:"Each listener writes a verdict for every storyteller on the sheet in the book (section 6): **Real** or **Rendered**, and the **clue** that decided it. Then, one storyteller at a time, say your verdicts aloud with your reasons. Storytellers say nothing yet.",help:{b2:["I think yours was real, because …","Yours sounded rendered to me: …","I wasn’t sure until you said …"],c1:["What gave it away for me was …","Everything pointed to …, apart from …","It’s a close call, but I’d say …"]},model:"With the lantern memory, it’s a close call, but I’d say rendered. Everything pointed to a real evening, the smoke, the singing, the whispering children, apart from one thing: the weight of the lantern changed in the middle of the answer. A booth in this game can’t give real weight, so a storyteller who is inventing it has to guess, and guesses change. What gave it away for me was not a big detail, but a small correction."},{name:"Round 4 · Reveal",lv:"b2p",bloom:"Evaluate",by:"leo",tool:"reveal",seconds:0,q:"One storyteller at a time: say your **memory number**, turn your card over and read your secret aloud. Count the points. Then say which question nearly gave you away, and which **bluff** or detail fooled the circle.",help:{b2:["My memory was real / rendered.","You guessed wrong because …","The question that nearly caught me was …"],c1:["Believe it or not, it was …","What threw you off, I think, was …","I nearly gave myself away when …"]},model:"Believe it or not, the lantern memory was real: a lantern festival on a lake, and the boatman really did sing. What threw the circle off was my own correction: when someone asked about the lantern, I first said it was light, then I remembered it was wet and quite heavy. A true memory changes as you remember it, too. So I scored three points, because three listeners guessed wrong, and I learnt something: people trust a smooth story more than an honest one."},{name:"Round 5 · Does it matter?",lv:"c1",bloom:"Evaluate / Create",by:"mateo",tool:"twists",seconds:90,q:"Step out of the game. Open a **dilemma card** and discuss it as a circle: is a virtual experience **less real** or **less valuable** than a real one? At the end, each player sums up their view in one sentence: *A virtual experience is … because …*",help:{b2:["I think it’s just as real, because …","Something is missing: …","A virtual experience is … because …"],c1:["It may be virtual, but the … is real.","What a virtual version can’t give you is …","Whether it matters depends largely on …"]},model:"To my mind, a virtual experience isn’t less real if something real comes out of it: a skill, a friendship, a decision or a memory you keep. A concert in a booth can still move you, and a colleague you meet in a virtual office is still a person. What a virtual version can’t give you is the unplanned part: the taste of street food in a strange city, a conversation with a stranger, getting lost. So my sentence is this: a virtual experience is real, but it is narrower, because nothing unexpected is allowed in."}],_f=[{e:"🍚",n:"Plov for a hundred guests",r:"Memory 1 · food",lines:[["What happened","Early one morning, you helped a master cook make plov for a hundred guests in a huge kazan, outdoors."],["Details","Smoke in your eyes; the hiss of carrots hitting the hot oil; the heavy wooden spoon; the first taste from the edge of the kazan."],["Tricky detail","You were sure you would ruin it, and everything went perfectly. It sounds almost too good to be true."]],x:"REAL. It was for a neighbour’s celebration in your mahalla. You started before sunrise, and by nine o’clock your arms ached from the spoon. The cook let you carry the first plate to the oldest guest."},{e:"🏔",n:"Sunrise on the glacier",r:"Memory 2 · nature",lines:[["What happened","You stood on a glacier high in the mountains and watched the sun rise. The ice turned from grey to pink to gold."],["Details","Blue cracks in the ice; a cold wind on your face; the crunch of your boots; total silence, then one bird."],["Tricky detail","You remember that your legs were very tired. Someone may ask how you got up there."]],x:"RENDERED. You were in a full-sense booth at the city library for forty minutes. The wind and the cold came from the booth; the tired legs you will have to invent. Just after, you took off the headset and drank tea in the library café. It cost about as much as a cinema ticket."},{e:"🐪",n:"A caravan at the Registan",r:"Memory 3 · history",lines:[["What happened","You walked through old Samarkand on the evening a caravan arrived: merchants in long robes, camels in the square, craftsmen making paper by hand."],["Details","The smell of camels, spices and fresh bread; bells on the camels; a merchant who gave you a handful of dried apricots."],["Tricky detail","Some listeners may think it was a costume festival. You can let them think so."]],x:"RENDERED. It was a history world of Samarkand on the Silk Road, in a booth at a museum in Navoi. A booth gives no taste, so if someone asks about the apricots, you will have to invent it. Just after, you took off the gloves and walked home in the rain."},{e:"✉",n:"Meeting my pen friend",r:"Memory 4 · people",lines:[["What happened","After years of writing to each other, you met your pen friend, Paloma from Chile, for the first time, in a station café."],["Details","She was taller than on screen; she laughed exactly as in her voice messages; the café smelt of coffee and cinnamon."],["Tricky detail","It felt strangely familiar, like a video call you had seen a hundred times."]],x:"REAL. She came to Uzbekistan with her university choir. Her train was two hours late, so you waited with a cold cup of tea. She gave you a small copper bookmark from home, and you still keep it in your favourite book."},{e:"💼",n:"The job interview",r:"Memory 5 · work",lines:[["What happened","You had an interview for a summer job at a design studio, on a high floor with a view over the whole city."],["Details","A glass table; three people asking questions; your hands cold with nerves; a firm handshake at the end."],["Tricky detail","You got the job, and you start next month."]],x:"RENDERED. The studio holds all its interviews in its virtual office: you were an avatar, sitting in a booth at a library. The handshake was the glove pressing your hand. But the job is real, and so were your nerves."},{e:"🏺",n:"The blue bowl",r:"Memory 6 · craft",lines:[["What happened","In Rishtan, a town famous for its blue pottery, a master potter taught you to make a bowl on a potter’s wheel."],["Details","Wet, heavy clay; the wheel humming; the smell of the kiln; the master’s hands over yours, fixing the shape."],["Tricky detail","The blue glaze was so bright that it looked digital."]],x:"REAL. You spent a whole weekend in the workshop. Your first two bowls collapsed on the wheel. The third one survived the kiln, and it now stands on a shelf at home, a little crooked."},{e:"🎶",n:"The open-air concert",r:"Memory 7 · music",lines:[["What happened","You were at an open-air concert with thousands of people. On the very last song, it began to rain, and nobody left."],["Details","Lights shining through the rain; strangers singing together; the smell of wet grass; your shoes full of water."],["Tricky detail","The rain began exactly on the last song, like the end of a film."]],x:"REAL. You went with two friends and paid for the tickets with your savings. After the concert, you missed the last bus and walked home in wet shoes, laughing. The next morning, your voice had almost gone from singing."},{e:"🎈",n:"The balloon at dawn",r:"Memory 8 · travel",lines:[["What happened","A hot-air balloon flight at dawn over a valley of strange stone towers, with dozens of other balloons around you."],["Details","The roar and the heat of the burner above your head; the basket creaking; the shadow of the balloon on the rocks below."],["Tricky detail","You were scared at first, then completely calm."]],x:"RENDERED. It was a travel world in a booth at a shopping centre; the heat of the burner came from the booth’s warm air. Just after, you bought a postcard of the real valley, in Cappadocia, Turkey, to plan the real trip one day."},{e:"🥁",n:"The folk orchestra",r:"Memory 9 · music",lines:[["What happened","For one evening, you played the doira, a frame drum, with a folk orchestra at a festival concert."],["Details","Bright stage lights; the drum skin warm under your fingers; the audience clapping along; your heart beating faster than the rhythm."],["Tricky detail","The hall looked so perfect it seemed unreal, and you never missed a single beat."]],x:"REAL. A friend in the orchestra invited you to rehearse with them for a month. After the concert, your fingers were sore, and the musicians shared somsa with you backstage. It was free, but it cost you every evening of that month."},{e:"🚗",n:"My first driving lesson",r:"Memory 10 · skills",lines:[["What happened","Your first driving lesson, on a narrow mountain road, with an instructor beside you."],["Details","Your hands tight on the wheel; the engine noise; a lorry coming round a bend; the instructor saying, “Gently, gently.”"],["Tricky detail","You braked so hard that your bag fell off the back seat."]],x:"RENDERED. It was the driving school’s simulator world: every new student starts there before the real roads. The bag fell only in the simulation. Just after, you had your first real lesson in an empty car park, and it felt easy."}],$f=[{t:"The virtual graduation",q:"A university holds its graduation ceremony in VR. Graduates from many countries walk across a virtual stage, and their families watch as avatars from home. **Is this graduation less real, or less valuable, than one in a hall?**",by:"aziza",m:"The degree is just as real, and so is the work behind it, so in that sense nothing is lost. But a graduation is also for the families: my mother would want to hug me, not my avatar. It may be virtual, but the pride is real. And for students whose families live far away, a virtual ceremony is far better than no ceremony at all."},{t:"The avatar friend",q:"Wairimu in Nairobi and Haruto in Osaka have played music together in a virtual world for years. They have never met. Wairimu says: “He’s one of my closest friends.” **Can a friendship with an avatar be a real friendship? What might be missing?**",by:"leo",m:"To my mind, it can be a real friendship, because what makes a friend is trust and time, and they have both. What might be missing is the ordinary part: sitting in silence together, helping someone move house, seeing them on a bad day. I’d say it’s a real friendship, but one with a few rooms still closed."},{t:"The VR concert ticket",q:"Tickets for a VR concert by a famous band cost exactly the same as a seat in the real hall. **Should a virtual experience cost as much as a real one?**",by:"mateo",m:"I don’t think the price should be the same, because the hall, the journey and the crowd are part of what you pay for. But the musicians work just as hard, and a VR ticket lets people in other countries see them. The bottom line is that it should cost less, but not nothing."},{t:"A place that no longer exists",q:"A VR world rebuilds an old city neighbourhood that was knocked down long ago, street by street, from old photos and people’s memories. **Is visiting it a kind of travel, a history lesson, or something else?**",by:"nur",m:"It’s something in between: a history lesson you can walk through. For the older people who grew up there, it might feel more like visiting an old friend. What it can’t be is travel, because the place isn’t there any more. But it might be the only way their grandchildren can ever see it."},{t:"A real job, a virtual interview",q:"A student gets a real job after an interview in a company’s virtual office. **Does it matter where the interview happened, if the result is real?**",by:"amara",m:"The result is what counts for the student, so in one way it doesn’t matter. But both sides may miss something: you learn a lot about a company by walking through its corridors, and an employer learns a lot from how you greet the person at reception. So the setting matters less than the result, but it isn’t nothing."},{t:"A skill learnt in VR",q:"Pilots practise in flight simulators before they fly real planes, and some driving schools start new students in a simulator. **If you learn a real skill in a virtual world, was the learning less real?**",by:"aziza",m:"Not at all: the skill is in your head and your hands, not in the place where you learnt it. A simulator even lets you make mistakes safely, which a real road can’t. But at some point you need the real thing, with real weather and real drivers around you. So the learning is real; it just isn’t complete."}],ep=[{t:"Smell",q:"Ask one storyteller: **What could you smell, and when did you first notice it?**",by:"nur",m:"The first thing I noticed was smoke, from the candles inside the lanterns, mixed with the smell of the lake after rain. Later, someone on the shore was frying fish, and I remember suddenly feeling hungry."},{t:"Your hands",q:"Ask one storyteller: **What did your hands feel? Was anything heavy, wet, rough, warm or cold?**",by:"leo",m:"The side of the boat was wet and rough, and my fingers were cold. When the boatman passed me a lantern, the paper was warm near the candle and damp at the bottom. It was heavier than it looked."},{t:"Taste",q:"Ask one storyteller: **Did you eat or drink anything? What did it taste like?**",by:"amara",m:"Only tea from a flask, very sweet, with a slightly smoky taste, because the flask had stood next to the fire. Honestly, it was the best tea of my life, but probably because I was cold."},{t:"People",q:"Ask one storyteller: **Who was there, and what exactly did one of them say to you?**",by:"mateo",m:"There were about ten of us in the boat, mostly families. An old man next to me said, “Make a wish before you let it go,” and he wouldn’t tell me his own wish."},{t:"Just after",q:"Ask one storyteller: **What happened in the ten minutes just after it ended? Where did you go?**",by:"aziza",m:"We waited on the shore until the last lanterns had disappeared. Then we walked to the bus stop in silence; nobody wanted to talk. I remember checking my shoes, because one of them was soaked."},{t:"The cost",q:"Ask one storyteller: **What did it cost you: money, time, a long journey, something you gave up?**",by:"nur",m:"The ticket was cheap, but the journey wasn’t: two buses and a long walk. I also missed a friend’s birthday party for it, and she still reminds me."},{t:"Something to show",q:"Ask one storyteller: **Do you still have anything from that day: an object, a photo, a ticket? Describe it.**",by:"leo",m:"I kept a tiny piece of lantern paper, red with a gold edge. It’s inside my diary now, a little burnt at one corner."},{t:"What went wrong",q:"Ask one storyteller: **What didn’t go to plan?**",by:"amara",m:"My lantern wouldn’t light at first: the wind kept blowing the match out. In the end, the boatman lit it from his own, which was a little embarrassing, but also rather kind."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Would you like to try a lesson in virtual reality? Why?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I would love to try a lesson in virtual reality."],["Point","**The main reason is that** some subjects are easier to understand when you can see them."],["Example","**For example,** in a history lesson we could walk through old Bukhara."],["Close","**So, all in all,** a VR lesson sounds exciting, but I would still want a real teacher."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"amara",q:"How could virtual reality help people at work?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first way is that** people could train for difficult jobs safely."],["","**Then,** colleagues in different countries could meet in one virtual room."],["","**What is more,** designers could walk through a building before it is built."],["","**For instance,** an architect friend of mine in Lagos shows her clients their new homes in VR."],["","**Finally,** people who work remotely could feel more like part of a team."],["","**In short,** VR could make work safer, more connected and more creative."]],keys:["the first way","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"What could we lose if more of life moves online?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that moving more of life online brings real gains, but also real losses."],["","To begin with, we might lose the small, unplanned conversations that happen in corridors and cafés."],["","On top of that, people without fast internet or a headset could be left behind."],["","A case in point is my grandparents’ village near Hamburg, where the internet is still slow."],["","Admittedly, online life also connects people who would never otherwise meet."],["","On balance, we should move online what works better there, and keep the rest face to face."]],extra:"My grandmother bakes the best apple cake in the whole village.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"How might virtual reality change travel?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","virtual reality will change how we plan trips more than whether we travel."],["First of all,","virtual tours let people explore a place before they decide to go."],["Besides,","people who cannot travel far can still visit famous places."],["For example,","my parents took a virtual tour of Samarkand before they flew there from Kuala Lumpur."],["However,","a headset cannot give you the taste of the food or the kindness of strangers."],["Ultimately,","VR is a window to a place, not a door into it."]],distractors:["Similarly,","Otherwise,"],keys:["plan trips","explore first","those who can’t travel","a window, not a door"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"Will we spend more of our lives in virtual worlds, and is that a good thing?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["more time in virtual worlds: almost certain","school, work, travel","Recife: my cousin’s team in three countries","gain: distance made small","loss: handshake, chance meetings","a tool, not a home"],model:"To my mind, we will almost certainly spend more of our lives in virtual worlds: at school, at work and even when we travel. It all stems from the fact that virtual places remove distance, so you can join a class or a meeting from anywhere. One example that springs to mind is my cousin in Recife, whose team works in three countries and meets every morning in a virtual office. That is a real gain. But something is lost, too: you can’t share a handshake, a meal or a chance conversation by the coffee machine. The bottom line is that a virtual world is a wonderful tool, but a poor home: we should visit it, not move in."}],np={title:"Exam Part 2 practice: the Club’s budget",situation:"The Step Up Speaking Club can spend its small budget on one thing this year: two VR headsets for virtual tours, a day trip to Bukhara, or a year of online exchange with a partner club abroad. Amara and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"amara",B:"mateo",lines:[["A","We can only afford one thing this year. Shall we start with the VR headsets?"],["B","Sure. We could visit a different city every week, couldn’t we?"],["A","We could, although only two people can use them at a time."],["B","Fair point. What about the trip to Bukhara? Everyone could come."],["A","True, but it’s just one day, and then the money’s gone."],["B","And the online exchange? We’d talk to real people abroad all year."],["A","That’s a strong argument. It’s also the only option that’s really about speaking."],["B","So shall we go for the exchange, and save up for the trip next year?"],["A","Agreed. That way, we practise every week and still have something to look forward to."]],phrases:{Start:["We can only afford one …","Shall we start with …?"],Clarify:["…, couldn’t we?","We could, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your university can fund **one** of these for language students: a VR room for virtual trips, a real study trip for a small group, or online classes with a partner university abroad. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["To my mind, …","face-to-face contact","It all stems from …","an immersive experience","One example that springs to mind is …","blur the line between","The bottom line is …","a virtual tour","the digital divide"],B:["an online community","the digital divide","The bottom line is …","face-to-face contact","To my mind, …","augmented reality","It all stems from …","an immersive experience","One example that springs to mind is …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["To my mind, …","face-to-face contact","It all stems from …","an immersive experience","One example that springs to mind is …","blur the line between","The bottom line is …","a virtual tour","the digital divide","an online community","augmented reality"],questions:["Will students in 2040 still go to school in a building?","Would you rather see Khiva in VR now, or wait years to go there for real?","Can a friendship with someone you have only met online be a real friendship?","Which job in Uzbekistan could change most because of VR? Is it the same in another country you know?","What do teams lose when their meetings move to a virtual office?","Is a virtual experience less valuable than a real one?"]},sp=[{type:"stress",title:"Stress Spot: words about virtual worlds",intro:"Tap the stressed syllable. Rule: before -ity, -ology and -tion, the syllable is strong (reALity, techNOLogy, simuLAtion). VIRtual, DIGital and AVatar are strong at the start; imMERsive and interACtive are strong later. Then listen and say the word.",follow:"Now use two of these words in one sentence about school in 2040.",items:[{w:"virtual",syl:["vir","tu","al"],s:0},{w:"reality",syl:["re","al","i","ty"],s:1},{w:"digital",syl:["dig","i","tal"],s:0},{w:"immersive",syl:["im","mer","sive"],s:1},{w:"technology",syl:["tech","nol","o","gy"],s:1},{w:"avatar",syl:["av","a","tar"],s:0},{w:"interactive",syl:["in","ter","ac","tive"],s:2},{w:"simulation",syl:["sim","u","la","tion"],s:2}]},{type:"pairs",title:"Sound Pairs: final /p/ or /b/? (tap or tab?)",intro:"Press Play and choose the word you hear. A final /p/ is short and sharp (tap, cap, rope, rip, mop). A final /b/ is soft, and the vowel before it is a little longer (tab, cab, robe, rib, mob). Many Uzbek speakers make a final voiced consonant voiceless (kitob sounds like kitop), so tab can easily sound like tap. Partner version: one student says a word, the partner points to it.",pairs:[["tap","tab"],["cap","cab"],["rope","robe"],["rip","rib"],["mop","mob"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say one thing VR can give you and one thing it can’t.","Check what the last speaker meant before you answer: Correct me if I’m wrong, but …"],lp={title:"Step Up Speaking Club podcast: Four Windows on a Virtual World",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts: a voice message, a podcast tip, a conversation about work and a short comment. Leo and Nur talk about virtual reality at school, in travel, at work and in friendship.",tip:["Listen for the situation","Each extract is a new situation. Before each one, read its question and ask: who is speaking, to whom, and why? The first few words usually tell you."],A:"leo",B:"nur",lines:[["A","*Extract 1.* Hi Nur, it’s Leo. I’ve just had my first history lesson in **virtual reality**. We each **put on a headset**, and suddenly we were in Hamburg’s harbour centuries ago: wooden ships, ropes, traders shouting. [[0]] it was the most **immersive experience** I’ve ever had in a classroom. [[1]] you don’t just read about the past; you’re standing in the middle of it. My only worry? I’m not sure I remember a single date!"],["B","*Extract 2.* This week’s Club tip: before a big trip, take **a virtual tour**. [[2]] my cousin’s visit to Khiva. She ‘walked’ round the old city on her laptop first, so when she got there, she knew exactly which streets to explore. Some museums use **augmented reality**, too: you hold up your phone and see a ruined building as it once was. So don’t replace the journey with a screen; use the screen to prepare for it."],["A","*Extract 3.* Nur, how’s the internship going? Are you in the office much?"],["B","Hardly ever. I **work remotely**, and the team meets in a virtual office: we’re all avatars round one table. It’s fun, but after every **virtual meeting**, I still don’t know what my colleagues are really like."],["A","[[3]] you’d like a bit more **face-to-face contact**?"],["B","Not every day. Just enough to know who I’m working with. Once a month, maybe."],["A","*Extract 4.* People say online friends aren’t real friends. I couldn’t disagree more. My chess club is an **online community**: players from four continents, some of whom I’ve known for years without ever meeting. Of course, VR will **blur the line between** online and offline life even more, and not everyone can afford a headset: **the digital divide** is real. [[4]] technology doesn’t decide how real a friendship is; people do. And I still **keep in touch** with my school friends the old way: over a meal."]],gaps:[[1,"To my mind,"],[2,"It all stems from the fact that"],[3,"One example that springs to mind is"],[4,"Correct me if I’m wrong, but"],[5,"The bottom line is that"]],questions:[{q:"Extract 1. How does Leo feel about the VR lesson?",o:["impressed, but unsure what he learnt","disappointed by the noise","bored by the history"],a:0,why:"“the most immersive experience I’ve ever had in a classroom … I’m not sure I remember a single date!”"},{q:"Extract 2. What is Nur’s main purpose?",o:["to persuade people to take virtual tours instead of travelling","to describe her cousin’s holiday","to suggest virtual tours to prepare for trips"],a:2,why:"“So don’t replace the journey with a screen; use the screen to prepare for it.”"},{q:"Extract 3. What does Nur mean by “just enough to know who I’m working with”?",o:["She’d like to meet colleagues in person sometimes.","She wants to stop working with avatars.","She’d like to work in the office every day."],a:0,why:"“Not every day. Just enough to know who I’m working with. Once a month, maybe.”"},{q:"Extract 4. What is Leo’s main point?",o:["VR will soon replace meeting people in person.","A friendship can be real even if it lives online.","Everyone should be able to buy a headset."],a:1,why:"“Technology doesn’t decide how real a friendship is; people do.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason or an example? Which one does Leo use to check that he has understood Nur? Which one sums up a whole argument?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[3]],["Checking meaning",[4]],["Summing up",[5]]]},use:{q:"Which part of life will virtual reality change most: school, work or travel?",by:"aziza",model:"To my mind, virtual reality will change school more than work or travel. It all stems from the fact that some things are very hard to understand from a book. One example that springs to mind is chemistry. My school in Navoi had a small lab, so we mostly watched the teacher. In a virtual lab, every student could mix the chemicals, make mistakes and try again. Correct me if I’m wrong, but most of us remember what we do far better than what we read. The bottom line is that VR won’t replace teachers, but it could give every student a lab, a museum and a field trip.",ticks:["an opinion","a reason","an example from Uzbekistan","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Yf,DIALOGUE:np,DRILLS:Kf,LESSON:Uf,LEVELS:tp,LISTEN:lp,MAIN:Jf,PRON:sp,QUESTIONS:ep,ROUNDS:Zf,TWISTS:$f,UNIT:Gf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"7866d8a0-7ff5-41ac-84ff-66d254f63fcd",title:"Virtual Reality",creator:"Bruce Mars",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/PFHFKXTMYD.jpg",page:"https://stocksnap.io/photo/virtual-reality-PFHFKXTMYD",license:"CC0",width:5651,height:3768},up={openverse:"5542c15d-ffb8-48e5-8d
