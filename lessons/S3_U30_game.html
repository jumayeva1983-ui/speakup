:"Read the clues aloud in English and explain each digit to your partner.",clues:["Digit 1: the number of places in the Hall of Fame this year.","Digit 2: the number of candidates.","Digit 3: the number of things the academy judges.","Digit 4: the second digit minus the first."],answer:"3835"}},Yf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for a purpose, a reason, what a speaker admires and a main point, notice the words of praise and criticism, then use the speakers’ phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Nur, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in sport words like athlete and competition, and /b/ or /v/ as in best and vest. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about sporting heroes in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases that praise and judge sporting heroes. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group retells the most convincing answer they heard (use the wheel)."]},{id:"game",icon:"🏆",name:"The Hall of Fame",min:18,lv:"c1",group:"3 selection panels of 5",kind:"five",roles:["Chair","Questioner","Note-taker","Timekeeper","Fair-play judge"],desc:"Present, persuade, react to the news and vote: which three of eight candidates deserve a place in a sports academy’s Hall of Fame? (Book: section 6 · Game School G6)",howto:["15 students = 3 selection panels of five. All panels play at the same time with their own vote board.","Roles: chair, questioner, note-taker, timekeeper, fair-play judge (checks that every reason is about achievement, fair play or service). Rotate after each round (👥 Class → Groups of 5).","Rounds: Present 4 min · Persuade 5 min · Twist 4 min · Decide 5 min. Then each chair reads out the three plaques in 1 minute.","Before the lesson, students read the sample game “Panel Navoi” (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about one new sports activity for all students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 30, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract: a purpose, a reason, what a speaker admires or a main point.","Press **Play the podcast**. You hear four short extracts. Listen for praise (_I have huge respect for …_) and criticism (_but … is not a hero_). Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: reason, opinion, praise, example and checking meaning.","**Your turn:** listen to Nur, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is B. Mateo says some players won against all odds.","gives an answer"],["B","He mentions them, but is that who he admires most?","challenges politely"],["A","“I have huge respect for athletes who believe in fair play …”","checks the text again"],["B","So he admires the fair players most. It’s C.","paraphrases"]],checks:[["How can you tell whom a speaker admires?","listen for praise (“I have huge respect for …”, “a real role model”) and criticism (“But … is not a hero”). A speaker can mention people without admiring them."],["Which phrase does Mateo use to check meaning?","So what you mean is that …?"]]},pron:{ref:"Book: Lesson 30, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion** and **-ic**, the syllable is strong (*compeTItion*, *athLEtic*). **-ment** is never stressed (*aCHIEVEment*, *TOURnament*). *Athlete* has only **two** syllables: ATH-lete, not a-tha-lete.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /b/ or /v/?","Say **both** words. For /b/, **close both lips**, then open them with a small pop (*best*). For /v/, your **top teeth touch your bottom lip** and the air keeps flowing (*vest*). Put a finger on your lips: for /v/, your top lip should stay free.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *athlete*. How many syllables?",""],["A","Three? a-tha-lete?","a first guess"],["T","Only two: ATH-lete. Don’t add a vowel between *th* and *l*.","the teacher gives a clue"],["B","ATH-lete. And the stress is on the first part.","repeats"],["T","Great. Now *competition*.",""],["A","It ends in *-tion*, so the syllable before it: compe-*TI*-tion.","uses the rule"],["T","Yes! Now /b/ or /v/? Listen: *vote*. First or second: *boat* or *vote*?",""],["B","Second: *vote*. My teeth touch my lip, and the sound goes on.","checks the mouth"]],checks:[["Where is the stress in *achievement*?","on CHIEVE: a-CHIEVE-ment. *-ment* is never stressed."],["How many syllables are there in *athlete*?","two: ATH-lete."],["What is the difference between *best* and *vest*?","for /b/ both lips close and open; for /v/ the top teeth touch the bottom lip and the air keeps flowing."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it answers the question directly (*I’d say …*).","Follow the linking words: *First of all* (a first reason) → *Take … , for example* (an example) → *On the other hand* (the other side) → *That’s why* (a result) → *In the end* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, a hero … is a person who wins, yes, but also … good character. My coach in Hamburg … she was not famous, but … every weekend with us. So, yes, character.","Attempt 1 · 90 s · many pauses"],["leo","I’d say a true sporting hero needs talent, but also character. First of all, heroes train when nobody is watching. Take my old handball coach in Hamburg, for example: she was never famous, but she spent every weekend with us. On the other hand, some champions win at all costs. In the end, character matters most.","Attempt 2 · 60 s · linking words"],["leo","I’d say a true sporting hero needs more than talent and trophies: they need character. Heroes put in the hours when nobody is watching. My old handball coach in Hamburg never played at the top level, yet she gave us every weekend for years. Some famous champions, by contrast, win at all costs, and young fans copy them. In the end, a medal shows what you did, but a hero shows who you are.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is it more important to win or to play fair?",lines:[["nur","Of course everyone wants to win, but **it’s not all about winning**. **When it comes to fair play,** I think the best athletes are the ones who shake hands after a defeat. My badminton coach **is a real role model**: **what sets her apart is** that she never shouts at the referee. **It takes real dedication to** stay calm like that!","speaker · 1 minute"],["mateo","I heard five phrases: *It’s not all about winning*, *When it comes to fair play*, *is a real role model*, *What sets … apart is* and *It takes real dedication to*. That’s the top row: **Bingo!**","listener reports"],["nur","Five points plus three for the Bingo: eight points!","count the points"],["mateo","Next time, try *… against all odds*. It’s on my card, and it’s perfect for a comeback story.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which activity would …?*).","Click the lines in order. Each line answers the line before. Amara and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a sport for the class trip",lines:[["A","So, what shall we play on the class trip to the mountains?","opens the topic"],["B","How about volleyball? We only need a ball and a net.","an idea"],["A","Good idea, but not everyone can play. What about a team treasure hunt?","reacts + a new idea"],["B","Agreed. Everyone can join in, and it’s fun.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make three selection panels of five (👥 Class → Groups of 5). Roles: **chair**, **questioner**, **note-taker**, **timekeeper**, **fair-play judge**. After each round, the roles move one place to the left.","**Open the file:** read the clues aloud and find the 4-digit code. Then each member turns over one or two **candidate cards** and reads them. Don’t open the **secrets** until Round 3.","**Round 1 · Present (45 s per candidate):** achievement, fair play and service to the community. The questioner asks one question about each candidate.","**Round 2 · Persuade (1 min each):** champion one candidate: two reasons and a comparison with another candidate.","**Round 3 · Twist (4 min):** read the secrets. The chair opens a **news card**; the panel discusses whose case becomes stronger or weaker.","**Round 4 · Decide (5 min):** everyone votes for three candidates. The fair-play judge stops any reason about health, looks, age or origin. Click the three heroes and write a **plaque** of about ten words for each one."],exTitle:"Sample game: Panel Navoi",lines:[["","Round 1 · Present — the panel: Nur (chair), Leo (questioner), Aziza (note-taker), Mateo (timekeeper), Amara (fair-play judge)",""],["aziza","**Let me introduce** Sardor Yusupov, a kurash wrestler. **When it comes to fair play,** he’s famous for helping a beaten opponent to his feet before he celebrated.","presents a candidate"],["leo","And what does he do for the community?","the questioner"],["aziza","He **gives something back**: free training for children in his neighbourhood every Saturday.","answers"],["","Round 2 · Persuade",""],["mateo","**First and foremost,** Tomasz built a football club on an old car park, with no money at all. **Compared with** Diego, he has never won a race, but his club gives a whole neighbourhood **a sense of belonging**.","champions a candidate"],["amara","Careful, Mateo: you said Diego is “too old to be a hero”. That’s about age, not sport. Give us a sporting reason.","the fair-play judge"],["mateo","Fair enough. Diego has great results, but Tomasz has done more for other people.","corrects the reason"],["","Round 3 · Twist — the chair opens a news card: “At least one place must go to someone who has never won a medal.”",""],["nur","**In light of this,** Tomasz, Kojo and Layla all become stronger. And Tomasz’s secret, the club’s first football, mended by hand many times, says a lot about him.","the chair sums up"],["","Round 4 · Decide",""],["aziza","Results: Tomasz 4, Aiko 4, Kojo 3, Meera 2, Sardor 1, Layla 1. That’s 15 votes, so nobody is missing.","note-taker (5 members × 3 votes)"],["nur","**On balance,** our three heroes are Tomasz, Aiko and Kojo. **We have huge respect for** Meera, and we hope she is nominated again. Tomasz’s plaque: *“He built a club from nothing and gave children a team.”*","the chair explains the choice"]],checks:[["How many candidates can each panel member vote for?","three, one vote each, with a reason about achievement, fair play or service."],["What does the fair-play judge do?","stops any reason about health, looks, age or origin and asks for a sporting reason."],["What must the panel produce at the end?","three heroes and a short plaque (about ten words) for each one."]]},drills:{ref:"Book: Lesson 30 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Everyone in the country knows her name: she has become a ___.",o:["household name","good loser","sense of belonging"],a:0},{q:"He had no coach and no proper pitch, but he still won ___.",o:["at all costs","against all odds","at grassroots level"],a:1},{q:"Nobody becomes a champion by luck: you have to ___, day after day.",o:["put in the hours","give something back","reach the top"],a:0},{q:"Some players want to win ___, even if they have to break the rules.",o:["against all odds","at all costs","at grassroots level"],a:1},{q:"She lost the final, but she smiled and shook hands with the winner: she’s a ___.",o:["household name","good loser","role model"],a:1},{q:"Shaking hands with the other team after the match is part of ___.",o:["fair play","a household name","the top"],a:0},{q:"After his career, he wanted to ___ to the town where he grew up, so he opened a free club.",o:["give something back","reach the top","put in the hours"],a:0},{q:"Most coaches who work ___ are volunteers who train children for free.",o:["at grassroots level","at all costs","against all odds"],a:0},{q:"Playing in a team gives many teenagers a ___: they feel they are part of something.",o:["role model","sense of belonging","household name"],a:1},{q:"Famous athletes should ___ for young fans, on the pitch and off it.",o:["set an example","win at all costs","reach the top"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"She plays football every weekend. → **tennis**",a:"She plays tennis every weekend. (play + ball games)"},{p:"She plays tennis every weekend. → **judo**",a:"She does judo every weekend. (do + martial arts and many sports without a ball: do judo, do wrestling, do athletics)"},{p:"She does judo every weekend. → **swimming**",a:"She goes swimming every weekend. (go + -ing: go running, go cycling)"},{p:"Our team beat the champions. → **the cup**",a:"Our team won the cup. (win a match, a cup or a title; beat a person or a team)"},{p:"Our team won the cup. → **the present perfect**",a:"Our team has won the cup."},{p:"Our team has won the cup. → **a question: How many times …?**",a:"How many times has our team won the cup?"},{p:"He trains every day. → **for ten years (present perfect continuous)**",a:"He has been training every day for ten years."},{p:"He has been training every day for ten years. → **since he was a child**",a:"He has been training every day since he was a child. (for + a period, since + a starting point)"},{p:"The academy chose three heroes. → **the passive**",a:"Three heroes were chosen by the academy."},{p:"Three heroes were chosen by the academy. → **the present perfect passive**",a:"Three heroes have been chosen by the academy."},{p:"She is a good player. → **the best … I have ever …**",a:"She is the best player I have ever seen."},{p:"He is fast. → **not as … as … his brother**",a:"He isn’t as fast as his brother."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"He is a very good example for young people.",a:"He’s a genuine role model for young people."},{p:"She won even though it was very difficult.",a:"She won against all odds."},{p:"He trained very, very much.",a:"He put in the hours, year after year."},{p:"She is not only good at sport.",a:"What sets her apart is her character, not just her talent."},{p:"Winning is not the most important thing.",a:"Sport isn’t only about winning: how you win matters just as much."},{p:"He helps his town a lot.",a:"He has given a great deal back to his community."},{p:"I really like what she did.",a:"I have huge respect for what she has achieved."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ She won him in the final.",o:["She beat him in the final.","She won to him in the final.","She won against him the final."],a:0,why:"You win a match, a cup or a title; you beat a person or a team."},{q:"✗ I make sport every morning.",o:["I am making sport every morning.","I do sport every morning.","I make the sport every morning."],a:1,why:"do sport, do exercise. Make is for things you create (make a plan, make a cake)."},{q:"✗ We play in football after classes.",o:["We play the football after classes.","We play football after classes.","We are play football after classes."],a:1,why:"play + the name of the game, with no preposition and no article: play football, play chess."},{q:"✗ Our team winned the cup last year.",o:["Our team won the cup last year.","Our team has winned the cup last year.","Our team wins the cup last year."],a:0,why:"win is irregular: win – won – won."},{q:"✗ She has been training since five years.",o:["She is training since five years.","She has been training for five years.","She has been training during five years."],a:1,why:"for + a period (for five years); since + a starting point (since 2020, since she was ten)."},{q:"✗ He is a real example for following.",o:["He is a real example for follow.","He is a real role model.","He is a real model role."],a:1,why:"Say a role model, or a good example to follow."},{q:"✗ The referee showed him a yellow card because of he argued.",o:["The referee showed him a yellow card because he argued.","The referee showed him a yellow card because of argued.","The referee showed him a yellow card because of he was arguing."],a:0,why:"because + a clause (because he argued); because of + a noun (because of his behaviour)."},{q:"✗ Chess is very popular sport in many countries.",o:["Chess is very popular sports in many countries.","Chess is a very popular sport in many countries.","The chess is very popular sport in many countries."],a:1,why:"A singular countable noun needs an article: a very popular sport."}]},{title:"Stress: sport words",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"compete → noun (a race or a tournament)",o:["comPEtition","compeTItion","COMpetition"],a:1,why:"The stress moves: comPETE → compeTItion, just before -tion."},{q:"athlete → adjective",o:["ATHletic","athLEtic","athleTIC"],a:1,why:"The stress moves: ATHlete → athLEtic, just before -ic."},{q:"achieve → noun (something you did well)",o:["aCHIEVEment","ACHievement","achieveMENT"],a:0,why:"-ment is never stressed: aCHIEVE → aCHIEVEment."},{q:"dedicate → noun (hard work and commitment)",o:["DEDication","dediCAtion"],a:1,why:"The stress moves: DEDicate → dediCAtion, just before -tion."},{q:"profession → adjective",o:["proFESsional","PROfessional","professionAL"],a:0,why:"-al keeps the stress of the noun: proFESsion → proFESsional."},{q:"champion → noun (a big competition)",o:["CHAMpionship","chamPIONship"],a:0,why:"-ship does not move the stress: CHAMpion → CHAMpionship."},{q:"tournament",o:["TOURnament","tourNAment"],a:0,why:"On the first syllable; -ment is never stressed."}]}],Jf={lockStep:"Open the file",lockTitle:"Open the Hall of Fame file",lockOk:"The file is open! Go to the candidate cards.",cardsStep:"Candidates",cardsTitle:"Candidate cards",cardsHint:"Each panel member picks one or two cards: a card turns over and opens. Read it aloud, close it, and the next member picks. You will present these candidates in Round 1. Don’t press “Show: Secret” until Round 3.",backWord:"Candidate",hiddenLabel:"Secret",hiddenAll:"Show all secrets",twistTitle:"Hall of Fame news",twistHint:"The chair opens one card. The panel discusses whose case becomes stronger or weaker, and whether the list of three changes.",twistWord:"News",twistHelp:{b2:["Because of this news, … becomes stronger.","… could still be on our list, because …","I’d swap … for …"],c1:["In light of this, it might make sense to …","That puts …’s case in a different light.","When it comes to …, nobody can match …"]},voteTitle:"Hall of Fame vote board",voteHint:"Each panel member votes for three candidates (one vote each) and gives a reason about achievement, fair play or service only, never health, looks, age or origin. Count the votes with + and −, then click the three heroes. Equal votes? One more reason each, then vote again between those candidates only.",capacity:3,teamWord:"Panel",teamIcon:"",teamKind:"five",teams:3,doneText:"Now the chair reads out the three plaques and explains the choice in one minute."},Kf=[{name:"Round 1 · Present",lv:"b2",bloom:"Understand",by:"aziza",seconds:45,q:"Present your candidate to the panel: their greatest achievement, a fair-play moment, and what they do for the community. Then answer one question from the questioner.",help:{b2:["Let me introduce …, a … from …","Her greatest achievement is …","When it comes to fair play, …"],c1:["What sets … apart is …","On top of that, …","Off the pitch, … gives something back by …"]},model:"Let me introduce Sardor Yusupov, a kurash wrestler from Uzbekistan. His greatest achievement is winning the national title and, later, a medal at a big international tournament. When it comes to fair play, he’s famous for one moment: after a tough final, he helped his beaten opponent to his feet and bowed to him before he celebrated. And off the mat, he gives something back: every Saturday he runs free training for children in his neighbourhood. In short, he’s a champion in both senses of the word."},{name:"Round 2 · Persuade",lv:"b2p",bloom:"Evaluate",by:"mateo",seconds:60,q:"Champion one candidate. Give two reasons why they deserve a place, compare them with another candidate, and answer one question from the panel.",help:{b2:["First and foremost, …","Compared with …, …","That’s why I think … deserves a place."],c1:["The strongest argument for … is that …","Admittedly, …, but …","A medal belongs to one person, whereas …"]},model:"First and foremost, Tomasz built something out of nothing: a football club on an old car park, with no money and no sponsor. On top of that, he has kept it going for years, so the children in his neighbourhood have a place where they belong. Admittedly, compared with Diego, he has never won a race or a trophy. But a medal belongs to one person, whereas a club belongs to a whole community. That’s why I think Tomasz deserves a place in our Hall of Fame."},{name:"Round 3 · Twist",lv:"b2p",bloom:"Analyse",by:"amara",seconds:0,tool:"twists",q:"Read the secrets on your cards. Then the chair opens a news card: whose case becomes stronger or weaker? Does your list of three change?",help:{b2:["My candidate’s secret is that …","Because of this news, … becomes stronger.","I’d swap … for …"],c1:["In light of this, it might make sense to …","That puts …’s case in a different light.","That changes things, because …"]},model:"I’m presenting Aiko, so here’s her secret: she helped an engineer design a lighter sports wheelchair, and her club now lends it to beginners. That’s service to the community, not just another result. Now the news card says that at least one place must go to someone who has never won a medal. In light of this, Kojo, Layla and Tomasz all become stronger. I’d still keep Aiko on our list, for her titles and her work for beginners, but I’d swap Diego for Kojo."},{name:"Round 4 · Decide",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:0,tool:"decide",q:"Vote for three candidates. Justify your choice by achievement, fair play and service only, write a plaque of about ten words for each hero, and politely explain why one strong candidate must wait.",help:{b2:["We’d choose …, … and …, because …","We have huge respect for …, but …","The plaque says: “…”"],c1:["On balance, …","Taking everything into account, …","We hope … will be nominated again, because …"]},model:"On balance, our panel would choose Aiko, Kojo and Tomasz. Aiko reached the top of her sport and opened the door for beginners. Kojo showed real courage when he admitted his own mistake in public, and he trains the next generation of referees. And Tomasz proves that greatness can start on an old car park. We have huge respect for Meera, but this year her case for service was slightly weaker, so we hope she’ll be nominated again. Tomasz’s plaque says: “He built a club from nothing and gave children a team.”"}],_f=[{e:"🤼",n:"Sardor Yusupov",r:"Kurash wrestler · Uzbekistan",look:{skin:"#D9A47A",hair:"#2B1A12",style:"short",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Achievement","National kurash champion; later a medal at a big international tournament"],["Fair play","Helped his beaten opponent to his feet and bowed to him before he celebrated"],["Community","Free Saturday training for children in his neighbourhood"]],x:"He has trained as a referee and judges children’s tournaments at weekends, without pay."},{e:"🏐",n:"Inês Carvalho",r:"Volleyball coach · Portugal",look:{skin:"#E8BE98",hair:"#3A2418",style:"bun",top:"#F7C08E",bg:"#FFE4D6"},lines:[["Achievement","Took a small-town women’s team from the lowest league to the national cup final"],["Fair play","Told the referee that a point given to her own team was a mistake"],["Community","Runs free coaching courses for girls who have never played in a team"]],x:"She has written a free coaching guide that small clubs in several countries now use."},{e:"🟨",n:"Kojo Addai",r:"Football referee · Ghana",look:{skin:"#7B4A2D",hair:"#1A1210",style:"short",top:"#F7D774",bg:"#FFF3C4"},lines:[["Achievement","Refereed the final of a continental championship"],["Fair play","Admitted on television that one of his own decisions in a big match was wrong"],["Community","Trains young referees from local leagues every summer"]],x:"He can referee a match in three languages and teaches referees to explain their decisions calmly."},{e:"🎾",n:"Aiko Morita",r:"Wheelchair tennis player · Japan",look:{skin:"#F1D2B6",hair:"#1F1A1A",style:"long",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Achievement","World champion in wheelchair tennis doubles; national singles champion"],["Fair play","Called her own shot “out” when the line judge missed it, and lost the point"],["Community","Campaigns for sports halls in her city that everyone can use"]],x:"She helped an engineer design a lighter sports wheelchair that her club now lends to beginners."},{e:"🏃",n:"Diego Ramírez",r:"Marathon runner · Mexico",look:{skin:"#C98D63",hair:"#1E1511",style:"short",beard:!0,top:"#F5A9BF",bg:"#FFE1EA"},lines:[["Achievement","Won the Ravenmoor City Marathon twice and ran for his country"],["Fair play","Waited for a rival who had taken a wrong turn and showed him the way"],["Community","Leads a free Sunday run in the park for anyone who wants to join"]],x:"He still keeps the medal from his first race, a small school fun run, and says it means more than any trophy."},{e:"♟",n:"Meera Iyer",r:"Chess grandmaster · India",look:{skin:"#B98260",hair:"#1E1511",style:"long",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["Achievement","Grandmaster title; national women’s chess champion"],["Fair play","Told the arbiter that her opponent’s clock had been set wrongly, in her own favour"],["Community","Gives free online lessons to children in village schools"]],x:"She can play several games at the same time without looking at the boards."},{e:"⚽",n:"Tomasz Nowak",r:"Club founder · Poland",look:{skin:"#F1CFB0",hair:"#6B3E26",style:"short",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Achievement","Turned an empty car park into a neighbourhood football club; never won a big trophy"],["Fair play","His club’s rule: the winning team thanks the losing team first"],["Community","Children from the whole neighbourhood play there for free"]],x:"He still has the club’s first football, mended by hand many times."},{e:"🙋",n:"Layla Haddad",r:"Sports volunteer · Lebanon",look:{skin:"#E5B78F",style:"hijab",scarf:"#8ED7B8",bg:"#D6F3E7"},lines:[["Achievement","Organised the city’s youth games with a team of volunteers and no paid staff"],["Fair play","As a timekeeper, reported a timing mistake that cost her own city’s team a medal"],["Community","Started a scheme that lends sports kit to families who cannot afford it"]],x:"She speaks four languages and has trained volunteers at international events."}],$f=[{t:"New rule from the academy: from this year, at least one of the three places must go to someone who has never won a medal: a coach, a referee, a volunteer or a club founder.",q:"Who are the strongest candidates now? Does this rule make the Hall of Fame fairer?",by:"nur",m:"I think it’s a brilliant rule, because sport doesn’t run on champions alone. Without referees, volunteers and coaches, there would be no matches at all. Now Kojo, Layla, Inês and Tomasz are all in the race. For me, Tomasz has the strongest case: he built a club out of nothing. Some people might say the rule lowers the standard, but I’d argue it widens the idea of greatness."},{t:"A sponsor offers to pay for the whole ceremony, but only if the panel chooses the three most famous candidates.",q:"Would you accept the offer? What would you say to the sponsor?",by:"leo",m:"Hold on: a Hall of Fame that can be bought isn’t a Hall of Fame. If we accept, every future choice will look like a business deal. I’d thank the sponsor politely and explain that our panel judges achievement, fair play and service, not fame. We could offer them another way to help, for example paying for kit for Layla’s scheme. A simpler ceremony is a small price for an honest decision."},{t:"A newspaper writes: “Chess is a game, not a sport. It has no place in a sports Hall of Fame.”",q:"Do you agree? What makes something a sport?",by:"mateo",m:"I see why some people say that, because chess players don’t run or jump. But think about what a sport needs: years of training, rules, referees, competition and enormous pressure. Chess has all of these, and a long tournament can be exhausting. So I’d say chess is a sport of the mind. Whether Meera gets a place should depend on her achievement, fair play and service, not on the kind of sport she plays."},{t:"A letter from the academy’s young athletes: “We don’t need more trophies on a shelf. We need heroes who can teach us something.”",q:"Which candidates could teach young athletes the most, and what would they teach?",by:"aziza",m:"That letter really moved me. If I had to choose, I’d say Kojo could teach them how to admit a mistake, which is harder than winning. Inês could teach them that a small team can go a long way. And Sardor could show them that you can be tough on the mat and kind off it. Trophies tell you what someone did; these people can show you how to do it."},{t:"Good news: the city will name its new sports hall after one of your three heroes.",q:"Whose name should go on the building, and why? What message would it send to the children who train there?",by:"amara",m:"For me, it has to be the hero whose story fits a building full of beginners. I’d go for Aiko: she reached the top of her sport and then fought for halls that everyone can use, so her name on the door would say “this place is for you, whoever you are”. Every child who walks in would see that a champion is someone who opens doors for others."}],ep=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why should young people do sport?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** sport is one of the best things young people can do, and not only because it keeps them fit."],["Point","**The main reason is that** sport teaches skills you can’t learn from books: teamwork, discipline and how to lose well."],["Example","**For example,** in my neighbourhood in Navoi, a free football club keeps lots of teenagers busy after school, and they have made friends for life."],["Close","**So, all things considered,** every young person should find a sport they enjoy, even if they never win a medal."]],keys:["in my view","teamwork and discipline","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"What makes a true sporting hero?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say a true sporting hero needs more than talent and trophies: they need **character** as well."],["","**First of all,** heroes put in the hours when nobody is watching, so their success is earned, not given."],["","**Take** my old handball coach in Hamburg, **for example:** she never played at the top level, yet she gave us every weekend for years."],["","**On the other hand,** some famous champions win at all costs, and young fans copy what they see."],["","**That’s why** fair play matters just as much as winning: a hero shows us how to lose well, too."],["","**In the end,** a medal shows what you did, but a hero shows who you are."]],keys:["more than talent","put in the hours","on the other hand","in the end"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Do top athletes deserve their huge salaries?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think top athletes deserve to be well paid, but not at any price."],["","To begin with, they put in years of hard work, and most careers in sport are short."],["","On top of that, they inspire children everywhere: back home in Lagos, kids play football on any empty piece of land."],["","That said, nurses and teachers also work hard, and they rarely become household names."],["","This is why I find the gap between top sport and ordinary jobs hard to accept."],["","So, in a nutshell, high pay is fair only if some of it goes back into sport at grassroots level."]],extra:"My neighbour has just painted his front door a cheerful shade of yellow.",keys:["not at any price","household names","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it more important to win or to play fair?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I believe playing fair matters more, although every athlete wants to win."],["The main reason is that","a victory won by cheating isn’t really a victory at all."],["For instance,","back home in Brazil, many children learn football in the street, where the only referee is their own sense of fair play."],["Having said that,","professional athletes are under huge pressure to win, so the temptation to cheat is real."],["That’s why","clubs and coaches need to reward fair play, not just results."],["Ultimately,","people forget the score, but they remember how you played."]],distractors:["In contrast,","Meanwhile,"],keys:["playing fair matters more","isn’t really a victory","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"Should mind sports like chess count as real sports?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["yes, in my view","training, rules, pressure","for instance","my cousin’s school chess team","a sport of the mind"],model:"Yes, in my view they should. A sport isn’t only about muscles: it’s about training, rules, competition and pressure, and chess has all of these. For instance, my cousin’s school chess team in Kuala Lumpur trains several times a week, studies its opponents and travels to tournaments, just like the football team. After a long game, the players are as tired as any runner. Of course, chess is very different from boxing or swimming, but I’d call it a sport of the mind, and its champions deserve the same respect."}],tp={title:"Exam Part 2 practice: one new sports activity for all students",situation:"Your university can start one new sports activity that is open to all students: a five-a-side football league, a morning running club, or a chess and table-tennis club. Amara and Leo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"amara",B:"leo",lines:[["A","So, which activity would bring most students together? Shall we start with football?"],["B","Sure. Lots of students love it, but it would mostly attract good players, wouldn’t it?"],["A","True. So you’re saying beginners might feel left out?"],["B","Exactly. The running club, on the other hand, is open to everyone, whatever their level."],["A","I see your point, but getting up early is hard. In winter, hardly anyone would come."],["B","That’s a fair point. What about the chess and table-tennis club? Anyone can join in."],["A","I like that. And it’s easy to make friends over a game, isn’t it?"],["B","Absolutely. So, shall we go for the chess and table-tennis club, and try football next term?"],["A","Agreed. That way, nobody feels that sport is only for the sporty ones."]],phrases:{Start:["Shall we start with …?","Which activity would … the most?"],Clarify:["So you’re saying (that) …?","Exactly. …"],"Give the turn":["…, wouldn’t it?","…, isn’t it?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your mahalla wants to bring neighbours together through sport this summer. Choose **one** idea: a Saturday football match for all ages, a family walking club, or a chess corner in the local park. Discuss for 2 minutes and decide together.",seconds:120}},np={cards:{A:["It’s not all about winning.","When it comes to fair play, …","… is a real role model.","What sets … apart is …","It takes real dedication to …","… against all odds.","… gave something back to …","I have huge respect for …","In the long run, …"],B:["… set an example for …","… against all odds.","It’s not all about winning.","I have huge respect for …","… is a real role model.","It takes real dedication to …","Win or lose, …","What sets … apart is …","When it comes to fair play, …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["It’s not all about winning.","When it comes to fair play, …","… is a real role model.","What sets … apart is …","It takes real dedication to …","… against all odds.","… gave something back to …","I have huge respect for …","In the long run, …","… set an example for …","Win or lose, …"],questions:["Who is a sporting hero for you, and why?","Which sports are popular in Uzbekistan? Why do you think so?","Is it more important to win or to play fair?","Should chess count as a sport? Why (not)?","What can a local coach or volunteer give to a community?","Should famous athletes be role models, or is it enough to be good at their sport?"]},rp=[{type:"stress",title:"Stress Spot: sport words",intro:"Tap the stressed syllable. Rules: before -tion and -ic, the syllable is strong (compeTItion, athLEtic). -ment is never stressed (aCHIEVEment, TOURnament). Athlete has two syllables: ATH-lete, not a-tha-lete. Then listen and say the word.",follow:"Now use two of these words in one sentence about a sport you like.",items:[{w:"athlete",syl:["ath","lete"],s:0},{w:"athletic",syl:["ath","let","ic"],s:1},{w:"champion",syl:["cham","pi","on"],s:0},{w:"competition",syl:["com","pe","ti","tion"],s:2},{w:"professional",syl:["pro","fes","sion","al"],s:1},{w:"achievement",syl:["a","chieve","ment"],s:1},{w:"dedication",syl:["ded","i","ca","tion"],s:2},{w:"tournament",syl:["tour","na","ment"],s:0}]},{type:"pairs",title:"Sound Pairs: /b/ or /v/?",intro:"Press Play and choose the word you hear. For /b/, close both lips, then open them with a small pop (best, ban, boat). For /v/, your top teeth touch your bottom lip and the air keeps flowing (vest, van, vote). In Uzbek, v is often made with both lips, so some speakers’ English /v/ can sound close to /b/ or /w/: check with a finger on your top lip. Partner version: one student says a word, the partner points to it.",pairs:[["best","vest"],["ban","van"],["bet","vet"],["boat","vote"],["berry","very"]]}],sp=["Use two C1 phrases from the Phrase Bank in your next answer.","Ask the last speaker a follow-up question about fair play.","Name one thing the last candidate gave back to their community.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last two speakers in 20 seconds, without the words “good” or “best”."],op={title:"Step Up Speaking Club: More Than a Medal",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Mateo and Aziza talk about sporting heroes: the footballers Mateo admired as a boy in Recife, Aziza’s cousin who coaches kurash for free, fair play and the volunteers who keep local sport going. Each extract is a different situation.",tip:["Listen for praise and criticism","Questions often ask what a speaker admires. Praise: *I have huge respect for*, *a real role model*. Criticism: *but … is not a hero*, *the problem is*. A speaker can mention people without admiring them, so notice which side the words are on."],A:"mateo",B:"aziza",lines:[["A","*Extract 1.* Hi Aziza, it’s Mateo. For Friday’s club evening on sporting heroes, could you tell everyone about your cousin and his kurash classes? And please bring a photo! When I was a boy in Recife, my heroes were the **household names** on television. Now I’m far more interested in people like him."],["B","*Extract 2.* My cousin coaches kurash, a traditional kind of wrestling, for children in our neighbourhood, and he does it for free. Why? [[0]] a volunteer coach once did the same for him, and now he wants to **give something back**. For the children, he’s a real **role model**: he **sets an example** every single week."],["A","*Extract 3.* Don’t get me wrong: many famous players **reached the top** after years of **putting in the hours**, and a few won **against all odds**. But [[1]] a player who wants to **win at all costs** is not a hero. [[2]] athletes who believe in **fair play**: they shake hands after a defeat, and each of them is **a good loser** as well as a good winner."],["B","*Extract 4.* Leo told us about the volunteers who run sport **at grassroots level** in Germany. [[3]] his old handball club in Hamburg: the coach, the referee, even the person who washed the shirts were all volunteers. Without people like them, many children would never feel **a sense of belonging** to a team."],["A","[[4]] the real heroes are the people nobody sees on television?"],["B","Exactly. Medals are wonderful, but the true heroes are the people who make sport possible for everyone."]],gaps:[[1,"Mainly because"],[2,"I’d say that"],[3,"I have huge respect for"],[4,"Just look at"],[5,"So what you mean is that"]],questions:[{q:"Extract 1. Why is Mateo calling Aziza?",o:["to tell her about his childhood heroes in Recife","to ask her to talk about her cousin at the club evening","to invite her cousin to teach kurash at the club"],a:1,why:"“For Friday’s club evening on sporting heroes, could you tell everyone about your cousin and his kurash classes?”"},{q:"Extract 2. Why does Aziza’s cousin coach children for free?",o:["because he wants to help others, as someone once helped him","because the children’s families cannot pay","because he hopes to become a household name"],a:0,why:"“Mainly because a volunteer coach once did the same for him, and now he wants to give something back.”"},{q:"Extract 3. Which athletes does Mateo admire most?",o:["the ones who have reached the top","the ones who won against all odds","the ones who play fair and lose well"],a:2,why:"“I have huge respect for athletes who believe in fair play: they shake hands after a defeat …” He mentions the others, but this is his praise."},{q:"Extract 4. What is Aziza’s main point?",o:["Volunteers in sport should be paid for their work.","The people who keep local sport going are true heroes.","Children in Germany play more sport than children elsewhere."],a:1,why:"“Medals are wonderful, but the true heroes are the people who make sport possible for everyone.”"}],notice:{q:"Look at phrases 1–5. Which one gives a reason, an opinion, an example? Which one does Mateo use to praise people, and which one to check meaning?",groups:[["Reason",[1]],["Opinion",[2]],["Praise",[3]],["Example",[4]],["Checking meaning",[5]]]},use:{q:"Should volunteers in local sport get more public recognition? Why or why not?",by:"nur",model:"I’d say that they should, and not only with a thank-you at the end of the season. Mainly because without them, many children would never join a team. Just look at the badminton club near my home in Kuala Lumpur: two retired teachers have run it every Saturday for years, and hardly anyone outside the neighbourhood knows their names. I have huge respect for people like them. So, all in all, a small award or a story in the local news would be an easy way to say thank you.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},lp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:np,CARDS:_f,DEMOS:Uf,DIALOGUE:tp,DRILLS:Gf,LESSON:Yf,LEVELS:ep,LISTEN:op,MAIN:Jf,PRON:rp,ROUNDS:Kf,TWISTS:$f,UNIT:Zf,WILDCARDS:sp},Symbol.toStringTag,{value:"Module"})),ip={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/
