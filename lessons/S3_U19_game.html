ers the jury’s questions.","There is one condition: the tool must help people **learn to do things themselves**, not do the work for them. From Navoi to Lagos and Kuala Lumpur, teachers are asking the same question: can AI make us smarter without making us **dependent**? The jury judges three things: **real benefit**, **risks and safeguards**, and **human growth**."],rule:"Rule of respect: we judge ideas, never people. No pitch is about anyone’s health, looks or origin, and we use no real company or product names."}},Uf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A short talk from the Club (exam Part 2): listen for a detail, the speaker’s problem, why she mentions someone and her main message, notice how she moves from a problem to a solution, then use her phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Aziza, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about learning and development, and /ɜː/ or /ɑː/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about AI and learning in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for weighing up technology and learning. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group retells the most balanced answer they heard (use the wheel)."]},{id:"game",icon:"💡",name:"The Learning Lab",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Presenter","Designer","Safety checker","Timekeeper","Jury speaker"],desc:"A pitch room: design a responsible AI tool that helps people learn a skill without making them dependent, pitch it in one minute and answer the jury’s questions. (Book: section 6 · Game School: Pitch Room)",howto:["15 students = 3 teams of five (👥 Class → Groups of 5). Roles: Presenter, Designer, Safety checker, Timekeeper, Jury speaker.","Round 1: all teams design at the same time. Rounds 2 and 3 go team by team: Team A pitches and answers two questions from the other teams’ jury speakers; then Team B; then Team C.","Timing: cards and Design 4 min · Pitch 1 min per team · Jury questions 2 min per team · Score 3 min. Next lesson, rotate the roles.","Before the lesson, students read the sample game (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping students to write better, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Zf={listen:{ref:"Book: Lesson 19, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: a detail, Amara’s problem, why she mentions Aziza’s cousin, and her main message.","Press **Play the podcast**. Listen for the problem and the solution: _The problem was that …_ and _So now I have a rule …_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Amara said; tap a line to hear it again.","Sort the five phrases: describing a problem, example, opinion, reason and summing up.","**Your turn:** listen to Aziza, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 1 is A. The app writes her essays.","gives an answer"],["B","Is that what she likes about it? Listen to the beginning again.","challenges politely"],["A","“It gives me instant feedback on my essays … at my own pace.”","checks the text again"],["B","So it helps her, but it doesn’t write for her. It’s B.","paraphrases"]],checks:[["How do many talks move from a problem to a solution?","the speaker says what went wrong (“The problem was that …”), then what helped, then what she does now (“So now I have a rule …”). Questions often test each step."],["Which phrase does Amara use to sum up her view?","It all comes down to …"]]},pron:{ref:"Book: Lesson 19, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: in words ending in **-tion**, **-ity** and **-cial**, the syllable **just before** the ending is strong (*eduCAtion*, *creaTIVity*, *artiFIcial*). Endings like **-ment** and **-ent** are never stressed (*deVELopment*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɜː/ or /ɑː/?","Say **both** words. /ɜː/ is long, with relaxed lips and the mouth only a little open (*heard*). /ɑː/ is long, with the mouth wide open (*hard*). In British English, the *r* in both words is silent.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *development*. Which syllable is strong?",""],["A","*DE*? The first one?","a first guess"],["T","Not quite. Think of the verb: de-*VEL*-op. The noun keeps the same stress.","the teacher gives a clue"],["B","de-*VEL*-op-ment! And the ending *-ment* is never stressed.","uses the rule"],["T","Great. Now *curiosity*.",""],["A","It ends in *-ity*, so the syllable before it: curi-*OS*-ity.","uses the rule"],["T","Yes! Now /ɜː/ or /ɑː/? Listen: *firm*. First or second: *firm* or *farm*?",""],["B","First: *firm*. My mouth is only a little open.","checks the mouth"]],checks:[["Where is the stress in *education*?","on CA: ed-u-CA-tion, just before *-tion*."],["Where is the stress in *knowledge*?","on the first syllable: KNOW-ledge, said /ˈnɒlɪdʒ/."],["What is the difference between *heard* and *hard*?","both are long; for *heard* (/ɜː/) the lips are relaxed and the mouth only a little open; for *hard* (/ɑː/) the mouth is wide open."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it answers the question directly (*I’d say …*).","Follow the linking words: *To begin with* (a first reason) → *Take my own case* (an example) → *On the other hand* (the other side) → *This is why* (a result) → *All in all* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, I think … smarter, maybe … because it explains things … For example, my statistics … But some people copy, so … lazier? So, both.","Attempt 1 · 90 s · many pauses"],["leo","I’d say it can make us smarter, as long as we don’t let it think for us. To begin with, it can explain a hard idea in many ways. Take my own case: it helped me with statistics late at night. On the other hand, if you let it write every essay, you learn nothing. All in all, it’s a good assistant, not a replacement.","Attempt 2 · 60 s · linking words"],["leo","I’d say it can make us smarter, as long as we stay in the driving seat. An AI tutor can explain a tricky idea from several angles, and in my case it rescued my statistics course at two in the morning. That said, a student who hands every essay to a machine practises nothing but copying. All in all, it’s a brilliant assistant but a poor substitute for our own effort.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How do you use technology to learn, and does it really help?",lines:[["mateo","I use a translation app every day, and honestly, **it’s a double-edged sword**. **It saves a lot of time, but** I don’t always remember the words afterwards. **I learn best when** I make mistakes and fix them myself. So for grammar, **I’d rather work it out myself**. **It all depends on how you use it**, really!","speaker · 1 minute"],["amara","I heard five phrases: *It’s a double-edged sword*, *It saves a lot of time, but*, *I learn best when*, *I’d rather work it out myself* and *It all depends on how you use it*. That’s a full row: **Bingo!**","listener reports"],["mateo","Five points plus three for the Bingo: eight points!","count the points"],["amara","Next time, try *It’s no substitute for …*. It’s on my card, and it’s a great C1 phrase.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which idea would help … most?*).","Click the lines in order. Each line answers the line before. Nur and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: choosing a study app for the group",lines:[["A","So, should our group use the new vocabulary app this term?","opens the topic"],["B","Maybe. It’s quick, but won’t we just tap answers without thinking?","a doubt"],["A","Fair point. What if we use it at home, but test each other in class?","reacts + a new idea"],["B","Agreed. The app for practice, people for the real test.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School · Pitch Room · section 6",steps:["Make teams of five: **Presenter, Designer, Safety checker, Timekeeper, Jury speaker** (👥 Class → Groups of 5).","**Challenge cards:** the presenter turns over one card. Read the learners, the skill and the danger to avoid. Then open **Your resource**: only your team should hear it.","**Round 1 · Design (4 min):** who does the tool help, what does it do, which **safeguard** stops learners depending on it, and how will they manage **without it** at the end? The designer writes the design in four lines. The safety checker looks for weak points.","**Round 2 · Pitch (1 min per team):** the presenter pitches: the need → our tool → how it keeps learners in charge → why it matters.","**Round 3 · Jury questions (2 min per team):** the jury speakers of the other teams open two question cards and ask them. Everyone in the pitching team can answer.","**Round 4 · Score (3 min):** each team scores the other teams 0–5 for **real benefit**, **risks and safeguards** and **human growth**, plus one star and one wish. A team never scores itself."],exTitle:"Sample game: Team Navoi",lines:[["","Presenter Nur · Designer Mateo · Safety checker Leo · Timekeeper Aziza · Jury speaker Amara",""],["aziza","Round 1: four minutes to design. Nur, turn over our challenge card.","timekeeper opens the round"],["nur","It’s **The essay wall**: first-year students find academic essays in English hard. The danger: a tool that simply writes the essays for them. Our resource: two teachers from the writing centre can give one hour a week. **What if technology could help here** without doing the work?","presenter reads the card"],["mateo","**Picture this:** the student writes a paragraph, and instead of correcting it, the tool asks three questions. Is your main idea clear? Where is your example? Which word could be stronger?","designer suggests how it works"],["leo","**Hold on, what’s the evidence** that questions are enough? Some students will just ask it for the answer.","safety checker finds the weak point"],["mateo","Fair point. So it never rewrites a sentence, and every week the writing-centre teachers check a sample of its feedback.","designer adds a safeguard"],["mateo","(writes) Who: first-year students. What: Essay Coach asks questions about your paragraph. Safeguard: it never rewrites; teachers check its feedback weekly. Without it: by the summer, students plan essays alone.","designer writes four lines"],["aziza","Time’s up! Round 2: one minute, Nur. Go!","timekeeper"],["nur","**Have you ever** handed in an essay and got back only a mark? **What we’re proposing is** Essay Coach: a tool that asks you questions about your writing but never writes for you. **It keeps the learner in the driving seat**, and real teachers check its feedback every week. By the summer, students won’t need it, **and that’s the whole point!**","presenter · 1 minute"],["","Round 3 · Jury questions: Team B’s jury speaker opens a card and asks, “What will your tool do if it gives wrong information?”",""],["leo","**That’s a fair concern.** That’s exactly why the teachers check its feedback, and every comment has a button: *I think this is wrong*. Students learn to question the machine, too.","the team answers"],["amara","And now it’s our turn to ask Team B: **What data does your tool collect, and who can see it?**","our jury speaker asks the next team"],["","Team B’s score for Team Navoi: Real benefit 5 · Risks and safeguards 4 · Human growth 5. Star: the tool asks instead of answering. Wish: say how you will know that students really improved.",""]],checks:[["What does the designer write in Round 1?","the design in four lines: who it helps, what it does, one safeguard, and how learners will manage without it."],["Who asks the questions in Round 3?","the jury speakers of the other teams."],["What are the three criteria?","real benefit, risks and safeguards, and human growth; a team never scores itself."]]},drills:{ref:"Book: Lesson 19 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"AI in education has clear benefits and real dangers: it’s a ___.",o:["double-edged sword","driving seat","heavy lifting"],a:0},{q:"The app marks my answers the moment I finish, so I get ___.",o:["lifelong learning","instant feedback","hands-on practice"],a:1},{q:"With an online course, you can study ___ and go slowly when a topic is hard.",o:["at your own pace","in the driving seat","for yourself"],a:0},{q:"If the tool writes the whole essay, it is doing ___, not you.",o:["the heavy lifting","the shortcuts","the facts"],a:0},{q:"He finished the report in an hour because he ___: he skipped all the reading.",o:["checked the facts","cut corners","developed a skill"],a:1},{q:"A good teacher doesn’t just give you the answer; she teaches you to ___.",o:["rely too heavily","think for yourself","cut corners"],a:1},{q:"You can’t learn to cook from videos alone: you need ___ in a real kitchen.",o:["instant feedback","hands-on practice","lifelong learning"],a:1},{q:"AI tools sometimes invent things, so always ___ before you use them.",o:["double-check the facts","stay in the driving seat","do the heavy lifting"],a:0},{q:"Use the app for practice, but don’t ___ it: try each task alone first.",o:["develop","double-check","rely too heavily on"],a:2},{q:"Let the tool suggest ideas, but make the final decisions yourself: stay ___.",o:["at your own pace","in the driving seat","in the heavy lifting"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"AI helps me practise speaking. → **She**",a:"AI helps her practise speaking."},{p:"AI helps her practise speaking. → **a negative**",a:"AI doesn’t help her practise speaking."},{p:"The app makes me think. → **The teacher … us**",a:"The teacher makes us think. (make + person + verb, without to!)"},{p:"The teacher makes us think. → **a question: Does …?**",a:"Does the teacher make us think?"},{p:"The essays are checked by AI. → **the past**",a:"The essays were checked by AI."},{p:"The essays were checked by AI. → **the present perfect**",a:"The essays have been checked by AI."},{p:"The essays have been checked by AI. → **a question**",a:"Have the essays been checked by AI?"},{p:"If students use AI wisely, they will learn more. → **an unreal situation: If students used …**",a:"If students used AI wisely, they would learn more."},{p:"If students used AI wisely, they would learn more. → **the past: If students had used …**",a:"If students had used AI wisely, they would have learned more."},{p:"I should check the facts. → **the past: should have …**",a:"I should have checked the facts."},{p:"I rely on AI too much. → **He**",a:"He relies on AI too much. (rely on, not rely to!)"},{p:"He relies on AI too much. → **used to**",a:"He used to rely on AI too much."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"AI is good and bad.",a:"AI is a double-edged sword."},{p:"The app does the hard part for me.",a:"The app does the heavy lifting for me."},{p:"I want to find the answer myself.",a:"I’d rather work it out for myself."},{p:"It depends how you use it.",a:"It all comes down to how you use it."},{p:"A machine can’t do what a teacher does.",a:"A machine is no substitute for a good teacher."},{p:"Maybe students will stop thinking.",a:"There’s a real risk that students will stop thinking for themselves."},{p:"I’m not sure if AI is good for learning.",a:"I’m in two minds about AI in education."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ Technology makes us to think less.",o:["Technology makes us thinking less.","Technology makes us think less.","Technology makes to us think less."],a:1,why:"make + person + verb without to: It makes us think. (But: We are made to think.)"},{q:"✗ The app gives me many advices.",o:["The app gives me a lot of advice.","The app gives me many advice.","The app gives me an advices."],a:0,why:"Advice is uncountable: a lot of advice, some advice, a piece of advice."},{q:"✗ A machine can never replace to a teacher.",o:["A machine can never replace with a teacher.","A machine can never replace a teacher.","A machine can never be replace a teacher."],a:1,why:"replace somebody or something (no preposition)"},{q:"✗ I have too many homeworks this week.",o:["I have too much homework this week.","I have too many homework this week.","I have too much homeworks this week."],a:0,why:"Homework is uncountable: too much homework, a lot of homework."},{q:"✗ She is very good in maths.",o:["She is very good on maths.","She is very good at maths.","She is very good with maths."],a:1,why:"good at + a subject or skill: good at maths, good at explaining"},{q:"✗ In the future, machines will can think like people.",o:["In the future, machines will be able to think like people.","In the future, machines can will think like people.","In the future, machines will can to think like people."],a:0,why:"will + can is impossible: use will be able to."},{q:"✗ With AI, learning becomes more faster.",o:["With AI, learning becomes most faster.","With AI, learning becomes much faster.","With AI, learning becomes more fast."],a:1,why:"faster is already a comparative: much faster, not more faster."},{q:"✗ If you want to speak well, you should make more practice.",o:["If you want to speak well, you should do more practice.","If you want to speak well, you should take more practice.","If you want to speak well, you should make more practise."],a:0,why:"do practice (noun) or practise more (verb); in British English the noun is practice and the verb is practise."}]},{title:"Stress: words about learning and development",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"the process of growing and becoming more advanced",o:["DEvelopment","deVELopment"],a:1,why:"The ending -ment is never stressed."},{q:"teaching and learning, especially at school or university",o:["eduCAtion","EDucation"],a:0,why:"-tion words stress the syllable just before -tion."},{q:"made by people, not natural (as in AI)",o:["ARtificial","artiFIcial"],a:1,why:"-cial words stress the syllable just before -cial."},{q:"the wish to know and learn about things",o:["CUriosity","curiOSity"],a:1,why:"-ity words stress the syllable just before -ity."},{q:"machines, computers and the knowledge behind them",o:["techNOLogy","TECHnology"],a:0,why:"-ology words stress -ol-: techNOLogy, biOLogy."},{q:"what you know and understand",o:["knowLEDGE","KNOWledge"],a:1,why:"Said /ˈnɒlɪdʒ/: the k is silent and the stress is on the first syllable."},{q:"able to do things without help from others",o:["indePENdent","INdependent"],a:0,why:"The ending -ent is never stressed."}]}],Gf={cardsStep:"Challenge cards",cardsTitle:"Challenge cards",cardsHint:"Each team’s presenter picks one card: it turns over and opens. Read the learners, the skill and the danger to avoid aloud to your team. Then open “Your resource”: only your team should hear it. Close the card, and the next team picks.",backWord:"Challenge",hiddenLabel:"Your resource",hiddenAll:"Show all resources",questionWord:"Question",questionTitle:"Jury question cards",questionHint:"Jury speakers of the other teams: open one card each and ask the question. The pitching team answers together; the presenter starts.",questionHelp:{b2:["That’s a good question. Our tool …","If that happens, …","To be honest, we haven’t solved that yet, but …"],c1:["That’s a fair concern, and …","We’ve built in a safeguard: …","In the long run, we’d expect learners to …"]},scoreTitle:"Jury score board",scoreHint:"Each team scores the other teams, never itself. Agree on 0–5 points for each criterion, then give one star and one wish.",scoreCriteria:["Real benefit","Risks and safeguards","Human growth"],teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Design",lv:"b2p",bloom:"Apply / Create",by:"aziza",seconds:180,q:"Read your challenge card and your resource. Design your AI learning tool in four lines: **who** it helps, **what** it does, **one safeguard** that stops learners depending on it, and **how learners will manage without it** at the end. Use your resource!",help:{b2:["Our tool is called …, and it helps …","It will …, but it will never …","By the end, learners will be able to … on their own."],c1:["The idea is to … so that learners …","To make sure nobody becomes over-reliant on it, …","The human side of it is …"]},model:"Let’s break it down step by step. Our tool is called Water Wise, and it helps young farmers in a village near Bukhara to plan how much to water their fields. Farmers take a photo of a field, and the tool asks what they notice before it gives any advice. To make sure nobody becomes over-reliant on it, every piece of advice comes with a reason, and once a month the agronomist walks through the fields with the farmers and checks it. By the end of the season, they should be able to make a watering plan on their own."},{name:"Round 2 · Pitch",lv:"b2p",bloom:"Create",by:"mateo",seconds:60,q:"Presenter: pitch your tool to the jury in **one minute**: the need → our tool → how it keeps learners in charge → why it matters. End with one sentence the jury will remember.",help:{b2:["Have you ever …?","Our tool is simple: …","It helps people … without …"],c1:["Picture this: …","What we’re proposing is …","It keeps the learner in the driving seat, because …"]},model:"Picture this: you’re a new international student in Navoi. Your translation app can order your lunch, but it can’t make you a single friend. What we’re proposing is Talk Bridge: an AI tool that gets you ready for real conversations in Uzbek. Every evening, it practises one everyday situation with you, like buying fruit or asking for directions. Every weekend, a volunteer from the student club takes you to the bazaar to try it for real. The app gets you ready; people do the rest. Talk Bridge: practise with a machine, connect with people!"},{name:"Round 3 · Jury questions",lv:"b2p",bloom:"Evaluate",by:"leo",seconds:0,tool:"questions",q:"Jury speakers from the other teams: open two question cards and ask them. The pitching team answers together, with a reason and a real detail from the design.",help:{b2:["That’s a good question. Our tool …","If that happens, …","To be honest, we haven’t solved that yet, but …"],c1:["That’s a fair concern, and …","We’ve built in a safeguard: …","In the long run, we’d expect learners to …"]},model:"Hold on, that’s a fair concern, and we’ve thought about it. If the internet goes down, the learners still have their notebooks, because the tool asks them to write every new rule in their own words. In fact, that’s our test: once a month, they do one task with no tool at all. If they can’t manage, we know the tool is doing too much, and we change it. In the long run, we’d expect learners to need it less and less."},{name:"Round 4 · Score",lv:"c1",bloom:"Evaluate",by:"nur",seconds:0,tool:"score",q:"Jury: give each of the other teams 0–5 points for each criterion: **real benefit**, **risks and safeguards** and **human growth**. Then give one star (something good) and one wish (something to improve). Which tool would you fund?",help:{b2:["We’d give … points for …, because …","One thing we liked was …","Next time, you could …"],c1:["What stood out for us was …","The strongest safeguard was …","To make it even better, we’d suggest …"]},model:"What stood out for us was Team C’s tool for the Code Club. The benefit is real: students get help on Saturdays, when no teacher is there, so we’d give five points. Their safeguard was clever: the tool explains what is wrong with the code but never writes it, so four points for risks and safeguards. For human growth, we’d give four, because the students still present their projects to each other, but they could say more about the people involved. To make it even better, we’d suggest one session a month with no tool at all."}],_f=[{e:"📝",n:"The essay wall",r:"First-year students, Navoi",lines:[["The learners","First-year students of English at a university in Navoi."],["The skill","Planning and writing academic essays in English."],["The danger","A tool that simply writes the essays, so students never learn to do it themselves."]],x:"Two teachers from the writing centre can give one hour a week to check your tool’s feedback."},{e:"🗣",n:"Nobody to talk to",r:"A college in a small town",lines:[["The learners","Students of English at a college in a small town far from the big cities."],["The skill","Speaking English with confidence."],["The danger","Students talk only to a machine and never to real people."]],x:"A partner university in Malaysia agrees to one online speaking exchange a month."},{e:"💧",n:"Every drop counts",r:"A village near Bukhara",lines:[["The learners","Young farmers in a village near Bukhara."],["The skill","Planning how much and when to water their fields."],["The danger","Farmers follow the app’s advice without understanding their own land."]],x:"An experienced agronomist (a farming expert) can visit the village once a month."},{e:"💻",n:"Code Club",r:"A technical college",lines:[["The learners","Students in the programming club of a technical college."],["The skill","Writing and fixing simple computer programs."],["The danger","Students copy code from AI without understanding how it works."]],x:"The computer lab is free every Saturday, but the club has no teacher on Saturdays."},{e:"🧵",n:"The suzani circle",r:"A mahalla in Navoi",lines:[["The learners","Young people in a mahalla who want to learn suzani embroidery."],["The skill","Designing and stitching traditional suzani patterns."],["The danger","The tool designs every pattern, and the craft loses its human touch."]],x:"Two master embroiderers in the mahalla will teach on Sunday mornings."},{e:"💼",n:"The interview",r:"Final-year students",lines:[["The learners","Final-year students preparing for job interviews in English."],["The skill","Answering interview questions clearly and naturally."],["The danger","Students learn perfect AI answers by heart and sound like robots."]],x:"Managers from three local companies will run practice interviews once a term."},{e:"🍎",n:"New teachers",r:"Village schools",lines:[["The learners","Newly qualified teachers in village schools across the region."],["The skill","Planning lively, creative lessons."],["The danger","Every teacher uses the same machine-made lessons, and nobody is creative any more."]],x:"Experienced teachers in the city can mentor them by video call once a week."},{e:"🧭",n:"Learning Uzbek",r:"International students",lines:[["The learners","International students who have just arrived at a university in Navoi."],["The skill","Everyday Uzbek for shopping, travelling and making friends."],["The danger","Students use a translation app for everything and never talk to local people."]],x:"The student volunteer club will take newcomers to the bazaar every weekend."}],$f=[{t:"Without the tool",q:"What happens if learners can’t use your tool one day? Will they still have the skill?",by:"leo",m:"Hold on, that’s exactly the question we asked ourselves. Our tool gets quieter over time: in the first month it gives a hint for every task, and by the third month it only checks the final answer. Every few weeks, learners do one task with no tool at all. If they can do it alone, the tool has done its job."},{t:"Wrong answers",q:"What will your tool do if it gives wrong information?",by:"amara",m:"Let me give you a real example. Last term, an AI tool gave me a historical date that was simply wrong, and I only noticed because my lecturer did. So our tool shows where its information comes from, and learners check one fact in every session. A mentor also reviews its answers every week. Wrong answers will happen, but our learners will learn to catch them."},{t:"Privacy",q:"What data does your tool collect, and who can see it?",by:"nur",m:"What if the tool collected almost nothing? Learners use a nickname, not their full name, and their work stays on their own phone unless they choose to share it. Only their teacher or mentor can see their progress, and only with their permission. We’ll explain all of this in simple words on the very first screen."},{t:"The human role",q:"What will teachers or mentors still do if your tool exists?",by:"aziza",m:"Let’s break it down step by step. The tool does the repetitive part: practice questions, quick feedback and reminders. The mentor does what a machine can’t: notices when someone is losing motivation, explains things in a new way and celebrates progress. So the tool doesn’t replace the mentor; it gives the mentor more time for people."},{t:"Access",q:"What about learners with an old phone or a weak internet connection?",by:"mateo",m:"Picture this: a village with one slow connection. That’s why our tool works offline and downloads the week’s lessons whenever there is a signal. It also runs on simple phones, and learners without a phone can use a computer at the library or the community centre. Nobody should be left out because of their phone."},{t:"Real progress",q:"How will you know that learners are really improving, not just getting better answers from the tool?",by:"leo",m:"Let me give you the evidence we’d collect. At the start, every learner does a short task alone, without the tool. After two months, they do a similar task alone again. If the second one is better, the learner has improved, not the tool. We’ll also ask the mentors what changes they notice."},{t:"Cheating",q:"How will you stop people from using your tool to cheat?",by:"amara",m:"That’s a really important question. Our tool simply can’t produce a finished piece of work: it asks questions, gives hints and checks, but the learner has to write, design or plan every part. And we’ll be open with teachers about what it does, so they can decide how to use it in class."},{t:"After the funding",q:"What happens to your tool when the money runs out?",by:"nur",m:"What if the learners themselves kept it going? In the first year, we’ll train some of the best learners as mentors for the next group. The tool is simple and cheap to run, and we’ll write a short guide for teachers. Even if the tool disappears one day, the skills and the mentors will stay."}],ep=[],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"How can AI help students to learn?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** AI can be a useful study partner, as long as students use it wisely."],["Point","**The main reason is that** it gives instant feedback, so you can learn from your mistakes straight away."],["Example","**For example,** a friend of mine in Bukhara prepares for her English exam by asking an AI tool for new practice questions every evening."],["Close","**So, all things considered,** AI is a helpful tool, but the real learning still has to come from us."]],keys:["in my view","instant feedback","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Will AI make students smarter or lazier?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say it can make us smarter, **as long as** we don’t let it do all the thinking for us."],["","**To begin with,** an AI tutor can explain a difficult idea in several different ways until it finally makes sense."],["","**Take my own case:** when I was struggling with statistics in Hamburg, an AI tool gave me instant feedback at two in the morning, when no teacher was awake."],["","**On the other hand,** if a student lets it write every essay, they practise nothing except copying and pasting."],["","**This is why** the way we use the tool matters far more than the tool itself."],["","**All in all,** AI is a brilliant assistant but a poor substitute for our own effort."]],keys:["as long as","to begin with","on the other hand","all in all"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Should universities teach students how to use AI?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I’m convinced they should, because many students are using it already, with or without a lesson."],["","To begin with, students need to know what AI does well and where it often goes wrong."],["","On top of that, they should learn to check the facts instead of trusting the first answer they get."],["","Let me give you a real example: at my university in Lagos, a lecturer asked us to find the mistakes in an AI-written essay, and we learned more from that than from any lecture."],["","That said, these lessons must not replace the basics, such as careful reading and writing in your own words."],["","So, in a nutshell, teaching students to use AI wisely is better than pretending it doesn’t exist."]],extra:"My favourite music app has a beautiful new design this year.",keys:["check the facts","on top of that","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Can a machine ever replace a good teacher?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I don’t think a machine can ever fully replace a good teacher."],["The main reason is that","teaching is not only about giving information: it is about noticing people."],["For instance,","my guitar teacher in Recife could tell from my face when I was about to give up, and she changed the lesson on the spot."],["Having said that,","an AI tutor can be very useful for practice between lessons."],["That’s why","the best option may be a teacher who uses technology wisely."],["Ultimately,","machines can share knowledge, but people inspire us to learn."]],distractors:["In contrast,","Meanwhile,"],keys:["replace a good teacher","noticing people","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"Which skills will people still need in a world full of AI?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["thinking for yourself","asking good questions","for instance","working with people","learning how to learn"],model:"I’d say the most important skill will be thinking for yourself, because a machine can give you an answer, but you have to decide whether it is a good one. Asking good questions will matter too: the better your question, the better the answer. For instance, my brother in Kuala Lumpur uses AI at work every day, but what makes him valuable is that he knows what to ask and spots the mistakes. People will also need to work with other people, which no app can do for them. Above all, we’ll need to keep learning how to learn."}],np={title:"Exam Part 2 practice: helping students to write better",situation:"The English department at a university in Navoi wants to help students improve their academic writing. It can pay for only one idea: an AI writing assistant for every student, extra one-to-one tutorials with teachers, or a weekly peer-review club where students read and comment on each other’s essays. Nur and Mateo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"mateo",lines:[["A","So, which idea would help students most? Shall we start with the AI assistant?"],["B","Sure. It’s there day and night, but won’t some students just let it write for them?"],["A","Possibly. So you’re saying it might make them more dependent, not more skilled?"],["B","Not exactly. If it only gives feedback and never rewrites, it could be really useful."],["A","True. And the tutorials? A teacher notices things that a machine might miss."],["B","They’re great, but there are only a few teachers for so many students, aren’t there?"],["A","Good point. And the peer-review club? We learn a lot from each other’s essays, don’t we?"],["B","Exactly. So, shall we go for the club, and let members use the AI for spelling only?"],["A","Agreed. That way, students learn from people, and the machine just does the small jobs."]],phrases:{Start:["Shall we start with …?","Which idea would help … most?"],Clarify:["So you’re saying (that) …?","Not exactly. …"],"Give the turn":["…, aren’t there?","…, don’t we?"],"Agree and decide":["Good point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your student English club wants members to practise speaking every day. Choose **one** idea: an AI conversation app for every member, a ten-minute daily speaking partner from the club, or a weekly English evening with guests. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["It’s a double-edged sword.","It saves a lot of time, but …","I learn best when …","It does the heavy lifting.","I’d rather work it out myself.","The danger is that …","It all depends on how you use it.","It’s no substitute for …","In the long run, …"],B:["It gives you instant feedback.","I’m in two minds about …","It’s no substitute for …","The danger is that …","It all depends on how you use it.","I’d rather work it out myself.","It’s a double-edged sword.","It helps me to …","In the long run, …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["It’s a double-edged sword.","It saves a lot of time, but …","I learn best when …","It does the heavy lifting.","I’d rather work it out myself.","The danger is that …","It all depends on how you use it.","It’s no substitute for …","In the long run, …","It gives you instant feedback.","I’m in two minds about …","It helps me to …"],questions:["How do you use technology to learn, and does it really help?","Do students in Uzbekistan learn differently today from the way their parents did? How?","What should you never ask AI to do for you? Why?","Is it better to learn a skill from a person or from an app? Why?","Will AI make some jobs and skills disappear? Which ones should we still learn?","What is one skill you would love to develop this year, and how would you do it?"]},sp=[{type:"stress",title:"Stress Spot: words about learning and development",intro:"Tap the stressed syllable. Rules: in words ending in -tion, -ity and -cial, the syllable just before the ending is strong (eduCAtion, creaTIVity, artiFIcial). Endings like -ment and -ent are never stressed (deVELopment, indePENdent). Then listen and say the word.",follow:"Now use two of these words in one sentence about the AI learning tool your team would design.",items:[{w:"development",syl:["de","vel","op","ment"],s:1},{w:"education",syl:["ed","u","ca","tion"],s:2},{w:"artificial",syl:["ar","ti","fi","cial"],s:2},{w:"creativity",syl:["cre","a","tiv","i","ty"],s:2},{w:"curiosity",syl:["cu","ri","os","i","ty"],s:2},{w:"technology",syl:["tech","nol","o","gy"],s:1},{w:"independent",syl:["in","de","pen","dent"],s:2},{w:"knowledge",syl:["know","ledge"],s:0}]},{type:"pairs",title:"Sound Pairs: /ɜː/ or /ɑː/?",intro:"Press Play and choose the word you hear. Both sounds are long. /ɜː/ has relaxed lips and a mouth only a little open (heard, firm, burn). /ɑː/ has the mouth wide open, as when a doctor says “Say aah” (hard, farm, barn). In British English, the r in these words is silent. Uzbek has no sound like /ɜː/, so heard and hard can easily sound the same. Partner version: one student says a word, the partner points to it.",pairs:[["heard","hard"],["firm","farm"],["burn","barn"],["stir","star"],["fur","far"]]}],op=["Use two C1 phrases from the Phrase Bank in your next answer.","Ask the last speaker a follow-up question about their tool.","Name one risk in the last pitch and suggest a safeguard.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last team’s tool in 20 seconds, without the words “AI” or “app”."],lp={title:"Step Up Speaking Club Ideas Evening: Who Is Doing the Thinking?",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s online Ideas Evening, Amara talks about the AI tool she uses for her studies in Lagos: what it gives her, the problem she noticed, and her new rule.",tip:["Listen for problem and solution","Many talks follow the same path: what went well, what went wrong (*The problem was that …*), what helped, and what the speaker does now (*So now …*). Questions often test each step, so follow the path."],A:"amara",B:"aziza",lines:[["A","Good evening, everyone. When I started my degree in Lagos, I didn’t trust AI tools. Now I use one almost every day, and I have to admit that it’s **a double-edged sword**. It gives me **instant feedback** on my essays, and it lets me practise French **at my own pace**, even at midnight."],["A","But last term I noticed something. [[0]] I was letting the app **do the heavy lifting**. It planned my essays, and I simply **cut corners** and polished its sentences. My marks were fine, but in exams, with no app beside me, I found it hard to **think for myself**."],["A","[[1]] Aziza told our club about her cousin, a trainee teacher in Samarkand. She uses AI to prepare practice questions, but she **develops the skill** of explaining in real classrooms, with a mentor watching. [[2]] no machine can give you that kind of **hands-on practice**. [[3]] you learn to teach by teaching, not by reading."],["A","So now I have a rule: I write first and ask later. I **double-check the facts**, I try not to **rely too heavily on** any tool, and I **stay in the driving seat**. [[4]] how we use it. Used well, AI can support **lifelong learning**. Used badly, it can make us lazy. Thank you."]],gaps:[[1,"The problem was that"],[2,"To give you an example,"],[3,"I firmly believe that"],[4,"This is mainly because"],[5,"In the end, it all comes down to"]],questions:[{q:"What does Amara like about her AI tool?",o:["It writes her essays for her.","It comments on her work quickly and lets her learn when she wants.","It helps her find people to practise French with."],a:1,why:"“It gives me instant feedback on my essays, and it lets me practise French at my own pace, even at midnight.”"},{q:"What problem did Amara notice last term?",o:["Her marks went down.","She found it hard to think on her own in exams.","The app made too many mistakes."],a:1,why:"“My marks were fine, but in exams, with no app beside me, I found it hard to think for myself.”"},{q:"Why does Amara mention Aziza’s cousin?",o:["to show how AI can support real practice, not replace it","to say that teachers should not use AI","to explain why she wants to become a teacher"],a:0,why:"“She uses AI to prepare practice questions, but she develops the skill of explaining in real classrooms.”"},{q:"Which sentence is closest to Amara’s main message?",o:["Students should stop using AI tools.","AI will soon do the work of teachers.","AI helps us if we stay in control of our own learning."],a:2,why:"“I stay in the driving seat … Used well, AI can support lifelong learning.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one describes a problem, and which one does Amara use to sum up her view?",groups:[["Describing a problem",[1]],["Example",[2]],["Opinion",[3]],["Reason",[4]],["Summing up",[5]]]},use:{q:"Should students be allowed to use AI tools for their homework? Why or why not?",by:"aziza",model:"I firmly believe that students should be allowed to use AI, but only for some tasks. This is mainly because a tool can explain a grammar rule at midnight, when no teacher is around. To give you an example, my cousin in Navoi checks his maths homework with an app, but he always does the sums himself first. The problem is that some students let the app do the heavy lifting. So, all in all, it comes down to how you use it.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Zf,DIALOGUE:np,DRILLS:Kf,LESSON:Uf,LEVELS:tp,LISTEN:lp,MAIN:Gf,PRON:sp,QUESTIO
