Hwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Zf={code:"S3_U22",semester:3,unit:22,title:"Natural Resources and Sustainable Development",subtitle:"Can We Use Nature Without Using It Up?",module:5,stage:"Stage 2 · EXTEND",level:"B2+",sioLevel:2,hero:{tags:[["b2","B2+"],["c1","C1 stretch"],["bl","Bloom: Analyse → Evaluate"]],title:"The Valley Council",paras:["**Mirrorstone Valley** (a fictional place) has a river, a lake, an old walnut forest, high pastures and a windy ridge. Eight people have asked the **Valley Council** for permission to use these resources, but nature can’t support every plan: this year the council can approve **only four of the eight requests**. The others may apply again next year.","Each student plays one applicant and fights for their plan, but must also admit what it **takes from nature**. Then the council votes and agrees on **one valley rule** that protects the resources for the future. Think of the mountain rivers that water fields across Uzbekistan, or of any valley in the world where farmers, builders and visitors all need the same river."],rule:"Rule of respect: we judge plans by what they take from nature and what they give back, never by anyone’s health, looks or origin. All people and places in the game are fictional."},lock:{prompt:"Read the clues aloud in English and explain each digit to your partner.",clues:["Digit 1: the number of requests the council can approve this year.","Digit 2: the number of applicants.","Digit 3: the number of natural resources named in the first sentence of the situation.","Digit 4: the second digit minus the first."],answer:"4854"}},Uf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for a purpose, a reason, a feeling and a main point, notice how the speakers link causes and results, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Mateo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about nature and resources, and /ɔɪ/ or /aɪ/ as in oil and aisle. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about using nature in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases that weigh up costs and benefits. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group retells the most balanced answer they heard (use the wheel)."]},{id:"game",icon:"🏞",name:"The Valley Council",min:18,lv:"c1",group:"2 councils of 7–8",kind:"shelters",roles:["Applicant · chair","Applicant · timekeeper","Applicant · vote counter","Applicant","Applicant","Applicant","Applicant","Applicant"],desc:"Introduce, persuade, face a twist and vote: which four of eight plans may use the valley’s river, land, forest and wind, and what rule will protect them? (Book: section 6 · Game School G6)",howto:["Two councils play at the same time: 15 students = 8 + 7 (👥 Class → Groups → Shelters; each “shelter” is one council). In the council of 7, one applicant card is not used.","Each student plays one applicant. In each council, one applicant is also the chair, one the timekeeper and one the vote counter.","Rounds: Introduce 4 min (30 s each) · Persuade 6 min (45 s each) · Twist 4 min · Decide 4 min.","At the end, the chair of each council presents the four approved plans and the valley rule to the class. Before the lesson, students read the sample game (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about one green project for the campus, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Kf={listen:{ref:"Book: Lesson 22, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract: a purpose, a reason, a feeling or a main point.","Press **Play the podcast**. You hear four short extracts. Listen for cause and effect: _because …_, _as a result …_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: result, opinion, reason, example and checking meaning.","**Your turn:** listen to Mateo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is A. Leo is worried about the change.","gives an answer"],["B","Is he? Listen to the end of the extract.","challenges politely"],["A","“Some people find that frightening, but honestly, I find it exciting.”","checks the text again"],["B","So he feels positive about it. It’s B.","paraphrases"]],checks:[["Where do you often hear the answer to a “why” question?","just before or after a link like because, so, as a result or that’s why. In extract 2, “As a result” joins the old problem to what the farmers do now."],["Which phrase does Leo use to check meaning?","In other words, …?"]]},pron:{ref:"Book: Lesson 22, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion** and **-ity**, the syllable is strong (*irriGAtion*, *elecTRICity*). **-able** keeps the stress of the verb (*reNEW* → *reNEWable*). **-ment** is never stressed (*enVIronment*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɔɪ/ or /aɪ/?","Say **both** words. Both sounds glide to /ɪ/. /ɔɪ/ starts with **round lips**, as in *or* (*oil*). /aɪ/ starts with the **mouth wide open**, as in *ah* (*aisle*). Say *oil* as **one** syllable, not *o-il*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *sustainable*. Which syllable is strong?",""],["A","*SUS*? The first one?","a first guess"],["T","Not quite. Think of the verb: sus-*TAIN*. The adjective keeps the same stress.","the teacher gives a clue"],["B","sus-*TAIN*-a-ble! *-able* doesn’t move the stress.","uses the rule"],["T","Great. Now *irrigation*.",""],["A","It ends in *-tion*, so the syllable before it: irri-*GA*-tion.","uses the rule"],["T","Yes! Now /ɔɪ/ or /aɪ/? Listen: *toil*. First or second: *toil* or *tile*?",""],["B","First: *toil*. My lips are round at the start.","checks the mouth"]],checks:[["Where is the stress in *electricity*?","on TRIC: e-lec-TRIC-i-ty, just before *-ity*."],["Where is the stress in *agriculture*?","on the first syllable: AG-ri-cul-ture."],["What is the difference between *oil* and *aisle*?","both glide to /ɪ/; *oil* starts with round lips (/ɔɪ/), *aisle* starts with the mouth wide open (/aɪ/)."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it answers the question directly (*I’d say …*).","Follow the linking words: *To begin with* (a first reason) → *Take … , for instance* (an example) → *On the other hand* (the other side) → *This is why* (a result) → *All in all* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, I think … yes, we can, if … we don’t take too much. Forests, they grow again … My grandparents’ forest … But oil, gas … no. So, yes and no.","Attempt 1 · 90 s · many pauses"],["leo","I’d say we can, as long as we don’t take more than nature can replace. To begin with, forests and rivers renew themselves. Take the forest near my grandparents’ village: the foresters plant young trees where they cut old ones. On the other hand, oil and gas don’t come back. All in all, we can use nature, but carefully.","Attempt 2 · 60 s · linking words"],["leo","I’d say we can, as long as we take no more than nature can replace. Forests and rivers renew themselves: near my grandparents’ village, the foresters plant young trees wherever they cut old ones. Oil and gas, by contrast, took millions of years to form, so once they’re burnt, they’re gone. All in all, we can live on nature’s interest, but we mustn’t spend its savings.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Which is better for a region: a new factory or a protected forest?",lines:[["nur","**On the plus side,** a factory brings jobs, and young people wouldn’t have to move to the city. **The downside is that** it may pollute the river. **In the long term,** a forest gives clean air and water for free. **We can’t afford to** lose that. **It’s a matter of balance**, really: build the factory, but somewhere else!","speaker · 1 minute"],["mateo","I heard five phrases: *On the plus side*, *The downside is that*, *In the long term*, *We can’t afford to* and *It’s a matter of balance*. That’s the middle row: **Bingo!**","listener reports"],["nur","Five points plus three for the Bingo: eight points!","count the points"],["mateo","Next time, try *We need to think twice before …*. It’s on my card, and it sounds very natural.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which project would …?*).","Click the lines in order. Each line answers the line before. Amara and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: saving energy in the dormitory",lines:[["A","So, how can we use less electricity in our dormitory?","opens the topic"],["B","How about switching off the lights in the corridors at night?","an idea"],["A","Good idea, but people might feel unsafe. What about a reminder on every door?","reacts + a new idea"],["B","Agreed. Let’s make the posters this weekend.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make two councils of 7–8 students (👥 Class → Groups → Shelters). Choose a **chair**, a **timekeeper** and a **vote counter** in each council.","**Open the file:** read the clues aloud and find the 4-digit code. Then each student turns over one **applicant card**, reads it and keeps the **secret** until Round 3.","**Round 1 · Introduce (30 s each):** who are you, what do you want from the valley, and what will you give back?","**Round 2 · Persuade (45 s each):** two reasons, and an honest answer to the cost of your plan. Others may disagree politely.","**Round 3 · Twist (4 min):** everyone reveals their secret. The chair opens a twist card; the council discusses whose plan becomes stronger or weaker.","**Round 4 · Decide (4 min):** everyone votes for four plans, **never their own**, and gives a reason. Click the four approved plans and agree on **one valley rule** that protects the resources."],exTitle:"Sample game: Council A",lines:[["","Round 1 · Introduce — five of the eight players are from the Club: Aziza (as Gulnora, fruit farmer, vote counter), Leo (as Arman, carpenter), Amara (as Freja, wind engineer), Nur (as Ayşe, guesthouse owner, chair), Mateo (as Dilshod, shepherd, timekeeper)",""],["aziza","Hello, I’m Gulnora, a fruit farmer. **What I’m asking for is** more river water for a new apricot orchard. **In return,** the valley gets jobs at harvest time and dried fruit to sell in the cities.","introduces the request"],["amara","I’m Freja, a wind engineer, and I’d like to use the ridge for six turbines. **The way I see it,** the wind is free, and it will never run out.","a first reason"],["","Round 2 · Persuade",""],["mateo","**With respect,** Freja, a new road would cut my pasture in half. **The real cost is** the grass, and the grass feeds half the valley.","polite objection"],["amara","**That’s a fair point, but** every home would get clean electricity. **We can’t afford to** burn gas for ever.","answers the objection"],["leo","**I’ll be honest:** cutting walnut trees has a cost. **That’s why** I’d cut only old trees and leave the young ones standing.","admits the cost"],["","Round 3 · Twist — everyone reveals their secret; the chair opens a card: “A dry year: the river is much lower this summer.”",""],["aziza","My secret: I’ve already tried drip irrigation on one field. **So** my orchard could use far less water than you think.","the secret helps"],["nur","**In light of this,** the fish ponds and the bottled spring water should wait: in a dry year, the river can’t support them.","the chair sums up"],["","Round 4 · Decide",""],["aziza","Results: Gulnora 7, Freja 6, Dilshod 5, Arman 5, Ayşe 4, Rosa 3, Minh 2, Pavel 0. That’s 32 votes, so nobody is missing.","vote counter (8 players × 4 votes)"],["nur","**Taking everything into account,** we approved Gulnora, Freja, Dilshod and Arman: water used drop by drop, clean energy, healthy pastures and a forest that grows back. **It was a tough choice** to say no to my own guesthouse! **Our valley rule:** in a dry year, nobody takes extra water from the river without the council’s agreement.","the chair explains the choice"]],checks:[["Can you vote for your own plan?","no: each player votes for four other plans and gives a reason."],["When do you reveal your secret?","in Round 3, before the chair opens a twist card."],["What must the council agree on at the end?","four approved plans and one valley rule that protects the resources."]]},drills:{ref:"Book: Lesson 22 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Qf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"We only notice how precious water is when the tap is dry: most of the time we ___.",o:["take it for granted","strike a balance","cut down on it"],a:0},{q:"In a hot, dry summer, fresh water is often ___.",o:["a wake-up call","in short supply","renewable energy"],a:1},{q:"Old, open channels let a lot of water ___ before it reaches the fields.",o:["go to waste","run out of","take for granted"],a:0},{q:"Our family is trying to ___ plastic bags: we take our own bag to the bazaar.",o:["run out of","cut down on","use up"],a:1},{q:"The story of the Aral Sea was ___ for many people: they saw how serious the problem was.",o:["a wake-up call","a natural resource","a future generation"],a:0},{q:"Wind and solar power are examples of ___.",o:["long-term consequences","renewable energy","short supply"],a:1},{q:"If we ___ all the gas now, there will be nothing left for our children.",o:["use up","go to waste","take for granted"],a:0},{q:"A good council tries to ___ jobs today and a healthy valley tomorrow.",o:["run out of","strike a balance between","cut down on"],a:1},{q:"Cutting down a whole forest can have serious ___: the soil may wash away for years.",o:["long-term consequences","natural resources","wake-up calls"],a:0},{q:"If we keep wasting water like this, one day we’ll ___ it.",o:["run out of","strike a balance","go to waste"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Uzbekistan is rich in natural gas. → **sunshine**",a:"Uzbekistan is rich in sunshine. (rich in, not rich with!)"},{p:"Uzbekistan is rich in sunshine. → **a question: Is …?**",a:"Is Uzbekistan rich in sunshine?"},{p:"If we waste water, we will run out of it. → **electricity**",a:"If we waste electricity, we will run out of it."},{p:"If we waste electricity, we will run out of it. → **an unreal situation: If we wasted …**",a:"If we wasted electricity, we would run out of it."},{p:"If we wasted electricity, we would run out of it. → **the past: If we had wasted …**",a:"If we had wasted electricity, we would have run out of it."},{p:"The forest is protected by the council. → **the past**",a:"The forest was protected by the council."},{p:"The forest was protected by the council. → **the present perfect**",a:"The forest has been protected by the council."},{p:"The forest has been protected by the council. → **a question**",a:"Has the forest been protected by the council?"},{p:"We use less water than last year. → **plastic bottles**",a:"We use fewer plastic bottles than last year. (fewer + countable nouns!)"},{p:"We use fewer plastic bottles than last year. → **energy**",a:"We use less energy than last year. (less + uncountable nouns)"},{p:"We should cut down on plastic. → **the past: should have …**",a:"We should have cut down on plastic."},{p:"We should have cut down on plastic. → **a question: Why didn’t …?**",a:"Why didn’t we cut down on plastic?"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"We must not use all the water.",a:"We can’t afford to use up the water."},{p:"This plan is good now but bad later.",a:"It may pay off now, but the long-term consequences could be serious."},{p:"We need both jobs and nature.",a:"It’s a matter of striking a balance between jobs and nature."},{p:"Water is very, very important here.",a:"Here, every drop counts."},{p:"I don’t think it’s worth it.",a:"I’m not convinced it’s worth the risk."},{p:"If we continue like this, there will be problems.",a:"If we carry on like this, we’ll pay the price later."},{p:"Let’s think carefully first.",a:"We need to think twice before we say yes."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ We must save the nature.",o:["We must protect nature.","We must protect the nature.","We must save a nature."],a:0,why:"Nature in general takes no article. Protect nature sounds more natural than save nature."},{q:"✗ Uzbekistan is rich with natural gas.",o:["Uzbekistan is rich of natural gas.","Uzbekistan is rich in natural gas.","Uzbekistan is rich by natural gas."],a:1,why:"rich in something: rich in gas, rich in history"},{q:"✗ If we will waste water, we will regret it.",o:["If we waste water, we will regret it.","If we would waste water, we will regret it.","If we wasted water, we will regret it."],a:0,why:"First conditional: if + present simple, then will. No will after if."},{q:"✗ There isn’t enough waters in the river.",o:["There aren’t enough waters in the river.","There isn’t enough water in the river.","There isn’t enough of waters in the river."],a:1,why:"Water is uncountable: no -s."},{q:"✗ We need to economy electricity.",o:["We need to economic electricity.","We need to save electricity.","We need to make economy electricity."],a:1,why:"Economy is a noun. Use save (or the formal verb economise on)."},{q:"✗ The informations about the Aral Sea are shocking.",o:["The information about the Aral Sea is shocking.","The informations about the Aral Sea is shocking.","The information about the Aral Sea are shocking."],a:0,why:"Information is uncountable: the information is, a piece of information."},{q:"✗ Pollutions is a big problem in big cities.",o:["Pollutions are a big problem in big cities.","The pollutions is a big problem in big cities.","Pollution is a big problem in big cities."],a:2,why:"Pollution is uncountable: no -s."},{q:"✗ Wind energy is depend on the weather.",o:["Wind energy depends on the weather.","Wind energy is depends on the weather.","Wind energy depends from the weather."],a:0,why:"Depend is a verb: depends on, without is."}]},{title:"Stress: words about nature and resources",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"renew → adjective (it doesn’t run out)",o:["reNEWable","REnewable","renewABLE"],a:0,why:"-able keeps the stress of the verb: reNEW → reNEWable."},{q:"sustain → adjective (it can go on for a long time)",o:["SUStainable","susTAINable"],a:1,why:"-able keeps the stress of the verb: susTAIN → susTAINable."},{q:"irrigate → noun (bringing water to fields)",o:["IRrigation","irriGAtion","irrigaTION"],a:1,why:"The stress moves: IRrigate → irriGAtion, just before -tion."},{q:"consume → noun (how much we use)",o:["conSUMPtion","CONsumption"],a:0,why:"Just before -tion."},{q:"electric → noun",o:["eLECtricity","elecTRICity","electriCIty"],a:1,why:"The stress moves: eLECtric → elecTRICity, just before -ity."},{q:"environment → adjective",o:["enVIronmental","environMENtal"],a:1,why:"The stress moves: enVIronment → environMENtal."},{q:"agriculture → adjective",o:["AGricultural","agriCULtural"],a:1,why:"The stress moves: AGriculture → agriCULtural."}]}],Gf={lockStep:"Open the file",lockTitle:"Open the council’s request file",lockOk:"The file is open! Go to the applicant cards.",cardsStep:"Applicants",cardsTitle:"Applicant cards",cardsHint:"Each student picks one card: it turns over and opens. Read it, close it, and the next student picks. Each student plays one applicant (👥 Class → Groups → Shelters gives everyone a number). Keep your secret until Round 3.",backWord:"Applicant",hiddenLabel:"Secret",hiddenAll:"Show all secrets",twistTitle:"Twist cards",twistHint:"The chair opens one card. The council discusses whose plan becomes stronger or weaker, and whether two plans could work together.",twistWord:"Twist",twistHelp:{b2:["Because of this card, … should wait.","… could help by …","It would be fairer if …"],c1:["In light of this, it might make sense to …","What if … and … joined forces?","I’d suggest a compromise: …"]},voteTitle:"Council vote board",voteHint:"Each player votes for four plans, never their own (one vote each), and gives a reason: what the plan takes from nature and what it gives back. Count the votes with + and −, then click the four approved plans. Equal votes? One more reason each, then vote again between those plans only.",capacity:4,teamWord:"Council",teamIcon:"",teamKind:"shelters",teams:2,doneText:"Now the chair presents the four approved plans and the valley rule."},Jf=[{name:"Round 1 · Introduce",lv:"b2",bloom:"Understand",as:"Gulnora",seconds:30,q:"Introduce your applicant: who are you, what do you want from the valley, and what will you give back?",help:{b2:["I’m …, a … from …","What I’m asking for is …","In return, the valley gets …"],c1:["My plan is simple: …","I won’t pretend it’s free: …","What I can offer the valley is …"]},model:"Hello, I’m Gulnora Tursunova, a fruit farmer from Uzbekistan. What I’m asking for is more water from the river for a new apricot orchard on my family’s land. In return, the valley gets jobs at harvest time and dried apricots to sell in the cities. I won’t pretend it’s free: orchards are thirsty in the hottest months. But fruit trees also hold the soil and give shade, so the land stays alive."},{name:"Round 2 · Persuade",lv:"b2p",bloom:"Evaluate",as:"Freja",seconds:45,q:"Why should the council approve your plan? Give two reasons, then answer honestly: what will your plan cost the valley, and how will you reduce that cost?",help:{b2:["First and foremost, …","The real cost is …, but …","To reduce the damage, I’ll …"],c1:["The strongest argument for my plan is that …","I take that concern seriously, so …","In the long term, the valley gains far more than it loses."]},model:"First and foremost, the wind on the ridge is free, and it will never run out, unlike the gas we burn today. On top of that, six turbines could give every home in the valley clean electricity. I know the real cost is a road across the high pasture, and I take that concern seriously. So I’d build only a narrow track, close it after the work is done and keep the turbines away from the birds’ flight path. In the long term, the valley gains far more than it loses."},{name:"Round 3 · Twist",lv:"b2p",bloom:"Analyse",by:"amara",seconds:0,tool:"twists",q:"Reveal your secret. Then the chair opens a twist card: whose plan becomes stronger or weaker? Could two plans work together?",help:{b2:["My secret is that …","Because of this card, … should wait.","… could help by …"],c1:["In light of this, it might make sense to …","That changes things, because …","What if … and … joined forces?"]},model:"I’m playing Freja, so here’s her secret: she has built turbines on a mountain ridge before, and the parts went up by cable, without a new road. So Dilshod’s pasture can stay in one piece. Now, the card says it’s a dry year. In light of this, the plans that take the most water, the fish ponds and the bottled spring water, should wait. Gulnora’s orchard could still go ahead, but only with drip irrigation, as her secret shows."},{name:"Round 4 · Decide",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:0,tool:"decide",q:"Vote for four plans (never your own). Justify your choice, politely explain why one plan was not approved, and agree on one valley rule that protects the resources for the next generation.",help:{b2:["I’d vote for … because together they …","I really respect …, but …","Our valley rule: nobody …"],c1:["On balance, …","Taking everything into account, …","I’d suggest that … applies again with …"]},model:"On balance, I’d vote for Gulnora, Freja, Dilshod and Arman. Together they use the river carefully, bring clean energy, keep the pastures healthy and give the forest a future. I really respect Pavel’s offer, because the council could do a lot with his fee, but if the spring runs low, the whole valley loses its best water. So I’d suggest that he applies again with a smaller plan. And our valley rule: for every tree that is cut, two young trees are planted."}],_f=[{e:"🍑",n:"Gulnora Tursunova",r:"Fruit farmer · Uzbekistan",look:{skin:"#EAC19A",hair:"#2B1A12",style:"long",top:"#F7C08E",bg:"#FFE4D6"},lines:[["Wants","More river water for a new apricot orchard"],["Gives back","Jobs at harvest time; dried fruit to sell in the cities"],["Cost to nature","Orchards need a lot of water in the hottest months"]],x:"She has already tried drip irrigation on one field of her family’s farm."},{e:"🐟",n:"Minh Tran",r:"Fish farmer · Vietnam",look:{skin:"#E9C39F",hair:"#1F1A1A",style:"short",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Wants","To dig fish ponds beside the river"],["Gives back","Fresh fish for the valley’s schools and market"],["Cost to nature","Water from the ponds can make the river dirtier and warmer"]],x:"He knows how to use the pond water to feed vegetable beds instead of the river."},{e:"🌬",n:"Freja Holm",r:"Wind engineer · Denmark",look:{skin:"#F6DCC8",hair:"#D9B97A",style:"bun",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Wants","The windy ridge for six wind turbines"],["Gives back","Clean electricity for every home in the valley"],["Cost to nature","A new road across the high pasture; turbines may disturb birds"]],x:"She has built turbines on a mountain ridge before and carried the parts up by cable, without a road."},{e:"🪨",n:"Rosa Quispe",r:"Builder · Peru",look:{skin:"#C98D63",hair:"#1E1511",style:"long",top:"#F5A9BF",bg:"#FFE1EA"},lines:[["Wants","To dig gravel and sand from the riverbed"],["Gives back","Material for a new school and a safer valley road"],["Cost to nature","Digging makes the river muddy and can harm the fish"]],x:"She has experience of building with recycled concrete from old buildings."},{e:"🌳",n:"Arman Seitkali",r:"Carpenter · Kazakhstan",look:{skin:"#E5B78F",hair:"#1E1511",style:"short",beard:!0,top:"#F7D774",bg:"#FFF3C4"},lines:[["Wants","To cut part of the old walnut forest for a furniture workshop"],["Gives back","Skilled jobs and furniture that lasts for generations"],["Cost to nature","Walnut trees take decades to grow; the forest holds the soil on the slopes"]],x:"He owns a small tree nursery full of young walnut trees."},{e:"🏡",n:"Ayşe Demir",r:"Guesthouse owner · Türkiye",look:{skin:"#E8BE98",style:"hijab",scarf:"#B7A6F2",bg:"#ECE6FF"},lines:[["Wants","Land beside the lake for a small guesthouse and a walking trail"],["Gives back","Money from visitors for local families and craftspeople"],["Cost to nature","More visitors bring more rubbish and use more water in summer"]],x:"She has run a guesthouse kitchen that sent almost nothing to the bin."},{e:"💧",n:"Pavel Novák",r:"Businessman · Czech Republic",look:{skin:"#F1CFB0",hair:"#6B3E26",style:"short",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["Wants","To bottle water from the valley’s mountain spring and sell it in the cities"],["Gives back","A yearly fee to the council, enough for a new clinic"],["Cost to nature","The spring could run low; thousands of plastic bottles"]],x:"He has managed a factory that used only returnable glass bottles."},{e:"🐑",n:"Dilshod Rahimov",r:"Shepherd · Uzbekistan",look:{skin:"#D9A47A",hair:"#2B1A12",style:"short",beard:!0,top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Wants","The high pastures kept open for his sheep and goats all summer"],["Gives back","Wool, meat and cheese, and a way of life the valley has always known"],["Cost to nature","Too many animals in one place can strip the grass and let the soil wash away"]],x:"He knows how to move his flocks from field to field so that the grass can grow back."}],$f=[{t:"A dry year: the snow on the mountains melted early, and the river is much lower this summer.",q:"Which plans need the most water? Which ones should wait, and how could the others use less?",by:"aziza",m:"Let’s break it down step by step. The fish ponds and the spring-water factory both need a steady flow, so in a dry year they should wait. Gulnora’s orchard is harder: young trees need water every summer, but with drip irrigation she could use much less. And everyone could help: Ayşe’s guesthouse could collect rainwater from its roof, so the lake isn’t touched."},{t:"A storm: after heavy rain, mud slides down a bare slope and blocks the valley road.",q:"What protects the slopes: the forest, the grass or something else? Does this change your vote?",by:"mateo",m:"Picture this: a bare slope after heavy rain. Without roots, nothing holds the soil, so it slides straight onto the road. That makes the forest even more valuable, so I’d let Arman cut old trees only if he plants young ones first, and Dilshod should move his flocks so that the grass on the slopes can grow back. Rosa could help too: she could rebuild the road with proper drains."},{t:"The village downstream sends a letter: “Everything you take from the river, we lose.”",q:"How can your council be fair to people who are not in the room?",by:"amara",m:"That’s a really important letter, because the people downstream can’t vote in our council, but they live with our decisions. In my view, every plan that touches the river needs their agreement. I’d suggest inviting someone from the village to our next meeting. We could also keep the river clean: no gravel digging in the main channel, and Minh’s pond water goes to vegetable beds, not back into the river."},{t:"A company from the city offers to buy all the water from the spring for twenty years and build the valley a new school.",q:"Is it a good deal? What questions would you ask before you say yes?",by:"leo",m:"Hold on, it sounds like a great deal, but I’d want answers first. How much water will they take, and what happens if the spring runs low in a dry year? Who checks? And what about all those plastic bottles? I’d only say yes to a short contract, with a limit on the water and returnable glass bottles. A school is wonderful, but not if we have to sell our future to pay for it."},{t:"A new member joins the council. Her job is to speak for the people who will live in the valley in fifty years.",q:"What would she say about each plan? Which plan would she approve first, and which would worry her most?",by:"nur",m:"What if we really listened to her? I think she would ask one question about every plan: will this resource still be here in fifty years? She’d probably approve the turbines first, because the wind never runs out, and then Dilshod’s pastures, if the grass can grow back. She would be most worried about the walnut forest and the spring, because once they’re gone, they take a lifetime to come back."}],ep=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"How can ordinary people protect natural resources?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** ordinary people can do a lot, because small habits add up when millions of people share them."],["Point","**The main reason is that** most water and energy is wasted in everyday life, at home, at work and at university."],["Example","**For example,** my grandmother in Samarkand waters her garden early in the morning, so less water is lost in the heat of the day."],["Close","**So, all things considered,** governments must lead, but every one of us can cut down on waste starting today."]],keys:["in my view","small habits add up","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Can we use nature without using it up?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say we can, **as long as** we take no more than nature is able to replace."],["","**To begin with,** some resources renew themselves: forests grow back, rivers refill and the wind never runs out."],["","**Take** the forest near my grandparents’ village in Germany, **for instance:** the foresters plant young trees wherever they cut old ones."],["","**On the other hand,** oil, gas and coal took millions of years to form, so once we use them up, they are gone."],["","**This is why** the real question is not whether we use nature, but how fast we use it."],["","**All in all,** we can live on nature’s interest, but we mustn’t spend its savings."]],keys:["as long as","renew themselves","on the other hand","all in all"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Should a country sell its natural resources to other countries?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think it can, but only if the money really reaches the people."],["","To begin with, selling oil, gas or metals can pay for schools, roads and hospitals."],["","In my own country, people often debate where the money from oil should go, and young people want a say in it."],["","That said, a country that sells only raw materials can become dangerously dependent on world prices."],["","On top of that, resources like gas will not last for ever, so the money should also build skills and new industries."],["","So, in a nutshell, selling resources is fine, as long as a country invests in the day when they run out."]],extra:"My cousin has just bought a new bicycle in a lovely shade of green.",keys:["reach the people","dependent on world prices","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it fair to ask poorer regions to protect their forests for the whole world?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think it is fair to ask, but only if the rest of the world helps to pay."],["The main reason is that","forests clean the air and affect the weather far beyond the countries where they grow."],["For instance,","back home in Brazil, many families near the forest need land and jobs to earn a living."],["Having said that,","cutting the forest gives them income now but takes away their future."],["That’s why","fair support, like paying communities to protect and manage the forest, makes more sense than rules alone."],["Ultimately,","protecting forests is everyone’s job, so the cost should be shared too."]],distractors:["In contrast,","Meanwhile,"],keys:["the rest of the world","earn a living","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"Which natural resource will be the most precious in the future?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["clean fresh water","we can’t make more of it","for instance","collect rainwater","every drop counts"],model:"I’d say clean fresh water, without a doubt. We can replace oil with wind or sunlight, but we can’t make more fresh water, and we need it for drinking, farming and almost every factory. As cities grow, the demand will only increase. For instance, my cousin’s office building in Kuala Lumpur collects rainwater to water its garden and clean its floors, which is a small step, but a smart one. In the future, I think every country will have to treat water like gold, because every drop counts."}],tp={title:"Exam Part 2 practice: one green project for the campus",situation:"Your university can pay for one project that saves natural resources on campus: a rainwater tank for the gardens, sensors that switch off lights and heating in empty rooms, or a repair café where students fix old things instead of buying new ones. Amara and Leo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"amara",B:"leo",lines:[["A","So, which project would save the most? Shall we start with the rainwater tank?"],["B","Sure. It would water the gardens for free, but only when it rains, wouldn’t it?"],["A","True. So you’re saying it might sit empty all summer?"],["B","Exactly. The sensors, on the other hand, would work every day, in every building."],["A","I see your point, but nobody would notice them. A repair café could change habits."],["B","That’s a fair point. People would learn to fix things instead of throwing them away."],["A","And it would cut down on waste, not just on electricity, wouldn’t it?"],["B","Absolutely. So, shall we go for the repair café, and ask for the sensors next year?"],["A","Agreed. That way, we save resources and change habits at the same time."]],phrases:{Start:["Shall we start with …?","Which project would … the most?"],Clarify:["So you’re saying (that) …?","Exactly. …"],"Give the turn":["…, doesn’t it?","…, wouldn’t it?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your mahalla wants to use less water this summer. Choose **one** idea: a free tap-repair day for every home, a shared vegetable garden with drip irrigation, or a water-saving campaign at the local school. Discuss for 2 minutes and decide together.",seconds:120}},np={cards:{A:["On the plus side, …","The downside is that …","In the long term, …","We can’t afford to …","It’s a matter of balance.","If we carry on like this, …","We need to think twice before …","The real cost is …","For future generations, …"],B:["It’s not worth the risk.","In the long term, …","Every drop counts.","The downside is that …","We need to think twice before …","On the plus side, …","I’d rather we …","We can’t afford to …","It’s a matter of balance."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["On the plus side, …","The downside is that …","In the long term, …","We can’t afford to …","It’s a matter of balance.","If we carry on like this, …","We need to think twice before …","The real cost is …","For future generations, …","It’s not worth the risk.","Every drop counts.","I’d rather we …"],questions:["Which natural resources do you use most on a normal day?","How do people in Uzbekistan save water? Is it enough?","Which is better for a region: a new factory or a protected forest?","Should water be cheap for everyone, or should people who use more pay more?","What could your university do to waste fewer resources?","Which kind of renewable energy would work best where you live? Why?"]},rp=[{type:"stress",title:"Stress Spot: words about nature and resources",intro:"Tap the stressed syllable. Rules: before -tion and -ity, the syllable is strong (irriGAtion, elecTRICity). -able keeps the stress of the verb (reNEW → reNEWable). -ment is never stressed (enVIronment). Careful: AGriculture. Then listen and say the word.",follow:"Now use two of these words in one sentence about the place where you live.",items:[{w:"renewable",syl:["re","new","a","ble"],s:1},{w:"sustainable",syl:["sus","tain","a","ble"],s:1},{w:"environment",syl:["en","vi","ron","ment"],s:1},{w:"irrigation",syl:["ir","ri","ga","tion"],s:2},{w:"agriculture",syl:["ag","ri","cul","ture"],s:0},{w:"consumption",syl:["con","sump","tion"],s:1},{w:"generation",syl:["gen","e","ra","tion"],s:2},{w:"electricity",syl:["e","lec","tric","i","ty"],s:2}]},{type:"pairs",title:"Sound Pairs: /ɔɪ/ or /aɪ/?",intro:"Press Play and choose the word you hear. Both sounds glide to /ɪ/. /ɔɪ/ starts with round lips, as in or (oil, toil, voice). /aɪ/ starts with the mouth wide open, as in ah (aisle, tile, vice). Say oil and soil as one syllable, not o-il. Partner version: one student says a word, the partner points to it.",pairs:[["oil","aisle"],["toil","tile"],["foil","file"],["voice","vice"],["toy","tie"]]}],sp=["Use two C1 phrases from the Phrase Bank in your next answer.","Ask the last speaker a follow-up question about the cost of their plan.","Name one thing the last plan takes from nature and one thing it gives back.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last two speakers in 20 seconds, without the words “good” or “bad”."],op={title:"Step Up Speaking Club: Every Drop Counts",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Aziza and Leo talk about water in her grandparents’ village near Samarkand, the energy debate in Germany and the Aral Sea. Each extract is a different situation.",tip:["Listen for cause and effect","Short extracts often test why something happened or what it led to. Listen for *because*, *so*, *as a result*, *that’s why*: the answer is usually just before or after these words."],A:"aziza",B:"leo",lines:[["A","*Extract 1.* Hi Leo, it’s Aziza. I’m spending the weekend at my grandparents’ village near Samarkand, and I’d love to record our next podcast here. Nobody in this village **takes water for granted**, and our listeners should hear why. Could you send me two or three questions about energy in Germany before Friday?"],["B","*Extract 2.* Aziza, why is water such a big issue in the village?"],["A","Every spring, snow melts in the mountains and the rivers carry it down to the fields. But in a hot summer, water is often **in short supply**. My grandfather remembers how much of it used to **go to waste** in old open channels. [[0]] some farmers now water their fields drop by drop. They **cut down on** waste and still grow enough."],["B","*Extract 3.* In Germany, the big debate is about energy. [[1]] we can’t keep **using up** coal and gas for ever. [[2]] they won’t come back once they’re gone. So the question is how quickly people can switch to **renewable energy**, like wind and sunlight. Some people find that frightening, but honestly, I find it exciting."],["A","*Extract 4.* For me, everything is connected. [[3]] the Aral Sea, which shrank when people took more from its rivers than nature could replace. It was **a wake-up call**: every decision about **natural resources** has **long-term consequences**. If we **run out of** clean water, no amount of money can buy it
