 it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The interview is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress in space words (exploRAtion, ATmosphere, asTRONomy), and /ʊ/ or /əʊ/: could or code? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Will humans live on another planet one day?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about space, settlement and its costs. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most surprising idea they heard (use the wheel)."]},{id:"game",icon:"🪐",name:"The Orvanta Charter",min:18,lv:"c1",group:"3 assemblies of 5",kind:"five",roles:["Delegate · chair","Delegate · timekeeper","Delegate · vote counter","Delegate","Delegate"],desc:"Choose & Defend as a charter assembly: each student is the delegate of one group with a stake in Mars. Present, argue, swap seats, react to news from Mars and vote: which four of eight articles go into the founding charter of the first settlement? (Book: section 6 · Game School G6)",howto:["15 students = 3 assemblies of five, all at the same time, each with its own phone or laptop. Every student is a delegate; one also chairs, one keeps time, one counts the votes.","Before Round 1, the assembly opens the eight article cards. In Round 1, each delegate turns over one delegation card and presents it in 45 seconds.","Timing: articles 2 min · Delegations 4 min · Argue 3 min · Swap seats 3 min · News 2 min · Vote 2 min · Twenty years later 2 min.","Swap seats: everyone takes the delegation card of the student on their left. Six at a table? Use all six delegation cards; four at a table? Leave one out."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about which event a science club should hold in Space Week, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 71, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions and underline the key words. In an interview, the questions often ask **why** a speaker says something, **how she feels**, or what she **means**.","Press **Play the podcast**. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking meaning, and conceding (admitting a point, then coming back).","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","For question 4, I chose B. Amara wouldn’t go to Mars herself.","gives an answer"],["B","What makes you say that? She sounds really excited.","asks for evidence"],["A","She is, but she says, *On a one-way trip? Honestly, no.* She’d rather watch from Lagos.","quotes the text"],["B","Right: excited about the idea, but not ready to leave her family.","paraphrases"]],checks:[["Why does Mateo say *Hang on, do you mean that …?*","to check that he has understood Amara: the settlers would have to decide on their own."],["Which phrase does Amara use to admit that the man has a point, and then come back to her view?","Having said that, …"]]},pron:{ref:"Book: Lesson 71, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion**, the syllable is strong (*exploRAtion*, *coloniSAtion*). Many space words are strong at the start (*ATmosphere*, *AStronaut*), but watch the move: *AStronaut* → *asTRONomy*.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ʊ/ (*could*, *full*) or /əʊ/ (*code*, *foal*)?","/ʊ/ is short and does not move: lips a little round, then stop. /əʊ/ moves: start with a relaxed *uh* and glide to a round *oo*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *exploration*. Which syllable is strong?",""],["A","The second: ex-*PLO*-ra-tion?","a guess"],["T","Listen again: ex-plo-*RA*-tion. What comes after it?","the teacher gives a clue"],["A","*-tion*! So *RA* is strong.","uses the rule"],["T","Good. Now *astronaut* and *astronomy*.",""],["B","*AS*-tro-naut, but as-*TRON*-o-my: the stress moves.","notices the change"],["T","Yes! Now listen: *code*. First or second: *could* or *code*?",""],["B","Second: *code*. It glides; *could* is short.","listens for the glide"]],checks:[["Where is the stress in *colonisation*?","on SA: co-lo-ni-SA-tion (the syllable before -tion)."],["Where is the stress in *atmosphere*?","on AT: AT-mos-phere (at the start)."],["Which word glides from one sound to another: *pull* or *pole*?","*pole* /pəʊl/ glides; *pull* /pʊl/ is short and does not move."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*The way I see it*, *That said*, *What it all comes down to is*).","Make sure your answer has a clear **position**, a **contrast** (visiting and living), one **example** and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Mateo’s answer changed in 4/3/2",lines:[["mateo","Um, yes, but not soon. Visiting, living, different. Mars is cold, er, thin air. The space station, people live there months. So first, food. Not a backup plan.","Attempt 1 · 90 s · the key words, many pauses"],["mateo","I think humans will live on another planet, but not soon. Visiting a planet and living there are very different. Mars is cold and the air is thin. People already live for months on the space station, so it’s possible. But first a settlement must grow its own food. And Mars is not a backup plan.","Attempt 2 · 60 s · linking phrases"],["mateo","The way I see it, we will live on another planet one day, just not as soon as some people promise. Visiting Mars is one thing; living there is something else entirely. That said, crews already spend months on the space station, so we know people can survive far from home. What it all comes down to is this: Mars could become a second home, never a backup plan.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is space exploration worth the money?",lines:[["nur","**Personally, I’m convinced that** it is, as long as we share what we learn. **The thinking behind this is that** space research keeps **pushing the boundaries** of technology. **Look at** weather satellites: they warn whole countries about storms. **Having said that,** **launch costs** are huge, so every mission should have a clear purpose.","speaker · 1 minute"],["aziza","I heard six phrases: *Personally, I’m convinced that*, *The thinking behind this is that*, *pushing the boundaries*, *Look at*, *Having said that* and *launch costs*. That’s a full row: **Bingo!**","listener reports"],["nur","Six points plus three for the Bingo: nine!","count the points"],["aziza","Next time, try *a harsh environment*. It’s on my card, and it would fit a question about living on Mars.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you need exact numbers about space to win?","no: use ideas and reasons, and say “many”, “more” or “a long time” if you are not sure of a number."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*The club can only pay for one event …*).","Click the lines in order. Each line answers the line before. Aziza and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a space poster",lines:[["A","Our poster can show one thing: the Moon or Mars.","opens the topic"],["B","Mars is more exciting, isn’t it?","a reason"],["A","True, but people may actually visit the Moon sooner.","an argument"],["B","Then let’s put the Moon in front and Mars behind it, as the next step.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make assemblies of five. Choose a **chair**, a **timekeeper** and a **vote counter**; everyone is also a **delegate**.","**Articles (2 min):** turn over the **eight article cards** and read them aloud. Notice who each article protects, and what the catch is.","**Round 1 · Delegations (45 s each):** each delegate turns over one **delegation card** and presents it: its interest, its fear and its red line.","**Round 2 · Argue (3 min):** fight for the two articles your delegation needs most, and challenge one that worries you.","**Round 3 · Swap seats:** take the delegation card of the student on your **left**. Defend one article **as that delegation**, ideally one you would vote against.","**Round 4 · News from Mars:** the chair opens a news card. Which articles matter more now?","**Round 5 · Vote:** back in your own seat, each delegate votes for **four** articles. Click the four winners.","**Round 6 · Twenty years later:** as the first generation born on Mars, replace **one** article. Then everyone answers: should humans settle another planet at all?"],exTitle:"Sample game: Rounds 3, 5 and 6 at Assembly A",lines:[["","Chair: Leo (science board) · Timekeeper: Nur (first settlers) · Vote counter: Mateo (Earth funders) · Delegates: Aziza (countries without a space programme), Amara (planetary protection)",""],["","… Round 3 · Swap seats …",""],["aziza","(now speaking for the Earth funders) **Speaking for the funders, I’d argue that** “Science before profit” is too strict. **If Orvanta can never sell anything, it stays our guest forever.** I’d vote for it myself, but I can see why they wouldn’t.","defends another delegation’s view"],["amara","(now speaking for the first settlers) **From where the settlers stand,** protecting life is frightening: **what if the only ice we can reach is next to the microbes?**","speaks against her own position"],["","… Round 5 · Vote …",""],["mateo","(vote counter) Air and water seven votes, the right to return five, decisions on Mars four, protect any life four. **Those are our four articles.**","counts the votes"],["leo","(chair) **So the charter says nothing about land.** Delegates, can you live with that?","checks the result"],["","… Round 6 · Twenty years later …",""],["nur","(first generation born on Mars) **We would replace** “the right to return” **with** “No one owns the land”. **This is our home now; nobody should be able to buy it.**","replaces one article"],["amara","**Should humans settle Mars at all?** **Only if** we go as guests who protect what we find, **not as owners.**","answers the lesson question"]],checks:[["What do you do in Round 3, Swap seats?","take the delegation card of the student on your left and defend one article as that delegation, ideally one you would vote against."],["How many articles does the charter keep?","four of the eight."],["Can an article choose settlers because of their health, looks or origin?","no: the articles are about rules, rights and resources, never about who people are."]]},drills:{ref:"Book: Lesson 71 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Sending robots to study other planets is part of ___.",o:["space exploration","a backup plan","launch costs"],a:0},{q:"A short visit is not the same as ___ where people live for good.",o:["a permanent settlement","a one-way trip","a communication delay"],a:0},{q:"Mars has ___, so people outside would need a spacesuit.",o:["a thin atmosphere","a harsh atmosphere","a self-sufficient atmosphere"],a:0},{q:"Living underground could help to ___ radiation.",o:["shield people from","push the boundaries of","launch"],a:0},{q:"Freezing cold, dust and no air to breathe: Mars is ___.",o:["a harsh environment","a permanent settlement","microbial life"],a:0},{q:"A radio message to Earth takes minutes: there is ___.",o:["a communication delay","a one-way trip","a thin atmosphere"],a:0},{q:"If you can never come back, it is ___.",o:["a one-way trip","a round table","a backup plan"],a:0},{q:"Rockets are very expensive: ___ are still huge.",o:["launch costs","space exploration","microbial life"],a:0},{q:"Some people say Mars is ___ in case something goes wrong on Earth.",o:["a backup plan","a harsh environment","a launch cost"],a:0},{q:"Space research keeps ___ of what technology can do.",o:["pushing the boundaries","shielding","settling"],a:0},{q:"A settlement that grows its own food and makes its own water is ___.",o:["self-sufficient","one-way","permanent"],a:0},{q:"Tiny living things too small to see are called ___.",o:["microbial life","space exploration","a harsh environment"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Humans will live on Mars. → **Humans will be …(able to)**",a:"Humans will be able to live on Mars."},{p:"Humans will be able to live on Mars. → **By the end of the century, humans may …(have built)**",a:"By the end of the century, humans may have built a settlement on Mars."},{p:"Robots are exploring Mars now. → **Robots have been …(for years)**",a:"Robots have been exploring Mars for years."},{p:"We must protect Martian life. Otherwise, we may destroy it. → **unless**",a:"Unless we protect Martian life, we may destroy it."},{p:"The problem is not the rocket. It is the return trip. → **It isn’t …, it’s …**",a:"It isn’t the rocket, it’s the return trip."},{p:"The settlers need a say in their own lives. → **What the settlers need is …**",a:"What the settlers need is a say in their own lives."},{p:"We have never faced such a harsh environment. → **Never …(inversion)**",a:"Never have we faced such a harsh environment."},{p:"We learn more about Mars. We understand Earth better. → **The more …, the better …**",a:"The more we learn about Mars, the better we understand Earth."},{p:"If we found life on Mars, … → **we would have to …(stop)**",a:"If we found life on Mars, we would have to stop building."},{p:"Someone should have asked the settlers. → **The settlers should …(passive)**",a:"The settlers should have been asked."},{p:"Mars is cold. Its atmosphere is thin. → **Not only …, but …**",a:"Not only is Mars cold, but its atmosphere is thin too."},{p:"I wish I could see Earth from space. → **If only …**",a:"If only I could see Earth from space!"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I think people will live on Mars one day.",a:"Personally, I’m convinced that there will be a permanent settlement on Mars one day."},{p:"The reason is that the soil stops radiation.",a:"The thinking behind this is that the soil can shield people from radiation."},{p:"For example, the space station.",a:"Look at the space station: crews from many countries live and work there together."},{p:"Mars is a very difficult place to live.",a:"Mars is a harsh environment with a thin atmosphere."},{p:"Rockets cost a lot of money.",a:"Launch costs are still enormous."},{p:"You’re right, but I still think we should go.",a:"You have a point. Having said that, I still believe we should go."},{p:"Do you mean that Earth has no say?",a:"Hang on, do you mean that Earth has no say at all?"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ In Mars it is very cold.",o:["On Mars it is very cold.","At Mars it is very cold.","In the Mars it is very cold."],a:0,why:"on Mars, on the Moon, on Earth (a calque of “Marsda”)"},{q:"✗ Humans will can live on Mars one day.",o:["Humans will be able to live on Mars one day.","Humans will can to live on Mars one day.","Humans can will live on Mars one day."],a:0,why:"two modal verbs cannot stand together: will be able to"},{q:"✗ We spend too much money for rockets.",o:["We spend too much money on rockets.","We spend too much money to rockets.","We spend too many money for rockets."],a:0,why:"spend money on something (a calque of “… uchun pul sarflamoq”)"},{q:"✗ Mars planet is very far from us.",o:["The planet Mars is very far from us.","Mars the planet is very far from us.","Planet Mars are very far from us."],a:0,why:"the planet Mars, or simply Mars (a calque of “Mars sayyorasi”)"},{q:"✗ This is a very bad news for the settlers.",o:["This is very bad news for the settlers.","These are very bad news for the settlers.","This is a very bad new for the settlers."],a:0,why:"news is uncountable: no a, and it takes is"},{q:"✗ The life on another planet would be hard.",o:["Life on another planet would be hard.","A life on another planet would be hard.","The lives on another planet would be hard."],a:0,why:"no the when we talk about life in general"},{q:"✗ Astronauts must to wear a spacesuit outside.",o:["Astronauts must wear a spacesuit outside.","Astronauts must wearing a spacesuit outside.","Astronauts musts wear a spacesuit outside."],a:0,why:"must + verb without to"},{q:"✗ I am agree with the science board.",o:["I agree with the science board.","I am agreeing with the science board.","I agree to the science board."],a:0,why:"agree is a verb: I agree (not “I am agree”)"}]},{title:"Stress: space words",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"travelling to new places to find out about them",o:["exploRAtion","EXploration"],a:0,why:"Before -tion, the syllable is strong."},{q:"people settling in and controlling a new place",o:["coloniSAtion","COlonisation"],a:0,why:"Before -tion, the syllable is strong."},{q:"the layer of gases around a planet",o:["ATmosphere","atmosPHERE"],a:0},{q:"a person trained to travel into space",o:["AStronaut","astroNAUT"],a:0},{q:"the science of stars and planets",o:["asTRONomy","AStronomy"],a:0,why:"The stress moves: AStronaut, but asTRONomy."},{q:"the force that pulls things towards the ground",o:["GRAvity","graVIty"],a:0},{q:"a machine that goes round the Earth and sends back information",o:["SATellite","satelLITE"],a:0}]}],Jf={cardsStep:"Articles",cardsTitle:"Article cards",cardsHint:"Turn over all eight articles, one by one, and read each one aloud to your assembly. Look at the lines “Who it protects” and “The catch”. The charter can keep only four.",backWord:"Article",hiddenLabel:"Assembly tip",hiddenAll:"Show all assembly tips",questionWord:"Delegation",questionTitle:"Delegation cards",questionHint:"Each delegate turns over **one** delegation card and keeps it for the whole assembly. Present it in **45 seconds**: what your delegation wants, what it fears and its **red line**. In Round 3, you will speak for the card on your left.",questionHelp:{b2:["We are …, and what we want most is …","We are worried that …","We can never accept …"],c1:["Our delegation has one clear interest: …","What keeps us awake at night is …","Our red line is simple: …"]},twistWord:"News",twistTitle:"News from Mars",twistHint:"The chair opens one news card and reads it aloud. Each delegate says in one or two sentences what the news means for their delegation. Which articles matter **more** now, and which **less**? Does anyone want to change their vote?",twistHelp:{b2:["This news shows that we need …","For my delegation, this means …","I’ve changed my mind about …"],c1:["In light of this news, … can no longer be left out.","This puts … in a completely different light.","I’m prepared to rethink my vote, provided that …"]},voteTitle:"Charter vote board",voteHint:"Go back to your own seat and your own delegation. Each delegate votes for four articles (one vote each) and gives one reason. Count the votes with + and −, then click the four articles that go into the Orvanta Charter. Equal votes? One more argument each, then vote again between those articles only.",capacity:4,teamWord:"Assembly",teamIcon:"",teamKind:"five",teams:3,doneText:"Now go on to Round 6: twenty years later, the first generation born on Mars may replace one article."},Kf=[{name:"Round 1 · Delegations",lv:"b2p",bloom:"Understand / Apply",by:"amara",seconds:45,tool:"questions",q:"Turn over **one delegation card**. Present your delegation to the assembly in **45 seconds**: its **interest**, its **fear**, and its **red line** (what it can never accept).",help:{b2:["We are …, and what we want most is …","We are worried that …","We can never accept …"],c1:["Our delegation has one clear interest: …","What keeps us awake at night is …","Our red line is simple: …"]},model:"We are the planetary protection guardians, and our delegation has one clear interest: to make sure that the first humans on Mars do not destroy the very thing we went there to find. Mars may have, or may once have had, tiny forms of life, and a careless drill could wipe out the evidence forever. What keeps us awake at night is the idea that one mistake could never be undone. Our red line is simple: if we find signs of life, we stop and study before we build."},{name:"Round 2 · Argue",lv:"c1",bloom:"Analyse / Evaluate",by:"leo",seconds:180,q:"Fight for the **two articles** your delegation needs most, and **challenge one** that worries you. When someone challenges your article, answer with a reason, not just “I disagree”.",help:{b2:["We need … because …","I’m worried about …, because …","That’s true, but …"],c1:["The strongest case for … is that …","With respect, that article ignores …","I take your point, but it doesn’t change the fact that …"]},model:"For the science board, the strongest case for “Protect any life we find” is that it may be the most important discovery in human history, and we would only get one chance to make it properly. The second article we need is “Science before profit”, because a crater full of drills is a crater nobody can study. With respect, “Decisions are made on Mars” worries us: a small council of tired settlers might choose the easy option, not the wise one. I take your point that Earth is far away, but distance is not a reason to ignore expert advice."},{name:"Round 3 · Swap seats",lv:"c1",bloom:"Evaluate",by:"nur",seconds:60,q:"Take the **delegation card of the student on your left**. Now speak **as that delegation**: defend one article it would want, ideally **one you would vote against**. Then say, in one sentence, what you understand better now.",help:{b2:["Speaking for …, I think …","For them, the most important thing is …","Now I understand why …"],c1:["Speaking for …, I’d argue that …","From where they stand, it makes perfect sense to …","I wouldn’t vote for it myself, but I can see why …"]},model:"Speaking for the Earth funders, I’d argue that “Decisions are made on Mars” goes too far, at least for now. From where they stand, it makes perfect sense: their countries and taxpayers are paying for every rocket, every greenhouse and every spare part, and they will have to explain that spending at home. If the settlers can decide everything, the funders have no way to protect that investment. I wouldn’t vote for their view myself, because I believe the settlers need to decide their daily lives. But now I understand why the funders want a say in the big questions."},{name:"Round 4 · News from Mars",lv:"c1",bloom:"Analyse",by:"mateo",seconds:0,tool:"twists",q:"The chair opens a **news card**. What does the news mean for **your delegation**? Which articles become more important, and which less? Does it change your vote?",help:{b2:["This news shows that we need …","For my delegation, this means …","I’ve changed my mind about …"],c1:["In light of this news, … can no longer be left out.","This puts … in a completely different light.","I’m prepared to rethink my vote, provided that …"]},model:"For the first settlers, this dust storm is not a story on the news; it is our life. With the sky dark for weeks, the solar panels give us far less power, and every decision about heat and air is urgent. In light of this news, “Air and water belong to everyone” can no longer be left out: in a crisis, nobody should be able to sell oxygen to the highest bidder. It also puts “Decisions are made on Mars” in a completely different light. We cannot wait for Earth to tell us which room to heat."},{name:"Round 5 · Vote",lv:"c1",bloom:"Evaluate",by:"aziza",seconds:0,tool:"decide",q:"Back in your own seat, vote for **four articles** and give a reason for each. Then count the votes and click the four articles of the **Orvanta Charter**.",help:{b2:["I vote for … because …","… is important, but not as important as …","I can’t vote for … because …"],c1:["On balance, the charter can’t do without …","It’s a hard call, but … falls short because …","My final vote goes to …, for one simple reason: …"]},model:"On balance, the charter can’t do without “Air and water belong to everyone”: on Mars, losing air is not an inconvenience, it is the end. My second vote goes to “Places for every country”, because otherwise Mars becomes one more prize for the countries that were already rich. Third, the right to return: nobody should feel trapped, however beautiful the view. My final vote goes to “No one owns the land”, for one simple reason: the people who arrive later deserve the same planet as the people who arrive first. It’s a hard call to leave out “Protect any life we find”, but I hope the science board will defend it anyway."},{name:"Round 6 · Twenty years later",lv:"c1",bloom:"Create",by:"leo",seconds:120,q:"Twenty years have passed. Your assembly now speaks as **the first generation born in Orvanta**: agree on **one article to replace** (with one of the articles left out, or a new one you write) and give the reason. Then each student answers the lesson question in 30 seconds: **should humans settle another planet at all?**",help:{b2:["We want to change … to …, because …","For people born here, … matters more.","I think humans should / shouldn’t …, because …"],c1:["As the first generation born on Mars, we would replace … with …","The founders couldn’t have known that …","If you ask me, settling another planet is only right if …"]},model:"As the first generation born on Mars, we would replace “The right to return” with “No one owns the land”. The founders couldn’t have known that, for us, Earth would not be home: you cannot return to a place you have never been. What we need now is the promise that nobody can buy the ground under our feet. And should humans settle another planet at all? If you ask me, it is only right if we go to learn and to share, not to own, and if we look after Earth just as carefully as we look after Mars."}],_f=[{e:"🗳",n:"Decisions are made on Mars",r:"Self-rule · a council of settlers",lines:[["What it says","Daily life in Orvanta is run by a council that the settlers elect. Earth decides only about money and new missions."],["Who it protects","The settlers, who cannot wait minutes for every answer from Earth."],["The catch","At first, Earth pays for almost everything and may not want to pay without a say."]],x:"Look for a middle way: which decisions must be made on Mars at once, and which can wait for Earth?"},{e:"🚀",n:"The right to return",r:"Freedom · a way home",lines:[["What it says","Any settler who wants to go back to Earth gets a place on a returning ship, whatever the reason."],["Who it protects","Settlers who miss their families, face an emergency at home or simply change their minds."],["The catch","Return trips are rare and very expensive; a place kept free may travel empty."]],x:"Without this article, Orvanta could feel like a prison. Ask the others: who would sign up for that?"},{e:"💧",n:"Air and water belong to everyone",r:"Life support · never for sale",lines:[["What it says","No person or company may own, sell or cut off the air, water, heat or power of Orvanta."],["Who it protects","Every settler, especially anyone with little money or influence."],["The catch","Someone has to pay for the machines that make air and water. Who, if nobody may charge for them?"]],x:"On Mars, losing air is not an inconvenience; it is the end. This is a strong argument in a crisis."},{e:"🔬",n:"Protect any life we find",r:"Science and ethics · stop and study",lines:[["What it says","If we find signs of life, even tiny microbes, all building and digging nearby stops until scientists agree it is safe to continue."],["Who it protects","Any life on Mars, and the chance to answer one of the biggest questions in science."],["The catch","Work could stop for years, and the settlers may need that land and ice to survive."]],x:"Ask the assembly: if there is life on Mars, who speaks for it? And how do we protect Earth from anything we bring back?"},{e:"🏔",n:"No one owns the land",r:"Land · use it, never own it",lines:[["What it says","Land on Mars can be used and shared, but no country, company or person can own it or sell it."],["Who it protects","Future settlers, and countries that arrive later."],["The catch","Companies may not invest if they can never own anything."]],x:"On Earth, an international treaty already says that no country can claim the Moon or a planet as its own. Is that enough for a settlement where people live?"},{e:"🌍",n:"Places for every country",r:"Fairness · not only the rich",lines:[["What it says","Places for settlers and scientists are shared among many countries, not only the ones that paid the most."],["Who it protects","Countries without a space programme, and young people from everywhere."],["The catch","The biggest funders may pay less if they get fewer places."]],x:"Ask who benefits from Mars: only those who can afford rockets, or all of humanity?"},{e:"⛏",n:"Science before profit",r:"Resources · limits on mining",lines:[["What it says","Mining is allowed only for what the settlement needs. Selling anything from Mars to Earth needs the approval of the science board."],["Who it protects","The landscape, important scientific sites and future generations."],["The catch","Without trade, Orvanta may depend on Earth’s money forever."]],x:"A settlement that never earns anything is always a guest. Is that a problem, or a protection?"},{e:"💬",n:"One working language, many cultures",r:"Language · safety and identity",lines:[["What it says","Every settler learns one shared working language for safety. Schools also teach the settlers’ own languages, and every culture’s celebrations are welcome."],["Who it protects","Everyone in an emergency, and every culture in daily life."],["The catch","Settlers whose first language is chosen have an easy start; the others have to work harder."]],x:"Which language should it be, and who decides? Crews from different countries already have to agree on this in space today."}],$f=[{t:"Dust storm: a huge dust storm darkens the sky over Orvanta for weeks. The solar panels make far less power, and everyone has to save energy.",q:"What does the storm mean for your delegation? Which articles matter more now, and which could wait?",by:"mateo",m:"For the first settlers, this storm is our life, not a news story. With the sky dark for weeks, every decision about heat and air is urgent, so “Air and water belong to everyone” can no longer be left out. It also shows why “Decisions are made on Mars” matters: we cannot wait for Earth to tell us which room to heat."},{t:"Message delay: a fire alarm goes off in the greenhouse. The settlers send a question to Earth, but because a radio message takes minutes each way, they have put the fire out before the answer arrives.",q:"Who should make decisions in Orvanta? Does this news change your vote?",by:"amara",m:"This puts “Decisions are made on Mars” in a completely different light. Earth’s experts are brilliant, but in an emergency, minutes are a very long time. I still think Earth should have a say about money and new missions, but daily decisions, and certainly emergencies, belong to the people on the spot."},{t:"Possible signs of life: a drill brings up ice with chemical traces that might come from tiny microbes, or might not. Scientists say they need time to be sure. The site is next to the settlement’s best ice mine.",q:"Should work at the ice mine stop? Who should decide?",by:"leo",m:"For the science board, this is the moment we have been waiting for, and the moment we feared. If these traces really come from life, we would be the generation that answered one of humanity’s oldest questions. So yes, the mine should pause, but not forever: the settlers need water, and we owe them a quick and honest answer. This is exactly why “Protect any life we find” belongs in the charter."},{t:"Settlers ask for self-rule: the settlers vote to make all their own laws. “We live here; Earth only visits,” they say. The Earth funders warn that they may stop paying.",q:"Are the settlers right? What would you say to them, and to the funders?",by:"nur",m:"I understand the settlers completely: they are the ones who live with every decision. But the funders have a point too, because the settlement still depends on Earth for spare parts and new arrivals. In light of this news, the charter needs a clear line: daily life decided on Mars, money and missions agreed together, and a date when the settlers can ask for more."},{t:"A company’s offer: a private company offers to build a new greenhouse dome for the whole settlement, if it can mine and sell metals from the crater next to Orvanta.",q:"Should the assembly accept the offer? Which articles does it test?",by:"aziza",m:"The offer is tempting, because a new greenhouse would mean more food and less dependence on Earth. But it tests two articles at once: “Science before profit” and “No one owns the land”. I’m prepared to rethink my vote, provided that the company mines only what has been agreed, owns nothing, and leaves any scientific site untouched. A greenhouse is a gift; a crater sold for ever is not."},{t:"A new country asks to join: a country with no space programme of its own asks to send its first settlers and scientists to Orvanta. It cannot pay as much as the others.",q:"Should Orvanta welcome them? What does this news mean for “Places for every country”?",by:"amara",m:"This news shows exactly why “Places for every country” matters. If Mars only welcomes the countries that can pay the most, we are taking Earth’s old inequalities to a new planet. The new settlers may not bring money, but they will bring skills, ideas and new ways of solving problems, and a settlement that wants to survive needs all of those."}],ep=[{t:"The Earth funders",q:"**Who you are:** the countries and taxpayers who pay for the mission. **Interest:** results to show at home and a fair return for the money. **Fear:** money disappearing into a project nobody controls. **Red line:** no charter that leaves Earth without any say.",by:"mateo",m:"We are the Earth funders: the countries, and in the end the ordinary taxpayers, who pay for every rocket and every spare part. What we want most is a mission we can be proud of, with results we can show at home. What keeps us awake at night is money disappearing into a settlement nobody controls. Our red line is simple: Earth must keep a say in the big decisions."},{t:"The first settlers",q:"**Who you are:** the people who will actually live in Orvanta. **Interest:** safety and a say in their own daily lives. **Fear:** being ruled by people who have never been there. **Red line:** no charter without the right to return.",by:"nur",m:"We are the first settlers, the people who will wake up every morning in Orvanta. Our delegation has one clear interest: to stay safe and to have a say in our own lives. We are worried about being ruled by people a whole planet away who have never breathed our recycled air. And our red line is simple: anyone who wants to go home must be able to."},{t:"The science board",q:"**Who you are:** researchers from many countries. **Interest:** studying Mars carefully before it changes. **Fear:** drills and diggers arriving before the big questions are answered. **Red line:** no mining near important scientific sites without their approval.",by:"leo",m:"We are the science board, researchers from many countries. Mars is a natural laboratory: its rocks may tell us how planets change, and perhaps whether life ever began there. What we fear most is that drills and diggers will arrive before the big questions are answered. Our red line: nobody mines near an important scientific site without our approval."},{t:"The planetary protection guardians",q:"**Who you are:** experts who protect Mars from Earth, and Earth from Mars. **Interest:** keeping Mars as it is until we know whether it has life, and bringing nothing dangerous back. **Fear:** one careless mistake that can never be undone. **Red line:** protect any life we find.",by:"amara",m:"We are the planetary protection guardians. We protect Mars from Earth, and Earth from Mars. What we want is simple: no human footprint where life might be hiding, and nothing dangerous brought home. What keeps us awake at night is one careless mistake that can never be undone. Our red line: if we find any sign of life, we stop and study."},{t:"Countries without a space programme",q:"**Who you are:** the voice of the many countries that do not launch rockets of their own. **Interest:** fair places for their people and shared knowledge. **Fear:** a new race in which the richest win again. **Red line:** no charter that keeps Mars for a few countries only.",by:"aziza",m:"We speak for the many countries that do not launch rockets of their own. That does not mean we have no stake in the sky: in my country, Uzbekistan, Ulugh Beg built an observatory in Samarkand centuries ago to study the stars. What we want now is a fair share of places and knowledge. Our red line: Mars must not become a prize for a few rich countries."},{t:"The first generation to be born on Mars",q:"**Who you are:** an imagined voice from the future, the children who will one day be born in Orvanta. **Interest:** a home of their own, not someone else’s colony. **Fear:** rules written for them by people who have never lived there. **Red line:** they must be able to change the charter.",by:"leo",m:"We are not born yet, but one day Orvanta will be the only home we know. We don’t want to grow up in someone else’s colony, following rules written by people who left long ago. Our interest is a home that is truly ours. Our red line: whatever you decide today, the next generation must be able to change it."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Would you like to travel into space one day? Why or why not?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I would love to see Earth from space, but only for a short trip."],["Point","**The main reason is that** I would miss my family and my friends in Navoi too much."],["Example","**For example,** I already feel homesick after a week in Tashkent!"],["Close","**So, all in all,** a few days in orbit would be more than enough for me."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"amara",q:"Why do people want to explore space?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first reason is** simple curiosity: people have always wanted to know what is out there."],["","**Then,** there is science: we learn a lot about our own planet by studying others."],["","**What is more,** space technology often helps us on Earth, for example with weather forecasts."],["","**For instance,** farmers in many countries use satellite forecasts to decide when to plant."],["","**Finally,** some people hope that one day humans will have a second home."],["","**In short,** we explore space because we are curious, practical and a little worried about the future."]],keys:["the first reason is","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"What would be the hardest thing about living on Mars?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that the hardest thing would not be the cold, but the distance."],["","To begin with, a message home would take minutes, so a normal conversation with your family would be impossible."],["","On top of that, you couldn’t simply fly home if something went wrong."],["","A case in point is my grandmother, who still remembers the year she worked far from Hamburg and could only phone home once a week."],["","Admittedly, the thin air, the radiation and the dust would be dangerous too."],["","On balance, though, a broken machine can be repaired, but missing home is much harder to fix."]],extra:"My favourite film about space has a really exciting soundtrack.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"Should private companies be allowed to go to Mars?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","private companies can help, but they shouldn’t make the rules on their own."],["First of all,","they often bring new money and new ideas into space travel."],["Besides,","competition between them could push the boundaries of technology."],["For example,","a company that builds better solar panels for Mars could also make them cheaper for homes in Malaysia."],["However,","a company’s first duty is to its owners, not to humanity."],["Ultimately,","Mars should be open to companies, but under rules that everyone has agreed."]],distractors:["Similarly,","Otherwise,"],keys:["help, not rule","new money and ideas","better technology","rules for everyone"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"Will humans live on another planet one day?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["yes, but not soon","visiting ≠ living","cold, thin air, radiation","the space station: months in orbit","self-sufficient first","a second home, not a backup plan"],model:"The way I see it, humans will live on another planet one day, just not as soon as some people promise. Visiting a planet is one thing; living there is something else entirely. Mars is freezing, its air is thin and mostly carbon dioxide, and its surface receives far more radiation than ours. That said, crews already spend months on the International Space Station, so we know people can survive far from home with the right technology. The real test will be whether a settlement can become self-sufficient, growing its own food instead of waiting for deliveries from Earth. What it all comes down to is this: Mars could become a second home, but never a backup plan for a planet we fail to look after."}],np={title:"Exam Part 2 practice: Space Week",situation:"Your university’s science club has money for one event in Space Week: a stargazing night with telescopes, a talk by a scientist who works with Mars rovers, or a competition to design a model Mars base. Aziza and Leo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"leo",lines:[["A","The club can only pay for one event in Space Week. Shall we start with the stargazing night?"],["B","Sure. Everyone loves looking through a telescope, don’t they?"],["A","They do, although the weather could ruin the whole evening."],["B","Fair point. What about the talk? A real scientist would be inspiring."],["A","True, but people would only listen; they wouldn’t do anything themselves."],["B","And the design competition? Teams could build a model base together."],["A","That’s a strong argument: it mixes science, art and teamwork."],["B","So shall we go for the competition, and invite the scientist to judge it?"],["A","Agreed. That way, we get the best of both."]],phrases:{Start:["The club can only pay for one …","Shall we start with …?"],Clarify:["…, don’t they?","They do, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your town’s library can open **one** space corner: a virtual-reality walk on Mars, a small rooftop telescope, or a club that builds model rockets. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["Personally, I’m convinced that …","space exploration","The thinking behind this is that …","a harsh environment","Look at …","launch costs","Having said that, …","a permanent settlement","push the boundaries"],B:["a backup plan","launch costs","Having said that, …","space exploration","Personally, I’m convinced that …","a one-way trip","Look at …","a harsh environment","The thinking behind this is that …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Personally, I’m convinced that …","space exploration","The thinking behind this is that …","a harsh environment","Look at …","launch costs","Having said that, …","a permanent settlement","push the boundaries","a backup plan"," t the last speaker meant before you answer: Hang on, do you mean that …?"],ap={title:"Step Up Speaking Club podcast: Tomorrow on Mars",format:"Interview · like exam Part 4 (multiple choice)",intro:"Mateo interviews Amara, who has just helped run a student exhibition about living on Mars.",tip:["Listen for attitude","Many questions ask how a speaker feels or why she says something. Listen for words like honestly, but, he has a point: they often show the speaker’s real attitude."],A:"mateo",B:"amara",lines:[["A","My guest is Amara, who helped run “Tomorrow on Mars”, a student exhibition in Lagos. Amara, will humans really live there?"],["B","[[0]] we will, but not as soon as the films suggest. **Space exploration** is one thing; **a permanent settlement** is something else entirely. Mars is freezing, it has **a thin atmosphere**, mostly carbon dioxide, and nobody could step outside without a spacesuit."],["A","So what did your model base look like?"],["B","Mostly underground: in such **a harsh environment**, that’s the safest place. [[1]] the soil above your head can **shield you from radiation**."],["A","And if something went wrong?"],["B","You’re on your own. There’s **a communication delay**: a radio message to Earth takes minutes, not seconds, so you can’t just call for help and wait. [[2]] our control-room game: visitors had to fix a broken pump before Earth even heard about it."],["A","[[3]] the settlers would have to make their own decisions?"],["B","Exactly. So who is in charge: Earth, or the people who live there?"],["A","Did anyone say it isn’t worth it?"],["B","Every day! One man said Mars must never become **a backup plan** for humanity, and the **launch costs** would build a lot of schools. He has a point. [[4]] it isn’t either-or: space research keeps **pushing the boundaries** of what we can do here, like satellites that warn farmers about storms."],["A","Would you go?"],["B","On **a one-way trip**? Honestly, no: I’d miss my family too much. But once a
