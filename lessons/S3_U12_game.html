 a dream into a plan."],rule:"Rule of respect: everyone’s goals are different, and every goal is worth taking seriously. We discuss Otabek’s choices, not our classmates’ results or private plans."}},Gf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Two Club speakers on the podcast (exam Part 3): who says what? Notice how they describe first steps and check meaning, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read statements 1–4 first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Nur, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The text is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word stress in words about goals, and /əʊ/ or /ɔː/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer about realistic goals in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for talking about goals and plans. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the most realistic goal they heard (use the wheel)."]},{id:"game",icon:"🏁",name:"The 100-Day Goal",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Scene reader","Speaker","Speaker","Speaker","Decision recorder"],desc:"Choose Your Path: guide Otabek through 100 days towards his speaking exam, one decision at a time. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team can follow a different path.","Each student turns over one perspective card (Dreamer, Realist, Coach, Planner, Friend) and keeps it for the whole game.","Timing: cards 1 min · Set the goal 3 min · 100 days 10 min (four scenes and an ending) · Look back 4 min.","Only one projector? The teacher shows the scene, teams discuss for one minute, and the class votes. The team with the best reason explains the choice."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping first-year students reach their goals, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 12, section 2 · Listen and Notice",steps:["**Before you listen:** read statements 1–4 and guess who probably said each one: Mateo, Amara or both of them.","Press **Play the podcast**. The statements use different words from the speakers: match the idea, not the words. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, describing a first step, reason, checking meaning and example.","**Your turn:** listen to Nur, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Number 3 is Amara. She listened to her old recording.","gives an answer"],["B","Yes, but what does Mateo say next?","asks for more"],["A","“When I’m tired of a project, I look at my first photos.”","checks the text again"],["B","Same idea, different words. So it’s both of them.","paraphrases"]],checks:[["Why do the statements in Part 3 use different words from the speakers?","the test checks the idea, not the words. Listen for a paraphrase: “look at my first photos” = “look back at old work”."],["Which phrase does Mateo use to check meaning?","Hang on, do you mean that …?"]]},pron:{ref:"Book: Lesson 12, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the tip: in words ending in **-tion** and **-ic**, the stress is on the syllable **just before** the ending (*motiVAtion, reaLIStic*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /əʊ/ or /ɔː/?","Say **both** words. /əʊ/ **moves**: your lips close into a circle at the end (*goal, coat*). /ɔː/ is **one long sound**, and your lips stay round (*caught, law*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *motivation*. Which part is strong?",""],["A","*MO*? It’s the first part.","a first guess"],["T","Not quite. The word ends in *-tion*, so the stress is just before it: *moti-VA-tion*.","the teacher gives the tip"],["B","So it’s the same with *-ic*: *rea-LIS-tic*!","uses the tip"],["T","Exactly. Now a sound. Listen: *goal*. Does your mouth move?",""],["A","Yes, it starts open and ends with round lips: *goal*.","notices the movement"],["T","Good. Now *coat* or *caught*? Listen: *caught*.",""],["B","*Caught*: one long sound, and my lips don’t move.","checks the mouth"]],checks:[["Where is the stress in *motivation*?","on VA: moti-VA-tion. Before -tion, the syllable is strong."],["Where is the stress in *realistic*?","on LIS: rea-LIS-tic. Before -ic, the syllable is strong."],["What is the difference between /əʊ/ in *goal* and /ɔː/ in *law*?","/əʊ/ moves and ends with small round lips; /ɔː/ is one long sound with lips that stay round."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think … goals must be real, because, um, if not, you stop … For example, my cousin, she wanted to learn coding, and, um, she stopped … So, real goals.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, realistic goals are important. The main reason is that people give up when a goal is too big. For example, my cousin in Bukhara wanted to learn coding in one month, and she stopped after a week. Then she made a smaller plan and finished it. So realistic goals work better.","Attempt 2 · 60 s · linking words"],["aziza","In my view, a realistic goal is the only kind of goal that actually gets achieved. When a goal is far too big, people lose motivation after the first difficult week. My cousin in Bukhara wanted to learn coding in a month and gave up after seven days; with a slower plan of one lesson a day, she finished the whole course. All things considered, a big dream needs realistic steps.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What is one goal you have for this year?",lines:[["leo","Well, **my main goal is to** play the piano at my sister’s wedding in June. **I’m aiming to** learn three songs. **The first step is** one lesson a week with a teacher in Hamburg. **I keep track of my progress by** recording myself every Saturday. And **to stay motivated, I** play for my grandmother. She’s a very kind audience!","speaker · 1 minute"],["amara","I heard five phrases: *My main goal is to*, *I’m aiming to*, *The first step is*, *I keep track of my progress by* and *To stay motivated, I*. That’s the top row and more: **Bingo!**","listener reports"],["leo","Great! Five points plus three for the Bingo: eight points.","count the points"],["amara","Next time, try *If things go wrong, I …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, … shall we start with …?*).","Click the lines in order. Each line answers the line before. Leo and Nur take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a goal for the speaking club",lines:[["A","So, what should our club’s goal be for this month?","opens the topic"],["B","How about everyone giving a two-minute talk by the end of the month?","an idea"],["A","Nice, but some people are shy. What about one minute first, then two?","reacts + a new idea"],["B","Agreed. Let’s put the dates in the group chat tonight.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · sample game in section 6",steps:["Make teams of five. Each student turns over one **perspective card** and keeps that role for the whole game.","**Round 1 · Set the goal (3 min):** turn Otabek’s dream into one clear goal: specific, measurable, realistic, with a deadline.","**Round 2 · 100 days (10 min):** one student reads the scene aloud. **Each perspective speaks once.** Then vote, click your option and say why.","Every path has **four scenes** and then an ending. There is no “game over”: every ending shows what Otabek learned.","At the ending, answer the reflection question together. Want to see another path? Press **Start again** after the lesson.","**Round 3 · Look back (4 min):** give three tips to a first-year student with a big goal. One student presents them in one minute."],exTitle:"Sample game: Team Summit plays Scene 2",lines:[["","Scene 2 · Day 15 — Dreamer Mateo · Realist Leo · Coach Amara · Planner Aziza · Friend Nur",""],["nur","(reads the scene aloud) … Option A: listen to the first and the latest recordings. Option B: join the speaking club. Option C: ask Ms Karimova for advice.","one student reads the scene and the options"],["mateo","**Imagine Otabek on Day 100:** he’s chatting with guests at the conference. He needs to remember that dream right now!","Dreamer: the big picture"],["leo","**Let’s be realistic:** two weeks is a very short time. Of course he doesn’t feel a big change yet.","Realist: what is possible"],["amara","**To keep him going,** he needs to see his progress. Hearing his first recording again could really lift his mood.","Coach: motivation"],["aziza","**Step one is** comparing the two recordings tonight, **and by Day 20 he should** write down three things he does better.","Planner: steps and deadlines"],["nur","**If I were his friend, I’d say:** go to the club! Talking to real people is more fun than talking to your phone.","Friend: what Otabek wants"],["leo","Both are good, but A costs nothing and takes ten minutes. Shall we vote?","the Realist moves the team on"],["aziza","A: four votes, B: one vote. Mateo, can you explain our choice?","the team votes"],["mateo","**On balance, it makes more sense to** choose A, because Otabek needs proof that his plan is working before he changes anything.","the team clicks A and explains why (C1 phrase)"]],checks:[["How many times does each perspective speak in a scene?","once, before the team votes."],["What does the Planner talk about?","the next step and how Otabek can measure his progress by a deadline."],["Can your team lose the game?","no: every path ends with something Otabek learned."]]},drills:{ref:"Book: Lesson 12 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"At the start of the semester, Otabek ___: a B2+ result in speaking.",o:["set a goal","made progress","had a setback"],a:0},{q:"Ten new words a day is ___ for a busy student.",o:["a long-term goal","a realistic target","a deadline"],a:1},{q:"A big goal is easier when you ___ small steps.",o:["stick it to","break it down into","keep track of"],a:1},{q:"I write my score in a notebook every week to ___ my progress.",o:["keep track of","lose","set"],a:0},{q:"After a bad mock test, it’s easy to ___ and want to give up.",o:["stay motivated","lose motivation","make progress"],a:1},{q:"A bad result is just ___; it isn’t the end of the journey.",o:["a setback","a target","a deadline"],a:0},{q:"Having a study partner helps me ___ when the work gets boring.",o:["lose motivation","set a deadline","stay motivated"],a:2},{q:"It’s hard to ___ when your friends invite you out every evening.",o:["stick to the plan","break it down","set a goal"],a:0},{q:"Her English is much better now. She has ___ this year.",o:["made a lot of progress","had a lot of setbacks","kept a lot of track"],a:0},{q:"Speaking fluently is his ___: it may take a few years.",o:["first step","long-term goal","setback"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I want to pass the exam. → **I’m aiming**",a:"I’m aiming to pass the exam."},{p:"I’m aiming to pass the exam. → **by the end of the semester**",a:"I’m aiming to pass the exam by the end of the semester."},{p:"I’m aiming to pass the exam by the end of the semester. → **He**",a:"He’s aiming to pass the exam by the end of the semester. (He → he’s!)"},{p:"She has made a lot of progress. → **a question: Has …?**",a:"Has she made a lot of progress?"},{p:"Has she made a lot of progress? → **this month**",a:"Has she made a lot of progress this month?"},{p:"Has she made a lot of progress this month? → **a negative statement**",a:"She hasn’t made much progress this month. (negative → much, not a lot of, is more natural)"},{p:"If I practise every day, I’ll pass. → **study with a partner**",a:"If I study with a partner, I’ll pass. (If + present, will + verb!)"},{p:"If I study with a partner, I’ll pass. → **stay motivated**",a:"If I study with a partner, I’ll stay motivated."},{p:"I’ve been practising for two weeks. → **since September**",a:"I’ve been practising since September."},{p:"I’ve been practising since September. → **a question: How long …?**",a:"How long have you been practising?"},{p:"It’s important to set a deadline. → **It’s easy to forget**",a:"It’s easy to forget to set a deadline."},{p:"Don’t give up. → **learning English**",a:"Don’t give up learning English. (give up + -ing)"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I want to pass the exam.",a:"I’m determined to pass the exam. / I’m aiming to pass the exam."},{p:"First, I will …",a:"The first step is to … / My first step will be to …"},{p:"I write down what I do every day.",a:"I keep track of my progress by writing down what I do every day."},{p:"I don’t want to stop.",a:"I’m not going to give up. / I want to keep going."},{p:"It was a bad result, but it’s OK.",a:"It was a setback, but it’s part of the process."},{p:"It’s a big goal, so I do a little every day.",a:"It’s a big goal, so I’ve broken it down into small daily steps."},{p:"My English is better now.",a:"I’ve made real progress with my English."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ This year I made a goal to read ten English books.",o:["This year I did a goal to read ten English books.","This year I set a goal to read ten English books.","This year I put a goal for reading ten English books."],a:1,why:"We **set** a goal (or set ourselves a goal), not make or do."},{q:"✗ I want that I pass the speaking exam.",o:["I want to pass the speaking exam.","I want passing the speaking exam.","I want that pass the speaking exam."],a:0,why:"want + to + verb (not want that …)"},{q:"✗ If I will practise every day, I will pass.",o:["If I practise every day, I pass will.","If I would practise every day, I will pass.","If I practise every day, I will pass."],a:2,why:"First conditional: if + present simple, will + verb."},{q:"✗ I have made a big progress this month.",o:["I have made big progresses this month.","I have made a lot of progress this month.","I have done a big progress this month."],a:1,why:"Progress is uncountable: no a, no -s. We make progress."},{q:"✗ Please don’t give up to learn English.",o:["Please don’t give up learning English.","Please don’t give up learn English.","Please don’t give up for learning English."],a:0,why:"give up + -ing"},{q:"✗ I study for the exam since September.",o:["I am studying for the exam since September.","I studied for the exam since September.","I’ve been studying for the exam since September."],a:2,why:"since + present perfect (continuous)"},{q:"✗ My teacher explained me how to plan my week.",o:["My teacher explained to me how to plan my week.","My teacher explained me about how to plan my week.","My teacher explain me how to plan my week."],a:0,why:"explain something to somebody (not explain somebody)"},{q:"✗ I’m planning go to a speaking club.",o:["I’m planning going to a speaking club.","I’m planning to go to a speaking club.","I’m planning for go to a speaking club."],a:1,why:"plan + to + verb"},{q:"✗ I didn’t reach to my goal last year.",o:["I didn’t reach my goal last year.","I didn’t reach at my goal last year.","I didn’t reached my goal last year."],a:0,why:"reach a goal (no preposition); after didn’t, use the base verb."}]},{title:"Stress: words about goals",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"noun: the wish to do something",o:["MOtivation","motiVAtion"],a:1,why:"-tion words: stress the syllable just before -tion."},{q:"adjective: possible and sensible",o:["reaLIStic","REalistic"],a:0,why:"-ic words: stress the syllable just before -ic."},{q:"noun: something you did well",o:["aCHIEVEment","ACHievement"],a:0},{q:"noun: the process of getting better",o:["PROgress","proGRESS"],a:0,why:"PROgress (noun), but to proGRESS (verb)."},{q:"verb: to move forward, to get better",o:["PROgress","proGRESS"],a:1,why:"Two-syllable noun–verb pairs: the verb is often stressed on the second part."},{q:"adjective: wanting to achieve a lot",o:["AMbitious","amBItious"],a:1},{q:"adjective: possible to measure",o:["MEAsurable","meaSURable"],a:0}]}],Zf={cardsStep:"Perspective cards",cardsTitle:"Perspective cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. In every scene, speak once from your perspective, then decide together.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Set the goal",lv:"b2",bloom:"Apply",by:"aziza",seconds:60,q:"On Day 1, Otabek writes in his notebook: “I want to speak English really well.” That is a dream, not a goal. As a team, turn it into one clear goal for the next 100 days: make it specific, measurable and realistic, and give it a deadline. Then agree on his first step.",help:{b2:["His goal should be specific, for example …","He can measure it by …","His first step is to …"],c1:["A more realistic version would be …","To keep track of his progress, he could …","Setting a deadline would help him to …"]},model:"Let’s break it down step by step. “Speak really well” is too general, so his goal should be specific, for example: a B2+ result in the speaking exam on Day 100. He can measure it by recording a two-minute talk every Sunday and comparing it with the first one. A more realistic version of his plan would be forty-five minutes a day, not four hours. And his first step is to find the exam tasks tonight and try one of them."},{name:"Round 2 · 100 days",lv:"b2p",bloom:"Analyse / Evaluate",by:"mateo",seconds:0,tool:"path",q:"Read each scene aloud. Each perspective speaks once. Then choose together, click your option and explain why.",help:{b2:["Imagine Otabek on Day 100: …","Let’s be realistic: …","Step one is …, and by Day … he should …"],c1:["The trade-off here is that …","In the long run, this could …","On balance, it makes more sense to …"]},model:"I’m the Dreamer, so imagine Otabek on Day 100: he’s chatting with guests at the conference. To get there, he needs proof that his plan is working. Leo, our Realist, says two weeks is a short time, and that’s true: nobody changes completely in fifteen days. Aziza, our Planner, says step one is comparing his first and latest recordings tonight. On balance, it makes more sense to choose option A, because it’s quick, it’s free, and it shows him whether the plan is working."},{name:"Round 3 · Look back",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:90,q:"A first-year student asks your team: “I have a big goal for this semester. How do I actually reach it?” As a team, give three tips. Use what happened to Otabek on your path. One student presents them in one minute.",help:{b2:["My first tip is …","Try not to …","Make sure you …"],c1:["Looking back, the turning point was …","Whatever happens, …","It really pays to …"]},model:"Hold on, let’s base our tips on what actually happened. On our path, the turning point was when Otabek stopped measuring his feelings and started measuring his progress. So my first tip is to write your goal with a number and a date, not just a wish. Second, try not to change your whole plan after one bad day. Finally, whatever happens, find one person who checks on you every week, because it really pays to have someone in your corner."}],_f=[{e:"🌟",n:"The Dreamer",r:"Keeps the big picture.",lines:[["Your job","Remind the team why Otabek started. What does he really want on Day 100?"],["Useful phrase","Imagine Otabek on Day 100: …"]],x:"Big dreams give energy, but help the team turn the dream into steps too."},{e:"⚖️",n:"The Realist",r:"Checks what is possible.",lines:[["Your job","Say how much time and energy each option really needs. Can Otabek really do it?"],["Useful phrase","Let’s be realistic: …"]],x:"Being realistic doesn’t mean saying no to everything: look for what is possible."},{e:"📣",n:"The Coach",r:"Keeps him going.",lines:[["Your job","Say how each option affects Otabek’s motivation this week and next month."],["Useful phrase","To keep him going, …"]],x:"Talk about habits, motivation and rest in general, never about anyone’s health."},{e:"🗓️",n:"The Planner",r:"Thinks in steps and deadlines.",lines:[["Your job","Say what Otabek should do first, and how he can measure his progress."],["Useful phrase","Step one is …, and by Day … he should …"]],x:"Ask the SMART questions: Is it specific? Measurable? Realistic? Is there a deadline?"},{e:"🤝",n:"The Friend",r:"Asks what Otabek wants.",lines:[["Your job","Think about Otabek’s friends, family and happiness, not only the exam."],["Useful phrase","If I were his friend, I’d say …"]],x:"Good friends support his goal too: look for a way to have both."}],$f=[],ep={start:"s1",help:{b2:["If Otabek chooses …, he might …","The good thing about … is that …, but …","I’d go for option … because …"],c1:["The trade-off here is that …","In the long run, this could …","On balance, it makes more sense to …"]},scenes:{s1:{title:"Day 1: A big dream",text:"Otabek Rahimov is a second-year student at a university in Navoi. On the first day of the semester, his English teacher, Ms Karimova, announces a speaking exam in exactly 100 days. Students with a B2+ result can apply to be volunteer guides at an international student conference in the spring. Otabek understands English well, but he often freezes when he has to speak. That evening, he writes his first plan: “Speak perfect English in 100 days. Study four hours every day, learn fifty new words a day, watch films without subtitles.” His flatmate Bobur reads it and raises his eyebrows.",q:"How should Otabek start? Which option would you choose, and why?",by:"aziza",m:"Let’s break it down step by step. If Otabek keeps the big plan, he might feel excited for a few days, but four hours a day is a lot for a student with classes. The good thing about option B is that the goal is specific and measurable, and it has a deadline, but it sounds less exciting than “perfect English”. I’d go for option B because a realistic plan is much easier to stick to for 100 days.",seconds:60,options:[{label:"A",text:"Keep the big plan: a big dream gives big energy, and he can change it later if he needs to.",next:"s2a"},{label:"B",text:"Rewrite it as a clear goal: B2+ in speaking by Day 100, forty-five minutes of practice a day and one recorded talk every Sunday.",next:"s2b"}]},s2a:{title:"Day 15: Running out of steam",text:"For the first week, Otabek followed his big plan every single day. Now, on Day 15, things look very different. He has missed four days of study, his word list is long but he can’t remember most of it, and last night he fell asleep in the middle of a film. He feels guilty every time he opens his notebook. “Maybe speaking just isn’t my thing,” he tells Bobur. Bobur shrugs: “Two weeks ago, you were so motivated!”",q:"How can Otabek get his motivation back? Which option would you choose, and why?",by:"mateo",m:"Picture this: Otabek on Day 15, sitting in front of a list of words he can’t remember. Not a happy picture! If he takes a weekend off, he might feel lazy, but he can restart with a plan he can really follow. The good thing about a study partner is that someone expects him to come, but he has to find the right person. Asking Ms Karimova brings expert advice, but the plan itself stays too big. I’d go for option A because a smaller plan is a plan he can keep.",seconds:60,options:[{label:"A",text:"Take the weekend off, then restart with a smaller plan: thirty minutes a day.",next:"s3a"},{label:"B",text:"Find a study partner from his group who also wants a good result, and practise together twice a week.",next:"s3b"},{label:"C",text:"Keep the big plan, but ask Ms Karimova for advice on how to make it work.",next:"s3c"}]},s2b:{title:"Day 15: Where is the progress?",text:"Otabek has practised for forty-five minutes every day for two weeks. He has recorded two Sunday talks, and he has kept every promise to himself. But today, when a classmate asked him a simple question in English, he froze again. “I’m working so hard, and nothing is changing,” he writes in his notebook. His motivation is starting to drop, and the next 85 days suddenly look very long.",q:"What should Otabek do now? Which option would you choose, and why?",by:"leo",m:"Hold on, what does “nothing is changing” actually mean? Otabek is measuring his feelings, not his progress. If he compares his two recordings, he might hear a real difference, but it won’t help him with live conversations. The good thing about the speaking club is that he talks to real people, but it takes another evening. Asking his teacher takes courage, but she knows the exam. I’d go for option A because it’s quick, and it gives him facts, not feelings.",seconds:60,options:[{label:"A",text:"Listen to his first recording and his latest one, one after the other, and write down three differences.",next:"s3a"},{label:"B",text:"Join the university speaking club on Thursday evenings to practise with real people.",next:"s3b"},{label:"C",text:"Ask Ms Karimova if she knows someone who could give him advice.",next:"s3c"}]},s3a:{title:"Day 40: A tempting invitation",text:"Otabek’s plan is finally working: he practises most days, and speaking feels a little easier. Then his friends from the student dormitory arrive with exciting news. They are building a team for the city five-a-side football tournament, and they need a goalkeeper: Otabek. Training is three evenings a week for the next six weeks, exactly when he usually practises English. “Come on, it’s only six weeks!” says his friend Farrukh. “And you’re the best goalkeeper we know.”",q:"What should Otabek do about the invitation? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: my brother once said no to a band because of exams, and he still talks about it. The good thing about option A is that Otabek keeps his friends and his plan, but early mornings are hard. If he says no, the exam is safe, but he might lose motivation without any fun. Option C is a middle ground, but his team might be disappointed. I’d go for option C because he can have both without losing his goal.",seconds:60,options:[{label:"A",text:"Join the team and move his English practice to the early mornings.",next:"s4a"},{label:"B",text:"Say no this time: the exam comes first, and there will be another tournament.",next:"s4b"},{label:"C",text:"Join as a substitute: one training session a week, with English podcasts on the bus.",next:"s4c"}]},s3b:{title:"Day 40: A disappointing mock test",text:"Ms Karimova runs a mock speaking exam for the whole group. Otabek starts well, but in Part 2 he has to describe a place he likes, and his mind goes blank. He speaks for only forty seconds instead of two minutes. His result is B1+, not the B2+ he is aiming for. On the way home, he looks at the paper again and again. There are sixty days left, and for the first time he wonders if his goal is too high.",q:"How should Otabek react to the setback? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? He could record a two-minute answer on his phone every evening and hear exactly where he stops. If he asks for feedback, he might hear things that hurt, but he will know what to fix. The good thing about lowering his goal is less pressure, but he might stop pushing himself. Daily practice with a timer is great, but it doesn’t tell him what went wrong. I’d go for option A because a setback is useful only if you learn from it.",seconds:60,options:[{label:"A",text:"Ask Ms Karimova for detailed feedback and rebuild his plan around his weakest points.",next:"s4b"},{label:"B",text:"Change his goal to B2: it’s still a big step, and it feels more realistic now.",next:"s4a"},{label:"C",text:"Keep the B2+ goal and practise one exam task with a timer every single day.",next:"s4c"}]},s3c:{title:"Day 40: An offer of help",text:"After class, Ms Karimova introduces Otabek to Zarina Yusupova, a former student of hers who now works as an English-speaking tour guide in Bukhara. Zarina offers to be his online mentor until the exam, with a video call every Sunday. But she has one condition: every day, Otabek must send her a two-minute voice message in English about anything at all. “No message, no call,” she says with a smile. Otabek likes the idea, but a message every single day feels like a lot.",q:"How should Otabek answer Zarina? Which option would you choose, and why?",by:"leo",m:"Hold on, what does Zarina actually ask for? Two minutes a day: that’s less than a song. If Otabek accepts, he might feel pressure at first, but daily speaking is exactly what he needs. The good thing about fewer calls is more free time, but he may lose the habit. Sharing the calls helps his classmates, but Zarina will have less time for him. I’d go for option A because in the long run, a small daily habit beats a big weekly effort.",seconds:60,options:[{label:"A",text:"Accept the offer and her rule: a voice message every day and a call every Sunday.",next:"s4b"},{label:"B",text:"Thank her, and ask for a call every two weeks and three voice messages a week.",next:"s4c"},{label:"C",text:"Ask if two classmates could join the calls, so more students get help.",next:"s4a"}]},s4a:{title:"Day 70: Two goals, one semester",text:"With thirty days to go, Otabek’s classmate Diyora has a new idea. She wants to make a short video series in English about places to visit in and around Navoi, and she needs a partner to speak on camera. She thinks Otabek is perfect for it. It would take about six hours a week: writing, filming and editing. The project is exciting, and it’s real speaking practice. But the exam is only a month away, and Otabek knows he can’t do everything.",q:"What should Otabek do about the second goal? Which option would you choose, and why?",by:"mateo",m:"Picture this: Otabek in front of an old building in Navoi, telling the camera its story in English. Amazing! If he starts now, he gets a new goal and lots of practice, but his exam preparation could suffer. The good thing about waiting is that he stays focused, but Diyora might find another partner. A small version keeps both goals alive, but it needs careful planning. I’d go for option C because the videos can be his exam practice too.",seconds:60,options:[{label:"A",text:"Say yes and start now: two goals can push each other forward.",next:"e2"},{label:"B",text:"Put the project on hold, and agree with Diyora on a start date the week after the exam.",next:"e1"},{label:"C",text:"Do a small version: one short video a week, planned like a two-minute exam answer.",next:"e3"}]},s4b:{title:"Day 85: The final countdown",text:"Fifteen days left. Otabek is much more confident now, and his last practice talk was his best so far. But he is tired of the same routine, and he has started to worry about the exam day itself: the room, the examiner, the clock. Ms Karimova tells the group that the last two weeks are about doing the right things, not doing more things. Otabek has three ideas for his final fortnight.",q:"How should Otabek use the last two weeks? Which option would you choose, and why?",by:"amara",m:"Let me give you a real example: before my driving test, my teacher made me drive the exact test route three times, and on the day it felt familiar. The good thing about full mock exams is that the exam day won’t feel new, but he might get bored. If he helps first-year students, he practises explaining, but it takes time. Practising with classmates is fun, but they might chat in Uzbek. I’d go for option A because the exam day itself is his biggest worry.",seconds:60,options:[{label:"A",text:"Do a full mock exam with a timer every other day, and record each one.",next:"e1"},{label:"B",text:"Help first-year students at the speaking club: explaining exam tips is great practice too.",next:"e4"},{label:"C",text:"Meet two classmates every day after lectures to ask each other exam questions.",next:"e4"}]},s4c:{title:"Day 80: A real conversation",text:"A group of exchange students from several countries is visiting Navoi for a week, and the university needs volunteers to show them around the city on Saturday. It’s a real chance to speak English all day with people who don’t understand Uzbek. But Saturday is also the day of Otabek’s weekly practice test, and he planned to work on his weak points this weekend. There are twenty days left.",q:"Should Otabek volunteer on Saturday? Which option would you choose, and why?",by:"nur",m:"What if technology could help here? He could use a map app to plan a short route, so the tour doesn’t take the whole day. If he volunteers all day, he gets real practice, but his weak points must wait. The good thing about a half day is that he gets both, but he’ll be tired in the afternoon. The farewell dinner is shorter, but he misses the best part. I’d go for option B because real conversations and exam practice support each other.",seconds:60,options:[{label:"A",text:"Volunteer for the whole day and move his practice test to Sunday.",next:"e3"},{label:"B",text:"Volunteer in the morning only, then do his practice test in the afternoon.",next:"e3"},{label:"C",text:"Say no to the tour, but join the farewell dinner on Sunday evening to chat with the guests.",next:"e1"}]},e1:{end:!0,title:"Ending: Small steps, big result",text:"On Day 100, Otabek speaks for the full two minutes in Part 2, and he even enjoys the discussion at the end. When the results come out, he has reached his goal. Looking back through his notebook, he can see every step of the journey: the daily practice, the recordings and the small deadlines he set for himself. He learns that a big dream becomes possible when you break it down into small, measurable steps and keep track of your progress.",q:"What did Otabek learn on your path? Which of your team’s choices helped him most, and why?",by:"aziza",m:"Let’s break it down step by step. Otabek learned that a goal needs a clear plan, not just a big dream. On our path, the choice that helped him most was protecting his study time, because every small step counted. In the long run, this habit of setting deadlines and measuring progress could help him with any goal, not only English."},e2:{end:!0,title:"Ending: Two goals at once",text:"The video series is a hit with Otabek’s friends, and he now feels relaxed in front of a camera. But in the last weeks he had less time for exam practice, and on Day 100 his result is a little lower than he hoped. He is disappointed for a day. Then he sees the bigger picture: his speaking has improved a lot, and he has a new project he loves. He learns that two goals can support each other, but when a deadline is close, one of them must come first.",q:"What did Otabek learn on your path? Would you change one of your team’s choices now? Why or why not?",by:"mateo",m:"Picture this: Otabek watching his first video with a hundred friends online. That feels great! But he also learned that every yes to one goal is a no to some time for another. If we played again, I’d keep the videos small until the exam. The trade-off was excitement now against focus later, and in the long run he needs both."},e3:{end:!0,title:"Ending: English for real life",text:"Otabek’s best moments of the semester happened outside the classroom, when he used English for something real, not just for practice. On Day 100, he feels surprisingly calm in the exam, because for him, speaking English is no longer just a test: it’s something he does. He reaches his goal, and he already has new ideas for the summer. He learns that a goal feels more meaningful, and is easier to reach, when it is connected to real life.",q:"What did Otabek learn on your path? How can a student connect a study goal to real life?",by:"amara",m:"Let me give you a real example from our path: every time Otabek used English for something real, he came back more confident. He learned that practice doesn’t have to feel like homework. To connect a study goal to real life, I’d find one real task each week, like helping a visitor or making a short video. In the long run, that keeps motivation alive."},e4:{end:!0,title:"Ending: Never alone",text:"Otabek reaches his goal, but what he remembers most is the people: the students he practised with in the last two weeks, who asked him hard questions and made him explain his ideas, and Ms Karimova, who believed in him from Day 1. Explaining things to others made his own answers clearer and faster. He learns that a goal can be personal, but the journey doesn’t have to be lonely, and that teaching something is one of the best ways to learn it.",q:"What did Otabek learn on your path? How can other people help us reach a personal goal?",by:"nur",m:"What if technology could help here? A shared progress chart in a group chat would let friends cheer each other on. On our path, Otabek learned that other people keep you going on the hard days. Other people can help us by asking questions, giving honest feedback and simply noticing our progress. In the long run, a goal shared with others is much harder to give up."}}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why is it important to set realistic goals?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** a realistic goal is the only kind of goal that people actually achieve."],["Point","**The main reason is that** when a goal is far too big, people lose motivation after the first difficult week."],["Example","**For example,** my cousin in Bukhara wanted to learn coding in one month and gave up after a week, but with a plan of one lesson a day, she finished the whole course."],["Close","**So, all things considered,** a big dream needs realistic steps."]],keys:["in my view","lose motivation","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Is it a good idea to tell other people about your goals?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say yes, **although** it depends on who you tell."],["","**First of all,** when people know about your goal, it’s harder to give up quietly."],["","**For instance,** when I told my running group in Hamburg about my first ten-kilometre race, they asked me about my training every week."],["","**However,** some people talk about their goals so much that talking starts to feel like doing."],["","**That’s why** it’s better to tell one or two people who will really check on you."],["","**In short,** share your goal, but share it with the right people."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"What can teachers do to help students reach their goals?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think teachers can help a lot, even if the goal belongs to the student."],["","To begin with, they can help students turn a vague wish into a clear target with a deadline."],["","On top of that, regular feedback shows students where they are and what to do next."],["","Let me give you a real example: my English teacher in Lagos asked each of us to write one goal on a card, and she checked the cards with us every month."],["","That said, teachers can’t do the work for their students: in the end, the effort has to come from the learner."],["","So, in a nutshell, a good teacher is like a map, but the student still has to walk."]],extra:"My favourite subject at school was geography, because I loved maps.",keys:["a clear target","regular feedback","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it better to have one big goal or several small goals?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think one big goal works best when it’s made of several small ones."],["The main reason is that","a big goal gives you direction, while small goals give you a feeling of success every week."],["For instance,","a friend of mine in Recife wanted to open a small café, so she started by baking for her neighbours every Saturday."],["Having said that,","too many small goals at the same time can pull you in different directions."],["That’s why","it helps to choose one main goal and link every small step to it."],["Ultimately,","the small goals are the stairs, and the big goal is the top floor."]],distractors:["In contrast,","Similarly,"],keys:["a feeling of success","pull you in different directions","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"What is the best way to stay motivated when you are working towards a long-term goal?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["it depends on the person","make progress visible","celebrate small wins","for instance","remember why you started"],model:"I’d say it depends on the person, but for most people the key is to make progress visible: a chart on the wall, a list of finished tasks or a recording from the first day. It also helps to celebrate small wins, because a long-term goal can feel endless if you only celebrate at the finish line. For instance, when I was learning Arabic script, I marked every new letter in a notebook, and each page felt like a little victory. Finally, on difficult days, remember why you started."}],np={title:"Exam Part 2 practice: helping first-year students reach their goals",situation:"Many first-year students at your university in Navoi start the year with big goals, but by November some of them have given up. The student council can offer only one thing to help: a mentor programme with older students, a goal-planning workshop in the first week, or a monthly progress meeting with a tutor. Leo and Nur are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"nur",lines:[["A","So, how can we help first-years keep their goals? Shall we start with mentors?"],["B","Sure. I like it, but would older students really have time to meet them regularly?"],["A","Fair point. Sorry, do you mean that the mentors might stop coming after a few weeks?"],["B","Exactly. It works only if the mentors are as motivated as the new students."],["A","I see. What about the workshop? It could teach everyone to set realistic goals."],["B","Useful, but one workshop in September is easy to forget by November, isn’t it?"],["A","True. A monthly tutor meeting keeps people on track, but it needs many tutors."],["B","So, shall we go for the workshop, plus a short monthly check with a tutor?"],["A","Agreed. Students learn how to plan, and someone checks on them before they give up."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, isn’t it?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: your English group wants to improve its speaking before the end-of-semester exam. Choose **one** group goal for the next month: a weekly speaking club, a two-minute voice message every day in a group chat, or a mock exam every Friday. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["My main goal is to …","I’m aiming to …","The first step is …","I keep track of my progress by …","To stay motivated, I …","If things go wrong, I …","By the end of …, I want to …","It’s realistic because …","Step by step, …"],B:["It’s realistic because …","I’m determined to …","By the end of …, I want to …","I’ve made real progress with …","My main goal is to …","In the long run, …","To stay motivated, I …","The first step is …","If things go wrong, I …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["My main goal is to …","I’m aiming to …","I’m determined to …","By the end of …, I want to …","The first step is …","I keep track of my progress by …","To stay motivated, I …","If things go wrong, I …","It’s realistic because …","I’ve made real progress with …","Step by step, …","In the long run, …"],questions:["What goals do students in Uzbekistan often set at the start of a new academic year?","What is one goal you have for this semester, and what is your first step?","How do you stay motivated when a goal takes a long time?","Is it better to have one big goal or several small ones? Why?","What should you do after a setback, like a bad test result?","Who has helped you reach a goal, and how did they help?"]},sp=[{type:"stress",title:"Stress Spot: words about goals",intro:"Tap the stressed syllable. Tip: in words ending in -tion and -ic, the stress is usually on the syllable just before the ending (motiVAtion, reaLIStic). Then listen and say the word.",follow:"Now use two of the words in a sentence about Otabek’s 100-day goal.",items:[{w:"motivation",syl:["mo","ti","va","tion"],s:2},{w:"realistic",syl:["re","a","lis","tic"],s:2},{w:"achievement",syl:["a","chieve","ment"],s:1},{w:"ambitious",syl:["am","bi","tious"],s:1},{w:"measurable",syl:["mea","sur","a","ble"],s:0},{w:"progress (noun)",syl:["pro","gress"],s:0},{w:"determined",syl:["de","ter","mined"],s:1},{w:"strategy",syl:["stra","te","gy"],s:0}]},{type:"pairs",title:"Sound Pairs: /əʊ/ or /ɔː/?",intro:"Press Play and choose the word you hear. /əʊ/ moves: it starts in the middle of the mouth and ends with small round lips (goal, coat, so). /ɔː/ is one long sound, and the lips stay round (caught, law, saw). Uzbek vowels do not glide like /əʊ/, so coat and caught can easily sound the same. Partner version: one student says a word, the partner points to it.",pairs:[["coat","caught"],["low","law"],["so","saw"],["boat","bought"],["woke","walk"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: set a goal, keep track of or stay motivated.","Describe how Otabek feels at this moment in two sentences."],ap={title:"Step Up Speaking Club podcast: From a Dream to a Plan",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Mateo asks Amara how she learned enough Uzbek to give a talk at the Club’s Navruz party, and remembers a project of his own.",tip:["Match ideas, not words","In Part 3 the statements almost never use the speakers’ words. Listen for the same idea in other words: *look at my first photos* = *look back at old work*. If both speakers say it, choose *both of them*."],A:"mateo",B:"amara",lines:[["A","Welcome to the Club podcast. Today’s question: how do you turn a dream into a plan? Amara, last year you **set a goal** that surprised all of us."],["B","I did! Last September I decided to give a two-minute talk in Uzbek at our Club’s online Navruz party in March. My first plan was just two words: “Learn Uzbek.” [[0]] that was a dream, not a plan."],["A","Agreed. A **long-term goal** like that is too big to start on a Monday morning."],["B","Exactly. [[1]] **break it down into** small pieces. For me, that meant ten new words a day, one short dialogue a week and a video call with Aziza every Sunday. Each month had **a realistic target**, and I **set a deadline** for every step."],["A","I wish I’d done that. I wanted to make a photo book about Recife, but I never set a deadline, so it’s still on my laptop. [[2]] without a date, “later” never comes."],["B","I also used a simple notebook to **keep track of** everything I learned. For six weeks I **made progress** and **stuck to the plan**. Then, in November, I did badly in a small test, and I started to **lose motivation**."],["A","[[3]] you nearly gave up?"],["B","Almost. But Aziza told me that **a setback** is part of every journey. To **stay motivated**, I listened to my first recording from September, and the difference was huge."],["A","That’s a great trick. Looking back shows you how far you’ve come. [[4]] when I’m tired of a project, I look at my first photos and laugh."],["B","In March I gave my talk. It wasn’t perfect, but I **achieved my goal**, and everybody clapped. Next goal: Russian!"],["A","So: small steps, real deadlines and a look back now and then. Thanks, Amara."]],gaps:[[1,"If you ask me,"],[2,"The first step is to"],[3,"That’s because"],[4,"Hang on, do you mean that"],[5,"For instance,"]],questions:[{q:"Who admits that their first plan was not a real plan?",o:["Mateo","Amara","both of them"],a:1,why:"Amara: “My first plan was just two words: ‘Learn Uzbek.’ If you ask me, that was a dream, not a plan.”"},{q:"Who has a project that is unfinished because there was no deadline?",o:["Mateo","Amara","both of them"],a:0,why:"Mateo: “I wanted to make a photo book about Recife, but I never set a deadline, so it’s still on my laptop.”"},{q:"Who thinks that looking back at old work can help you keep going?",o:["Mateo","Amara","both of them"],a:2,why:"Amara listened to her first recording to stay motivated; Mateo: “When I’m tired of a project, I look at my first photos and laugh.” Same idea, different words."},{q:"Who sums up the lesson in three short points?",o:["Mateo","Amara","both of them"],a:0,why:"Mateo: “So: small steps, real deadlines and a look back now and then.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Amara use to describe a first step, and which one does Mateo use to check meaning?",groups:[["Opinion",[1]],["Describing a first step",[2]],["Reason",[3]],["Checking meaning",[4]],["Example",[5]]]},use:{q:"Is it better to tell your friends about your goals or to keep them to yourself? Why?",by:"nur",model:"If you ask me, it’s better to tell one or two close frie
