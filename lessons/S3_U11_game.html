Locked Library",paras:["It’s Puzzle Night at the university library in **Samarkand**. At 8 p.m. the main doors close, and your team stays inside on purpose: the librarian, Mrs Dilnoza Karimova, has hidden the way out behind **five locked doors**.","Each door has a puzzle. Read it, talk it through in English and type the answer. When a door opens, explain **how** you know. Mrs Karimova is waiting at the exit with tea, and she wants to hear your reasons, not just your answers."],rule:"Rule of the night: no answer counts until someone explains why. Question ideas, never people, and give everyone a turn to speak."}},Kf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"A short talk from the Club (exam Part 2): listen for a detail, the speaker’s reaction, her purpose and her main message, notice how she questions a source, then use her phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word families where the stress moves (ANalyse → aNALysis), and a final /d/ or /t/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer about critical thinking in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for questioning information and arguments. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best tip for checking information they heard (use the wheel)."]},{id:"game",icon:"🔑",name:"The Locked Library",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Reader","Sceptic","Note-taker","Timekeeper","Reporter"],desc:"Escape Room: open five locked doors in a university library by solving reasoning puzzles in English, and explain how you solved each one. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team moves at its own speed.","Each student turns over one role card (Reader, Sceptic, Note-taker, Timekeeper, Reporter) and keeps it for the whole game.","Timing: cards 1 min · The rules 2 min · The doors 12 min (five doors, about 2 minutes each) · Think back 3 min.","Only one projector? The teacher shows one door at a time; teams discuss and write their answer on paper. A team scores a point only for the right answer AND a clear explanation."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping students check information, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Gf={listen:{ref:"Book: Lesson 11, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: a detail, Amara’s first reaction, why she mentions Aziza’s study group, and her main message.","Press **Play the podcast**. Amara tells a story and gives her opinions: ask yourself _did it happen, or does she think it?_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Amara said; tap a line to hear it again.","Sort the five phrases: opinion, questioning a source, reason, checking with the audience, and example.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is A. Amara shared the message.","gives an answer"],["B","Did she? What exactly does she say?","asks for evidence"],["A","“I almost took it at face value too.” Almost, so she didn’t share it.","uses the text as evidence"],["B","So she nearly believed it, but then she checked. It’s B.","paraphrases"]],checks:[["How can you tell a fact from an opinion in a talk?","facts tell you what happened (“The message came from an account nobody knew”); opinions often start with “As far as I’m concerned”, “I think” or “It seems”."],["Which phrase does Amara use to check that the audience is following?","Are you with me so far?"]]},pron:{ref:"Book: Lesson 11, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Watch the family: the stress **moves** when the word gets longer: *ANalyse → aNALysis → anaLYTical*.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: final /d/ or final /t/?","Say **both** words. Before /d/, the vowel is **longer** (*side*). /t/ is short and sharp (*sight*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *analyse*. Which part is strong?",""],["A","The first part: *AN-a-lyse*.","a correct guess"],["T","Yes. And now the noun: *analysis*?",""],["B","Also the first part? *AN-a-ly-sis*?","a first guess"],["T","Not quite. In this family the stress moves: *a-NAL-y-sis*, and then *an-a-LYT-i-cal*.","the teacher gives the rule"],["A","So *e-VAL-u-ate*, but *e-val-u-A-tion*!","uses the rule: stress before -tion"],["T","Great. Now /d/ or /t/? Listen: *side*. First or second: *side* or *sight*?",""],["B","First: *side*. The vowel was long.","listens for the long vowel"]],checks:[["Where is the stress in *analysis*?","on NAL: a-NAL-y-sis. In *analyse*, it is on AN."],["Where is the stress in *evaluation*?","on A: e-val-u-A-tion. Words with -tion are stressed just before -tion."],["How do you hear the difference between *side* and *sight*?","the vowel before /d/ is longer; /t/ is short and sharp."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think … it’s important, because, um, there is a lot of information … For example, a message in our chat, it was not true … So, it’s important.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, critical thinking is very useful for students. The main reason is that we get a lot of information every day, and not all of it is true. For example, a message about cancelled exams went round our group chat in Samarkand, but a friend checked the faculty website first. So it’s important.","Attempt 2 · 60 s · linking words"],["aziza","In my view, critical thinking is one of the most useful skills a student can learn. Every day we read and hear so much information, and not all of it is true. When a message about cancelled exams went round our group chat in Samarkand, one friend checked the faculty website first and saved everyone a lot of worry. All things considered, thinking critically helps us make better decisions, in our studies and in life.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: How do you check if a news story is true?",lines:[["mateo","Well, **before I share something, I** ask two questions: **who says so?** and **how do they know that?** Last month a friend sent me a story about a new rule for students in Recife. **I wasn’t entirely convinced**, because there was no name and no date. **Is there any evidence to back that up?** No! So I looked at the university website, and the rule wasn’t there. **That’s just one example**, but now I always check first.","speaker · 1 minute"],["nur","I heard six phrases: *Before I share something, I*, *Who says so?*, *How do they know that?*, *I’m not entirely convinced*, *Is there any evidence to back that up?* and *That’s just one example*. That’s the top row: **Bingo!**","listener reports"],["mateo","Great! Six points plus three for the Bingo: nine points.","count the points"],["nur","Next time, try *Let’s look at both sides*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, … shall we start with …?*).","Click the lines in order. Each line answers the line before. Aziza and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: choosing a source for a project",lines:[["A","So, we need one good source for our project. Shall we start with that popular video?","opens the topic"],["B","It’s fun, but who made it? How do they know?","questions the source"],["A","Fair point. What about the textbook from the library? Its authors are experts.","reacts + a new idea"],["B","Agreed. Let’s use the textbook and check the video against it.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · note sheet in section 6",steps:["Make teams of five. Each student turns over one **role card** and keeps that role for the whole game.","**Round 1 · The rules (2 min):** agree how your team will work: who reads, who writes, and what you do when you disagree.","**Round 2 · The doors (12 min):** the Reader reads the door aloud. Discuss, test every idea, then type your answer and press **Unlock**.","Stuck? Press **Hint**. A wrong answer is not a problem: read the clues again and try another idea.","When a door opens, the Reporter explains **how** your team solved it. Then press **Next door**.","**Round 3 · Think back (3 min):** which thinking tools helped you most? One student presents your answer in one minute."],exTitle:"Sample game: the Club tries Mrs Karimova’s practice door",lines:[["","Practice door — Reader Aziza · Sceptic Leo · Note-taker Amara · Timekeeper Nur · Reporter Mateo",""],["aziza","(reads aloud) The key is in the drawer, under the lamp or in the plant pot. Note 1: “The key is in the drawer.” Note 2: “The key is in the drawer or under the lamp.” Only one note is true.","the Reader reads the puzzle aloud"],["mateo","Easy! It’s in the drawer: both notes say “drawer”.","a quick first idea"],["leo","**Hold on. If that were true, then** both notes would be true. But only one note is true.","the Sceptic tests the idea"],["amara","Let’s test each place. I’ll write it down. Drawer: two true notes, so no.","the Note-taker makes a small table"],["nur","Plant pot: both notes are false, so zero true notes. **This can’t be right, because** we need exactly one.","rules out a place"],["amara","Lamp: Note 1 is false, Note 2 is true. Exactly one!",""],["nur","One minute left. Mateo, you haven’t said much. Do you agree?","the Timekeeper watches the time and the turns"],["mateo","Yes, now I see it. **So the only possible answer is** the lamp.","agrees"],["mateo","**We ruled out** the drawer **because** it made both notes true, and the plant pot **because** it made both notes false. **The key clue turned out to be** the word “only”.","the Reporter explains after the door opens (C1 phrases)"]],checks:[["What does the Sceptic do?","tests every idea (*If that were true, then …?*): the Sceptic questions ideas, never people."],["When do you type an answer?","when the team agrees and someone can explain why it is the only possible answer."],["What happens after a door opens?","the Reporter explains how the team solved it; then the next door appears."]]},drills:{ref:"Book: Lesson 11 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Don’t ___: wait until you know all the facts.",o:["go viral","jump to conclusions","keep an open mind"],a:1},{q:"The funny video ___ overnight: everyone in the faculty had seen it by the morning.",o:["went viral","drew a conclusion","checked the facts"],a:0},{q:"Before you share a story, always ___.",o:["take it at face value","go viral","check the facts"],a:2},{q:"The official university website is usually ___.",o:["a reliable source","an open mind","a weak argument"],a:0},{q:"He made a big claim, but he had no evidence to ___.",o:["weigh it up","back it up","draw it"],a:1},{q:"A good judge listens to both sides and ___ before deciding.",o:["goes viral","jumps to conclusions","weighs up the evidence"],a:2},{q:"Adverts often sound perfect, so don’t take them ___.",o:["at face value","an open mind","both sides"],a:0},{q:"Try to ___ until you have heard all the arguments.",o:["go viral","keep an open mind","take it at face value"],a:1},{q:"After reading three reports, we ___: the plan was too expensive.",o:["went viral","jumped to conclusions","drew a conclusion"],a:2},{q:"Compare a few sources so that you can ___.",o:["make an informed decision","take it at face value","go viral"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I always check the facts. → **She**",a:"She always checks the facts. (She → checks!)"},{p:"She always checks the facts. → **a negative**",a:"She doesn’t always check the facts."},{p:"She doesn’t always check the facts. → **a question: Does …?**",a:"Does she always check the facts?"},{p:"Don’t jump to conclusions. → **We shouldn’t**",a:"We shouldn’t jump to conclusions."},{p:"We shouldn’t jump to conclusions. → **too quickly**",a:"We shouldn’t jump to conclusions too quickly."},{p:"The story went viral. → **a question: When …?**",a:"When did the story go viral? (did + go, not went!)"},{p:"I agree with you. → **completely**",a:"I completely agree with you. (Not: I am agree!)"},{p:"I completely agree with you. → **a negative**",a:"I don’t completely agree with you."},{p:"Who wrote this? → **I wonder**",a:"I wonder who wrote this. (No question word order!)"},{p:"Is it true? → **Let’s check whether**",a:"Let’s check whether it is true."},{p:"Where did they find this information? → **Do you know**",a:"Do you know where they found this information?"},{p:"How do they know? → **Nobody asked**",a:"Nobody asked how they knew."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I’m not sure that’s true.",a:"I’m not entirely convinced by that."},{p:"Where did you read that?",a:"What’s the source of that information?"},{p:"Is there proof?",a:"Is there any evidence to back that up?"},{p:"That’s only one example.",a:"That’s a sweeping generalisation based on one case."},{p:"It’s true, but it doesn’t mean that everybody agrees.",a:"That may be true, but it doesn’t necessarily mean that everybody agrees."},{p:"Let’s think before we decide.",a:"Let’s weigh up the evidence before we decide."},{p:"So the answer is clear.",a:"All the evidence points to one answer. / It follows that …"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I am agree with you.",o:["I am agreeing with you.","I agree with you.","I am agree to you."],a:1,why:"Agree is a verb: I agree, I don’t agree. Not: I am agree."},{q:"✗ We discussed about the problem.",o:["We discussed the problem.","We discussed on the problem.","We were discussed the problem."],a:0,why:"discuss something (no about); but talk about something, a discussion about something"},{q:"✗ The news are not true.",o:["The news are not truth.","The new is not true.","The news is not true."],a:2,why:"News is uncountable and singular: the news is."},{q:"✗ It depends from the source.",o:["It depends on the source.","It depends of the source.","It is depend on the source."],a:0,why:"depend on"},{q:"✗ According to me, this article is wrong.",o:["According to my opinion, this article is wrong.","In my opinion, this article is wrong.","For me opinion, this article is wrong."],a:1,why:"according to + another person or source (according to the report); for your own view: in my opinion"},{q:"✗ Let’s check is it true.",o:["Let’s check is true it.","Let’s check if is it true.","Let’s check whether it is true."],a:2,why:"Indirect question: whether / if + subject + verb."},{q:"✗ He explained me the answer.",o:["He explained the answer to me.","He explained to me the answer.","He explained me about the answer."],a:0,why:"explain something to somebody"},{q:"✗ I don’t believe to this story.",o:["I don’t believe at this story.","I don’t believe this story.","I am not believe this story."],a:1,why:"believe something / somebody (no preposition); believe in = trust that something is good or exists"},{q:"✗ She gave me an useful advice.",o:["She gave me a useful advice.","She gave me useful advices.","She gave me some useful advice."],a:2,why:"Advice is uncountable: some advice, a piece of advice."}]},{title:"Stress: word families",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"verb: look at something carefully to understand it",o:["ANalyse","anaLYSE"],a:0},{q:"noun: a careful study of something",o:["ANalysis","aNALysis"],a:1,why:"The stress moves: ANalyse → aNALysis."},{q:"adjective: good at looking at details and reasons",o:["anaLYTical","ANalytical"],a:0,why:"ANalyse → aNALysis → anaLYTical"},{q:"noun: facts that show something is true",o:["eVIdence","EVidence"],a:1},{q:"verb: judge how good or true something is",o:["eVALuate","evaluATE"],a:0},{q:"noun: a judgement of how good something is",o:["eVALuation","evaluAtion"],a:1,why:"Words with -tion: stress the syllable just before -tion."},{q:"noun: what you decide at the end",o:["CONclusion","conCLUsion"],a:1}]}],Yf={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. Every role helps at every door.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · The rules",lv:"b2",bloom:"Apply",by:"aziza",seconds:60,q:"Before Door 1, agree on how your team will work. Who reads the puzzles aloud? Who writes notes? How will you make sure everyone speaks? And what will you do when two people disagree?",help:{b2:["I think the Reader should …","Let’s agree that …","If we disagree, we’ll …"],c1:["It makes sense for … to …, because …","To avoid wasting time, let’s …","As long as everyone …, we can …"]},model:"Let’s agree on three simple rules. First, our Reader reads every door twice, slowly, because small words are easy to miss. Second, nobody types an answer until someone can explain why it’s right. And if we disagree, we’ll test both ideas against the clues instead of arguing. To avoid wasting time, let’s give each door about two minutes before we press Hint."},{name:"Round 2 · The doors",lv:"b2p",bloom:"Analyse / Evaluate",by:"mateo",seconds:0,tool:"escape",q:"Read each door aloud. Discuss, test every idea and agree on one answer. Type it and press Unlock. When the door opens, the Reporter explains how you solved it.",help:{b2:["Let me read that part again: …","Hold on. How do we know that?","So far, we’ve ruled out …"],c1:["If that were true, then …","We ruled out … because …","The key clue turned out to be …"]},model:"I’m the Reporter, so let me explain. First, our Reader read the clues twice. Then our Note-taker made a small table with every possibility. Our Sceptic tested each idea: “If that were true, then …?” We ruled out two answers because they broke the rules of the puzzle, so the only possible answer was the third one. The key clue turned out to be one small word: “only”."},{name:"Round 3 · Think back",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:90,q:"Think back. Which thinking tool helped your team most tonight: testing every possibility, asking “How do they know?”, separating facts from opinions, or checking the numbers? Give an example from one door, and say where the same tool could help you outside the library.",help:{b2:["The most useful tool for us was …","For example, at Door …, we …","Outside the library, it could help when …"],c1:["Looking back, what really made the difference was …","Without …, we would have …","The same approach works whenever …"]},model:"Hold on, let’s be honest: we guessed at the first door, and it didn’t work. Looking back, what really made the difference was checking the numbers. At the last door, the headline sounded convincing, but when we did the maths, it fell apart. Without that, we would have believed it. The same approach works whenever you read news online: before you share a big claim, ask who says so, how they know, and what is missing."}],_f=[{e:"📖",n:"The Reader",r:"Reads every door aloud.",lines:[["Your job","Read the puzzle and the clues aloud, slowly and clearly. Read a part again when the team asks."],["Useful phrase","Let me read that part again: …"]],x:"Read numbers, times and small words like only, not and every very carefully: they are often the key."},{e:"🔍",n:"The Sceptic",r:"Questions every idea.",lines:[["Your job","Test each answer before the team types it. Ask how we know, and look for what is missing."],["Useful phrase","Hold on. How do we know that?"]],x:"Question ideas, never people. Say what is wrong with the idea, not with the person who said it."},{e:"✏️",n:"The Note-taker",r:"Writes it down.",lines:[["Your job","Write every possibility on the note sheet and cross out the ones the team rules out."],["Useful phrase","So far, we’ve ruled out …"]],x:"A small table often solves a puzzle faster than a long discussion."},{e:"⏱️",n:"The Timekeeper",r:"Watches the time and the turns.",lines:[["Your job","Say when half the time has gone, and make sure everyone in the team speaks."],["Useful phrase","One minute left. Let’s hear from …"]],x:"If one person is talking a lot, invite a quiet person: What do you think, …?"},{e:"🎤",n:"The Reporter",r:"Explains the answer.",lines:[["Your job","When a door opens, explain how the team solved it in three or four sentences."],["Useful phrase","We worked it out like this: first, …"]],x:"Use first, then, so and that’s why: a clear order makes a clear explanation."}],$f=[],ep={help:{b2:["First, we checked …","This can’t be right, because …","So the only possible answer is …"],c1:["If that were true, then …","We ruled out … because …","The key clue turned out to be …"]},doors:[{title:"Door 1 · Three books, one key",text:"On the reading-room table there are three books: a red one, a blue one and a green one. The key to Door 1 is under one of them, and each book has a sticky note on it. Mrs Karimova’s card says: “Only **one** of these three notes is true.” Which book is the key under? Type the colour.",clues:["Red book: “The key is under this book.”","Blue book: “The key is not under this book.”","Green book: “The key is not under the red book.”"],answer:"blue",accept:["blue book","the blue book","the blue one","blue one"],hint:"Try each book in turn. Imagine the key is under the red book: which notes are true then? Count them. You need exactly one true note.",q:"Explain how you solved it. Why can’t the key be under the red book or the green book?",by:"aziza",m:"First, we checked the red book. If the key were under it, the red note would be true and the blue note would be true too: two true notes, so not red. Then we tried green: the blue note and the green note would both be true. This can’t be right, because only one note is true. So the only possible answer is blue: the red and blue notes are false, and only the green note is true.",seconds:60},{title:"Door 2 · The suggestion board",text:"Next to Door 2 is the library’s suggestion board. This week’s question is: *Should phones be banned in the reading room?* Four students have written their arguments. Mrs Karimova’s note says: “One argument is weak: it makes a big claim about **everybody** from just **one example**. Which one?” Type the letter.",clues:["**A:** “Phones ring and buzz. In a silent room, even one call can disturb many readers, so phones should at least be on silent.”","**B:** “Many students use dictionaries and e-books on their phones, so a total ban could make studying harder for some of them.”","**C:** “My cousin always studies with her phone next to her, and her marks are terrible. Phones clearly ruin everybody’s concentration.”","**D:** “When I leave my phone in my bag for an hour, I read much more. Maybe other students could try it too.”"],answer:"C",accept:["argument c","letter c"],hint:"Two arguments use one person’s experience. Look at what each one concludes: a careful suggestion (*maybe … could*) or a big claim (*clearly … everybody*)?",q:"Explain how you solved it. Why is D not the weak argument, even though it is also about one person?",by:"leo",m:"We ruled out A and B because they give general reasons, not one person’s story. C and D both use one person’s experience, so we looked at what they conclude. D only says “maybe other students could try it”: that’s a careful suggestion. C says phones “clearly ruin everybody’s concentration”, but it’s based on one cousin, and her marks could have other reasons. If that were true, then every student with a phone would have terrible marks! So the weak argument is C.",seconds:60},{title:"Door 3 · Fact or opinion?",text:"Door 3 has a keypad. Above it, Mrs Karimova has written four sentences about the library. Some are **facts**: you could check them with a clock, a timetable or a tape measure, even if they turned out to be wrong. Others are **opinions**: they show what someone thinks or feels. The code is the numbers of the **facts**, smallest first.",clues:["Three hours of reading is far too long for anyone.","The reading room is the largest room in the library.","The new lamps make the library look much nicer.","The library closes at 8 p.m. on weekdays."],answer:"24",accept:["2 and 4","two and four","42","4 and 2"],hint:"Don’t be tricked by numbers or by words like *largest*. For each sentence, ask: could we check it, or is it somebody’s feeling?",q:"Explain how you solved it. Which sentence was the hardest to decide, and why?",by:"amara",m:"First, we checked sentence 1. It has a number, three hours, but “far too long for anyone” is a feeling, so it’s an opinion. Sentence 2 sounds like an opinion because of the word “largest”, but you can measure rooms, so it’s a fact. Sentence 3 is an opinion: one person may love the lamps, and another may not. Sentence 4 can be checked on the timetable. We ruled out 1 and 3 because nobody can check them. So the only possible code is 2 and 4: 24.",seconds:60},{title:"Door 4 · What happened first?",text:"Behind Door 4 is Mrs Karimova’s office. Her notes about this evening have fallen on the floor. Four things happened: **A** she switched off the lights in the library café; **B** the last reader returned a book; **C** the cleaner locked the back door; **D** she finished writing the puzzles. Put A–D in order, from first to last, and type the four letters.",clues:["“The last reader returned his book at half past seven.”","“The cleaner locked the back door at ten to eight.”","“I finished the puzzles a quarter of an hour after the last book came back.”","“When the cleaner locked the back door, the café lights were still on.”"],answer:"BDCA",accept:["b, d, c, a"],hint:"Change every clue into a clock time: half past seven = 7.30. One event has no time: use the last clue to place it.",q:"Explain how you solved it. Which clue was the most useful, and why?",by:"nur",m:"First, we changed the clues into times. The last book came back at half past seven, so B was at 7.30. A quarter of an hour later is 7.45, so D comes next. Ten to eight is 7.50, so C is third. Event A has no time, but the café lights were still on when the back door was locked, so A must be last. The key clue turned out to be the last one. So the only possible order is B, D, C, A.",seconds:60},{title:"Door 5 · The headline",text:"The last door! On it is a page from the student newspaper. Mrs Karimova has circled the headline and written: “One word in this headline does not match the numbers in the report. Find it, and you’re free.” Type the word.",clues:["Headline: **Late library evenings a success: half of students now study after 8 p.m.**","Report: For four weeks, the library of the Faculty of Languages tried late evenings. On Tuesdays and Thursdays, it stayed open until 10 p.m. instead of 8 p.m. The faculty has 400 students. The door scanner shows that 45 different students came in after 8 p.m. during the four weeks, and most of them used the computers. “It has been a real success,” said the head librarian. The faculty will decide in June whether to continue."],answer:"half",accept:["half of students","half of the students"],hint:"Check the headline word by word against the report. Then do the maths: what is half of 400? How many different students came after 8 p.m.?",q:"Explain how you solved it. Is “a success” a fact or an opinion? Does the report support it?",by:"mateo",m:"We checked the headline word by word. Late evenings: yes, until 10 p.m. After 8 p.m.: yes. “A success” is only the head librarian’s opinion, but the report really quotes her, so the newspaper didn’t invent it. Then the numbers: half of 400 students is 200, but only 45 different students came. We ruled out every other word because the report supports it. The key clue turned out to be the number 45, so the word that doesn’t match is “half”.",seconds:60}],end:{title:"The exit is open!",text:"Mrs Karimova is waiting at the main entrance with a pot of green tea. “Well done! You didn’t just guess: you tested every idea, you checked the numbers and you listened to each other. That’s what critical thinking sounds like.” Now go to **Round 3** and think back on how you did it."}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why is critical thinking important for university students?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** critical thinking is one of the most useful skills a student can learn."],["Point","**The main reason is that** we read and hear so much information every day, and not all of it is true."],["Example","**For example,** when a message about cancelled exams went round our group chat in Samarkand, one friend checked the faculty website first and saved everyone a lot of worry."],["Close","**So, all things considered,** thinking critically helps us make better decisions, in our studies and in life."]],keys:["in my view","not all of it is true","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Should we believe everything we read online?",hint:"6 parts. No labels: follow the linking words.",parts:[["","Definitely not, **although** a lot of online information is useful and reliable."],["","**First of all,** anyone can publish anything online, so a website can look professional and still be wrong."],["","**For instance,** a friend of mine in Berlin shared a story about a new university rule, and the next day the university said it wasn’t true."],["","**However,** many online sources, like official websites, are carefully checked before they publish anything."],["","**That’s why** we should always ask who wrote a text and how they know."],["","**In short,** the internet is a great tool, but only if we use our own judgement."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"How can you tell if a source is reliable?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I ask three simple questions before I trust a source."],["","To begin with, I check who wrote it and whether they really know the subject."],["","On top of that, I look for evidence: a good source explains how it knows something."],["","Let me give you a real example: when I read about a new scholarship in Lagos, I found the same information on the university’s own website before I applied."],["","That said, even good sources can make mistakes, so it helps to compare two or three of them."],["","So, in a nutshell, a reliable source can answer three questions: who, how and where from."]],extra:"My favourite subject at school was geography, especially the maps.",keys:["to begin with","look for evidence","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it a good idea to get your news from social media?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think social media can be a good place to start, but not the place to finish."],["The main reason is that","news often appears there very quickly, sometimes faster than on television."],["For instance,","when there was a big storm in my city, Recife, I saw the first photos online within minutes."],["Having said that,","posts are often shared before anyone checks them, so mistakes spread fast."],["That’s why","I always look for the same story on a news website I trust."],["Ultimately,","social media tells you that something happened, but good journalism tells you what really happened."]],distractors:["In contrast,","Similarly,"],keys:["a good place to start","shared before anyone checks","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"What makes a good argument?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["a clear claim","evidence to back it up","for instance","the other side","to sum up"],model:"For me, a good argument starts with a clear claim: the listener should know exactly what you think. Then you need evidence to back it up, not just feelings or one story. For instance, if you say that a library should open later, you can show how many students asked for it. A strong argument also looks at the other side and answers it fairly, because that shows you have really thought about the problem. To sum up, a good argument is clear, supported and fair."}],np={title:"Exam Part 2 practice: helping students check information",situation:"Many students at your university in Samarkand share news and study tips in group chats, but some messages are not true. The English club can organise only one thing: a workshop with a university librarian, a weekly “Fact or Fake?” quiz, or a poster with five questions to ask before you share. Aziza and Leo are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"leo",lines:[["A","So, how can we help students check information? Shall we start with the workshop with a librarian?"],["B","Sure. A librarian really knows how to find reliable sources, but won’t a workshop feel like another lecture?"],["A","Fair point. Sorry, do you mean that students might not come?"],["B","Partly, yes. Most people are busy, so it has to be quick and fun."],["A","I see. What about the weekly quiz? It’s short, and people could play in teams."],["B","I like that. It’s less detailed than a workshop, but it’s more fun, isn’t it?"],["A","True. The poster is cheap, but people often walk past posters without reading them."],["B","So, shall we go for the quiz, and ask the librarian to help us write the questions?"],["A","Agreed. Then students have fun, and they still learn from an expert."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, isn’t it?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: your group is preparing a presentation about the Silk Road. You can use only **one** main source: a popular online video, a university textbook, or an interview with a guide at a local museum. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["Who says so?","How do they know that?","That’s just one example.","It doesn’t necessarily mean that …","Let’s look at both sides.","Is there any evidence to back that up?","Before I share something, I …","I’m not entirely convinced.","All the evidence points to …"],B:["Is there any evidence to back that up?","It depends on …","That’s an opinion, not a fact.","Who says so?","On the other hand, …","Let’s look at both sides.","Before I share something, I …","That’s just one example.","How do they know that?"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Who says so?","How do they know that?","Is there any evidence to back that up?","That’s just one example.","It doesn’t necessarily mean that …","I’m not entirely convinced.","On the other hand, …","Let’s look at both sides.","It depends on …","All the evidence points to …","That’s an opinion, not a fact.","Before I share something, I …"],questions:["How do you check if a news story is true?","Where do people in Uzbekistan usually get their news, and which sources do you trust most? Why?","Why do some stories go viral even when they are not true?","Is it better to trust an expert or your own experience? Why?","How can you disagree with someone’s argument politely?","What makes an advertisement believable, or not?"]},sp=[{type:"stress",title:"Stress Spot: word families where the stress moves",intro:"Tap the stressed syllable. In some word families, the stress moves when the word gets longer: ANalyse → aNALysis → anaLYTical. Words with -tion are stressed just before -tion. Then listen and say the word.",follow:"Now use analyse, analysis and evidence in one sentence about a news story.",items:[{w:"analyse",syl:["an","a","lyse"],s:0},{w:"analysis",syl:["a","nal","y","sis"],s:1},{w:"analytical",syl:["an","a","lyt","i","cal"],s:2},{w:"evidence",syl:["ev","i","dence"],s:0},{w:"evaluate",syl:["e","val","u","ate"],s:1},{w:"evaluation",syl:["e","val","u","a","tion"],s:3},{w:"opinion",syl:["o","pin","ion"],s:1},{w:"logic",syl:["log","ic"],s:0},{w:"conclusion",syl:["con","clu","sion"],s:1}]},{type:"pairs",title:"Sound Pairs: final /d/ or /t/?",intro:"Press Play and choose the word you hear. Before a final /d/, the vowel is longer and the /d/ is soft (side, card). A final /t/ is short and sharp (sight, cart). In Uzbek, a voiced sound at the end of a word often becomes voiceless, so side and sight can easily sound the same. Partner version: one student says a word, the partner points to it.",pairs:[["side","sight"],["card","cart"],["need","neat"],["bed","bet"],["wide","white"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker: “How do you know that?”","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: check the facts, jump to conclusions or a reliable source.","Say one fact and one opinion about your university library."],ip={title:"Step Up Speaking Club Ideas Evening: Before You Share It, Check It",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s online Ideas Evening, Amara gives a short talk about a rumour that went round her university in Lagos, and what her friend Aziza taught her.",tip:["Tell facts from opinions","In a talk, speakers mix what happened with what they think. Facts tell you *what happened*; opinions often begin with *As far as I’m concerned*, *I think* or *It seems*. Many questions ask for one or the other."],A:"amara",B:"aziza",lines:[["A","Good evening, everyone. Tonight I want to talk about the messages we share. [[0]] the most dangerous message is the one we want to believe."],["A","Last month, a message **went viral** in our student group chat in Lagos: “The university library is closing for a whole year!” Within an hour, people were angry, and some were already looking for new places to study. I almost **took it at face value** too."],["A","Then my friend Aziza, who studies in Samarkand, called me. “Don’t **jump to conclusions**,” she said. “**Check the facts** first. [[1]] Is it **a reliable source**?”"],["A","So I did. The message came from an account nobody knew, and it didn’t **back up its claim** with any details. The library’s own website said something different: one floor was closing for two weeks for new lights. Why did the rumour spread so fast? [[2]] it made us afraid, and fear travels faster than facts. [[3]]"],["A","Aziza’s study group in Samarkand has a habit I now copy. [[4]] news about exams: before they believe it, they **weigh up the evidence**, **look at both sides** and ask their teachers. Only then do they **draw a conclusion**."],["A","So, here’s my message. Thinking critically isn’t about believing nothing. It’s about **keeping an open mind**, **asking the right questions** and then making **an informed decision**. Next time a shocking message arrives, stop for one minute before you share it. Thank you."]],gaps:[[1,"As far as I’m concerned,"],[2,"What’s the source of that information?"],[3,"This is mainly because"],[4,"Are you with me so far?"],[5,"A good example is"]],questions:[{q:"What did the library’s own website say?",o:["The whole library was closing for a year.","One floor was closing for two weeks for new lights.","The library was moving to a new building."],a:1,why:"“The library’s own website said something different: one floor was closing for two weeks for new lights.”"},{q:"How did Amara react when she first saw the message?",o:["She shared it with all her friends.","She nearly believed it without checking.","She knew at once that it was false."],a:1,why:"“I almost took it at face value too.” She nearly believed it, but she checked after Aziza’s call."},{q:"Why does Amara mention Aziza’s study group?",o:["to show a careful habit that anyone can copy","to complain about exam news in Uzbekistan","to compare universities in Lagos and Samarkand"],a:0,why:"“Aziza’s study group in Samarkand has a habit I now copy … before they believe it, they weigh up the evidence, look at both sides and ask their teachers.”"},{q:"Which sentence is closest to Amara’s main message?",o:["Never believe anything you read online.","Only teachers can tell you what is true.","Stay open to new ideas, but check before you believe or share."],a:2,why:"“Thinking critically isn’t about believing nothing. It’s about keeping an open mind, asking the right questions and then making an informed decision.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one questions a source, and which one does Amara use to check that the audience is following?",groups:[["Opinion",[1]],["Questioning a source",[2]],["Reason",[3]],["Checking with the audience",[4]],["Example",[5]]]},use:{q:"Should social media apps warn people before they share a story that may be false? Why or why not?",by:"leo",model:"As far as I’m concerned, a short warning is a good idea. This is mainly because most of us share things in a hurry, without thinking. A good example is my cousin in Hamburg: he once shared a fake photo of a famous footballer, and when a friend asked him, “What’s the source of that information?”, he had no answer. A warning would make people stop for a second. So, all in all, I’d support it, as long as people can still decide for themselves.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},lp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS
