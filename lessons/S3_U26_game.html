dAefb89YBoa5th5SmHLaXSQrnJq4VKJebIx8vAlUNjs8Hi/ouVQYYafuTlZCuDot4kLCWQbLqCKVmr91KMjVTNANKrlOrGDQKV9Ksmf8+i7CfBzNf1syAtk2iEj4wlh8pGf+54Sv1EVusuvPzwTcE5OSY2F7CmGPl077SHCaFA/UaQ9AAZx5+myzmoJ8YbTa4Rj6undyX3KdSjNLvqdcAuujl5ukyi+v/EfVfEG+qwMe8izDHxo9QepG463HRoA0t5PaHwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Jf={code:"S3_U26",semester:3,unit:26,title:"The Science of Addiction",subtitle:"Why Are Some Habits So Hard to Break?",module:6,stage:"Stage 2 · EXTEND",level:"B2+",sioLevel:2,hero:{tags:[["b2","B2+"],["c1","C1 stretch"],["bl","Bloom: Understand → Create"]],title:"The Habit Clinic: ask the experts",paras:["It’s **Wellbeing Week** at a university in Navoi, and the student union has invited a panel of **experts** to its **Habit Clinic**: a sleep researcher, a game designer, a neuroscientist, a nutritionist and others. First-year students want to know why phones, games, sweets, coffee and late-night shopping are so **hard to put down**, and what really helps.","In each panel, one student takes **the hot seat** as an expert. The host and two interviewers ask questions and read out **letters** from first-year students; a leaflet writer turns the best advice into **three tips** for the class **Habit Clinic leaflet**. From Samarkand to Helsinki, people are asking the same question: why are some habits so hard to break?"],rule:"Rule of respect: the experts and the letters are fictional. Nobody talks about their own or their family’s habits or health: we talk about people in general. We never laugh at anyone’s struggle, and asking for help is a sign of strength."}},Qf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Four short extracts from the Club (exam Part 1): listen for a purpose, a reason, a feeling and a main point, notice that the words you hear are not always the answer, then use the speakers’ phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Aziza, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about people in general, not about their own habits.","The extracts are read by the computer’s voices. If you record them with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about the brain and behaviour, and /j/ or /dʒ/ (yet or jet?). (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about habits in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute about habits in general; two classmates listen for phrases that explain causes and give advice. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","The questions are about people in general. Nobody has to talk about their own habits."]},{id:"game",icon:"🎙",name:"The Habit Clinic",min:18,lv:"c1",group:"3 panels of 5",kind:"five",roles:["Host","Expert","Interviewer","Interviewer","Leaflet writer"],desc:"Hot Seat with experts: one student answers as a fictional expert, the panel asks questions and reads letters from first-year students, challenges the expert, and writes three tips for the class Habit Clinic leaflet. (Book: section 6 · Game School: Hot Seat)",howto:["15 students = 3 panels of five. All panels run at the same time, each in its own corner (👥 Class → Groups of 5).","Roles: host, expert (in the hot seat), two interviewers and a leaflet writer. The expert takes one expert card; the others may read it, but nobody opens the Secret before Round 3.","Rounds: The interview 5 min · Clinic letters 4 min · Challenge the expert 4 min · Golden rule and score 5 min. Next lesson, rotate the roles.","At the end, each leaflet writer reads the panel’s three tips aloud. The class chooses the best five for one Habit Clinic leaflet for first-year students."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about choosing an event for Wellbeing Week, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 26, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. Each one is about a different extract: a purpose, a reason, a feeling or a main point.","Press **Play the podcast**. You hear four short extracts. Careful: a wrong option often repeats words from the extract. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: reason, opinion, advice, example and checking meaning.","**Your turn:** listen to Aziza, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is A. I heard “willpower” and “switch off”.","gives an answer"],["B","Careful: that’s what Nur expected before the talk.","challenges politely"],["A","“I left feeling far more hopeful than I expected.”","checks the text again"],["B","So she felt positive at the end. It’s B.","paraphrases"]],checks:[["Why is A wrong in question 3?","Nur uses the words “willpower” and “switch off” about what she expected before the talk. At the end she felt “far more hopeful than I expected”. The words are in the extract, but the meaning is different."],["Which phrase does Nur use to check meaning?","Sorry, are you saying that …?"]]},pron:{ref:"Book: Lesson 26, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion**, **-ive** and **-ology**, the syllable is usually strong (*adDICtion*, *comPULsive*, *psyCHOlogy*). Some words just have to be learned: *DOpamine*.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /j/ (*yet*) or /dʒ/ (*jet*)?","Say **both** words. For /j/, the tongue comes close to the roof of the mouth but **does not touch it**: it is a soft glide, like a very short *ee*. For /dʒ/, the tongue **touches** the roof of the mouth first and then lets go.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *addiction*. Which syllable is strong?",""],["A","*AD*? The first one?","a first guess"],["T","Listen again: ad-DIC-tion. It ends in *-tion*.","the teacher gives a clue"],["B","So the syllable before *-tion* is strong: ad-*DIC*-tion.","uses the rule"],["T","Yes! Now listen: *yolk*. Or was it *joke*?",""],["A","*Yolk*. My tongue didn’t touch anything: it was soft, like *ee*.","listens for the first sound"],["B","And *joke* starts with a little stop, like *d* at the beginning.","compares the pair"]],checks:[["Where is the stress in *psychology*?","on CHO: psy-CHO-lo-gy, just before *-ology*."],["Where is the stress in *dopamine*?","on DO: DO-pa-mine. Learn this one by heart."],["How is /j/ in *year* different from /dʒ/ in *jeer*?","for /j/ the tongue does not touch the roof of the mouth; for /dʒ/ it touches first, then lets go."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it gives a clear answer straight away (*I think … because …*).","Follow the linking words: *For one thing* (a first reason) → *On top of that* (a second reason) → *Take … for example* (an example) → *However* (the other side) → *So, to sum up* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds. Talk about people in general.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Amara’s answer changed in 4/3/2",lines:[["amara","Er, habits are hard to break because … you don’t think. You just do it. Like the phone, it buzzes and … you look. So, yes. Hard.","Attempt 1 · 90 s · many pauses"],["amara","I think habits are hard to break because they’re automatic. For one thing, a cue, like a buzz from your phone, starts the routine. On top of that, the reward comes at once. However, if we change the cue, the habit gets weaker. So habits are hard, but not impossible, to change.","Attempt 2 · 60 s · linking words"],["amara","I think habits are hard to break because they run on autopilot. For one thing, every habit has a cue that starts it automatically; on top of that, the reward is instant, while the cost comes much later. Take my phone in lectures in Lagos: my hand reaches for it before I’ve decided anything. However, change the cue and the habit weakens. So, to sum up: automatic, yes; unchangeable, no.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks about **people in general**.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Why do people find it so hard to put their phones down?",lines:[["leo","**It all starts with** a cue: a buzz, a light, a moment of boredom. **Before you know it,** you’ve been scrolling for half an hour. **What tends to happen is** that every video promises something better next. **The tricky part is** that there’s no natural place to stop. **It’s not a question of willpower**: **the key is to** change the cue, for example by switching off notifications.","speaker · 1 minute"],["mateo","I heard six phrases: *It all starts with*, *Before you know it*, *What tends to happen is*, *The tricky part is*, *It’s not a question of willpower* and *The key is to*. That’s a full row: **Bingo!**","listener reports"],["leo","Six points plus three for the Bingo: nine points!","count the points"],["mateo","Next time, try *It’s a vicious circle*. It’s on my card, and it fits really well.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you have to talk about your own habits?","no: talk about people in general, or about characters, students or experts."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which event should we …?*).","Click the lines in order. Each line answers the line before. Nur and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: phones at the club meeting",lines:[["A","So, how can we stop people checking their phones during club meetings?","opens the topic"],["B","We could ban phones, but that feels a bit strict, doesn’t it?","an idea + a question tag"],["A","True. What about a basket at the door, just for the first half?","reacts + a new idea"],["B","Good idea. Let’s try it next week and see what people think.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School · Hot Seat · section 6",steps:["Make panels of five: **Host, Expert, Interviewer 1, Interviewer 2, Leaflet writer** (👥 Class → Groups of 5). Next lesson, the roles move one place.","**Expert cards:** the expert turns over one card and reads it: *My work*, *What I see*, *My advice*. You are now that expert. Don’t open the **Secret** yet.","**Round 1 · The interview (5 min):** the host introduces the expert and opens question cards one by one. The expert answers in role for about 45 seconds each.","**Round 2 · Clinic letters (4 min):** the host opens a letter from a first-year student. The expert explains what is happening and gives advice; each interviewer adds one idea or asks a follow-up question.","**Round 3 · Challenge the expert (4 min):** each interviewer challenges the expert with an opinion from the audience. The expert agrees with part of it, explains their view and may reveal the **Secret**.","**Round 4 · Golden rule and score (5 min):** the expert gives a one-minute golden rule. The leaflet writer reads the panel’s **three tips**, and the panel gives 0–5 points for each criterion, plus one star and one wish."],exTitle:"Sample panel: Panel Samarkand",lines:[["","Host Aziza · Expert Mateo (as Rustam Karimov, digital-wellbeing coach) · Interviewers Nur and Amara · Leaflet writer Leo",""],["aziza","Welcome to the **Habit Clinic**! Our first expert runs workshops on healthy ways to use phones. Rustam, **why do so many of us scroll for longer than we planned**?","host: welcome + first question card"],["mateo","**It all starts with a cue**: a buzz or a moment of boredom. Then the routine, the scroll, gives a small reward. And endless feeds have **no natural place to stop**.","expert answers in role"],["","Round 2 · Clinic letters",""],["aziza","A letter from Bekzod, first year: “**I check my phone in every lecture, even when nothing has happened.**”","host opens a letter"],["mateo","Bekzod, you’re not alone. Your brain has learned that the phone **might** have something new. **My advice:** put it in your bag, on silent, for the whole lecture.","expert: the science + advice"],["nur","**Could he also** choose one break when he checks it on purpose?","interviewer adds an idea"],["","Round 3 · Challenge the expert",""],["amara","**Some people would say** it’s just a lack of willpower. What do you think?","interviewer challenges"],["mateo","**I’d agree up to a point**, but most of us find it harder to resist when we’re tired. **It’s smarter to change the situation.** **And here’s my secret:** for a year, I used a simple button phone with no apps.","expert: part agree + Secret"],["leo","Our three tips: switch off notifications, keep the phone in your bag in lectures, and check it on purpose, not on autopilot. Scores: clear science 4, practical advice 5, respectful tone 5. Star: the button phone story. Wish: one more example from university life.","leaflet writer: tips, scores, star, wish"]],checks:[["Who opens the question cards and the letters?","the host."],["What does the expert do in Round 3?","agrees with part of the challenge, explains their view and may reveal the Secret."],["What does the leaflet writer read at the end?","the panel’s three tips for the Habit Clinic leaflet; then the panel gives scores, one star and one wish."]]},drills:{ref:"Book: Lesson 26 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Yf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"It usually takes many repetitions to ___ .",o:["form a habit","kick a habit","cut a habit"],a:0},{q:"A cue, a routine and a reward together make ___ .",o:["a reward system","a habit loop","a vicious habit"],a:1},{q:"The smell of fresh bread can ___ for something sweet.",o:["seek support","trigger a craving","break the cycle"],a:1},{q:"Scientists link dopamine to the brain’s ___ .",o:["habit loop","instant gratification","reward system"],a:2},{q:"Short videos offer ___ : the fun comes immediately.",o:["instant gratification","a slow reward","an autopilot"],a:0},{q:"I didn’t even decide to open the app: I was on ___ .",o:["autopilot","a craving","the cycle"],a:0},{q:"It’s hard to ___ to check your phone when it buzzes.",o:["resist the urge","fall back into","cut down on"],a:0},{q:"She didn’t stop drinking coffee at once; she ___ it slowly.",o:["kicked the habit of","cut down on","fell back into"],a:1},{q:"After a stressful week, it’s easy to ___ old habits.",o:["break the cycle of","seek support for","fall back into"],a:2},{q:"If a habit harms your studies or health, it’s wise to ___ .",o:["seek support","trigger a craving","form a habit"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"People check their phones without thinking. → **a question: Why do …?**",a:"Why do people check their phones without thinking?"},{p:"Many students drink a lot of coffee. → **cut down on (present continuous)**",a:"Many students are cutting down on coffee."},{p:"He stopped playing games at night. → **a negative: He hasn’t … yet**",a:"He hasn’t stopped playing games at night yet."},{p:"I check my phone every morning. → **used to (the past)**",a:"I used to check my phone every morning."},{p:"I used to check my phone every morning. → **I’m used to …**",a:"I’m used to checking my phone every morning. (be used to + -ing!)"},{p:"She has a habit. She checks the news at midnight. → **one sentence: She has a habit of …**",a:"She has a habit of checking the news at midnight."},{p:"If you switch off notifications, you check your phone less. → **an unreal situation: If you switched off …**",a:"If you switched off notifications, you would check your phone less."},{p:"The app keeps users scrolling. → **the passive: Users …**",a:"Users are kept scrolling by the app."},{p:"You should put your phone in another room. → **advice: It might be worth …**",a:"It might be worth putting your phone in another room."},{p:"It might be worth putting your phone in another room. → **a suggestion: Why don’t you …?**",a:"Why don’t you put your phone in another room?"},{p:"He stopped. He wanted to drink some water. → **stop + to (purpose)**",a:"He stopped to drink some water. (stop to = stop in order to)"},{p:"He stopped to drink some water. → **stop + -ing: he no longer drinks energy drinks**",a:"He stopped drinking energy drinks. (stop + -ing = no longer do it)"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I do it without thinking.",a:"I do it on autopilot."},{p:"It’s very hard to stop.",a:"It’s notoriously hard to break the cycle."},{p:"Apps want us to use them a lot.",a:"Many apps are deliberately designed to keep us hooked."},{p:"You should use your phone less.",a:"It might be worth cutting down on screen time gradually."},{p:"People want good things now, not later.",a:"We tend to prefer instant gratification."},{p:"It’s not only about willpower.",a:"It’s not simply a question of willpower."},{p:"If it is a big problem, talk to a doctor.",a:"If it starts to affect your health, it’s worth seeking professional support."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ Many teenagers are addicted from their phones.",o:["Many teenagers are addicted to their phones.","Many teenagers are addicted with their phones.","Many teenagers are addicting to their phones."],a:0,why:"be addicted to something (to, not from or with)"},{q:"✗ I want to stop to eat sweets in the evening.",o:["I want to stop eat sweets in the evening.","I want to stop eating sweets in the evening.","I want stop eating sweets in the evening."],a:1,why:"stop + -ing = no longer do something; stop + to = stop in order to do something else"},{q:"✗ Students spend a lot of time for social media.",o:["Students spend a lot of time on social media.","Students spend a lot of time to social media.","Students spend a lot of times for social media."],a:0,why:"spend time on something, or spend time + -ing (spend time scrolling)"},{q:"✗ He has a habit to check his phone at midnight.",o:["He has a habit of checking his phone at midnight.","He has a habit checking his phone at midnight.","He has habit to check his phone at midnight."],a:0,why:"a habit of + -ing"},{q:"✗ I am used to drink coffee every morning.",o:["I am used to drinking coffee every morning.","I am use to drink coffee every morning.","I used to drinking coffee every morning."],a:0,why:"be used to + -ing (= it is normal for me); used to + verb (= in the past)"},{q:"✗ It’s difficult to get rid from an old habit.",o:["It’s difficult to get rid an old habit.","It’s difficult to get rid of an old habit.","It’s difficult to get rid off an old habit."],a:1,why:"get rid of something"},{q:"✗ She can’t resist to look at her messages.",o:["She can’t resist looking at her messages.","She can’t resist look at her messages.","She can’t resist of looking at her messages."],a:0,why:"resist + -ing (or resist the urge to + verb)"},{q:"✗ Too much screen time is harmful for your sleep.",o:["Too much screen time is harmful to your sleep.","Too much screen time is harmful at your sleep.","Too much screen time is harm to your sleep."],a:0,why:"harmful to something (or bad for something)"}]},{title:"Stress: words about the brain and behaviour",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"a very strong need to keep doing something",o:["ADdiction","adDICtion"],a:1,why:"-tion words stress the syllable just before -tion."},{q:"the way a person acts",o:["beHAviour","BEhaviour"],a:0,why:"be-HA-viour: the prefix be- is not stressed."},{q:"a chemical messenger in the brain",o:["doPAmine","DOpamine"],a:1,why:"DO-pa-mine: learn this one by heart."},{q:"a message that pops up on your phone",o:["notifiCAtion","NOtification"],a:0,why:"-tion words stress the syllable just before -tion."},{q:"the scientific study of the mind",o:["PSYchology","psyCHOlogy"],a:1,why:"-ology words stress the syllable just before -ology."},{q:"hard to stop doing, even when you want to",o:["comPULsive","COMpulsive"],a:0,why:"The syllable before -ive is usually strong: comPULsive, adDICtive."},{q:"the feeling of looking forward to something",o:["ANticipation","anticiPAtion"],a:1,why:"-tion words stress the syllable just before -tion."}]}],Gf={cardsStep:"Expert cards",cardsTitle:"Expert cards",cardsHint:"The expert of each panel picks one card face down: it turns over and opens. Read it, close it, and the next expert picks. The host, the interviewers and the leaflet writer may read the card too, but nobody opens the Secret before Round 3.",backWord:"Expert",hiddenLabel:"Secret",hiddenAll:"Show all secrets",questionWord:"Question",questionTitle:"Host’s question cards",questionHint:"The host opens one card at a time and asks the expert. Ask at least four questions. Model answers: a Club member plays one of the experts.",questionHelp:{b2:["In my work, I see that …","It all starts with …","What tends to happen is …"],c1:["The science suggests that …","It’s not simply a question of willpower; …","The key, in my experience, is …"]},twistWord:"Letter",twistTitle:"Clinic letters",twistHint:"The host opens one letter from a first-year student and reads it aloud. The expert explains what is happening and gives practical advice. Each interviewer adds one idea or asks a follow-up question. The students in the letters are fictional.",twistHelp:{b2:["You’re not alone: this happens because …","My advice is to …","Rather than …, try …"],c1:["What’s probably going on is …","A small change that tends to work is …","If it starts to affect your health or studies, …"]},scoreTitle:"Panel score sheet",scoreHint:"After the expert’s golden rule, the host, the interviewers and the leaflet writer agree on 0–5 points for each criterion. Then the leaflet writer reads the panel’s three tips for the Habit Clinic leaflet, one star and one wish.",scoreCriteria:["Clear science","Practical advice","Respectful tone"],teamWord:"Panel",teamIcon:"",teamKind:"five",teams:3},Kf=[{name:"Round 1 · The interview",lv:"b2p",bloom:"Understand",by:"aziza",seconds:60,tool:"questions",q:"Host: welcome the audience, introduce your expert and ask questions from the cards. Expert: answer in role, about 45 seconds each: what you study, what you see and what you advise.",help:{b2:["Welcome to the Habit Clinic! Our first expert …","In my work, I see that …","It all starts with …"],c1:["It’s a real pleasure to welcome …","The science suggests that …","What tends to happen is …"]},model:"Good evening, and welcome to the Habit Clinic, the part of Wellbeing Week where the questions come from you. Our first expert designs puzzle games, so she knows exactly how games keep us playing, and how they could help us stop. Aino, thank you for coming all the way from Finland. Let’s begin with a simple question: what do you actually do in a normal working day, and why did you want to talk to first-year students?"},{name:"Round 2 · Clinic letters",lv:"b2p",bloom:"Apply / Analyse",by:"nur",seconds:60,tool:"twists",q:"The host opens **one letter** from a first-year student and reads it aloud. Expert: explain what is probably happening (cue, routine, reward) and give **one practical piece of advice**. Interviewers: each add one idea or ask a follow-up question.",help:{b2:["You’re not alone: this happens because …","My advice is to …","Rather than …, try …"],c1:["What’s probably going on is …","A small change that tends to work is …","If it starts to affect your health or studies, …"]},model:"Dilshod, first of all, you’re not alone: this is one of the most common letters we get. What’s probably going on is a habit loop. The cue is getting into bed, the routine is opening the app, and the reward is a funny video. Because the next video might be even better, there’s never a good moment to stop. So my advice is to change the cue: charge your phone outside the bedroom, and put a paper book or an old alarm clock next to your bed instead."},{name:"Round 3 · Challenge the expert",lv:"c1",bloom:"Evaluate",by:"leo",seconds:60,q:"Interviewers: challenge the expert with an opinion from the audience, for example **“It’s just a lack of willpower.”** · **“The apps are to blame, not the users.”** · **“Universities should ban phones in lectures.”** Expert: agree with part of it, explain your own view and reveal your **Secret** if it helps.",help:{b2:["Some people would say that …","I agree up to a point, but …","Actually, here’s my secret: …"],c1:["I’d challenge that slightly: …","There’s some truth in that; however, …","What matters more, I’d argue, is …"]},model:"*(Challenge: “The apps are to blame, not the users.”)* There’s some truth in that. Many apps are deliberately designed to keep us hooked: endless feeds, streaks, notifications. As a game designer, I know how powerful those tools are. However, blaming the apps alone makes users sound helpless, and they aren’t. What matters more, I’d argue, is sharing the responsibility: designers should build in natural stopping points, and users can switch off notifications. And here’s my secret: I keep a box of paper drawings of every game I’ve ever made, and the newest ones all have a ‘rest’ button."},{name:"Round 4 · Golden rule and score",lv:"c1",bloom:"Evaluate / Create",by:"amara",seconds:60,tool:"score",q:"Expert: give a one-minute **golden rule** for first-year students. Leaflet writer: read the panel’s **three tips** for the Habit Clinic leaflet. Then the panel gives scores, one star and one wish.",help:{b2:["My golden rule is …","Start with one small change, like …","And remember: asking for help is …"],c1:["If there’s one thing I’d like you to take away, it’s …","It’s tempting to …, but in my experience …","Ultimately, it comes down to …"]},model:"If there’s one thing I’d like you to take away, it’s this: make the good choice the easy choice. Don’t try to change five habits on Monday morning; choose one, and change the situation around it. If you want to scroll less, move the app off your home screen. If you want to sleep more, give your evening a clear end. And if a habit starts to hurt your health, your studies or your friendships, talk to someone: a friend, a tutor or the university counsellor. Ultimately, it comes down to being kind to yourself while you change."}],_f=[{n:"Dr Malika Yusupova",r:"Sleep researcher · Uzbekistan",look:{skin:"#E3B48C",hair:"#1E1511",style:"long",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My work","She studies sleep at a university in Tashkent and gives talks to students before exam season."],["What I see","Many students take their phones to bed. One more video becomes ten, and they sleep much less than they planned."],["My advice","Give your evening a clear end: a fixed time when the phone goes to charge outside the bedroom."]],x:"She still uses the wind-up alarm clock she bought in her first year at university, so her phone never has to sleep next to her."},{n:"Aino Virtanen",r:"Game designer · Finland",look:{skin:"#F2D3B6",hair:"#D8B26A",style:"bun",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["My work","She designs puzzle games for phones and computers."],["What I see","Games use levels, daily rewards and surprise prizes to keep players coming back. Most players enjoy this; some find it very hard to stop."],["My advice","Choose games with natural stopping points, and decide when you will stop before you start playing."]],x:"She keeps a box of paper drawings of every game she has ever designed, starting with one she drew at school. The newest ones all have a ‘rest’ button."},{n:"Dr Priya Nair",r:"Neuroscientist · India",look:{skin:"#B9835E",hair:"#1C130E",style:"long",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["My work","She studies how the brain learns from rewards."],["What I see","The brain’s reward system reacts strongly when we expect something pleasant. A notification, a sweet or a ‘like’ can all set off that expectation."],["My advice","Notice the cue that starts the habit. You can’t change a habit you haven’t noticed."]],x:"On her desk there is a plastic model of the brain that comes apart in pieces. She can put it back together with her eyes closed."},{n:"Kofi Asante",r:"University counsellor · Ghana",look:{skin:"#6F4630",hair:"#1C130E",style:"short",beard:!0,top:"#F7C08E",bg:"#FFE4D6"},lines:[["My work","He listens to students who want to change a habit and helps them to make a plan."],["What I see","Many students feel ashamed and wait too long before they ask for help. Shame usually makes a habit harder to change, not easier."],["My advice","Talk to someone you trust. A friend, a tutor or a counsellor can help you find the right support."]],x:"He keeps a jar of paper notes on his desk. On each one, a student has written one small win, with no name."},{n:"Sofía Morales",r:"Nutritionist · Chile",look:{skin:"#D9A47C",hair:"#3A2418",style:"curly",top:"#F5A9BF",bg:"#FFE1EA"},lines:[["My work","She advises people on food and drink for busy days."],["What I see","Sweet snacks and strong coffee give a quick lift, and soon we want another one. Long study nights make it worse."],["My advice","Don’t ban everything at once. Cut down step by step, and keep water and simple snacks like fruit or nuts on your desk."]],x:"She can bake biscuits sweetened only with dates and raisins, and she brings a box of them to every talk she gives."},{n:"Rustam Karimov",r:"Digital-wellbeing coach · Uzbekistan",look:{skin:"#D9A47C",hair:"#2B1A12",style:"short",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My work","He runs workshops in Samarkand on healthy ways to use phones and social media."],["What I see","Endless feeds and constant notifications pull our attention away again and again, even when we want to concentrate."],["My advice","Switch off every notification except messages from real people, and move tempting apps off your home screen."]],x:"For one year, as an experiment, he used a simple button phone with no apps. He still knows his friends’ phone numbers by heart."},{n:"Hana Sato",r:"Behavioural economist · Japan",look:{skin:"#F2D3B6",hair:"#1E1511",style:"short",glasses:!0,top:"#F7D774",bg:"#FFF3C4"},lines:[["My work","She studies how people make choices when they shop, especially online."],["What I see","Countdown timers, ‘only two left’ messages and one-click buying push us to decide fast, often late at night."],["My advice","Use a waiting rule: put the item in your basket and decide two days later. Often the wish simply disappears."]],x:"She keeps a paper ‘two-day list’ on her fridge. Anything she wants to buy goes on the list first."},{n:"Elena Petrova",r:"Peer-support trainer · Bulgaria",look:{skin:"#E8BE98",hair:"#5A3A22",style:"long",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["My work","She trains student volunteers to listen to classmates who are struggling and to point them towards professional help."],["What I see","People change more easily when they feel understood, not judged. Lectures and jokes usually push them away."],["My advice","If a friend is struggling, listen first, ask how you can help, and offer to go with them to a counsellor or a doctor."]],x:"She has run her listening workshop in four languages, and it always starts with the same exercise: two minutes of listening without saying a word."}],$f=[{t:"Letter from Dilshod, first year: “I open a video app ‘for five minutes’ before bed, and suddenly it’s two in the morning.”",q:"What is probably happening, and what should he try tonight?",by:"nur",m:"Dilshod, you’re not alone. What’s probably going on is a habit loop: the cue is getting into bed, the routine is opening the app, and the reward is a funny video. Because the next one might be even better, there’s never a natural moment to stop. Rather than relying on willpower at midnight, change the cue: charge the phone outside the bedroom and keep a paper book by the bed instead."},{t:"Letter from Lola, first year: “In exam week I drink cup after cup of strong coffee, and then I can’t sleep.”",q:"Explain the cycle and suggest a plan for her next exam week.",by:"amara",m:"It sounds like a vicious circle, Lola. The coffee keeps you awake, so you sleep badly, so the next morning you need even more coffee. My advice is to cut down step by step, not overnight: no coffee after lunch, and one cup fewer each day. Keep a bottle of water on your desk, and take a short walk when you feel sleepy. A good night’s sleep will probably help your exams more than another cup."},{t:"Letter from Bekzod, first year: “I check my phone in every lecture, even when nothing has happened.”",q:"Why does he do it, and how can he stop without missing important messages?",by:"mateo",m:"Bekzod, your brain has learned that the phone might have something new, and that ‘might’ is very powerful. Every check is a small surprise, so the habit grows stronger. My advice: put the phone in your bag, on silent, for the whole lecture, and choose one moment in the break to check it on purpose. If your family needs you urgently, they can call; everything else can wait fifty minutes."},{t:"Letter from Madina, first year: “When I’m stressed, I eat sweets without even noticing.”",q:"What is the cue here, and what could replace the routine?",by:"aziza",m:"That’s a very common pattern, Madina. Here, the cue isn’t hunger; it’s stress. The sweets give a quick, pleasant feeling, so the brain learns: stress, then sugar. Rather than banning sweets completely, try to notice the cue and give it a different routine: a glass of water, a five-minute walk or a quick call to a friend. And keep fruit or nuts on your desk, so the easy choice is also the better one."},{t:"Letter from Lucas, exchange student from France: “I buy things online late at night and regret it in the morning.”",q:"Why is late-night shopping so tempting, and what rule would help him?",by:"leo",m:"Late at night, Lucas, we’re tired, and tired brains love instant gratification. Online shops know this: countdown timers and ‘only two left’ messages push us to decide fast. My advice is a waiting rule. Put the item in your basket, close the app and decide two days later. If you still want it, buy it with a clear head. Very often, the wish simply disappears."},{t:"Letter from Shahzoda, first year: “My roommate plays online games all night and has stopped coming to lectures. How can I help without sounding like his mother?”",q:"How can a friend help in a respectful way, and when is professional help needed?",by:"nur",m:"Shahzoda, it’s kind of you to care. First, choose a calm moment and talk about what you’ve noticed, not about what he is: “I’ve missed you at lectures” works better than “You’re addicted”. Listen more than you speak, and don’t joke about it. If the habit is affecting his studies and health, suggest the university counsellor, and offer to go with him. You can support him, but you don’t have to fix it alone."}],ep=[{t:"Your work",q:"What does your job involve, and why do people come to you?",by:"nur",m:"I’m a sleep researcher, so I study what helps people sleep well and what keeps them awake. Students usually come to me before exam season, because they feel tired all the time. When we talk, the same story comes up again and again: the phone goes to bed with them, one more video becomes ten, and suddenly it’s long past midnight. My job is to explain why that happens and to help them build a better evening routine."},{t:"The habit loop",q:"How does a habit actually form?",by:"amara",m:"Researchers often describe a habit as a loop with three parts. First there’s a cue: a sound, a place, a feeling or a time of day. Then comes the routine, the thing we actually do. Finally, there’s a reward, something pleasant that makes the brain want to repeat the loop. When the same cue leads to the same reward many times, the routine becomes almost automatic. That’s why we sometimes pick up our phone before we’ve even decided to."},{t:"The reward system",q:"Why does the brain always want ‘just one more’?",by:"leo",m:"It’s mostly about the brain’s reward system. A chemical messenger called dopamine is closely linked to that system, and scientists think it plays a big part when we expect a reward, not only when we get one. So the brain gets excited by the possibility: maybe the next video will be funny, maybe the next message is important. Because we never know, we keep checking. Rewards that might or might not come are often the hardest to walk away from."},{t:"Habit or addiction?",q:"What is the difference between a strong habit and an addiction?",by:"aziza",m:"That’s an important question, and I’d answer it carefully. A habit is something we do automatically, and many habits are harmless or even useful. Experts usually talk about addiction when someone keeps doing something even though it is clearly harming their health, studies, work or relationships, and they find it extremely hard to stop. It’s a health condition, not a sign that a person is weak or bad. That’s why doctors and counsellors, not jokes or lectures, are the right people to help."},{t:"Designed to hook",q:"How do apps, games and online shops keep us coming back?",by:"mateo",m:"Many of them are designed very carefully. Endless scrolling means there’s no natural place to stop. Notifications act as cues that pull us back. Games give daily rewards and streaks, so missing a day feels like losing something. Online shops show countdown timers and messages like ‘only two left’. None of these tricks is magic, but together they make it much easier to keep going than to stop."},{t:"Willpower",q:"Isn’t breaking a habit just a question of willpower?",by:"nur",m:"Not really, and I think that idea makes people feel guilty for no reason. Most of us find it harder to resist the urge when we’re tired, hungry or stressed, and that’s exactly when old habits come back. So instead of fighting the same battle every evening, it’s smarter to change the situation. If the phone charges in the kitchen, you don’t need willpower at midnight, because the cue simply isn’t there."},{t:"Small changes",q:"What one small change would you recommend to a first-year student?",by:"amara",m:"Choose one habit, not five, and make the good choice the easy choice. For example, if you want to drink less coffee, don’t stop completely on Monday; have one cup fewer each week and keep a bottle of water on your desk. If you want to scroll less, move the app off your home screen. Small changes feel almost too easy, but that’s exactly why people manage to keep them."},{t:"Asking for help",q:"When should someone ask for professional help, and how can friends support them?",by:"leo",m:"If a habit is starting to damage someone’s health, studies, money or relationships, and they’ve tried to change it but can’t, that’s the moment to talk to a professional: a university counsellor, a doctor or a helpline. Friends can help a lot by listening without judging, by not making jokes about it and by offering to go along to the first appointment. Asking for help is a sign of strength, not weakness."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why do many people check their phones so often?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** many people check their phones so often because it has become a habit, not a decision."],["Point","**The main reason is that** phones are full of small rewards: a message, a ‘like’ or a funny video."],["Example","**For example,** on the bus in Navoi, I often see people take out their phones the moment they sit down, even if nothing has happened."],["Close","**So, all things considered,** we check our phones because our brains expect something new every time."]],keys:["in my view","the main reason is that","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"amara",q:"Why are some habits so hard to break?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I think some habits are hard to break **because** they run on autopilot: we start them before we have even decided to."],["","**For one thing,** every habit is linked to a cue, such as a sound, a place or a feeling, and the cue starts the routine automatically."],["","**On top of that,** the reward comes immediately, while the cost, such as tiredness or a lost evening, comes much later."],["","**Take my phone in lectures in Lagos, for example:** whenever it buzzed, my hand reached for it before I had decided anything."],["","**However,** that doesn’t mean we are helpless: if we change the cue, for instance by switching off notifications, the habit gets weaker."],["","**So, to sum up,** habits are hard to break because they are automatic, but they are not impossible to change."]],keys:["because","for one thing","on top of that","however"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"Should apps and games be designed to help users take breaks?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think they should, at least in a simple way that users can switch off."],["","To begin with, many apps are deliberately designed to keep us hooked, so it seems fair that they also help us stop."],["","On top of that, a short reminder after an hour costs the company very little but can save the user a whole evening."],["","In Germany, for instance, some of my friends use a game that saves their progress and suggests a break, and they say it helps."],["","That said, reminders shouldn’t treat adults like children, so users must be able to change the settings."],["","So, in a nutshell, a well-designed break button respects both the user’s time and the user’s freedom."]],extra:"My favourite game has beautiful music and very colourful characters.",keys:["to begin with","on top of that","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is it easier to start a good habit or to stop a bad one?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think it’s usually easier to start a good habit than to stop an old one."],["The main reason is that","an old habit already has a strong cue and a reward, while a new habit has to build them from nothing."],["For instance,","a friend of mine in Recife found it hard to give up sweet fizzy drinks, but much easier to start carrying a bottle of water."],["Having said that,","a new habit can slowly push out an old one, because there is only so much time in a day."],["That’s why","many experts suggest replacing a habit rather than simply fighting it."],["Ultimately,","the best strategy is often to do both at once: start something good in the place of something you want to stop."]],distractors:["In contrast,","Meanwhile,"],keys:["start a good habit","the main reason is that","having said that","replacing"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"How can a university help students build healthy habits?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["make the healthy choice easy","quiet places, water, sport","for instance","talks, not lectures","counsellor: no shame"],model:"I think a university can do a lot, mainly by making the healthy choice the easy choice. It can offer quiet places to study without phones, free drinking water and cheap sport in the evenings. For instance, at my university in Kuala Lumpur, there’s a study room where phones stay in lockers, and it’s always full before exams. Short, friendly talks by experts work better than long lectures about what students do wrong. Above all, students should know where the counsellor is and feel no shame about going there."}],np={title:"Exam Part 2 practice: Wellbeing Week",situation:"The student union at a university in Navoi can organise one event for Wellbeing Week: a phone-free evening of board games and sport, a talk by a sleep expert, or a ‘habit buddy’ scheme where students pair up to change one small habit together for a month. Nur and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"mateo",lines:[["A","So, which event should we choose for Wellbeing Week? Shall we start with the phone-free evening?"],["B","Sure. It sounds fun, but people would just grab their phones the moment it ended, wouldn’t they?"],["A","Maybe. So you’re saying one evening won’t change anything?"],["B","Not exactly. It’s a good start, but a habit needs more than one evening. What about the sleep expert?"],["A","A talk would explain the science, but would first-year students really come to a lecture in the evening?"],["B","Fair point. And the habit buddies? Students pair up and change one small habit together."],["A","I like that. It lasts a whole month, and a buddy makes it harder to give up, doesn’t it?"],["B","Exactly. So, shall we go for the buddies and launch them with a short phone-free evening?"],["A","Agreed. That way, it’s fun at the start and useful for the whole month."]],phrases:{Start:["Shall we start with …?","Which … should we choose?"],Clarify:["So you’re saying (that) …?","Not exactly. …"],"Give the turn":["…, wouldn’t they?","What about …?"],"Agree and decide":["Fair point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your English club wants members to spend less time on their phones during club meetings. Choose **one** idea: a phone basket at the door, a ‘phones down’ game with points, or a five-minute phone break in the middle of every meeting. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["It all starts with …","Before you know it, …","What tends to happen is …","The tricky part is …","It’s a vicious circle.","It’s hard to resist …","It’s not a question of willpower.","The key is to …","Rather than …, try …"],B:["The tricky part is …","Little by little, …","It all starts with …","It’s a vicious circle.","I’d suggest …","Before you know it, …","The key is to …","It makes sense to …","What tends to happen is …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["It all starts with …","Before you know it, …","What tends to happen is …","The tricky part is …","It’s a vicious circle.","It’s hard to resist …","It’s not a question of willpower.","The key is to …","Rather than …, try …","Little by little, …","I’d suggest …","It makes sense to …"],questions:["Why do people find it so hard to put their phones down?","What healthy habits would you recommend to a first-year student, and why?","Should video games have a built-in time limit? Why or why not?","How do shops and apps persuade people to buy or watch more?","Is it easier to start a good habit or to stop a bad one? Why?","How can friends help someone who wants to change a habit?"]},sp=[{type:"stress",title:"Stress Spot: words about the brain and behaviour",intro:"Tap the stressed syllable. Rules: before -tion, -ive and -ology, the syllable is usually strong (adDICtion, comPULsive, psyCHOlogy). Some words just have to be learned (DOpamine). Then listen and say the word.",follow:"Now use two of these words in one sentence about why habits are hard to break.",items:[{w:"addiction",syl:["ad","dic","tion"],s:1},{w:"behaviour",syl:["be","ha","viour"],s:1},{w:"dopamine",syl:["do","pa","mine"],s:0},{w:"notification",syl:["no","ti","fi","ca","tion"],s:3},{w:"anticipation",syl:["an","ti","ci","pa","tion"],s:3},{w:"psychology",syl:["psy","cho","lo","gy"],s:1},{w:"compulsive",syl:["com","pul","sive"],s:1},{w:"habitual",syl:["ha","bit","u","al"],s:1}]},{type:"pairs",title:"Sound Pairs: /j/ or /dʒ/?",intro:"Press Play and choose the word you hear. For /j/ (yet, year), the tongue comes close to the roof of the mouth but does not touch it: a soft glide, like a very short ee. For /dʒ/ (jet, jeer), the tongue touches the roof of the mouth first and then lets go. Some speakers drop /j/ before ee, so year sounds like ear: keep the glide. Partner version: one student says a word, the partner points to it.",pairs:[["yet","jet"],["year","jeer"],["yolk","joke"],["yam","jam"],["yacht","jot"]]}],op=["Use two C1 phrases from the Phrase Bank in your next answer.","Ask the expert a follow-up question that starts with “What if …?”","Explain the last piece of advice as a habit loop: cue, routine, reward.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last answer in 20 seconds without the words “phone” or “habit”."],ip={title:"Step Up Speaking Club: Five Minutes That Last Two Hours",format:"Short extracts · like exam Part 1 (multiple choice)",intro:"Four short extracts. Mateo and Nur talk about a psychology lecturer’s visit to the club in Navoi: how habits form, why phones are so hard to put down and what really helps. Each extract is a different situation.",tip:["The words you hear are not always the answer","In Part 1, a wrong option often repeats words from the extract (*buzz*, *willpower*, *weakness*). Don’t choose an option just because you hear its words: check that it says what the speaker means."],A:"mateo",B:"nur",lines:[["A","*Extract 1.* Hi Nur, it’s Mateo. Good news: the psychology lecturer has agreed to visit our club on Thursday. She’ll explain why some habits are so hard to break, starting with how we **form a habit** in the first place. Could you book the small hall and ask everyone to send in one question by Wednesday?"],["B","*Extract 2.* Mateo, what did she say about phones?"],["A","She drew **a habit loop** on the board: a cue, a routine and a reward. A buzz from your phone can **trigger a craving** to check it. [[0]] **the reward system** in our brain reacts most strongly when we’re expecting something pleasant. Apps offer **instant gratification**, so after a while we scroll **on autopilot**."],["B","*Extract 3.* To be honest, I expected a lecture about willpower, and I was ready to switch off. But her advice was really practical. [[1]] nobody can **resist the urge** with willpower alone. [[2]] changing the cue: charge your phone outside the bedroom. And don’t try to **kick the habit** overnight; **cut down on** it step by step. I left feeling far more hopeful than I expected."],["A","*Extract 4.* What stayed with me was her point about slipping back. [[3]] a student who stops gaming before exams and then **falls back into** old patterns. That’s normal, she said: it doesn’t mean you’ve failed, and you can still **break the cycle**."],["B","[[4]] going back to a habit is part of changing it?"],["A","Exactly. Change is rarely a straight line. And if a habit starts to harm your health or your studies, it takes strength, not weakness, to **seek support**."]],gaps:[[1,"That’s partly because"],[2,"If you ask me,"],[3,"It might be worth"],[4,"Just think of"],[5,"Sorry, are you saying that"]],questions:[{q:"Extract 1. Why is Mateo calling Nur?",o:["to ask her to give a talk about habits","to ask her to book a room and collect questions","to ask her to invite the lecturer to the club"],a:1,why:"“Could you book the small hall and ask everyone to send in one question by Wednesday?” The lecturer has already agreed to come."},{q:"Extract 2. According to the lecturer, why do people check their phones so often?",o:["because the buzz of the phone is too loud to ignore","because the brain reacts strongly when it expects something pleasant","because apps become slower after a while"],a:1,why:"“That’s partly because the reward system in our brain reacts most strongly when we’re expecting something pleasant.”"},{q:"Extract 3. How did Nur feel at the end of the talk?",o:["bored, because it was a lecture about willpower","more hopeful than she had expected","worried that she could never kick the habit"],a:1,why:"“I left feeling far more hopeful than I expected.” The lecture about willpower was only what she expected before the talk."},{q:"Extract 4. What is Mateo’s main point?",o:["Students should stop gaming before their exams.","Going back to an old habit does not mean that you have failed.","Asking for help with a habit is a sign of weakness."],a:1,why:"“It doesn’t mean you’ve failed, and you can still break the cycle. … Change is rarely a straight line.”"}],notice:{q:"Look at phrases 1–5. Which one gives a reason, an opinion, an example? Which one gives advice, and which one does Nur use to check meaning?",groups:[["Reason",[1]],["Opinion",[2]],["Advice",[3]],["Example",[4]],["Checking meaning",[5]]]},use:{q:"Should universities run free workshops on changing habits? Why or why not?",by:"aziza",model:"If you ask me, every university should run t
