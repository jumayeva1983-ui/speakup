{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"A Club podcast interview (exam Part 4): listen for what the speaker expected, why he mentions someone, how his view changed and what a key phrase means, notice his phrases, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The interview is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:5,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word stress in skills words like communication, and /s/ or /ʃ/ as in sort and short. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute about skills; two classmates listen for phrases that compare and describe strengths. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best phrase they heard (use the wheel)."]},{id:"game",icon:"🚀",name:"Mars Crew 2040",min:18,lv:"b2p",group:"3 agency teams of 5",kind:"five",roles:["Chair","Questioner","Note-taker","Timekeeper","Language judge"],desc:"Describe, compare and decide: which four of eight candidates will make the best crew for a Mars research base? (Book: section 6 · Game School G6)",howto:["15 students = 3 agency teams of five. All teams play at the same time with their own selection board.","Roles: chair, questioner, note-taker, timekeeper, language judge. Rotate after each round (👥 Class → Groups of 5).","Rounds: Describe 4 min · Persuade 4 min · Twist 4 min · Decide 3 min. Then each chair presents the crew in 1 minute.","Before the lesson, students read the sample game “Agency team Navoi” (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about one free workshop for students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 13, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions and underline the key words. They follow the interview in order.","Press **Play the podcast**. Nur asks, Mateo answers. Listen for the moment his view changes: _I was sure that … But …_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: comparing, opinion, reason, example and checking meaning.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is A. Mateo says his marks didn’t help.","gives an answer"],["B","Does he? What does he say at the end?","challenges politely"],["A","“Not more, but it made the marks believable.”","checks the text again"],["B","So the marks still counted, and the story helped. It’s B.","paraphrases"]],checks:[["How do speakers show that their view has changed?","they often say what they expected first (“I was sure that …”) and then what happened: “But …”, “That’s when I understood …”. The answer is usually after the change."],["Which phrase does Nur use to check meaning?","If I’ve understood you correctly, …"]]},pron:{ref:"Book: Lesson 13, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the rule: in **-tion** and **-ity** words, the stress falls **just before** the ending: communi-CA-tion, cre-a-TIV-i-ty. **-ship** does not move the stress: LEAD-er-ship.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /s/ or /ʃ/?","Say **both** words. /s/: tongue just behind the top teeth, lips flat, a thin hiss (*sort*). /ʃ/: push your lips forward and round them, tongue a little further back (*short*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *communication*. Which syllable is strong?",""],["A","*COM*?","a first guess"],["T","Not quite. Listen again: com-mu-ni-CA-tion.","the teacher repeats"],["B","*CA*! It’s just before *-tion*.","uses the rule"],["T","Yes! Everyone, say it and clap on CA: com-mu-ni-CA-tion.","the class repeats"],["T","Now /s/ or /ʃ/? Listen: *short*. First or second: *sort* or *short*?",""],["A","Second: *short*. My lips go forward and round.","checks the mouth"]],checks:[["Where is the stress in *flexibility*?","on BIL: flex-i-BIL-i-ty (just before -ity)."],["How do you make /ʃ/ as in *short*?","push your lips forward and round them; the tongue is a little further back than for /s/."],["What do you do after a correct answer?","say the word aloud and clap on the stress."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Aziza’s answer changed in 4/3/2",lines:[["aziza","Um, I think soft skills are … more important, because, um, people work in teams … For example, my cousin … in IT … So soft skills.","Attempt 1 · 90 s · many pauses"],["aziza","In my view, hard skills help you get an interview, but soft skills help you get the job. The main reason is that companies can teach the technical side. For example, my cousin works for an IT company in Tashkent, and he says new staff learn the software on the job. So soft skills matter more.","Attempt 2 · 60 s · linking words"],["aziza","In my view, hard skills get you the interview, but soft skills get you the job. Most employers can teach new staff the technical side, but not how to be a team player. My cousin, who works for an IT company in Tashkent, says new staff learn the software on the job, but good communicators are hard to find. All things considered, you need both, but soft skills make the difference.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ 1 minute** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What is one hard skill and one soft skill you would like to improve this year?",lines:[["nur","**When it comes to** hard skills, I’d like to improve my Excel, because I use it for my research. **Compared with** coding, it’s quite easy to pick up. **One of my strengths is** that I’m organised, **whereas** my weak point is speaking in front of big groups. **I’m working on** it in our Speaking Club. **That’s where** practice **comes in**: every week I feel a bit more confident. **On the whole,** I think the soft skill is harder to learn.","speaker · 1 minute"],["mateo","I heard six phrases: *When it comes to*, *Compared with*, *One of my strengths is*, *Whereas*, *I’m working on* and *That’s where … comes in*. That’s the top row: **Bingo!**","listener reports"],["nur","Great! Six points plus three for the Bingo: nine points.","count the points"],["mateo","Next time, try *One key difference is that …*. It’s on my card and you didn’t use it.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, shall we start with …?*).","Click the lines in order. Each line answers the line before. Aziza and Leo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **Swap roles** and read again.","**Your own conversation:** press **▶ 2 minutes**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a summer job",lines:[["A","So, which summer job should I apply for: the café or the computer shop?","opens the topic"],["B","How about the computer shop? You’d learn some technical skills.","an idea"],["A","True, but in the café I’d talk to customers all day. What about my communication skills?","reacts + a new idea"],["B","Fair enough. Let’s try the café this summer and the shop next year.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make agency teams of five (👥 Class → Groups of 5). Give out five roles: **Chair, Questioner, Note-taker, Timekeeper, Language judge**. After every round, the roles move to the left.","**Open the file:** read the clues aloud and find the 4-digit code.","**Round 1 · Describe (4 min):** each student turns over one or two candidate cards and presents them: hard skill, soft skill, weak point. The questioner asks one question.","**Round 2 · Persuade (4 min):** argue for one candidate: two reasons and a comparison with another candidate. Disagree politely.","**Round 3 · Twist (4 min):** each student goes back to their candidate card and presses **Show: Secret**. Then the chair opens one mission card. Does it change your crew?","**Round 4 · Decide (3 min):** everyone votes for four candidates and gives a reason. Judge **skills and teamwork only**. Click the four winners on the selection board.","**Present (1 min):** the chair presents the crew and says politely why one strong candidate was not chosen."],exTitle:"Sample game: Agency team Navoi",lines:[["","Round 1 · Describe — Chair Nur · Questioner Leo · Note-taker Amara · Timekeeper Mateo · Judge Aziza",""],["aziza","Dr Malika Rashidova is a geologist from Uzbekistan. **Her main hard skill is** finding water under the ground. **On the soft side,** she’s patient and explains difficult ideas in simple words.","hard skill + soft skill"],["leo","And her weak point? **Is that a problem on Mars?**","questioner asks one question"],["aziza","She checks everything twice, so she’s sometimes slow. But on Mars, careful is better than fast.","an honest answer"],["","Round 2 · Persuade — the roles move one place to the left",""],["mateo","**First and foremost,** Tomás can repair every robot on the base. **Compared with** the others, he has the most **hands-on experience**.","two reasons"],["amara","**That’s a fair point, but** he prefers to work alone. On a small base, we need **a team player**.","polite disagreement"],["","Round 3 · Twist — everyone reads out their candidate’s secret; the chair opens a card: “Day 40: the base computer system fails.”",""],["nur","Look at Aiko’s secret: she runs an online coding club. **When it comes to** computers, nobody else can rebuild the system, so she stays on our list.","uses a secret"],["","Round 4 · Decide",""],["leo","Feedback: two stars, Mateo’s *Compared with …* and Nur’s use of the secret. One wish: we said *good* too often; next time, try *reliable* or *creative*.","language judge"],["nur","**On balance,** our crew is Dr Malika, Aiko, Dr Wanjiru and Sofia: water, computers, medicine and fresh food. **It was a hard choice** to leave out Tomás, so we’d suggest him for the next mission.","chair · 1 minute"]],checks:[["What can you judge when you vote?","skills and teamwork only; never health, appearance, age, gender or country."],["When do you read the candidates’ secrets?","in Round 3, before you open a mission card."],["How many votes does each student have in Round 4?","four: one for each place in the crew."]]},drills:{ref:"Book: Lesson 13 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Mateo has some ___ with 3D printers: he has used them in the lab for a year.",o:["hands-on experience","a team player","a deadline"],a:0},{q:"Nobody told her to fix the problem: she ___ and did it herself.",o:["met the deadline","took the initiative","learnt on the job"],a:1},{q:"Our report is due on Friday, so we must work fast to ___.",o:["think on our feet","take feedback on board","meet the deadline"],a:2},{q:"Nurses and pilots must be able to ___: there is often very little time.",o:["work under pressure","pick up a skill","communicate clearly"],a:0},{q:"Leo is ___: he always shares information and helps his colleagues.",o:["technical know-how","a team player","a transferable skill"],a:1},{q:"I didn’t study accounting; I ___ in my first job.",o:["took the initiative","thought on my feet","learnt it on the job"],a:2},{q:"Teachers need to ___, so that every student understands the task.",o:["communicate clearly","work under pressure","meet a deadline"],a:0},{q:"Communication and problem-solving are ___: they are useful in almost any job.",o:["hands-on experience","transferable skills","technical know-how"],a:1},{q:"The interviewer asked a surprise question, so I had to ___.",o:["learn on the job","pick it up","think on my feet"],a:2},{q:"When my teacher criticised my essay, I ___ and rewrote the ending.",o:["took her feedback on board","took the initiative","met the deadline"],a:0},{q:"Children ___ new languages very quickly.",o:["take on board","pick up","think on"],a:1},{q:"Aiko has the ___ to rebuild a computer system from zero.",o:["team player","transferable skill","technical know-how"],a:2}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Employers look for good communication skills. → **teamwork skills**",a:"Employers look for good teamwork skills."},{p:"Employers look for good teamwork skills. → **Most employers / both … and …**",a:"Most employers look for both teamwork and communication skills."},{p:"Most employers look for both teamwork and communication skills. → **a question: What … ?**",a:"What skills do most employers look for?"},{p:"I can work under pressure. → **I’m able to**",a:"I’m able to work under pressure."},{p:"I’m able to work under pressure. → **present perfect: I’ve learnt to … in my part-time job**",a:"I’ve learnt to work under pressure in my part-time job."},{p:"I’ve learnt to work under pressure in my part-time job. → **a question: Have you …?**",a:"Have you learnt to work under pressure in your part-time job?"},{p:"She picked up Excel in two weeks. → **coding / in a month**",a:"She picked up coding in a month."},{p:"She picked up coding in a month. → **negative: didn’t … until her second year**",a:"She didn’t pick up coding until her second year."},{p:"She didn’t pick up coding until her second year. → **a question: When did …?**",a:"When did she pick up coding?"},{p:"Leo is good at meeting deadlines. → **better at … than me**",a:"Leo is better at meeting deadlines than me."},{p:"Leo is better at meeting deadlines than me. → **the best at … in our team**",a:"Leo is the best at meeting deadlines in our team."},{p:"Leo is the best at meeting deadlines in our team. → **a question: Who is …?**",a:"Who is the best at meeting deadlines in your team?"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I’m good at organising things.",a:"One of my key strengths is organisation. / I’d say I’m particularly good at organising things."},{p:"Hard skills are different from soft skills because you can test them.",a:"The key difference is that hard skills can be measured, whereas soft skills are harder to assess."},{p:"About computers, Aiko is the best.",a:"When it comes to computers, nobody can match Aiko."},{p:"I’m not good at public speaking.",a:"Public speaking isn’t my strongest point, but I’m working on it."},{p:"Both skills are important.",a:"Both are equally important. / You can’t really have one without the other."},{p:"A pilot and a teacher need different skills.",a:"Unlike a pilot, a teacher relies mainly on people skills."},{p:"In general, soft skills are more important.",a:"On the whole, I’d argue that soft skills make the bigger difference."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I am good in teamwork.",o:["I am good at teamwork.","I am good on teamwork.","I am good for teamwork."],a:0,why:"good at something"},{q:"✗ I have many experiences in IT.",o:["I have many experience in IT.","I have a lot of experience in IT.","I have a lot of experiences of IT."],a:1,why:"Experience (knowledge and skill) is uncountable: a lot of experience."},{q:"✗ The manager explained me the task.",o:["The manager explained me about the task.","The manager explained to me the task me.","The manager explained the task to me."],a:2,why:"explain something to somebody"},{q:"✗ She is responsible of the robots.",o:["She is responsible for the robots.","She is responsible to the robots.","She is responsible about the robots."],a:0,why:"responsible for something"},{q:"✗ He gave me a very useful advice.",o:["He gave me a very useful advices.","He gave me some very useful advice.","He gave me very useful an advice."],a:1,why:"Advice is uncountable: some advice / a piece of advice."},{q:"✗ I did a mistake in the report.",o:["I made mistake in the report.","I did mistake in the report.","I made a mistake in the report."],a:2,why:"make a mistake"},{q:"✗ Despite of her skills, she didn’t get the job.",o:["Despite her skills, she didn’t get the job.","Despite of that her skills, she didn’t get the job.","Although her skills, she didn’t get the job."],a:0,why:"despite + noun (no of) / in spite of + noun"},{q:"✗ Soft skills are more harder to measure.",o:["Soft skills are more hard to measure.","Soft skills are harder to measure.","Soft skills are most harder to measure."],a:1,why:"harder already means “more hard”."}]},{title:"Stress: word families",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"communicate → noun",o:["comMUnication","communiCAtion","COMmunication"],a:1,why:"Just before -tion."},{q:"create → noun (the skill)",o:["creaTIVity","CREativity","creATivity"],a:0,why:"Just before -ity: cre-a-TIV-i-ty."},{q:"flexible → noun",o:["FLEXibility","flexiBIlity","flexibiLIty"],a:1,why:"The stress moves: FLEXible → flexiBILity."},{q:"present (verb) → noun",o:["PREsentation","preSENtation","presenTAtion"],a:2,why:"Just before -tion."},{q:"leader → noun",o:["LEADership","leaderSHIP"],a:0,why:"-ship doesn’t move the stress."},{q:"technique → adjective",o:["techNIcal","TECHnical","techniCAL"],a:1,why:"The stress moves: techNIQUE → TECHnical."}]}],Gf={lockStep:"Open the file",lockTitle:"Open the agency’s candidate file",lockOk:"The file is open! Go to the candidate cards.",cardsStep:"Candidates",cardsTitle:"Candidate cards",cardsHint:"Each student picks a card: it turns over and opens. Read it aloud, close it, and the next student picks. Everyone takes one or two candidates to present in Round 1. Don’t press “Show: Secret” until Round 3.",backWord:"Candidate",hiddenLabel:"Secret",hiddenAll:"Show all secrets",twistTitle:"Mission cards",twistHint:"The chair opens one card. Your team discusses who could deal with it and whether your crew changes.",twistWord:"Mission",twistHelp:{b2:["Because of this card, we need someone who …","… could deal with it, because …","I’d swap … for …"],c1:["In light of this, it might make sense to …","When it comes to …, nobody can match …","What if … and … worked together?"]},voteTitle:"Selection board",voteHint:"Each team member votes for four candidates (one vote each) and gives a reason about skills or teamwork only, never health, appearance, age, gender or country. Count the votes with + and −, then click the four winners. Equal votes? One more reason each, then vote again between those candidates only.",capacity:4,teamWord:"Agency team",teamIcon:"",teamKind:"five",teams:3,doneText:"Now the chair presents the crew in one minute."},Jf=[{name:"Round 1 · Describe",lv:"b2",bloom:"Understand",by:"aziza",seconds:60,q:"Choose a candidate card. Present the candidate: what is their hard skill, their soft skill and their weak point? Is the weak point a problem on Mars?",help:{b2:["… is a … from …","Her / His main hard skill is …","On the soft side, she / he is …"],c1:["What makes … stand out is …","In terms of soft skills, …","The one thing that worries me is …"]},model:"Dr Malika Rashidova is a geologist from Uzbekistan. Her main hard skill is finding water under the ground, and that is exactly what a base on Mars needs. On the soft side, she’s patient and she explains difficult ideas in simple words, so the whole crew would understand her research. Her weak point is that she checks everything twice, so she’s sometimes slow. But on Mars, I think careful is better than fast."},{name:"Round 2 · Persuade",lv:"b2p",bloom:"Evaluate",by:"amara",seconds:60,q:"Why should your candidate be one of the four? Give two reasons and compare them with another candidate.",help:{b2:["First and foremost, …","Compared with …, she / he …","…, whereas …"],c1:["The strongest argument for … is that …","Unlike …, she / he …","It’s worth bearing in mind that …"]},model:"First and foremost, Dr Wanjiru is the only doctor on the list, and six months is a long time to be far from any hospital. On top of that, she stays calm under pressure and she’s a good listener. Compared with Aidos, who makes quick decisions on his own, she makes people feel heard. It’s worth bearing in mind that she sometimes takes on too much work, but in a good team, people share the load."},{name:"Round 3 · Twist",lv:"b2p",bloom:"Analyse",by:"leo",seconds:0,tool:"twists",q:"Go back to your candidate cards, press “Show: Secret” and read the secrets aloud. Then open a mission card: who could deal with it? Does it change your crew?",help:{b2:["Because of this card, we need someone who …","Look at …’s secret: …","I’d swap … for …"],c1:["In light of this, it might make sense to …","That’s a fair point, but …","What if … and … worked together?"]},model:"Look at Aiko’s secret: she runs an online coding club, so she already teaches people by video. If the base computer fails, she can rebuild the system, and Priya could help her, because she learnt electronics from her father. Meanwhile, Dr Wanjiru could keep everyone calm. So I’d keep Aiko on our list, even though she feels nervous in front of large groups."},{name:"Round 4 · Decide",lv:"c1",bloom:"Evaluate / Create",by:"nur",seconds:0,tool:"decide",q:"Agree on four people. Explain how their hard and soft skills fit together, and politely say why one strong candidate was not chosen.",help:{b2:["We’d choose … because together they …","We really respect …, but …","It was a hard choice."],c1:["On balance, …","Taking everything into account, …","… would be perfect for the next mission, because …"]},model:"On balance, we’d choose Dr Malika, Aiko, Dr Wanjiru and Sofia. Together they cover water, computers, medicine and fresh food, and three of them are real team players. We really respect Tomás and his skills with robots, but he prefers to work alone, and on a small base that could be risky. It was a hard choice, so we’d suggest him for the next mission, after some teamwork training."}],_f=[{e:"🪨",n:"Dr Malika Rashidova",r:"Geologist · Uzbekistan",look:{skin:"#EAC19A",hair:"#2B1A12",style:"bun",glasses:!0,top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Hard skill","Finds water under the ground; studies rocks and ice"],["Soft skill","Patient; explains difficult ideas in simple words"],["Weak point","Checks everything twice, so she is sometimes slow"]],x:"She has led long field trips in the Kyzylkum Desert."},{e:"🤖",n:"Tomás Herrera",r:"Robotics engineer · Chile",look:{skin:"#D9A47A",hair:"#2B1A12",style:"curly",beard:!0,top:"#F7C08E",bg:"#FFE4D6"},lines:[["Hard skill","Builds and repairs robots and rovers"],["Soft skill","Creative; finds new solutions quickly"],["Weak point","Prefers to work alone and rarely asks for help"]],x:"He has repaired telescopes at an observatory in the Atacama Desert."},{e:"💻",n:"Aiko Tanaka",r:"Software engineer · Japan",look:{skin:"#F2D3B6",hair:"#1F1A1A",style:"long",top:"#B7A6F2",bg:"#ECE6FF"},lines:[["Hard skill","Writes code; can rebuild a computer system from zero"],["Soft skill","Very organised; always meets deadlines"],["Weak point","Feels nervous when she speaks to large groups"]],x:"She runs an online coding club for beginners."},{e:"🩺",n:"Dr Wanjiru Kamau",r:"Doctor · Kenya",look:{skin:"#5C3A27",hair:"#1C130E",style:"curly",top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Hard skill","Emergency medicine and first aid"],["Soft skill","Calm under pressure; a good listener"],["Weak point","Finds it hard to say no, so she takes on too much work"]],x:"She has spent a winter at a research station in Antarctica."},{e:"🌱",n:"Sofia Marchetti",r:"Plant biologist · Italy",look:{skin:"#F1CFB0",hair:"#6B3E26",style:"long",top:"#F7D774",bg:"#FFF3C4"},lines:[["Hard skill","Grows vegetables without soil, in water and under lamps"],["Soft skill","Cheerful; keeps the team’s spirits up"],["Weak point","Talks a lot and sometimes interrupts people"]],x:"She has cooked for big groups in her family’s restaurant."},{e:"🛞",n:"Aidos Nurlanov",r:"Rover pilot · Kazakhstan",look:{skin:"#E5B78F",hair:"#1E1511",style:"short",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["Hard skill","Drives rovers safely over rough ground; navigation"],["Soft skill","A natural leader; makes decisions quickly"],["Weak point","Doesn’t like it when others question his decisions"]],x:"He has presented a children’s TV programme about science."},{e:"📡",n:"Priya Nair",r:"Communications officer · India",look:{skin:"#B57B55",hair:"#1E1511",style:"long",glasses:!0,top:"#F5A9BF",bg:"#FFE1EA"},lines:[["Hard skill","Video, satellite radio and clear written reports"],["Soft skill","Builds trust quickly; good at solving conflicts"],["Weak point","Gets bored with routine tasks and leaves them for later"]],x:"She learnt basic electronics from her father, who repairs TVs."},{e:"🔧",n:"Ethan Clarke",r:"Mechanical engineer · Canada",look:{skin:"#F6DCC8",hair:"#D9B97A",style:"short",beard:!0,top:"#8ED7B8",bg:"#D6F3E7"},lines:[["Hard skill","Repairs engines, pipes and air systems"],["Soft skill","Hard-working; never gives up"],["Weak point","Rarely shares information with the rest of the team"]],x:"He has never worked in a team of more than two people."}],$f=[{t:"Day 40: the base computer system fails. The air and heating still work, but only on backup power.",q:"Who can fix it, and whose soft skills matter while the crew waits? Does your list change?",by:"mateo",m:"Picture this: no computer, no messages to Earth and a cold, dark base. We need someone who can rebuild a system from zero, so Aiko has to be in our crew, and Priya could help with the electronics. When it comes to the waiting, Sofia’s cheerful attitude would keep everyone’s spirits up. I’d swap Tomás for Priya: robots can wait, but the computer runs everything."},{t:"The agency asks the crew to talk to schools on Earth by video every week.",q:"Who would explain the mission best to pupils? Is this a reason to change your crew?",by:"aziza",m:"This doesn’t change our crew much. Dr Malika can explain difficult ideas in simple words, so she could lead the school talks, and Aiko could help, because she already runs an online coding club. Aidos has presented a TV programme about science, so he would be great too. But we shouldn’t choose a crew member only for the talks: the research comes first."},{t:"Month 3: two crew members stop talking to each other after an argument about the work plan.",q:"Who could help them, and what team rule would stop this from happening again?",by:"amara",m:"First of all, we shouldn’t take sides. Dr Wanjiru is a good listener, so she could talk to both of them calmly, or Priya could help, because she’s good at solving conflicts. Then I’d suggest a simple rule: a short crew meeting every morning, where everyone says what they’re working on. If people communicate clearly every day, small problems don’t become big ones."},{t:"The budget is cut: only three people can go.",q:"Who leaves the crew, and how do you explain it politely?",by:"nur",m:"Let’s break it down step by step. Water and medicine come first, so Dr Malika and Dr Wanjiru stay. Between Aiko and Sofia, I’d keep Aiko, because without a computer nothing on the base works. It’s a hard choice: Sofia’s plants would give us fresh food. So we’d tell her honestly that her skills are perfect for the next, longer mission."}],ep=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Which are more important for getting a job: hard skills or soft skills?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** hard skills help you get an interview, but soft skills help you get the job."],["Point","**The main reason is that** most employers can teach new staff the technical side, but they can’t easily teach them to be a team player."],["Example","**For example,** my cousin works for an IT company in Tashkent, and he says new staff learn the software on the job, but good communicators are hard to find."],["Close","**So, all things considered,** I’d say soft skills matter more, although you really need both."]],keys:["get an interview","a team player","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Can soft skills be taught at university?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say that soft skills can be taught, **although** they take longer to learn than hard skills."],["","**First of all,** group projects teach students to share work and meet deadlines."],["","**For instance,** in my first year in Hamburg, our team had to give a presentation together, and I learnt to listen to other people’s ideas."],["","**However,** a lecture about teamwork is not enough on its own."],["","**That’s why** universities need more practical tasks, like debates, internships and volunteering."],["","**In short,** you learn soft skills by using them, not by reading about them."]],keys:["take longer to learn","group projects","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Will machines and AI make soft skills more important in the future?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think soft skills will matter even more as machines take over routine tasks."],["","The main reason is that computers are good at calculating, but not at understanding people."],["","A nurse, a teacher or a manager has to read emotions and build trust every day."],["","That said, I don’t think hard skills will disappear."],["","On the contrary, someone still has to design, check and repair the machines."],["","So, in a nutshell, the people who do best will be the ones who combine both."]],extra:"My favourite subject at school was geography because the maps were so colourful.",keys:["take over routine tasks","build trust","that said","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Should universities test students’ soft skills, not only their knowledge?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think universities should assess soft skills, but carefully."],["The main reason is that","employers want graduates who can work in a team and communicate clearly."],["For instance,","a group presentation shows how students share work and solve problems together."],["Having said that,","it is hard to give a fair mark for something like creativity."],["That’s why","teachers need clear criteria and useful feedback, not just a single score."],["Ultimately,","the aim is to help students improve, not to label them."]],distractors:["In contrast,","Similarly,"],keys:["assess soft skills","work in a team","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"Is it better to be a specialist or to have a wide range of skills?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["it depends on the job","deep knowledge of one area","transferable skills","for instance","the best of both worlds"],model:"I’d say it depends on the job. A surgeon or an engineer needs deep knowledge of one area, because mistakes can be serious. On the other hand, jobs change quickly, so people with transferable skills, like communication and problem-solving, can move more easily from one job to another. For instance, my aunt in Kuala Lumpur trained as an accountant, but her people skills helped her become a manager. Ideally, you should be an expert in one thing and good at several others: the best of both worlds."}],tp={title:"Exam Part 2 practice: one free workshop",situation:"The university career centre can pay for one free workshop: coding for beginners, public speaking or job interview practice. Aziza and Leo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"leo",lines:[["A","So, shall we start with coding? What do you think about it?"],["B","Well, it’s a useful hard skill, but lots of students already learn it online, don’t they?"],["A","That’s true. Sorry, do you mean that a workshop wouldn’t add much?"],["B","Exactly. I’d rather choose public speaking: most of us feel nervous in front of a group."],["A","I see your point, but what about interview practice? It helps students get their first job."],["B","Hmm, that’s a fair point. Couldn’t public speaking help with interviews, too?"],["A","Maybe! If you can speak confidently to a group, an interview feels much easier."],["B","Brilliant. So shall we go for public speaking, with a practice interview at the end?"],["A","Agreed. That way, students get two skills in one workshop."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, don’t they?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: your student club has money for **one** summer project: a coding course, a volunteering project in a mahalla or a part-time job fair. Which would build the most useful skills? Discuss the options for 2 minutes and decide together.",seconds:120}},np={cards:{A:["When it comes to …,","Compared with …,","One of my strengths is …","Whereas …","That’s where … comes in.","I’m working on …","Both … and … are …","One key difference is that …","On the whole,"],B:["Whereas …","For example,","When it comes to …,","I’m quite good at …","Compared with …,","In contrast,","On the whole,","One of my strengths is …","Both … and … are …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["When it comes to …,","Compared with …,","Whereas …","In contrast,","One key difference is that …","Both … and … are …","One of my strengths is …","I’m quite good at …","I’m working on …","That’s where … comes in.","For example,","On the whole,"],questions:["What is one hard skill and one soft skill you would like to improve this year?","Which job needs the most soft skills, in your opinion?","Which is easier to learn: a new language or how to work in a team?","What skills did you learn at school that you still use?","What makes someone a good team player?","Should schools teach soft skills as a subject?"]},rp=[{type:"stress",title:"Stress Spot: skills words",intro:"Tap the stressed syllable. Rule: in -tion and -ity words, the stress falls just before the ending. -ship does not move the stress. Careful: TECHnical and reLIable. Then listen and say the word.",follow:"Now use two of these words in one sentence about your own skills.",items:[{w:"communication",syl:["com","mu","ni","ca","tion"],s:3},{w:"presentation",syl:["pres","en","ta","tion"],s:2},{w:"negotiation",syl:["ne","go","ti","a","tion"],s:3},{w:"creativity",syl:["cre","a","tiv","i","ty"],s:2},{w:"flexibility",syl:["flex","i","bil","i","ty"],s:2},{w:"leadership",syl:["lead","er","ship"],s:0},{w:"technical",syl:["tech","ni","cal"],s:0},{w:"reliable",syl:["re","li","a","ble"],s:1}]},{type:"pairs",title:"Sound Pairs: /s/ or /ʃ/?",intro:"Press Play and choose the word you hear. /s/: tongue just behind the top teeth, lips flat, a thin hiss (sort). /ʃ/: lips pushed forward and rounded, tongue a little further back (short). Partner version: one student says a word, the partner points to it.",pairs:[["sip","ship"],["sea","she"],["sort","short"],["same","shame"],["save","shave"]]}],sp=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Disagree politely with one idea you heard.","Summarise what the last two speakers said in 20 seconds.","Give a real example from Uzbekistan.","Give an example from another country.","Start your answer with “When it comes to …”.","Speak for 30 seconds without saying “good” or “important”."],op={title:"Step Up Speaking Club podcast: Which Skills Got Me the Internship?",format:"Interview · like exam Part 4 (multiple choice)",intro:"Nur interviews Mateo about his internship interview in São Paulo: what he expected, what the manager asked, and his advice about hard and soft skills.",tip:["Listen for a change of mind","Speakers often tell you what they expected first (*I was sure that …*) and then what really happened (*But …*, *That’s when I understood …*). Questions about attitude usually ask about the view *after* the change."],A:"nur",B:"mateo",lines:[["A","Welcome to the Club podcast. Mateo, last summer you applied for an internship. What happened?"],["B","I applied to an engineering company in São Paulo, and I was sure that my **technical know-how** would be enough: good marks in maths and some **hands-on experience** with 3D printers. But the manager asked: “Tell me about a time when you had to **work under pressure**.”"],["A","Why did that question matter so much?"],["B","That’s when I understood. [[0]] hard skills, like coding or accounting, can be tested, and you can **pick them up** on a course. Soft skills, like the ability to **communicate clearly** or to be **a team player**, are much harder to measure."],["A","Is that just one manager’s view?"],["B","I don’t think so. Aziza’s cousin works for an IT company in Tashkent, and he says the same. [[1]] new staff can **learn on the job**, but it’s much harder to teach someone to **take the initiative**. [[2]] attitude takes years to build."],["A","So what did you tell the manager?"],["B","[[3]] Our Speaking Club once had to **meet a deadline** for a podcast, and our laptop broke the day before, so I had to **think on my feet**. And I got the internship!"],["A","[[4]] the story mattered more than your marks?"],["B","Not more, but it made the marks believable. My advice? Build both kinds of skills, because soft skills are **transferable skills**: you take them to every job. And when someone criticises your work, **take the feedback on board**."]],gaps:[[1,"The key difference is that"],[2,"To my mind,"],[3,"This is because"],[4,"Let me give you an example."],[5,"If I’ve understood you correctly,"]],questions:[{q:"What did Mateo expect before the interview?",o:["that the manager would ask about teamwork","that his technical skills would get him the job","that he would have to take a maths test"],a:1,why:"“I was sure that my technical know-how would be enough.”"},{q:"Why does Mateo mention Aziza’s cousin?",o:["to show that someone at another company has the same view","to say that IT companies pay more","to explain how he found the internship"],a:0,why:"“Aziza’s cousin works for an IT company in Tashkent, and he says the same.”"},{q:"How does Mateo now see his good marks in maths?",o:["They didn’t help him at all.","They counted, but his story made them believable.","They were the only reason he got the job."],a:1,why:"“Not more, but it made the marks believable.”"},{q:"What does Mateo mean by “transferable skills”?",o:["skills you can only learn at university","skills that a manager teaches you","skills that are useful in any job you do"],a:2,why:"“Soft skills are transferable skills: you take them to every job.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Mateo use to compare, and which one does Nur use to check meaning?",groups:[["Comparing",[1]],["Opinion",[2]],["Reason",[3]],["Example",[4]],["Checking meaning",[5]]]},use:{q:"Should universities give students more hands-on experience, even if it means fewer lectures? Why or why not?",by:"leo",model:"To my mind, yes, at least in the last two years of a degree. This is because you only really understand a skill when you use it. Let me give you an example. A friend of mine in Hamburg studied engineering and spent one day a week in a small workshop. He says he learned more there than in a whole semester of theory. Of course, lectures still matter. So, all in all, I’d keep the lectures but add real practice.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},lp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:np,CARDS:_f,DEMOS:Yf,DIALOGUE:tp,DRILLS:Uf,LESSON:Kf,LEVELS:ep,LISTEN:op,MAIN:Gf,PRON:rp,ROUNDS:Jf,TWISTS:$f,UNIT:Qf,WILDCARDS:sp},Symbol.toStringTag,{value:"Module"})),ip={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},ap={openverse:"a07efb94-4c4e-4ee6-8b13-2bd411c084f9",title:"This artist's concept features NASA's Mars Science Laboratory Curiosity ro
