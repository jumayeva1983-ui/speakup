 the phrases, then use them in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Mateo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The interview is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:5,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Word stress in -teer, -ity and -tion words, and /ʌ/ or /æ/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2",group:"Pairs → two circles",kind:"pairs",desc:"Put a model answer in order, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases that propose and persuade. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group says the best phrase they heard (use the wheel)."]},{id:"game",icon:"📣",name:"Community Challenge",min:18,lv:"b2p",group:"3 teams of 5",kind:"five",roles:["Presenter","Planner","Researcher","Timekeeper","Jury speaker"],desc:"A pitch room: plan a volunteer project for a real need, pitch it in one minute and answer the jury’s questions. (Book: section 6 · Game School: Pitch Room)",howto:["15 students = 3 teams of five (👥 Class → Groups of 5). Roles: Presenter, Planner, Researcher, Timekeeper, Jury speaker.","Round 1: all teams plan at the same time. Rounds 2 and 3 go team by team: Team A pitches and answers two questions from the other teams’ jury speakers; then Team B; then Team C.","Timing: cards and Plan 4 min · Pitch 1 min per team · Jury questions 2 min per team · Score 3 min. Next lesson, rotate the roles.","Before the lesson, students read the sample game (How to play → Watch an example)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about a volunteer club’s first project, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Kp={listen:{ref:"Book: Lesson 9, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions and underline the key words. They follow the interview in order.","Press **Play the podcast**. Amara asks, Aziza answers: listen to the whole answer before you choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, agreeing up to a point, reason, example and checking meaning.","**Your turn:** listen to Mateo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 4 is C. Aziza says small jobs are more fun.","gives an answer"],["B","Does she? Listen to what comes next.","challenges politely"],["A","Oh: “Take Mateo … one beach clean-up, and now he runs volunteer days.”","checks the text again"],["B","So small things grow into big ones. It’s A.","paraphrases"]],checks:[["Why is it important to hear the whole answer in an interview?","speakers often start with “I can see why …, but …”: the real opinion comes after “but”."],["Which phrase does Amara use to check meaning?","So what you’re saying is …?"]]},pron:{ref:"Book: Lesson 9, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember the rule: **-teer** takes the stress itself (volun-TEER). In **-ity** and **-tion** words, the stress falls **just before** the ending: com-MU-ni-ty, do-NA-tion.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ʌ/ or /æ/?","Say **both** words. /ʌ/: short and relaxed, mouth half open. /æ/: open your mouth wide and spread your lips.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *volunteer*. Which syllable is strong?",""],["A","*VOL*?","a first guess"],["T","Not quite. Listen again: vo-lun-TEER.","the teacher repeats"],["B","*TEER*! The ending takes the stress.","uses the rule"],["T","Yes! Everyone, say it and clap on TEER: vo-lun-TEER.","the class repeats"],["T","Now /ʌ/ or /æ/? Listen: *fan*. First or second: *fun* or *fan*?",""],["A","Second: *fan*. My mouth is wide open.","checks the mouth"]],checks:[["Where is the stress in *community*?","on MU: com-MU-ni-ty (just before -ity)."],["How do you make /æ/?","open your mouth wide and spread your lips, as in *hand* and *fan*."],["What do you do after a correct answer?","say the word aloud and clap on the stress."]]},order:{ref:"Book: Game School G2 and G1",steps:["Read the question aloud.","Click the **Opening** first: it answers the question directly (*In my view …*).","Then the **Point** (a reason), the **Example** (a real story) and the **Close** (*So, all things considered …*).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Optional: record each attempt and listen. Is the third one better?"],exTitle:"How Nur’s answer changed in 4/3/2",lines:[["nur","Um, I think young people should … volunteer, because, um, you learn things … For example, I helped with books for a school … So I think it’s good.","Attempt 1 · 90 s · many pauses"],["nur","In my view, young people should try volunteering. The main reason is that you learn teamwork. For example, I helped to collect books for a village school. So it’s good for everyone.","Attempt 2 · 60 s · linking words"],["nur","In my view, every young person should try volunteering at least once, because it teaches teamwork and responsibility. When I helped to run a book collection for a village school, I learned to plan and to solve problems fast. All things considered, volunteering helps others and helps us grow.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["Which part comes first?","the Opening: the direct answer."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ 1 minute** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is it better to give money or time to a good cause?",lines:[["mateo","**What I’m proposing is** simple: give your time first. **Have you ever noticed that** money disappears quickly, but skills stay? **For example,** in Recife my friends give free swimming lessons at a community pool every Saturday. **The best part is that** the volunteers learn, too. **Not only** does time help people, **but** it **also** builds friendships. **That’s why I believe** time is the better gift.","speaker · 1 minute"],["nur","I heard six phrases: *What I’m proposing is*, *Have you ever noticed that*, *For example*, *The best part is that*, *Not only … but also* and *That’s why I believe*. That’s the middle column: **Bingo!**","listener reports"],["mateo","Great! Six points plus three for the Bingo: nine points.","count the points"],["nur","Next time, try *To sum up*. It’s on my card, and it would make your ending stronger.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, the club can only start one project …*).","Click the lines in order. Each line answers the line before. Leo and Nur take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **Swap roles** and read again.","**Your own conversation:** press **▶ 2 minutes**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a charity day for our group",lines:[["A","So, what should our group do for the university charity day?","opens the topic"],["B","How about a cake sale in the corridor?","an idea"],["A","Good idea, but lots of groups will do that. What about a second-hand book sale?","reacts + a new idea"],["B","Agreed. Let’s ask everyone to bring two books.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School · Pitch Room · section 6",steps:["Make teams of five: **Presenter, Planner, Researcher, Timekeeper, Jury speaker** (👥 Class → Groups of 5).","**Challenge cards:** the presenter turns over one card. Read the problem and who it affects. Then open **Your resource**: only your team should hear it.","**Round 1 · Plan (3 min):** who will you help, what will you do, when and where, and how many volunteers do you need? The planner writes the plan in four lines. Use your resource!","**Round 2 · Pitch (1 min per team):** the presenter pitches: the problem → our idea → how it works → why it matters.","**Round 3 · Jury questions (2 min per team):** the jury speakers of the other teams open two question cards and ask them. Everyone in the pitching team can answer.","**Round 4 · Score (3 min):** each team scores the other teams 0–5 for each criterion, plus one star and one wish. A team never scores itself."],exTitle:"Sample game: Team Navoi",lines:[["","Presenter Aziza · Planner Leo · Researcher Amara · Timekeeper Nur · Jury speaker Mateo",""],["nur","Round 1: three minutes to plan. Aziza, turn over our challenge card.","timekeeper opens the round"],["aziza","It’s **The empty library**: a big collection of books, but very few visitors. And our resource: one of us runs a popular book account online. That’s me! **Let’s break it down step by step.**","presenter reads the card"],["leo","**Hold on, what’s the evidence** that young people don’t read? Maybe they just don’t know the library is there.","planner asks why"],["amara","Good point. So **what if** we brought people in with something fun? A **Book Swap Friday**: bring one book, take one home, and film a short review for Aziza’s account.","researcher adds an idea"],["leo","(writes) Who: students and families. What: Book Swap Friday with video reviews. When and where: every Friday afternoon in the reading room. Volunteers: six: two at the swap table, two filming, two making posters.","planner writes four lines"],["nur","Time’s up! Round 2: one minute, Aziza. Go!","timekeeper"],["aziza","**Have you ever noticed that** our district library is almost empty? It has a great collection, but most students don’t know it’s there. **What we’re proposing is** Book Swap Friday: bring a book, take a book and tell us about it in a 30-second video. **This would make a real difference to** young readers and to the librarians. **Help us bring the library back to life!**","presenter · 1 minute"],["","Round 3 · Jury questions: Team B’s jury speaker opens a card and asks, “How will you keep volunteers motivated?”",""],["mateo","**That’s a fair question.** Picture this: every volunteer chooses one book for a ‘Volunteers recommend’ shelf, and we share their videos online. People stay when they can see that their work matters.","the team answers"],["","Team B’s score for Team Navoi: Clear plan 5 · Real impact 4 · Answered questions well 4. Star: a simple idea that costs almost nothing. Wish: say how you will know that the project worked.",""]],checks:[["What does the planner write in Round 1?","a plan in four lines: who, what, when and where, and how many volunteers."],["Who asks the questions in Round 3?","the jury speakers of the other teams."],["Can a team score itself?","no: each team scores the other teams."]]},drills:{ref:"Book: Lesson 9 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gp=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"When a neighbour needs help with a heavy job, everyone in our mahalla comes out to ___.",o:["lend a hand","raise awareness","sign up"],a:0},{q:"Our club ___ for a village library by selling cakes on campus.",o:["gave back","raised money","took part"],a:1},{q:"I ___ a beach clean-up because a friend needed one more helper.",o:["took part","lent a hand","signed up for"],a:2},{q:"Hashar shows the strong ___ of a mahalla: neighbours help each other.",o:["community spirit","good cause","voluntary basis"],a:0},{q:"Our posters and videos helped to ___ the city blood donation day.",o:["lend a hand to","raise awareness of","give back to"],a:1},{q:"Nobody was paid: everyone worked ___.",o:["in need","in common","on a voluntary basis"],a:2},{q:"Volunteering is my way to ___ to the city that welcomed me.",o:["give something back","set up","make up"],a:0},{q:"Even one hour a week can ___ to someone who lives alone.",o:["take part","make a difference","sign up"],a:1},{q:"Three friends from my group ___ a free English club for pupils.",o:["signed","lent","set up"],a:2}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"I signed up for a beach clean-up. → **a tree-planting day**",a:"I signed up for a tree-planting day."},{p:"I signed up for a tree-planting day. → **My sister …**",a:"My sister signed up for a tree-planting day."},{p:"My sister signed up for a tree-planting day. → **a question: Did …?**",a:"Did your sister sign up for a tree-planting day?"},{p:"We raised money for the library. → **the animal shelter**",a:"We raised money for the animal shelter."},{p:"We raised money for the animal shelter. → **present perfect: already**",a:"We’ve already raised money for the animal shelter."},{p:"We’ve already raised money for the animal shelter. → **a question: How much …?**",a:"How much money have you raised for the animal shelter?"},{p:"Our project will make a difference to older neighbours. → **new international students**",a:"Our project will make a difference to new international students."},{p:"Our project will make a difference to new international students. → **would … if we had more volunteers**",a:"Our project would make a difference to new international students if we had more volunteers."},{p:"Our project would make a difference to new international students if we had more volunteers. → **a question: How …?**",a:"How would your project make a difference to new international students?"},{p:"Everyone was happy to lend a hand. → **My neighbours …**",a:"My neighbours were happy to lend a hand."},{p:"My neighbours were happy to lend a hand. → **always (present)**",a:"My neighbours are always happy to lend a hand."},{p:"My neighbours are always happy to lend a hand. → **a question: Who …?**",a:"Who is always happy to lend a hand?"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"We want to help older people.",a:"Our project aims to support older neighbours who live alone."},{p:"There is a problem with the park.",a:"Have you ever noticed that the park behind the university is full of litter?"},{p:"Our idea is a book swap.",a:"What we’re proposing is a Book Swap Friday."},{p:"It will help a lot of people.",a:"This would make a real difference to young readers in our district."},{p:"We need ten volunteers.",a:"To get this off the ground, we’d need about ten volunteers."},{p:"Good question.",a:"That’s a fair question, and we’ve thought about it."},{p:"In conclusion, please help us.",a:"To sum up: help us bring the library back to life."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I want to help to people in my mahalla.",o:["I want to help people in my mahalla.","I want help to people in my mahalla.","I want to helping people in my mahalla."],a:0,why:"help somebody (no to)"},{q:"✗ Last summer I did a volunteer at the shelter.",o:["Last summer I made volunteer at the shelter.","Last summer I volunteered at the shelter.","Last summer I was volunteer at the shelter."],a:1,why:"Volunteer is a verb (I volunteered) or a person (I was a volunteer)."},{q:"✗ We participated to the clean-up.",o:["We participated the clean-up.","We participated on the clean-up.","We participated in the clean-up."],a:2,why:"participate in / take part in"},{q:"✗ Volunteering gives me a lot of experiences.",o:["Volunteering gives me a lot of experience.","Volunteering gives me a lot of experiences of skills.","Volunteering give me a lot of experience."],a:0,why:"Experience = skills and knowledge: uncountable."},{q:"✗ We raised money to the library.",o:["We raised money at the library.","We raised money for the library.","We raised the money to library."],a:1,why:"raise money for something"},{q:"✗ I spend my free time to help animals.",o:["I spend my free time for helping animals.","I spend my free time help animals.","I spend my free time helping animals."],a:2,why:"spend time + -ing"},{q:"✗ She suggested us to collect books.",o:["She suggested collecting books.","She suggested to collect books.","She suggested us collecting books."],a:0,why:"suggest + -ing (or: suggested that we collect …)"},{q:"✗ If we will have more volunteers, we will open on Sundays.",o:["If we would have more volunteers, we will open on Sundays.","If we have more volunteers, we will open on Sundays.","If we had more volunteers, we will open on Sundays."],a:1,why:"if + present simple for a real future situation"}]},{title:"Stress: word families",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"volunteer → adjective",o:["VOLuntary","volUNtary","volunTARy"],a:0,why:"The stress moves: volunTEER → VOLuntary."},{q:"organise → noun",o:["ORganisation","organiSAtion","orGAnisation"],a:1,why:"Just before -tion."},{q:"responsible → noun",o:["reSPONsibility","responsiBIlity","responsibiLIty"],a:1,why:"Just before -ity."},{q:"charity → adjective",o:["CHARitable","chaRItable","chariTAble"],a:0},{q:"contribute → noun",o:["CONtribution","contriBUtion","contribuTION"],a:1,why:"The stress moves: conTRIbute → contriBUtion."},{q:"benefit → adjective",o:["BENeficial","beneFIcial","benefiCIAL"],a:1}]}],Yp={cardsStep:"Challenge cards",cardsTitle:"Challenge cards",cardsHint:"Each team’s presenter picks one card: it turns over and opens. Read the problem and who it affects aloud to your team. Then open “Your resource”: only your team should hear it. Close the card, and the next team picks.",backWord:"Challenge",hiddenLabel:"Your resource",hiddenAll:"Show all resources",questionWord:"Question",questionTitle:"Jury question cards",questionHint:"Jury speakers of the other teams: open one card each and ask the question. The pitching team answers together; the presenter starts.",questionHelp:{b2:["That’s a good question. We’d …","If that happens, we’ll …","To be honest, we haven’t decided yet, but …"],c1:["That’s a fair concern, and …","We’ve thought about that: …","In the long run, we’d like to …"]},scoreTitle:"Jury score board",scoreHint:"Each team scores the other teams, never itself. Agree on 0–5 points for each criterion, then give one star and one wish.",scoreCriteria:["Clear plan","Real impact","Answered questions well"],teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Up=[{name:"Round 1 · Plan",lv:"b2",bloom:"Apply / Create",by:"aziza",seconds:180,q:"Read your challenge card and your resource. Plan a volunteer project in four lines: **who** you will help, **what** you will do, **when and where**, and **how many volunteers** you need. Use your resource!",help:{b2:["Our project is called …","We’re going to … every …","We’ll need about … volunteers to …"],c1:["The idea is to … so that …","To get this off the ground, we’d need …","We could make the most of …"]},model:"Let’s break it down step by step. Our project is called Green Saturday. We’re going to clean up the park behind the university and plant young trees there. We’ll meet every Saturday morning in April, from nine to twelve. We’ll need about twenty volunteers in three groups: one to pick up litter, one to paint the benches and one to plant the trees. And we can make the most of our resource: the garden shop will give us trees and gloves if we send it photos of the work."},{name:"Round 2 · Pitch",lv:"b2p",bloom:"Create",by:"mateo",seconds:60,q:"Presenter: pitch your project to the jury in **one minute**: the problem → our idea → how it works → why it matters. End with one sentence the jury will remember.",help:{b2:["Have you ever noticed that …?","Our idea is simple: …","This will help … because …"],c1:["Picture this: …","What we’re proposing is …","This would make a real difference to …"]},model:"Picture this: you arrive in a new country in September. You can’t read the signs, you can’t find the right office and you don’t know anyone. Every year, new international students at our university go through exactly this. What we’re proposing is Campus Buddies: every new student gets a local buddy for the first month. Buddies meet them when they arrive, show them the offices and invite them to a Friday tea evening. Between us, we speak four languages, so nobody will feel lost in translation. Help us turn strangers into friends!"},{name:"Round 3 · Jury questions",lv:"b2p",bloom:"Evaluate",by:"leo",seconds:0,tool:"questions",q:"Jury speakers from the other teams: open two question cards and ask them. The pitching team answers together, with a reason and a real detail from the plan.",help:{b2:["That’s a good question. We’d …","If that happens, we’ll …","To be honest, we haven’t decided yet, but …"],c1:["That’s a fair concern, and …","We’ve thought about that: …","In the long run, we’d like to …"]},model:"That’s a fair concern, and we’ve thought about it. Right now, our team will lead the project, but we don’t want it to depend on just five people. So every month, two new volunteers will join our planning meeting and learn how everything works. By the time we graduate, they’ll be ready to take over. In the long run, we’d like the project to become a regular part of the student volunteer club."},{name:"Round 4 · Score",lv:"c1",bloom:"Evaluate",by:"nur",seconds:0,tool:"score",q:"Jury: give each of the other teams 0–5 points for each criterion. Then give one star (something good) and one wish (something to improve). Which project would you choose?",help:{b2:["We’d give … points for …, because …","One thing we liked was …","Next time, you could …"],c1:["What stood out for us was …","The strongest part of the plan was …","To make it even better, we’d suggest …"]},model:"What stood out for us was Team C’s plan for the animal shelter. It was clear who would do what, when and with how many volunteers, so we’d give five points for the plan. The impact was real, too: the adoption posters could help the animals find new homes, so four points. They answered our question about money well, but their answer about the long term came quite late, so four points. To make it even better, we’d suggest saying how you will know that the project has worked."}],Jp=[{e:"🫖",n:"Alone at home",r:"A mahalla in Navoi",lines:[["The problem","Several older neighbours in the mahalla live alone. Their children work in other cities, and some of them talk to nobody for days."],["Who it affects","The older neighbours, their families far away and the mahalla committee."]],x:"The mahalla choyxona (teahouse) will give you its room for free every Thursday afternoon."},{e:"🌳",n:"The forgotten park",r:"Behind the university",lines:[["The problem","The small park behind the university has broken benches, dry flower beds and litter under the trees. Families have stopped coming."],["Who it affects","Families from the nearby houses, students and anyone who needs a green place to rest."]],x:"A garden shop in the city will give you young trees and gloves if you send it photos of the work."},{e:"✏️",n:"Homework help",r:"A school in the mahalla",lines:[["The problem","Many pupils at a nearby school find their maths and English homework hard, and their parents often work late and can’t help."],["Who it affects","The pupils, their parents and their teachers."]],x:"Two people in your team are top students in maths and English, and the school can lend you a classroom after lessons."},{e:"📚",n:"The empty library",r:"The district library",lines:[["The problem","The district library has a big collection of books and a quiet reading room, but very few visitors. Most young people don’t know what it offers."],["Who it affects","Young readers, the librarians and the whole neighbourhood."]],x:"One of you runs a popular book account on social media."},{e:"♻️",n:"Plastic after the party",r:"Events on campus",lines:[["The problem","After concerts and sports days on campus, plastic bottles and cups are left everywhere, and most of them end up in ordinary bins."],["Who it affects","Students, the cleaning staff and the city."]],x:"A recycling company in the city will collect sorted plastic from the campus for free."},{e:"🧭",n:"Lost on campus",r:"New international students",lines:[["The problem","New international students arrive in September. Many don’t speak Uzbek or Russian yet, can’t find the right offices and feel lonely."],["Who it affects","The new students, their teachers and the international office."]],x:"Between you, your team speaks four languages, and the international office will tell you when the new students arrive."},{e:"🐾",n:"The animal shelter",r:"Stray cats and dogs",lines:[["The problem","A small shelter for stray cats and dogs has too few helpers. The animals need food, walks, clean rooms and new homes."],["Who it affects","The animals, the shelter staff and families who would like a pet."]],x:"A student photographer will take free portraits of the animals for adoption posters."},{e:"🗓",n:"Blood donation day",r:"The city blood centre",lines:[["The problem","The city blood centre is holding a donation day at the university, but few students know about it, and the staff need helpers on the day. Doctors decide who can donate; volunteers organise everything else."],["Who it affects","Patients in hospitals, the blood centre staff and student donors."]],x:"The student radio station will give you two minutes on air every morning for a week."}],_p=[{t:"Motivation",q:"How will you keep volunteers motivated after the first week?",by:"amara",m:"Let me give you a real example. In my debate club in Lagos, people stayed because they felt their work was noticed. So we’ll do three things: every volunteer gets a clear job, we’ll post a short thank-you video every week, and after each month the volunteers choose the next small goal themselves. When people see the difference they make, they come back."},{t:"Plan B",q:"What will you do if fewer volunteers come than you expected?",by:"leo",m:"Hold on, that’s a fair concern, and we’ve planned for it. Our project works with ten volunteers, but it’s better with twenty. If only ten come, we’ll do the most important job first and leave the rest for the next week. We’ll also ask every volunteer to bring one friend next time, so the team grows step by step."},{t:"Real impact",q:"How will you know that your project has really made a difference?",by:"nur",m:"What if we kept it simple? Before we start, we’ll count how many people use the place or the service each week, and we’ll ask them two short questions. After two months, we’ll count and ask again. Numbers aren’t everything, so we’ll also collect short stories from the people we help. If the numbers and the stories both improve, we’ll know it worked."},{t:"After the semester",q:"What happens to your project when the semester ends?",by:"aziza",m:"Let’s break it down step by step. During the summer, the project can run once a month instead of every week. In September, we’ll present it at the welcome day for first-year students and invite them to join. And we’ll write a short guide, so a new team can continue even after we graduate."},{t:"Respect",q:"How will you make sure the people you help are treated with respect, not pity?",by:"amara",m:"That’s a really important question. First, we won’t decide for people; we’ll ask them what they actually need. Second, we won’t post photos of anyone without their permission. And third, we’ll treat it as an exchange: older neighbours, for example, can teach us recipes and stories while we help them. Respect means working with people, not just for them."},{t:"Spreading the word",q:"How will people find out about your project?",by:"nur",m:"We’ll use three channels. Online, we’ll post short videos on the university’s social media pages. On campus, we’ll put up posters with a QR code in the corridors and the canteen. And in the mahalla, the committee can tell people at the next meeting, because many older neighbours don’t use social media. Different people need different channels."},{t:"Money",q:"Does your project need money? If so, where will it come from?",by:"mateo",m:"Picture this: a project that costs almost nothing. Most of what we need is time, and our partners give us the rest: the room is free and the materials come from local shops. If we need a little money for posters or tea, we’ll hold a book sale on campus. We don’t want money to be the reason a good idea stops."},{t:"Why you?",q:"Why is your team the right team for this project?",by:"leo",m:"Let me give you the evidence. First, our resource: we already have a partner who wants to help. Second, our skills: one of us is good at planning, one is great with social media and one speaks three languages. And third, we live and study right here, so we can be there every week, not just once."}],$p=[],ef=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"nur",q:"Should every young person try volunteering?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** every young person should try volunteering at least once."],["Point","**The main reason is that** it teaches skills you can’t learn from a textbook, like teamwork and responsibility."],["Example","**For example,** when I helped to run a book collection for a village school in Malaysia, I learned how to plan, how to talk to strangers and how to solve problems quickly."],["Close","**So, all things considered,** volunteering helps other people and helps us grow at the same time."]],keys:["in my view","teamwork and responsibility","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"leo",q:"Can social media help people to volunteer?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say yes, **although** a post alone has never cleaned a river."],["","**First of all,** social media makes it easy to find local projects that need help."],["","**For instance,** my cousin found a weekend river clean-up in Hamburg through a short video."],["","**However,** clicking “like” is not the same as giving your time."],["","**That’s why** the best posts give a clear date, a place and one simple thing to do."],["","**In short,** social media can open the door, but people still have to walk through it."]],keys:["although","first of all","however","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Should companies give their staff paid time to volunteer?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","To be honest, I think it’s a very good idea, as long as staff can choose their own project."],["","Volunteering gives people new skills, like leading a team or solving problems under pressure."],["","At the same time, it helps companies build trust with the community around them."],["","A bank in Lagos, for example, could let its staff teach young people how to plan a budget."],["","Of course, the normal work still has to be done, so the time should be planned carefully."],["","So, in a nutshell, a day of volunteering can be good for the staff, the company and the community."]],extra:"My favourite place in Lagos is the beach, especially in the evening.",keys:["as long as","at the same time","build trust","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"aziza",q:"Is it better to give money or time to a good cause?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Personally,","I think time is often the more valuable gift, although both matter."],["The main reason is that","time builds relationships, and relationships last longer than money."],["For instance,","during hashar in my mahalla in Navoi, neighbours don’t just give things; they work side by side and get to know each other."],["Having said that,","some problems, like repairing a roof or buying books for a library, simply need money."],["That’s why","the best option is often to give a little of both: some money and some of your time."],["Ultimately,","what matters most is that we give regularly, not just once."]],distractors:["In contrast,","Similarly,"],keys:["valuable gift","side by side","having said that","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"Can one person really make a difference?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["yes, but rarely alone","one person starts, others join","picture this","small actions add up","invite one friend"],model:"I believe one person can make a difference, but rarely alone. Usually one person starts something, and then others join. Picture this: a student in Recife picks up litter on the beach every Sunday morning and posts a photo. A few weeks later, her friends are there with her. Small actions add up, because they show other people that change is possible. So my advice is simple: start small, and invite one friend next time."}],tf={title:"Exam Part 2 practice: the volunteer club’s first project",situation:"The university volunteer club can start one project this term. There are three ideas: a book collection for a village school library, a tree-planting day on campus, or an English conversation club for pupils at a nearby school. Leo and Nur are discussing them. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"nur",lines:[["A","So, the club can only start one project this term. Shall we start with the book collection?"],["B","Sure. It’s easy to organise, but wouldn’t it be over in a week?"],["A","Sorry, do you mean that it wouldn’t make a lasting difference?"],["B","Exactly. The tree-planting day has the same problem. What do you think about the conversation club?"],["A","I like it. Our members could help the pupils with their English and get teaching practice at the same time, couldn’t they?"],["B","That’s true. But we’d need volunteers every week, not just once."],["A","Good point. Maybe we could start with two afternoons a month and see how it goes."],["B","So, shall we go for the conversation club, with a book collection as a one-off event to start?"],["A","Agreed. That way, we start small but keep going."]],phrases:{Start:["Shall we start with …?","What do you think about …?"],Clarify:["Sorry, do you mean that …?","So what you’re saying is …"],"Give the turn":["…, couldn’t they?","How about you?"],"Agree and decide":["That’s a fair point.","So, shall we go for …?","Agreed."]},own:{task:"Your turn in pairs: your city wants more young people to volunteer. Choose **one** idea: a volunteer fair at the university, a one-day “try it” volunteering event, or a website that lists local projects. Discuss the options for 2 minutes and decide together.",seconds:120}},nf={cards:{A:["Our project aims to …","Have you ever noticed that …?","What I’m proposing is …","This would make a real difference to …","The best part is that …","Not only …, but also …","For example,","That’s why I believe …","To sum up, …"],B:["Picture this: …","The best part is that …","Our project aims to …","It’s worth remembering that …","For example,","This would make a real difference to …","To sum up, …","Imagine if …","What I’m proposing is …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Our project aims to …","Have you ever noticed that …?","What I’m proposing is …","This would make a real difference to …","The best part is that …","Not only …, but also …","For example,","That’s why I believe …","To sum up, …","Picture this: …","It’s worth remembering that …","Imagine if …"],questions:["Is it better to give money or time to a good cause?","What can students learn from volunteering that they can’t learn in class?","Which problem in your town or mahalla would you solve first? Why?","Persuade your group to volunteer for one hour this week. What should they do?","Should famous people use their fame to support good causes?","Why do some people never volunteer? How could we change that?"]},rf=[{type:"stress",title:"Stress Spot: -teer, -ity, -tion",intro:"Tap the stressed syllable. Rule: -teer takes the stress itself (volunTEER); in -ity and -tion words, the stress falls just before the ending. Then listen and say the word.",follow:"Now use two of these words in one sentence about your town or university.",items:[{w:"volunteer",syl:["vo","lun","teer"],s:2},{w:"community",syl:["com","mu","ni","ty"],s:1},{w:"charity",syl:["cha","ri","ty"],s:0},{w:"opportunity",syl:["op","por","tu","ni","ty"],s:2},{w:"responsibility",syl:["re","spon","si","bi","li","ty"],s:3},{w:"organisation",syl:["or","ga","ni","sa","tion"],s:3},{w:"donation",syl:["do","na","tion"],s:1},{w:"contribution",syl:["con","tri","bu","tion"],s:2}]},{type:"pairs",title:"Sound Pairs: /ʌ/ or /æ/?",intro:"Press Play and choose the word you hear. /ʌ/: short and relaxed, mouth half open, as in fun and fund. /æ/: open your mouth wide and spread your lips, as in fan and hand. Partner version: one student says a word, the partner points to it.",pairs:[["fun","fan"],["cup","cap"],["much","match"],["hut","hat"],["bug","bag"]]}],sf=["Use two pitch phrases from the Phrase Bank in your next answer.","Ask the last speaker a follow-up question about their project.","Disagree politely with one idea you heard, then suggest a better one.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last team’s project in 20 seconds.","Speak for 30 seconds without saying “help” or “good”."],of={title:"Step Up Speaking Club podcast: Small Jobs Add Up",format:"Interview · like exam Part 4 (multiple choice)",intro:"Amara interviews Aziza about volunteering: how she started, hashar in her mahalla in Navoi, and what she says to people who think they have no time.",tip:["Listen to the whole answer","In an interview, the question tells you the topic, but the answer comes later. Speakers often begin with *I can see why …, but …*: their real view comes after *but*."],A:"amara",B:"aziza",lines:[["A","Welcome to the Club podcast. Today I’m talking to Aziza about volunteering. Aziza, how did it all start for you?"],["B","By accident, really! Two years ago a friend needed one more helper for a park clean-up in Navoi, so I **signed up for** it. I expected a boring morning. Instead, I met students, bus drivers and retired teachers who were all happy to **lend a hand**, and I went home feeling that I had **made a difference**."],["A","And in your mahalla there’s hashar, isn’t there?"],["B","Yes. On a spring Saturday, neighbours plant trees, paint the school fence and clean the streets. Everyone works **on a voluntary basis**, and the older neighbours bring tea and fresh bread for everybody. [[0]] that’s **community spirit** at its best."],["A","Some people say volunteering is only for people with lots of free time. What would you say to them?"],["B","[[1]] you don’t need much time. [[2]] small jobs add up. [[3]] our friend Mateo, [[4]]: he started with one beach clean-up in Recife, and now he runs volunteer days at his university."],["A","[[5]] anyone can start small?"],["B","Exactly. Now I **take part in** my university’s volunteer club. This year we’ve **raised money** for a village library and **raised awareness of** our city’s blood donation day. You don’t need to **set up** a big charity to support **a good cause**. Help **people in need** near you, and bring a friend next time. It’s my way to **give something back**."]],gaps:[[1,"Personally, I think"],[2,"I can see why they think that, but"],[3,"That’s because"],[4,"Take"],[4,"for instance"],[5,"So what you’re saying is"]],questions:[{q:"How did Aziza start volunteering?",o:["A friend needed one more helper for a park clean-up.","Her university told her to do it.","She set up her own charity."],a:0,why:"“A friend needed one more helper for a park clean-up in Navoi, so I signed up for it.”"},{q:"What is Aziza’s attitude to hashar?",o:["She thinks it is old-fashioned.","She admires the way neighbours work together.","She finds it too tiring."],a:1,why:"“Personally, I think that’s community spirit at its best.”"},{q:"Why does Aziza mention Mateo?",o:["to say that he has more free time than she does","to invite listeners to a clean-up in Recife","to show that a small start can grow into something bigger"],a:2,why:"“He started with one beach clean-up in Recife, and now he runs volunteer days at his university.”"},{q:"What does Aziza mean when she says “small jobs add up”?",o:["Many small actions together make a real difference.","Volunteers should count their hours carefully.","Small jobs are more fun than big projects."],a:0,why:"She answers people who have little free time: “you don’t need much time … small jobs add up.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Aziza use to agree only up to a point, and which one does Amara use to check meaning?",groups:[["Opinion",[1]],["Agreeing up to a point",[2]],["Reason",[3]],["Example",[4]],["Checking meaning",[5]]]},use:{q:"Should universities give students credits for volunteering? Why or why not?",by:"mateo",model:"Personally, I think it’s a good idea, but only for real work. That’s because credits can bring busy students through the door, and once they see the difference they make, many of them stay. Take my university volunteer club, for instance: several of our new members first came for the credits, and most of them are still with us. So, all in all, credits are a good start, as long as the work is real.",ticks:["an opinion","a reason","an example","a short conclusion"],s
