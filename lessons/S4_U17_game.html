d type the answer. When a door opens, explain **how** you solved it, step by step."],rule:"Rule of the night train: no guessing. Every answer needs a reason, and every idea can be tested, so question ideas, never people."}},Kf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A short talk from the Club (exam Part 2): Amara tells how her grandmother found the real cause of a problem at her fruit stall in Lagos. Listen for what was ruled out, notice how she argues her point and sums up, then use her phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress that moves in word families (ANalyse → aNALysis → anaLYTical), and /ɪ/ or /e/: bit or bet? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 4: put six parts of an answer about solving problems quickly or carefully in order and choose the right linking word for each part (two words are extra), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 4; fast pairs try Level 5, pairs who need help go back to Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about finding causes, weighing up options and fixing problems. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the cleverest solution they heard (use the wheel)."]},{id:"game",icon:"🚆",name:"The Night Train",min:18,lv:"c1",group:"3 teams of 5",kind:"five",roles:["Definer","Fact Finder","Idea Maker","Tester","Explainer"],desc:"Escape Room: open five locked doors on a night train by solving problems in English: define the problem, check the facts, try ideas, test them and explain the solution. Then use the same steps for a real problem. (Book: section 6 · G6)",howto:["15 students = 3 teams of five. Each team plays on its own phone or laptop (the game works offline), so every team moves at its own speed.","Each student turns over one role card (Definer, Fact Finder, Idea Maker, Tester, Explainer) and keeps it for the whole game.","Timing: cards 1 min · Problem first 2 min · The doors 12 min (five doors, about 2 minutes each) · Back on track 3 min.","Only one projector? The teacher shows one door at a time; teams discuss and write their answer on paper. A team scores a point only for the right answer AND a clear explanation."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about helping students become better problem-solvers, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 47, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: the problem, the cousin’s idea, the cause and the umbrella.","Press **Play the podcast**. Listen for what was ruled out: _First, she ruled out …_, _his fruit was fine._ A possibility that was ruled out is not the answer. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Amara said; tap a line to hear it again.","Sort the five phrases: a discovery, opinion, reason, example and summing up.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is A. The problem was the supplier’s fruit.","gives an answer"],["B","Was it? I think she checked the supplier first. What did she find?","challenges politely"],["A","“First, she ruled out the supplier: his fruit was fine.”","checks the text again"],["B","So the supplier wasn’t the cause. The sun was. It’s C.","paraphrases"]],checks:[["Why should you listen for what was ruled out?","a talk about a problem often mentions causes that turned out to be wrong: “First, she ruled out the supplier: his fruit was fine.” They often appear as options, but they are not the answer."],["Which phrase does Amara use to sum up her talk?","In short, …"]]},pron:{ref:"Book: Lesson 47, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: in word families, the stress often moves. Before **-ic**, **-ical** and **-tion**, the syllable is strong: *ANalyse → aNALysis → anaLYTical*, *STRATegy → straTEgic*, *PROBlem → probleMATic*.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɪ/ (*bit*, *pin*) or /e/ (*bet*, *pen*)?","For /ɪ/, your mouth is almost closed and relaxed. For /e/, open your mouth a little more and pull the corners back slightly.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *analyse*. Which syllable is strong?",""],["A","The first: *AN*-a-lyse.","a correct first guess"],["T","Good. Now *analysis*.",""],["B","Still *AN*? *AN*-a-ly-sis?","a guess"],["T","In this family, the stress moves.","the teacher gives a clue"],["B","a-*NAL*-y-sis. And *analytical*: an-a-*LYT*-i-cal, before *-ical*.","uses the rule"],["T","Great! Now listen: *left*. First or second: *lift* or *left*?",""],["A","Second: *left*. My mouth was more open.","feels the mouth"]],checks:[["Where is the stress in *strategic*?","on TE: stra-TE-gic (the syllable before -ic)."],["Where is the stress in *solution*?","on LU: so-LU-tion (the syllable before -tion)."],["Which word has /ɪ/: *will* or *well*?","*will*: the mouth is almost closed."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 4**: six parts **without linking words**, and a list of linking words with **two extra** ones.","First put the parts in order. Find the **general position** (*… careful is usually better than quick …*) and the **close**.","Then choose a linking word for each part. Ask what the part does: a first reason (*Firstly*), an example (*For example*), the other side (*Having said that*), a situation (*In such situations*) or the close (*To sum up*).","Press **✔ Check**. If the order is right but a word is wrong, the app tells you: look at the linking words again.","Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 5** (key words only). Need more help? Go back to **Level 3**."],exTitle:"How Amara’s answer changed in 4/3/2",lines:[["amara","Um, careful is better, I think … because quick, um, you make mistakes … my uncle in Lagos, his generator, he fixed fast, it broke again … but, um, sometimes you must be quick, like fire …","Attempt 1 · 90 s · many pauses"],["amara","In most cases, solving a problem carefully is better than solving it quickly. Firstly, a quick fix often hides the real cause. For example, my uncle in Lagos fixed his generator in ten minutes, and it broke again the next day. Having said that, some problems can’t wait. In such situations, a quick fix buys time for a proper solution. To sum up, act fast in an emergency, but then think it through.","Attempt 2 · 60 s · linking words"],["amara","In most cases, careful beats quick. Firstly, a quick fix tends to hide the real cause rather than remove it: my uncle in Lagos patched up his generator in ten minutes, and it broke down again the very next day. Having said that, some problems simply can’t wait, a burst pipe or a fire, for instance. In such situations, a quick fix buys you time to find a proper solution. To sum up: act fast when you must, then go back and get to the root of it.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 4?","the parts have no linking words: you choose them from a list with two extra words."],["How many times do you say your own answer?","three times, to three different partners."],["Which linking phrase introduces the other side?","*Having said that, …*"]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What do you do when you are stuck on a difficult problem?",lines:[["nur","Well, first I try to **get to the root of** the problem instead of looking for **a quick fix**. I **tackle** it **step by step**: I write down what I know, then I **rule out** the ideas that don’t work. If I hit **a stumbling block**, I try to **look at it from a different angle**, or I explain it to a friend. Usually, by the time I’ve **thought it through**, I’ve **worked out** what to do.","speaker · 1 minute"],["leo","I heard nine phrases: *get to the root of*, *a quick fix*, *tackle*, *step by step*, *rule out*, *a stumbling block*, *look at it from a different angle*, *thought it through* and *worked out*. That’s a full row: **Bingo!**","listener reports"],["nur","Nine points plus three for the Bingo: twelve points!","count the points"],["leo","Next time, try *weigh up the options*. It’s on my card, and it’s perfect for decisions.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Should you invent numbers to make your answer sound stronger?","no: give reasons and real examples, not invented statistics."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Shall we look at … first?*).","Click the lines in order. Each line answers the line before. Nur and Amara take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: the locked bicycle",lines:[["A","Oh no, I’ve forgotten the code for my bike lock!","opens the topic"],["B","Don’t panic. Did you write it down anywhere, maybe in your phone?","an idea"],["A","Yes! In my notes. Here it is.","solves it"],["B","Problem solved. Maybe choose a code you can remember next time!","closes"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · note sheet in section 6",steps:["Make teams of five. Each student turns over one **role card** and keeps that role for the whole game.","**Round 1 · Problem first (2 min):** turn three vague complaints into clear problems that start with *How can we …?*","**Round 2 · The doors (12 min):** the Definer says what the door is really asking. Discuss, test every idea, then type your answer and press **Unlock**.","Stuck? Press **Hint**. A wrong answer is not a failure: it rules something out. Read the clues again and try another idea.","When a door opens, the Explainer explains **how** your team solved it, step by step. Then press **Next door**.","**Round 3 · Back on track (3 min):** use the same five steps on a real problem at a university. One student presents your plan in one minute."],exTitle:"Sample game: the Club tries Nargiza’s practice door",lines:[["","Practice door — Definer Leo · Fact Finder Nur · Idea Maker Mateo · Tester Amara · Explainer Aziza",""],["leo","(reads) “A passenger’s watch is 10 minutes fast. It shows 7.25. The train leaves at 7.30.” **So the real question is:** how many minutes do we really have?","the Definer says what the door is asking"],["mateo","Five minutes? 7.25 to 7.30.","a quick first idea"],["nur","**Let’s stick to the facts:** the watch is fast, so the real time is earlier: 7.15.","the Fact Finder checks the facts"],["amara","**If we test that:** 7.15 plus 15 minutes is 7.30. So fifteen minutes.","the Tester tests the idea"],["mateo","Ah, I see. I forgot that a fast watch is ahead of the real time.","accepts the correction"],["aziza","**Step one**, we worked out what the question was really asking. **Then** Nur pointed out that a fast watch is ahead, so the real time was 7.15. **That ruled out** Mateo’s first idea, and Amara’s test confirmed fifteen minutes.","the Explainer explains after the door opens (C1 phrases)"]],checks:[["What does the Definer do?","says what the door is really asking, in one clear sentence, before anyone tries to answer."],["Is a wrong answer a failure?","no: it rules something out. Read the clues again and try another idea."],["What happens after a door opens?","the Explainer explains the solution step by step; then the next door appears."]]},drills:{ref:"Book: Lesson 47 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Uf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"The city has finally decided to ___ the traffic problem in the centre.",o:["tackle","rule out","stumble"],a:0},{q:"Instead of guessing, let’s ___ the problem and find out why it keeps happening.",o:["get to the root of","look at a stumbling block","sort a quick fix"],a:0},{q:"Tape on a broken window is only ___; it won’t last the winter.",o:["a quick fix","a long-term solution","a root"],a:0},{q:"A new window is more expensive, but it’s ___.",o:["a long-term solution","a stumbling block","a quick fix"],a:0},{q:"Before you decide, ___ carefully: the cost, the time and the risks.",o:["weigh up the options","rule out the options","fix the options"],a:0},{q:"The battery is new, so we can ___ that as the cause.",o:["rule out","work out","sort out"],a:0},{q:"It took us an hour, but we finally ___ how the machine works.",o:["worked out","ruled out","tackled out"],a:0},{q:"Money was the biggest ___ in the project: everything else was ready.",o:["stumbling block","long-term solution","different angle"],a:0},{q:"If you’re stuck, try to ___: imagine you are the customer.",o:["look at it from a different angle","get to the root","rule it out"],a:0},{q:"A big problem feels smaller if you take ___.",o:["a step-by-step approach","a quick fix","a stumbling block"],a:0},{q:"Don’t answer the email now. ___ first, and reply tomorrow.",o:["Think it through","Rule it out","Tackle it out"],a:0},{q:"My laptop won’t start. Can you help me ___?",o:["sort it out","rule it out","weigh it up"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Why is it broken? → **I wonder why …**",a:"I wonder why it’s broken. (indirect question: statement word order)"},{p:"What caused the problem? → **Do you know what …?**",a:"Do you know what caused the problem?"},{p:"It might be the battery. → **It could have been …** (past)",a:"It could have been the battery."},{p:"It can’t be the cable. The cable is new. → **because**",a:"It can’t be the cable, because the cable is new."},{p:"We didn’t check the facts. We made a mistake. → **If we had …**",a:"If we had checked the facts, we wouldn’t have made a mistake."},{p:"Let’s try another way. → **What if we …?**",a:"What if we tried another way?"},{p:"The problem was solved by Nargiza. → **active**",a:"Nargiza solved the problem."},{p:"We need to find the cause. → **The first thing we need to do is …**",a:"The first thing we need to do is find the cause."},{p:"It is difficult for me to understand it. → **I have difficulty …**",a:"I have difficulty understanding it. (difficulty + -ing)"},{p:"Someone has to fix it. → **It needs …**",a:"It needs fixing. / It needs to be fixed."},{p:"We tried everything. Nothing worked. → **No matter what …**",a:"No matter what we tried, nothing worked."},{p:"The machine stopped. Then the lights went out. → **after**",a:"The lights went out after the machine stopped."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Let’s find the real reason.",a:"Let’s get to the root of the problem."},{p:"This won’t fix it for long.",a:"This is only a quick fix, not a long-term solution."},{p:"Let’s think about all the choices.",a:"Let’s weigh up the options before we decide."},{p:"It isn’t the battery.",a:"We can rule out the battery."},{p:"This is the main difficulty.",a:"This is the main stumbling block."},{p:"Try to see it differently.",a:"Try to look at it from a different angle."},{p:"I understood how to do it.",a:"I finally worked out how to do it."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ We decided this problem yesterday.",o:["We solved this problem yesterday.","We decided on this problem yesterday.","We did this problem decided yesterday."],a:0,why:"solve a problem; decide = make a choice"},{q:"✗ We must find out a solution.",o:["We must find a solution.","We must find up a solution.","We must found a solution."],a:0,why:"find a solution; find out = discover information"},{q:"✗ I have a problem with to understand this task.",o:["I have difficulty understanding this task.","I have problem to understand this task.","I have a difficulty to understanding this task."],a:0,why:"have difficulty (in) + -ing / have trouble + -ing"},{q:"✗ Let’s solve it step to step.",o:["Let’s solve it step by step.","Let’s solve it step for step.","Let’s solve it steps by steps."],a:0,why:"step by step"},{q:"✗ The reason of the problem is the old cable.",o:["The reason for the problem is the old cable.","The reason from the problem is the old cable.","The problem’s reason of is the old cable."],a:0,why:"the reason for something (but: the cause of something)"},{q:"✗ We can’t afford losing more time.",o:["We can’t afford to lose more time.","We can’t afford lose more time.","We can’t to afford losing more time."],a:0,why:"can’t afford + to + infinitive"},{q:"✗ I’m thinking to change my plan.",o:["I’m thinking of changing my plan.","I’m thinking change my plan.","I think to changing my plan."],a:0,why:"think of / about + -ing"},{q:"✗ Can you explain why did it break?",o:["Can you explain why it broke?","Can you explain why it did break?","Can you explain why broke it?"],a:0,why:"indirect question: no did, statement word order"}]},{title:"Stress: words about solving problems",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"to study something in detail (verb)",o:["ANalyse","anaLYSE"],a:0},{q:"a detailed study of something (noun)",o:["aNALysis","ANalysis"],a:0,why:"In this word family, the stress moves."},{q:"using careful logical thinking (adjective)",o:["anaLYTical","ANalytical"],a:0,why:"Before -ical, the syllable is strong."},{q:"a plan to reach a goal",o:["STRATegy","straTEgy"],a:0},{q:"connected with a plan (adjective)",o:["straTEgic","STRATegic"],a:0,why:"Before -ic, the syllable is strong."},{q:"causing difficulties (adjective)",o:["probleMATic","PROBlematic"],a:0},{q:"a way of solving a problem",o:["soLUtion","SOlution"],a:0,why:"Before -tion, the syllable is strong."}]}],Gf={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to the team and keep it for the whole game. Together, the five roles are the five steps of solving a problem.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",teamWord:"Team",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Problem first",lv:"b2p",bloom:"Understand / Analyse",by:"leo",seconds:90,q:"A problem that is clearly defined is half solved. Turn these three vague complaints into **clear problems** that start with **“How can we …?”**: *“The library is useless at exam time.”* · *“Nobody reads the student newsletter.”* · *“The bus to the campus is a nightmare.”* Then choose one and say what **facts** you would need before you try to solve it.",help:{b2:["The real problem is that …","How can we …?","First, we’d need to find out …"],c1:["What the complaint is really about is …","So the question becomes: how can we …?","Before we jump to solutions, we’d need to know …"]},model:"What the first complaint is really about is space: at exam time there aren’t enough seats. So the question becomes: how can we give more students a quiet place to study during exams? The second one is about reaching people: how can we make the newsletter something students actually want to read? And the bus complaint could mean many things: is it too crowded, too slow or too rare? Before we jump to solutions, we’d need to know exactly when the bus is crowded and how many students use it. Otherwise, we might solve the wrong problem."},{name:"Round 2 · The doors",lv:"b2p",bloom:"Analyse / Evaluate",by:"aziza",seconds:0,tool:"escape",q:"Read each door aloud. The Definer says what it is really asking; the team checks the facts, tries ideas and tests them. Type your answer and press Unlock. When the door opens, the Explainer explains the solution step by step.",help:{b2:["So the real question is …","Let’s stick to the facts: …","If we test that, …"],c1:["What we’re actually being asked is …","That rules out …","Step one, we … ; then …"]},model:"I’m the Explainer, so here’s our solution, step by step. Step one, our Definer put the question into one simple sentence, so we all knew what we were looking for. Then our Fact Finder listed only what the clues really said, not what we thought they said. Our Idea Maker suggested two possible answers, and our Tester checked both against every clue. One of them broke a rule, so that ruled it out. The other one worked every time, and that’s the answer we typed."},{name:"Round 3 · Back on track",lv:"c1",bloom:"Evaluate / Create",by:"nur",seconds:90,q:"Use the five steps from tonight on a real problem: **the campus canteen queue is so long that students miss the start of afternoon lectures**. **Define** it · list the **facts** you need · give **two ideas** · say how you would **test** them · and how you would **look back** to see if it worked. One student presents your plan in one minute.",help:{b2:["The problem is …","We’d need to know …","We’d test it by …"],c1:["In a nutshell, the problem is …","Rather than guessing, we’d …","If it works, we’d … ; if not, we’d go back to …"]},model:"In a nutshell, the problem is this: how can students get lunch fast enough to arrive at their two o’clock lectures on time? Rather than guessing, we’d first find out when the queue is longest and what slows it down: paying, choosing or serving. Our two ideas are a pre-order board in the morning and a second, faster counter for one simple hot meal. We’d test each idea for one week and count how long the queue is at ten to two. If it works, we’d keep it; if not, we’d go back to the facts and try the other idea."}],_f=[{e:"🎯",n:"The Definer",r:"Says what the problem really is.",lines:[["Your job","Before anyone answers, say in one clear sentence what the door is really asking."],["Useful phrase","So the real question is …"]],x:"Many wrong answers are good answers to the wrong question. Read the last sentence of the puzzle twice."},{e:"📋",n:"The Fact Finder",r:"Separates facts from guesses.",lines:[["Your job","List only what the clues really say. Point out when the team starts to add things that aren’t there."],["Useful phrase","Let’s stick to the facts: …"]],x:"Write the facts in short lines on the note sheet. A list is easier to check than a memory."},{e:"💡",n:"The Idea Maker",r:"Suggests possible answers.",lines:[["Your job","Suggest at least two possible answers or ways to solve the puzzle, even if you aren’t sure."],["Useful phrase","What if we tried …?"]],x:"Your first idea is rarely your best one. When you have an idea, ask: what else could it be?"},{e:"🧪",n:"The Tester",r:"Tests every idea against every clue.",lines:[["Your job","Check each possible answer against all the clues. One clue that doesn’t fit is enough to rule it out."],["Useful phrase","If we test that, … · That rules out …"]],x:"Test ideas, not people. Say “This clue doesn’t fit”, not “You’re wrong”."},{e:"🗣",n:"The Explainer",r:"Explains the solution step by step.",lines:[["Your job","When a door opens, explain how the team solved it: step one, then, that ruled out, so."],["Useful phrase","Step one, we … ; then …"]],x:"A good explanation is short and in order. If a listener can repeat your steps, you explained it well."}],$f=[],ep={help:{b2:["So the real question is …","This can’t be right, because …","So the answer must be …"],c1:["What we’re actually being asked is …","That rules out …","Step one, we … ; then …"]},doors:[{title:"Door 1 · The ticket check",text:"Nargiza taps on the first door and smiles. “Here’s an easy one. **The day after tomorrow** is **Sunday**: that’s when we arrive in Khiva. I checked everyone’s tickets **yesterday**. Which day of the week was it **yesterday**?” Type the day.",clues:["“The day after tomorrow is Sunday.”","“I checked the tickets yesterday.”"],answer:"Thursday",accept:["it was thursday","thurs"],hint:"First find TODAY: if the day after tomorrow is Sunday, what is tomorrow? What is today? Then go back one more day.",q:"Explain how you solved it. Why is it easier to start with “today”?",by:"aziza",m:"Step one, we worked out today. If the day after tomorrow is Sunday, then tomorrow is Saturday, so today is Friday. Then we went back one day from today: yesterday was Thursday. Starting with today made it easier, because the question gives two different days, and we needed one fixed point to count from. That ruled out Friday, which was Mateo’s first guess.",seconds:60},{title:"Door 2 · The missing number",text:"The carriages of the Night Train don’t have ordinary numbers. Nargiza’s grandfather numbered them long ago, following a pattern. The number on the **last** carriage has fallen off. Type the missing number.",clues:["The carriage numbers, from the engine to the end: **1, 2, 4, 7, 11, ?**","“My grandfather loved patterns where something grows a little every time.”"],answer:"16",accept:["sixteen"],hint:"Don’t look at the numbers themselves. Look at the gaps between them: from 1 to 2, from 2 to 4, from 4 to 7 …",q:"Explain how you solved it. What did you try first?",by:"nur",m:"At first we tried doubling, because 1, 2, 4 looked like doubling, but 4 times 2 is 8, not 7, so that ruled it out. Then we looked at the gaps between the numbers instead: plus one, plus two, plus three, plus four. The gaps grow by one every time, so the next gap is five, and 11 plus 5 is 16. The clue about something that “grows a little every time” pointed us to the gaps.",seconds:60},{title:"Door 3 · No bread for breakfast",text:"Bad news from the restaurant car: **there is no bread for breakfast**. Nargiza asked “Why?” again and again, and wrote each answer on a card, but the cards got mixed up. First put them in a **chain** from the problem to the deepest cause. Then find the **root cause**: the **deepest** reason in the chain that the railway **can actually change**, so that it never happens again. Type the letter.",clues:["**A:** “Because the bakery received the bread order a day late.”","**B:** “Because the bakery’s van arrived after the train had left Tashkent.”","**C:** “Because every order is written on paper and carried by one driver, with no back-up.”","**D:** “Because the bread wasn’t loaded onto the train in Tashkent.”","**E:** “Because that driver was ill on Monday.”"],answer:"C",accept:["card c","letter c"],hint:"Start with the problem and ask “Why?”: no bread → D. Why D? → … Keep going until there are no cards left. Then ask about the last two cards: can the railway change this?",q:"Explain how you solved it. Why isn’t E the root cause, even though it comes later in the chain?",by:"leo",m:"Step one, we built the chain: there was no bread because it wasn’t loaded (D), because the van arrived late (B), because the bakery got the order a day late (A), because the driver was ill (E), and the illness mattered only because every order depends on one driver with no back-up (C). Then we asked what the railway can change. Nobody can stop people getting ill, so that ruled out E. But the railway can change the system: send orders by phone or email, or have a second driver. So the root cause is C.",seconds:90},{title:"Door 4 · The dark carriage",text:"The lamp in the next carriage won’t light. It is connected to **three fuses**: red, green and blue. **Exactly one** fuse is broken. The train mechanic, Ulfat aka, did three tests. In each test, he put **two** of the fuses in the box, and the lamp lights **only if both fuses in the box are good**. Which fuse is broken? Type the colour.",clues:["**Test 1:** red and green in the box → the lamp stays **off**.","**Test 2:** green and blue in the box → the lamp stays **off**.","**Test 3:** red and blue in the box → the lamp **lights**."],answer:"green",accept:["the green fuse","green fuse"],hint:"Start with the test where the lamp lights. What does it tell you about those two fuses?",q:"Explain how you solved it. Which test gave you the most information?",by:"amara",m:"Step one, we started with Test 3, because it gave us the most information: the lamp lit with red and blue, so both of those fuses must be good. That ruled out red and blue in one go. So the only possible broken fuse was green. Then we checked it against Tests 1 and 2: green was in both, and in both the lamp stayed off. Everything fits, so the answer is green.",seconds:90},{title:"Door 5 · The heavy bag",text:"The last door! Nargiza has lost the key to the restaurant car. It fell into **one of nine** identical bags of dried apricots, so that bag is now a **little heavier** than the others. The station has an old **balance scale** with two pans: it shows only which side is heavier, not the weight. What is the **smallest number of weighings** that will **always** find the heavy bag? Type the number.",clues:["“If the two pans balance, the heavy bag is not on the scale at all.”","“You don’t have to put every bag on the scale at once.”","“Think in groups of three.”"],answer:"2",accept:["two","2 weighings","two weighings"],hint:"Put the nine bags into three groups of three. Weigh two of the groups. What do you know after that? Then do the same with three single bags.",q:"Explain how you solved it. Why isn’t the answer 8, or 4?",by:"mateo",m:"Step one, we split the nine bags into three groups of three. First weighing: group one against group two. If one side goes down, the key is in that group; if they balance, it’s in group three. Either way, we now have just three bags. Second weighing: one bag against another. If one is heavier, that’s it; if they balance, it’s the third bag. So two weighings are always enough. Comparing bags one by one could take eight, and halving doesn’t work with nine bags, so that ruled out the bigger numbers.",seconds:90}],end:{title:"The restaurant car is open!",text:"Nargiza opens the last door, and the smell of fresh tea and warm samsa fills the carriage: the bread problem has been solved for today too. “Well done! You didn’t guess: you defined, checked, tested and explained. That works on any problem, not only on trains.” Now go to **Round 3** and try the same steps on a real problem."}},tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"What do you usually do when you have a problem?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I usually try to solve a problem myself first."],["Point","**The main reason is that** I learn more when I find the answer on my own."],["Example","**For example,** when my laptop stopped working in Navoi last year, I watched a few repair videos and fixed it myself."],["Close","**So, all in all,** I try on my own first, and if I’m really stuck, I ask for help."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"What is the best way to deal with a difficult problem?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**Honestly, I think the most important thing is** not to panic."],["","**First,** write down exactly what the problem is."],["","**Then,** break it into smaller parts and deal with them one by one."],["","**For instance,** when our club’s trip in Kuala Lumpur was cancelled, we listed the problems and solved the transport first."],["","**On top of that,** ask someone who has had the same problem before."],["","**In short,** stay calm, break it down and ask for advice."]],keys:["the most important thing is","first","then","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"mateo",q:"Are young people today better at solving problems than their parents were?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that young people solve different problems, rather than more or fewer."],["","First and foremost, they are used to finding information quickly online."],["","Equally, many of them are confident with new technology and learn new apps without instructions."],["","To illustrate this, my younger cousin in Recife set up the internet for our whole family in ten minutes."],["","Admittedly, our parents are often better at practical problems, like repairing things at home."],["","Overall, each generation has its own strengths, so we can learn a lot from each other."]],extra:"My cousin also plays the guitar in a band with his school friends.",keys:["first and foremost","equally","admittedly","overall"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"amara",q:"Is it better to solve a problem quickly or carefully?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In most cases,","solving a problem carefully is better than solving it quickly."],["Firstly,","a quick fix often hides the real cause instead of removing it."],["For example,","my uncle in Lagos fixed his generator in ten minutes, and it broke down again the next day."],["Having said that,","some problems, like a burst pipe or a fire, simply can’t wait."],["In such situations,","a quick fix buys you time to find a proper solution later."],["To sum up,","act fast when you must, but then go back and get to the root of the problem."]],distractors:["Likewise,","Meanwhile,"],keys:["carefully","the real cause","can’t wait","buys you time"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"leo",q:"Should schools teach problem-solving as a separate subject?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["every subject","real problems","for example","a timetable already full","projects"],model:"I’m not sure it needs to be a separate subject, because problem-solving is part of every subject: maths, science, languages and even sport. What schools really need is more real problems, not just exercises with one correct answer. For example, at my school in Hamburg we had a project week where we tried to reduce the waste in our canteen, and we learnt more about problem-solving than in any lesson. Another argument against a new subject is that the timetable is already full. So I’d choose more projects instead, where students define a real problem and test their own solutions."}],np={title:"Exam Part 2 practice: helping students become better problem-solvers",situation:"A university in Samarkand wants its students to become better at solving problems. It can choose only one idea: a weekly puzzle and logic club, a “real problems” challenge in which teams work on problems for local businesses, or short problem-solving tasks added to every course. Nur and Amara are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"amara",lines:[["A","Shall we look at the puzzle club first? It sounds like fun."],["B","It does, and puzzles train you to think logically, don’t they?"],["A","True, but only students who already like puzzles would go."],["B","That’s a fair point. What about the real problems challenge?"],["A","I love that one: students would solve problems that actually matter to someone."],["B","Yes, though it might take a lot of time to organise with local businesses."],["A","Maybe, but adding small tasks to every course wouldn’t feel very real, would it?"],["B","Not really. So shall we go for the challenge, and start with just two or three businesses?"],["A","Agreed. That way, it’s realistic to organise and it feels real to the students."]],phrases:{Start:["Shall we look at … first?","…, don’t they?"],Clarify:["True, but …","Yes, though …"],"Give the turn":["What about …?","That’s a fair point."],"Agree and decide":["…, would it?","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: the Wi-Fi in your university library is very slow at exam time. Choose **one** solution to suggest: a time limit for each student, more study spaces in other buildings with good Wi-Fi, or downloading materials at home before you come. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["tackle the problem","get to the root of it","a quick fix","a long-term solution","weigh up the options","rule it out","work it out","a stumbling block","step by step"],B:["look at it from a different angle","a quick fix","think it through","get to the root of it","sort it out","step by step","weigh up the options","a stumbling block","rule it out"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["tackle the problem","get to the root of it","a quick fix","a long-term solution","weigh up the options","rule it out","work it out","a stumbling block","step by step","look at it from a different angle","think it through","sort it out"],questions:["What do you do when you are stuck on a difficult problem?","Is it better to solve problems alone or with other people?","Is a quick fix ever the best solution? When?","What is the most useful problem-solving skill for a job?","How do people in Uzbekistan usually deal with a problem in the neighbourhood? Is it similar in another country you know?","Is there always a solution to every problem?"]},sp=[{type:"stress",title:"Stress Spot: words about solving problems",intro:"Tap the stressed syllable. Rules: in word families, the stress often moves; before -ic, -ical and -tion, the syllable is strong (ANalyse → aNALysis → anaLYTical, STRATegy → straTEgic, PROBlem → probleMATic, soLUtion). Then listen and say the word.",follow:"Now use two of these words in one sentence about the Night Train.",items:[{w:"analyse",syl:["an","a","lyse"],s:0},{w:"analysis",syl:["a","nal","y","sis"],s:1},{w:"analytical",syl:["an","a","lyt","i","cal"],s:2},{w:"strategy",syl:["strat","e","gy"],s:0},{w:"strategic",syl:["stra","te","gic"],s:1},{w:"problem",syl:["prob","lem"],s:0},{w:"problematic",syl:["prob","lem","at","ic"],s:2},{w:"solution",syl:["so","lu","tion"],s:1}]},{type:"pairs",title:"Sound Pairs: /ɪ/ or /e/?",intro:"Press Play and choose the word you hear: /ɪ/ (bit, pin) or /e/ (bet, pen)? For /ɪ/, the mouth is almost closed and relaxed; for /e/, open it a little more. English /ɪ/ is shorter and more relaxed than Uzbek i, so some Uzbek speakers make it sound too much like /iː/ or /e/: keep it short. Partner version: one student says a word, the partner points to it.",pairs:[["bit","bet"],["pin","pen"],["sit","set"],["lift","left"],["will","well"]]}],op=["Use two C1 phrases in your next answer.","Ask the Explainer a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say which answer you ruled out first, and why.","Explain the last door again in three steps, without notes."],lp={title:"Step Up Speaking Club Ideas Evening: My Grandmother’s Fruit Stall",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s Ideas Evening, Amara talks about her grandmother’s fruit stall in Lagos: the mangoes that went bad, her cousin’s quick fix, how her grandmother found the real cause, the umbrella she chose and a similar story from Aziza’s uncle in Navoi.",tip:["Listen for what was ruled out","When speakers describe how a problem was solved, they often mention possible causes that turned out to be wrong: *First, she ruled out …*, *… was fine.* These ideas often appear as options, so make sure the one you choose wasn’t ruled out."],A:"amara",B:"leo",lines:[["A","Good evening, everyone. My grandmother has sold fruit at a market in Lagos for many years, and she’s the best problem-solver I know. Last summer, a lot of her mangoes went bad before she could sell them. My cousin suggested **a quick fix**: lower the prices. But my grandmother wanted to **get to the root of** the problem."],["A","She **tackled** it **step by step**. First, she **ruled out** the supplier: his fruit was fine. Then she **looked at** the problem **from a different angle** and watched her stall at different times of day. [[0]] the afternoon sun was shining straight onto the fruit. That’s how she **worked out** the cause."],["A","The **stumbling block** was money, because a proper roof was expensive. So she **weighed up the options**: a roof, an umbrella or a new place in the shade. She **thought it through** for a week and chose an umbrella with a light-coloured cover: cheap, but **a long-term solution**."],["A","[[1]] her method works almost everywhere. [[2]] a quick fix deals with what you see, not with the cause. [[3]] Aziza’s uncle in Navoi, who **sorted out** a similar problem with his melons by moving his stall to the shady side of the market. [[4]] find the cause first. Thank you."]],gaps:[[1,"It turned out that"],[2,"As far as I can see,"],[3,"The reason for this is that"],[4,"A good illustration is"],[5,"In short,"]],questions:[{q:"What was the problem at the grandmother’s stall?",o:["Customers thought her prices were too high.","A lot of her mangoes went bad.","Her supplier sent her poor fruit."],a:1,why:"“… a lot of her mangoes went bad before she could sell them.” The supplier was ruled out later: “his fruit was fine.”"},{q:"Why didn’t the grandmother simply lower her prices?",o:["She wanted to find the real cause.","She couldn’t afford to.","Her customers were happy with the prices."],a:0,why:"“My cousin suggested a quick fix: lower the prices. But my grandmother wanted to get to the root of the problem.”"},{q:"What was causing the problem?",o:["the supplier’s fruit","the time of day she opened","the afternoon sun on the fruit"],a:2,why:"“It turned out that the afternoon sun was shining straight onto the fruit.” She watched at different times of day to find this."},{q:"Why did she choose the umbrella?",o:["It was the only option she could find.","It was cheap and would work for a long time.","Her cousin recommended it."],a:1,why:"“… chose an umbrella with a light-coloured cover: cheap, but a long-term solution.” She had three options."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one introduces a discovery, and which one sums up the talk?",groups:[["A discovery",[1]],["Opinion",[2]],["Reason",[3]],["Example",[4]],["Summing up",[5]]]},use:{q:"Should schools teach problem-solving as a separate subject? Why or why not?",by:"leo",model:"As far as I can see, problem-solving shouldn’t be a separate subject, but it should be part of every subject. The reason for this is that real problems don’t come with a subject name. A good illustration is my engineering course in Hamburg: in each module, we get one real problem from a local company, and we have to find the cause before we suggest a fix. Of course, some teachers say there’s no time for that. In short, schools should teach it through real problems, not through a new subject.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Yf,DIALOGUE:np,DRILLS:Uf,ESCAPE:ep,LESSON:Kf,LEVELS:tp,LISTEN:lp,MAIN:Gf,PRON:sp,ROUNDS:Jf,TWISTS:$f,UNIT:Xf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},up={openverse:"b3a85f42-6115-4067-9856-6ead6181a762",title:"Railroad Railw
