isten for feelings, purpose and ideas in other words, notice their phrases, then use them yourself. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four statements first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about nonverbal communication (GESture, exPRESsion, communiCAtion), and /ɔː/ or /ʌ/: caught or cut? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Can body language tell us what people really think?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about body language and for the five phrases from the podcast. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most surprising example they heard (use the wheel)."]},{id:"game",icon:"🎭",name:"Between the Lines",min:18,lv:"c1",group:"3 tables of 5",kind:"five",roles:["Actor and reader · timekeeper","Actor and reader · scorekeeper","Actor and reader · card keeper","Actor and reader","Actor and reader"],desc:"Hidden Roles with secret attitudes: say the same neutral words, act silent scenes with only one channel, then decode each other’s attitude with two pieces of evidence. Last round: one signal, many meanings. (Book: section 6 · Game School G6)",howto:["15 students = 3 tables of five, all at the same time, each with its own phone or laptop. Everybody is an actor and a reader; one also keeps time, one keeps the score sheet, one passes the phone.","Students who prefer not to act are readers only: they do not take a card, they read the others and keep notes. Nobody touches anyone in any scene.","Timing: attitude cards 2 min · Same words 3 min · Silent scenes 5 min · Decode 3 min · Reveal and score 2 min · Same signal 3 min.","Six at a table? Two readers share one score sheet. Points only count with two pieces of evidence (book, section 6)."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about which public-speaking workshop an English club should run: hands, voice or eye contact. Then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 74, section 2 · Listen and Notice",steps:["**Before you listen:** read the four statements. For each one, guess who probably said it: Amara, Mateo, or both of them.","Press **Play the podcast**. Choose A, B or C. Press an option: you see why the answer is right.","Careful: an idea belongs to **both** speakers only when both of them say it, perhaps in different words.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, checking meaning, and disagreeing politely.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Statement 4 is “both of them”.","gives an answer"],["B","Are you sure? Only Amara says “a clue, not a proof”.","asks for evidence"],["A","Yes, but Mateo says “Never judge someone from a single signal.” That’s the same idea in other words.","uses the text as evidence"],["B","Right: different words, same opinion. So it’s C.","paraphrases"]],checks:[["When is the answer “both of them”?","when both speakers say the same idea, even in different words."],["Which phrase does Mateo use to check that he has understood Amara?","Let me get this straight: …"]]},pron:{ref:"Book: Lesson 74, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion** and **-sion**, the syllable is strong (*exPRESsion*, *communiCAtion*); *GESture* and *POSture* are strong at the start.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɔː/ (*caught*, *bought*) or /ʌ/ (*cut*, *but*)?","/ɔː/ is long: round your lips and push them forward a little. /ʌ/ is short: open your mouth, relax your lips, and stop quickly.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *expression*. Which syllable is strong?",""],["A","The first: *EX*-pres-sion?","a guess"],["T","Listen again: ex-*PRES*-sion. What comes after it?","the teacher gives a clue"],["A","*-sion*! So *PRES* is strong.","uses the rule"],["T","Good. Now *gesture* and *communication*.",""],["B","*GES*-ture, but com-mu-ni-*CA*-tion: the stress comes before *-tion*.","notices the rule"],["T","Yes! Now listen: *cut*. First or second: *caught* or *cut*?",""],["B","Second: *cut*. It’s short, and my lips aren’t round.","listens for length"]],checks:[["Where is the stress in *nonverbal*?","on VER: non-VER-bal."],["Where is the stress in *interpret*?","on TER: in-TER-pret."],["Which word is long and has round lips: *born* or *bun*?","*born* /bɔːn/; *bun* /bʌn/ is short."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*I’m firmly of the view that*, *Think about*, *That’s down to the fact that*, *So*).","Make sure your answer has a clear **position**, an **example**, a **reason** why signals are misread, and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Mateo’s answer changed in 4/3/2",lines:[["mateo","Um, yes and no. Body language, it’s a clue. Arms folded, maybe cold, maybe angry. A man at the bus station, he shrugged… I don’t know. So, er, ask.","Attempt 1 · 90 s · the key words, many pauses"],["mateo","I think body language is a clue, but not a proof. For example, folded arms can mean anger, or the room is cold. At the bus station in Recife, a man shrugged and I couldn’t tell if he was confused or relaxed. So we should look at more signals, and ask.","Attempt 2 · 60 s · linking phrases"],["mateo","I’m firmly of the view that body language is a clue, not a proof. Think about folded arms: anger, or simply a cold room? At a bus station in Recife, I watched a man shrug at the ticket window and honestly couldn’t tell whether he was confused or relaxed. So read several signals together, and if in doubt, ask.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Can you trust your first impression of someone?",lines:[["nur","**I’m firmly of the view that** first impressions are useful, but risky. **That’s down to the fact that** we see only a moment. **Think about** a new classmate with **a blank expression** on the first day: is she unfriendly, or just nervous? If we **jump to conclusions**, we may miss a friend. Better to watch her **body language** for a week, and then decide.","speaker · 1 minute"],["leo","I heard six phrases: *I’m firmly of the view that*, *That’s down to the fact that*, *Think about*, *a blank expression*, *jump to conclusions* and *body language*. That’s the middle row: **Bingo!**","listener reports"],["nur","Six points plus three for the Bingo: nine!","count the points"],["leo","Next time, try *send mixed signals*. It’s on my card, and it fits your classmate.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Can one gesture prove what someone feels?","no: body language is a clue, so look at several signals and, if in doubt, ask."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*The club can only run one workshop …*).","Click the lines in order. Each line answers the line before. Leo and Nur take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a class photo",lines:[["A","We need one class photo for the website: a serious one or a fun one.","opens the topic"],["B","A fun one shows our real faces, doesn’t it?","a reason"],["A","True, but a serious one looks better to new students’ parents.","an argument"],["B","Then let’s take both and put the fun one on the club page.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G6 · section 6",steps:["Make tables of five. Choose a **timekeeper**, a **scorekeeper** and a **card keeper**; everyone is an **actor** and a **reader**. Prefer not to act? Be a reader only.","**Attitude cards (2 min):** pass the phone. Each actor picks one face-down card, reads the secret attitude and the signals, then closes it (“Taken”). Never say your attitude aloud.","**Round 1 · Same words:** each actor says **“Right. That’s fine. See you tomorrow.”** with their secret attitude. Readers write a guess and the evidence on the score sheet, silently.","**Round 2 · Silent scenes:** each actor opens a **scene card** and acts it for 30 seconds without words, using **only the channel on the card**. Readers add evidence.","**Round 3 · Decode:** each reader names one actor’s attitude with **two pieces of evidence** and **one other possible reading**. No evidence, no point.","**Round 4 · Reveal and score:** actors say “I was …”, tap their card and read the actor’s note. Score on the board.","**Round 5 · Same signal, different meaning:** open a **signal card** and give two readings in two situations or cultures, plus how you would check."],exTitle:"Sample game: Rounds 1, 3 and 4 at Table B",lines:[["","Timekeeper: Nur · Scorekeeper: Aziza · Card keeper: Leo · Actors: all five",""],["leo","(slowly, looking at the floor, a long pause before “fine”) Right. That’s… fine. See you tomorrow.","Round 1 · the same words"],["amara","(fast, smiling, leaning forward) Right! That’s fine! See you tomorrow!","Round 1 · the same words"],["","… Round 3 · Decode …",""],["mateo","I think Leo was **disappointed but hiding it**. **What gave it away was** the long pause before “fine”, and his eyes went down. **That could equally point to** tired, so my second reading is tired.","attitude + two pieces of evidence + a second reading"],["aziza","Amara was **delighted**. **Evidence one:** her voice went up and got faster. **Evidence two:** in the gift scene she opened her arms wide. **I’m fairly sure, though not certain.**","a reader with evidence"],["","… Round 4 · Reveal …",""],["leo","**I was** disappointed. Mateo, you read it right, and with evidence: one point for you, and one for me as a clear actor.","reveals and scores"],["amara","**I was** relieved, not delighted! Aziza’s evidence was good, but relief and delight can look the same for a few seconds. **The voice gave it away:** I breathed out first.","a misread, explained"],["nur","So Aziza gets a point only for her second reading. That’s the game: **a clue, not a proof.**","the scorekeeper’s rule"]],checks:[["When does a reader’s point count?","only when they name the attitude and give two pieces of nonverbal evidence."],["Can a student play without acting?","yes: they are a reader only and keep notes; nobody has to act and nobody touches anyone."],["Does a gesture always mean the same thing?","no: its meaning depends on the situation, the person and the culture, so treat it as a clue."]]},drills:{ref:"Book: Lesson 74 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Posture, gestures and the face are all part of our ___.",o:["body language","tone of voice","personal space"],a:0},{q:"In a job interview, try to ___ with the person who is asking the question.",o:["make eye contact","keep your distance","jump to conclusions"],a:0},{q:"A stranger stood so close to me on the empty platform that he was in my ___.",o:["personal space","facial expression","body language"],a:0},{q:"She said “Great idea”, but her ___ was flat and cold.",o:["tone of voice","personal space","blank expression"],a:0},{q:"Don’t ___: one gesture doesn’t tell you the whole story.",o:["jump to conclusions","read the room","make eye contact"],a:0},{q:"He smiled, but his hands were shaking: he was ___.",o:["sending mixed signals","keeping his distance","folding his arms"],a:0},{q:"When I asked where the station was, he just ___: he didn’t know.",o:["shrugged his shoulders","made eye contact","read the room"],a:0},{q:"Her ___ showed nothing at all: not happy, not sad.",o:["blank expression","tone of voice","personal space"],a:0},{q:"A good speaker can ___ and notice when the audience is getting tired.",o:["read the room","jump to conclusions","fold their arms"],a:0},{q:"Smiles, frowns and raised eyebrows are ___.",o:["facial expressions","tones of voice","personal spaces"],a:0},{q:"In a crowded lift, many people ___ from strangers as much as they can.",o:["keep their distance","make eye contact","send mixed signals"],a:0},{q:"He ___ because the office was cold, not because he was angry.",o:["folded his arms","read the room","shrugged his shoulders"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"She folded her arms. → **She kept …(-ing)**",a:"She kept folding her arms."},{p:"She kept folding her arms. → **I thought she was angry, but she must …(be cold)**",a:"I thought she was angry, but she must have been cold."},{p:"He didn’t look at me. → **He avoided …**",a:"He avoided looking at me."},{p:"He avoided looking at me. → **It wasn’t that he was rude; it was that …(shy)**",a:"It wasn’t that he was rude; it was that he was shy."},{p:"Her face showed that she was surprised. → **Her facial expression …**",a:"Her facial expression showed that she was surprised."},{p:"Body language is not a proof. It is a clue. → **It isn’t …, it’s …**",a:"Body language isn’t a proof, it’s a clue."},{p:"I noticed her voice most. → **What I noticed most was …**",a:"What I noticed most was her voice."},{p:"People rarely notice their own gestures. → **Rarely …(inversion)**",a:"Rarely do people notice their own gestures."},{p:"You watch someone longer. You understand them better. → **The longer …, the better …**",a:"The longer you watch someone, the better you understand them."},{p:"I should have asked him. I didn’t. → **If only …**",a:"If only I had asked him!"},{p:"Someone stands too close. Step back politely. → **If someone …, …**",a:"If someone stands too close, step back politely."},{p:"She was smiling. She was nervous. → **Although …**",a:"Although she was smiling, she was nervous."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I think body language is very important.",a:"I’m firmly of the view that body language matters as much as words."},{p:"She showed two different feelings.",a:"She was sending mixed signals."},{p:"Don’t decide too fast.",a:"Be careful not to jump to conclusions."},{p:"His face showed nothing.",a:"He had a completely blank expression."},{p:"It happened because the room was cold.",a:"That’s down to the fact that the room was cold."},{p:"I understand you, but I don’t agree.",a:"I see where you’re coming from, but I’d read it differently."},{p:"Do you mean that one gesture fooled you?",a:"Let me get this straight: one gesture fooled you?"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ He did a gesture with his hand.",o:["He made a gesture with his hand.","He did a gesture by his hand.","He gestured a gesture with his hand."],a:0,why:"we make a gesture (a calque of “qoʻli bilan ishora qildi”: qilmoq is not always do)"},{q:"✗ She looked to me angrily.",o:["She looked at me angrily.","She looked me angrily.","She looked on me angry."],a:0,why:"look at someone; smile at someone"},{q:"✗ Body language are very important.",o:["Body language is very important.","Body languages are very important.","A body language are very important."],a:0,why:"body language is uncountable: is, not are"},{q:"✗ She avoided to look at me.",o:["She avoided looking at me.","She avoided look at me.","She avoided to looking at me."],a:0,why:"avoid + -ing"},{q:"✗ He smiled to me when I came in.",o:["He smiled at me when I came in.","He smiled me when I came in.","He smiled for me when I came in."],a:0,why:"smile at someone"},{q:"✗ Her face expression was very sad.",o:["Her facial expression was very sad.","Her face’s expressing was very sad.","Her expression face was very sad."],a:0,why:"facial expression, or the expression on her face (a calque of “yuz ifodasi”)"},{q:"✗ Everybody were looking at the speaker.",o:["Everybody was looking at the speaker.","Everybody were looked at the speaker.","Every bodies were looking at the speaker."],a:0,why:"everybody takes a singular verb: was"},{q:"✗ He nodded his head in agree.",o:["He nodded in agreement.","He nodded in agree with me.","He nodded his agree."],a:0,why:"in agreement (agree is a verb); nod already means moving the head"}]},{title:"Stress: words about nonverbal communication",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"a movement of the hand or head that shows a meaning",o:["GESture","gesTURE"],a:0},{q:"the way you sit or stand",o:["POSture","posTURE"],a:0},{q:"a look on someone’s face",o:["exPRESsion","EXpression"],a:0,why:"Before -sion, the syllable is strong."},{q:"without words",o:["nonVERbal","NONverbal"],a:0},{q:"to explain or understand the meaning of something",o:["inTERpret","INterpret"],a:0},{q:"the way you understand the meaning of something",o:["interpreTAtion","inTERpretation"],a:0,why:"Before -tion, the syllable is strong."},{q:"the act of sharing ideas and feelings",o:["communiCAtion","comMUnication"],a:0,why:"Before -tion, the syllable is strong."},{q:"connected with feelings",o:["eMOtional","EMotional"],a:0}]}],Kf={cardsStep:"Attitude cards",cardsTitle:"Attitude cards",cardsHint:"Actors, one at a time: pick a card, read your secret attitude and the signals you could use, then close it. It turns back and shows “Taken”. Pass the phone on. Never say your attitude aloud. Prefer not to act? You are a reader only: skip the cards and take a score sheet.",backWord:"Attitude",cardsSecret:!0,hiddenLabel:"Actor’s note",twistWord:"Scene",twistTitle:"Silent scene cards",twistHint:"One actor at a time opens a **scene card** and reads it aloud. Act it for **30 seconds without words**, with your secret attitude, using **only the channel on the card**. Readers watch and add **evidence** to their notes: what exactly did they see or hear? No guessing aloud yet.",twistHelp:{b2:["I noticed that …","This could mean … or …","My best guess is …, because …"],c1:["What gave it away was …","That could equally point to …","I’m fairly sure, though not certain, that …"]},questionWord:"Signal",questionTitle:"Signal cards",questionHint:"Open a **signal card** and read it aloud. Give **two different readings** of the same signal in two different situations, families or places. Then say how you could **check** what it means, without being rude. Speak about customs with respect: describe, don’t rank.",questionHelp:{b2:["In one situation, this means …","In another situation, it could mean …","To check, I would …"],c1:["Taken out of context, this could be read as …","In a different setting, the very same signal might suggest …","Rather than assume, I’d …"]},revealTitle:"Turn the attitude cards over",revealHint:"One by one, each actor says “I was …” and taps their card here. Read the **actor’s note** aloud: which signals worked, which were misread, and what else could they mean? Only tap the cards your table used.",scoreTitle:"Table score board",scoreHint:"One board per player. **Read with evidence:** +1 for each attitude you named correctly with two pieces of evidence. **Read by others:** +1 for each reader who read your attitude correctly. **Fair second reading:** +1 when your second reading was the real attitude. The highest total wins.",scoreCriteria:["Read with evidence","Read by others","Fair second reading"],teamWord:"Player",teamIcon:"",teamKind:"player",teams:5},Jf=[{name:"Round 1 · Same words",lv:"b2p",bloom:"Apply / Understand",by:"nur",seconds:20,q:"One actor at a time: face your table and say **“Right. That’s fine. See you tomorrow.”** with your **secret attitude**. Change nothing in the words; use your **face, posture and hands, distance and eyes, and voice**. Readers write a guess and the **evidence** on the score sheet, silently.",help:{b2:["His voice was …","She looked at … / She didn’t look at …","My guess: …, because …"],c1:["What stood out was …","Her posture suggested …","I’ll hold back my verdict until …"]},model:"Here is how a reader takes notes in Round 1. Leo said the line very quickly, with almost no tune in his voice, and on “tomorrow” his body was already turning towards the door. He also glanced at his wrist twice, as if checking a watch. So my note says: impatient? Evidence: a fast, flat voice, his body turned away, glances at the watch. Another possible reading: worried about something else. I’ll hold back my verdict until the silent scenes."},{name:"Round 2 · Silent scenes",lv:"c1",bloom:"Apply / Analyse",by:"leo",seconds:30,tool:"twists",q:"One actor at a time opens a **scene card** and acts it for **30 seconds without words**, keeping the same secret attitude. Use **only the channel on the card**: face only, posture and hands only, distance and eye contact only, or voice without words. **No touching.** Readers add evidence.",help:{b2:["I noticed that …","This could mean … or …","My best guess is …, because …"],c1:["What gave it away was …","That could equally point to …","I’m fairly sure, though not certain, that …"]},model:"With only one channel, small details become big evidence. In the waiting-room scene, Aziza could use only her face, and what gave it away was her mouth: she kept pressing her lips together and breathing out slowly. Her eyebrows went up whenever the imaginary door opened. That could equally point to nervous or impatient, so I wrote both, and I’m waiting for the voice scene before I decide."},{name:"Round 3 · Decode",lv:"c1",bloom:"Analyse / Evaluate",by:"mateo",seconds:60,q:"Each reader decodes **one actor** (go round the table until every actor is decoded). Name the **attitude**, give **two pieces of nonverbal evidence** from Rounds 1 and 2, say **how sure** you are, and give **one other possible reading**. Actors say nothing yet. **No evidence, no point.**",help:{b2:["I think … was …","Evidence one: … Evidence two: …","But it could also be …"],c1:["My reading is that … was …","Two things point that way: … and …","I can’t rule out …, though."]},model:"My reading is that Amara was doubtful. Two things point that way. Evidence one: in Round 1 she paused before “That’s fine” and her voice went up at the end, as if it were a question. Evidence two: in the queue scene she tilted her head and narrowed her eyes at the imaginary ticket window. I’m fairly sure, though not certain. I can’t rule out confused, though, because a tilted head and a rising voice fit both."},{name:"Round 4 · Reveal and score",lv:"c1",bloom:"Evaluate",by:"amara",seconds:0,tool:["reveal","score"],q:"Actors, one by one: say **“I was …”**, tap your card and read your **actor’s note**. Which signals worked? Which were misread, and why? Then score on the board: a reader’s point only counts with **two pieces of evidence**.",help:{b2:["I was …","You read it right because …","You thought I was …, but …"],c1:["In hindsight, the clearest signal was …","Where it went wrong was …","What this shows is that …"]},model:"I was confused, not doubtful! Mateo’s evidence was accurate, but his reading wasn’t, and in hindsight I can see why: a tilted head and a rising voice belong to both feelings. Where it went wrong was the queue scene: I meant “I don’t understand this timetable”, but it looked like “I don’t believe you”. So Mateo gets his point for the second reading, because he said “confused” as his other possibility. What this shows is that body language gives us clues, not proof."},{name:"Round 5 · Same signal, different meaning",lv:"c1",bloom:"Analyse / Evaluate",by:"aziza",seconds:60,tool:"questions",q:"Step out of the game. Open a **signal card**. Give **two readings** of the same signal in **two different situations, families or places**, then say how you could **check** what it means. Describe customs with respect: different, not better or worse.",help:{b2:["In one situation, this means …","In another situation, it could mean …","To check, I would …"],c1:["Taken out of context, this could be read as …","In a different setting, the very same signal might suggest …","Rather than assume, I’d …"]},model:"Take the hand on the heart. In Uzbekistan, many people put their right hand on their heart when they greet someone or say thank you, and it means respect and sincerity. A visitor who has never seen it might read it as a promise, or not notice it at all. In a different setting, the very same gesture might suggest something else: an athlete on a podium during an anthem, or someone saying “I’m so sorry”. Rather than assume, I’d look at the situation, and if I’m still unsure, ask a friend what it means where they come from."}],_f=[{e:"🎭",n:"Impatient",r:"Attitude card · keep it secret",lines:[["Your attitude","Impatient: you want this to end quickly; you have somewhere else to be."],["Signals you could use","glances at the door or a watch, tapping fingers or a foot, a fast and clipped voice, short nods, your body half-turned away"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Readers often notice the glances away and the fast voice. Easily confused with nervous or worried: a tapping foot can mean all three."},{e:"🎭",n:"Delighted",r:"Attitude card · keep it secret",lines:[["Your attitude","Delighted: this is the best news you have had all week."],["Signals you could use","a wide smile that reaches your eyes, raised eyebrows, open arms or hands, leaning forward, a higher and faster voice"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Usually the easiest attitude to read, but for a few seconds delight can look like relief or surprise. Watch what comes after the first reaction."},{e:"🎭",n:"Doubtful",r:"Attitude card · keep it secret",lines:[["Your attitude","Doubtful: you don’t quite believe what you have just heard."],["Signals you could use","a head tilted to one side, narrowed eyes, one raised eyebrow, a pause before you answer, your voice rising at the end as if asking a question"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"A tilted head and a rising voice are also signs of confusion. The difference is often in the eyes: doubt narrows them; confusion moves them around."},{e:"🎭",n:"Nervous",r:"Attitude card · keep it secret",lines:[["Your attitude","Nervous: something important is about to happen, and you are not sure you are ready."],["Signals you could use","playing with a sleeve or a pen, pressing your lips together, a quick and quiet voice, looking down and then up, a stiff posture"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Nervous and impatient share many signals (moving hands, quick glances). Nervous usually looks inwards and down; impatient looks outwards, at the door."},{e:"🎭",n:"Sympathetic",r:"Attitude card · keep it secret",lines:[["Your attitude","Sympathetic: you feel sorry for the other person and want to show that you care."],["Signals you could use","a soft and slow voice, a gentle nod, eyebrows slightly raised in the middle, leaning a little towards the person, a calm, open posture"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"A soft voice and a slow nod can also be read as sad or tired. What makes it sympathy is that your attention stays on the other person."},{e:"🎭",n:"Bored but polite",r:"Attitude card · keep it secret",lines:[["Your attitude","Bored but polite: this is not interesting at all, but you don’t want to be rude."],["Signals you could use","a small, fixed smile, slow blinks, a flat voice, eyes that drift away and come back, leaning back, nodding a little too regularly"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"The hardest card: polite signals hide the boredom on purpose. Readers often see calm or tired. Look for mixed signals: a smile with a flat voice."},{e:"🎭",n:"Proud",r:"Attitude card · keep it secret",lines:[["Your attitude","Proud: you have just done something difficult, and it went well."],["Signals you could use","standing or sitting tall, chin slightly up, shoulders back, a steady voice, a small satisfied smile, slow and confident movements"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Pride can be read as confidence, or even as coldness if the smile is very small. A tall posture alone is not enough evidence."},{e:"🎭",n:"Confused",r:"Attitude card · keep it secret",lines:[["Your attitude","Confused: you don’t understand what is happening or what you are supposed to do."],["Signals you could use","a frown, eyes moving from side to side, a head tilted, hands opening with palms up, a slow voice that rises at the end"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Confused and doubtful are easy to mix up. Palms up and searching eyes point to confusion; narrowed eyes point to doubt."},{e:"🎭",n:"Relieved",r:"Attitude card · keep it secret",lines:[["Your attitude","Relieved: you were worried, and now you know everything is all right."],["Signals you could use","a long breath out, shoulders dropping, eyes closing for a moment, a slow smile, a softer voice"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Relief is often read as delight or tiredness. The clue is the order: first the breath out and the shoulders dropping, then the smile."},{e:"🎭",n:"Disappointed but hiding it",r:"Attitude card · keep it secret",lines:[["Your attitude","Disappointed but hiding it: you hoped for something else, but you don’t want anyone to notice."],["Signals you could use","a smile that comes a moment too late, a pause before you speak, eyes down for a second, a voice that drops at the end, a quick change of subject"],["Remember","Choose your own signals: two or three are enough. Never say the word, and never touch anyone."]],x:"Hidden feelings leak in small, short signals: a late smile, a pause. Readers often say tired or bored. That’s why one signal is never enough."}],$f=[{t:"Waiting room · face only",q:"**A waiting room.** You are waiting for your name to be called. Sit still with your hands in your lap: **only your face** may show your attitude. 30 seconds, no words.",by:"nur",m:"My notes on Mateo: his eyebrows went up and stayed up, and he kept pressing his lips together. Twice he looked at the door and then quickly away. I think he’s nervous, but the evidence would also fit impatient, so I’ll wait for one more scene before I decide."},{t:"First day at work · posture and hands",q:"**The first day at a new job.** Walk in, find your desk and wait for your manager. Keep your face neutral: **only your posture and hands** show your attitude.",by:"leo",m:"Aziza’s face told me nothing, which was the rule, but her body said a lot. She walked in with her shoulders back and her chin up, sat down slowly and put both hands flat on the desk. What gave it away was the stillness: no fidgeting at all. My guess is proud or confident, not nervous."},{t:"A new neighbour · distance and eyes",q:"**Meeting a new neighbour in the corridor.** Walk towards one reader, stop and “greet” them without words. Show your attitude **only through distance and eye contact**: how close you stop (never closer than an arm’s length) and where you look, for how long. No touching.",by:"amara",m:"Leo stopped quite far away, a step further than he needed to, and his eyes met mine only for a second before they went to the floor. That could mean shy, nervous or disappointed. But he didn’t step away either, so I don’t think he was impatient. I’d say nervous, though I’m not certain yet."},{t:"A long queue · posture and hands",q:"**A long queue at a ticket office.** You have been standing for a while and the queue is not moving. Keep your face neutral: **only your posture and hands** show your attitude.",by:"aziza",m:"Amara kept shifting her weight from one foot to the other and folded her arms, then unfolded them. She leaned sideways twice to look at the front of the queue. Folded arms alone could mean cold, but together with the leaning and the shifting, my best guess is impatient."},{t:"The phone call · voice only",q:"**A phone call.** Turn your back to the table so nobody sees your face. Count slowly from one to ten as if it were a conversation: **only your voice** (speed, loudness, pitch and pauses) shows your attitude.",by:"mateo",m:"Nur counted very softly and slowly, with long pauses after three and after seven, and her voice dropped at the end of every number. Without her face, I had to listen to the tune. It sounded sympathetic, as if she was listening to someone’s bad news, but it could equally point to sad or tired."},{t:"Opening a message · face only",q:"**A message on your phone.** You open a message you have been waiting for and read it slowly. Hold your phone (or a book) still: **only your face** reacts.",by:"nur",m:"Leo read for a moment with a completely blank expression. Then the corners of his mouth moved, but only a little, and he blinked a few times. It was a smile that came a moment too late, so I don’t think it was good news. My reading: disappointed but hiding it."},{t:"A video call · face and hands",q:"**A video call.** The camera shows only your head and hands. Someone is explaining a long plan to you. Use **only your face and hands**; keep the rest of your body still.",by:"leo",m:"Aziza nodded a little too regularly, like a clock, and kept a small smile fixed on her face. Her eyes drifted to the side and came back twice. Those are mixed signals: the smile says “I’m interested”, but the eyes say “I’m somewhere else”. My guess is bored but polite."},{t:"A surprise gift · whole body",q:"**A surprise gift.** Someone hands you a small present you did not expect (mime it). Open it. Use **your whole body**, but no words and no sounds.",by:"amara",m:"Mateo opened the imaginary box, stopped, and then his whole body changed: his shoulders went up, his eyebrows went up, and he opened his arms wide. What gave it away was how fast it happened. That points to delighted, although the first second could also have been surprise."}],ep=[{t:"Eyes down",q:"**Looking down while someone is speaking to you.** Give two different readings in two different situations or places. Then say how you could check what it means.",by:"amara",m:"In my grandmother’s house in Lagos, we were taught not to stare at an older person who was speaking to us: looking down a little was a way of showing respect. In a job interview, the same lowered eyes might be read as a lack of confidence. The signal is identical; the room is different. To check, I’d listen to what the person says rather than judge their eyes."},{t:"A long pause",q:"**A long silence before someone answers a question.** Give two different readings in two different situations. Then say how you could check what it means.",by:"leo",m:"In a seminar, a long pause before an answer can show that someone is taking the question seriously. In a quick chat with a friend, the same pause might suggest they don’t want to answer. People are also used to different lengths of pause. Rather than assume, I’d wait a little longer, or say “Take your time” or “Shall I put it another way?”"},{t:"Standing close",q:"**Someone standing very close to you while they talk.** Give two different readings in two different situations. Then say how you could check what it means.",by:"mateo",m:"On a crowded bus in Recife, standing close means nothing at all: there’s simply no room. At an empty bus stop, the same distance from a stranger would feel strange. Friends and families differ too: what feels warm to one person may feel like too much to another. I check by watching: if the other person steps back, I step back too."},{t:"A smile",q:"**A smile at a moment when nothing seems funny.** Give two different readings in two different situations. Then say how you could check what it means.",by:"nur",m:"A smile at a stranger in a lift is usually just friendliness. But a smile right after a mistake, for example when someone drops a tray in a café, may show embarrassment, not amusement. In some places people smile at strangers often; in others they save it for people they know, which doesn’t make anyone unfriendly. I’d read the smile together with the situation, and never laugh along until I’m sure."},{t:"Hand on heart",q:"**A right hand placed on the heart.** Give two different readings in two different situations or places. Then say how you could check what it means.",by:"aziza",m:"In Uzbekistan, many people put their right hand on their heart when they greet someone or say thank you: it means respect and sincerity. In a different setting, the very same gesture might suggest something else, for example a promise, or someone saying “I’m so sorry”. If I saw it abroad and wasn’t sure, I’d simply ask a friend what it means where they come from."},{t:"Nodding",q:"**Someone nodding again and again while you speak.** Give two different readings in two different situations. Then say how you could check what it means.",by:"leo",m:"Nodding often means “I agree”, but it can also simply mean “I’m listening, go on”. In a project meeting, I once took a colleague’s nods as agreement with my plan, and she was only following my explanation. Now, when someone nods, I check with a question: “So, are you happy to go ahead with this?”"},{t:"Folded arms",q:"**Someone sitting with their arms folded during a meeting.** Give two different readings in two different situations. Then say how you could check what it means.",by:"mateo",m:"Folded arms are often read as “I disagree” or “I’m closed”, but that’s a reading, not a rule. In a cold room, they simply keep you warm, and some people find it a comfortable way to sit and listen. If the rest of the body is relaxed and the person is nodding, I wouldn’t worry. If I really need to know, I’d ask: “What do you think so far?”"},{t:"A loud voice",q:"**Someone speaking loudly and fast.** Give two different readings in two different situations. Then say how you could check what it means.",by:"amara",m:"A loud, fast voice in a quiet office might sound angry. At a family celebration or a football match, the same voice just means excitement, and in a noisy market it means being heard. Some families are simply louder than others at the dinner table. Before I decide someone is angry, I look at their face and hands: an open smile changes everything."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Do you use your hands a lot when you speak?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I use my hands quite a lot when I speak."],["Point","**The main reason is that** they help me find the right words."],["Example","**For example,** when I give directions in Navoi, my hands draw the whole map in the air."],["Close","**So, all in all,** my hands are part of my English!"]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"amara",q:"Why is body language important in a job interview?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first reason is that** first impressions are made very quickly."],["","**Then,** your posture can show that you are ready and interested."],["","**What is more,** a calm, clear voice makes your answers easier to follow."],["","**For instance,** my cousin in Lagos practised sitting up straight and speaking more slowly before her interview."],["","**Finally,** small habits, like playing with a pen, can distract from what you say."],["","**In short,** your body should support your words, not compete with them."]],keys:["the first reason","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"Why can body language be misunderstood?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that body language is easy to misread, because one signal can mean many things."],["","To begin with, the situation matters: folded arms in a cold room mean something different from folded arms in an argument."],["","On top of that, families and cultures teach different habits, for example about eye contact and distance."],["","A case in point is a classmate in Hamburg who hardly spoke in seminars: I thought he was bored, but he was waiting for a proper pause."],["","Admittedly, some feelings, such as real delight, are fairly easy to recognise."],["","On balance, it is wiser to treat body language as a clue and to ask when in doubt."]],extra:"I once watched a silent film in an old cinema near the harbour.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"How can you show that you are listening without saying a word?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","good listeners speak with their whole body, not with words."],["First of all,","turn your body towards the speaker and put your phone away."],["Besides,","a small nod now and then shows that you are following."],["For example,","when my grandmother in Kuala Lumpur tells a story, I lean forward a little and keep my hands still."],["However,","too much staring or nodding can feel strange, so keep it natural."],["Ultimately,","people feel heard when your body is as attentive as your ears."]],distractors:["Similarly,","Otherwise,"],keys:["whole body","turn towards","a small nod","keep it natural"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"Can body language tell us what people really think?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["a clue, not a proof","folded arms: cold or angry?","Recife bus station: a shrug","situation, family, culture","several signals together","if in doubt, ask"],model:"In my view, body language can tell us a lot about how people feel, but it is a clue, not a proof. Take folded arms: they might mean anger, or they might simply mean that the room is cold. At the bus station in Recife, I once watched a man shrug his shoulders at the ticket window, and I honestly couldn’t tell whether he was confused or perfectly relaxed. The reason is that the meaning of a signal depends on the situation, and on the family and culture we grew up in. So the best readers look at several signals together: the face, the hands, the distance and the voice. And if they are still in doubt, they do the simplest thing of all: they ask."}],np={title:"Exam Part 2 practice: a public-speaking workshop",situation:"The English club can run only one workshop this term to help members speak in public: using your hands, using your voice, or eye contact with the audience. Leo and Nur are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"nur",lines:[["A","The club can only run one workshop this term. Shall we go through the three options?"],["B","Sure. A workshop on using your hands sounds fun, doesn’t it?"],["A","It does, although nervous speakers often wave their hands too much already."],["B","Fair point. What about the voice? Many members speak too quietly."],["A","True, and a flat voice can make even a good talk sound boring."],["B","And eye contact? Some members read from their notes the whole time."],["A","That’s a strong argument, but nobody looks up if they’re worried nobody can hear them."],["B","So shall we go for the voice workshop, and add eye contact next term?"],["A","Agreed. That way, everyone is heard first, and seen next."]],phrases:{Start:["The club can only run one …","Shall we go through …?"],Clarify:["…, doesn’t it?","It does, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: a café wants to train its new staff in **one** thing: greeting customers with a smile, listening without interrupting, or staying calm with angry customers. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["I’m firmly of the view that …","body language","make eye contact","That’s down to the fact that …","personal space","jump to conclusions","Think about …","tone of voice","send mixed signals"],B:["facial expressions","read the room","I see where you’re coming from, but …","keep your distance","fold your arms","Let me get this straight: …","body language","That’s down to the fact that …","a blank expression"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["I’m firmly of the view that …","body language","make eye contact","That’s down to the fact that …","personal space","jump to conclusions","Think about …","tone of voice","send mixed signals","facial expressions","read the room","I see where you’re coming from, but …","keep your distance","fold your arms","Let me get this straight: …","a blank expression"],questions:["Can you trust your first impression of someone?","Is it easier to understand people face to face or on a video call? Why?","How do people in Uzbekistan greet each other without words? Is it the same in another country you know?","Which is more honest: words or body language?","What can a teacher learn from a class’s body language, and what can’t they learn?","Is a smile the same everywhere?"]},sp=[{type:"stress",title:"Stress Spot: words about nonverbal communication",intro:"Tap the stressed syllable. Rule: before -tion and -sion, the syllable is strong (exPRESsion, communiCAtion, interpreTAtion). GESture and POSture are strong at the start; nonVERbal, inTERpret and eMOtional are strong on the second syllable. Then listen and say the word.",follow:"Now use two of these words in one sentence about a film you have seen.",items:[{w:"gesture",syl:["ges","ture"],s:0},{w:"posture",syl:["pos","ture"],s:0},{w:"expression",syl:["ex","pres","sion"],s:1},{w:"nonverbal",syl:["non","ver","bal"],s:1},{w:"interpret",syl:["in","ter","pret"],s:1},{w:"interpretation",syl:["in","ter","pre","ta","tion"],s:3},{w:"communication",syl:["com","mu","ni","ca","tion"],s:3},{w:"emotional",syl:["e","mo","tion","al"],s:1}]},{type:"pairs",title:"Sound Pairs: /ɔː/ or /ʌ/? (caught or cut?)",intro:"Press Play and choose the word you hear. /ɔː/ (caught, bought, dawn, torn, born) is long: round your lips and push them forward a little. /ʌ/ (cut, but, done, ton, bun) is short: open your mouth, relax your lips and stop quickly. In British English, the r in torn and born is silent. Partner version: one student says a word, the partner points to it.",pairs:[["caught","cut"],["bought","but"],["dawn","done"],["torn","ton"],["born","bun"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Give a second possible reading of the last signal you described.","Check what the last speaker meant before you answer: Let me get this straight: …"],ap={title:"Step Up Speaking Club podcast: The Sound Off Experiment",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Amara and Mateo each watched people for half an hour with no sound at all. What did they learn about body language?",tip:["Listen for who","Before you listen, read the statements and guess who probably said each one. Remember: an idea belongs to both speakers only if both of them say it, often in different words."],A:"amara",B:"mateo",lines:[["A","Welcome to the Club podcast. This week, Mateo and I tried an experiment: we each watched people for half an hour with no sound, just their **body language**. Mateo, you went to the bus station in Recife?"],["B","I did, and honestly, I was amazed how much I could follow. [[0]] we read each other all day without even noticing. [[1]] we never stop practising: every queue and every family dinner is a lesson. [[2]] a couple I saw saying goodbye: I couldn’t hear a word, but their **facial expressions** told the whole story."],["A","Mine went the other way: a film scene in a language I don’t speak, with the sound off. One woman kept **folding her arms** while her colleague talked, so I decided she was angry. Then she put on her coat. The office was just cold!"],["B","[[3]] you got the whole scene wrong because of one gesture?"],["A","Not only one. She didn’t **make eye contact** with him either, and to me that meant she didn’t trust him. But in my grandmother’s house in Lagos, we were taught not to stare at an older person who was speaking to us: looking down was a sign of respect. So now I try not to **jump to conclusions**."],["B","[[4]] some signals are hard to misread. **Tone of voice**, for one: when my sister says “Fine” in that flat little voice, believe me, nothing is fine."],["A","Ha! But you know your sister. With a stranger, you’re only guessing."],["B","Fair enough. At the station, a man **shrugged his shoulders** at the ticket window with **a blank expression**: confused, or just relaxed? I couldn’t tell. And even in the crowd, people protected their **personal space**: if someone came too close, the other stepped back to **keep their distance**."],["A","That’s what I mean. When the face says one thing and the hands say another, people **send mixed signals**. One gesture is a clue, not a proof."],["B","Agreed. Never judge someone from a single signal. Watch the face, the hands and the voice, **read the room**, and if you’re still not sure, just ask."]],gaps:[[1,"I’m firmly of the view that"],[2,"That’s down to the fact that"],[3,"Think about"],[4,"Let me get this straight:"],[5,"I see where you’re coming from, but"]],questions:[{q:"Who was surprised by how much they understood?",o:["Amara","Mateo","both of them"],a:1,why:"Mateo: “honestly, I was amazed how much I could follow.” Amara says her experiment “went the other way”."},{q:"Who mentions a relative to show that meanings vary?",o:["Amara","Mateo","both of them"],a:0,why:"Amara: “in my grandmother’s house in Lagos … looking down was a sign of respect.” Mateo mentions his sister to show that some signals are easy to read in people you know."},{q:"Who could not decide what one person was feeling?",o:["Amara","Mateo","both of them"],a:1,why:"Mateo, about the man at the ticket window: “confused, or just relaxed? I couldn’t tell.” Amara did decide, but wrongly."},{q:"Who thinks one signal alone is never enough?",o:["Amara","Mateo","both of them"],a:2,why:"Amara: “One gesture is a clue, not a proof.” Mateo: “Agreed. Never judge someone from a single signal.” The same idea in different words."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Mateo use to check that he has understood Amara, and which one to disagree politely?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[3]],["Checking meaning",[4]],["Disagreeing politely",[5]]]},use:{q:"How much can you tell about a person from their body language alone?",by:"leo",model:"I’m firmly of the view that we can tell quite a lot from body language, but never everything. That’s down to the fact that the same signal can mean several things. Think about my first week at the Club: Nur frowned the whole time I was speaking, and I was sure she disagreed with me. Later she laughed and said, “Let me get this straight: you thought I was angry?” She was just concentrating hard on my English. Some people say first impressions are always right. I see where you’re coming from, but I’d rather notice several signals, and then simply ask.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Uf,DIALOGUE:np,DRILLS:Gf,LESSON:Qf,LEVELS:tp,LISTEN:ap,MAIN:Kf,PRON:sp,QUESTIONS:ep,ROUNDS:Jf,TWISTS:$f,UNIT:Yf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),lp={openverse:"e2b49788-c79b-4d17-be4f-7b3307803f9b",title:"Business People",creator:"Direct Media",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/DUXISHKTT3.jpg",page:"https://stocksnap.io/photo/
