rnship asked him about it.","Some students say that fear of a permanent fail makes people avoid hard courses. Others say that a record must tell the whole truth. Today the student **Second Chance Court** decides. The motion: **This court would let Ardan University students remove one failed first attempt from their record after a successful retake.**"],rule:"Rule of respect: we argue about rules and evidence, never about people. Failing an exam says nothing about a person’s worth. Nobody is asked about their own marks or their own failures."}},Zf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A Club podcast interview (exam Part 4): Mateo asks Amara about her aunt’s soap business in Lagos, “an overnight success” that took ten years. Listen for the speaker’s corrections, notice how Mateo checks meaning and how Amara gives reasons, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about people in general, not about their own families’ money.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about success (sucCESS, amBItious), and /ʌ/ or /ɒ/. (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 3: put six parts of an answer about learning from failure in order and bin the sentence that does not belong, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 3; fast pairs try Level 4 or 5.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about success, failure and trying again. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the strongest argument they heard (use the wheel)."]},{id:"game",icon:"⚖️",name:"The Second Chance Court",min:18,lv:"c1",group:"3 courts of 5",kind:"five",roles:["Proposition Counsel","Proposition Witness (Timur)","Opposition Counsel","Opposition Witness (Prof. Novak)","Judge"],desc:"Court & Debate with witnesses: a student who failed and then excelled and the head of examinations give evidence, both sides answer each other’s claims, and the Judge decides whether a failed first attempt may be removed from a student’s record. (Book: section 6 · G8)",howto:["15 students = 3 courts of five, all at the same time. Each court plays on its own phone or laptop (the game works offline). Every student speaks in at least two rounds.","Each student turns over one role card: a Counsel and a Witness for each side, and one Judge. The witnesses speak in role as Timur, a student, or Professor Novak, the head of examinations; the Judge keeps time and scores.","Timing: roles 1 min · Prepare 3 min · Openings 3 min · Witnesses 4 min · Claims 2 min · Closing and verdict 5 min.","Only one projector? Run one court at the front with three judges from the class, who agree on each score together. Everybody else notes the best question and the best answer of each side. Six in a court? Add a second Judge."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about how a university should celebrate its students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Kf={listen:{ref:"Book: Lesson 41, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the interview in order: the “overnight success”, the second shop, the first failure and how Amara’s aunt measures success.","Press **Play the podcast**. Listen for corrections: _Not really._, _They don’t know that …_ The answer is often in the correction. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: checking meaning, reason, opinion, example and what matters most.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is A. The shop was on a quiet street.","gives an answer"],["B","Was that the second shop, or the first one?","challenges politely"],["A","“Her second one fell short of her hopes too, mainly because her prices were too high.”","checks the text again"],["B","So the quiet street was the first shop. It’s C.","paraphrases"]],checks:[["Where is the answer when a speaker says “Not really”?","in the correction that follows: “They don’t know that it took her ten years and two closed shops.” The interviewer’s words (“an overnight success”) are not the answer."],["Which phrase does Mateo use to check what Amara means?","Hang on, do you mean that …?"]]},pron:{ref:"Book: Lesson 41, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: *success* is strong at the **end**: *sucCESS*, *sucCESSful*. Before **-ious** and **-ance**, the syllable is strong (*amBItious*, *perseVERance*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ʌ/ (*luck*, *cup*) or /ɒ/ (*lock*, *cop*)?","/ʌ/ is short and **central**: the mouth is relaxed and half open, as in *success*. /ɒ/ is short and **rounded**: open your mouth and round your lips a little, as in *stop*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *success*. Which syllable is strong?",""],["A","The first one: *SUC*-cess?","a guess"],["T","Listen again: suc-*CESS*.","the teacher gives a clue"],["A","Oh, the second: suc-*CESS*. And *successful* too: suc-*CESS*-ful.","corrects the stress"],["T","Good. Now *ambitious*.",""],["B","am-*BI*-tious: the syllable before *-ious*.","uses the rule"],["T","Yes! Now listen: *luck*. First or second: *luck* or *lock*?",""],["B","First: *luck*. My lips stay relaxed; for *lock* they get rounder.","listens for the lips"]],checks:[["Where is the stress in *achievement*?","on CHIEVE: a-CHIEVE-ment."],["Where is the stress in *perseverance*?","on VER: per-se-VER-ance (the syllable before -ance)."],["Which word has /ʌ/: *cut* or *cot*?","*cut*: the mouth is relaxed, the lips are not rounded."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 3**: six parts, **no labels**, and **one extra sentence** that does not belong.","Find the extra sentence first and send it to the bin with **🗑**. It may be true, but it does not answer the question.","Find the **first part**: it gives a clear position (*I’d go as far as to say …*).","Follow the linking words: *For a start* → *Not only that, but* → *Take … for example* → *Mind you* (the other side) → *All things considered* (the close).","Press **✔ Check**. Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 4** (choose the linking words) or **Level 5** (key words only)."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, yes, I think failure teaches more … because you think about it … my first app, it, um, didn’t work … and I learnt a lot. But success also teaches. So, um, both, but failure more.","Attempt 1 · 90 s · many pauses"],["leo","I’d go as far as to say that we learn more from failure. For a start, failure makes us ask why. Not only that, but we remember it longer. Take my first coding project in Hamburg, for example: it crashed, and I learnt more from that than from any good mark. Mind you, too much failure can kill motivation. All things considered, failure teaches, if we look at it.","Attempt 2 · 60 s · linking words"],["leo","I’d go as far as to say that failure is the better teacher, though not the kinder one. It forces us to ask why, and we remember the answer: my first coding project in Hamburg crashed in front of the whole class, and I learnt more that afternoon than from any top mark. Mind you, failure without support just teaches people to stop trying. All things considered, failure teaches only those who are helped to look at it.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 3?","one extra sentence that does not belong: find it and bin it."],["How many times do you say your own answer?","three times, to three different partners."],["Which linking phrase introduces the other side?","*Mind you, …*"]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: What does success mean to you?",lines:[["nur","Well, for me, success isn’t only about prizes. **Hard work pays off**, of course, but **success means** being proud of how you got there. **It’s not about winning**; it’s about getting a little better each time. And you have to **learn the hard way** sometimes. My cousin **didn’t give up** after two failed interviews, and in the end **she achieved her goal**.","speaker · 1 minute"],["aziza","I heard six phrases: *hard work pays off*, *success means*, *it’s not about winning*, *learn the hard way*, *didn’t give up* and *achieved her goal*. That’s a full row: **Bingo!**","listener reports"],["nur","Six points plus three for the Bingo: nine points!","count the points"],["aziza","Next time, try *It was a blessing in disguise*. It’s on my card, and it fits your cousin’s story.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you have to talk about your own marks or failures?","no: talk about people in general, the characters or small, safe examples."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Shall we look at the three ideas?*).","Click the lines in order. Each line answers the line before. Leo and Amara take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a failed cake",lines:[["A","The cake for Malika’s party didn’t rise. It’s a disaster!","opens the topic"],["B","Hmm. Shall we try again, or buy one?","two options"],["A","We don’t have time to bake another. But we could cut it into squares.","an idea"],["B","Good idea: little cake squares with fruit on top. Nobody will know!","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G8 · section 6",steps:["Make courts of five. Each student turns over one **role card**: a **Counsel** and a **Witness** for the Proposition (remove the first fail), the same for the Opposition (keep the full record), and the **Judge**.","**Round 1 · Prepare (3 min):** open the six **exhibits**. Each side picks its two strongest. Counsel and witness agree on two main arguments and on what the witness will say.","**Round 2 · Openings:** each counsel speaks for **60 seconds**. The Judge asks each side one short question.","**Round 3 · Witnesses:** each counsel asks their own witness two open questions (use the **question cards**). Then the other counsel asks **one** short cross-question. Witnesses answer **in role**: *“I …”*.","**Round 4 · Claims:** each witness opens a **claim card** from the *other* side and answers it in role (**45 seconds**): concede what is true, then show what it misses.","**Round 5 · Closing and verdict:** the counsel sum up. The Judge scores both sides 0–5 on five criteria, presses **Announce the verdict**, gives two reasons and proposes one rule for Ardan University."],exTitle:"Sample game: Rounds 2–5 in Court A",lines:[["","Judge Aziza · Proposition: Nur (counsel) and Leo (as Timur, the student) · Opposition: Mateo (counsel) and Amara (as Professor Novak, head of examinations)",""],["nur","**Our case rests on one simple question:** what is a record for? If it is meant to show what a student **can do**, then Timur’s record is wrong: it shows a fail he has **long since put right**.","Proposition Counsel: opening statement"],["mateo","**Nobody in this court thinks Timur should be punished.** Our point is narrower: a record must tell the **whole** story. Hide the first attempt, and every pass on every record becomes **a little less believable**.","Opposition Counsel: opening statement"],["","… Round 3 · Witnesses …",""],["nur","Timur, what happened when the internship saw your record?","an open question to her own witness"],["leo","The interviewer spent half the interview on one line from my first year. I had a top mark in the same subject a year later, and I tutor it now, but we hardly talked about that.","Timur answers in role"],["mateo","One question, Timur: did you get the internship in the end?","a short cross-question"],["leo","Yes, I did. But I had to work twice as hard to explain one line.","a short, honest answer"],["","… Round 4 · Claims …",""],["amara","(as Professor Novak, reads a claim card) *“A record should show what you can do, not what you once couldn’t.”* **I’d concede that the final mark matters most. What this overlooks is** that employers also want to know how a student got there. A retake after a fail is part of that story, and **it can be a good part**.","Professor Novak answers a claim from the other side"],["","… Round 5 · Verdict …",""],["aziza","**Having weighed both sides, the court finds for** the Proposition, by twenty points to eighteen. **The decisive moment was** Timur’s answer about the interview. **Even so,** Professor Novak was right that records must be honest. So the court proposes a rule: one first-year fail may be removed after a strong retake, and the record says “passed after a retake” without the old mark.","the Judge explains the verdict and proposes a rule"]],checks:[["What is the difference between an open question and a cross-question?","an open question lets your own witness tell their story (What …? How …? Why …?); a cross-question to the other witness is short and needs a short answer."],["Who answers the claim cards in Round 4?","the witnesses, in role: each opens a card marked with the other side’s name."],["What does the Judge add after the verdict?","two reasons for the decision and one rule for Ardan University."]]},drills:{ref:"Book: Lesson 41 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"People called her ___, but she had been practising for ten years.",o:["an overnight success","a learning curve","a blessing in disguise"],a:0},{q:"If you want to ___, break them into small steps.",o:["achieve your goals","fall flat","give up on"],a:0},{q:"His result ___ what he had hoped for, but it was still good.",o:["fell short of","rose to","paid off"],a:0},{q:"Nobody laughed at my joke: it completely ___.",o:["fell flat","paid off","fell short"],a:0},{q:"I didn’t back up my essay, and I ___ when my laptop crashed.",o:["learnt the hard way","rose to the challenge","achieved my goal"],a:0},{q:"Missing that train was ___: I met my future business partner at the station.",o:["a blessing in disguise","an overnight success","a learning curve"],a:0},{q:"Don’t ___ your dream just because the first try didn’t work.",o:["give up on","rise to","fall short"],a:0},{q:"The team was tired, but they ___ and won the final.",o:["rose to the challenge","fell flat","learnt the hard way"],a:0},{q:"She finished the marathon ___: she had broken her ankle the year before.",o:["against all odds","as a learning curve","on the hard way"],a:0},{q:"He practised every day for months, and his ___.",o:["hard work paid off","learning curve fell flat","goal gave up"],a:0},{q:"The first month in a new job is always ___.",o:["a steep learning curve","a blessing in disguise","an overnight success"],a:0},{q:"How should we ___: by money, by happiness or by what we give back?",o:["measure success","fall short","rise to the challenge"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"He failed the exam. It was his first fail. → **past perfect: He had never …**",a:"He had never failed an exam before. (past perfect for an earlier past)"},{p:"She tried again. She passed. → **After trying …**",a:"After trying again, she passed."},{p:"I gave up too early. → **I shouldn’t have …**",a:"I shouldn’t have given up so early."},{p:"I shouldn’t have given up. → **If I hadn’t …, I might …**",a:"If I hadn’t given up, I might have succeeded."},{p:"She succeeded. → **She succeeded in …(finish)**",a:"She succeeded in finishing the course. (succeed in + -ing)"},{p:"She succeeded in finishing the course. → **She managed …**",a:"She managed to finish the course. (manage to + verb)"},{p:"The project failed. → **The project was a …**",a:"The project was a failure."},{p:"Failing taught me a lot. → **I learnt a lot from …**",a:"I learnt a lot from failing."},{p:"Success is important. Effort is more important. → **What matters more than … is …**",a:"What matters more than success is effort."},{p:"He works hard. He will succeed. → **As long as …**",a:"As long as he works hard, he’ll succeed."},{p:"It was difficult. They won. → **Difficult as it was, …**",a:"Difficult as it was, they won. (inversion for emphasis)"},{p:"You will fail sometimes. → **It’s inevitable that …**",a:"It’s inevitable that you will fail sometimes."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"It didn’t work.",a:"It fell flat, but it taught us a great deal."},{p:"I learnt from it.",a:"It was a steep learning curve, but a valuable one."},{p:"Don’t stop trying.",a:"Whatever you do, don’t give up on it."},{p:"It was bad, but good in the end.",a:"Looking back, it was a blessing in disguise."},{p:"She did it, although it was very hard.",a:"She succeeded against all odds."},{p:"The record should be fair.",a:"A record ought to reflect what a student can do."},{p:"I partly agree.",a:"I’d concede that …; what it overlooks is …"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ He failed from the exam.",o:["He failed the exam.","He failed at the exam from.","He was failed from the exam."],a:0,why:"fail an exam (no preposition); fail at something = not succeed in an activity"},{q:"✗ She succeeded to finish the project.",o:["She succeeded in finishing the project.","She succeeded finish the project.","She succeeded for finishing the project."],a:0,why:"succeed in + -ing (or: manage to + verb)"},{q:"✗ He is very success.",o:["He is very successful.","He is very succeed.","He has very success."],a:0,why:"success (noun), succeed (verb), successful (adjective)"},{q:"✗ I passed the exam, but I failed. (meaning: I took it but didn’t get a good result)",o:["I took the exam, but I failed it.","I passed the exam, and I failed it.","I gave the exam, but I failed."],a:0,why:"take / sit an exam; pass = succeed (not “give an exam”)"},{q:"✗ I made a lot of mistakes and I learnt many from them.",o:["I made a lot of mistakes, and I learnt a lot from them.","I did a lot of mistakes and learnt many from them.","I made many mistake and learnt a lot from them."],a:0,why:"make a mistake; learn a lot (not learn many)"},{q:"✗ If I would have studied, I would have passed.",o:["If I had studied, I would have passed.","If I studied, I would have passed.","If I would study, I would pass."],a:0,why:"third conditional: if + had + past participle"},{q:"✗ He achieved to win the prize.",o:["He managed to win the prize.","He achieved winning to the prize.","He achieved to the prize."],a:0,why:"achieve + noun (achieve a goal); manage to + verb"},{q:"✗ Failure is not the opposite of the success.",o:["Failure is not the opposite of success.","The failure is not opposite of success.","Failure is not opposite of the success."],a:0,why:"no article with abstract nouns used in general: success, failure"}]},{title:"Stress: words about success",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"getting what you wanted or worked for",o:["sucCESS","SUCcess"],a:0},{q:"having achieved what you wanted",o:["sucCESSful","SUCcessful"],a:0},{q:"something good that you have done with effort",o:["aCHIEVEment","Achievement"],a:0},{q:"a strong wish to be successful",o:["amBItion","AMbition"],a:0},{q:"having a strong wish to succeed",o:["amBItious","ambiTIOUS"],a:0,why:"Before -ious, the syllable is strong."},{q:"continuing to try even when it is difficult",o:["perseVERance","perSEverance"],a:0,why:"Before -ance, the syllable is strong."},{q:"a person who wins a competition",o:["CHAMpion","chamPIon"],a:0}]}],Uf={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to your court and keep it for the whole game. Each side has a Counsel, who argues the case, and a Witness, who speaks in role as Timur, a student, or Professor Novak, the head of examinations. The Judge chairs the court.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",evidenceWord:"Exhibit",evidenceTitle:"Exhibits: the Ardan case file",evidenceHint:"Open all six exhibits. Each one is marked with the side it helps more. Pick your side’s two strongest, and decide what you will say if the other side uses theirs.",evidenceHelp:{b2:["This exhibit shows …","It supports our case, because …","They will probably use Exhibit … to say …"],c1:["What this exhibit really shows is …","Taken together, Exhibits … and … suggest …","This exhibit proves less than it seems to, because …"]},questionWord:"Question",questionTitle:"Question cards for the counsel",questionHint:"Counsel: open a card for your witness, read the question aloud and let the witness answer in role. Cards marked “cross-question” are for the OTHER side’s witness. You may also ask your own questions.",questionHelp:{b2:["Can you tell the court how …?","Why do you think …?","Is it true that …?"],c1:["Could you explain to the court how …?","In your experience as …, why does …?","Would you accept that …?"]},rebuttalWord:"Claim",rebuttalTitle:"Claim cards: what the other side says",rebuttalHint:"Witnesses: open one card marked with the OTHER side’s name and answer it in role in 45 seconds. Concede what is true, then show what the claim misses. Your counsel may add one sentence.",rebuttalHelp:{b2:["I accept part of that, but …","This claim ignores …","In my experience, …"],c1:["I’d concede that …; what it overlooks is …","The flaw in this claim is …","That’s precisely why …"]},teamWord:"Court",teamIcon:"",teamKind:"five",teams:3},Jf={motionWord:"The motion before the court",motion:"This court would let Ardan University students remove one failed first attempt from their record after a successful retake.",sides:[{name:"Proposition",short:"Remove the first fail",stance:"A record should show what a student can do. One first attempt that has been put right should not follow a student for ever, especially when fear of it stops people from choosing hard courses."},{name:"Opposition",short:"Keep the full record",stance:"A record must tell the whole story. Hiding a fail makes every result less trustworthy and is unfair to students who passed the first time. Better support and a fair note on the record are the answer."}],judges:1,criteria:["Arguments","Evidence","Questions and answers","Rebuttal","Language"],turnsTitle:"Order of speakers",verdictTitle:"The Judge’s score sheet",verdictHint:"The Judge scores both sides 0–5 for each criterion, then presses **Announce the verdict**, gives two reasons and proposes **one rule** for Ardan University. Score the arguments and answers, never the speakers as people.",winWord:"wins the case"},_f=[{name:"Round 1 · Prepare",lv:"b2p",bloom:"Understand / Analyse",by:"aziza",seconds:180,tool:"evidence",q:"Open the exhibits. Counsel and witness pick your side’s **two strongest exhibits** and agree on **two main arguments**. Witnesses: plan what you will tell the court. The Judge prepares one question for each side.",help:{b2:["main argument","Exhibit … helps us","they will say … → we answer …"],c1:["our case rests on …","the exhibit that does most for us","be ready for the objection that …"]},model:"Our case rests on one idea: a record should show what a student can do now. Exhibit B is the one that does most for us: Timur failed statistics, then got one of the best marks in his group and now tutors it, yet the old fail is the first thing an employer notices. Exhibit A helps too, because students say they avoid hard courses out of fear. They will probably use Exhibit D to say that students will stop preparing for the first attempt, so Timur should explain how hard the retake really was."},{name:"Round 2 · Opening statements",lv:"b2p",bloom:"Apply / Analyse",by:"nur",seconds:0,tool:"turns",turns:[{side:0,who:"Proposition Counsel",task:"Say what the motion means in your own words and give your side’s two main arguments.",seconds:60},{side:1,who:"Opposition Counsel",task:"Give your side’s two main arguments. You may answer one point from the Proposition.",seconds:60},{side:null,who:"Judge",task:"Ask each counsel one short question. Each answers in one or two sentences.",seconds:60}],q:"Opening statements: each counsel presents the case in **60 seconds**. Say where your side stands, then give two arguments.",help:{b2:["our side believes … for two reasons","firstly · secondly","we will show that …"],c1:["nobody here thinks …; our point is narrower","at the heart of this case is …","we will show the court that …"]},model:"Nobody in this court thinks Timur should be punished for a fail he has put right. Our point is narrower: a record must tell the whole story. Firstly, if first attempts can disappear, every pass becomes a little less believable, and that hurts every student, including Timur. Secondly, it is unfair to the students who passed the first time, often by working through the night. We will show the court that the real problem is not the record but the way people read it, and that a fair note and better support fix that."},{name:"Round 3 · Witnesses",lv:"b2p",bloom:"Apply / Analyse",by:"mateo",seconds:0,tool:["questions","turns"],turns:[{side:0,who:"Proposition Counsel → Timur",task:"Ask your witness two open questions (a question card or your own). Timur answers in role.",seconds:75},{side:1,who:"Opposition Counsel → Timur",task:"Cross-question: ask Timur one short, sharp question. He answers in one or two sentences.",seconds:30},{side:1,who:"Opposition Counsel → Prof. Novak",task:"Ask your witness two open questions (a question card or your own). Professor Novak answers in role.",seconds:75},{side:0,who:"Proposition Counsel → Prof. Novak",task:"Cross-question: ask Professor Novak one short, sharp question. She answers in one or two sentences.",seconds:30}],q:"Witnesses: each counsel asks their own witness **two open questions**; then the other counsel asks **one cross-question**. Witnesses answer **in role**, with “I …”.",help:{b2:["when it happened, I …","what I learnt was …","I’m not sure, but …"],c1:["what struck me at the time was …","to be fair to the other side, …","if I may add one thing, …"]},model:"What struck me at the time was how lonely failing felt. I had always been good at maths at school, so I didn’t take statistics seriously, and I was working evenings in a café. When I saw the fail, I was ashamed to tell anyone. The next year I joined the study group, practised every week and got one of the best marks in the group. Now I tutor first-years who are as lost as I was. To be fair to the university, the retake was well organised. It’s only the old line on my record that still talks about the person I was."},{name:"Round 4 · Claims",lv:"c1",bloom:"Evaluate",by:"amara",seconds:0,tool:["rebuttals","turns"],turns:[{side:1,who:"Prof. Novak (Opposition Witness)",task:"Open one claim card marked “Remove the first fail” and answer it in role. Your counsel may add one sentence.",seconds:45},{side:0,who:"Timur (Proposition Witness)",task:"Open one claim card marked “Keep the full record” and answer it in role. Your counsel may add one sentence.",seconds:45}],q:"Claims: each witness opens a claim card from the **other side** and answers it in role in **45 seconds**. Concede what is true, then show what the claim misses.",help:{b2:["I accept part of that, but …","this claim ignores …","in my experience, …"],c1:["I’d concede that …; what it overlooks is …","the flaw in this claim is …","that’s precisely why …"]},model:"I’d concede that fear of a permanent fail can stop students from choosing hard courses, and that worries me as much as anyone. What this claim overlooks is that hiding the fail treats the symptom, not the cause. The cause is that people read a fail as the end of the story. So I would rather change how the record tells the story: show the retake clearly, add a short note, and teach employers to look at the whole line, not just the first word."},{name:"Round 5 · Closing and verdict",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:0,tool:["turns","verdict"],turns:[{side:0,who:"Proposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:1,who:"Opposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:null,who:"Judge",task:"Score both sides, announce the verdict and give two reasons. Then propose one rule for Ardan University.",seconds:60}],q:"Closing and verdict: the counsel sum up in **45 seconds**. Then the Judge scores, announces the verdict, explains it and proposes one rule for Ardan University.",help:{b2:["to sum up, we have shown …","the court has decided …","from now on, the university should …"],c1:["at its heart, this case is about …","having weighed both sides, the court finds for …","the decisive moment was …"]},model:"Having weighed both sides, the court finds for the Opposition, by nineteen points to eighteen. The decisive moment was Professor Novak’s answer that a record which hides things makes every pass less believable, including Timur’s top mark. That said, Timur showed that one old line can overshadow a much better story. So the court proposes a rule: the old mark stays, but the record shows the retake first and adds the words “passed with distinction after a retake”, and the careers office explains to employers how to read it."}],$f=[{e:"⚖️",n:"The Judge",r:"Chairs the court and gives the verdict.",lines:[["Your job","Call each speaker and start the timer, ask each counsel one question, score both sides, explain the verdict and propose one rule for Ardan University."],["Useful phrase","The court calls … · Having weighed both sides, the court finds for …"]],x:"Listen for the best reasons, not the loudest voice. A witness who concedes a weak point honestly can be very convincing."},{e:"📣",n:"Proposition Counsel",r:"Lead speaker · remove the first fail",lines:[["Your side","After a successful retake, a student may remove one failed first attempt from their record."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Our case rests on one simple question: what is a record for?"]],x:"Expect the argument that students will stop preparing for first attempts. You can answer it: the rule is for one fail only, and a retake is harder, not easier."},{e:"📘",n:"Proposition Witness: Timur",r:"A third-year student at Ardan University · remove the first fail",lines:[["Who you are","Timur Askarov, a third-year economics student at Ardan University, the fictional university in this case."],["What you can tell the court","In your first year you failed statistics: you were working evenings in a café and didn’t take the course seriously. The next year you joined a study group, practised every week and passed with one of the best marks in your group. Now you tutor first-year students in statistics. At a summer internship interview, the interviewer spent a long time asking about the old fail. You got the internship, but you felt you had to explain one line again and again."],["Your job","Answer questions in role (Round 3) and answer one claim from the Opposition (Round 4)."]],x:"Speak as Timur: “I …”. Be honest about your mistake: you are not blaming anyone. Be fair to the university: the retake was well organised."},{e:"📣",n:"Opposition Counsel",r:"Lead speaker · keep the full record",lines:[["Your side","A record must tell the whole story. Instead of hiding fails, the university should show retakes clearly, add a fair note and give students more support."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Nobody here thinks Timur should be punished; our point is narrower: …"]],x:"A good cross-question is short and needs a short answer: “Did you get the internship in the end?”"},{e:"📋",n:"Opposition Witness: Prof. Novak",r:"Head of examinations at Ardan University · keep the full record",lines:[["Who you are","Professor Irena Novak, the head of examinations at Ardan University. You are responsible for exam rules and student records."],["What you can tell the court","You care about students like Timur, and you support retakes. But employers and other universities trust Ardan’s records because they are complete. If some fails disappear, readers may start to doubt every result. You have heard students say that, with a free second chance, some people might not prepare for the first attempt. You would prefer to show the retake first, add a short note, and give students more support before the first exam."],["Your job","Answer questions in role (Round 3) and answer one claim from the Proposition (Round 4)."]],x:"You are not against second chances: you are against hiding information. Concede that a fail can overshadow a good story, then explain what works better."}],ep=[],tp=[{t:"To Timur: What happened in your first year, and what changed afterwards?",q:"Proposition Counsel: ask this question. Timur: answer in role in about 30 seconds.",by:"leo",m:"In my first year, I was working evenings in a café, and I thought statistics would be easy because I was good at maths at school. I was wrong, and I failed. The next year, I joined a study group and practised every single week. I passed with one of the best marks in my group, and now I tutor first-years who are as lost as I was."},{t:"To Timur: How did the old fail affect you later?",q:"Proposition Counsel: ask this question. Timur: answer in role in about 30 seconds.",by:"leo",m:"At my internship interview, the interviewer spent a long time on that one line. I wanted to talk about my tutoring and my top mark, but we kept coming back to my first year. I got the internship in the end, but I left feeling that my record still described the person I was two years ago, not the person I am now."},{t:"Cross-question to Timur: Did you get the internship in the end?",q:"Opposition Counsel: ask this question. Timur: answer honestly in one or two sentences.",by:"leo",m:"Yes, I did. But I had to work twice as hard to explain one line."},{t:"To Prof. Novak: Why does a complete record matter so much?",q:"Opposition Counsel: ask this question. Professor Novak: answer in role in about 30 seconds.",by:"amara",m:"Because a record is a promise. When an employer or another university reads an Ardan record, they trust that it shows everything. If some fails can disappear, they can no longer be sure what any result means. Ironically, that would make Timur’s top mark less convincing, because nobody would know what was hidden around it."},{t:"To Prof. Novak: What would you do instead of removing fails?",q:"Opposition Counsel: ask this question. Professor Novak: answer in role in about 30 seconds.",by:"amara",m:"Three things. First, show the retake first on the record, with the better mark in bold. Second, add a short note, such as “passed with distinction after a retake”. Third, give first-year students more support before the first exam: study groups and practice tests. That way, the record stays honest, and it tells the whole story, including the good ending."},{t:"Cross-question to Prof. Novak: Would you accept that one old fail can overshadow a much better result?",q:"Proposition Counsel: ask this question. Professor Novak: answer honestly in one or two sentences.",by:"amara",m:"Yes, I would accept that. That is exactly why I want the record to show the retake first."}],np=[{side:0,t:"Notes from a student focus group at Ardan University: several students said they chose an “easier” course instead of advanced statistics or physics, because “one fail stays on your record for ever”.",q:"What does this exhibit show about fear of failure? Use it to support the Proposition.",by:"aziza",m:"This exhibit shows that the rule does more than record failure; it changes behaviour. Students who might enjoy a hard course choose a safe one instead. A university should want students to take on challenges. If one fail could be put right completely, more students would dare to try."},{side:0,t:"Timur’s record: first year, statistics: Fail. Second year, statistics retake: one of the top marks in the group. Third year: tutor in the statistics study group. The first line on the page is still the fail.",q:"How can the Proposition use this record to show what is wrong with the current rule?",by:"mateo",m:"This record tells a great story, but it tells it in the wrong order. The first thing anyone sees is the fail, and the best part, the tutoring, is at the bottom. A record is supposed to show what a student can do. Timur can clearly do statistics; the only thing he couldn’t do was pass it the first time."},{side:0,t:"A letter from the careers office: “Interviewers often ask about first-year fails, even when the student later did very well. Some students feel they must explain one line again and again.”",q:"How can the Proposition use this letter to show the real cost of a permanent fail?",by:"aziza",m:"This letter shows that the cost of a fail doesn’t end with the retake. It follows students into interviews, years later. The careers office sees it all the time. If a student has clearly put a fail right, it is fair to let them start the conversation with what they can do now."},{side:1,t:"A memo from the exams office: in discussions about the idea, some students said that with a free second chance, they might not prepare properly for the first attempt.",q:"What risk does this memo show? Use it to support the Opposition.",by:"nur",m:"This memo shows that rules change behaviour in both directions. If a first attempt can vanish, some students may treat it as a practice run. That wastes exam places, examiners’ time and, in the end, the students’ own time. A rule meant to reduce fear could reduce effort instead."},{side:1,t:"A letter from a final-year student: “I passed statistics the first time by studying every weekend. If others can erase their fails, our records will look exactly the same, and that doesn’t feel fair.”",q:"How can the Opposition use this letter to argue about fairness?",by:"amara",m:"This letter shows that fairness has two sides. A student who passed the first time, often with real sacrifice, would end up with exactly the same record as someone who failed. Showing both attempts doesn’t punish Timur; it simply keeps the record honest for everyone."},{side:1,t:"A proposal from the head of examinations: show the retake mark first and in bold, add the note “passed after a retake”, and offer study groups and practice tests before every first-year exam.",q:"How can the Opposition use this proposal to show a better solution than removing fails?",by:"nur",m:"This proposal shows that we don’t have to choose between honesty and kindness. The record keeps the full story, but it tells the good part first. And practice tests and study groups attack the real cause: students failing because nobody helped them prepare. Prevention is better than deletion."}],rp=[{side:0,t:"“A record should show what you can do, not what you once couldn’t.”",q:"You are Professor Novak (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"I’d concede that the final mark matters most. What this overlooks is that employers also want to know how a student got there. A retake after a fail is part of that story, and it can be a very good part: it shows determination. Hiding it throws away the best evidence of Timur’s character."},{side:0,t:"“Fear of a permanent fail stops students from choosing hard courses.”",q:"You are Professor Novak (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"That worries me as much as anyone, and I accept that the fear is real. However, the flaw in this claim is that it treats the symptom, not the cause. Students fear a fail because they think it is the end of the story. If our records showed retakes clearly and positively, that fear would shrink without hiding anything."},{side:0,t:"“One mistake in the first year shouldn’t follow someone for ever.”",q:"You are Professor Novak (Opposition). Answer this claim in role: concede what is true, then show what it misses.",by:"amara",m:"I agree that it shouldn’t define someone for ever. That’s precisely why I want the retake shown first and the note “passed with distinction after a retake”. What this claim overlooks is the difference between following someone and defining them. A record can mention a first-year fail without letting it be the headline."},{side:1,t:"“If fails can be removed, students won’t prepare properly for the first attempt.”",q:"You are Timur (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"leo",m:"I accept that a few students might think like that. But this claim ignores how hard a retake is. I had to wait a whole year, study with first-years and pay for extra books. Nobody would choose that as a plan. And the motion is about one fail only, so it can’t become a habit."},{side:1,t:"“It’s unfair to students who passed the first time.”",q:"You are Timur (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"leo",m:"I’d concede that they deserve credit for passing first time, and I respect that. What this overlooks is that their success isn’t made smaller by my second chance. We would both have a pass. The difference is that I also learnt, the hard way, how to study, and I now use that to help other students."},{side:1,t:"“A record that hides fails can’t be trusted.”",q:"You are Timur (Proposition). Answer this claim in role: concede what is true, then show what it misses.",by:"leo",m:"There is some truth in that: trust matters. However, records already leave out many things: they don’t show how many times you rewrote an essay or how many practice tests you failed. A rule that is public and clear, “one first attempt can be removed after a retake”, is not hiding anything. Everyone knows how to read it."}],sp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"What does success mean to you?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**For me,** success means doing something well that matters to me and to other people."],["Point","**The main reason is that** prizes and money feel good for a moment, but pride in good work lasts longer."],["Example","**For example,** my grandmother in Navoi says her greatest success is that every student she taught can still read and write beautifully."],["Close","**So, all in all,** success is not one moment of winning but a long story of doing something well."]],keys:["for me","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"mateo",q:"How should people react when they fail at something important?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**Honestly, I think the first thing to do is** give yourself a little time to feel disappointed."],["","**Then,** look honestly at what went wrong, without blaming yourself or other people."],["","**After that,** choose one thing you will do differently next time."],["","**For instance,** my cousin in Recife failed his first job interview, asked for feedback and practised his answers with a friend."],["","**Finally,** try again as soon as you can, before the fear grows too big."],["","**In short,** a failure only becomes a real failure if you stop there."]],keys:["the first thing to do is","then","after that","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"Do we learn more from failure than from success?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d go as far as to say that failure is the better teacher, though certainly not the kinder one."],["","For a start, failure forces us to ask why something went wrong, while success rarely makes us ask anything."],["","Not only that, but we tend to remember our failures far longer than our successes."],["","Take my first coding project in Hamburg, for example: it crashed in front of the whole class, and I learnt more that afternoon than from any top mark."],["","Mind you, failure without any support can simply teach people to stop trying."],["","All things considered, failure teaches best when someone helps us look at it."]],extra:"Hamburg has more bridges than many other cities in Europe.",keys:["for a start","not only that","mind you","all things considered"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"Should schools give prizes only to the best students?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my opinion,","schools should reward effort and progress as well as top results."],["On the one hand,","prizes for the best students show that excellence matters and can inspire others."],["On the other hand,","if only the top few are rewarded, many hard-working students feel invisible."],["For example,","my old school in Kuala Lumpur gave a “most improved” prize every year, and it often went to students who had never won anything before."],["That’s why","a mix of prizes for results, effort and progress seems fairest."],["In the end,","a school should celebrate every kind of success, not just one."]],distractors:["Similarly,","Meanwhile,"],keys:["effort and progress","inspire others","invisible","most improved"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"amara",q:"Who is a successful person you admire, and why?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["not famous","my aunt","started small","failed twice","helps others now"],model:"The successful person I admire most isn’t famous at all: it’s my aunt in Lagos. She started small, selling homemade soap at a local market. Her first two shops failed, and many people told her to give up. But each time, she learnt something, like choosing a better location and keeping prices simple. Today her business is doing well, and what I admire most is that she now helps other women in her neighbourhood start their own small businesses. To me, that’s real success: getting up after failing, and then helping others up too."}],op={title:"Exam Part 2 practice: celebrating students at the end of the year",situation:"A university in Bukhara wants to celebrate its students at the end of the year. It can organise only one event: an awards evening for the students with the best results, a “Learning from Failure” evening where graduates talk about their mistakes, or a “most improved” prize for each faculty. Leo and Amara are discussing the ideas. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"amara",lines:[["A","Shall we look at the three ideas? The awards evening is the traditional choice."],["B","It is, and top students deserve recognition, don’t they?"],["A","Absolutely. But only a few people would ever win anything."],["B","True. The “Learning from Failure” evening sounds unusual, but really useful."],["A","I like it too, although some graduates might not want to talk about their mistakes."],["B","Good point. What about the “most improved” prize? Anyone could win it."],["A","Exactly, and it rewards effort, not just talent."],["B","So shall we go for the “most improved” prize, and invite one graduate to tell their story at the ceremony?"],["A","Great idea. That way, we celebrate progress and learn from failure at the same time."]],phrases:{Start:["Shall we look at the three ideas?","… is the traditional choice."],Clarify:["…, don’t they?","But only …"],"Give the turn":["What about …?","Good point."],"Agree and decide":["Exactly, and …","So shall we go for …?","Great idea. That way, …"]},own:{task:"Your turn in pairs: your class wants to remember the end of the year with **one** thing: a photo wall of “our best moments”, a letter to your future selves, or a short video of “what we got wrong and what we learnt”. Discuss for 2 minutes and decide together.",seconds:120}},ip={cards:{A:["Success means …","Hard work pays off.","It was a blessing in disguise.","I learnt the hard way.","Don’t give up.","It’s not about winning.","It fell flat.","She achieved her goal.","Against all odds, …"],B:["It was a steep learning curve.","Against all odds, …","Hard work pays off.","It fell short of …","Don’t give up.","Rise to the challenge.","It was a blessing in disguise.","Success means …","It’s not about winning."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Success means …","Hard work pays off.","It was a blessing in disguise.","I learnt the hard way.","Don’t give up.","It’s not about winning.","It fell flat.","She achieved her goal.","Against all odds, …","It was a steep learning curve.","It fell short of …","Rise to the challenge."],questions:["What does success mean to you?","Is failure necessary for success? Why (not)?","Should schools and universities celebrate effort as much as results?","Why are some people afraid of failing?","How do people in Uzbekistan usually measure success? Is it different in another country you know?","Is it better to be talented or hard-working?"]},lp=[{type:"stress",title:"Stress Spot: words about success",intro:"Tap the stressed syllable. Rules: success is strong at the end (sucCESS, sucCESSful). Before -ious and -ance, the syllable is strong (amBItious, perseVERance). Then listen and say the word.",follow:"Now use two of these words in one sentence about Timur’s story.",items:[{w:"success",syl:["suc","cess"],s:1},{w:"successful",syl:["suc","cess","ful"],s:1},{w:"achievement",syl:["a","chieve","ment"],s:1},{w:"ambition",syl:["am","bi","tion"],s:1},{w:"ambitious",syl:["am","bi","tious"],s:1},{w:"perseverance",syl:["per","se","ver","ance"],s:2},{w:"determined",syl:["de","ter","mined"],s:1},{w:"champion",syl:["cham","pi","on"],s:0}]},{type:"pairs",title:"Sound Pairs: /ʌ/ or /ɒ/?",intro:"Press Play and choose the word you hear. /ʌ/ (luck, cup) is short and central: the mouth is relaxed and half open, as in success. /ɒ/ (lock, cop) is short and rounded: open your mouth and round your lips a little, as in stop. Some Uzbek speakers may say both like the Uzbek a or o, so luck can sound like lock: keep /ʌ/ relaxed. Partner version: one student says a word, the partner points to it.",pairs:[["luck","lock"],["cup","cop"],["cut","cot"],["nut","not"],["duck","dock"]]}],ap=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Give the strongest argument for the OTHER side.","Concede one point, then show what it misses."],up={title:"Step Up Speaking Club podcast: The Shop That Failed Twice",format:"Interview · like exam Part 4 (multiple choice)",intro:"Mateo interviews Amara about her aunt’s soap business in Lagos: two shops that failed, what her aunt learned, a similar story from Navoi and how her aunt measures success today.",tip:["Listen for a correction","In interviews, the speaker sometimes corrects an idea in the question: *Not really.*, *They don’t know that …*. The answer is usually in the correction, not in the interviewer’s words."],A:"mateo",B:"amara",lines:[["A","Today on the Club podcast I’m talking to Amara about success. Amara, people in your neighbourhood in Lagos call your aunt’s soap business **an overnight success**. Is that fair?"],["B","Not really. They don’t know that it took her ten years and two closed shops to get there."],["A","[[0]] she failed twice?"],["B","Yes. Her first shop **fell flat** within months: it was on a quiet street, and almost nobody walked past. Her second one **fell short of** her hopes too, [[1]] her prices were too high."],["A","How did she deal with that?"],["B","“I **learnt the hard way**,” she told me, “but every mistake was **a steep learning curve**.” Many people told her to **give up on** her dream. Instead, she **rose to the challenge**: she moved to the busy market and kept her prices simple."],["A","Does she regret those first years?"],["B","No. She says the first failure was **a blessing in disguise**: without it, she would never have learnt what customers really wanted. [[2]] that’s true for many small businesses. [[3]] Aziza’s uncle in Navoi, who has a similar story about his bakery."],["A","And today?"],["B","Today my aunt **has achieved her goals**, **against all odds**. But when I ask her how she **measures success**, she doesn’t talk about money. She says, “**Hard work paid off**, and now I can help other women start their own businesses.” [[4]] what she can give back."]],gaps:[[1,"Hang on, do you mean that"],[2,"mainly because"],[3,"As I see it,"],[4,"A good example is"],[5,"For her, what matters most is"]],questions:[{q:"Why doesn’t Amara agree that the business was an overnight success?",o:["It still isn’t very successful.","It took years and two failed shops.","Her family helped her a lot."],a:1,why:"“Not really. They don’t know that it took her ten years and two closed shops to get there.”"},{q:"Why did the second shop do badly?",o:["It was on a quiet street.","It sold the wrong kind of soap.","Its prices were too high."],a:2,why:"“Her second one fell short of her hopes too, mainly because her prices were too high.” The quiet street was the problem of the first shop."},{q:"What does Amara’s aunt think about her first failure now?",o:["It taught her what customers wanted.","It was bad luck she couldn’t avoid.","It nearly made her give up."],a:0,why:"“She says the first failure was a blessing in disguise: without it, she would never have learnt what customers really wanted.”"},{q:"How does Amara’s aunt measure success?",o:["by the money she earns","by what she can give back","by how famous her shop is"],a:1,why:"“… she doesn’t talk about money … now I can help other women start their own businesses.”"}],notice:{q:"Look at phrases 1–5. Which one gives a reason, an opinion, an example? Which one does Mateo use to check meaning, and which one says what is most important?",groups:[["Checking meaning",[1]],["Reason",[2]],["Opinion",[3]],["Example",[4]],["What matters most",[5]]]},use:{q:"Is it better to start your own business or to work for a big company first? Why?",by:"leo",model:"As I see it, most young people should work for a company first. That’s mainly because you learn the basics without risking your own money. A good example is my cousin in Hamburg: he worked for a large firm for a few years, and then he opened his own bike repair shop. Of course, some people are ready earlier. For me, what matters most is knowing what you’re good at. So, all in all, start safe, then take the risk.",ticks:["an opinion","a reason","an examp
