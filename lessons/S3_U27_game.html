 one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Mateo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about happiness and philosophy, and /ʊ/ or /ʌ/ (look or luck?). (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"b2p",group:"Pairs → two circles",kind:"pairs",desc:"Level 2: put six parts of an answer about happiness as a choice in order (no labels), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 2; fast pairs try Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases for talking about the good life. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group reports the most interesting idea about happiness they heard (use the wheel)."]},{id:"game",icon:"⚖️",name:"Happiness Court",min:18,lv:"c1",group:"3 courts of 5",kind:"five",roles:["Proposition Counsel","Proposition Witness (Malika)","Opposition Counsel","Opposition Witness (Javier)","Judge"],desc:"Court & Debate with witnesses: a community organiser and a budget officer give evidence, both sides answer each other’s claims, and the Judge decides whether happiness should be the main measure of a city’s success. (Book: section 6 · G8)",howto:["15 students = 3 courts of five, all at the same time. Each court plays on its own phone or laptop (the game works offline). Every student speaks in at least two rounds.","Each student turns over one role card: a Counsel and a Witness for each side, and one Judge. The witnesses speak in role as Malika, a community organiser, or Javier, a budget officer; the Judge keeps time and scores.","Timing: roles 1 min · Prepare 3 min · Openings 3 min · Witnesses 4 min · Claims 2 min · Closing and verdict 5 min.","Only one projector? Run one court at the front with three judges from the class, who agree on each score together. Everybody else notes the best question and the best answer of each side. Six in a court? Add a second Judge."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about planning a Happiness Week for first-year students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Kp={listen:{ref:"Book: Lesson 27, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: the lecturer’s point, Aristotle’s idea, how Aziza’s view is different, and Amara’s main message.","Press **Play the podcast**. Listen for the contrast: _For him …_, _Leo thinks …_, _On the other hand, …_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Amara said; tap a line to hear it again.","Sort the five phrases: reason, contrast, example, opinion and summing up.","**Your turn:** listen to Mateo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 2 is C. Aristotle says we should accept what we can’t change.","gives an answer"],["B","Are you sure? I think that was the Stoics, not Aristotle.","challenges politely"],["A","“For him, happiness was less a feeling than a way of living …”","checks the text again"],["B","So for Aristotle, it’s about how you live. It’s B.","paraphrases"]],checks:[["How can you follow a talk that compares different views?","listen for whose view it is and for the contrast: “For him …”, “The Stoics …”, “Leo thinks so”, “On the other hand, Aziza …”. Questions often test how the views differ."],["Which phrase does Amara use to sum up?","So, in a nutshell, …"]]},pron:{ref:"Book: Lesson 27, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: endings like **-ness**, **-ful** and **-ment** never take the stress (*HAPpiness*, *MEANingful*, *conTENTment*). Before **-ic**, **-ical** and **-ity**, the syllable is strong (*optiMIStic*, *philoSOPHical*, *comMUnity*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ʊ/ or /ʌ/?","Say **both** words. /ʊ/ (*look*) is short, with the tongue high at the back and the lips a little rounded. /ʌ/ (*luck*) is short and open, with relaxed lips and the mouth a little wider open.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *happiness*. Which syllable is strong?",""],["A","*NESS*? It’s the longest part.","a first guess"],["T","Not quite. The ending *-ness* is never strong. Listen again: *HAP*-pi-ness.","the teacher gives a clue"],["B","So it’s the same with *meaningful*: *MEAN*-ing-ful.","uses the rule"],["T","Exactly. And *philosophical*?",""],["A","It ends in *-ical*, so the syllable before it: phi-lo-*SOPH*-i-cal.","uses the rule again"],["T","Great. Now, /ʊ/ or /ʌ/? Listen: *luck*. First or second: *look* or *luck*?",""],["B","Second: *luck*. My mouth is more open, and my lips don’t move forward.","checks the shape of the mouth"]],checks:[["Where is the stress in *contentment*?","on TENT: con-TENT-ment. The ending *-ment* is weak."],["Where is the stress in *community*?","on MU: com-MU-ni-ty, just before *-ity*."],["How do you check /ʊ/ and /ʌ/?","use a small mirror or your phone camera: for /ʊ/ (*look*) the lips are a little rounded; for /ʌ/ (*luck*) they are relaxed and the mouth is more open."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 2**: six parts and **no labels**, so the linking words are your map.","Find the **first part**: it answers the question directly (*I’d say …*).","Follow the linking words: *On the one hand* (a first point) → *My grandmother … is a good example* (an example) → *On the other hand* (the other side) → *What we can choose, then, is* (a solution) → *All in all* (the close).","Press **✔ Check**. Green = right place, red = try again. Press **🔊 Listen** to hear the whole answer.","Go to **Say it: 4/3/2**. Answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 3**: one sentence does not belong."],exTitle:"How Nur’s answer changed in 4/3/2",lines:[["nur","Um, I think … partly, yes … because, um, people are different … For example, my grandmother, she is always happy … But, um, some people have problems … So, partly.","Attempt 1 · 90 s · many pauses"],["nur","I’d say it’s partly a choice, but circumstances set the limits. On the one hand, two people in the same situation can feel very differently. My grandmother is a good example: she has never had much, yet she’s always cheerful. On the other hand, it seems unfair to tell someone in real trouble to just choose happiness. All in all, we choose our attitude, not our situation.","Attempt 2 · 60 s · linking words"],["nur","I’d say it’s partly a choice, but our circumstances set the limits of that choice. Two people in exactly the same situation can see it in completely different ways: my grandmother in Malaysia has never had much, yet she’s the most cheerful person I know. Having said that, telling someone in real trouble to simply choose happiness seems unfair. All in all, we can’t choose what happens to us, but we can choose how we meet it.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["How many parts are there at Level 2?","six, and they have no labels: follow the linking words."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is a happy life the same as an easy life?",lines:[["mateo","**It depends what we mean by** happiness. **Pleasure isn’t the same as meaning.** An easy life has lots of pleasure, but **there’s more to life than** comfort. My uncle in Brazil works long hours as a nurse, and it’s hard, but **it gives him a sense of purpose.** **What really matters is** that your days add up to something.","speaker · 1 minute"],["amara","I heard five phrases: *It depends what we mean by*, *Pleasure isn’t the same as meaning*, *There’s more to life than*, *It gives a sense of purpose* and *What really matters is*. That’s a full row: **Bingo!**","listener reports"],["mateo","Five points plus three for the Bingo: eight points!","count the points"],["amara","Next time, try *That’s easier said than done*. It fits your point about hard work perfectly.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["What is a Bingo?","three ticks in a row: across, down or diagonal."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, what should we organise …?*).","Click the lines in order. Each line answers the line before. Leo and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a class evening",lines:[["A","So, how shall we end the term? A party or a trip?","opens the topic"],["B","What about a picnic by the river? Everyone can bring one dish.","an idea"],["A","Nice, but what if it rains? Could we book the club room just in case?","reacts + a new idea"],["B","Good thinking: picnic first, club room as plan B. Let’s do that.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G8 · section 6",steps:["Make courts of five. Each student turns over one **role card**: a **Counsel** and a **Witness** for the Proposition (measure happiness), the same for the Opposition (keep the usual measures), and the **Judge**.","**Round 1 · Prepare (3 min):** open the six **exhibits**. Each side picks its two strongest. Counsel and witness agree on two main arguments and on what the witness will say.","**Round 2 · Openings:** each counsel speaks for **60 seconds**. The Judge asks each side one short question.","**Round 3 · Witnesses:** each counsel asks their own witness two open questions (use the **question cards**). Then the other counsel asks **one** short cross-question. Witnesses answer **in role**: *“I …”*.","**Round 4 · Claims:** each witness opens a **claim card** from the *other* side and answers it in role (**45 seconds**): admit what is true, then show what it misses.","**Round 5 · Closing and verdict:** the counsel sum up. The Judge scores both sides 0–5 on five criteria, presses **Announce the verdict**, gives two reasons and proposes one rule for how Velmora should use the index."],exTitle:"Sample game: Rounds 2–5 in Court A",lines:[["","Judge Nur · Proposition: Mateo (counsel) and Amara (as Malika, the organiser) · Opposition: Aziza (counsel) and Leo (as Javier, the budget officer)",""],["mateo","**Our case rests on one idea:** a city exists for the people in it. Roads and budgets are tools; a good life is the goal. **If we never measure the goal, we will keep polishing the tools.**","Proposition Counsel: opening statement"],["aziza","**Nobody in this court is against happiness.** Our point is narrower: a feeling that changes with the weather **cannot be the main yardstick** for fixing roofs and pipes.","Opposition Counsel: opening statement"],["","… Round 3 · Witnesses …",""],["mateo","Malika, what did the survey show about the Old Quarter?","an open question to his own witness"],["amara","Our district had the lowest incomes in the city, but the highest trust in neighbours. People said they wanted more time with family and a green place to meet. No other report had ever asked them that.","Malika answers in role"],["aziza","One question, Malika: did the survey say anything about the state of your school building?","a short cross-question"],["amara","No, it didn’t. That wasn’t what it asked.","a short, honest answer"],["","… Round 4 · Claims …",""],["leo","(as Javier, reads a claim card) *“What gets measured gets attention.”* **That’s true, and that’s exactly the danger.** If the index becomes the main measure, every department will chase a higher score, and the leaking roof that nobody feels today will wait another year.","Javier answers a claim from the other side"],["","… Round 5 · Verdict …",""],["nur","**Having weighed both sides, the court finds for** the Proposition, by eighteen points to sixteen. **The decisive moment was** Malika’s point that nobody had ever asked her neighbours what they needed. **Even so,** Javier was right about the roofs. So the court proposes a rule: the index guides new projects, but repairs and safety are funded first.","the Judge explains the verdict and proposes a rule"]],checks:[["What is the difference between an open question and a cross-question?","an open question lets your own witness tell their story (What …? How …? Why …?); a cross-question to the other witness is short and needs a short answer."],["Who answers the claim cards in Round 4?","the witnesses, in role: each opens a card marked with the other side’s name."],["What does the Judge add after the verdict?","two reasons for the decision and one rule for how the city should use the index."]]},drills:{ref:"Book: Lesson 27 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Gp=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Philosophers have argued for centuries about what ___ really is: pleasure, virtue, or something else.",o:["the good life","a fleeting pleasure","peace of mind"],a:0},{q:"A new game is fun for a week, but it is only a ___.",o:["fleeting pleasure","sense of purpose","state of mind"],a:0},{q:"Volunteering on Saturdays gives my sister a real ___: she knows why she gets up in the morning.",o:["sense of purpose","fleeting pleasure","bright side"],a:0},{q:"Many people ___ their work when they can see how it helps others.",o:["find meaning in","chase happiness in","count their blessings in"],a:0},{q:"We can’t change the weather or the past: they are not ___.",o:["within our control","a state of mind","the good life"],a:0},{q:"When things go wrong, my grandmother tells us to ___: we are healthy, together and fed.",o:["count our blessings","chase happiness","reach our full potential"],a:0},{q:"A good teacher helps every student ___.",o:["reach their full potential","look on the bright side of","find a fleeting pleasure"],a:0},{q:"Family gatherings and neighbours who drop in give people a strong ___.",o:["sense of belonging","state of mind","fleeting pleasure"],a:0},{q:"Some people believe happiness is mainly ___: it depends on how you see things, not on what you have.",o:["a state of mind","within our control","a sense of belonging"],a:0},{q:"If you ___ like a prize, you may never feel that you have won it.",o:["chase happiness","count your blessings","find meaning in"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Time with friends makes me happy. → **What … is …**",a:"What makes me happy is time with friends."},{p:"What makes me happy is time with friends. → **the past: made**",a:"What made me happy was time with friends."},{p:"Helping others makes me feel useful. → **a question: Does …?**",a:"Does helping others make you feel useful? (make + person + base verb, no to)"},{p:"Helping others makes me feel useful. → **start with: Helping others gives me …**",a:"Helping others gives me a sense of purpose."},{p:"I have more free time. I am happier. → **The more …, the …**",a:"The more free time I have, the happier I am."},{p:"The more free time I have, the happier I am. → **friends / feel at home**",a:"The more friends I have, the more I feel at home."},{p:"I can’t spend more time with my family. → **I wish …**",a:"I wish I could spend more time with my family. (wish + could for the present)"},{p:"I didn’t thank my teacher. → **I wish …**",a:"I wish I had thanked my teacher. (wish + past perfect for the past)"},{p:"If people had more time, they would be happier. → **the past: If people had had …**",a:"If people had had more time, they would have been happier."},{p:"Happiness depends on our choices. → **partly … and partly …**",a:"Happiness depends partly on our choices and partly on our circumstances."},{p:"Pleasure doesn’t last. Meaning lasts. → **whereas**",a:"Pleasure doesn’t last, whereas meaning does."},{p:"Happiness is a feeling. It is a way of living. → **Happiness is not only … but also …**",a:"Happiness is not only a feeling but also a way of living."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Happiness is a choice.",a:"To a large extent, happiness is a matter of attitude."},{p:"Fun things don’t last.",a:"Pleasure tends to be fleeting; meaning lasts."},{p:"I feel happy when I help people.",a:"I get a real sense of purpose from helping others."},{p:"We can’t change everything.",a:"Some things are simply beyond our control."},{p:"Being with family makes people happy.",a:"A sense of belonging matters more than we realise."},{p:"It depends on the person.",a:"What makes one person flourish may leave another cold."},{p:"Bad times can teach us things.",a:"Hard times can give life a depth that easy times can’t."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ I am happy because of I have good friends.",o:["I am happy because I have good friends.","I am happy because of have good friends.","I am happy because for I have good friends."],a:0,why:"because + a clause (because I have …); because of + a noun (because of my friends)"},{q:"✗ Real happiness is depend on our choices.",o:["Real happiness is depends on our choices.","Real happiness depends on our choices.","Real happiness depending on our choices."],a:1,why:"depend is a verb: no is before it (it depends on …)"},{q:"✗ Helping others makes me to feel useful.",o:["Helping others makes me feel useful.","Helping others makes me feeling useful.","Helping others makes to me feel useful."],a:0,why:"make + person + base verb, without to"},{q:"✗ The happiness is not the same as pleasure.",o:["A happiness is not the same as pleasure.","Happiness is not the same as pleasure.","The happinesses are not the same as pleasure."],a:1,why:"happiness in general takes no article (but: the happiness of our family)"},{q:"✗ Everybody want to be happy.",o:["Everybody wants to be happy.","Everybody are wanting to be happy.","Everybodies want to be happy."],a:0,why:"everybody takes a singular verb: everybody wants"},{q:"✗ I am agree with Aristotle.",o:["I agreeing with Aristotle.","I am agreed with Aristotle.","I agree with Aristotle."],a:2,why:"agree is a verb: I agree (not I am agree)"},{q:"✗ It is worth to try a new hobby.",o:["It is worth trying a new hobby.","It is worth try a new hobby.","It is worth for trying a new hobby."],a:0,why:"worth + -ing: it’s worth trying"},{q:"✗ I enjoyed at my cousin’s wedding.",o:["I enjoyed at my cousin’s wedding very.","I enjoyed myself at my cousin’s wedding.","I was enjoyed at my cousin’s wedding."],a:1,why:"enjoy needs an object: I enjoyed the wedding / I enjoyed myself"}]},{title:"Stress: words about happiness",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"the feeling of being happy",o:["HAPpiness","happiNESS"],a:0,why:"-ness is never stressed."},{q:"a reason for doing something; an aim",o:["PURpose","purPOSE"],a:0},{q:"the feeling of being thankful",o:["graTItude","GRAtitude"],a:1},{q:"full of meaning; important",o:["MEANingful","meaningFUL"],a:0,why:"-ful is never stressed."},{q:"a quiet feeling of being satisfied",o:["conTENTment","CONtentment"],a:0,why:"-ment does not take the stress."},{q:"the study of ideas about life, knowledge and values",o:["PHIlosophy","phiLOsophy"],a:1},{q:"the people who live in one place, or share something",o:["comMUnity","COMmunity"],a:0,why:"-ity: stress the syllable just before the ending."},{q:"expecting good things to happen",o:["OPtimistic","optiMIStic"],a:1,why:"-ic: stress the syllable just before the ending."}]}],Up={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to your court and keep it for the whole game. Each side has a Counsel, who argues the case, and a Witness, who speaks in role as Malika, a community organiser, or Javier, a budget officer. The Judge chairs the court.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",evidenceWord:"Exhibit",evidenceTitle:"Exhibits: the Velmora case file",evidenceHint:"Open all six exhibits. Each one is marked with the side it helps more. Pick your side’s two strongest, and decide what you will say if the other side uses theirs.",evidenceHelp:{b2:["This exhibit tells us that …","It supports our case, because …","They will probably use Exhibit … to say that …"],c1:["What this exhibit really shows is …","Taken together, Exhibits … and … suggest that …","This exhibit proves less than it seems to, because …"]},questionWord:"Question",questionTitle:"Question cards for the counsel",questionHint:"Counsel: open a card for your witness, read the question aloud and let the witness answer in role. Cards marked “cross-question” are for the OTHER side’s witness. You may also ask your own questions.",questionHelp:{b2:["Can you tell the court what happened when …?","Why do you think …?","Is it true that …?"],c1:["Could you explain to the court how …?","From what you have seen, why does …?","Would you accept that …?"]},rebuttalWord:"Claim",rebuttalTitle:"Claim cards: what the other side says",rebuttalHint:"Witnesses: open one card marked with the OTHER side’s name and answer it in role in 45 seconds. Admit what is true, then show what the claim misses. Your counsel may add one sentence.",rebuttalHelp:{b2:["I agree with part of that, but …","This claim doesn’t mention …","In my job, I have seen that …"],c1:["There is some truth in that; however, …","The flaw in this claim is that …","That’s true, and that’s exactly the danger: …"]},teamWord:"Court",teamIcon:"",teamKind:"five",teams:3},Yp={motionWord:"The motion before the court",motion:"This court would make happiness the main measure of Velmora’s success.",sides:[{name:"Proposition",short:"Measure happiness",stance:"Velmora should judge its success first by how its residents’ lives are going, and plan its budget around the Happiness Index."},{name:"Opposition",short:"Keep the usual measures",stance:"Happiness is too personal and changeable to be the main measure: the city should judge success by its services, jobs and safety, with the index as one signal among many."}],judges:1,criteria:["Arguments","Evidence","Questions and answers","Rebuttal","Language"],turnsTitle:"Order of speakers",verdictTitle:"The Judge’s score sheet",verdictHint:"The Judge scores both sides 0–5 for each criterion, then presses **Announce the verdict**, gives two reasons and proposes **one rule** for how Velmora should use the Happiness Index. Score the arguments and answers, never the speakers as people.",winWord:"wins the case"},Jp=[{name:"Round 1 · Prepare",lv:"b2p",bloom:"Understand / Analyse",by:"mateo",seconds:180,tool:"evidence",q:"Open the exhibits. Counsel and witness pick your side’s **two strongest exhibits** and agree on **two main arguments**. Witnesses: plan what you will tell the court. The Judge prepares one question for each side.",help:{b2:["Our main argument is that …","Exhibit … helps us, because …","They will probably say …, so we should …"],c1:["Our case rests on one idea: …","The exhibit that does most for us is clearly …","We should be ready for the objection that …"]},model:"Our case rests on one idea: a city exists to give its people a good life, so that is what it should measure. Exhibit A is the exhibit that does most for us: the poorest district had the strongest community, which no budget report had ever shown. Exhibit C helps too, because it shows that the index would sit alongside the budget, not replace it. They will probably say that moods change with the weather, so Malika should explain that the survey asked about meaning and trust, not just today’s mood."},{name:"Round 2 · Opening statements",lv:"b2p",bloom:"Apply / Analyse",by:"aziza",seconds:0,tool:"turns",turns:[{side:0,who:"Proposition Counsel",task:"Say what the motion means in your own words and give your side’s two main arguments.",seconds:60},{side:1,who:"Opposition Counsel",task:"Give your side’s two main arguments. You may answer one point from the Proposition.",seconds:60},{side:null,who:"Judge",task:"Ask each counsel one short question. Each answers in one or two sentences.",seconds:60}],q:"Opening statements: each counsel presents the case in **60 seconds**. Say where your side stands, then give two arguments.",help:{b2:["Our side believes that …, for two reasons.","Firstly, …","Our second reason is that …"],c1:["Our case rests on one idea: …","Nobody in this court is against …; our point is narrower: …","We will show the court that …"]},model:"Nobody in this court is against happiness. Our point is narrower: a feeling cannot be the main yardstick for running a city. Firstly, moods change. Exhibit D shows that the same people gave very different answers a month apart, after a week of storms. Our second reason is that some of the most important work a city does is invisible to its residents until it fails: water pipes, school roofs, safe bridges. We will show the court that the index is a useful signal, but a poor master."},{name:"Round 3 · Witnesses",lv:"b2p",bloom:"Apply / Analyse",by:"amara",seconds:0,tool:["questions","turns"],turns:[{side:0,who:"Proposition Counsel → Malika",task:"Ask your witness two open questions (a question card or your own). Malika answers in role.",seconds:75},{side:1,who:"Opposition Counsel → Malika",task:"Cross-question: ask Malika one short, sharp question. She answers in one or two sentences.",seconds:30},{side:1,who:"Opposition Counsel → Javier",task:"Ask your witness two open questions (a question card or your own). Javier answers in role.",seconds:75},{side:0,who:"Proposition Counsel → Javier",task:"Cross-question: ask Javier one short, sharp question. He answers in one or two sentences.",seconds:30}],q:"Witnesses: each counsel asks their own witness **two open questions**; then the other counsel asks **one cross-question**. Witnesses answer **in role**, with “I …”.",help:{b2:["When I started this work, …","What surprised me most was …","I’m not completely sure, but I think …"],c1:["What struck me when we knocked on doors was …","To be fair to the other side, …","If I may add one thing, …"]},model:"What struck me when we knocked on doors was how rarely anyone had asked these people anything. In the Old Quarter, incomes are the lowest in the city, yet people told us they trust their neighbours more than anywhere else. Their biggest wish was not a new road, but more time together and a green place to meet. To be fair to the other side, the survey didn’t ask about pipes or roofs. But it showed us something the budget reports never had."},{name:"Round 4 · Claims",lv:"c1",bloom:"Evaluate",by:"leo",seconds:0,tool:["rebuttals","turns"],turns:[{side:1,who:"Javier (Opposition Witness)",task:"Open one claim card marked “Measure happiness” and answer it in role. Your counsel may add one sentence.",seconds:45},{side:0,who:"Malika (Proposition Witness)",task:"Open one claim card marked “Keep the usual measures” and answer it in role. Your counsel may add one sentence.",seconds:45}],q:"Claims: each witness opens a claim card from the **other side** and answers it in role in **45 seconds**. Admit what is true, then show what the claim misses.",help:{b2:["I agree with part of that, but …","This claim doesn’t mention …","In my job, I have seen that …"],c1:["There is some truth in that; however, …","The flaw in this claim is that …","That’s true, and that’s exactly the danger: …"]},model:"There is some truth in that: money is a means, not an end. However, the flaw in this claim is that a city can only spend money on means. It can’t buy anyone a meaningful life; it can repair the bridge they cross to see their family. In my job, I have seen departments chase whatever number they are judged by. If the index becomes the main measure, the work that nobody feels, like pipes and roofs, will always come last."},{name:"Round 5 · Closing and verdict",lv:"c1",bloom:"Evaluate / Create",by:"nur",seconds:0,tool:["turns","verdict"],turns:[{side:0,who:"Proposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:1,who:"Opposition Counsel",task:"Closing statement: your two best points and your witness’s best answer. No new arguments.",seconds:45},{side:null,who:"Judge",task:"Score both sides, announce the verdict and give two reasons. Then propose one rule for how Velmora should use the index.",seconds:60}],q:"Closing and verdict: the counsel sum up in **45 seconds**. Then the Judge scores, announces the verdict, explains it and proposes one rule for how Velmora should use the index.",help:{b2:["To sum up, we have shown that …","The court has decided that …","From now on, the city should …"],c1:["At its heart, this case is about …","Having weighed both sides, the court finds for …","The decisive moment was …"]},model:"Having weighed both sides, the court finds for the Opposition, by nineteen points to seventeen. The decisive moment was Javier’s answer about the school roof: a feeling cannot tell a city when its pipes will burst. That said, Malika showed that the index reveals things no budget report ever has, such as the strength of the Old Quarter’s community. So the court proposes a rule: the index is published every year and guides new projects, but repairs and safety are always funded first."}],_p=[{e:"⚖️",n:"The Judge",r:"Chairs the court and gives the verdict.",lines:[["Your job","Call each speaker and start the timer, ask each counsel one question, score both sides, explain the verdict and propose one rule for how Velmora should use the index."],["Useful phrase","The court calls … · Having weighed both sides, the court finds for …"]],x:"Listen for the best reasons, not the loudest voice. A witness who admits a weak point honestly can be very convincing."},{e:"📣",n:"Proposition Counsel",r:"Lead speaker · measure happiness",lines:[["Your side","Velmora should judge its success first by how its residents’ lives are going, and plan its budget around the Happiness Index."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Our case rests on one idea: …"]],x:"Remind the court that the index asks about meaning and trust, not only about mood. A city that never asks these questions cannot know whether it is succeeding."},{e:"🏘️",n:"Proposition Witness: Malika",r:"A community organiser in the Old Quarter · measure happiness",lines:[["Who you are","Malika, who organises events and meetings in the Old Quarter, the oldest district of Velmora. You knocked on doors to carry out the pilot survey."],["What you can tell the court","The Old Quarter had the lowest incomes in the city but the highest trust in neighbours. Residents’ most common wish was more time with family and friends and a green place to meet. After the survey, the council turned an empty courtyard into an evening tea garden, and people who had never spoken to the council came to planning meetings."],["Your job","Answer questions in role (Round 3) and answer one claim from the Opposition (Round 4)."]],x:"Speak as Malika: “I …”. You respect Javier’s work. Talk about what the survey showed, never about any one person’s private feelings."},{e:"📣",n:"Opposition Counsel",r:"Lead speaker · keep the usual measures",lines:[["Your side","Happiness is too personal and changeable to be the main measure: the city should judge success by its services, jobs and safety, with the index as one signal among many."],["Your job","Opening statement (Round 2), questions to both witnesses (Round 3) and the closing statement (Round 5)."],["Useful phrase","Nobody in this court is against happiness; our point is narrower: …"]],x:"A good cross-question is short and needs a short answer: “Did the survey ask about the state of the school building?”"},{e:"📊",n:"Opposition Witness: Javier",r:"A budget officer at the city hall · keep the usual measures",lines:[["Who you are","Javier, who has prepared Velmora’s budget for many years. You checked the results of the pilot survey."],["What you can tell the court","The survey asked the same residents twice, a month apart; many scores changed after a week of storms and cancelled buses. The school roof in Riverside leaks and two districts have old water pipes, but none of this shows up in the index. Some residents told you they gave high scores so that the council would not see their district as a problem."],["Your job","Answer questions in role (Round 3) and answer one claim from the Proposition (Round 4)."]],x:"You are not against happiness. Admit what the survey showed, then explain why a city also needs measures that do not depend on feelings."}],$p=[],ef=[{t:"To Malika: What did the survey show about the Old Quarter that surprised you?",q:"Proposition Counsel: ask this question. Malika: answer in role in about 30 seconds.",by:"amara",m:"On paper, the Old Quarter is the poorest district in Velmora. So I expected people to be unhappy. Instead, they told us they trust their neighbours more than anyone else in the city does. They look after each other’s children, share food and sit together in the evenings. Our incomes are low, but our sense of belonging is strong, and no report had ever shown that."},{t:"To Malika: What changed after the survey?",q:"Proposition Counsel: ask this question. Malika: answer in role in about 30 seconds.",by:"amara",m:"People had asked for a green place to meet, so the council turned an empty courtyard into an evening tea garden. It cost very little. But the bigger change was trust: people who had never spoken to the council started coming to planning meetings. For the first time, they felt that the city was interested in their lives, not only in their taxes."},{t:"Cross-question to Malika: Did the survey say anything about the state of the school building in your district?",q:"Opposition Counsel: ask this question. Malika: answer honestly in one or two sentences.",by:"amara",m:"No, it didn’t. That wasn’t what it asked, and I accept that a survey like this can’t replace a building inspection."},{t:"To Javier: Why are you worried about using the index to plan the budget?",q:"Opposition Counsel: ask this question. Javier: answer in role in about 30 seconds.",by:"leo",m:"Because feelings move faster than budgets. We asked the same people twice, a month apart, and many scores changed after a week of storms and cancelled buses. A budget has to plan years ahead: a new water pipe lasts for decades. If we follow the index, we will be chasing the mood of last month."},{t:"To Javier: What does the index not show?",q:"Opposition Counsel: ask this question. Javier: answer in role in about 30 seconds.",by:"leo",m:"It doesn’t show the things that nobody notices until they fail. The school roof in Riverside leaks, and two districts have very old water pipes. Residents there gave quite high scores, because today the water still runs. If happiness becomes the main measure, these repairs will wait, and one day the whole district will feel it."},{t:"Cross-question to Javier: Has any budget report before the survey ever told the council what residents most wanted?",q:"Proposition Counsel: ask this question. Javier: answer honestly in one or two sentences.",by:"leo",m:"Not directly, no. Our reports show what we spend, not what people hope for."}],tf=[{side:0,t:"The pilot survey report: the Old Quarter had the lowest incomes of all districts, but the highest trust in neighbours. Across the city, the most common wish was “more time with family and friends”.",q:"What does this exhibit show that an ordinary budget report would miss? Use it to support the Proposition.",by:"mateo",m:"This exhibit shows that being well off on paper and living well are not the same thing. The poorest district turned out to have the strongest community, and nobody would have known without the survey. If the city only counts money and buildings, it will keep missing what people value most: time together and a sense of belonging."},{side:0,t:"A letter from a retired teacher: “The new ring road made Velmora richer on paper, but it cut our street in two. Children can no longer cross to play, and I hardly see my old neighbours.”",q:"How can the Proposition use this letter to argue that growth is not the same as success?",by:"amara",m:"This letter shows that a project can look like success in the usual figures and still make people’s lives poorer. The road brought traffic and trade, but it broke a neighbourhood. If the council had asked about well-being before building it, it might have added a footbridge or chosen another route. That is exactly what the index is for."},{side:0,t:"The council’s draft plan: “Each department will report every year on how its work affects the Happiness Index. Safety rules and legal duties stay as they are.”",q:"How can the Proposition use this plan to answer the claim that the index would replace the budget?",by:"mateo",m:"This plan shows that the index would not throw away everything else. Safety rules and legal duties stay exactly as they are. What changes is the question every department must answer: how does our work make residents’ lives better? That is not a dangerous idea; it is simply asking the city to remember what it is for."},{side:1,t:"A memo from the budget office: the survey asked the same residents twice, a month apart. Many scores changed after a week of storms and cancelled buses.",q:"What does this memo say about the index as the main measure? Use it to support the Opposition.",by:"aziza",m:"This memo shows that the index measures something real, but something that moves. A week of bad weather changed people’s answers, even though nothing important in their lives had changed. A city budget plans for years ahead. You cannot build a bridge on a number that goes up and down with the weather."},{side:1,t:"An engineer’s report: the school roof in Riverside leaks, and the water pipes in two districts are very old. Residents of these districts gave fairly high happiness scores.",q:"How can the Opposition use this report to show what the index cannot see?",by:"leo",m:"This report shows that people can feel fine while serious problems grow out of sight. Nobody feels an old pipe until it bursts. If happiness becomes the main measure, these districts will look as if they need nothing, and the repairs will wait. Some of a city’s most important work is the work that nobody notices."},{side:1,t:"Notes from the survey team: several residents said they gave high scores “so the council won’t think our district is a problem” or “because that’s what people want to hear”.",q:"What does this exhibit say about how honest the answers are? Use it to support the Opposition.",by:"aziza",m:"This exhibit shows that people don’t always answer a survey honestly, especially when they know their answers might affect decisions. Some wanted to protect their district; others gave the polite answer. If the budget follows the index, the city may end up rewarding the most polite districts, not the ones in the greatest need."}],nf=[{side:0,t:"“Money is only a means; a good life is the end. A city should measure the end, not the means.”",q:"You are Javier (Opposition). Answer this claim in role: admit what is true, then show what it misses.",by:"leo",m:"There is some truth in that: nobody wants a city that is rich and miserable. However, the flaw in this claim is that a council can only provide means: clean water, safe streets, good schools. It can’t hand anyone a meaningful life. So it makes sense to judge the council by the means it controls and leave happiness to the people themselves."},{side:0,t:"“What gets measured gets attention. If the city never measures loneliness, nobody will ever fix it.”",q:"You are Javier (Opposition). Answer this claim in role: admit what is true, then show what it misses.",by:"leo",m:"That’s true, and that’s exactly the danger. If the index becomes the main measure, every department will chase a higher score. Projects that make people feel good this year will win, and the leaking roof that nobody feels today will wait. Measure loneliness, by all means, but don’t make one number the master of the whole budget."},{side:0,t:"“A richer city is not always a happier city: the poorest district has the strongest community.”",q:"You are Javier (Opposition). Answer this claim in role: admit what is true, then show what it misses.",by:"leo",m:"I agree with part of that: the Old Quarter showed us something important. But this claim doesn’t mention that a strong community can still have a dangerous school roof. Feeling close to your neighbours doesn’t stop the rain coming in. The best way to respect that community is to fix its buildings, not to praise its happiness and move on."},{side:1,t:"“Happiness is private. A council has no business asking people how they feel.”",q:"You are Malika (Proposition). Answer this claim in role: admit what is true, then show what it misses.",by:"amara",m:"I agree with part of that: nobody should be forced to share their feelings, and our survey was voluntary. But this claim doesn’t mention who the city works for. We asked about trust, meaning and free time, not about anyone’s secrets. When people in the Old Quarter were asked, many of them said it was the first time the city had shown any interest in their lives."},{side:1,t:"“Moods change with the weather. You can’t plan a budget on a feeling.”",q:"You are Malika (Proposition). Answer this claim in role: admit what is true, then show what it misses.",by:"amara",m:"There is some truth in that: a stormy week can change a score. However, the flaw in this claim is that the index doesn’t ask how you feel today. It asks whether your life feels meaningful and whether you trust your neighbours, and those answers move much more slowly. Measured every year, they show a clear direction, and that is what a budget needs."},{side:1,t:"“People may give polite answers. A happy score can hide real problems.”",q:"You are Malika (Proposition). Answer this claim in role: admit what is true, then show what it misses.",by:"amara",m:"That’s true for some answers, and we noticed it too. But this point actually helps us: if people are afraid to be honest, the city has a trust problem, and the old reports would never have shown it. The answer is a better, anonymous survey, not to stop asking. Every measure can be gamed; that’s why we check it, not why we throw it away."}],sf=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"What makes people happy in everyday life?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** everyday happiness comes mostly from small things, not from big events."],["Point","**The main reason is that** we feel good when we share ordinary moments with people we love."],["Example","**For example,** in my family in Uzbekistan, the best part of the week is Friday evening tea with my grandparents."],["Close","**So, all things considered,** a happy life is made of many small, shared moments."]],keys:["in my view","the main reason is that","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"Is happiness mainly a choice, or does it depend on our circumstances?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I’d say it’s partly a choice, **but** our circumstances set the limits of that choice."],["","**On the one hand,** two people in exactly the same situation can see it in completely different ways."],["","**My grandmother in Malaysia is a good example:** she has never had much, yet she is the most cheerful person I know."],["","**On the other hand,** telling someone in real trouble to simply “choose happiness” seems unfair."],["","**What we can choose, then, is** our attitude and the people we spend our time with."],["","**All in all,** we can’t choose what happens to us, but we can choose how we meet it."]],keys:["but","on the one hand","on the other hand","all in all"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"amara",q:"Should schools and universities teach students about happiness?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","Personally, I think they should, as long as it is taught as a skill and not as a set of rules."],["","Students already learn how the body works, but very little about how to look after their minds."],["","A short course on habits, friendship and gratitude could help them cope with stress before exams."],["","At my secondary school in Lagos, for instance, a weekly discussion hour made many of us feel more connected."],["","Even so, no teacher can tell a young person what will make their own life meaningful."],["","So, in a nutshell, schools can teach the tools of a good life, but each student has to find the purpose."]],extra:"The canteen at our university sells the best samsa in town.",keys:["as a skill","look after their minds","even so","in a nutshell"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"leo",q:"Is a life of pleasure as good as a life of meaning?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["Broadly speaking,","I believe a life of meaning is richer than a life of pleasure, although we need both."],["The key point is that","pleasure fades quickly, whereas meaning can carry us through difficult days."],["Take, for example,","a friend of mine in Hamburg who trains as a nurse: the work is tiring, but she says it makes her feel useful."],["Admittedly,","a life with no fun at all would soon become grey and heavy."],["Even so,","the moments people remember at the end of a year are usually the meaningful ones, not the comfortable ones."],["Ultimately,","pleasure makes a good day, but meaning makes a good life."]],distractors:["Suddenly,","Furthermore,"],keys:["broadly speaking","the key point is that","admittedly","ultimately"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"mateo",q:"Are people happier when they live in close communities?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["often, yes","a sense of belonging","help in hard times","the other side: less privacy","a balance"],model:"Often, yes, although it depends on the person. A close community gives people a sense of belonging: you know your neighbours, and they know you. That matters most in hard times, when someone brings food or helps with the children without being asked. In my grandparents’ village in Brazil, for example, nobody ever had to move house alone. The other side is that close communities can leave little privacy, and some people feel watched. So the happiest places probably strike a balance: neighbours who care, but who also know when to give you space."}],rf={title:"Exam Part 2 practice: a Happiness Week for first-year students",situation:"The student council at a university in Samarkand is planning a Happiness Week for first-year students. It can choose only one main event: a guest talk on the philosophy of happiness, an evening of tea and board games, or a volunteering day in the local community. Leo and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"leo",B:"mateo",lines:[["A","So, what should we organise for Happiness Week? Shall we start with the guest talk?"],["B","Sure. It sounds interesting, but would first-years really come to a talk?"],["A","So you mean it might feel like just another lecture?"],["B","Not exactly. It needs a lively speaker. What do you think of the games evening?"],["A","It’s relaxed and easy to join, but it’s only fun for one night, isn’t it?"],["B","Probably. And the volunteering day? Helping others gives a sense of purpose."],["A","That’s true, but organising it would take weeks, wouldn’t it?"],["B","Not if the mahalla helps. So, shall we combine them: volunteering, then tea and games?"],["A","Agreed. That way, students get both meaning and fun."]],phrases:{Start:["Shall we start with …?","So, what should we …?"],Clarify:["So you mean (that) …?","Not exactly. …"],"Give the turn":["What do you think of …?","…, isn’t it?","…, wouldn’t it?"],"Agree and decide":["That’s true, but …","So, shall we combine them?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your town wants its young people to feel happier and less lonely. Choose **one** idea: free evening classes in music or crafts, a weekly phone-free café, or a scheme where students and older residents meet to share skills. Discuss for 2 minutes and decide together.",seconds:120}},of={cards:{A:["It depends what we mean by …","There’s more to life than …","What really matters is …","It’s a matter of perspective.","That’s easier said than done.","It gives a sense of purpose.","Some things are beyond our control.","Pleasure isn’t the same as meaning.","In the end, it comes down to …"],B:["That’s easier said than done.","On a deeper level, …","It depends what we mean by …","Happiness is a by-product of …","In the end, it comes down to …","There’s more to life than …","Pleasure isn’t the same as meaning.","What really matters is …","It gives a sense of purpose."]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["It depends what we mean by …","There’s more to life than …","What really matters is …","It’s a matter of perspective.","That’s easier said than done.","It gives a sense of purpose.","Some things are beyond our control.","Pleasure isn’t the same as meaning.","In the end, it comes down to …","On a deeper level, …","Happiness is a by-product of …","It’s a way of living, not a feeling."],questions:["Is a happy life the same as an easy life?","Can you decide to be happy, or does happiness just happen?","Which family or community traditions in Uzbekistan bring people the most joy? Why?","Is it better to have a few close friends or many friends?","Should a city or a country try to measure how happy its people are?","Do people today have less time for simple pleasures than their grandparents did?"]},lf=[{type:"stress",title:"Stress Spot: words about happiness",intro:"Tap the stressed syllable. Rules: the endings -ness, -ful and -ment never take the stress (HAPpiness, MEANingful, conTENTment). Before -ic, -ical and -ity, the syllable is strong (optiMIStic, philoSOPHical, comMUnity). Then listen and say the word.",follow:"Now use happiness, meaningful and community in one sentence about Velmora.",items:[{w:"happiness",syl:["hap","pi","ness"],s:0},{w:"purpose",syl:["pur","pose"],s:0},{w:"gratitude",syl:["gra","ti","tude"],s:0},{w:"meaningful",syl:["mean","ing","ful"],s:0},{w:"contentment",syl:["con","tent","ment"],s:1},{w:"philosophy",syl:["phi","lo","so","phy"],s:1},{w:"community",syl:["com","mu","ni","ty"],s:1},{w:"optimistic",syl:["op","ti","mis","tic"],s:2},{w:"philosophical",syl:["phi","lo","soph","i","cal"],s:2}]},{type:"pairs",title:"Sound Pairs: /ʊ/ or /ʌ/?",intro:"Press Play and choose the word you hear. /ʊ/ (look, book, put) is short, with the tongue high at the back and the lips a little rounded. /ʌ/ (luck, buck, putt) is short and open, with relaxed lips. Spelling does not help: u is /ʊ/ in put but /ʌ/ in cut. Some Uzbek speakers make /ʊ/ too long and round, like Uzbek u, or say /ʌ/ like Uzbek a or o: keep both sounds short. Partner version: one student says a word, the partner points to it.",pairs:[["look","luck"],["book","buck"],["took","tuck"],["put","putt"],["could","cud"]]}],af=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Use one of today’s phrases: a sense of purpose, count your blessings or a sense of belonging.","Admit one point from the other side before you disagree."],uf={title:"Step Up Speaking Club Ideas Evening: Two Kinds of Happy",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s Ideas Evening, Amara talks about a philosophy lecture on the good life: two old ideas about happiness, what Leo and Aziza think, and the view she agrees with most.",tip:["Listen for the contrast","Talks often put two views side by side: *For Aristotle …*, *Leo thinks …*, *On the other hand, …*, *but*. Questions often ask how the views differ or which one the speaker agrees with, so notice both sides of the contrast."],A:"amara",B:"leo",lines:[["A","Good evening, everyone. Last week our philosophy lecturer asked us a simple question: what is **the good life**? I answered at once: good food, music and a lazy Sunday. She smiled and said these are real joys, but often only a **fleeting pleasure**: wonderful today, forgotten tomorrow."],["A","Then she told us about Aristotle. He wrote about *eudaimonia*, usually translated as “flourishing”. For him, happiness was less a feeling than a way of living: using your talents well and **reaching your full potential**. Why does that matter? [[0]] people who **find meaning in** their work or their families often keep **a sense of purpose** even on bad days."],["A","The Stoics, she added, believed that **peace of mind** comes from focusing on what is **within our control**, our own choices, and accepting the rest. So is happiness simply **a state of mind**? Leo thinks so. He says we should **count our blessings** and **look on the bright side**."],["A","[[1]] Aziza sees it differently. In Uzbekistan, she says, happiness is rarely a solo project. [[2]] family gatherings, or neighbours who drop in for tea: they give people **a sense of belonging**."],["A","[[3]] Aziza is closest to the truth. If you **chase happiness** like a prize, you may never catch it; if you live well with others, it often arrives on its own. [[4]] pleasure is lovely, but meaning and people last longer. Thank you."]],gaps:[[1,"The reason is simple:"],[2,"On the other hand,"],[3,"A good example is"],[4,"As I see it,"],[5,"So, in a nutshell,"]],questions:[{q:"What did the lecturer say about good food, music and a lazy Sunday?",o:["They are not real joys.","They often give only short-lived happiness.","They are the most important part of the good life."],a:1,why:"“She smiled and said these are real joys, but often only a fleeting pleasure: wonderful today, forgotten tomorrow.”"},{q:"For Aristotle, as Amara explains, happiness is mainly …",o:["a feeling that comes and goes.","a way of living and using your talents well.","accepting the things that we cannot change."],a:1,why:"“For him, happiness was less a feeling than a way of living: using your talents well and reaching your full potential.” Accepting the rest is the Stoics’ idea."},{q:"How is Aziza’s view different from Leo’s?",o:["For her, happiness comes mostly from life with other people.","For her, people should count their blessings.","For her, happiness is simply a state of mind."],a:0,why:"“On the other hand, Aziza sees it differently. In Uzbekistan, she says, happiness is rarely a solo project.” B and C are Leo’s view."},{q:"What is Amara’s main message?",o:["Happiness is a prize that you have to work hard for.","Pleasure is a waste of time.","Meaning and other people bring happiness that lasts longer than pleasure."],a:2,why:"“So, in a nutshell, pleasure is lovely, but meaning and people last longer.”"}],notice:{q:"Look at phrases 1–5. Which
