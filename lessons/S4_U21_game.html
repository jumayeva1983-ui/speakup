Njs8Hi/ouVQYYafuTlZCuDot4kLCWQbLqCKVmr91KMjVTNANKrlOrGDQKV9Ksmf8+i7CfBzNf1syAtk2iEj4wlh8pGf+54Sv1EVusuvPzwTcE5OSY2F7CmGPl077SHCaFA/UaQ9AAZx5+myzmoJ8YbTa4Rj6undyX3KdSjNLvqdcAuujl5ukyi+v/EfVfEG+qwMe8izDHxo9QepG463HRoA0t5PaHwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Qp={code:"S4_U21",semester:4,unit:51,title:"Standardized Testing: Fair or Unfair?",subtitle:"Can One Test Show What a Student Really Knows?",module:10,stage:"Stage 3 · ARGUE",level:"B2+ (with C1 tasks)",sioLevel:4,hero:{tags:[["b2","B2+ (with C1 tasks)"],["bl","Bloom: Analyse → Evaluate"]],title:"The League Table Court: The Quillmere Case",paras:["Every summer, the education office of **Quillmere**, a fictional city, publishes a **league table**: a public ranking of all its schools, from first to last. The ranking is based on one thing only: pupils’ results in one standard test at the end of the year. Parents read it, local news websites repeat it, and schools near the bottom feel the pressure.","Some head teachers say the table makes schools **teach to the test**: art lessons turn into test practice. Some parents say it is the only clear information they have. Today the student **League Table Court** decides. Each side must first state the other side’s best argument fairly, and the losing side may appeal. The motion: **This court would stop Quillmere publishing school rankings based on a single standard test.**"],rule:"Rule of respect: we argue about tests, rankings and evidence, never about people. A school’s place in a table says nothing about the worth of any pupil or teacher. Nobody is asked about their own marks or their own school’s results."}},Xp=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A short talk from the Club (exam Part 2): Mateo tells how his cousin in Brazil prepared for a two-day national exam and what supporters and critics say about such tests. Listen for whose view it is, notice how he reports other people’s words and sums up, then use his phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Aziza, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about exams in general, not about their own marks.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in testing words (asSESSment, examiNAtion, evaluAtion), and /æ/ or /eɪ/: plan or plane? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 4: put six parts of an answer about what a test score can show in order and choose the right linking word for each part (two words are extra), then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 4; fast pairs try Level 5, pairs who need help go back to Level 3.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about tests, exams and fair ways to measure learning. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most convincing idea they heard (use the wheel)."]},{id:"game",icon:"⚖️",name:"The League Table Court",min:18,lv:"c1",group:"3 courts of 5",kind:"five",roles:["Proposition Lead","Proposition Second","Opposition Lead","Opposition Second","Judge"],desc:"Court & Debate with a Steelman round and an Appeal: two speakers per side argue whether a city should stop ranking its schools by one standard test. Each side must first state the other side’s best argument fairly; after the verdict, the losing side may appeal to a visiting Judge. (Book: section 6 · G8)",howto:["15 students = 3 courts of five, all at the same time. Each court plays on its own phone or laptop (the game works offline). Every student speaks in at least two rounds.","Each student turns over one role card: a Lead and a Second for each side, and one Judge. In Round 6 the Judges move one court on (A → B → C → A) and hear that court’s appeal.","Timing: roles 1 min · Prepare 3 min · Openings 2 min · Evidence 3 min · Steelman 4 min · Closing and verdict 3 min · Appeal 2 min.","Only one projector? Run one court at the front with three judges from the class, who agree on each score together; the teacher is the visiting Judge. Everybody else notes the fairest steelman of each side. Six in a court? Add a second Judge."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about how a university course should assess its students, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Up={listen:{ref:"Book: Lesson 51, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the talk in order: why the exam mattered, how the school prepared, what the critics say and Mateo’s own view.","Press **Play the podcast**. Listen for whose view it is: _Supporters … say …_, _Critics reply …_, _In her words, …_ Check whose view each question asks about. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Mateo said; tap a line to hear it again.","Sort the five phrases: reporting words, opinion, reason, example and summing up.","**Your turn:** listen to Aziza, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is B. Everyone gets the same questions.","gives an answer"],["B","That’s in the talk, but whose view is it? The question asks about the critics.","challenges politely"],["A","“Supporters of standard tests say they create a level playing field … Critics reply that a test is only a snapshot of one day …”","checks the text again"],["B","So the same questions is the supporters’ point. The critics say a test shows only one day. It’s C.","paraphrases"]],checks:[["Why should you listen for whose view it is?","a talk often reports several views: “Supporters of standard tests say …”, “Critics reply that …”. Option B is the supporters’ view, but the question asks about the critics."],["Which phrase does Mateo use to report his cousin’s words?","In her words, …"]]},pron:{ref:"Book: Lesson 51, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: **-ise** and **-ment** don’t move the stress (*STANdard → STANdardised*, *asSESS → asSESSment*), but before **-tion** the syllable is strong, so the stress moves (*exAMine → examiNAtion*, *eVALuate → evaluAtion*).","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /æ/ (*plan*, *mad*) or /eɪ/ (*plane*, *made*)?","/æ/ is **short and open**: drop your jaw, as in *rank* and *exam*. /eɪ/ **moves**: start at /e/ and glide to /ɪ/, as in *grade* and *rate*. Spelling help: a + consonant + **e** (the “magic e”) usually says /eɪ/: *plan → plane*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *assessment*. Which syllable is strong?",""],["A","The first: *AS*-sess-ment?","a guess"],["T","Think of the verb: *assess*.","the teacher gives a clue"],["A","as-*SESS*. And *-ment* doesn’t move it: as-*SESS*-ment.","uses the rule"],["T","Good. Now *examination*.",""],["B","ex-am-i-*NA*-tion: the syllable before *-tion*.","uses the rule"],["T","Yes! Now listen: *rate*. First or second: *rat* or *rate*?",""],["B","Second: *rate*. The sound moved at the end, and there’s a magic *e*.","listens for the glide"]],checks:[["Where is the stress in *evaluation*?","on A: e-val-u-A-tion (the syllable before -tion)."],["Where is the stress in *standardised*?","on STAN: STAN-dard-ised (-ise doesn’t move the stress)."],["Which word has /eɪ/: *cap* or *cape*?","*cape*: it glides from /e/ to /ɪ/; the magic e gives a clue."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 4**: six parts **without linking words**, and a list of linking words with **two extra** ones.","First put the parts in order. Find the **position** (*… shows only part of what a student knows*) and the **close**.","Then choose a linking word for each part. Ask what the part does: admits the other side (*Admittedly*), a contrast (*However*), an example (*For instance*), one more point (*Besides*) or the close (*Overall*).","Press **✔ Check**. If the order is right but a word is wrong, the app tells you: look at the linking words again.","Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners: 90, 60 and 45 seconds.","Too easy? Try **Level 5** (key words only). Need more help? Go back to **Level 3**."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Um, a test score … it shows something, yes … but not everything … my friend in Hamburg, average mark in physics, but he built, um, a weather station … so, not the whole story.","Attempt 1 · 90 s · many pauses"],["leo","In my view, a test score shows only part of what a student knows. Admittedly, a good test can check facts quickly and fairly. However, it can’t easily measure creativity or teamwork. For instance, my friend in Hamburg got an average mark in physics but built a working weather station. Besides, nervous students often score lower than they deserve. Overall, scores are useful, but they’re not the whole story.","Attempt 2 · 60 s · linking words"],["leo","In my view, a test score is a useful snapshot, but only a snapshot. Admittedly, a well-designed test checks facts and skills quickly and fairly. However, it struggles to capture creativity, teamwork or the ability to ask a good question. My friend in Hamburg, for instance, got a very ordinary mark in physics, yet built a working weather station for the science fair. Besides, nervous students often perform below their real level. Overall, a score should open the conversation, not close it.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 4?","the parts have no linking words: you choose them from a list with two extra words."],["How many times do you say your own answer?","three times, to three different partners."],["Which linking word admits the other side first?","*Admittedly, …*"]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Are exams a fair way to measure what students know?",lines:[["mateo","Well, partly. A national exam creates **a level playing field**: everyone **sits the same exam**. But it’s **a high-stakes test**, so students **cram for** it and schools **teach to the test**. And it’s only **a snapshot** of one or two days. I think coursework should count too, because **one size doesn’t fit all**.","speaker · 1 minute"],["aziza","I heard seven phrases: *a level playing field*, *sit an exam*, *a high-stakes test*, *cram for*, *teach to the test*, *a snapshot* and *one size doesn’t fit all*. That’s a row: **Bingo!**","listener reports"],["mateo","Seven points plus three for the Bingo: ten points!","count the points"],["aziza","Next time, try *measure progress*. It’s on my card, and it fits your point about coursework.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you have to talk about your own marks?","no: talk about tests and schools in general, or about the characters."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*Shall we start with …?*).","Click the lines in order. Each line answers the line before. Nur and Aziza take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a quiz for the club",lines:[["A","The club wants a quiz night. Written answers or a team game?","opens the topic"],["B","Written answers are quiet, but a bit like an exam.","an opinion"],["A","True. A team game is louder, but everyone joins in.","the other option"],["B","Let’s do the team game, then. It’s a party, not a test!","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G8 · section 6",steps:["Make courts of five. Each student turns over one **role card**: a **Lead** and a **Second** for the Proposition (stop the rankings), the same for the Opposition (keep the rankings), and the **Judge**.","**Round 1 · Prepare (3 min):** open the six **exhibits**. Each side picks its two strongest and decides who says what.","**Round 2 · Openings:** each Lead speaks for **60 seconds**. The Judge asks each side one short question.","**Round 3 · Evidence:** each Second presents two exhibits (**60 seconds**); the other Lead asks one short question.","**Round 4 · Steelman:** open a card with the **other side’s** best argument. First say it **fairly and at its strongest** (30 s). The other side says “Fair” or corrects you. Then your Lead answers it (45 s).","**Round 5 · Closing and verdict:** the Seconds sum up. The Judge scores five criteria, including **Fairness to the other side**, and gives two reasons.","**Round 6 · Appeal:** the Judges move one court on. The losing Lead appeals (**30 s**), the winning Second replies (20 s), and the **visiting Judge** upholds or overturns the verdict with one reason."],exTitle:"Sample game: Rounds 2–6 in Court A",lines:[["","Judge Leo · Proposition (stop the rankings): Aziza (Lead) and Nur (Second) · Opposition (keep the rankings): Mateo (Lead) and Amara (Second)",""],["aziza","**At the heart of this case is one question:** what can one test really tell us about a school? Quillmere’s table turns a whole year of teaching into **one number and one place**.","Proposition Lead: opening statement"],["mateo","**Nobody in this court thinks one test tells the whole story.** Our point is narrower: parents deserve **clear, public information**, and today the table is the only information they get.","Opposition Lead: opening statement"],["","… Round 4 · Steelman …",""],["amara","(opens a card) **To put their case at its strongest:** when one test decides a school’s place, schools quietly drop art and music, so **the table changes the very thing it measures**. That’s a serious point.","Opposition Second: steelman, 30 seconds"],["aziza","Fair. That’s exactly our point.","Proposition Lead: “Fair?”"],["mateo","**We take that seriously. Where we part company is** the solution: hiding the results won’t bring art back; publishing more measures next to them will.","Opposition Lead: the answer, 45 seconds"],["","… Round 5 · Verdict …",""],["leo","**Having weighed both sides, the court finds for** the Proposition, by twenty-one points to nineteen. **The decisive moment was** the timetable in Exhibit B. Both sides were **fair to each other**, which made it a close case.","the Judge explains the verdict"],["","… Round 6 · Appeal: Leo moves to Court B; the Judge from Court C visits Court A …",""],["mateo","**We appeal on one ground:** the court gave too little weight to School 4. It only got help because the table showed that it was struggling.","Opposition Lead: appeal, 30 seconds"],["nur","School 4 got help because people finally looked at it closely. A school profile would show that even earlier.","Proposition Second: reply, 20 seconds"],["","The visiting Judge: “The verdict is upheld. The appeal names a real benefit, but a school profile can keep that benefit without a first-to-last list.”",""]],checks:[["What is a steelman?","stating the other side’s argument fairly and at its strongest, before you answer it (the opposite of a “straw man”)."],["Who can appeal, and to whom?","the losing side, in 30 seconds, to the visiting Judge from the next court."],["What does the visiting Judge do?","upholds or overturns the verdict and gives one reason."]]},drills:{ref:"Book: Lesson 51 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Yp=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Thousands of school leavers ___ in the same week every summer.",o:["sit the exam","make the exam","give the exam"],a:0},{q:"One exam decides who gets a university place: it’s ___.",o:["a high-stakes test","a level playing field","a league table"],a:0},{q:"She stayed up every night for a week to ___ her history exam.",o:["cram for","teach to","measure"],a:0},{q:"Some teachers feel they have no choice but to ___: they only practise exam questions.",o:["teach to the test","cram for the test","sit the test"],a:0},{q:"Repeating answers without understanding them is ___.",o:["rote learning","a snapshot","measuring progress"],a:0},{q:"Some people think clearly in an exam hall; they ___.",o:["perform under pressure","narrow the curriculum","rank the schools"],a:0},{q:"If everyone answers the same questions, the test creates ___.",o:["a level playing field","rote learning","a high-stakes snapshot"],a:0},{q:"One exam shows only ___ of what a student can do.",o:["a snapshot","a league table","a level field"],a:0},{q:"When schools drop music to practise for tests, they ___.",o:["narrow the curriculum","measure progress","perform under pressure"],a:0},{q:"Newspapers in some countries publish ___ of schools.",o:["league tables","level playing fields","snapshots of rote"],a:0},{q:"A portfolio can ___ over the whole year, not just on one day.",o:["measure progress","cram for progress","teach to progress"],a:0},{q:"Students learn in different ways: ___.",o:["one size doesn’t fit all","it’s a high-stakes test","it’s a level playing field"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"The test is very important. → **So much depends on …**",a:"So much depends on the test."},{p:"Schools publish their results. → **passive: Results are …**",a:"Results are published by the schools."},{p:"The city ranks every school. → **Every school is …**",a:"Every school is ranked by the city."},{p:"Every school is ranked. → **should no longer be**",a:"Schools should no longer be ranked."},{p:"She studied hard. She did well in the test. → **Having …**",a:"Having studied hard, she did well in the test."},{p:"I didn’t revise. I got a low mark. → **If I had …**",a:"If I had revised, I would have got a better mark."},{p:"Tests measure facts. They don’t measure creativity. → **While …**",a:"While tests measure facts, they don’t measure creativity."},{p:"The table is clear. It is unfair. → **Clear as it is, …**",a:"Clear as it is, the table is unfair. (inversion for emphasis)"},{p:"Parents need information. → **What parents need is …**",a:"What parents need is clear information. (a cleft sentence)"},{p:"Teachers prepare students for the test. → **Students are being …**",a:"Students are being prepared for the test."},{p:"The more pressure, the more students cram. → **The more …, the more …**",a:"The more pressure schools are under, the more students cram."},{p:"Your argument is strong. But I disagree. → **Strong though …**",a:"Strong though your argument is, I disagree. (concession)"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"The test is very important.",a:"It’s a high-stakes test: a lot depends on one day."},{p:"Teachers only practise the test.",a:"Teachers end up teaching to the test."},{p:"It shows only one day.",a:"It’s only a snapshot of one day’s performance."},{p:"Everyone gets the same chance.",a:"It creates a level playing field."},{p:"It isn’t right for every student.",a:"One size doesn’t fit all."},{p:"I understand your point.",a:"To put your case at its strongest: …"},{p:"I disagree with that.",a:"We take that seriously; where we part company is …"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ She got a high mark from the test.",o:["She got a high mark in the test.","She got a high mark of the test.","She got from the test a high mark."],a:0,why:"a mark / a score in a test (not from)"},{q:"✗ The test showed all his knowledges.",o:["The test showed all his knowledge.","The test showed his all knowledges.","The test showed all of knowledges."],a:0,why:"knowledge is uncountable: no -s"},{q:"✗ Our school is on the first place in the ranking.",o:["Our school is in first place in the ranking.","Our school is on first place of the ranking.","Our school is the first place on the ranking."],a:0,why:"in first place / at the top of the table"},{q:"✗ Tomorrow I will give my maths exam.",o:["Tomorrow I will take my maths exam.","Tomorrow I will make my maths exam.","Tomorrow I will pass to my maths exam."],a:0,why:"take / sit an exam; pass = succeed"},{q:"✗ The result depends from one day.",o:["The result depends on one day.","The result depends of one day.","The result is depend on one day."],a:0,why:"depend on"},{q:"✗ Every students take the same test.",o:["Every student takes the same test.","Every students takes the same test.","Every student take the same tests."],a:0,why:"every + singular noun + singular verb"},{q:"✗ Teachers teach for the test.",o:["Teachers teach to the test.","Teachers teach the test for.","Teachers teach at the test."],a:0,why:"the fixed phrase is teach to the test"},{q:"✗ I am agree that tests are useful.",o:["I agree that tests are useful.","I am agreeing that tests are useful.","I am agree with tests are useful."],a:0,why:"agree is a verb: I agree (not I am agree)"}]},{title:"Stress: words about testing",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"the same for everyone, done in the same way",o:["STANdardised","standARdised"],a:0,why:"-ise doesn’t move the stress."},{q:"judging how good someone’s work is",o:["asSESSment","ASsessment"],a:0,why:"-ment doesn’t move the stress: asSESS → asSESSment."},{q:"a formal test",o:["examiNAtion","exAMination"],a:0,why:"Before -tion, the syllable is strong."},{q:"to judge how good or useful something is",o:["eVALuate","EVaLuate"],a:0},{q:"the act of judging how good something is",o:["evaluAtion","eVALuation"],a:0,why:"Before -tion, the syllable is strong."},{q:"all the subjects taught at a school",o:["curRICulum","CURriculum"],a:0},{q:"how well someone does something",o:["perFORmance","PERformance"],a:0}]}],Kp={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to your court and keep it for the whole game. Each side has a Lead, who opens and answers, and a Second, who presents the evidence, gives the steelman and sums up. The Judge chairs the court and, in Round 6, visits the next court to hear its appeal.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",evidenceWord:"Exhibit",evidenceTitle:"Exhibits: the Quillmere case file",evidenceHint:"Open all six exhibits. Each one is marked with the side it helps more. Pick your side’s two strongest, and decide what you will say if the other side uses theirs.",evidenceHelp:{b2:["This exhibit shows …","It supports our case, because …","They will probably use Exhibit … to say …"],c1:["What this exhibit really shows is …","Taken together, Exhibits … and … suggest …","This exhibit proves less than it seems to, because …"]},rebuttalWord:"Argument",rebuttalTitle:"Steelman cards: the other side’s best arguments",rebuttalHint:"Open one card marked with the OTHER side’s name. First, state that argument fairly and at its strongest in 30 seconds: add a reason or an example they could use. The other side says “Fair” or corrects you in one sentence. Then your Lead answers it in 45 seconds.",rebuttalHelp:{b2:["If I understand you correctly, your strongest point is …","That’s a fair point, because …","However, …"],c1:["To put your case at its strongest: …","We take that seriously; where we part company is …","Even if we grant that, it doesn’t follow that …"]},teamWord:"Court",teamIcon:"",teamKind:"five",teams:3},Gp={motionWord:"The motion before the court",motion:"This court would stop Quillmere publishing school rankings based on a single standard test.",sides:[{name:"Proposition",short:"Stop the rankings",stance:"One test cannot show what a school does. A first-to-last list makes schools teach to the test, drops art and music, and labels whole schools. Publish a school profile with several measures instead."},{name:"Opposition",short:"Keep the rankings",stance:"Families and taxpayers deserve clear, public information. The test is the same for every school, and a low place has pushed some schools to get help and improve. Add more information next to the ranking instead of hiding it."}],judges:1,criteria:["Arguments","Evidence","Fairness to the other side","Teamwork","Language"],turnsTitle:"Order of speakers",verdictTitle:"The Judge’s score sheet",verdictHint:"The Judge scores both sides 0–5 for each criterion, then presses **Announce the verdict** and gives two reasons. Score **Fairness to the other side** from the Steelman round: did each side state the other side’s argument honestly and at its strongest before answering it? **Teamwork:** did the Lead and the Second build one case? Score the arguments, never the speakers as people. Then go to Round 6: the losing side may appeal.",winWord:"wins the case",drawHint:"The Judge explains what would have decided the case. In Round 6, both sides may appeal (20 seconds each)."},Jp=[{name:"Round 1 · Prepare",lv:"b2p",bloom:"Understand / Analyse",by:"nur",seconds:180,tool:"evidence",q:"Open the exhibits. Each side picks its **two strongest exhibits** and agrees on **two main arguments**. Decide who says what: the Lead opens and answers; the Second presents the evidence, gives the steelman and sums up. The Judge prepares one question for each side.",help:{b2:["main argument","Exhibit … helps us","they will say … → we answer …"],c1:["our case rests on …","the exhibit that does most for us","be ready for the objection that …"]},model:"Our case rests on one idea: a ranking built on one test measures a single day, then labels a school for a whole year. Exhibit B does most for us: School 12 replaced art lessons with test practice, so the table is changing the very thing it measures. Exhibit C helps too, because it offers a better alternative, not just a complaint. They will probably use Exhibit E, the school that improved after a low place, so I’ll present it first and show that the help came from people looking closely, not from the list itself."},{name:"Round 2 · Opening statements",lv:"b2p",bloom:"Apply / Analyse",by:"aziza",seconds:0,tool:"turns",turns:[{side:0,who:"Proposition Lead",task:"Say what the motion means in your own words and give your side’s two main arguments.",seconds:60},{side:1,who:"Opposition Lead",task:"Give your side’s two main arguments. You may answer one point from the Proposition.",seconds:60},{side:null,who:"Judge",task:"Ask each Lead one short question. Each answers in one or two sentences.",seconds:45}],q:"Opening statements: each Lead presents the case in **60 seconds**. Say where your side stands, then give two arguments.",help:{b2:["our side believes … for two reasons","firstly · secondly","we will show that …"],c1:["at the heart of this case is …","nobody here thinks …; our point is narrower","we will show the court that …"]},model:"At the heart of this case is one question: what can one test really tell us about a school? Quillmere’s table takes a whole year of teaching, clubs, projects and care, and turns it into one number and one place. Firstly, that number measures a single test, so schools start teaching to the test, and lessons that are not tested quietly disappear. Secondly, a place near the bottom labels every pupil and teacher in that school, even when they are making real progress. We will show the court that a school profile gives families clearer information, without the ranking."},{name:"Round 3 · Evidence",lv:"b2p",bloom:"Apply / Analyse",by:"amara",seconds:0,tool:["evidence","turns"],turns:[{side:0,who:"Proposition Second",task:"Present your two strongest exhibits: what each one shows and why it matters.",seconds:60},{side:1,who:"Opposition Lead",task:"Ask one short, sharp question about their exhibits. The Proposition answers in one sentence.",seconds:20},{side:1,who:"Opposition Second",task:"Present your two strongest exhibits: what each one shows and why it matters.",seconds:60},{side:0,who:"Proposition Lead",task:"Ask one short, sharp question about their exhibits. The Opposition answers in one sentence.",seconds:20}],q:"Evidence: each Second presents **two exhibits** in **60 seconds**; then the other side’s Lead asks **one short question**.",help:{b2:["Exhibit … shows that …","this matters because …","can you explain why …?"],c1:["what this exhibit really shows is …","taken together, these exhibits suggest …","would you accept that …?"]},model:"Our first exhibit is the story of School 4. For several years it was near the bottom of the table. Then the city noticed, sent extra reading support, and the school has climbed every year since. Without the table, who would have noticed? Our second exhibit is the parents’ forum post: a family new to Quillmere had no other clear information, and the table helped them choose. Taken together, these exhibits suggest that the ranking does not only judge schools; it also protects the families and pupils who have the least information."},{name:"Round 4 · Steelman",lv:"c1",bloom:"Evaluate",by:"leo",seconds:0,tool:["rebuttals","turns"],turns:[{side:1,who:"Opposition Second · steelman",task:"Open a card marked “Stop the rankings”. State that argument fairly and at its strongest: add a reason or an example they could use.",seconds:30},{side:0,who:"Proposition · fair?",task:"Say “Fair” or correct the summary in one sentence.",seconds:15},{side:1,who:"Opposition Lead · answer",task:"Answer the argument: concede what is true, then show why it does not win the case.",seconds:45},{side:0,who:"Proposition Second · steelman",task:"Open a card marked “Keep the rankings”. State that argument fairly and at its strongest: add a reason or an example they could use.",seconds:30},{side:1,who:"Opposition · fair?",task:"Say “Fair” or correct the summary in one sentence.",seconds:15},{side:0,who:"Proposition Lead · answer",task:"Answer the argument: concede what is true, then show why it does not win the case.",seconds:45}],q:"Steelman: before you answer, state the **other side’s** best argument **fairly and at its strongest** (30 seconds). The other side says “Fair” or corrects you. Then your Lead answers it (45 seconds).",help:{b2:["if I understand you correctly, your strongest point is …","that’s a fair point, because …","however, …"],c1:["to put your case at its strongest: …","we take that seriously; where we part company is …","even if we grant that, it doesn’t follow that …"]},model:"To put their case at its strongest: families have a right to know how schools are doing, and without a simple public ranking, the families who know the right people will still find out, while newcomers and busy parents won’t. So the table may actually be fairer to the families with the least information. We take that seriously. Where we part company is the idea that a first-to-last list is the only way to be clear. A school profile on one page can be just as public and just as simple, and it shows progress, not only one test."},{name:"Round 5 · Closing and verdict",lv:"c1",bloom:"Evaluate",by:"mateo",seconds:0,tool:["turns","verdict"],turns:[{side:0,who:"Proposition Second",task:"Closing statement: your two best points and the moment that helped you most. No new arguments.",seconds:45},{side:1,who:"Opposition Second",task:"Closing statement: your two best points and the moment that helped you most. No new arguments.",seconds:45},{side:null,who:"Judge",task:"Score both sides on the five criteria, announce the verdict and give two reasons.",seconds:60}],q:"Closing and verdict: the Seconds sum up in **45 seconds**. Then the Judge scores, announces the verdict and explains it with two reasons.",help:{b2:["to sum up, we have shown …","the court has decided …","the main reason is …"],c1:["at its heart, this case is about …","having weighed both sides, the court finds for …","the decisive moment was …"]},model:"Having weighed both sides, the court finds for the Opposition, by twenty points to nineteen. The decisive moment was the story of School 4: a low place brought help that had not come before. That said, the Proposition’s steelman was the fairest moment of the game, and the timetable from School 12 was a strong exhibit. So the court’s view is this: the results stay public, but Quillmere should stop printing one first-to-last list and add progress, clubs and the arts to every school’s page."},{name:"Round 6 · Appeal",lv:"c1",bloom:"Evaluate / Create",by:"aziza",seconds:0,tool:"turns",turns:[{side:null,who:"Judges move one court on",task:"Each Judge goes to the next court (A → B → C → A) and becomes its visiting Judge. The winning Lead reads out the verdict and the main reason in one sentence.",seconds:20},{side:null,who:"Losing side · Lead",task:"Appeal on one ground: an argument, an exhibit or a moment the court missed or weighed wrongly.",seconds:30},{side:null,who:"Winning side · Second",task:"Reply to the appeal: why the verdict should stand.",seconds:20},{side:null,who:"Visiting Judge",task:"Uphold or overturn the verdict and give one reason. Then suggest one rule for Quillmere.",seconds:30}],q:"Appeal: the Judges move one court on. The losing side appeals in **30 seconds**, the winning side replies in **20 seconds**, and the **visiting Judge** upholds or overturns the verdict with one reason.",help:{b2:["we appeal because …","the court did not consider …","the verdict stands / is changed because …"],c1:["we appeal on one ground: …","with respect, the court gave too little weight to …","the appeal is upheld / dismissed: …"]},model:"The appeal is dismissed, and the verdict stands. The Proposition is right that the court said little about the timetable in Exhibit B, but the appeal does not show that it would have changed the result: the Opposition answered it directly in the Steelman round. However, the court would like Quillmere to try one rule for a year: publish every school’s results, but alphabetically, next to its progress and a short inspector’s report, and see whether families still ask for a first-to-last list."}],_p=[{e:"⚖️",n:"The Judge",r:"Chairs the court, gives the verdict, then visits the next court.",lines:[["Your job","Call each speaker and start the timer, ask each Lead one question, score both sides on five criteria and explain the verdict. In Round 6 you move to the next court as its visiting Judge and decide its appeal."],["Useful phrase","Having weighed both sides, the court finds for … · The appeal is upheld / dismissed because …"]],x:"In Round 4, listen for fairness: a side that states the other side’s case honestly and at its strongest deserves points, even if it then disagrees strongly."},{e:"📣",n:"Proposition Lead",r:"Opens and answers · stop the rankings",lines:[["Your side","Quillmere should stop publishing a first-to-last ranking based on one test, and publish a school profile with several measures instead."],["Your job","Opening statement (Round 2), one question about their exhibits (Round 3), “Fair?” and the answer to their steelman (Round 4); the appeal if your side loses (Round 6)."],["Useful phrase","At the heart of this case is one question: what can one test really tell us about a school?"]],x:"Expect: “Parents need clear information.” Agree, then show that a profile on one page can be just as clear as a list."},{e:"📂",n:"Proposition Second",r:"Evidence, steelman and closing · stop the rankings",lines:[["Your side","Quillmere should stop publishing a first-to-last ranking based on one test, and publish a school profile with several measures instead."],["Your job","Present two exhibits (Round 3), state the other side’s best argument fairly (Round 4), give the closing statement (Round 5); reply if the other side appeals (Round 6)."],["Useful phrase","To put their case at its strongest: …"]],x:"A good steelman makes the other side nod. Add a reason or an example they did not say, and only then answer it."},{e:"📣",n:"Opposition Lead",r:"Opens and answers · keep the rankings",lines:[["Your side","Keep publishing the ranking: it is clear, the same for every school and has pushed some schools to improve. Add more information next to it instead of hiding it."],["Your job","Opening statement (Round 2), one question about their exhibits (Round 3), “Fair?” and the answer to their steelman (Round 4); the appeal if your side loses (Round 6)."],["Useful phrase","Nobody in this court thinks one test tells the whole story; our point is narrower: …"]],x:"Expect: “Schools teach to the test.” Concede it, then ask whether hiding the results would really bring art and music back."},{e:"📂",n:"Opposition Second",r:"Evidence, steelman and closing · keep the rankings",lines:[["Your side","Keep publishing the ranking: it is clear, the same for every school and has pushed some schools to improve. Add more information next to it instead of hiding it."],["Your job","Present two exhibits (Round 3), state the other side’s best argument fairly (Round 4), give the closing statement (Round 5); reply if the other side appeals (Round 6)."],["Useful phrase","If I understand you correctly, your strongest point is …"]],x:"The story of School 4 is your strongest exhibit: a low place in the table brought help that had not come before."}],$p=[],ef=[{side:0,t:"Exhibit A · The ranking page: the education office’s web page lists every Quillmere school from first to last, with one test result next to each name. There is nothing about clubs, the arts, sport, class sizes or pupils who joined during the year. The last schools on the list are shown in red.",q:"What does this page leave out? Use it to support the Proposition.",by:"nur",m:"This page shows how much a ranking hides. A school could run the best music programme in the city, welcome many new pupils in the middle of the year and help them make huge progress, and none of it would appear. The red colour turns a test result into a label. One number cannot carry that much weight."},{side:0,t:"Exhibit B · A letter from Ms Umida Haydarova, head teacher of School 9, with a timetable from School 12 attached: “Since the table began, we spend more and more time on test practice. My best teachers tell me they are teaching to the test, not teaching the subject.” In the attached spring timetable, two weekly art lessons have been replaced by “test practice”.",q:"How can the Proposition use this letter and timetable to show the cost of the ranking?",by:"aziza",m:"This exhibit shows that the ranking doesn’t just measure schools; it changes them. When one test decides a school’s place, anything that is not tested becomes a luxury. Art disappears from the timetable, and teachers who love their subject end up drilling exam questions. Pupils lose more than an hour of art; they lose a broader education."},{side:0,t:"Exhibit C · A proposal from a group of head teachers and parents: instead of a ranking, publish a one-page “school profile” for every school: test results, progress during the year, clubs and the arts, pupils’ and parents’ views, and a short inspector’s report. Schools are listed alphabetically, not from first to last.",q:"How can the Proposition use this proposal to show a better solution than the ranking?",by:"nur",m:"This proposal shows that we don’t have to choose between information and fairness. Parents still get the test results, but they also see progress, clubs and what pupils think. And because schools are listed alphabetically, no school is publicly labelled as the worst. More information, less harm."},{side:1,t:"Exhibit D · A post on a parents’ forum by Oybek S., a father who moved to Quillmere with his family last year: “We knew nobody here. The table was the only clear, official information we had. Without it, we would have had to choose a school from rumours.”",q:"How can the Opposition use this post to argue that the ranking is fair to families?",by:"mateo",m:"This post shows who the table really helps: families without connections. Local families can ask neighbours and friends, but a newcomer like Oybek has nothing else. Remove the ranking, and choosing a school becomes a matter of who you know. That is far less fair than one clear, public list."},{side:1,t:"Exhibit E · The story of School 4: for several years it was near the bottom of the table. After the results were published, the city sent extra reading support, and the head teacher, Mr Mirjalol Ochilov, started a daily reading programme. The school has moved up the table every year since.",q:"How can the Opposition use School 4’s story to show the benefit of the ranking?",by:"amara",m:"This story shows that a low place can be the start of help, not the end of a school. Before the table, School 4’s problems were invisible. The ranking made them public, the city acted, and pupils are now reading better. Hiding results would protect schools’ feelings, but it would not have helped those pupils."},{side:1,t:"Exhibit F · A note from Mr Joris Bakker, head of the Quillmere education office: “The test is the same for every pupil and is marked by examiners from outside the school. It is the one measure in the city that nobody can bend. We are happy to add more information next to it.”",q:"How can the Opposition use this note to argue that the test is a fair measure?",by:"amara",m:"This note shows why the test is trusted: the same questions for everyone, marked by people who don’t know the pupils. Other measures, like pupils’ views or clubs, are useful but easier to influence. And the office is already willing to add information, so the problem the Proposition describes can be fixed without stopping the ranking."}],tf=[{side:0,t:"“One test on one day can’t show what a whole school does.”",q:"You are the Opposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"mateo",m:"Steelman: a school is a year of lessons, clubs, care and progress, and a test sees only a few hours of it. A school that takes in many new pupils, or puts on wonderful concerts, gets no credit at all. Our answer: we agree that the test is not the whole story, but it is the part that is the same for everyone. The solution is to add measures next to it, not to remove the one fair, shared measure we have."},{side:0,t:"“A ranking makes schools teach to the test and drop everything else.”",q:"You are the Opposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"mateo",m:"Steelman: when a school’s public place depends on one test, every hour that isn’t test practice looks like a risk, so art, music and projects disappear, as School 12’s timetable shows. The table changes the very thing it measures. Our answer: we take that seriously. But schools would feel pressure to drill for the test even without a public list, because the results still matter to pupils. Adding the arts to every school’s page would protect them better than hiding the results."},{side:0,t:"“A place at the bottom labels every pupil and teacher in that school.”",q:"You are the Opposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"mateo",m:"Steelman: a red line at the bottom of a list tells a whole neighbourhood that its school is “the worst”, and pupils carry that label even when they are working hard and improving. Teachers may leave, and families may avoid the school. Our answer: that label hurts, and we would change how the page looks. But the school with problems exists whether or not we publish a list. School 4 shows that being seen is the first step to being helped."},{side:1,t:"“Parents have a right to clear, public information about schools.”",q:"You are the Proposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"aziza",m:"Steelman: schools are paid for by everyone, so everyone has a right to know how they are doing. Without a simple public list, families with connections still find out, while newcomers like Oybek are left with rumours. So the ranking may be the fairest information there is. Our answer: we agree completely about the right to information. Where we part company is the form: a school profile on one page gives more information, just as publicly, without telling anyone which school is “last”."},{side:1,t:"“A low place in the table can bring help to a struggling school.”",q:"You are the Proposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"aziza",m:"Steelman: problems that nobody can see are problems that nobody fixes. School 4 had been struggling quietly; the table made it visible, the city sent support and pupils now read better. Our answer: that’s a real benefit, and we want to keep it. But it came from people looking closely at one school, not from the order of the list. A profile that shows progress would flag a struggling school just as clearly, and would also show when it starts to improve."},{side:1,t:"“The test is the same for everyone, so it’s the fairest measure we have.”",q:"You are the Proposition. Steelman it in 30 seconds (state it fairly, at its strongest), then answer it in 45 seconds.",by:"aziza",m:"Steelman: every pupil answers the same questions, and outside examiners mark them, so nobody can bend the result. Other measures, like pupils’ opinions, are easier to influence. A shared test is a level playing field. Our answer: we accept that the test is fair as a test. Even if we grant that, it doesn’t follow that a fair test makes a fair ranking. Schools don’t start from the same place, so the same test can still give a very unfair picture of what a school has achieved."}],nf=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"What is the best way to prepare for an important exam?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** the best way to prepare is to start early and study a little every day."],["Point","**The main reason is that** we remember more when we learn in small steps."],["Example","**For example,** my brother in Navoi made a study plan for the university entrance test and followed it for months."],["Close","**So, all in all,** slow and steady preparation beats last-minute cramming."]],keys:["in my view","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"nur",q:"How can schools make big exams less stressful?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**Honestly, I think schools can do a lot** to make exams less frightening."],["","**First,** teachers can explain exactly how the exam works, so there are no surprises."],["","**Then,** students can do short practice tests in class, without marks."],["","**For instance,** my school in Kuala Lumpur held a practice exam week, and the real exam felt much more familiar afterwards."],["","**On top of that,** schools can teach simple ways to stay calm, like slow breathing."],["","**In short,** good preparation turns fear into confidence."]],keys:["schools can do a lot","first","then","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"mateo",q:"Should university places depend on one exam?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that one exam shouldn’t be the only way into university, although it should still count."],["","To begin with, one exam shows how a student performs on a single day, not what they have learnt over years."],["","On top of that, students who panic under pressure may never show what they really know."],["","A case in point is my cousin in Recife, who did brilliantly all year but froze in the national exam."],["","Granted, a single national exam is simple, cheap and the same for everyone."],["","On balance, the fairest system combines the exam with coursework or an interview."]],extra:"My cousin now plays the guitar in a small band at weekends.",keys:["to begin with","on top of that","granted","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"leo",q:"Can a test score show what a student really knows?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","a test score shows only part of what a student knows."],["Admittedly,","a good test can check facts and skills quickly and fairly."],["However,","it can’t easily measure creativity, teamwork or the ability to ask good questions."],["For instance,","my friend in Hamburg got an average mark in physics but built a working weather station for the school science fair."],["Besides,","nervous students often score lower than they deserve."],["Overall,","test scores are useful, but they should never be the whole story."]],distractors:["Meanwhile,","Instead,"],keys:["only part","quickly and fairly","creativity and teamwork","weather station"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"amara",q:"Should schools be ranked in public league tables?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["parents want information","but","one test","unfair comparisons","a school profile"],model:"I understand why parents want league tables: choosing a school is a big decision, and they want clear information. But a table based on one test can be very misleading. A school in a quiet, wealthy area may come first without doing anything special, while a school in a busy part of Lagos, where many pupils start far behind, may come near the bottom even if its teachers achieve small miracles. So I’d prefer a school profile instead: test results, yes, but also progress, clubs and what pupils say. That gives parents more information, and it’s fairer to the schools."}],sf={title:"Exam Part 2 practice: how should a course assess its students?",situation:"A university in Samarkand wants to change how first-year students are assessed in one course. It can choose only one way: a final written exam, a portfolio of work collected during the term, or a group project with a presentation. Nur and Aziza are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"aziza",lines:[["A","Shall we start with the final exam? It’s the traditional option."],["B","It is, and it’s the same for everyone, isn’t it?"],["A","True, but it only shows what students can do on one day."],["B","Good point. What about the portfolio? It shows progress over the whole term."],["A","I like that, although it takes teachers much longer to mark."],["B","And the group project? Students would learn teamwork as well."],["A","Maybe, but it’s hard to see who really did the work."],["B","So shall we go for the portfolio, with one short test at the end to check the basics?"],["A","Agreed. That way, we measure progress and still keep things fair."]],phrases:{Start:["Shall we start with …?","…, isn’t it?"],Clarify:["True, but …","It only shows …"],"Give the turn":["What about …?","Good point."],"Agree and decide":["Maybe, but …","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your class wants to give the teacher feedback on the course in **one** way: an anonymous online survey, a class discussion, or a short letter from each group. Discuss for 2 minutes and decide together.",seconds:120}},rf={cards:{A:["sit an exam","a high-stakes test","cram for","teach to the test","rote learning","a level playing field","just a snapshot","measure progress","one size doesn’t fit all"],B:["perform under pressure","a level playing field","league tables","a high-stakes test","narrow the curriculum","teach to the test","measure progress","rote learning","just a snapshot"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["sit an exam","a high-stakes test","cram for","teach to the test","rote learning","a level playing field","just a snapshot","measure progress","one size doesn’t fit all","perform under pressure","league tables","narrow the curriculum"],questions:["Are exams a fair way to measure what students know?","What is the best way to prepare for an important exam?","What can a test not measure?","Should schools publish their exam results?","How are school leavers tested in Uzbekistan? Is it different in another country you know?","Is one big exam better than many small tasks? Why (not)?"]},of=[{type:"stress",title:"Stress Spot: words about testing",intro:"Tap the stressed syllable. Rules: -ise and -ment don’t move the stress (STANdard → STANdardised, asSESS → asSESSment); before -tion, the syllable is strong, so the stress moves (exAMine → examiNAtion, eVALuate → evaluAtion). Then listen and say the word.",follow:"Now use two of these words in one sentence about the League Table Court.",items:[{w:"standard",syl:["stan","dard"],s:0},{w:"standardised",syl:["stan","dard","ised"],s:0},{w:"assess",syl:["as","sess"],s:1},{w:"assessment",syl:["as","sess","ment"],s:1},{w:"examine",syl:["ex","am","ine"],s:1},{w:"examination",syl:["ex","am","i","na","tion"],s:3},{w:"evaluate",syl:["e","val","u","ate"],s:1},{w:"evaluation",syl:["e","val","u","a","tion"],s:3}]},{type:"pairs",title:"Sound Pairs: /æ/ or /eɪ/?",intro:"Press Play and choose the word you hear: /æ/ (plan, mad) or /eɪ/ (plane, made)? /æ/ is short and open: drop your jaw, as in rank and exam. /eɪ/ moves: start at /e/ and glide to /ɪ/, as in grade and rate. Spelling help: a + consonant + e (the “magic e”) usually says /eɪ/. Some Uzbek speakers say /eɪ/ as one flat sound, so rate can sound like rat or ret: finish with a small /ɪ/. Partner version: one student says a word, the partner points to it.",pairs:[["plan","plane"],["mad","made"],["hat","hate"],["cap","cape"],["tap","tape"],["rat","rate"]]}],lf=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","State the other side’s strongest argument before you answer it.","Appeal one decision in 30 seconds: give one ground only."],af={title:"Step Up Speaking Club Ideas Evening: Two Days, One Future",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s Ideas Evening, Mateo talks about his cousin in Brazil and the ENEM, a two-day national exam: how she prepared, what supporters and critics of standard tests say, the entrance test in Uzbekistan and the fairer system his cousin would like.",tip:["Listen for whose view it is","In a talk, speakers often report other people’s views before they give their own: *Supporters say …*, *Critics reply …*, *In her words, …*. A view you hear may belong to someone else, so check whose view the question asks about."],A:"mateo",B:"aziza",lines:[["A","Good evening, everyone. Last November my cousin had to **sit an exam** that many Brazilian universities use to choose students: the ENEM, our national secondary-school exam. For her, it was **a high-stakes test**: two long days could shape her whole future."],["A","For months she **crammed for** it every evening. Her school **taught to the test**: practice papers replaced science projects, and there was little room for anything but **rote learning**. [[0]] “I can **perform under pressure**, but the test saw two days, not three years of work.”"],["A","Supporters of standard tests say they create **a level playing field**: everyone answers the same questions, marked in the same way. Critics reply that a test is only **a snapshot** of one day, and that it can **narrow the curriculum**. [[1]] the critics are closer to the truth, [[2]] one bad day can hide years of good work."],["A","[[3]] Uzbekistan. Aziza says many school leavers there spend a whole year preparing for the university entrance test, and in some countries results are even turned into **league tables** of schools."],["A","My cousin passed, but she still thinks a fairer system would also **measure progress** through coursework. [[4]] as she puts it, **one size doesn’t fit all**. Thank you."]],gaps:[[1,"In her words,"],[2,"For what it’s worth, I think"],[3,"not least because"],[4,"A similar case is"],[5,"So my point is this:"]],questions:[{q:"Why was the exam so important for Mateo’s cousin?",o:["It was her only chance to finish school.","Its results could decide her future.","She needed it to get a job."],a:1,why:"“… it was a high-stakes test: two long days could shape her whole future.”"},{q:"How did her school prepare students for the exam?",o:["It used practice papers instead of projects.","It gave students extra science projects.","It asked students to write coursework."],a:0,why:"“Her school taught to the test: practice papers replaced science projects …” Coursework is what she would like in a fairer system."},{q:"What do critics say about standard tests?",o:["They are marked in an unfair way.","Everyone gets the same questions.","They show what a student can do on one day only."],a:2,why:"“Critics reply that a test is only a snapshot of one day …” The same questions for everyone is what supporters say."},{q:"What is Mateo’s own view?",o:["A test can hide a lot of good work.","Tests should be shorter.","Schools should stop using practice papers."],a:0,why:"“For what it’s worth, I think the critics are closer to the truth, not least because one bad day can hide years of good work.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one reports someone’s words, and which one sums up the talk?",groups:[["Reporting words",[1]],["Opinion",[2]],["Reason",[3]],["Exam
