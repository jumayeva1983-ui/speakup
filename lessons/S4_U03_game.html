fFCG1LbX68DvFXf+cb77J2ZN9fsIv6sDN/hah+R0Y5Vg952DT2NyxXGDgTUukhMnjlztl3s837tl0oSOVUPPG+0T/rm6mMzPCwJR/H4NEiSzUg07Dw4AWFThPg0IRYxxcp1Y9f7Md8zTSxwi88EGHUqje1ojxJHpUnrgVvYOrVPGxR0AH0tvdJZgJlqZ/YWKZL66Jpvqb2nOE60QAJ/IoAnWHB1L90z9LfRvYn7Bck8VGBtJAkIuuhQYzLit0bT/v7vLS5+f2QodyZpsaJFb2hG8FL+FXplE9GAVb+wIwylAw2iBJKuPFlKBCukruiAnZuKE5Ov8c+5Blz2LLLLE8jqMhe8vanUJo+R1aupUg+KxfKpC1eT1RZVuQbDRsWlt7YHZpITxMwxg7xnOuwdWtal8oNtqDp+89UWfu4371f8djnLLYLmDnDdHL4UfhlSHc1IEUT9LiWCpCwZidAefb89YBoa5th5SmHLaXSQrnJq4VKJebIx8vAlUNjs8Hi/ouVQYYafuTlZCuDot4kLCWQbLqCKVmr91KMjVTNANKrlOrGDQKV9Ksmf8+i7CfBzNf1syAtk2iEj4wlh8pGf+54Sv1EVusuvPzwTcE5OSY2F7CmGPl077SHCaFA/UaQ9AAZx5+myzmoJ8YbTa4Rj6undyX3KdSjNLvqdcAuujl5ukyi+v/EfVfEG+qwMe8izDHxo9QepG463HRoA0t5PaHwo7+9OHwGVIVAWA0QE0UvdFiDmSRwg6F7eXjskMdu3tg7FKn5xovTy0LUQPui3Ke12MRkLksNMRtCNb0B+rdAG39WJLjovDDxRteWSGuM7IiXWb3FGVMhrByR+q1aUoSaO+WyuWg1493LimTmQfh5wrFwshzQAAAA==",Uf={code:"S4_U03",semester:4,unit:33,title:"Social Issues: Respecting Older People in Modern Society",subtitle:"What Do We Owe the Older Generation?",module:7,stage:"Stage 3 · ARGUE",level:"B2+ (with C1 tasks)",sioLevel:3,hero:{tags:[["b2","B2+ (with C1 tasks)"],["bl","Bloom: Understand → Create"]],title:"The Wisdom Hour: guests in the hot seat",paras:["It’s **Respect Week** in a mahalla in Navoi, and the youth council has turned the community hall into a live forum called **The Wisdom Hour**. The guests are people with long working lives behind them: a former maths teacher, a retired railway engineer, a woodworker, a grandmother who learnt to code, the founder of a market savings group and others. The audience wants to know what they have learnt, what respect really means to them and what would make the town **fairer for older residents**.","In each panel, one student takes **the hot seat** as a guest. The host and two interviewers ask questions, read out **requests from the town** and **challenge** the guest; a charter writer turns the best ideas into **three lines** for the town’s **Respect Charter**. From Navoi to Oslo, towns are asking the same question: what do we owe the older generation?"],rule:"Rule of respect: the guests and the requests are fictional. We never joke about age or describe older people as a burden. Nobody talks about the health of their own relatives: we talk about people in general."}},Gf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"A Club podcast interview (exam Part 4): Leo asks Aziza about her neighbour, real respect for older people and her mahalla’s project. Listen for purpose and reasons, notice how Leo checks meaning, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the four questions first (books open, text covered) and underline the key words, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Amara, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about people in general, not about the health of their own relatives.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words like DIGnity and contriBUtion, and the British silent r (older) or linking r (older adults). (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a phrase, the partner points to the right one. Swap after five phrases.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 3: put six parts of an answer to the lesson question in order and send the extra sentence to the bin, then say your own answer three times. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 3; fast pairs try Level 4 or 5.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"b2p",group:"Groups of 3",kind:"three",desc:"One student argues for a minute about older people in society; two classmates listen for phrases that weigh up and justify a view. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","The questions are about people in general. Nobody has to talk about their own relatives."]},{id:"game",icon:"🎙",name:"The Wisdom Hour",min:18,lv:"c1",group:"3 panels of 5",kind:"five",roles:["Host","Guest","Interviewer","Interviewer","Charter writer"],desc:"Hot Seat with older guests: one student answers as a fictional guest with a long working life, the panel asks questions, brings requests from the town, challenges the guest and writes three lines for the town’s Respect Charter. (Book: section 6 · Game School: Hot Seat)",howto:["15 students = 3 panels of five. All panels run at the same time, each in its own corner (👥 Class → Groups of 5).","Roles: host, guest (in the hot seat), two interviewers and a charter writer. The guest takes one guest card; the others may read it, but nobody opens the Secret before Round 3.","Rounds: Life stories 5 min · Town requests 4 min · Challenge the guest 4 min · Respect Charter and score 5 min. Next lesson, rotate the roles.","At the end, each charter writer reads the panel’s three lines aloud. The class chooses the best five for one Respect Charter and one intergenerational project for the town."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"b2p",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about choosing a volunteer project with older residents, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Yf={listen:{ref:"Book: Lesson 33, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions. They follow the interview in order: Aziza’s surprise, what she means, the aim of the project and why it works.","Press **Play the podcast**. Listen for purpose: _The idea was to …_, _so that …_, _in order to …_ Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, checking meaning, purpose, example and reason.","**Your turn:** listen to Amara, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Question 3 is C. The project teaches students to use banking apps.","gives an answer"],["B","Hmm, isn’t it the other way round? Students teach older neighbours.","challenges politely"],["A","“The idea was to let both generations teach each other.”","checks the text again"],["B","So the aim is learning from each other. It’s A.","paraphrases"]],checks:[["How can you answer a question about purpose?","listen for “The idea was to …”, “so that …”, “in order to …”. An example of what people do (banking apps) is not the same as the aim of the project."],["Which phrase does Leo use to check what Aziza means?","Just to be clear, are you saying that …?"]]},pron:{ref:"Book: Lesson 33, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion** and **-ity**, the syllable is usually strong (*contriBUtion*, *comMUnity*); **-eer** is strong itself (*volunTEER*). Learn *DIGnity* and *HEritage* by heart.","**Sound Pairs:** press **▶ Play a word** and choose the phrase you hear. Then say it.","In British English, **r after a vowel is silent**: *older* /ˈəʊldə/, *care* /keə/. But when the next word **starts with a vowel**, the r comes back and links the words: *older‿adults*, *care‿about*.","Pairs: Student A says one phrase from a pair; Student B points to it and says whether the r was silent or linking. Swap after five phrases."],exTitle:"A teacher and two students",lines:[["T","Listen: *contribution*. Which syllable is strong?",""],["A","*CON*? The first one?","a first guess"],["T","Listen again: con-tri-BU-tion. It ends in *-tion*.","the teacher gives a clue"],["B","So the syllable before *-tion* is strong: contri-*BU*-tion.","uses the rule"],["T","Yes! Now listen: *older people*. Do you hear an r in *older*?",""],["A","No. It sounds like *olduh people*.","silent r before a consonant"],["T","And *older adults*?",""],["B","Now I hear it: *olde-r-adults*. The r joins the two words.","linking r before a vowel"]],checks:[["Where is the stress in *community*?","on MU: com-MU-ni-ty, just before *-ity*."],["Is the r in *care* pronounced in British English?","not on its own: /keə/. It comes back only before a vowel, as in *care‿about*."],["Is it wrong to pronounce every r?","no: many accents do (for example American and Scottish English). This lesson practises the British model."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 3**: six parts, **no labels**, and **one sentence that does not belong**.","Find the **first part**: it gives a clear answer straight away.","Follow the linking words: *First and foremost* (a first reason) → *What is more* (a second reason) → *for instance* (an example) → *Having said that* (a limit or the other side) → *All in all* (the close).","Find the extra sentence: it may be true and friendly, but it **does not answer the question**. Send it to the bin with 🗑.","Press **✔ Check**. Then go to **Say it: 4/3/2**: answer the question **with your own ideas** three times, to three partners (90, 60 and 45 seconds).","Too easy? Try **Level 4** (choose the linking words) or **Level 5** (key words only)."],exTitle:"How Leo’s answer changed in 4/3/2",lines:[["leo","Er, we owe them … respect, of course. Because they, um, built things. Roads, schools. And they know a lot. So … respect. And listening.","Attempt 1 · 90 s · many pauses"],["leo","I’d say we owe them more than politeness. First and foremost, they built a lot of what we use every day. What is more, they know things that aren’t in books. Having said that, they don’t want to be treated as fragile. All in all, we owe them a voice.","Attempt 2 · 60 s · linking words"],["leo","I’d say we owe the older generation more than good manners: we owe them a real place in society. First and foremost, much of what we use every day was built by people who are now retired; what is more, they carry knowledge no textbook has. Having said that, respect shouldn’t mean treating people as fragile. All in all: a voice, a role and the right to choose.","Attempt 3 · 45 s · same ideas, better words"]],checks:[["What is new at Level 3?","one extra sentence that does not answer the question: send it to the bin."],["How many times do you say your own answer?","three times, to three different partners."],["Do you need new ideas each time?","no: the same ideas in better words."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and argues a clear view about **people in general**.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Is it fair that some job adverts ask for “young” candidates?",lines:[["nur","**The way I see it,** no, it isn’t. **What really matters is** whether a person can do the job, not their date of birth. **To be fair,** some companies simply want new ideas, **but that’s not to say that** older people don’t have them. **Let’s not forget that** experienced staff often train the new ones. **A case in point is** my aunt’s office in Kuala Lumpur, where a retired accountant now mentors the interns. **Above all,** an advert should describe the job, not the age.","speaker · 1 minute"],["amara","I heard six phrases: *The way I see it*, *What really matters is*, *To be fair*, *That’s not to say that*, *Let’s not forget that* and *A case in point is*. That’s the top row and more: **Bingo!**","listener reports"],["nur","Six points plus three for the Bingo: nine points!","count the points"],["amara","Next time, try *It works both ways*. It’s on my card, and it fits really well.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you have to talk about your own grandparents?","no: talk about people in general, or about fictional people and towns."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*So, which project should we …?*).","Click the lines in order. Each line answers the line before. Nur and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one, challenge each other and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: inviting a guest speaker",lines:[["A","So, who should we invite to speak at the English club next month?","opens the topic"],["B","What about the retired pilot who lives near the university? He’d have great stories, wouldn’t he?","an idea + a question tag"],["A","True, but shouldn’t we ask him what he’d like to talk about, rather than choose for him?","challenges politely"],["B","Fair point. Let’s write to him today and offer two or three topics.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School · Hot Seat · section 6",steps:["Make panels of five: **Host, Guest, Interviewer 1, Interviewer 2, Charter writer** (👥 Class → Groups of 5). Next lesson, the roles move one place.","**Guest cards:** the guest turns over one card and reads it: *My life’s work*, *What I have learnt*, *What I ask for*. You are now that guest. Don’t open the **Secret** yet.","**Round 1 · Life stories (5 min):** the host welcomes the guest and opens question cards one by one. The guest answers in role for about 45 seconds each.","**Round 2 · Town requests (4 min):** the host opens a request from the town. The guest says what is fair and what would help; each interviewer adds one idea or asks a follow-up question.","**Round 3 · Challenge the guest (4 min):** each interviewer challenges the guest with an opinion from the audience. The guest agrees in part, argues back and may reveal the **Secret**.","**Round 4 · Respect Charter and score (5 min):** the guest gives a one-minute message to the town. The charter writer reads the panel’s **three charter lines**, and the panel gives 0–5 points for each criterion, plus one star and one wish."],exTitle:"Sample panel: Panel Registan",lines:[["","Host Aziza · Guest Leo (as Botir Usmonov, retired railway engineer) · Interviewers Nur and Mateo · Charter writer Amara",""],["aziza","Welcome to **The Wisdom Hour**! Our guest spent his working life keeping trains running across Uzbekistan. Botir aka, **what are you proudest of**?","host: welcome + first question card"],["leo","**Not one single bridge**, but the young engineers I trained. **Several of them** now run the workshops where I started.","guest answers in role"],["","Round 2 · Town requests",""],["aziza","A request: “**The bank on Market Street is closing. From next month, everything must be done in the app.**”","host opens a request"],["leo","Apps are useful, **but a town shouldn’t make them the only door**. Keep one desk open, and let students run a help hour in the library.","guest: what is fair + what helps"],["nur","**Who would train** the students to explain things patiently?","interviewer asks a follow-up"],["","Round 3 · Challenge the guest",""],["mateo","**Some people would say** older people should step aside and let the young lead. What do you think?","interviewer challenges"],["leo","**I’d agree up to a point**: young people must lead. **But leading isn’t the same as forgetting.** **And here’s my secret:** I still have the notebooks of every bridge I worked on. Your new engineers are welcome to read them.","guest: part agree + Secret"],["amara","Our three charter lines: keep one human service open for every online one; ask older residents before decisions that affect them; record skills before they are lost. Scores: real-life wisdom 5, fair arguments 4, respectful tone 5. Star: the notebooks. Wish: one more example from another country.","charter writer: lines, scores, star, wish"]],checks:[["Who opens the question cards and the requests?","the host."],["What does the guest do in Round 3?","agrees with part of the challenge, argues back and may reveal the Secret."],["What does the charter writer read at the end?","the panel’s three lines for the Respect Charter; then the panel gives scores, one star and one wish."]]},drills:{ref:"Book: Lesson 33 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Kf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"A retired engineer has ___ that young engineers can learn from.",o:["a wealth of experience","a say in","a contribution"],a:0},{q:"Older residents should ___ decisions about their own neighbourhood.",o:["take for granted","have a say in","look out for"],a:1},{q:"Many older people want to ___ and choose for themselves.",o:["stay independent","be written off","pass on"],a:0},{q:"Refusing to hire someone only because of their age is ___ .",o:["a wealth of experience","age discrimination","an intergenerational project"],a:1},{q:"A garden where students and retired neighbours work together is ___ .",o:["an intergenerational project","age discrimination","a say"],a:0},{q:"Families sometimes ___ their grandparents’ help: they only notice it when it stops.",o:["look out for","take for granted","stay independent"],a:1},{q:"Good neighbours ___ each other, especially in winter.",o:["write off","look out for","take for granted"],a:1},{q:"A master craftsman wants to ___ his skills before they are forgotten.",o:["pass on","write off","have a say in"],a:0},{q:"Older volunteers ___ to the life of the town.",o:["make a real contribution","take for granted","write off"],a:0},{q:"Nobody should be ___ just because they have retired.",o:["looked out for","written off","passed on"],a:1}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Older people should have a say in local decisions. → **a question: Why should …?**",a:"Why should older people have a say in local decisions?"},{p:"She taught me to bake bread. → **the passive: I was …**",a:"I was taught to bake bread (by her)."},{p:"He has worked on the railway. → **for most of his life (present perfect)**",a:"He has worked on the railway for most of his life."},{p:"He has worked on the railway for most of his life. → **he stopped: He retired …**",a:"He retired after working on the railway for most of his life."},{p:"My neighbour retired. → **since + present perfect: My neighbour has been …**",a:"My neighbour has been retired since last spring."},{p:"The town ignores older residents. → **a wish: I wish the town …**",a:"I wish the town didn’t ignore older residents. / I wish the town listened to older residents."},{p:"Students help older neighbours with their phones. → **the passive: Older neighbours …**",a:"Older neighbours are helped with their phones by students."},{p:"If the bank closes, many people will lose a service. → **an unreal situation: If the bank closed, …**",a:"If the bank closed, many people would lose a service."},{p:"Someone should ask them first. → **the passive: They should …**",a:"They should be asked first."},{p:"Let her do it herself. → **advice: It might be better to …**",a:"It might be better to let her do it herself."},{p:"He remembers how the town looked. → **used to: He remembers how the town … look**",a:"He remembers how the town used to look."},{p:"Respect older people. → **not only … but also: Respect means not only … but also …**",a:"Respect means not only being polite to older people but also listening to them."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"Older people know a lot.",a:"Older people have a wealth of experience to draw on."},{p:"We should be polite to older people.",a:"Respect goes beyond good manners."},{p:"Some firms won’t hire older people.",a:"Age discrimination in hiring is still a real problem."},{p:"Let them do things themselves.",a:"People should stay independent for as long as they wish."},{p:"Ask older people what they think.",a:"Older residents deserve a say in decisions that affect them."},{p:"Young and old can help each other.",a:"Intergenerational projects tend to benefit both sides."},{p:"People forget what older people did.",a:"It’s all too easy to take their contribution for granted."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ We must respect to older people.",o:["We must respect older people.","We must respect for older people.","We must to respect older people."],a:0,why:"respect somebody (no to). But: show respect for somebody / have respect for somebody."},{q:"✗ My grandmother learned me to bake bread.",o:["My grandmother learned to me baking bread.","My grandmother taught me to bake bread.","My grandmother teached me to bake bread."],a:1,why:"teach somebody (to do) something; learn = get knowledge yourself. teach – taught – taught."},{q:"✗ My neighbour is retired for many years.",o:["My neighbour has been retired for many years.","My neighbour was retired since many years.","My neighbour is retiring for many years."],a:0,why:"for / since + present perfect for a situation that started in the past and continues now"},{q:"✗ We should listen older people more.",o:["We should listen older people more often.","We should listen to older people more.","We should listen at older people more."],a:1,why:"listen to somebody"},{q:"✗ He made a big contribution for the project.",o:["He made a big contribution to the project.","He did a big contribution for the project.","He made a big contribute to the project."],a:0,why:"make a contribution to something"},{q:"✗ I explained him how to use the app.",o:["I explained him to use the app.","I explained to him how to use the app.","I explained for him how to use the app."],a:1,why:"explain something to somebody (explain + to)"},{q:"✗ The olds have a lot of experience.",o:["The olds people have a lot of experience.","Older people have a lot of experience.","Older peoples have a lot of experience."],a:1,why:"older people (people is already plural); “the olds” is not standard and can sound rude"},{q:"✗ Young people must take care about their grandparents.",o:["Young people must take care of their grandparents.","Young people must take care for their grandparents.","Young people must care of their grandparents."],a:0,why:"take care of somebody = look after them; care about somebody = they matter to you"}]},{title:"Stress: words about age and respect",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"the quality of deserving respect",o:["DIGnity","digNIty"],a:0,why:"DIG-ni-ty: learn this one by heart."},{q:"the people who live in one area",o:["COMmunity","comMUnity"],a:1,why:"-ity words stress the syllable just before -ity."},{q:"the time after you stop working",o:["reTIREment","REtirement"],a:0,why:"re-TIRE-ment: the prefix re- is not stressed."},{q:"unfair treatment of a group of people",o:["disCRImination","discrimiNAtion"],a:1,why:"-tion words stress the syllable just before -tion."},{q:"something you give or do to help",o:["contriBUtion","CONtribution"],a:0,why:"-tion words stress the syllable just before -tion."},{q:"a person who works without pay to help others",o:["VOLunteer","volunTEER"],a:1,why:"-eer is stressed itself: volunTEER, engiNEER."},{q:"between or involving different generations",o:["intergeneRAtional","INtergenerational"],a:0,why:"-tional words stress the syllable just before -tion."}]}],Zf={cardsStep:"Guest cards",cardsTitle:"Guest cards",cardsHint:"The guest of each panel picks one card face down: it turns over and opens. Read it, close it, and the next guest picks. The host, the interviewers and the charter writer may read the card too, but nobody opens the Secret before Round 3.",backWord:"Guest",hiddenLabel:"Secret",hiddenAll:"Show all secrets",questionWord:"Question",questionTitle:"Host’s question cards",questionHint:"The host opens one card at a time and asks the guest. Ask at least four questions. Model answers: a Club member plays one of the guests.",questionHelp:{b2:["What I’m proudest of is …","When I started, … Now …","What I’ve learnt is that …"],c1:["Looking back, what strikes me most is …","It’s easy to forget that …","If there’s one lesson I’d pass on, it’s …"]},twistWord:"Request",twistTitle:"Town requests",twistHint:"The host opens one request from the town and reads it aloud. The guest says what is fair and what would really help. Each interviewer adds one idea or asks a follow-up question. The people and places in the requests are fictional.",twistHelp:{b2:["That isn’t fair, because …","A better way would be to …","Why not ask older residents first?"],c1:["The real issue here is …","A fairer approach would be to …, so that …","That’s well meant, but it risks …"]},scoreTitle:"Panel score sheet",scoreHint:"After the guest’s message to the town, the host, the interviewers and the charter writer agree on 0–5 points for each criterion. Then the charter writer reads the panel’s three lines for the Respect Charter, one star and one wish.",scoreCriteria:["Real-life wisdom","Fair arguments","Respectful tone"],teamWord:"Panel",teamIcon:"",teamKind:"five",teams:3},Jf=[{name:"Round 1 · Life stories",lv:"b2p",bloom:"Understand",by:"aziza",seconds:60,tool:"questions",q:"Host: welcome the audience, introduce your guest and ask questions from the cards. Guest: answer in role, about 45 seconds each: your life’s work, what you have learnt and what you ask for.",help:{b2:["Welcome to The Wisdom Hour! Our guest …","What I’m proudest of is …","When I started, … Now …"],c1:["It’s a real honour to welcome …","Looking back, what strikes me most is …","If there’s one lesson I’d pass on, it’s …"]},model:"Good evening, and welcome to The Wisdom Hour, the part of Respect Week where the town listens before it decides. Our first guest taught maths in a village school for most of her working life, and many of her former pupils are in this hall tonight. Today she runs a free homework hour in our mahalla. Halima opa, thank you for coming. Let’s start at the beginning: why did you choose teaching, and what has kept you going?"},{name:"Round 2 · Town requests",lv:"b2p",bloom:"Apply / Analyse",by:"nur",seconds:60,tool:"twists",q:"The host opens **one request** from the town and reads it aloud. Guest: say **what is fair** and **what would really help**. Interviewers: each add one idea or ask a follow-up question.",help:{b2:["That isn’t fair, because …","A better way would be to …","Why not ask older residents first?"],c1:["The real issue here is …","A fairer approach would be to …, so that …","That’s well meant, but it risks …"]},model:"The real issue here isn’t technology; it’s choice. Apps are wonderful for people who like them, and I use one myself. But when a bank closes its last branch, the people who prefer a face and a conversation are suddenly shut out. A fairer approach would be to keep one desk open a few mornings a week, so that nobody has to depend on a grandchild for their own money. And students could run a patient app class in the library for those who want to learn."},{name:"Round 3 · Challenge the guest",lv:"c1",bloom:"Evaluate",by:"leo",seconds:60,q:"Interviewers: challenge the guest with an opinion from the audience, for example **“Respect has to be earned, not given automatically because of age.”** · **“Older people should step aside and let young people lead.”** · **“Looking after older people is a family’s job, not the town’s.”** Guest: agree with part of it, argue your own view and reveal your **Secret** if it helps.",help:{b2:["Some people would say that …","I agree up to a point, but …","Actually, here’s my secret: …"],c1:["I’d challenge that slightly: …","There’s some truth in that; however, …","What matters more, I’d argue, is …"]},model:"*(Challenge: “Respect has to be earned, not given automatically because of age.”)* There’s some truth in that. Nobody deserves admiration just for having birthdays. However, I’d draw a line between admiration and basic dignity. Admiration is earned; dignity is owed to everyone, at every age. What worries me is that people stop listening to us the moment we retire, as if our experience expired with our job. And here’s my secret: the first program I ever wrote, after I retired, was a little game that teaches my grandchildren the names of birds. So please, judge us by what we do, not by the year we were born."},{name:"Round 4 · Respect Charter and score",lv:"c1",bloom:"Evaluate / Create",by:"amara",seconds:60,tool:"score",q:"Guest: give a one-minute **message to the town**. Charter writer: read the panel’s **three lines** for the Respect Charter. Then the panel gives scores, one star and one wish.",help:{b2:["My message to the town is …","Please don’t …; instead, …","Our first charter line is …"],c1:["If there’s one thing I’d like this town to remember, it’s …","Respect isn’t a favour; it’s …","Ultimately, it comes down to …"]},model:"If there’s one thing I’d like this town to remember, it’s this: respect isn’t a favour you do for old people; it’s a habit you build for your own future. Ask us before you decide things that change our lives. Keep a human being at the end of every service, not only a screen. And give us something to do, not just a seat in the front row: we can mentor, repair, teach and organise. Ultimately, it comes down to treating every person as someone who still has something to give."}],_f=[{n:"Halima Rasulova",r:"Former maths teacher · Uzbekistan",look:{skin:"#E3B48C",hair:"#D9D9D9",style:"hijab",scarf:"#9CC3F5",top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My life’s work","She taught maths in a village school for most of her working life. Today she runs a free homework hour in her mahalla."],["What I have learnt","Every child can learn maths if someone is patient enough to find the right example."],["What I ask for","Ask older people for their opinion, not only for their blessing."]],x:"She still has the wooden counting frame from her very first lesson, and she can add a long column of numbers in her head faster than most people can type them into a calculator."},{n:"Botir Usmonov",r:"Retired railway engineer · Uzbekistan",look:{skin:"#D9A47C",hair:"#CFCFCF",style:"short",glasses:!0,top:"#8ED7B8",bg:"#D6F3E7"},lines:[["My life’s work","He spent his working life keeping trains running across Uzbekistan: tracks, bridges and workshops."],["What I have learnt","Machines change quickly; good habits of safety and care do not."],["What I ask for","Don’t close a service before you have asked the people who use it."]],x:"He kept a hand-drawn notebook for every bridge he ever worked on, and he still reads technical drawings faster than his grandson reads a text message."},{n:"Ingrid Larsen",r:"Grandmother who learnt to code · Norway",look:{skin:"#F2D3B6",hair:"#E6E6E6",style:"bun",glasses:!0,top:"#B7A6F2",bg:"#ECE6FF"},lines:[["My life’s work","She worked in a post office for many years. After she retired, she learnt to code at an evening class and now runs a coding club for retired people at her local library."],["What I have learnt","Nobody is too old to learn; people are only too often told they are."],["What I ask for","Teach us slowly once, rather than doing it for us quickly ten times."]],x:"The first program she ever wrote was a small game that helps her grandchildren learn the names of birds in Norwegian and English."},{n:"Kenji Takahashi",r:"Woodworker and furniture restorer · Japan",look:{skin:"#F2D3B6",hair:"#BDBDBD",style:"short",top:"#F7C08E",bg:"#FFE4D6"},lines:[["My life’s work","He repairs old chairs, tables and cabinets so that families can keep using them, and he trains young apprentices in his workshop."],["What I have learnt","A skill that isn’t passed on dies with the person who has it."],["What I ask for","Give young people time to learn crafts properly, and give older craftspeople a place to teach."]],x:"He can join two pieces of wood so firmly that they hold without a single nail or drop of glue, a technique his own teacher showed him."},{n:"Abena Osei",r:"Founder of a market savings group · Ghana",look:{skin:"#6F4630",hair:"#D9D9D9",style:"curly",top:"#F7D774",bg:"#FFF3C4"},lines:[["My life’s work","She sold fabric at a city market and started a savings group so that traders could help each other through hard months."],["What I have learnt","Trust grows slowly, like savings, and it can disappear in one day."],["What I ask for","Let older people stay in charge of their own money and their own decisions."]],x:"She still keeps the savings group’s very first account book, written by hand, and she can explain every page of it from memory."},{n:"Beatriz Ferreira",r:"Retired librarian and reading volunteer · Portugal",look:{skin:"#E8BE98",hair:"#CFCFCF",style:"long",glasses:!0,top:"#F5A9BF",bg:"#FFE1EA"},lines:[["My life’s work","She ran a town library for many years. Now she reads aloud at a primary school and organises a “living library”, where visitors can “borrow” a person for a conversation."],["What I have learnt","Most loneliness ends with one good conversation."],["What I ask for","Show older people in films and adverts as they really are: busy, curious and different from each other."]],x:"She speaks three languages and has read the same favourite novel aloud in all three of them, to three different audiences."},{n:"Dr Lina Kapoor",r:"Researcher on ageing · India",look:{skin:"#B9835E",hair:"#9E9E9E",style:"long",glasses:!0,top:"#9CC3F5",bg:"#DCEBFF"},lines:[["My life’s work","She studies how towns can become good places to grow old and advises city councils on benches, buses, paths and public services."],["What I have learnt","A town that works well for older people usually works better for everyone: for parents with buggies too, and for anyone carrying heavy bags."],["What I ask for","Plan with older residents, not just for them."]],x:"She collects old photographs of town squares and puts them next to new ones, to show councils how public spaces have changed."},{n:"Hugo Dumont",r:"Volunteer at a repair café · France",look:{skin:"#E8BE98",hair:"#BDBDBD",style:"short",beard:!0,top:"#8ED7B8",bg:"#D6F3E7"},lines:[["My life’s work","He worked as an electrician. Now he volunteers at a repair café, where retired and young volunteers fix lamps, radios and bicycles side by side."],["What I have learnt","Working next to someone is the fastest way to stop seeing their age."],["What I ask for","Create places where generations work together, not just sit together."]],x:"He still uses a wooden toolbox that belonged to his grandmother, who repaired clocks, and he can open almost any old clock without scratching it."}],$f=[{t:"Request from the town council: “The bank on Market Street is closing. From next month, everything must be done in the app.”",q:"Is this fair to older customers? What should the town and the bank do?",by:"nur",m:"The real issue here isn’t technology; it’s choice. Apps are convenient, but when the last branch closes, people who prefer a face and a conversation are suddenly shut out. A fairer approach would be to keep one desk open a few mornings a week, so that nobody has to depend on a grandchild for their own money. And students could run a patient app class in the library for anyone who wants to learn."},{t:"Request from a job seeker: “The advert said ‘a young, dynamic team’. I have the skills, but I didn’t even get an interview.”",q:"Is this age discrimination? What should employers do differently?",by:"amara",m:"That advert describes a birthday, not a job. If an employer needs energy and new ideas, it should say so, and then judge every candidate on those skills. Many countries have rules against age discrimination at work, but rules alone don’t change attitudes. A fairer approach would be adverts that describe the tasks, and interview panels that include people of different ages. Mixed teams usually learn faster, because experience and fresh eyes check each other."},{t:"Request from a family: “We do everything for Grandad now: shopping, cooking, paying the bills. But he says he feels useless.”",q:"How can a family help without taking away someone’s independence?",by:"mateo",m:"That’s well meant, but it risks taking away the very thing he values most: being useful. Help should be a hand, not a replacement. Ask him which jobs he would like to keep, and do them with him rather than for him. Maybe he plans the shopping list and someone else carries the bags. He could also take on a role in the family, such as teaching the grandchildren a skill. Feeling needed is part of feeling respected."},{t:"Request from the mahalla committee: “We have a free room twice a week. The students want a gaming club; the older residents want chess and stories.”",q:"Design one activity that brings both groups into the same room.",by:"aziza",m:"Why choose? A fairer approach would be one evening that mixes both. The older residents teach chess, and the students teach a simple strategy game on a tablet; after half an hour, everyone swaps. Then, over tea, each pair tells the story of where they learnt their game. Nobody is just a guest, because everyone teaches something. If it works, the committee could make it a monthly tradition and let both groups plan it together."},{t:"Request from a TV viewer: “A new advert shows an older man who can’t use a remote control, and everyone laughs at him.”",q:"Is it just a joke? How should older people be shown in the media?",by:"leo",m:"One joke is harmless; the same joke a thousand times becomes a stereotype. If every advert shows older people as confused or helpless, viewers start to believe it, and employers and even families may treat them that way. I’m not asking for perfect, smiling grandparents either. I’d simply like to see older people as they really are: different from each other, some brilliant with technology, some not, many still working, volunteering and learning."},{t:"Request from a student volunteer: “I’m teaching my neighbour to make video calls, but I get impatient when I have to explain the same thing again.”",q:"How can young people help with technology in a respectful way?",by:"nur",m:"First of all, it’s kind of you to help, and impatience is normal. A few things work well: let your neighbour hold the phone and press the buttons, so their hands learn, not only their eyes. Write the steps on a card in their own words. And don’t say “It’s easy”: it isn’t easy for a beginner, at any age. Remember that you needed help with things they find simple, like cooking or fixing a tap."}],ep=[{t:"My life’s work",q:"What did your work involve, and what are you proudest of?",by:"leo",m:"For most of my working life I kept trains running: tracks, bridges, workshops, the parts nobody notices until something goes wrong. People expect me to say I’m proudest of a bridge, but honestly, it’s the young engineers I trained. Several of them now run the workshops where I started. When one of them phones me with a difficult question, I know my work didn’t end on the day I retired."},{t:"Then and now",q:"What is the biggest change you have seen in your field, and what has stayed the same?",by:"amara",m:"When I started, everything was on paper: the timetables, the drawings, the reports. Now a young engineer can check a whole line on a laptop before breakfast, and I think that’s wonderful. But some things haven’t changed at all. You still have to walk the track, look closely and listen to the people who use it every day. Technology makes us faster; it doesn’t make us careful. That part is still up to us."},{t:"What respect means",q:"What does real respect for older people look like in everyday life?",by:"aziza",m:"In Uzbekistan, young people stand up when an older person comes in, and they pour our tea first. I love those customs, and I hope they never disappear. But real respect goes a bit further. It means asking what we think and actually listening to the answer. It means not finishing our sentences for us, and not deciding things for us without asking. Good manners open the door; listening is what lets us in."},{t:"Staying independent",q:"Why does independence matter so much, and how can others help without taking over?",by:"mateo",m:"Independence is really about dignity: being able to choose your own breakfast, your own route to the market, your own way of doing things, even if it’s slower. When people take everything out of our hands, they mean well, but we start to feel useless. The best help is the kind you can hardly see: a handrail, a bench halfway up the hill, a neighbour who carries the heavy bag but lets you choose what goes in it."},{t:"Learning something new",q:"What have you learnt later in life, and who helped you?",by:"nur",m:"After I retired, I learnt to write code at an evening class in our library. The teacher was younger than my grandson, and at first I was embarrassed to ask questions. But she never once said “It’s easy”. She let me make mistakes, and she explained things twice without sighing. Now I run a coding club for retired people myself. My lesson from that experience is simple: nobody is too old to learn, but everybody learns better with a patient teacher."},{t:"Underestimated",q:"When do people underestimate older people, and what is the effect?",by:"leo",m:"It often happens in small moments. A shop assistant speaks to the young person next to us instead of to us. A colleague assumes we can’t use a computer. A job advert asks for “young” candidates. Each moment seems tiny, but together they send a message: your time is over. And if you hear that message often enough, you may start to believe it. That’s the real damage: not the comment itself, but the confidence it slowly takes away."},{t:"Passing it on",q:"What skill or knowledge would you like to pass on before it is forgotten, and how?",by:"amara",m:"I’d like to pass on the craft of repairing furniture properly, with joints instead of nails. You can’t learn it from a video alone; your hands have to feel the wood. So I take one or two young apprentices at a time, and they work next to me for months. I’d love the town to give older craftspeople a small workshop where students could come once a week. Otherwise, these skills will quietly disappear, and nobody will notice until it’s too late."},{t:"A fairer town",q:"If you could change one thing in our town to make it fairer for older residents, what would it be?",by:"mateo",m:"I’d ask the town to plan with us, not just for us. Before it moves a bus stop or closes an office, it should invite older residents to a meeting and actually change the plan when they point out a problem. A bench, a ramp or a clear timetable costs very little. But being asked costs nothing at all, and it tells people that they still belong to the town they helped to build."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Why is it important to listen to older people?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**In my view,** listening to older people matters because they have seen many problems that we are only meeting now."],["Point","**The main reason is that** their experience can save us from making the same mistakes again."],["Example","**For example,** when our mahalla planned a new playground, an older neighbour reminded us that the area floods every spring."],["Close","**So, all things considered,** listening to older people is not just polite; it’s practical."]],keys:["in my view","the main reason is that","for example","all things considered"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"amara",q:"Should companies do more to employ older workers?",hint:"6 parts. No labels: follow the linking words.",parts:[["","I think they should, **because** a company that ignores older workers wastes a lot of talent."],["","**For one thing,** experienced staff often know how to solve problems that newer colleagues have never met."],["","**On top of that,** mixed teams can learn from each other: one person brings experience, another brings fresh ideas."],["","**Take my uncle’s firm in Lagos, for example:** it pairs every new engineer with a senior colleague for the first year."],["","**However,** older workers also need fair training, so that new technology doesn’t leave them behind."],["","**So, to sum up,** employing older workers isn’t charity; it’s simply good business."]],keys:["because","for one thing","on top of that","however"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"What do we owe the older generation?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d say we owe the older generation more than good manners: we owe them a real place in society."],["","First and foremost, much of what we use every day, from roads to schools, was built by people who are now retired."],["","What is more, they carry knowledge that no textbook contains, from family recipes to the history of a neighbourhood."],["","In Germany, for instance, a repair café near my home brings retired craftspeople and students together to fix things side by side."],["","Having said that, respect shouldn’t mean treating older people as fragile, since most want to stay independent and keep contributing."],["","All in all, what we owe them is the chance to be heard, to be useful and to choose for themselves."]],extra:"My grandmother’s apple cake is the best cake I have ever tasted.",keys:["first and foremost","what is more","having said that","all in all"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"mateo",q:"Is technology making life easier or harder for older people?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["On balance,","I think technology is making life easier for older people, but only when nobody is forced to use it."],["To begin with,","video calls and online shopping can help people stay in touch and stay independent."],["For instance,","a neighbour of mine in Recife video-calls her sister in Lisbon every Sunday and has learnt to order her groceries online."],["On the other hand,","when banks, tickets and forms move online only, people who don’t use the internet are suddenly left out."],["That’s why","every online service should still have a human alternative, at least for those who need it."],["In the end,","technology should give older people more choices, not fewer."]],distractors:["Meanwhile,","As a result of this,"],keys:["easier","stay independent","on the other hand","a human alternative"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"nur",q:"How could a town become a better place to grow old?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["plan with, not for","benches, buses, ramps","for instance","human services, not only apps","mixed-age projects"],model:"I think a town becomes a better place to grow old when it plans with older residents, not just for them. Small things make a big difference: benches on long streets, buses that wait until people have sat down, ramps and clear signs. For instance, in Kuala Lumpur my aunt’s neighbourhood asked older residents to walk the streets with the council and mark every difficult step. Services also need a human face, not only an app. And mixed-age projects, like shared gardens or repair cafés, keep people connected and useful."}],np={title:"Exam Part 2 practice: a volunteer project with older residents",situation:"The university volunteer club in Navoi can run one project with older residents this term: a weekly phone and app help desk, a “life stories” project where students record older people’s memories for the city library, or a shared vegetable garden. Nur and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"nur",B:"mateo",lines:[["A","So, which project should we run this term? Shall we start with the help desk?"],["B","Sure. It’s practical, but the students would always be the teachers, wouldn’t they?"],["A","Hm. So you’re saying the older people would only ever be on the receiving end?"],["B","Exactly. Respect should work both ways. The life stories project gives them the expert role."],["A","True, but would everyone want to be recorded? Some people are private about their past."],["B","Fair point: only if they want to. And the garden? Everyone could teach and learn there."],["A","I like that. Older neighbours often know far more about gardening than we do."],["B","Definitely. So, shall we go for the garden and record stories there, with permission?"],["A","Agreed. That way, everyone has something to give, and nobody feels like a project."]],phrases:{Start:["Shall we start with …?","Which … should we …?"],Clarify:["So you’re saying (that) …?","Exactly. …"],Challenge:["True, but would …?","…, wouldn’t they?"],"Agree and decide":["Fair point.","So, shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your English club wants to invite older people from the community for one afternoon. Choose **one** idea: a storytelling afternoon, a skills swap (they teach a craft, you teach an app), or a chess and tea tournament with mixed-age teams. Discuss for 2 minutes, challenge each other’s ideas and decide together.",seconds:120}},rp={cards:{A:["The way I see it, …","What really matters is …","Let’s not forget that …","It’s easy to take … for granted.","To be fair, …","That’s not to say that …","It works both ways.","Respect isn’t just about …","There’s a lot to be said for …"],B:["Let’s not forget that …","In the long run, …","The way I see it, …","It works both ways.","Above all, …","It’s easy to take … for granted.","A case in point is …","There’s a lot to be said for …","What really matters is …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["The way I see it, …","What really matters is …","Let’s not forget that …","It’s easy to take … for granted.","To be fair, …","That’s not to say that …","It works both ways.","Respect isn’t just about …","There’s a lot to be said for …","In the long run, …","Above all, …","A case in point is …"],questions:["What can a town do to make life easier for its older residents?","Should older people be encouraged to learn new technology? Why or why not?","Is it fair that some job adverts ask for “young” candidates?","Which skills or traditions should older people pass on, and how?","Are older people shown fairly in films, adverts and on social media?","What makes a project for young and older people really work?"]},sp=[{type:"stress",title:"Stress Spot: words about age and respect",intro:"Tap the stressed syllable. Rules: before -tion and -ity, the syllable is usually strong (contriBUtion, comMUnity); -eer is strong itself (volunTEER). Learn DIGnity and HEritage by heart. Then listen and say the word.",follow:"Now use two of these words in one sentence about what a town owes its older residents.",items:[{w:"dignity",syl:["dig","ni","ty"],s:0},{w:"community",syl:["com","mu","ni","ty"],s:1},{w:"retirement",syl:["re","tire","ment"],s:1},{w:"discrimination",syl:["dis","cri","mi","na","tion"],s:3},{w:"contribution",syl:["con","tri","bu","tion"],s:2},{w:"volunteer",syl:["vo","lun","teer"],s:2},{w:"heritage",syl:["he","ri","tage"],s:0},{w:"intergenerational",syl:["in","ter","ge","ne","ra","tion","al"],s:4}]},{type:"pairs",title:"Sound Pairs: silent r or linking r?",intro:"Press Play and choose the phrase you hear, then say it. In British English, r after a vowel is silent: older /ˈəʊldə/, care /keə/, more /mɔː/. When the next word starts with a vowel, the r comes back and links the two words: older‿adults, care‿about, more‿ideas. Uzbek r is usually rolled and always pronounced, so it is natural to say every written r; both habits are understood, but this lesson practises the British model. (Some computer voices are American and pronounce every r.) Partner version: one student says a phrase, the partner points to it and says “silent” or “linking”.",pairs:[["older people","older adults"],["care for","care about"],["more time","more ideas"],["after lunch","after all"],["for them","for us"]]}],op=["Use two C1 phrases from the Phrase Bank in your next answer.","Ask the guest a follow-up question that starts with “What if …?”","Disagree politely with one idea you heard, then say what you agree with.","Give a real example from Uzbekistan.","Give an example from another country.","Sum up the last answer in 20 seconds without the words “old” or “respect”."],lp={title:"Step Up Speaking Club podcast: More Than Good Manners",format:"Interview · like exam Part 4 (multiple choice)",intro:"Leo interviews Aziza about respect for older people: what her neighbour Anvar aka told her, the difference between politeness and respect, and the project her mahalla started this spring.",tip:["Listen for purpose","Questions often ask why people did something. Listen for *The idea was to …*, *so that …*, *in order to …*. Examples of what people do are not the same as the aim, so don’t choose an option just because you heard its words."],A:"leo",B:"aziza",lines:[["A","Today on the Club podcast I’m talking to Aziza about respect. Aziza, in Uzbekistan children learn early to **show respect for** older people, don’t they?"],["B","They do. We greet them first, offer them the best seat and pour their tea before our own. So I was surprised when our neighbour Anvar aka, a retired engineer, told me: “Everyone is polite to me, but nobody asks what I think.” He has **a wealth of experience** and loves to **pass on his knowledge**, yet since he retired he has sometimes felt **written off**. [[0]] politeness isn’t the same as respect."],["A","[[1]] people are rude to older people?"],["B","No, not rude. But in many countries older workers can face **age discrimination**, and even loving families can **take them for granted**: they visit, but they don’t really listen."],["A","So what does real respect look like?"],["B","Anvar aka says it means treating people **with dignity**: helping them **stay independent**, asking for their opinion and letting them **have a say in** decisions that affect them."],["A","And your mahalla did something about it?"],["B","Yes. This spring we started **an intergenerational project**. [[2]] let both generations teach each other. [[3]] students teach older neighbours to use banking apps, and older neighbours teach us to repair, cook and plan."],["A","Has it worked?"],["B","I think so. [[4]] everyone **makes a contribution**: nobody is only the one who is helped. And we have all learnt to **look out for** each other."]],gaps:[[1,"In my view,"],[2,"Just to be clear, are you saying that"],[3,"The idea was to"],[4,"For instance,"],[5,"The main reason is that"]],questions:[{q:"What surprised Aziza about Anvar aka?",o:["People were rude to him.","He felt nobody wanted his opinion.","He refused to talk about his work."],a:1,why:"“Everyone is polite to me, but nobody asks what I think.” He loves to pass on his knowledge, so C is wrong."},{q:"When Leo checks, Aziza says the problem is …",o:["rudeness to older people.","not really listening to them.","their lack of money."],a:1,why:"“No, not rude. But … even loving families can take them for granted: they visit, but they don’t really listen.”"},{q:"What was the aim of the mahalla’s project?",o:["learning from each other","new jobs for older people","banking apps for students"],a:0,why:"“The idea was to let both generations teach each other.” In the project, students teach the banking apps; they don’t learn them."},{q:"Why has the project worked, in Aziza’s view?",o:["Older people use apps daily.","Students get extra marks.","Everyone gives something."],a:2,why:"“The main reason is that everyone makes a contribution: nobody is only the one who is helped.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, an example, a reason? Which one does Leo use to check meaning, and which one explains the purpose of the project?",groups:[["Opinion",[1]],["Checking meaning",[2]],["Purpose",[3]],["Example",[4]],["Reason",[5]]]},use:{q:"Should every university run a project where students and older people learn from each other? Why or why not?",by:"amara",model:"In my view, every university should run one, even a small one. The main reason is that both sides gain something: students gain experience, and older people stay connected. For instance, at my medical school in Lagos, students record local history with older visitors at a community centre once a month, and the visitors teach us a lot about patience and listening. Of course, a project like this needs good organisation. So, all in all, it costs little and gives a lot back.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Yf,DIALOGUE:np,DRILLS:Kf,LESSON:Gf,LEVELS:tp,LISTEN:lp,MAIN:Zf,PRON:sp,QUESTIONS:ep,ROUNDS:Jf,TWISTS:$f,UNIT:Uf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"5542c15d-ffb8-48e5-8d71-34ee51b1bb1e",title:"Headphones Audio",creator:"Daria Nepriakhina",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/16FDCF0DFC.jpg",page:"https://stocksnap.io/photo/headphones-audio-16FDCF0DFC",license:"CC0",width:2400,height:1352},up={openverse:"c7d5fbea-32e9-4c8f-9c5b-203c40100ea5",title:null,creator:null,source:"rawpixel",url:"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcHg3NjkwMDUtaW1hZ2Uta3d5b2pmdTMuanBn.jpg",page:"https://www.rawpixel.com/image/5945002/free-public-domain-cc0-photo",license:"CC0",width:3872,height:2592},cp={openverse:"2ac1699a-a665-4497-997c-b506ae076ebf",title:"Microphone Audio",creator:"Maciej Korsan",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/IQVHQYS3GL.jpg",page:"https://stocksnap.io/photo/microphone-audio-IQVHQYS3GL",license:"CC0",width:4837,height:3225},dp={openverse:"e49c816f-6584-477a-a93a-fc978cd2cfe1",title:"Free open notebook study table",creator:null,source:"rawpixel",url:"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvbnM0MzgtaW1hZ2Uta3d2d245cmwuanBn.jpg",page:"https://www.rawpixel.com/image/5916233/image-book-public-domain-notebook",license:"CC0",width:5472,height:3648},hp={openverse:"6746b100-3ae3-4acc-b0a8-dd8f76f70a04",title:"People Girls",creator:"Brodie Vissers",source:"stocksnap",url:"https://cdn.stocksnap.io/img-thumbs/960w/Y2AHVPYB51.jpg",page:"https://sto
