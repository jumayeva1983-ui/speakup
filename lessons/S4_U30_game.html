l courts of three: one **Chair** and two **Counsel**. First, the Chair rules **who must prove what**. Later, each side may propose **amendments**, and the final ruling is on the motion **as amended**. The motion: **This board would license GV-12 wheat for sale to farmers in Dalmira.**"],rule:"Rule of respect: we argue about evidence, risks and rules, never about people. The case file is fictional: no real company, product or study is named, and there are no real statistics."}},Gf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Two Club speakers on the podcast (exam Part 3): who says what? Mateo’s uncle grows genetically modified soya in Brazil; Aziza’s grandmother saves her own tomato seeds in Navoi. Listen for the condition, notice how Mateo checks meaning and how Aziza sets a condition, then use their phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read statements 1–4 first (books open, text covered) and guess who said each one, then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Leo, ticks what he does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio. Students talk about food, farming and labels in general, not about their own health or diet.","The podcast is read by the computer’s voices. If you record it with real voices, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"b2p",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about science and food (geNEtic, techNOlogy), and /ɔː/ or /ɔɪ/ (corn – coin). (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Should we trust food that science has changed?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about risks, evidence and food. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most careful argument they heard (use the wheel)."]},{id:"game",icon:"⚖️",name:"The Seed Hearing",min:18,lv:"c1",group:"5 courts of 3",kind:"three",roles:["Chair of the Seed Board","Counsel for the Applicant","Counsel for the Objectors"],desc:"Court & Debate as a licensing hearing in courts of three: the Chair first rules who must prove what; the two counsel cross-examine each other, then propose amendments to the motion. The Chair rules on the motion as amended. (Book: section 6 · G8)",howto:["15 students = 5 courts of three, all at the same time. Each court plays on its own phone or laptop (the game works offline). Every student speaks in every round.","Each student turns over one role card: the Chair of the Seed Board, Counsel for the Applicant (license GV-12) and Counsel for the Objectors (refuse the licence). There are no witnesses: the counsel answer each other’s questions for their clients.","Timing: roles 1 min · Prepare 3 min · Who must prove it? 2 min · Openings 2 min · Cross-examination 4 min · Amendments 3 min · Closing and ruling 3 min.","Only one projector? Run one court at the front and let the class act as the Board: after the amendments, everybody votes on each one with a show of hands, and the Chair rules. Two students left over? Make a court of four with two Chairs who must agree."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about a university food project, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Uf={listen:{ref:"Book: Lesson 60, section 2 · Listen and Notice",steps:["**Before you listen:** read statements 1–4 and guess who probably said each one: Mateo, Aziza or both of them.","Press **Play the podcast**. Listen for the condition: _provided that …_ means “yes, but only if”. A question such as _Are you implying that …?_ is not a view at all. Choose A, B or C. Press an option: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what the speaker said; tap a line to hear it again.","Sort the five phrases: opinion, reason, checking meaning, example and condition.","**Your turn:** listen to Leo, tick what he does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","Number 3 is C, both. Mateo talks about new crops too.","gives an answer"],["B","He does, but does he set a condition, or does he only ask a question?","challenges politely"],["A","“Are you implying that we should never plant anything new?” That’s Mateo. And Aziza: “I could accept a seed like that, provided that farmers are still free to save their own seed.”","checks the text again"],["B","So only Aziza says “yes, but only if”. It’s B.","paraphrases"]],checks:[["Why should you listen for the condition?","a speaker may agree only if something else is true. Aziza says “I could accept a seed like that, provided that farmers are still free to save their own seed.” Mateo only asks a question."],["Which phrase does Mateo use to check meaning?","Are you implying that …?"]]},pron:{ref:"Book: Lesson 60, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-ic**, **-ology** and **-tion**, the syllable is strong (*geNEtic*, *techNOlogy*, *nuTRItion*). Long words still have only **one** strong syllable.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /ɔː/ (*corn*, *ball*) or /ɔɪ/ (*coin*, *boil*)?","/ɔː/ is **long and steady**: round your lips and hold the sound. /ɔɪ/ **glides**: start with *o* and move towards *i*, like Uzbek *oy*.","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *genetic*. Which syllable is strong?",""],["A","The first: *GE*-ne-tic?","a guess"],["T","Listen again: ge-*NE*-tic. What comes after it?","the teacher gives a clue"],["A","*-tic*! So the syllable before *-ic* is strong: ge-*NE*-tic.","uses the rule"],["T","Good. Now *technology*.",""],["B","tech-*NO*-lo-gy: the syllable before *-ology*.","uses the rule"],["T","Yes! Now listen: *coin*. First or second: *corn* or *coin*?",""],["B","Second: *coin*. It moves at the end; *corn* stays the same.","listens for the glide"]],checks:[["Where is the stress in *biology*?","on O: bi-O-lo-gy (the syllable before -ology)."],["Where is the stress in *nutrition*?","on TRI: nu-TRI-tion (the syllable before -tion)."],["Which word glides: *jaw* or *joy*?","*joy*: /ɔɪ/ moves from *o* towards *i*; *jaw* stays long and steady."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*To start with*, *That said*, *Take …*, *Ultimately*).","Make sure your answer has a clear **position**, a **condition** (when you would and would not trust it), one **example** and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Amara’s answer changed in 4/3/2",lines:[["amara","Um, I think trust is … it must be earned? My aunt has a farm near Lagos, and drought and insects are big problems for her. So new seeds can help. But, um, who controls the seeds? And labels. So, case by case.","Attempt 1 · 90 s · the key words, many pauses"],["amara","I don’t think we should trust or reject this food automatically: trust has to be earned. Take my aunt’s farm near Lagos: drought and insects can ruin a whole season, so a stronger seed sounds like a gift. That said, I’d want to know who controls the seeds. And labels must be honest. So, case by case.","Attempt 2 · 60 s · linking phrases"],["amara","Trust shouldn’t be automatic either way; it has to be earned. On my aunt’s farm near Lagos, a dry month or a cloud of insects can wipe out a season, so a tougher seed would be welcome. What would worry me is who controls the seed, and whether shoppers are told the truth on the label. So I’d judge each crop on its own evidence: case by case.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Should all GM food be labelled?",lines:[["leo","**Without a doubt.** **Whatever you think about** GM crops, people have a right to know what they eat. **The burden of proof** should be on the company, not on shoppers. Clear labels **protect consumer choice**. **On the other hand,** a label shouldn’t look like a warning. So yes, **provided that** the wording is neutral.","speaker · 1 minute"],["nur","I heard six phrases: *Without a doubt*, *Whatever you think about*, *the burden of proof*, *protect consumer choice*, *On the other hand* and *provided that*. That’s a full row: **Bingo!**","listener reports"],["leo","Six points plus three for the Bingo: nine points!","count the points"],["nur","Next time, try *err on the side of caution*. It’s on my card, and it fits your idea about neutral labels.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you need to know real statistics to speak?","no: give reasons and examples; never invent numbers."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*We have money for one food project …*).","Click the lines in order. Each line answers the line before. Mateo and Aziza take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a snack for the club meeting",lines:[["A","We can bring one snack to the club meeting: fruit or homemade biscuits.","opens the topic"],["B","Biscuits are nice, but somebody has to bake them tonight.","a doubt"],["A","True. Fruit is easier, and everyone can eat it.","an argument"],["B","Then let’s take fruit, and bake biscuits for the end-of-term party.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G8 · section 6",steps:["Make courts of three. Each student turns over one **role card**: the **Chair** of the Seed Board, **Counsel for the Applicant** (license GV-12) and **Counsel for the Objectors** (refuse the licence).","**Round 1 · Prepare (3 min):** open the eight **exhibits**. Each counsel picks the two that help their side most. The Chair notes one question for each counsel.","**Round 2 · Who must prove it?** Each counsel says in **45 seconds** who should carry the **burden of proof**. The Chair **rules**: who must prove what, and how strong the proof must be.","**Round 3 · Openings:** each counsel speaks for **60 seconds**, keeping the Chair’s ruling in mind.","**Round 4 · Cross-examination:** each counsel asks the **other counsel** two questions (a card or their own). The other counsel answers for their client: short, honest, no speeches.","**Round 5 · Amendments:** each counsel opens one **amendment card** and proposes it or argues against it. The other counsel answers. The Chair **adopts or rejects** each amendment.","**Round 6 · Closing and ruling:** closings in **45 seconds**. The Chair reads the motion **as amended**, scores both sides and gives the ruling."],exTitle:"Sample game: Rounds 2, 4, 5 and 6 in Court A",lines:[["","Chair: Aziza · Counsel for the Applicant: Mateo · Counsel for the Objectors: Nur",""],["nur","**Our case is simple:** a new seed should prove it is safe before it reaches a single field. **The burden of proof** belongs to the company that wants to sell it.","Round 2 · the Objectors on the burden"],["mateo","We accept the burden. **But it must be a burden we can actually meet.** No seed can prove there is no risk at all; we can show there is no evidence of harm.","Round 2 · the Applicant on the burden"],["aziza","**The board rules that** the burden lies on the Applicant, **on the balance of the evidence**. The Objectors may not rely on fears alone: if you name a risk, point to it in the file.","the Chair rules"],["","… Round 4 · Cross-examination …",""],["nur","Counsel, can a farmer who buys GV-12 save seed from her own harvest and sow it next year?","a short, closed question"],["mateo","**Under the current contract, no.** She would buy new seed each season.","an honest answer"],["","… Round 5 · Amendments …",""],["mateo","(opens an amendment card) **We would accept a licence on these terms:** farmers may save and replant GV-12 seed from their own harvest. **That answers the Objectors’ strongest point.**","the Applicant proposes an amendment"],["aziza","**The board adopts the amendment.** The motion now reads: *This board would license GV-12 for sale to farmers in Dalmira, and farmers may save and replant its seed.*","the Chair rules on the amendment"],["","… Round 6 · Ruling …",""],["aziza","**Having heard both counsel, the board grants the licence as amended,** by twenty-two points to eighteen. **What tipped the balance was** the Applicant’s amendment on saved seed; without it, the Objectors would have won.","the Chair gives the ruling"]],checks:[["What does the Chair decide in Round 2?","who must prove what (the burden of proof) and how strong the proof must be."],["Who answers questions in the cross-examination?","the other counsel, for their client: short and honest."],["What is the final ruling about?","the motion as amended: the original motion plus the amendments the Chair adopted."]]},drills:{ref:"Book: Lesson 60 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Qf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Many farmers in Brazil grow ___, such as soya that insects do not destroy.",o:["genetically modified crops","consumer choice","food security"],a:0},{q:"GV-12 was developed to be more ___ drought than ordinary wheat.",o:["resistant to","dependent on","a matter of"],a:0},{q:"Better seeds and better water use could ___ in dry years.",o:["boost crop yields","err on the side of caution","label food clearly"],a:0},{q:"One season of tests cannot show the ___ of a new crop.",o:["long-term effects","consumer choice","crop yields"],a:0},{q:"If pollen travels to the next field, the new wheat could ___ organic farms.",o:["pose a risk to","boost","label"],a:0},{q:"When nobody knows the answer, some people prefer to ___.",o:["err on the side of caution","boost crop yields","become dependent on"],a:0},{q:"Before the board decides, it has to ___ carefully.",o:["weigh up the risks and benefits","pose a risk","save seeds"],a:0},{q:"If farmers must buy new seed every year, they may ___ one company.",o:["become dependent on","be resistant to","weigh up"],a:0},{q:"A region that can always feed its people has good ___.",o:["food security","crop yields","consumer choice"],a:0},{q:"Shops should ___, so shoppers know what they are buying.",o:["label food clearly","pose a risk","boost yields"],a:0},{q:"If there are no labels, there is no real ___.",o:["consumer choice","food security","long-term effect"],a:0},{q:"In the end, whether people buy it is ___.",o:["a matter of trust","a crop yield","a long-term effect"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Scientists changed the wheat. → **passive: The wheat …**",a:"The wheat was changed by scientists."},{p:"The wheat was changed by scientists. → **The wheat has been …(to need less water)**",a:"The wheat has been changed to need less water."},{p:"The company must prove it is safe. → **It is the company that …**",a:"It is the company that must prove it is safe. (cleft sentence)"},{p:"We don’t know the long-term effects. → **What we don’t know …**",a:"What we don’t know is the long-term effects."},{p:"The board will license it. There must be labels. → **only if**",a:"The board will license it only if there are clear labels."},{p:"The board will license it only if … → **Only if …(inversion)**",a:"Only if there are clear labels will the board license it."},{p:"We should be careful. The risk is small. → **However small …**",a:"However small the risk is, we should be careful."},{p:"If they had tested it longer, we would trust it. → **Had they …**",a:"Had they tested it longer, we would trust it."},{p:"The seed may cause problems. → **There is a chance that …**",a:"There is a chance that the seed may cause problems."},{p:"Farmers need water. They need fair prices. → **not only … but also**",a:"Farmers need not only water but also fair prices."},{p:"Nobody has found any harm. → **No harm …(present perfect passive)**",a:"No harm has been found so far."},{p:"It’s safe. That doesn’t mean it’s fair. → **Even if …**",a:"Even if it’s safe, that doesn’t mean it’s fair."}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"GM food is dangerous.",a:"There may be long-term effects that we can’t yet rule out."},{p:"It gives farmers more food.",a:"It could significantly boost crop yields in dry years."},{p:"We should be careful.",a:"Where the risks are uncertain, we should err on the side of caution."},{p:"People should know what they buy.",a:"Clear labelling protects consumer choice."},{p:"Farmers will need the company.",a:"Farmers could become dependent on a single supplier."},{p:"Nobody has shown it is bad.",a:"There is no evidence of harm, but that is not the same as evidence of safety."},{p:"Yes, but with rules.",a:"I’d grant the licence, subject to strict conditions."}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ Genetic modified wheat needs less water.",o:["Genetically modified wheat needs less water.","Genetic modifying wheat needs less water.","Genetical modified wheat needs less water."],a:0,why:"an adverb (genetically) describes the adjective (modified)"},{q:"✗ We must protect the nature.",o:["We must protect nature.","We must protect a nature.","We must protect the natures."],a:0,why:"nature in general has no article"},{q:"✗ Some pesticides are harmful for health.",o:["Some pesticides are harmful to health.","Some pesticides are harmful at health.","Some pesticides harm to health."],a:0,why:"harmful to (and: harm somebody, without “to”)"},{q:"✗ I am agree with the Objectors.",o:["I agree with the Objectors.","I am agreed with the Objectors.","I agreeing with the Objectors."],a:0,why:"agree is a verb: I agree (not “I am agree”)"},{q:"✗ The board needs more informations about the seed.",o:["The board needs more information about the seed.","The board needs more an information about the seed.","The board needs many informations about the seed."],a:0,why:"information is uncountable: no -s, no “an”"},{q:"✗ The results depend of the weather.",o:["The results depend on the weather.","The results depend from the weather.","The results are depend on the weather."],a:0,why:"depend on"},{q:"✗ Farmers can’t afford buying new seed every year.",o:["Farmers can’t afford to buy new seed every year.","Farmers can’t afford buy new seed every year.","Farmers can’t afford for buying new seed every year."],a:0,why:"afford + to + verb"},{q:"✗ The scientists made a research on the wheat.",o:["The scientists did research on the wheat.","The scientists made researches on the wheat.","The scientists did a researches on the wheat."],a:0,why:"DO research; research is uncountable (or: carried out a study)"}]},{title:"Stress: words about science and food",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"about genes, passed from parents to children",o:["geNEtic","GEnetic"],a:0,why:"Before -ic, the syllable is strong."},{q:"the science of living things",o:["biOlogy","BIology"],a:0,why:"Before -ology, the syllable is strong."},{q:"the use of science in machines and tools",o:["techNOlogy","TECHnology"],a:0},{q:"grown without artificial chemicals",o:["orGAnic","ORganic"],a:0},{q:"the food your body needs to stay healthy",o:["nuTRItion","NUtrition"],a:0,why:"Before -tion, the syllable is strong."},{q:"a chemical used to kill insects on crops",o:["PESticide","pestiCIDE"],a:0},{q:"not easily harmed or affected by something",o:["reSIStant","RESistant"],a:0}]}],Yf={cardsStep:"Role cards",cardsTitle:"Role cards",cardsHint:"Each student picks one card: it turns over and opens. Read your role aloud to your court and keep it for the whole hearing. Two Counsel argue the case for their clients; the Chair rules on the burden of proof, on each amendment and on the licence.",backWord:"Role",hiddenLabel:"Tip",hiddenAll:"Show all tips",evidenceWord:"Exhibit",evidenceTitle:"Exhibits: the GV-12 case file",evidenceHint:"Open all eight exhibits. Each one is marked with the side it helps more. Counsel: pick your side’s two strongest and think about how the other counsel will attack them. Chair: note one question for each counsel.",evidenceHelp:{b2:["This exhibit shows that …","It helps our side, because …","The other side will say …"],c1:["On closer inspection, this exhibit shows …","Read alongside Exhibit …, it suggests …","This proves less than it appears to, since …"]},questionWord:"Question",questionTitle:"Cross-examination cards",questionHint:"Counsel: open a card marked with **your** side, read the question aloud to the **other counsel** and wait for the answer. You may also ask your own questions. Answer for your client: short, honest, no speeches. If the honest answer hurts your side, give it, then add one sentence of context.",questionHelp:{b2:["Can you confirm that …?","Is it true that …?","What would happen if …?"],c1:["Would you accept that …?","Isn’t it the case that …?","Under the current plan, what happens when …?"]},twistWord:"Amendment",twistTitle:"Amendment cards",twistHint:"Counsel: open **one** amendment card. Decide: do you **propose** it (“We would accept a licence on these terms”) or **argue against** it? The other counsel answers in 20 seconds. Then the Chair **adopts** or **rejects** it. The Chair may adopt **at most two** amendments.",twistHelp:{b2:["We propose this change, because …","We can’t accept this, because …","The board adopts / rejects the amendment."],c1:["We would accept a licence on these terms: …","This amendment answers the other side’s strongest point: …","The motion now reads: …"]},teamWord:"Court",teamIcon:"",teamKind:"three",teams:5},Jf={motionWord:"The motion before the board",motion:"This board would license GV-12 wheat for sale to farmers in Dalmira.",sides:[{name:"Applicant",short:"License GV-12",stance:"Dalmira’s harvests are failing more often, and GV-12 survived dry seasons in the Board’s own trials. No harm has been found in the safety tests, and the wheat needs less water. Farmers should be free to choose it."},{name:"Objectors",short:"Refuse the licence",stance:"One season of tests cannot show long-term effects. The contract stops farmers saving seed, pollen could reach organic fields, and shoppers would not be told what is in their bread. The Board should wait."}],judges:1,criteria:["Arguments","Meeting the burden of proof","Cross-examination","Amendments","Language"],turnsTitle:"Order of speakers",verdictTitle:"The Chair’s ruling sheet",verdictHint:"The Chair scores both sides 0–5 for each criterion and presses **Announce the ruling**: the side with more points wins the hearing. Then the Chair reads the motion **as amended** and gives the ruling: the licence is **granted** on those terms, or **refused**. Score the arguments and answers, never the speakers as people.",announceLabel:"Announce the ruling",winWord:"wins the hearing"},_f=[{name:"Round 1 · Prepare",lv:"c1",bloom:"Understand / Analyse",by:"nur",seconds:180,tool:"evidence",q:"Open the exhibits. Counsel: pick your side’s **two strongest exhibits** and think about how the other side will attack them. Chair: note **one question for each counsel**.",help:{b2:["the strongest exhibit","they will say …","our answer will be …"],c1:["the exhibit that does most for us","the weak spot in their file","the question they can’t dodge"]},model:"The exhibit that does most for us is the seed contract: farmers who buy GV-12 cannot save seed for next year. Read alongside Kuralay Ospanova’s letter about poor harvests, it suggests the farmers who need help most would also be the ones least able to pay every season. The weak spot in their file is the length of the feeding study: one season. That is the question they can’t dodge."},{name:"Round 2 · Who must prove it?",lv:"c1",bloom:"Evaluate",by:"aziza",seconds:0,tool:"turns",turns:[{side:1,who:"Counsel for the Objectors",task:"Say who should carry the burden of proof, and how strong the proof must be. Use the idea of caution.",seconds:45},{side:0,who:"Counsel for the Applicant",task:"Answer: what can a new seed reasonably be asked to prove, and what can it never prove?",seconds:45},{side:null,who:"Chair",task:"Rule: *The burden lies on … to show …, on the balance of the evidence / beyond reasonable doubt.* Add one sentence about what the other side must do.",seconds:30}],q:"Who must prove it? Before the case begins, each counsel argues in **45 seconds** who should carry the **burden of proof**. Then the Chair **rules**: who must prove what, and how strong the proof must be.",help:{b2:["the company must show that …","nobody can prove that …","the board rules that …"],c1:["the burden of proof should rest on …","no seed can prove a negative; what it can show is …","the board rules that the burden lies on …, on the balance of the evidence"]},model:"Having heard both counsel, the board rules that the burden lies on the Applicant. A new seed is licensed only if the Applicant shows, on the balance of the evidence, that it is safe to eat and that the risks to neighbouring farms can be managed. The Applicant does not have to prove that there is no risk at all; no product could. But the Objectors may not rely on fears alone: if they name a risk, they must point to it in the case file."},{name:"Round 3 · Opening statements",lv:"c1",bloom:"Apply / Analyse",by:"mateo",seconds:0,tool:"turns",turns:[{side:0,who:"Counsel for the Applicant",task:"Say what you are asking the board for and give two arguments. Show how you will meet the burden the Chair set.",seconds:60},{side:1,who:"Counsel for the Objectors",task:"Give two arguments. Show why the Applicant cannot meet the burden, or why the risks are not managed.",seconds:60}],q:"Opening statements: each counsel presents the case in **60 seconds**, keeping the Chair’s ruling on the burden of proof in mind.",help:{b2:["we are asking the board to …","firstly · secondly","we will show that …"],c1:["the question for the board is not whether … but whether …","we will meet the burden the Chair has set by showing …","the file itself tells us …"]},model:"The question for this board is not whether GV-12 is perfect, but whether Dalmira’s farmers should be free to choose it. We will meet the burden the Chair has set in two ways. Firstly, the Board’s own trials show GV-12 producing grain in a dry season in which ordinary wheat gave very little. Secondly, the safety panel found no difference between GV-12 grain and ordinary wheat in nutrients or known allergens. When the rain fails, a farmer with no choice has no harvest."},{name:"Round 4 · Cross-examination",lv:"c1",bloom:"Analyse / Evaluate",by:"nur",seconds:0,tool:["questions","turns"],turns:[{side:1,who:"Counsel for the Objectors → Counsel for the Applicant",task:"Ask two questions (a card marked “Refuse the licence” or your own). The Applicant’s counsel answers for the client.",seconds:90},{side:0,who:"Counsel for the Applicant → Counsel for the Objectors",task:"Ask two questions (a card marked “License GV-12” or your own). The Objectors’ counsel answers for the client.",seconds:90},{side:null,who:"Chair",task:"Ask either counsel one question you prepared in Round 1.",seconds:30}],q:"Cross-examination: each counsel asks the **other counsel** two questions. Ask short questions that have one honest answer. When you answer, answer for your client: short and honest, then one sentence of context.",help:{b2:["Can you confirm that …?","Yes, that’s right, but …","No, and here’s why: …"],c1:["Would you accept that …?","I’ll answer that directly: …","That’s true, as far as it goes; what it leaves out is …"]},model:"I’ll answer that directly: yes, the feeding study lasted one season, and no, there is no longer study of GV-12 yet. That’s true, as far as it goes. What it leaves out is that the panel also compared the grain itself with ordinary wheat, nutrient by nutrient, and found no difference. A longer study would be welcome, and my client would accept one as a condition of the licence."},{name:"Round 5 · Amendments",lv:"c1",bloom:"Evaluate / Create",by:"mateo",seconds:0,tool:["twists","turns"],turns:[{side:0,who:"Counsel for the Applicant",task:"Open one amendment card. Propose it or argue against it. The other counsel answers in 20 seconds.",seconds:45},{side:1,who:"Counsel for the Objectors",task:"Open another amendment card. Propose it or argue against it. The other counsel answers in 20 seconds.",seconds:45},{side:null,who:"Chair",task:"Adopt or reject each amendment (at most two). Then read the motion as amended aloud.",seconds:45}],q:"Amendments: each counsel opens **one amendment card** and decides whether to **propose** it or **argue against** it. The other counsel answers. The Chair **adopts or rejects** each one, then reads the motion **as amended**.",help:{b2:["we propose this change, because …","we can’t accept this, because …","the motion now says …"],c1:["we would accept a licence on these terms: …","this amendment answers their strongest point","the board adopts the amendment; the motion now reads: …"]},model:"We would accept a licence on these terms: every product made from GV-12 must say so clearly on the label. This amendment answers the Objectors’ strongest point about consumer choice, and it costs our client nothing but honesty. If GV-12 is as safe as the panel found, we have nothing to hide. Shoppers who want to avoid it can do so; farmers who need it can still grow it. Choice for farmers and choice for shoppers: that is a fair balance."},{name:"Round 6 · Closing and ruling",lv:"c1",bloom:"Evaluate / Create",by:"aziza",seconds:0,tool:["turns","verdict"],turns:[{side:1,who:"Counsel for the Objectors",task:"Closing statement: has the Applicant met the burden, even with the amendments? Your two best points. No new arguments.",seconds:45},{side:0,who:"Counsel for the Applicant",task:"Closing statement: how you met the burden, and why the amended motion answers the risks. No new arguments.",seconds:45},{side:null,who:"Chair",task:"Score both sides and announce the result. Read the motion as amended, give the ruling (licence granted on these terms, or refused) and say what tipped the balance.",seconds:90}],q:"Closing and ruling: the counsel sum up in **45 seconds**. Then the Chair scores, reads the motion **as amended** and gives the ruling: **granted** on those terms, or **refused**.",help:{b2:["to sum up, we have shown …","the board grants / refuses the licence","the most important moment was …"],c1:["the burden has (not) been met, because …","having heard both counsel, the board grants the licence as amended / refuses the licence","what tipped the balance was …"]},model:"Having heard both counsel, the board grants the licence as amended, by twenty-two points to eighteen. The motion now reads: this board would license GV-12 wheat for sale to farmers in Dalmira; every product made from it must be clearly labelled, and farmers may save and replant its seed. On the burden of proof: the Applicant has shown, on the balance of the evidence, that the grain is safe to eat. What tipped the balance was the seed-saving amendment. Without it, the Objectors’ point about dependence would have carried the day."}],$f=[{e:"⚖️",n:"The Chair",r:"Chair of the Dalmira Seed Board",lines:[["Your job","Call each speaker and start the timer. Rule who must prove what (Round 2), ask one question in the cross-examination, adopt or reject the amendments (at most two), read the motion as amended, score both sides and give the ruling."],["Useful phrase","The board rules that the burden lies on … · The board adopts the amendment. · The board grants the licence as amended."]],x:"Your ruling on the burden of proof is the yardstick for the whole hearing. In your final ruling, say whether the burden was met."},{e:"🌾",n:"Counsel for the Applicant",r:"For Granavel Seeds and the dry-district farmers · license GV-12",lines:[["Your side","The board should license GV-12 for sale to farmers in Dalmira. It survived dry seasons in the Board’s trials, no harm was found in the safety tests, and farmers should be free to choose it."],["Your job","Argue the burden (Round 2), opening (Round 3), ask and answer questions (Round 4), one amendment (Round 5) and the closing (Round 6)."],["Useful phrase","No seed can prove there is no risk at all; what we can show is that there is no evidence of harm."]],x:"An amendment can win the case for you: if you accept a fair condition before the Objectors demand it, their strongest point disappears."},{e:"🛡️",n:"Counsel for the Objectors",r:"For the Dalmira Consumers’ Union and organic growers · refuse the licence",lines:[["Your side","The board should refuse the licence for now. The tests lasted one season, the contract stops farmers saving seed, pollen could reach organic fields, and there would be no labels."],["Your job","Argue the burden (Round 2), opening (Round 3), ask and answer questions (Round 4), one amendment (Round 5) and the closing (Round 6)."],["Useful phrase","The absence of evidence of harm is not the same as evidence of safety."]],x:"Do not argue that science is bad. Argue that this file is not yet good enough, and say exactly what is missing."}],ep=[{t:"Every product made from GV-12 must say so clearly on the label.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"leo",m:"We would accept a licence on these terms. A clear label costs little and protects consumer choice: shoppers who want to avoid GV-12 can do so. The only condition is that the wording is neutral, “made with genetically modified wheat”, not a warning sign. Information is not an accusation."},{t:"Farmers may save and replant GV-12 seed from their own harvest without paying again.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"aziza",m:"This amendment answers the Objectors’ strongest point: dependence. Farmers in Dalmira have saved seed for generations, and a licence that ends that tradition would make the poorest farmers pay every season. If GV-12 is a gift to dry districts, it should not come with a yearly bill attached."},{t:"A licence for five years only, in the three driest districts; then a new hearing with the new evidence.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"nur",m:"This amendment lets the Board learn without betting the whole province on one season of tests. Farmers who need GV-12 most get it now; everyone else waits. In five years, the Board will have real harvests, real fields and real data, and the next hearing can decide on evidence instead of predictions."},{t:"A buffer strip of ordinary crops between every GV-12 field and any organic farm.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"mateo",m:"This amendment protects organic growers like Munisa Davletova without banning anybody. The exact width can be set by the Board’s scientists. If the Applicant believes the risk of pollen travelling is small, a buffer strip costs them very little; if the risk is real, the strip is exactly what is needed."},{t:"No sale until the university runs one more independent test season on its own fields.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"amara",m:"This amendment answers the question of trust. So far, most of the evidence comes from tests the Applicant paid for. One season on independent fields, run by people with nothing to gain, would give the Board, the farmers and the shoppers a result they can believe. Against that, the farmers lose one more season; that cost must be weighed honestly."},{t:"Granavel must publish all its safety data, including the studies that found nothing.",q:"Propose this amendment or argue against it in 45 seconds. Then the other counsel answers in 20 seconds.",by:"leo",m:"We would accept a licence on these terms. If the data is good, publishing it builds trust; if it isn’t, the Board needs to know. Publishing the studies that found nothing matters too: they show the full picture, not only the best results. Other scientists can then check the work, which is how science earns trust."}],tp=[{t:"Objectors ask: How long did the feeding studies of GV-12 last?",q:"Counsel for the Objectors: ask this question. Counsel for the Applicant: answer honestly in one or two sentences, then add one sentence of context.",by:"mateo",m:"One season. That is true, and a longer study would be welcome; my client would accept one as a condition of the licence. But the panel also compared the grain itself with ordinary wheat and found no difference in nutrients or known allergens."},{t:"Objectors ask: Can a farmer save GV-12 seed from her harvest and sow it next year?",q:"Counsel for the Objectors: ask this question. Counsel for the Applicant: answer honestly in one or two sentences, then add one sentence of context.",by:"mateo",m:"Under the current contract, no: she would buy new seed each season. My client is open to discussing that, because a seed that farmers cannot afford helps nobody."},{t:"Objectors ask: Who paid for the field trials and the safety tests?",q:"Counsel for the Objectors: ask this question. Counsel for the Applicant: answer honestly in one or two sentences, then add one sentence of context.",by:"mateo",m:"Most of the tests were paid for by Granavel; the field trials were run on the Board’s own plots. That is how new seeds are usually tested, but we accept that independent checks would build trust."},{t:"Objectors ask: Would shoppers be able to tell whether their bread contains GV-12?",q:"Counsel for the Objectors: ask this question. Counsel for the Applicant: answer honestly in one or two sentences, then add one sentence of context.",by:"mateo",m:"Under the current plan, no: there is no labelling. We don’t think a label is needed for safety, but we would not oppose a neutral one."},{t:"Applicant asks: Have your clients found any harm caused by GV-12, in any test?",q:"Counsel for the Applicant: ask this question. Counsel for the Objectors: answer honestly in one or two sentences, then add one sentence of context.",by:"nur",m:"No, we have not. But one season of tests can only find harm that appears within one season, and that is exactly our point."},{t:"Applicant asks: What should a farmer do when the rain fails and ordinary wheat dies?",q:"Counsel for the Applicant: ask this question. Counsel for the Objectors: answer honestly in one or two sentences, then add one sentence of context.",by:"nur",m:"That is a real and painful problem, and we don’t pretend otherwise. There are other answers too: better irrigation, older drought-hardy wheat varieties and help for farmers in bad years. GV-12 is one possible answer, not the only one."},{t:"Applicant asks: Farmers have changed plants by choosing seeds for thousands of years. Why is this different?",q:"Counsel for the Applicant: ask this question. Counsel for the Objectors: answer honestly in one or two sentences, then add one sentence of context.",by:"nur",m:"Choosing the best seeds changes plants slowly, over many harvests. Changing genes in a laboratory is faster and can do things breeding cannot, which is why it deserves its own careful checks. Faster is not the same as dangerous, but it is a reason to look closely."},{t:"Applicant asks: If GV-12 were clearly labelled, would your clients still object?",q:"Counsel for the Applicant: ask this question. Counsel for the Objectors: answer honestly in one or two sentences, then add one sentence of context.",by:"nur",m:"A label would answer one of our four concerns, and we would welcome it. It would not answer the questions about saved seed, organic fields and long-term effects."}],np=[{side:0,t:"Field trial note: in a dry season on the Board’s test plots, GV-12 produced grain while ordinary wheat on the next plots gave very little.",q:"What does this exhibit show? Use it to support the Applicant.",by:"mateo",m:"On closer inspection, this exhibit matters because the trial was on the Board’s own plots, not the company’s. It shows GV-12 doing exactly what it was designed to do in the conditions Dalmira’s farmers fear most. A harvest in a bad year is the difference between a farm surviving and a farm closing."},{side:0,t:"Letter from Kuralay Ospanova, a farmer in the driest district: “Our last harvests were poor. I can’t wait ten more years for studies.”",q:"How can the Applicant use this letter without exaggerating it?",by:"amara",m:"This letter reminds the Board that waiting is not a neutral choice: it has a cost, and farmers pay it. Kuralay doesn’t claim GV-12 is perfect; she asks for the freedom to choose. The Applicant should use it to show that caution protects some people and harms others."},{side:0,t:"Safety panel summary: in the panel’s tests, GV-12 grain showed no difference from ordinary wheat in nutrients or known allergens.",q:"What does this summary show about safety? Use it to support the Applicant.",by:"leo",m:"This summary shows that the grain on the plate looks the same as the grain we already eat, in every way the panel measured. It doesn’t prove there is no risk, and the Applicant shouldn’t claim that. But it does meet the burden of showing there is no evidence of harm."},{side:0,t:"Water office note: GV-12 needs less irrigation, so more water would stay in the province’s canals in summer.",q:"How does this note widen the Applicant’s case beyond the farmers?",by:"nur",m:"This note shows that GV-12 is not only about one farmer’s harvest: water saved on wheat fields is water left for other crops, for towns and for nature. In a dry province, a crop that drinks less helps everyone downstream."},{side:1,t:"Contract extract: farmers who buy GV-12 agree not to save seed for replanting; new seed must be bought every season.",q:"What risk does this contract show? Use it to support the Objectors.",by:"aziza",m:"This exhibit shows that the licence is not only about science; it is about power. Farmers who have always saved seed would have to buy it every year from one company. In a bad year, the poorest farmers could not afford it, and the province’s food security would depend on one supplier’s prices."},{side:1,t:"Letter from Munisa Davletova, an organic grower: “If pollen from GV-12 reaches my fields, I could lose my organic certificate and my buyers.”",q:"How can the Objectors use this letter?",by:"amara",m:"This letter shows that a licence for some farmers could take choices away from others. Munisa didn’t choose GV-12, but she could still pay the price. The Objectors should ask: who protects the farmers who say no?"},{side:1,t:"Note from the Board’s own panel: the feeding studies of GV-12 lasted one season; no longer study exists yet.",q:"What does this note show about the evidence? Use it to support the Objectors.",by:"leo",m:"This note shows the limit of the evidence: one season can only reveal effects that appear within one season. The absence of evidence of harm is not the same as evidence of safety. The Objectors should use it to argue that the burden has not yet been met."},{side:1,t:"Consumers’ Union letter from Johan Friis: many shoppers in the province want to know if their bread contains GM wheat; the plan has no labels.",q:"What does this letter show about consumer choice? Use it to support the Objectors.",by:"nur",m:"This letter shows that the plan treats shoppers as if their wishes do not matter. Even people who believe GV-12 is safe may want to choose. Without labels, nobody can, so the licence would quietly decide for everyone."}],rp=[],sp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Would you eat food made from genetically modified crops? Why (not)?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I would eat it, but I’d like to know what I’m buying."],["Point","**The main reason is that** the scientists who test new food usually check it very carefully."],["Example","**For example,** my grandmother in Navoi eats only vegetables from her garden, but she still trusts the bread from the shop."],["Close","**So, all in all,** I’m not afraid of it, as long as the label is honest."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"mateo",q:"Why do some people distrust new kinds of food?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first reason is that** food is very personal: we put it inside our bodies every day."],["","**Then,** many people don’t understand how new food is made, so it feels strange."],["","**What is more,** people often trust the food their families have always eaten."],["","**For instance,** my grandfather in Recife refused to try frozen fish for years, although it was perfectly fresh."],["","**Finally,** if people think a big company is hiding something, they stop listening to the facts."],["","**In short,** trust in food comes from habit and honesty as much as from science."]],keys:["the first reason","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"Should farmers be allowed to grow GM crops?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that farmers should be allowed to grow them, but only under clear rules."],["","To begin with, farmers know their own land, and they should be free to choose their seeds."],["","On top of that, a crop that needs less water or fewer chemicals could help both farmers and nature."],["","A case in point is a farmer near my cousin’s village in Bavaria, who grows only organic crops and worries about pollen from other fields."],["","Admittedly, one farmer’s choice can affect the neighbours, so the rules have to protect them as well."],["","On balance, the answer is not a simple yes or no, but freedom with responsibility."]],extra:"My cousin’s village has a bakery that opens at five in the morning.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"Should all GM food be clearly labelled?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","all food made from GM crops should be clearly labelled."],["After all,","people have a right to know what they are eating, whatever the scientists say."],["Admittedly,","some people may read the label as a warning, even when there is no danger."],["For example,","a shop near my flat in Kuala Lumpur labels everything clearly, and nobody seems frightened by it."],["That is why","the wording should be neutral and simple, not a sign that something is wrong."],["Ultimately,","honest labels build trust, and trust is what new food needs most."]],distractors:["Similarly,","Otherwise,"],keys:["right to know","a warning?","neutral wording","trust"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"amara",q:"Should we trust food that science has changed?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["trust: earned, not automatic","my aunt’s farm near Lagos","drought, insects","who controls the seed?","honest labels","case by case"],model:"I don’t think we should trust or reject this kind of food automatically; trust has to be earned. My aunt has a small farm near Lagos, and I’ve seen how a dry month or a cloud of insects can wipe out a whole season, so I understand why a tougher seed sounds like a gift. That said, I’d want two things before I trusted it. First, I’d want to know who controls the seed: if farmers have to buy it every year from one company, the gift becomes a bill. Second, I’d want honest labels, so that shoppers can choose. So my answer is: not blind trust, not blind fear, but case by case, crop by crop."}],op={title:"Exam Part 2 practice: a food project for the university",situation:"A university in Tashkent has money for one food project next year: a vegetable garden on campus run by students, a series of talks by scientists about how food is grown and changed, or a canteen menu with clear labels showing where every ingredient comes from. Mateo and Aziza are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"mateo",B:"aziza",lines:[["A","We have money for one food project. Shall we start with the campus garden?"],["B","Yes. Students would learn how hard it is to grow food, wouldn’t they?"],["A","They would, although a garden only reaches the students who join it."],["B","Good point. What about the talks by scientists? Everyone could come."],["A","True, but would people really come to a talk in the evening?"],["B","Maybe not many. And the canteen labels? Everyone eats there every day."],["A","Exactly. Clear labels would help people choose, without any extra effort."],["B","So shall we go for the labels, and invite one scientist to explain them?"],["A","Agreed. That way, the information reaches everyone, and we start a conversation too."]],phrases:{Start:["We have money for one …","Shall we start with …?"],Clarify:["…, wouldn’t they?","They would, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["Exactly. …","So shall we go for …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your faculty can do **one** thing to help students eat better: free fruit at the library, a cooking class once a month, or a lunch-time market with farmers from the region. Discuss for 2 minutes and decide together.",seconds:120}},ip={cards:{A:["Without a doubt, …","the burden of proof","long-term effects","protect consumer choice","Whatever you think about …, …","err on the side of caution","On the other hand, …","There’s no evidence that …","provided that …"],B:["food security","provided that …","weigh up the risks","the burden of proof","a matter of trust","Without a doubt, …","err on the side of caution","long-term effects","On the other hand, …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Without a doubt, …","the burden of proof","long-term effects","protect consumer choice","Whatever you think about …, …","err on the side of caution","On the other hand, …","There’s no evidence that …","provided that …","food security","weigh up the risks","a matter of trust"],questions:["Should all GM food be labelled?","Who should decide whether a new crop is safe: scientists, governments or shoppers?","Would you eat bread made from GM wheat? Why (not)?","How do people in Uzbekistan decide which food to trust? Is it different in another country you know?","Is it better to be too careful or not careful enough with new technology?","Should farmers be allowed to save their own seed, whatever company made it?"]},lp=[{type:"stress",title:"Stress Spot: words about science and food",intro:"Tap the stressed syllable. Rule: before -ic, -ology and -tion, the syllable is strong (geNEtic, techNOlogy, nuTRItion). A long word still has only one strong syllable. Then listen and say the word.",follow:"Now use two of these words in one sentence about GV-12.",items:[{w:"genetic",syl:["ge","net","ic"],s:1},{w:"biology",syl:["bi","ol","o","gy"],s:1},{w:"technology",syl:["tech","nol","o","gy"],s:1},{w:"organic",syl:["or","gan","ic"],s:1},{w:"nutrition",syl:["nu","tri","tion"],s:1},{w:"modified",syl:["mod","i","fied"],s:0},{w:"pesticide",syl:["pes","ti","cide"],s:0},{w:"resistant",syl:["re","sis","tant"],s:1}]},{type:"pairs",title:"Sound Pairs: /ɔː/ or /ɔɪ/? (corn or coin?)",intro:"Press Play and choose the word you hear. /ɔː/ (corn, ball, jaw, bore, sore) is long and steady: round your lips and hold the sound. /ɔɪ/ (coin, boil, joy, boy, soy) glides: start with o and move towards i, like Uzbek oy. Uzbek has no long vowels, so some speakers make /ɔː/ short or let it glide: hold it steady. Partner version: one student says a word, the partner points to it.",pairs:[["corn","coin"],["ball","boil"],["jaw","joy"],["bore","boy"],["sore","soy"]]}],ap=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say what the evidence shows before you say what it doesn’t.","Turn your opinion into an amendment: “… on condition that …”."],up={title:"Step Up Speaking Club podcast: Seeds of Doubt",format:"Two speakers · like exam Part 3 (who says what?)",intro:"Mateo’s uncle grows genetically modified soya in Brazil; Aziza’s grandmother saves her own tomato seeds in Navoi. Can science and tradition share the same field?",tip:["Listen for the condition","A speaker may agree only if something else is also true: *provided that …*, *as long as …*, *on condition that …*. Before you choose, decide: does the speaker agree fully, only on a condition, or are they just asking a question?"],A:"mateo",B:"aziza",lines:[["A","Welcome to the Club podcast. My uncle farms soya in the south of Brazil, and, like many of his neighbours, he grows **genetically modified crops**. His plants are **resistant to** some insects, and he says they help him **boost crop yields**. For him, it’s simple: more food from the same field."],["B","My grandmother in Navoi sees it very differently. She still saves seeds from her best tomatoes every autumn. [[0]] she’s right to be careful. [[1]] if farmers have to buy new seed every year, they **become dependent on** a few big companies. That’s about **food security**, not just science."],["A","But as Leo pointed out at the Club, farmers have changed plants for thousands of years, by choosing the best seeds. A laboratory just does it faster."],["B","And Nur wasn’t convinced, remember? Nobody knows all the **long-term effects** yet, and if something might **pose a risk to** nature, we should **err on the side of caution**."],["A","[[2]] we should never plant anything new?"],["B","No, not at all. We just have to **weigh up the risks and benefits**, one crop at a time. [[3]] in a very dry summer, a wheat that needs less water could save a whole harvest. I could accept a seed like that, [[4]] farmers are still free to save their own seed."],["A","On one thing, at least, we all agree: shops should **label food clearly**. Whatever you think about GM, **consumer choice** matters."],["B","Exactly. People should know what they’re eating. In the end, food is **a matter of trust**."]],gaps:[[1,"My instinct is that"],[2,"For one thing,"],[3,"Are you implying that"],[4,"To give you a concrete example,"],[5,"provided that"]],questions:[{q:"Who talks about a relative who grows food?",o:["Mateo","Aziza","both of them"],a:2,why:"Mateo: “My uncle farms soya in the south of Brazil …” Aziza: “She still saves seeds from her best tomatoes every autumn.”"},{q:"Who points out that changing plants is nothing new?",o:["Mateo","Aziza","both of them"],a:0,why:"Mateo: “farmers have changed plants for thousands of years, by choosing the best seeds.” Aziza reports Nur’s doubts instead."},{q:"Who would accept a new seed, but only on certain terms?",o:["Mateo","Aziza","both of them"],a:1,why:"Aziza: “I could accept a seed like that, provided that farmers are still free to save their own seed.” Mateo only asks: “Are you implying that we should never plant anything new?”"},{q:"Who says that shoppers should know what they eat?",o:["Mateo","Aziza","both of them"],a:2,why:"Mateo: “shops should label food clearly … consumer choice matters.” Aziza: “People should know what they’re eating.”"}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason, an example? Which one does Mateo use to check meaning, and which one does Aziza use to set a condition?",groups:[["Opinion",[1]],["Reason",[2]],["Checking meaning",[3]],["Example",[4]],["Condition",[5]]]},use:{q:"Should shops have to label genetically modified food clearly? Why (not)?",by:"leo",model:"My instinct is that they should, yes. For one thing, consumer choice means very little if people can’t see what they’re buying. To give you a concrete example, every box of eggs in my supermarket in Hamburg says how the hens were kept, and nobody reads that as a warning; it’s simply information. Of course, a label only helps provided that it’s honest and neutral. A frightening picture on the packet would mislead people just as much as no label at all. So, in short: label it, but inform people rather than scare them.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},cp=Object.freeze(Object.defineProperty({__proto__:null,BINGO:ip,CARDS:$f,DEBATE:Jf,DEMOS:Uf,DIALOGUE:op,DRILLS:Qf,EVIDENCE:np,LESSON:Gf,LEVELS:sp,LISTEN
