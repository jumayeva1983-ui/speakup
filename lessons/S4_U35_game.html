imply **too far away**.","Each team picks a **food gap card** and builds a project at its **stall**. In the **stay-and-stray** round, one stallholder pitches while the others visit rival stalls as **investors**. Then comes the Fund’s rule: it backs **partnerships only**, so two teams must **merge** their projects into one. Finally, the two partnerships pitch, and the class decides how the Fund should spend its money."],rule:"Rule of respect: we talk about systems, prices, distances and waste, never about whether people deserve help. Nobody is asked about their own family’s food or money, and every project must protect people’s dignity. The Fund, the fair and the situations on the cards are fictional."}},Uf=[{id:"listen",icon:"🎧",name:"Listen and Notice",min:15,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Listen to Amara’s short talk for meaning (exam Part 2 format), notice how she gives an opinion, a reason and an example and checks that her audience is following, then use the same phrases in your own answer. (Book: section 2)",howto:["Whole class: one screen and speakers. Students read the questions first (books open, text covered), then listen once and answer.","Step 2: listen again with the text and complete gaps 1–5. Tap a line to hear it again. Pairs sort the five phrases.","Step 3: everybody listens to Nur, ticks what she does, then answers the same question in pairs (1 minute each). 15 students: 7 pairs and 1 trio.","The talk is read by the computer’s voice. If you record it with a real voice, play your recording instead."]},{id:"pron",icon:"🗣",name:"Sounds",min:3,lv:"c1",group:"Whole class → pairs",kind:"pairs",desc:"Stress in words about food and fairness (distriBUtion, seCUrity), and /eə/ or /e/: shared or shed? (Book: section 3)",howto:["Whole class (1 minute): everybody repeats each word after the computer voice and claps on the stressed syllable.","Then pairs: one student says a word, the partner points to the right one. Swap after five words.","15 students: 7 pairs and 1 group of three."]},{id:"order",icon:"🧩",name:"Speak in Order",min:10,lv:"c1",group:"Pairs → two circles",kind:"pairs",desc:"Level 5: only a chain of key words. Plan your own answer to “Is hunger a problem of food or a problem of fairness?”, say it three times, then compare it with the model. (Book: section 4 · Game School G2, G1)",howto:["Step 1 in pairs: one phone per pair, or the whole class on the projector. Start at Level 5; pairs who need more support may go back to Level 4.","Step 2: inner and outer circle. Everybody speaks at the same time, three times, to three different partners.","The teacher walks around and listens. Nobody waits for a turn."]},{id:"bingo",icon:"🎯",name:"Phrase Bingo",min:7,lv:"c1",group:"Groups of 3",kind:"three",desc:"One student speaks for a minute; two classmates listen for phrases about food, waste and fairness. (Book: section 5 · G4)",howto:["15 students = 5 groups of three. Listener 1 uses this screen (Card A); Listener 2 uses Card B in the book.","Roles: one speaker, two listeners. Change roles after each minute, so everyone speaks once.","At the end, one student from each group shares the most practical idea they heard (use the wheel)."]},{id:"game",icon:"🧺",name:"The Fair Plate Fair",min:18,lv:"c1",group:"4 stalls of 3–4",kind:"four",roles:["Stallholder (stays and pitches)","Investor · visits the next stall","Investor · visits the stall after that","Investor · visits the last stall · keeps time"],desc:"Pitch Room as a market-stall fair: find a food gap, build a project at your stall, pitch it while your teammates visit rival stalls as investors (stay and stray), merge with another team, pitch as a partnership and score the other partnership on fairness. (Book: section 6 · Game School G7)",howto:["15 students = 4 stalls (three teams of 4 and one of 3). Push desks together to make four “stalls” in the corners of the room.","Timing: cards 1 min · Find the gap 2 min · Build your stall 4 min · Stay and stray 3 min · Report back and merge 3 min · Partnership pitches 3 min · Funding decision 2 min.","Stay and stray: the stallholder stays; each investor goes to a DIFFERENT stall, so every stall gets one visitor from each other team. In a team of three, one investor visits two stalls.","Merge: stalls A + B and C + D, or let teams choose a partner whose project fits theirs. With five stalls, one partnership has three teams; with only three stalls, two teams merge and the third pitches alone."]},{id:"dialogue",icon:"💬",name:"Dialogue Jigsaw",min:8,lv:"c1",group:"Pairs (+1 trio)",kind:"pairs",desc:"Rebuild a conversation about a student union’s food project, then hold your own (exam Part 2). (Book: section 7 · G5)",howto:["Pairs rebuild the dialogue, read it aloud, then swap roles.","Step 3: all pairs talk at the same time for 2 minutes.","15 students: 7 pairs and 1 trio. In the trio, the third student is the examiner and uses the criteria card."]},{id:"drills",icon:"💪",name:"Drill Bank",min:30,lv:"b2p",group:"Alone or pairs · at home",kind:"pairs",home:!0,desc:"Vocabulary, substitution, upgrade, correction and stress drills with instant checking. (Book: Drill Bank)",howto:["At home: do every drill twice. The second time, go faster.","In class: use one drill as a 5-minute warm-up at the start of the next lesson.","Speaking drills: say the answer aloud before you press “Show answer”."]}],Vf={listen:{ref:"Book: Lesson 65, section 2 · Listen and Notice",steps:["**Before you listen:** read the four questions and underline the key words. Ask yourself: is this question about a **fact**, the speaker’s **purpose**, her **attitude** or her **main message**?","Press **Play the podcast**. Choose A, B or C. Press **Check**: you see why the answer is right.","**Listen again** with the text. Tap a gap to see what Amara said; tap a line to hear it again.","Sort the five phrases: opinion, reason, example, or clarifying and checking.","**Your turn:** listen to Nur, tick what she does, then answer the same question. Your partner ticks your phrases."],exTitle:"Two students after the first listening",lines:[["A","For question 3, I chose B. She isn’t sure her idea will end hunger.","gives an answer"],["B","How do you know?","asks for evidence"],["A","She asks, “Will it end hunger?” and answers, “Of course not.” But then she says it would mean less waste.","uses the text as evidence"],["B","Right: she’s realistic, not negative. That’s the attitude.","agrees and paraphrases"]],checks:[["What do you listen for in a purpose question?","why the speaker says something: to show, to warn, to compare, to persuade …"],["Which phrase does Amara use to check that the audience is following?","Does that make sense so far?"]]},pron:{ref:"Book: Lesson 65, section 3 · Sounds A and B",steps:["**Stress Spot:** look at the word. Tap the syllable you think is **strong** (stressed).","Green = correct, red = try again. The computer says the word: **repeat it** and **clap** on the strong syllable.","Remember: before **-tion** and **-ity**, the syllable is strong (*distriBUtion*, *seCUrity*). *AGriculture* is strong at the start.","**Sound Pairs:** press **▶ Play a word** and choose the word you hear: /eə/ (*shared*, *fared*) or /e/ (*shed*, *fed*)?","/eə/ is **long**: open your mouth a little more and hold the sound (*air*, *share*, *fair*). /e/ is **short** and quick (*bed*, *fed*, *bread*).","Pairs: Student A says one word from a pair; Student B points to it. Swap after five words."],exTitle:"A teacher and two students",lines:[["T","Listen: *distribution*. Which syllable is strong?",""],["A","The first: *DIS*-tri-bu-tion?","a guess"],["T","Listen again: dis-tri-*BU*-tion. What comes after it?","the teacher gives a clue"],["A","*-tion*! So the syllable before it is strong: dis-tri-*BU*-tion.","uses the rule"],["T","Good. Now listen: *shared*. First or second: *shared* or *shed*?",""],["B","First: *shared*. It’s longer, and my mouth stays open.","listens for the long sound"]],checks:[["Where is the stress in *security*?","on CU: se-CU-ri-ty (the syllable before -ity)."],["Which is longer: *fed* or *fared*?","*fared*: /eə/ is a long sound; /e/ in *fed* is short."],["What is the difference between *shared* and *shed*?","*shared* (past of *share*) has long /eə/; a *shed* is a small hut, with short /e/."]]},order:{ref:"Book: Game School G2 and G1 · section 4",steps:["Read the question aloud. This is **Level 5**: there are **no sentences to order**, only a **chain of key words**.","Plan first: decide what each key word will become in your answer, and choose a linking phrase for each step (*The way I see it*, *This is mainly because*, *A case in point is*, *Ultimately*).","Make sure your answer has a clear **position**, a **reason**, one **example** and a **conclusion**.","Go to **Say it: 4/3/2**: answer the question three times, to three partners: 90, 60 and 45 seconds. Keep the ideas; make the language sharper each time.","Then open the **model answer** and compare. What did the model do that you didn’t?","Need more support? Go back to **Level 4** (choose the linking words) for one round."],exTitle:"How Amara’s answer changed in 4/3/2",lines:[["amara","Um, fairness, I think. Enough food, but the wrong place. Tomatoes in Lagos, they spoil, and, um, families nearby can’t buy them. Money, roads, storage. So, fairness.","Attempt 1 · 90 s · the key words, many pauses"],["amara","I think hunger is mostly a problem of fairness. There is food, but it is often in the wrong place. In Lagos, tomatoes spoil before they reach the city, while some families nearby can’t afford them. The problem is money, roads and storage. So it’s a problem of fairness.","Attempt 2 · 60 s · linking phrases"],["amara","The way I see it, hunger is less about how much food we grow than about who can reach it. Tomatoes rot on the road to Lagos while families a few streets away can’t afford them. Money, roads and cold storage decide who eats well. Ultimately, that makes hunger a question of fairness.","Attempt 3 · 45 s · same ideas, sharper words"]],checks:[["What is different at Level 5?","there is nothing to order: you build the whole answer from key words."],["How many times do you say your answer?","three times, to three different partners (90, 60, 45 seconds)."],["When do you look at the model answer?","after your three attempts, to compare and steal one good phrase."]]},bingo:{ref:"Book: Game School G4 · Cards A and B in section 5",steps:["Make groups of three: one **speaker**, two **listeners**.","Listener 1 uses this screen (**Card A**). Listener 2 uses **Card B** in the book.","The speaker reads the question, thinks for 20 seconds, then presses **▶ Speaker: 1 min** and talks.","Listeners tap a phrase **only when they hear it in a real sentence**. Three in a row = **Bingo!**","After the minute, listeners say: *“I heard … phrases.”* 1 point per phrase, +3 for a Bingo.","Press **🔁 Next speaker**: new speaker, new question. Everyone speaks once."],exTitle:"Question: Should shops be allowed to throw away food that is still good?",lines:[["leo","**Frankly, no.** If bread is still good at closing time, **it shouldn’t go to waste.** **To be fair,** shops worry about safety and about losing customers. **But the real question is** who pays for the waste in the end: **all of us**, through higher prices. **What’s more,** food banks in Hamburg already collect food like this, so **it can be done.**","speaker · 1 minute"],["nur","I heard six phrases: *Frankly, no*, *go to waste*, *To be fair*, *the real question is*, *What’s more* and *it can be done*. That’s a diagonal: **Bingo!**","listener reports"],["leo","Six points plus three for the Bingo: nine points!","count the points"],["nur","Next time, try *surplus food*. It’s on my card, and it fits your point about bread.","a wish"]],checks:[["How long does the speaker talk?","one minute."],["When do you tap a phrase?","only when you hear it in a real sentence."],["Do you talk about your own family’s money or food?","no: talk about shops, prices, systems and ideas."]]},dialogue:{ref:"Book: Game School G5 · section 7",steps:["Read the situation. Find the **first line**: it opens the topic (*The student union has money for one food project …*).","Click the lines in order. Each line answers the line before. Aziza and Mateo take turns.","Press **✔ Check**. Then press **🔊 Listen** to hear the whole conversation.","**Read it and swap roles:** read a line silently, look up and **say** it to your partner. Press **🔁 Swap roles** and read again.","**Your own conversation:** press **▶ Start: 2 min**. Discuss the options one by one and decide together. In a trio, the third student is the examiner."],exTitle:"Mini example: a class party",lines:[["A","We’re planning the end-of-term party. Shall we order food or cook?","opens the topic"],["B","Ordering is easy, but there’s always too much left over.","a doubt"],["A","True. If we cook, everyone brings one dish, and we can plan the amounts.","an argument"],["B","Then let’s cook, and take containers for the leftovers.","decides"]],checks:[["Who speaks first?","A; then the speakers take turns."],["What is “read – look up – say”?","read a line silently, then look at your partner and say it."],["How long is your own conversation?","two minutes; you must decide together."]]},game:{ref:"Book: Game School G7 · section 6",steps:["Make **four stalls** of 3–4. Roles: one **stallholder**, who stays at the stall and pitches, and **investors**, who will visit other stalls. Rotate the stallholder for the final pitch.","**Food gap cards:** each stallholder picks one face-down card. Read it to your team, then open **The hard part**.","**Round 1 · Find the gap (2 min):** say the gap in one sentence: *“The food is …, but … can’t get it because …”*","**Round 2 · Build your stall (4 min):** what your project does, who it reaches, where the food comes from, what it costs, how people keep their dignity. Write a **stall sign** in the book.","**Round 3 · Stay and stray (3 min):** the stallholder pitches for **60 seconds** to each visitor; each investor visits a **different** stall, opens an **investor card** and asks the question. Note one strength and one doubt.","**Round 4 · Report back and merge (3 min):** investors report what they saw. The Fund backs **partnerships only**: join one other team, keep **one strength from each project**, fix **one doubt**, choose a **joint name**.","**Round 5 · Partnership pitch (90 s each)** and **Round 6 · Funding decision:** each partnership scores **the other one** on four criteria; then the class decides: both projects in part, or one in full?"],exTitle:"Sample game: Rounds 3, 4 and 6 at the fair",lines:[["","Stall A (Bread at closing time): stallholder Mateo · Stall B (Dormitory dinners): Aziza · investors include Nur, Leo and Amara",""],["mateo","**Welcome to “Evening Loaf”.** Good bread **goes to waste** every evening, while students and night-shift workers struggle to **make ends meet**. At closing time, bakeries put unsold bread on a **shared shelf**, and anyone can take it, no questions asked.","the stallholder’s 60-second pitch"],["nur","(investor card) **Will people feel embarrassed to use it?**","an investor asks a card question"],["mateo","**That’s exactly why** nobody has to sign up or explain anything. The shelf is outside, and it’s for anyone: a student, a nurse, a neighbour.","answers with the design"],["","… Round 4 · Report back and merge …",""],["leo","**The strongest thing I saw at Stall B** was the cooking club in the dormitory. **My doubt:** where does the food come from? **What if** we merged with Mateo’s bread shelf?","an investor reports and suggests a merger"],["aziza","**Deal.** **From our project we keep** the cooking club; **from yours,** the evening bread. **The doubt we’ll fix** is cost: the bakeries give, the students cook. **Our joint name** is “From Shelf to Supper”.","two teams merge"],["","… Round 6 · Funding decision …",""],["amara","**We give “From Shelf to Supper” a five for dignity**, because nobody is singled out. **But only a three for lasting after the grant:** who runs the club when these students graduate?","the other partnership scores fairly, with reasons"]],checks:[["Who stays at the stall in Round 3?","the stallholder; the investors visit different stalls."],["What does the Fund’s rule say?","it backs partnerships only: two teams must merge their projects."],["Whom does each partnership score?","the other partnership, never itself, on four criteria."]]},drills:{ref:"Book: Lesson 65 · Drill Bank",steps:["Choose a drill with the dots at the top, or press **Next →**.","**Choice drills:** click an answer. Green = correct. Read the explanation, then press **Next**.","**Speaking drills:** say your answer **aloud first**. Then press **Show answer** and **🔊 Listen** to check.","Do every drill twice. The second time, try to be faster."]}},Jf=[{title:"Words: complete the sentence",type:"choice",intro:"Choose the phrase that completes the sentence. Then read the full sentence aloud.",items:[{q:"Good tomatoes ___ because there is no cold storage on the way to the city.",o:["go to waste","make ends meet","go hungry"],a:0},{q:"Many families find it hard to ___ when prices go up.",o:["make ends meet","go to waste","have access to"],a:0},{q:"Without fridges or cool rooms, there is no ___ for fruit after the harvest.",o:["cold storage","fair share","food bank"],a:0},{q:"Food passes through farms, trucks, warehouses and shops: the whole ___.",o:["supply chain","balanced diet","food security"],a:0},{q:"Unsold bread at the end of the day is ___ that could feed somebody.",o:["surplus food","a supply chain","a fair share"],a:0},{q:"No child should ___ on school days.",o:["go hungry","go to waste","make ends meet"],a:0},{q:"With ___, a balanced diet becomes a luxury.",o:["rising food prices","cold storage","surplus food"],a:0},{q:"A family that lives far from any shop may not ___ fresh vegetables.",o:["have access to","go to waste","go hungry"],a:0},{q:"Volunteers collect food and give it to people who need it at a ___.",o:["food bank","supply chain","balanced diet"],a:0},{q:"Fruit, vegetables, grain and protein together make ___.",o:["a balanced diet","a supply chain","a food bank"],a:0},{q:"When every family can get enough safe, healthy food, we have ___.",o:["food security","surplus food","cold storage"],a:0},{q:"Amara wants every family to get a ___ of the food we already grow.",o:["fair share","food bank","supply chain"],a:0}]},{title:"Say it fast: substitution",type:"say",intro:"Change the sentence with the prompt in bold. Say the new sentence aloud, then check. Each change builds on the sentence before.",items:[{p:"Shops throw away good food. → **passive: Good food …**",a:"Good food is thrown away by shops."},{p:"Good food is thrown away by shops. → **Good food shouldn’t …**",a:"Good food shouldn’t be thrown away."},{p:"The tomatoes spoil. The trucks are slow. → **because of**",a:"The tomatoes spoil because of the slow trucks."},{p:"The tomatoes spoil because of the slow trucks. → **If there were cold storage, …**",a:"If there were cold storage, the tomatoes wouldn’t spoil."},{p:"If there were cold storage, the tomatoes wouldn’t spoil. → **If there had been …, … last summer**",a:"If there had been cold storage, the tomatoes wouldn’t have spoiled last summer."},{p:"What families need most is cheaper vegetables. → **What families need most is not …, but …(access)**",a:"What families need most is not more food, but access to it."},{p:"We rarely see so much food go to waste. → **Rarely …(inversion)**",a:"Rarely do we see so much food go to waste."},{p:"Prices rise. Families buy less fruit. → **The more …, the less …**",a:"The more prices rise, the less fruit families buy."},{p:"The project cuts waste. It also helps families. → **not only … but also**",a:"The project not only cuts waste but also helps families."},{p:"The bakery gave away its bread. It had closed. → **Having …**",a:"Having closed, the bakery gave away its bread."},{p:"It is important that no child goes hungry. → **It is vital that no child …(subjunctive)**",a:"It is vital that no child go hungry."},{p:"I wish the market had a cold room. → **If only …**",a:"If only the market had a cold room!"}]},{title:"Upgrade it: B2 → C1",type:"say",intro:"Say the sentence again with a C1 phrase from the Phrase Bank. Then check.",items:[{p:"I think the problem is fairness.",a:"The way I see it, the real problem is fairness, not food."},{p:"A lot of food is thrown away.",a:"A shocking amount of good food goes to waste."},{p:"Food is too expensive for some families.",a:"Rising food prices put a balanced diet out of reach for some families."},{p:"The food can’t get to the people.",a:"The supply chain breaks down before the food reaches the people who need it."},{p:"For example, bread is thrown away in the evening.",a:"A case in point is the bread that bakeries throw away every evening."},{p:"It won’t fix everything.",a:"It won’t solve the problem on its own, but it’s a step in the right direction."},{p:"Do you understand?",a:"Does that make sense so far? What I mean is …"}]},{title:"Correct it",type:"choice",intro:"Each sentence has one mistake. Choose the correct sentence, then say it aloud.",items:[{q:"✗ The food prices are growing every month.",o:["Food prices are rising every month.","The food prices are growing up every month.","Food prices are grown every month."],a:0,why:"prices rise / go up (not grow, a calque); no the before a general plural"},{q:"✗ Poor peoples can’t buy meat.",o:["People on low incomes can’t always afford meat.","Poor peoples can’t afford meat.","Poor people can’t to buy meat."],a:0,why:"people is already plural; on low incomes is more respectful; afford"},{q:"✗ Every evening the bread is throwing away.",o:["Every evening the bread is thrown away.","Every evening the bread is throw away.","Every evening the bread throws away."],a:0,why:"passive: is + past participle (thrown)"},{q:"✗ Families don’t have enough money for buying food.",o:["Families don’t have enough money to buy food.","Families don’t have enough money for to buy food.","Families haven’t enough money for buy food."],a:0,why:"enough money TO do something"},{q:"✗ We must economy food and money.",o:["We must save food and money.","We must make economy of food and money.","We must economic food and money."],a:0,why:"save (not economy, a calque of tejamoq / ekonomit’)"},{q:"✗ In the shop they sell food products and vegetables.",o:["The shop sells groceries and vegetables.","In the shop they sells food products.","The shop sell food products and vegetables."],a:0,why:"groceries / food (food products sounds like a translation of oziq-ovqat mahsulotlari)"},{q:"✗ Many childrens go to school hungry.",o:["Many children go to school hungry.","Many childrens go to the school hungry.","Much children go to school hungry."],a:0,why:"children is already plural"},{q:"✗ The vegetables was spoiled before the market.",o:["The vegetables had spoiled before they reached the market.","The vegetables was spoiling before the market.","The vegetables were spoil before the market."],a:0,why:"plural subject; past perfect for the earlier action; reached the market"}]},{title:"Stress: words about food and fairness",type:"choice",intro:"Where is the stress? Choose the correct word. Then say it aloud and clap on the stress.",items:[{q:"how food is shared out and delivered",o:["distriBUtion","DIStribution"],a:0,why:"Before -tion, the syllable is strong."},{q:"being safe; having what you need",o:["seCUrity","SEcurity"],a:0,why:"Before -ity, the syllable is strong."},{q:"an unfair difference between people",o:["inEQUality","INequality"],a:0,why:"Before -ity, the syllable is strong."},{q:"the food your body needs",o:["nuTRItion","NUtrition"],a:0,why:"Before -tion, the syllable is strong."},{q:"growing and making things",o:["proDUCtion","PROduction"],a:0,why:"Before -tion, the syllable is strong."},{q:"cheap enough to buy",o:["afFORDable","AFfordable"],a:0},{q:"farming",o:["AGriculture","agriCULture"],a:0}]}],Kf={cardsStep:"Food gap cards",cardsTitle:"Food gap cards",cardsHint:"Each stall’s stallholder picks one card: it turns over and opens. Read who is left out, the gap and what your project must do aloud to your team. Then open “The hard part”: only your team should hear it. Close the card, and the next stall picks.",backWord:"Gap",hiddenLabel:"The hard part",hiddenAll:"Show all hard parts",questionWord:"Investor",questionTitle:"Investor question cards",questionHint:"Investors: at the stall you visit, open **one card** after the 60-second pitch and ask its question (or your own). The stallholder answers in 30 seconds. Note **one strength** and **one doubt**, then go back to your own stall.",questionHelp:{b2:["I’d like to know …","What happens if …?","Who exactly …?"],c1:["Help me understand how …","Let’s say the money runs out: what then?","How would you know that it’s working?"]},scoreTitle:"The Fund’s score board",scoreHint:"Score **the other partnership only**, 0–5 for each criterion; agree each number in 20 seconds and give one reason. Score the project, not the presenters. Then decide aloud as a class: should the Fund back **both projects in part**, or **one in full**?",scoreCriteria:["Reaches people in need","Cuts waste","Fair and dignified","Lasts after the grant"],teamWord:"Partnership",teamIcon:"",teamKind:"partnership",teams:2},Gf=[{name:"Round 1 · Find the gap",lv:"c1",bloom:"Understand / Analyse",by:"aziza",seconds:120,q:"Read your food gap card aloud, then open **The hard part**. Agree on the gap in **one sentence**: *“The food is …, but … can’t get it because …”*. Name **who is left out** and **where the food is lost**, without blaming anyone.",help:{b2:["The food is there, but …","The people who are left out are …","The food is lost when …"],c1:["The gap, in a nutshell, is …","It isn’t a lack of food so much as …","Where the chain breaks is …"]},model:"The gap, in a nutshell, is this: the apricots are there, but small growers can’t sell them in time, and families in the city rarely eat fresh fruit because it costs too much. Where the chain breaks is the harvest itself: all the fruit ripens in a few weeks, prices fall, and a lot of it spoils under the trees. And the hard part is that the growers have no time and no money to invest at exactly that moment. So it isn’t a lack of food so much as a lack of time and storage."},{name:"Round 2 · Build your stall",lv:"c1",bloom:"Create",by:"mateo",seconds:240,q:"Design your project: **what it does**, **who it reaches**, **where the food comes from**, **what it costs** and how people **keep their dignity**. Deal with **the hard part**. Write a **stall sign** in the book (a name and one line) and plan a **60-second pitch**.",help:{b2:["Our project is called …","It reaches … by …","To deal with the hard part, we …"],c1:["The idea, in one line, is …","What makes it fair is that nobody has to …","We’ve turned the hard part round by …"]},model:"Our stall sign says: “Evening Loaf: good bread, no questions asked.” The idea, in one line, is a shared shelf outside each bakery, where unsold bread goes at closing time. It reaches students, night-shift workers and anyone who is struggling to make ends meet, and what makes it fair is that nobody has to sign up or explain themselves. The hard part was the bakers’ fear of losing morning customers, so we’ve turned it round: the shelf only opens after the bakery closes, and every loaf carries the bakery’s name, which is free advertising."},{name:"Round 3 · Stay and stray",lv:"c1",bloom:"Apply / Evaluate",by:"nur",tool:"questions",seconds:60,q:"**One stallholder stays** and pitches for **60 seconds** to each visitor. **The investors stray:** each one visits a **different** stall, opens an **investor card** after the pitch and asks the question. Note **one strength and one doubt**, then return to your own stall.",help:{b2:["Welcome to our stall. Our project …","That’s a good question: …","One strength is …; my doubt is …"],c1:["Let me walk you through it in a minute: …","I’m glad you asked, because …","What impressed me was …; what worries me is …"]},model:"Let me walk you through it in a minute. Our project, “Winter Garden Jars”, starts in the mountain village in August, when the gardens grow more than families can eat. Volunteers and older neighbours dry, pickle and preserve the surplus together in the school kitchen, and the jars are stored in the cool cellar under the school. In January, when the road is closed by snow, every family can swap jars at the school on Saturdays. No electricity, no freezer: just old skills and a shared cellar. I’m glad you asked about cost: the jars are the only thing we need to buy."},{name:"Round 4 · Report back and merge",lv:"c1",bloom:"Evaluate / Create",by:"leo",seconds:180,q:"Investors report to their own team: the **best idea** they saw and **one doubt**. Then the Fund’s rule: it backs **partnerships only**. Join **one other stall**: keep **one strength from each project**, fix **one doubt**, and agree on a **joint name**.",help:{b2:["The best idea I saw was …","My doubt is that …","Let’s keep … from your project and … from ours."],c1:["The strongest thing I saw at Stall … was …","What I couldn’t quite see was how …","What if we combined your … with our …?"]},model:"The strongest thing I saw at Stall D was the “ugly vegetables” box: farmers sell crooked carrots and spotted apples at a fair price instead of leaving them in the field. What I couldn’t quite see was how the boxes reach people without cars. So what if we combined their boxes with our project for older neighbours? From their project we keep the cheap boxes; from ours, the student volunteers who already carry shopping to people’s doors. The doubt we fix is delivery. And the joint name we agreed on is “Crooked and Kind”."},{name:"Round 5 · Partnership pitch",lv:"c1",bloom:"Create",by:"amara",seconds:90,q:"Each partnership pitches its joint project in **90 seconds**: the gap, the joint plan, **what each team brought**, and **what happens when the Fund’s money runs out**. The other partnership asks **one tough question**; you answer in 30 seconds.",help:{b2:["Our partnership brings together …","From Stall … we took …","After the grant, …"],c1:["Two gaps, one answer: …","What each team brought to the table is …","The project pays its own way after the grant because …"]},model:"Two gaps, one answer: “From Shelf to Supper”. Every evening, good bread goes to waste in the city centre, while students in the dormitory live on instant noodles before exams. What each team brought to the table is simple: from Stall A, the bakeries’ evening bread; from Stall B, a cooking club where students learn to turn bread, eggs and vegetables into a balanced meal for very little money. Nobody has to prove they’re poor: the club is open to everyone. And the project pays its own way after the grant, because the bakeries save on rubbish collection and the club only needs a kitchen the dormitory already has."},{name:"Round 6 · Funding decision",lv:"c1",bloom:"Evaluate",by:"aziza",tool:"score",seconds:120,q:"Each partnership scores **the other one**, 0–5 on four criteria, with **one reason** for each number. Then the class decides: should the Fund back **both projects in part**, or **one in full**? Finish with **one lesson** about fairness and food that you take from the fair.",help:{b2:["We give … a … for …, because …","Their strongest point is …","We think the Fund should …"],c1:["In fairness to them, …","Where it falls short is …","On balance, the Fund would get more for its money if …"]},model:"In fairness to them, “Crooked and Kind” deserves a five for cutting waste: vegetables that used to rot in the field end up on people’s tables. We give them a four for dignity, because the boxes are sold, not given, and anyone can order one. Where it falls short is lasting after the grant: it depends on student volunteers, and students graduate. On balance, I think the Fund should back both projects in part, on one condition: each one finds a local partner to keep it going. The lesson I take from today is that food security is often a matter of logistics and respect, not of charity."}],_f=[{e:"🍑",n:"The apricot rush",r:"Orchards near Fergana · harvest time",lines:[["Who is left out","Small orchard owners, and city families who rarely buy fresh fruit because it is expensive."],["The gap","All the apricots ripen in the same few weeks. Prices fall, small growers can’t sell everything, and a lot of fruit spoils under the trees."],["Your project must","Keep more fruit from going to waste and help it reach people later in the year."]],x:"Drying fruit needs space, clean water and sun, and at harvest time the growers have no free time and no money to invest."},{e:"🍞",n:"Bread at closing time",r:"Bakeries in the city centre",lines:[["Who is left out","Night-shift workers, students on a tight budget and families who are struggling to make ends meet."],["The gap","Bakeries bake fresh bread every morning; by the evening some of it is unsold, and much of it is thrown away."],["Your project must","Get good bread to people who need it the same evening, without making anyone feel ashamed."]],x:"The bakers worry that if bread is free in the evening, fewer people will buy it in the morning."},{e:"🥣",n:"The empty-stomach lesson",r:"A village school in the hills",lines:[["Who is left out","Pupils who leave home very early to walk to school and have nothing to eat until the afternoon."],["The gap","The school has a kitchen but no money or staff for breakfast. Village families grow food, but the school does not buy from them."],["Your project must","Give every pupil something to eat in the morning, in a way the whole class shares, so that no child is singled out."]],x:"The kitchen is old: it has a stove but no fridge, and the cook works only two days a week."},{e:"❄️",n:"The winter road",r:"A mountain village",lines:[["Who is left out","Families in a village where the road is sometimes closed by snow."],["The gap","In winter, fresh vegetables are rare and expensive. In summer, the village gardens grow more than people can eat."],["Your project must","Help the village eat a balanced diet all year round."]],x:"There is no reliable electricity in winter, so a big freezer is not an option."},{e:"📈",n:"The price jump",r:"A neighbourhood bazaar",lines:[["Who is left out","Families on low incomes, older people living on a pension and students."],["The gap","When the price of flour, oil or meat rises suddenly, families cut back, and a balanced diet is the first thing to go."],["Your project must","Help families keep eating well when prices rise, without telling them what to eat."]],x:"Your project cannot control prices, and the Fund will not pay for anything that is simply given away for free for ever."},{e:"🍜",n:"Dormitory dinners",r:"A student dormitory",lines:[["Who is left out","Students who live away from home on a tight budget and often skip meals before exams."],["The gap","Many students live on instant noodles and bread. The dormitory kitchen is crowded, and few students know how to cook cheap, healthy meals."],["Your project must","Help students eat a balanced diet on a student budget."]],x:"Students are busy and proud: many will not go to anything called “help for poor students”."},{e:"🥕",n:"Too ugly to sell",r:"Farm fields and supermarkets",lines:[["Who is left out","Farmers, and shoppers who would happily buy cheaper vegetables."],["The gap","Shops only take vegetables that look perfect, so crooked carrots and spotted apples are left in the field or fed to animals."],["Your project must","Get good but “ugly” vegetables to people who need them, at a fair price."]],x:"The shops fear that customers will stop buying the “perfect” vegetables if the ugly ones are cheaper."},{e:"🧺",n:"Heavy bags",r:"Older neighbours in a mahalla",lines:[["Who is left out","Older people who live alone and can no longer carry heavy shopping home from the bazaar."],["The gap","They buy less fresh fruit and fewer vegetables, and more food that keeps, because they can only shop when someone helps."],["Your project must","Bring fresh food to their door at a fair price and keep them in touch with their neighbours."]],x:"Many of them don’t use smartphones, and they like to choose their fruit themselves."}],$f=[],ep=[{t:"Who exactly does it reach?",q:"Who exactly will your project reach, and how will they hear about it?",by:"aziza",m:"Our boxes reach older neighbours who can’t carry heavy bags. They won’t see an advert online, so we’ll go through the mahalla committee and the people they already trust: the neighbour next door, the local shop and the stallholders at the bazaar. Word of mouth is slow, but it’s the channel these people actually use."},{t:"Will people feel embarrassed?",q:"Will people feel embarrassed to use it? How do you protect their dignity?",by:"mateo",m:"That’s exactly why the cooking club is open to everyone in the dormitory, not just students who are short of money. Nobody fills in a form or explains their situation. If you come, you cook, you eat, you wash up. A student who needs the meal and a student who just likes cooking sit at the same table."},{t:"What happens when the money runs out?",q:"Let’s say the Fund’s money runs out after one year. What then?",by:"nur",m:"Fair question. The Fund pays for the jars and the shelves in the first year; after that, the costs are almost zero, because the vegetables come from the village gardens and the work is shared. Families who take jars in winter bring empty ones back in summer. So the project needs the grant to start, not to survive."},{t:"Who loses out?",q:"Does anyone lose out because of your project: farmers, shops, bakers?",by:"leo",m:"We’ve thought about that. The bakers were worried about losing morning sales, so the shelf opens only after closing time. Shops don’t lose anything either, because the bread was going to the rubbish heap anyway. If anything, the bakeries gain: the bread carries their name, and the city sees them as generous."},{t:"Will it work in all seasons?",q:"Will your project still work in the heat of summer and in the cold of winter?",by:"amara",m:"Summer is the real test for fruit, so we start there: drying racks in the shade and a cool room in the school cellar. Winter is when the dried fruit goes out to families. Heat is our enemy in July and our friend in August, when the sun dries the apricots for free."},{t:"How will you know it works?",q:"How would you know, after six months, that your project is working?",by:"aziza",m:"We won’t promise numbers we can’t check, but we will count three things every week: how many kilos of vegetables we collect, how many boxes go out and how many come back empty. And once a month we’ll ask the people who use it one question: what would make this better? If the boxes keep going out and the answers get shorter, it’s working."},{t:"Why should the Fund pay?",q:"Why should the Fund pay for this, and not the city or the shops?",by:"leo",m:"Because nobody else pays for the gap between them. The farmer is paid for perfect carrots, the shop sells them, and the crooked ones fall between the two. The Fund is the only one whose job is exactly that space. And if it works for a year, we’ll take the results to the city and ask them to take it over."},{t:"What is the biggest risk?",q:"Be honest: what is the biggest risk, and what will you do about it?",by:"nur",m:"The biggest risk is that our volunteers lose interest after the first exciting month. So we’ve built the project into something people already do: the cooking club meets on the evening the dormitory kitchen is quietest, and every member brings one friend in the second month. If we’re honest, it may still shrink in exam season, and we’ll plan for that."}],tp=[{name:"Level 1",sub:"4 parts + labels",type:"order",lv:"b2",labels:!0,by:"aziza",q:"Do you think people waste too much food? Why (not)?",hint:"4 parts. Labels and linking words help you.",parts:[["Opening","**To be honest,** I think most of us waste more food than we realise."],["Point","**The main reason is that** we buy more than we need and forget what is in the fridge."],["Example","**For example,** after a big family celebration in Navoi, there is often plov and bread left over for days."],["Close","**So, all in all,** planning our shopping would save both food and money."]],keys:["to be honest","the main reason is that","for example","all in all"]},{name:"Level 2",sub:"6 parts",type:"order",lv:"b2p",by:"mateo",q:"Why does good food cost more in some places than in others?",hint:"6 parts. No labels: follow the linking words.",parts:[["","**I think the first reason is** distance: food that travels far costs more to bring."],["","**Then,** there is storage: without cold rooms, sellers lose part of what they buy."],["","**What is more,** small shops buy small amounts, so they pay more for each box."],["","**For instance,** in my uncle’s village near Recife, vegetables cost more than in the city, even though they are grown nearby."],["","**Finally,** bad roads and slow trucks add to the price."],["","**In short,** the price of food is often the price of getting it to us."]],keys:["the first reason","then","what is more","in short"]},{name:"Level 3",sub:"6 parts + 1 extra",type:"order",lv:"c1",by:"leo",q:"Should supermarkets have to give unsold food away?",hint:"6 parts + 1 sentence that does NOT belong. Send it to the bin with 🗑.",parts:[["","I’d argue that supermarkets should have to offer good unsold food to food banks."],["","To begin with, it is hard to justify throwing away food that is still safe to eat."],["","On top of that, food banks are often short of fresh food, not of tins and pasta."],["","A case in point is a supermarket near my flat in Hamburg, which leaves crates of bread and fruit for volunteers every evening."],["","Admittedly, it takes staff time, and the food has to be stored safely."],["","On balance, though, a rule like this costs little and helps a lot."]],extra:"The supermarket near my flat also sells very good coffee.",keys:["to begin with","on top of that","admittedly","on balance"]},{name:"Level 4",sub:"Choose linking words",type:"markers",lv:"c1",by:"nur",q:"Can technology help to end hunger?",hint:"6 parts without linking words. Put them in order, then choose a linking word for each part. Two words in the list are extra.",parts:[["In my view,","technology can help to fight hunger, but it cannot end it on its own."],["After all,","apps and sensors can show farmers and sellers where food is being lost."],["However,","a clever app is no use to a family that cannot afford the food in the first place."],["For example,","in many cities, apps now connect cafés that have surplus food with people nearby who want it."],["That is why","technology works best together with fair prices and good public services."],["Ultimately,","ending hunger is a question of choices, not only of tools."]],distractors:["Similarly,","Otherwise,"],keys:["help, not end","show where food is lost","can’t buy it anyway","surplus food apps"]},{name:"Level 5",sub:"Key words only",type:"keys",lv:"c1",by:"amara",q:"Is hunger a problem of food or a problem of fairness?",hint:"Only a key-word chain. Build the answer yourself and say it three times (90, 60, 45 seconds). Compare with the model answer at the end.",keys:["fairness, not only food","food in the wrong place","tomatoes on the road to Lagos","money, roads, storage","but: droughts, bad harvests","fair shares of what we grow"],model:"The way I see it, hunger today is less a problem of food than a problem of fairness. In many places, the food exists; it is simply in the wrong place, or at the wrong price. Take the tomatoes that travel to Lagos: many of them spoil on the road, while families a few streets from the market can’t afford the ones that arrive. Money, roads and cold storage decide who eats well. Admittedly, droughts and bad harvests are real, and sometimes there really isn’t enough. But even then, who goes hungry first is a question of fairness. Ultimately, the challenge is to make sure everyone gets a fair share of what we already grow."}],np={title:"Exam Part 2 practice: a student food project",situation:"The student union has money for one food project next term: a free breakfast table before morning classes, a cooking club that teaches cheap, healthy meals, or a shelf where students share food they don’t need. Aziza and Mateo are discussing the options. Put their lines in order. Then read the conversation in pairs and swap roles.",A:"aziza",B:"mateo",lines:[["A","The student union has money for one food project. Shall we start with the breakfast table?"],["B","Sure. A lot of students come to morning classes without breakfast, don’t they?"],["A","They do, although it would only help on the days people actually come early."],["B","Fair point. What about the cooking club?"],["A","I like it, because students would learn something they can use for years."],["B","True. And the sharing shelf? Nothing would go to waste."],["A","That’s a good idea, but someone would have to check the food every day."],["B","So shall we choose the cooking club, and use what’s left over for a small sharing shelf?"],["A","Agreed. That way, students learn to cook, and less food is thrown away."]],phrases:{Start:["The student union has money for one …","Shall we start with …?"],Clarify:["…, don’t they?","They do, although …"],"Give the turn":["What about …?","And …?"],"Agree and decide":["So shall we choose …?","Agreed. That way, …"]},own:{task:"Your turn in pairs: your university canteen can do **one** thing next year: sell smaller portions at a lower price, give unsold meals to a local food bank, or buy all its fruit and vegetables from farmers in the region. Discuss for 2 minutes and decide together.",seconds:120}},rp={cards:{A:["Frankly, no.","go to waste","To be fair, …","make ends meet","The real question is …","all of us","What’s more, …","It can be done.","surplus food"],B:["a balanced diet","surplus food","supply chain","go to waste","What’s more, …","Frankly, no.","To be fair, …","a fair share","The real question is …"]},info:"Listen to the speaker. Tap a phrase only when you hear it in a real sentence. Three in a row = Bingo! Points: 1 per phrase heard, +3 for a Bingo.",phrases:["Frankly, no.","go to waste","To be fair, …","make ends meet","The real question is …","all of us","What’s more, …","It can be done.","surplus food","a balanced diet","supply chain","a fair share"],questions:["Should shops be allowed to throw away food that is still good?","Why do some families find it hard to eat a balanced diet?","Should every school give pupils a free lunch? Why (not)?","How is food shared and saved in Uzbekistan? Is it different in another country you know?","Would you buy “ugly” fruit and vegetables if they were cheaper?","Who should do more to reduce food waste: shops, farmers or families?"]},sp=[{type:"stress",title:"Stress Spot: words about food and fairness",intro:"Tap the stressed syllable. Rule: before -tion and -ity, the syllable is strong (distriBUtion, seCUrity). AGriculture is strong at the start. Then listen and say the word.",follow:"Now use two of these words in one sentence about the Fair Plate Fair.",items:[{w:"distribution",syl:["dis","tri","bu","tion"],s:2},{w:"security",syl:["se","cu","ri","ty"],s:1},{w:"inequality",syl:["in","e","qual","i","ty"],s:2},{w:"nutrition",syl:["nu","tri","tion"],s:1},{w:"production",syl:["pro","duc","tion"],s:1},{w:"availability",syl:["a","vail","a","bil","i","ty"],s:3},{w:"affordable",syl:["af","ford","a","ble"],s:1},{w:"agriculture",syl:["ag","ri","cul","ture"],s:0}]},{type:"pairs",title:"Sound Pairs: /eə/ or /e/? (shared or shed?)",intro:"Press Play and choose the word you hear. /eə/ (shared, fared, spared, haired, bared) is long: open your mouth a little and hold the sound, as in air, share and fair. /e/ (shed, fed, sped, head, bed) is short and quick. If you make /eə/ too short, “We shared the bread” can sound like “We shed the bread”. Partner version: one student says a word, the partner points to it.",pairs:[["shared","shed"],["fared","fed"],["spared","sped"],["haired","head"],["bared","bed"]]}],op=["Use two C1 phrases in your next answer.","Ask the last speaker a follow-up question.","Give an example from Uzbekistan.","Give an example from another country.","Say who is left out, without blaming anyone.","Check that your listener is following: “Does that make sense so far?”"],lp={title:"Step Up Speaking Club Ideas Evening: Enough Food, Wrong Place",format:"Monologue · like exam Part 2 (multiple choice)",intro:"At the Club’s online Ideas Evening, Amara gives a short talk about a food project she would like to start in Lagos.",tip:["Know the question type","Before you listen, decide what each question is about: a fact, the speaker’s purpose (why she says something), her attitude (how she feels) or her main message. Then listen for exactly that."],A:"amara",B:"leo",lines:[["A","Good evening, everyone. Tonight I’m going to talk about tomatoes. Yes, tomatoes! [[0]], the biggest problem with food today isn’t always how much we grow. It’s who can **have access to** it, and when."],["A","My aunt sells vegetables at a market in Lagos, and every week she watches good tomatoes **go to waste**. [[1]] the farms are far from the city, the roads are slow, and there’s no **cold storage** anywhere along the **supply chain**. In the heat, a tomato doesn’t wait for anybody."],["A","[[2]] what happens at the end of a market day. The **surplus food** that nobody bought is thrown away, while a few streets from her stall, families are struggling to **make ends meet**. With **rising food prices**, **a balanced diet** becomes a luxury, and some children **go hungry** on school days."],["A","So the food is there, and the hunger is there, sometimes on the same street. [[3]] hunger is often a problem of getting food to people, not only of growing it. [[4]]"],["A","Here’s my idea: solar-powered cold boxes for market sellers. Sellers keep their tomatoes and peppers fresh for longer, and at closing time, whatever they haven’t sold goes to a small **food bank** run by students, instead of the rubbish heap."],["A","Will it end hunger? Of course not. It won’t fix low wages or high prices on its own. But it would mean less waste for the sellers and fresher food for the families who need it."],["A","For me, **food security** isn’t about charity. It’s about every family getting a **fair share** of the food we already grow. Thank you."]],gaps:[[1,"The way I see it"],[2,"This is mainly because"],[3,"A case in point is"],[4,"What I mean is that"],[5,"Does that make sense so far?"]],questions:[{q:"Why do many tomatoes at Amara’s aunt’s stall spoil?",o:["Customers in Lagos prefer other vegetables.","They stay too long in the heat on the way from the farms.","The farmers pick them before they are ready."],a:1,why:"“The farms are far from the city, the roads are slow, and there’s no cold storage … In the heat, a tomato doesn’t wait for anybody.”"},{q:"Why does Amara describe the end of a market day?",o:["to show that food is thrown away close to people who need it","to complain about how her aunt runs her stall","to explain why food prices are rising"],a:0,why:"“The surplus food that nobody bought is thrown away, while a few streets from her stall, families are struggling to make ends meet.”"},{q:"How does Amara feel about what her cold boxes can achieve?",o:["She is sure they will end hunger in her city.","She is realistic: they will help, but they won’t solve everything.","She doubts that they are worth the money."],a:1,why:"“Will it end hunger? Of course not. … But it would mean less waste for the sellers and fresher food for the families who need it.”"},{q:"Which sentence is closest to Amara’s main message?",o:["Farmers need to grow much more food.","Hunger is less about growing enough food than about getting it fairly to people.","Market sellers should give all their food away for free."],a:1,why:"“Hunger is often a problem of getting food to people, not only of growing it” and “every family getting a fair share of the food we already grow”."}],notice:{q:"Look at phrases 1–5. Which one gives an opinion, a reason or an example? Which two does Amara use to explain her idea again and to check that the audience is following?",groups:[["Opinion",[1]],["Reason",[2]],["Example",[3]],["Clarifying and checking",[4,5]]]},use:{q:"What could your town or city do to waste less food and get it to the people who need it?",by:"nur",model:"The way I see it, the best place to start is school and university canteens. This is mainly because they cook for hundreds of people every day, so even a small change saves a lot of food. A case in point is my old school in Kuala Lumpur: on Fridays, the canteen cooked to order, and the meals that were left over went to a shelter nearby. What I mean is that we don’t need a big new system, just better habits. So, all in all, cities should start where food is cooked in large amounts.",ticks:["an opinion","a reason","an example","a short conclusion"],seconds:60}},ip=Object.freeze(Object.defineProperty({__proto__:null,BINGO:rp,CARDS:_f,DEMOS:Vf,DIALOGUE:np,DRILLS:Jf,LESSON:Uf,LEVELS:tp,LISTEN:lp,MAIN:Kf,PRON:sp,QUESTIONS:ep,ROUNDS:Gf,TWISTS:$f,UNIT:Qf,WILDCARDS:op},Symbol.toStringTag,{value:"Module"})),ap={openverse:"4b8fad39-2b1a-4909-8a77-9589bc763fce",title:"Local summer fruit market",creator:"Jakub Kapusnak",source:"rawpixel",url:"https://images.rawpixel.com/editor_1024/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvYTAxOS1qYWt1YmstMDg5My1sb2NhbC1zdW1tZXItZnJ1aXQtbWFya2V0MS5qcGc.jpg",page:"https://www.rawpixel.com/image/448400/free-photo-image-fruit-farmers-market-summer",license:"CC0",wid
